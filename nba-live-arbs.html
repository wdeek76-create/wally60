<!DOCTYPE html>
<html lang="en"><head>

<title>NBA Live Arbs</title>
<style>
:root{--bg:#0a0d10;--bg2:#11161b;--bg3:#171d23;--line:#1c242c;--line2:#26303a;--text:#e8edf2;--dim:#8a96a3;--green:#22c55e;--red:#f87171;--blue:#60a5fa;--amber:#f5a524}
*{box-sizing:border-box;touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.35 -apple-system,BlinkMacSystemFont,'Inter',system-ui,sans-serif;padding-bottom:40px}
header{position:sticky;top:0;z-index:5;background:rgba(10,13,16,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;display:flex;align-items:center;gap:10px}
.brand{font-weight:900;font-size:17px;line-height:1.05}.brand span{color:var(--green)}

.tabs{display:flex;gap:6px;margin-left:auto}
.tab{border:1px solid var(--line2);background:var(--bg2);color:var(--text);border-radius:999px;padding:7px 12px;font-weight:800;font-size:12.5px}

.ib{width:34px;height:34px;border-radius:50%;border:1px solid var(--line2);background:var(--bg2);color:var(--text);font-size:15px}

<script>
// NBA Live Arbs -- live NBA player props only. FanDuel's price against:
//   Kalshi          the other side's live order book at 0.0% hold or better (arb / direct match), with money
//   DK + Caesars    both books' other side make a 0.0%-or-better match with FD
//   DK + Fliff      same, those two
//   Fliff + Caesars same, those two
// Only real arbs and direct matches (0.0%) -- no EV. Every hit is tracked by its signal so the
// record shows which ones actually win. Odds come from the same OpticOdds backend as Sharp Money.
const LS = { get:(k,d)=>{ try{ const v=localStorage.getItem(k); return v==null?d:v; }catch(e){ return d; } }, set:(k,v)=>{ try{ localStorage.setItem(k,v); }catch(e){} } };
const BACKEND_DEFAULT = 'https://nfl-props-tracker-1.vercel.app/api/odds';
const getBackend = () => LS.get('oo_backend_url', BACKEND_DEFAULT);
const OO_TIMEOUT_MS = 20000;
async function oo(endpoint, params, opts){
  const payload={ endpoint, params:params||{} }; if(opts?.method) payload.method=opts.method; if(opts?.body) payload.body=opts.body;
  const once = async () => {
    const ctl = new AbortController(); const t = setTimeout(()=>ctl.abort(), OO_TIMEOUT_MS);
    try{
      const r = await fetch(getBackend(), { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload), signal:ctl.signal });
      const text = await r.text();
      if(!r.ok){ let m=text; try{ const j=JSON.parse(text); m=j.error+(j.body?' — '+j.body:''); }catch(e){} const err=new Error(`backend ${r.status}: ${m}`); err.status=r.status; throw err; }
      return JSON.parse(text);
    } catch(e){ if(e.name==='AbortError') { const err=new Error(`timed out after ${OO_TIMEOUT_MS/1000}s`); err.retry=true; throw err; } if(e.status==null) e.retry=true; else if(e.status>=500||e.status===429) e.retry=true; throw e; }
    finally{ clearTimeout(t); }
  };
  try{ return await once(); }
  catch(e){ if(!e.retry) throw e; await new Promise(r=>setTimeout(r,600)); return once(); }
}
const BOOKS = ['Props Builder','FanDuel','Novig','Prophet X','Kalshi','Pinnacle','bet105','DraftKings','Fliff','BetOnline'];
const EXCH = new Set(['novig','prophet x','kalshi']);
const SHORT = { 'props builder':'PB','fanduel':'FD','novig':'Novig','prophet x':'PX','kalshi':'Kalshi','pinnacle':'Pin','bet105':'b105','draftkings':'DK','fliff':'Fliff','betonline':'BOL','caesars':'Caes','hard rock bet':'HR','betmgm':'MGM','kambi':'Kambi','betrivers':'BR','bookmaker':'BKM','circa':'Circa' };
const canonBook = n => { const k=String(n||'').toLowerCase(); if(k==='courtside'||k==='onyx odds') return 'draftkings'; if(k==='hard rock'||k==='hardrock') return 'hard rock bet'; if(k==='prophetx'||k==='prophet exchange') return 'prophet x'; return k; };
const bookLabel = n => { const k=canonBook(n); return BOOKS.find(b=>b.toLowerCase()===k) || n; };

const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtAm = v => { const n=Number(v); return isNaN(n)?String(v):(n>0?'+'+n:String(n)); };
const toDec = a => { a=Number(a); return a>0?1+a/100:1+100/Math.abs(a); };
const toAm = d => (d-1)>=1 ? Math.round((d-1)*100) : -Math.round(100/(d-1));

async function runPool(jobs, n){ let i=0; await Promise.all(Array.from({length:Math.min(n,jobs.length)},async()=>{ while(i<jobs.length){ const j=jobs[i++]; await j(); } })); }

const LIQ_BAND_CENTS = 20;
const BUILD = 'Oct 24 · v1';
const SHARP_MAX_ARB = 8; // % -- a bigger "arb" is stale / bad data
function levelsOf(o){
  const top=Number(o.price);
  const ob=(Array.isArray(o.order_book)?o.order_book:[]).filter(l=>Array.isArray(l)&&l.length>=2);
  const normP=v=>{ v=Number(v); if(isNaN(v)) return NaN; return (v>1&&v<50)?toAm(v):v; };
  const out=[];
  if(ob.length){
    // Which column is price vs size is decided from the WHOLE array's total distance from the
    // row's own quoted top price, not just level 0 — using only the first level flip-flopped
    // whenever the API didn't return that array in the same order poll to poll, swinging the
    // parsed liquidity/avg price (and firing a false flash) even though nothing real had changed.
    let distA=0, distB=0;
    ob.forEach(l=>{ const a=normP(l[0]), b=normP(l[1]); if(!isNaN(a)) distA+=Math.abs(a-top); if(!isNaN(b)) distB+=Math.abs(b-top); });
    // Strongest signal first: the column that actually contains the row's own quoted price is the
    // price column (a size column can sit numerically closer to the quote and fool the distance test).
    const hasTop = i => ob.some(l=>Math.abs(normP(l[i])-top)<=1);
    const pf = hasTop(0)!==hasTop(1) ? hasTop(0) : distA<=distB;
    if(!window._obLogged){ window._obLogged=true; console.log('[OpticOdds] order_book sample', o.sportsbook, top, JSON.stringify(o.order_book).slice(0,240), '→ priceFirst', pf); }
    // A parsed level has to actually BE a legal American odds price (magnitude >= 100) --
    // anything else (an unconverted percentage, a raw value the decimal-odds heuristic's narrow
    // 1-50 window didn't catch, whatever) is garbage, not a real price, and showing it verbatim
    // (e.g. "+83.43", which isn't a price any book could ever quote) is worse than dropping it.
    ob.forEach(l=>{ const price=pf?normP(l[0]):normP(l[1]); const size=pf?Number(l[1]):Number(l[0]); if(!isNaN(price)&&Math.abs(price)>=100&&!isNaN(size)&&size>0) out.push({price:Math.round(price),size}); });
    // A level can't beat the book's own best quote -- anything that does is a misread (columns
    // swapped, stale data), so drop it rather than call it an arb.
    if(Math.abs(top)>=100) return out.filter(l=>toDec(l.price)<=toDec(top)*1.02+0.01).sort((a,b)=>b.price-a.price);
  } else if(o.limits?.max) out.push({price:top,size:Number(o.limits.max)});
  return out.sort((a,b)=>b.price-a.price);
}
let bookLogos = {};                             // lowercase book name -> logo url (from /sportsbooks)
let sawDeepLinks = false;
async function loadBookLogos(){
  try{ const c=JSON.parse(LS.get('oo_book_logos','null')); if(c && Date.now()-c.at<86400e3){ bookLogos=c.map; return; } }catch(e){}

  catch(e){ console.warn('[props] sportsbook logos failed',e.message); }

function statFor(r, mkey, sportKey, marketNames){
  const periods=Array.isArray(r.stats)?r.stats:[]; const all=(periods.find(x=>x.period==='all')||periods[0]||{}).stats||{};

const riskToWin = (price, winAmt) => { price=Number(price); return price>0 ? winAmt*100/price : winAmt*Math.abs(price)/100; };
function ttRecord(list){
  const w=list.filter(t=>t.result==='win').length, l=list.filter(t=>t.result==='loss').length, p=list.filter(t=>t.result==='push').length;
  let u=0, staked=0;
  list.forEach(t=>{
    const win=t.stakeUnits||1, risk=riskToWin(t.price, win);
    if(t.result==='win'){ u+=win; staked+=risk; }
    else if(t.result==='loss'){ u-=risk; staked+=risk; }
    // a push still had money resting on it even though the stake comes back, so its risk still
    // belongs in ROI's base -- just no change to units won/lost.
    else if(t.result==='push'){ staked+=risk; }
  });
  const roi=staked>0 ? (u/staked*100) : null;
  return { w,l,p,u,n:list.length,roi };
}
function gradeOne(t){
  if(t.actual==null) return null; const a=Number(t.actual); if(isNaN(a)) return null;
  if(t.side==='Yes') return a>0?'win':'loss';
  if(t.side==='No') return a>0?'loss':'win';
  const L=Number(t.line); if(isNaN(L)) return null;
  if(t.side==='over') return a>L?'win':a===L?'push':'loss';
  if(t.side==='under') return a<L?'win':a===L?'push':'loss';
  return null;
}

async function discordPost(payload, onErr, hook=liveHook){
  if(!hook){ onErr?.('no webhook'); return false; }
  const send = async body => { const r=await fetch(hook,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); return r.ok ? '' : `${r.status} ${(await r.text().catch(()=>'')).slice(0,160)}`; };
  try{
    const clean=discordClean(payload);
    let err=await send(clean); if(!err) return true;
    console.warn('[live] discord rejected post:', err, clean);
    for(let i=0; i<3 && err.startsWith('429'); i++){ const ra=Number((err.match(/"retry_after":\s*([\d.]+)/)||[])[1]); await new Promise(r=>setTimeout(r,(ra>0?ra*1000:2000)+250)); err=await send(clean); if(!err) return true; }
    const bare={...clean, avatar_url:undefined, embeds:(clean.embeds||[]).map(em=>({...em, url:undefined, thumbnail:undefined}))};
    err=await send(bare); if(!err) return true;
    console.warn('[live] discord rejected bare post too:', err);
    onErr?.(err.slice(0,120)); toast('Discord post failed: '+err.slice(0,70)); return false;
  }catch(e){ console.warn('[live] discord post failed', e.message); onErr?.(e.message); toast('Discord post failed: '+e.message); return false; }
}

    .map(f=>({ id:f.id, start:f.start_date, live:!!f.is_live, status:f.status,
      home:{ name:f.home_competitors?.[0]?.name||'', ab:f.home_competitors?.[0]?.abbreviation||'', logo:f.home_competitors?.[0]?.logo||'' },
      away:{ name:f.away_competitors?.[0]?.name||'', ab:f.away_competitors?.[0]?.abbreviation||'', logo:f.away_competitors?.[0]?.logo||'' } }));
}
let fxAt=0;
async function scan(){
  if(busy) return; busy=true;
  try{
    if(Date.now()-fxAt>60e3 || !fixtures.length){ await loadFixtures(); fxAt=Date.now(); }
    if(!fixtures.length){ plays=[]; lastScan=Date.now(); scanErr=''; render(); return; }
    const rows=[]; const jobs=[];
    chunk(fixtures,5).forEach(fc=>[['FanDuel','DraftKings','Caesars','Fliff'],['Kalshi']].forEach(bk=>jobs.push(async()=>{
      const p={fixture_id:fc.map(f=>f.id), sportsbook:bk}; if(bk[0]!=='Kalshi') p.is_main=true;
      try{ const r=await oo('/fixtures/odds',p); (r?.data||[]).forEach(d=>(d.odds||[]).forEach(o=>{ o._fx=d.id; rows.push(o); })); }catch(e){ scanErr=e.message; }
    })));
    await runPool(jobs,4);
    plays=findPlays(rows); lastScan=Date.now(); scanErr='';
    alertNew();
  }catch(e){ scanErr=e.message; }
  finally{ busy=false; if(viewMode==='live') render(); }
}
// FD's price on one side vs the other side elsewhere
function findPlays(rows){
  const G={};
  rows.forEach(o=>{
    if(o.price==null || Math.abs(Number(o.price))>=10000) return;
    const mk=marketKeyFor(o.market); if(!mk) return;
    const sd=sideOf(o); if(sd!=='over' && sd!=='under') return;
    const who=normName(cleanSel(o.selection||o.player?.name||'').replace(/\s+(over|under|yes|no)\b.*$/i,'')); if(!who) return;
    const line=o.points==null?null:Number(o.points);
    const k=`${o._fx}|${mk}|${who}|${line}`;
    (G[k]=G[k]||{ fx:o._fx, mk, who, line, name:cleanSel(o.selection||o.player?.name||''), market:o.market, rows:[] }).rows.push({...o, _sd:sd});
  });
  const out=[];
  Object.values(G).forEach(g=>{
    ['over','under'].forEach(side=>{
      const opp=side==='over'?'under':'over';
      const fd=g.rows.filter(o=>o._sd===side && canonBook(o.sportsbook)==='fanduel').sort((a,b)=>toDec(b.price)-toDec(a.price))[0];
      if(!fd) return; const fp=Number(fd.price); if(fp<-400 || fp>400) return;
      const holdVs = p => (toImplied(fp)+toImplied(Number(p))-1)*100;
      const sigs=[];
      // Kalshi: the other side's order book, levels at 0.0% or better
      let kal=null;
      g.rows.filter(o=>o._sd===opp && canonBook(o.sportsbook)==='kalshi').forEach(o=>levelsOf(o).forEach(l=>{
        const h=holdVs(l.price); if(h>1e-7 || h<-SHARP_MAX_ARB) return;
        kal=kal||{ size:0, best:l.price, worst:l.price }; kal.size+=l.size; if(l.price>kal.best) kal.best=l.price; if(l.price<kal.worst) kal.worst=l.price; }));
      if(kal && kal.size>=kalMin) sigs.push({ kind:'Kalshi', books:['kalshi'], prices:[kal.best], hold:holdVs(kal.best), size:kal.size });
      // sportsbook pairs: both books' other side match FD at 0.0% or better
      const bestOpp = b => g.rows.filter(o=>o._sd===opp && canonBook(o.sportsbook)===b).sort((x,y)=>toDec(y.price)-toDec(x.price))[0];
      PAIRS.forEach(([a,b])=>{ const oa=bestOpp(a), ob=bestOpp(b); if(!oa||!ob) return;
        const ha=holdVs(oa.price), hb=holdVs(ob.price);
        if(ha<=1e-7 && hb<=1e-7 && ha>=-SHARP_MAX_ARB && hb>=-SHARP_MAX_ARB) sigs.push({ kind:`${PAIR_LBL[a]}+${PAIR_LBL[b]}`, books:[a,b], prices:[Number(oa.price),Number(ob.price)], hold:Math.max(ha,hb), links:[deepLinkFor(oa),deepLinkFor(ob)] }); });
      if(!sigs.length) return;
      out.push({ key:`${g.fx}|${g.mk}|${g.who}|${g.line}|${side}`, fx:fixtures.find(f=>f.id===g.fx), fid:g.fx, mk:g.mk, who:g.who, name:g.name, line:g.line, side, market:g.market, fd, sigs,
        best:Math.min(...sigs.map(s=>s.hold)) });
    });
  });
  // one side per prop (over first if both somehow hit)
  const seen=new Set();
  return out.sort((a,b)=>a.best-b.best).filter(p=>{ const k=`${p.fid}|${p.mk}|${p.who}|${p.line}`; if(seen.has(k)) return false; seen.add(k); return true; });
}
const holdLbl = h => h<-0.05 ? `${(-h).toFixed(1)}% arb` : 'direct (0%)';
const sideLbl = s => s==='over'?'Over':'Under';
// ── alerts: Discord + tracker, once per prop + signal per day ──
let fresh=new Set();
function alertNew(){
  plays.forEach(p=>{
    const newSigs=p.sigs.filter(s=>!sent.keys.includes(p.key+'|'+s.kind));
    if(!newSigs.length) return;
    newSigs.forEach(s=>markSent(p.key+'|'+s.kind));
    fresh.add(p.key);
    track(p, newSigs);
    if(liveHook) postDiscord(p, newSigs);
  });
}
function track(p, sigs){
  sigs.forEach(s=>{
    if(tracked.some(t=>t.key===p.key && t.kind===s.kind)) return;
    tracked.unshift({ id:Date.now()+Math.random().toString(36).slice(2,6), key:p.key, kind:s.kind, direct:!(s.hold<-0.05), hold:s.hold, size:s.size||null, vs:s.prices,
      fixtureId:p.fid, away:p.fx?.away.ab||'', home:p.fx?.home.ab||'', playerKey:p.who, playerName:p.name, mkey:p.mk, marketLabel:marketLabel(p.mk), marketNames:[p.market],
      side:p.side, line:p.line, price:Number(p.fd.price), trackedAt:Date.now(), actual:null, result:null, final:false });
  });
  saveTracked();
}
function postDiscord(p, sigs){
  const title=`${fmtAm(p.fd.price)} ${titleCase(p.name)} ${sideLbl(p.side)}${p.line!=null?' '+p.line:''} ${marketLabel(p.mk)}`;
  const lines=sigs.map(s=> s.kind==='Kalshi' ? `**Kalshi** ${fmtAm(s.prices[0])} ${sideLbl(p.side==='over'?'under':'over')} - ${usd(s.size)} - ${holdLbl(s.hold)}`
    : `**${s.kind}** ${s.books.map((b,i)=>`${PAIR_LBL[b]} ${fmtAm(s.prices[i])}`).join(' / ')} - ${holdLbl(s.hold)}`);
  const f=p.fx;
  const body={ username:'FanDuel', avatar_url:httpsLogo('fanduel'), ...roleTag(), embeds:[{ title, url:discordUrl(deepLinkFor(p.fd))||undefined, color:sigs.some(s=>s.hold<-0.05)?0x22c55e:0xeab308,
    description:`${f?`${f.away.ab} @ ${f.home.ab} **LIVE**\n`:''}**FD ${fmtAm(p.fd.price)}** vs:\n${lines.join('\n')}\nSent <t:${Math.floor(Date.now()/1000)}:R>`, footer:{ text:'NBA LIVE' } }] };
  body.content=[`${title.replace(/^(\S+) (.*)$/,'$2 $1')}`, body.content].filter(Boolean).join(' ');
  discordPost(body);
}
const httpsLogo = k => k==='fanduel' ? 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRH3NobGIn_Yoc0wsD3j73VvYQ1zSEm3GZ1mhXHUJW1Ag&s=10' : undefined;
// ── grading ──
let tkBusy=false;
async function refreshTracked(){
  if(tkBusy) return; const open=tracked.filter(t=>!t.final && t.fixtureId); if(!open.length) return; tkBusy=true;
  try{
    const fids=[...new Set(open.map(t=>t.fixtureId))], res={}, pr={};
    for(const ids of chunk(fids,5)){ try{ const r=await oo('/fixtures/results',{fixture_id:ids}); (r?.data||[]).forEach(x=>{ if(x?.fixture?.id) res[x.fixture.id]=x; }); }catch(e){} }
    for(const ids of chunk(fids,5)){ try{ const r=await oo('/fixtures/player-results',{fixture_id:ids}); (r?.data||[]).forEach(x=>{ if(x?.fixture?.id) pr[x.fixture.id]=x; }); }catch(e){} }
    let ch=false;
    open.forEach(t=>{
      const R=res[t.fixtureId]; if(!R) return; const st=String(R.fixture?.status||''); t.live=/live|half|progress|quarter/i.test(st);
      t.score=R.scores?`${R.scores.away?.total??''}-${R.scores.home?.total??''}`:'';
      const row=(pr[t.fixtureId]?.results||[]).find(x=>normName(cleanSel(x.player?.name||''))===t.playerKey);
      if(row){ const v=statFor(row, t.mkey, 'nba', t.marketNames); if(v!=null && !isNaN(v) && t.actual!==v){ t.actual=v; ch=true; } }
      if(/completed|final|closed/i.test(st)){ const g=gradeOne(t); if(g){ t.result=g; t.final=true; ch=true; } }
    });
    if(ch) saveTracked();
  } finally { tkBusy=false; if(viewMode==='track') render(); }
}
// ── views ──
function render(){ if(viewMode==='live') renderLive(); else renderTrack(); $('#nLive').textContent=plays.length||''; }
function renderLive(){
  const v=$('#view');
  const ago=lastScan?Math.round((Date.now()-lastScan)/1000)+'s ago':'starting…';
  const head=`<div class="stat"><span><b>${fixtures.length}</b> ${showPre?'games (incl. pregame)':'live games'} · <b>${plays.length}</b> plays · scanned ${ago}</span>${scanErr?`<span class="neg">${esc(scanErr.slice(0,80))}</span>`:''}</div>
    <div class="ctl"><label>Kalshi min</label><div class="seg">${[0,100,250,500,1000].map(x=>`<button class="${kalMin===x?'on':''}" data-kmin="${x}">${x?usd(x):'Any'}</button>`).join('')}</div>
    <label style="margin-left:6px">Games</label><div class="seg"><button class="${!showPre?'on':''}" data-pre="0">Live</button><button class="${showPre?'on':''}" data-pre="1">+ Pregame</button></div></div>`;
  const body = !fixtures.length ? `<div class="empty">No NBA games live right now.${showPre?'':' Turn on "+ Pregame" to test it on upcoming games.'}</div>`
    : !plays.length ? '<div class="empty">Watching… nothing at 0.0% or better right now.</div>'
    : plays.map(p=>{ const f=p.fx, fl=bookLogo('fanduel'), url=deepLinkFor(p.fd)||BOOK_HOME.fanduel;
      return `<div class="card${fresh.has(p.key)?' new':''}"><div class="ch"><div><div class="nm">${esc(titleCase(p.name))} <span class="bet">${sideLbl(p.side)}${p.line!=null?' '+p.line:''} ${esc(marketLabel(p.mk))}</span></div>
        <div class="meta">${f?`${esc(f.away.ab)} @ ${esc(f.home.ab)} · ${f.live?'LIVE':etTime(f.start)}`:''}</div></div>
        <a class="price" href="${esc(url)}" target="_blank" rel="noopener">${fl?`<img src="${esc(fl)}" alt="">`:'FD'}${fmtAm(p.fd.price)}</a></div>
        <div class="sigs">${p.sigs.map(s=>`<div class="sig"><span class="k${s.kind==='Kalshi'?' kal':''}">${esc(s.kind)}</span><span class="v">${s.books.map((b,i)=>{ const lg=bookLogo(b); return `${lg?`<img src="${esc(lg)}" alt="">`:''}${esc(PAIR_LBL[b])} ${fmtAm(s.prices[i])}`; }).join(' · ')}${s.size?` · ${usd(s.size)}`:''}<span class="tag${s.hold<-0.05?' arb':''}">${holdLbl(s.hold)}</span></span></div>`).join('')}</div></div>`; }).join('');
  v.innerHTML=head+body;
  v.querySelectorAll('[data-kmin]').forEach(b=>b.onclick=()=>{ kalMin=Number(b.dataset.kmin); LS.set('nbal_kalmin',String(kalMin)); render(); scan(); });
  v.querySelectorAll('[data-pre]').forEach(b=>b.onclick=()=>{ showPre=b.dataset.pre==='1'; LS.set('nbal_pre',showPre?'1':''); fxAt=0; render(); scan(); });
}
function recRow(label, list){ const r=ttRecord(list.filter(t=>t.final)); return `<div class="row"><span>${esc(label)} <span style="color:var(--dim)">(${r.n})</span></span><span>${r.w}-${r.l}-${r.p}</span><span class="${r.u>0?'pos':r.u<0?'neg':''}">${r.u>=0?'+':''}${r.u.toFixed(2)}u</span><span style="color:var(--dim)">${r.roi!=null?r.roi.toFixed(1)+'%':'—'}</span></div>`; }
let histShown=false;
function renderTrack(){
  const v=$('#view');
  const done=tracked.filter(t=>t.final), open=tracked.filter(t=>!t.final);
  const kinds=['Kalshi',...PAIRS.map(([a,b])=>`${PAIR_LBL[a]}+${PAIR_LBL[b]}`)];
  const sum=`<div class="sum"><div class="sumh">Record by signal</div>${recRow('All signals',tracked)}${kinds.map(k=>recRow(k, tracked.filter(t=>t.kind===k))).join('')}
    <div class="sumh" style="margin-top:10px">Arb vs direct</div>${recRow('Arb (above 0%)', tracked.filter(t=>!t.direct))}${recRow('Direct (0%)', tracked.filter(t=>t.direct))}
    <div class="sumh" style="margin-top:10px">By side</div>${recRow('Overs', tracked.filter(t=>t.side==='over'))}${recRow('Unders', tracked.filter(t=>t.side==='under'))}
    <div class="sumh" style="margin-top:10px">By prop</div>${[...new Set(tracked.map(t=>t.marketLabel))].map(m=>recRow(m, tracked.filter(t=>t.marketLabel===m))).join('')}</div>`;
  const card=t=>`<div class="tk">${t.result?`<span class="r ${t.result}">${t.result.toUpperCase()}</span>`:t.live?'<span class="r live">LIVE</span>':''}
    <div class="nm" style="font-size:14px">${esc(titleCase(t.playerName))} <span class="bet">${sideLbl(t.side)}${t.line!=null?' '+t.line:''} ${esc(t.marketLabel)}</span></div>
    <div class="meta">FD ${fmtAm(t.price)} · <b>${esc(t.kind)}</b> ${t.direct?'direct':(-t.hold).toFixed(1)+'% arb'}${t.size?' · '+usd(t.size):''} · ${esc(t.away)} @ ${esc(t.home)}${t.score?' · '+esc(t.score):''}${t.actual!=null?` · <b>${t.actual}</b>${t.line!=null?' / '+t.line:''}`:''}</div>
    <div class="tka">${t.final?`<button data-g="${t.id}|">Reopen</button>`:`<button data-g="${t.id}|win">W</button><button data-g="${t.id}|loss">L</button><button data-g="${t.id}|push">P</button>`}<button data-rm="${t.id}">Remove</button></div></div>`;
  v.innerHTML=sum+(open.length?open.map(card).join(''):'<div class="empty">No open plays.</div>')
    +(done.length?`<button class="btn g" style="width:100%;margin-top:6px" id="hist">History (${done.length}) ${histShown?'▴':'▾'}</button>${histShown?done.map(card).join(''):''}`:'');
  $('#hist')?.addEventListener('click',()=>{ histShown=!histShown; render(); });
  v.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{ const [id,r]=b.dataset.g.split('|'); const t=tracked.find(x=>x.id===id); if(!t) return; if(r){ t.result=r; t.final=true; t.manual=true; } else { t.result=null; t.final=false; } saveTracked(); render(); });
  v.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{ if(!confirm('Remove this play?')) return; tracked=tracked.filter(x=>x.id!==b.dataset.rm); saveTracked(); render(); });
}
function openSettings(){
  const el=document.createElement('div'); el.className='sheet';
  el.innerHTML=`<div><div class="sumh">Discord</div>
    <label>Webhook URL</label><input id="sHook" value="${esc(liveHook)}" placeholder="https://discord.com/api/webhooks/…" autocomplete="off">
    <label>Role ID to tag (optional)</label><input id="sRole" value="${esc(liveRole)}" inputmode="numeric" autocomplete="off">
    <div style="display:flex;gap:8px;margin-top:14px"><button class="btn" id="sSave">Save</button><button class="btn g" id="sTest">Send test</button><button class="btn g" id="sX" style="margin-left:auto">Close</button></div></div>`;
  document.body.appendChild(el);
  const save=()=>{ liveHook=el.querySelector('#sHook').value.trim(); liveRole=(el.querySelector('#sRole').value.match(/\d{15,}/)||[''])[0]; LS.set('nbal_hook',liveHook); LS.set('nbal_role',liveRole); };
  el.querySelector('#sSave').onclick=()=>{ save(); toast('Saved'); el.remove(); };
  el.querySelector('#sTest').onclick=async()=>{ save(); const ok=await discordPost({ username:'FanDuel', ...roleTag(), content:[ '✅ NBA Live Arbs connected', roleTag().content ].filter(Boolean).join(' ') }); toast(ok?'Test sent':'Test failed'); };
  el.querySelector('#sX').onclick=()=>el.remove();
  el.addEventListener('click',e=>{ if(e.target===el) el.remove(); });
}
$('#tLive').onclick=()=>{ viewMode='live'; $('#tLive').classList.add('on'); $('#tTrack').classList.remove('on'); render(); };
$('#tTrack').onclick=()=>{ viewMode='track'; $('#tTrack').classList.add('on'); $('#tLive').classList.remove('on'); render(); refreshTracked(); };
$('#gear').onclick=openSettings;
$('#build').textContent='FD vs Kalshi · DK/CZR/Fliff pairs · '+BUILD;
saveTracked(); loadBookLogos().then(render); scan();
setInterval(()=>{ if(!document.hidden) scan(); }, SCAN_MS);
setInterval(()=>{ if(viewMode==='live') renderLive(); }, 1000*10);
setInterval(()=>{ if(!document.hidden) refreshTracked(); }, 90e3);
</script></body></html>
