      if (m.includes('h2h')) return 'moneyline';
      return m;
    };
    const canonicalBook = (name) => {
      const n = (name || '').toLowerCase().replace(/[^a-z]/g, '');
      const aliases = {
        'fanduel': 'fanduel', 'fd': 'fanduel',
        'pinnacle': 'pinnacle', 'pinny': 'pinnacle'
      };
      return aliases[n] || n;
    };

      const clearSearch = (e) => {

      const fillBetForm = (player, oddValue, book, eventId, sur) => {

      };

      const fetchingRef = useRef(false);
      const lastDataRef = useRef('');
      const bootRetryRef = useRef(0);
      
      const fetchOdds = async (silent = false) => {
        const trimmedKey = apiKey.trim();
        if (!trimmedKey) { if (!silent) setError('Enter your ParalayAPI key first'); return; }
        if (fetchingRef.current) return;
        if (silent && modalOpen) return;
        fetchingRef.current = true;
        if (!silent) setLoading(true);
        setError('');
        try {
          const sleep = (ms) => new Promise(r => setTimeout(r, ms));
          const fetchPage = async (url) => {
            let lastErr;
            for (let attempt = 0; attempt < 3; attempt++) {
              try {
                // URL already has apiKey from caller, don't re-add it
                console.log(`[fetch] attempt ${attempt + 1}: ${url.slice(0, 80)}...`);
                const response = await fetch(url);
                console.log(`[fetch] status ${response.status}`);
                if (response.status === 429) { await sleep(1200); lastErr = new Error('Rate limited'); continue; }
                if (!response.ok && response.status >= 500) { await sleep(500 * (attempt + 1)); lastErr = new Error(`HTTP ${response.status}`); continue; }
                if (!response.ok) {
                  const text = await response.text().catch(() => '(no body)');
                  throw new Error(`HTTP ${response.status}: ${text.slice(0, 100)}`);
                }
                const data = await response.json();
                console.log(`[fetch] success, got response`);
                return data;
              } catch (err) {
                console.log(`[fetch] error:`, err.message);
                lastErr = err;
                await sleep(500 * (attempt + 1));
              }
            }
            throw lastErr;
          };

          const fetchTennisSport = async (sportKey) => {
            const url = new URL(`https://parlay-api.com/v1/sports/${sportKey}/odds`);
            url.searchParams.set('regions', 'us');
            url.searchParams.set('markets', 'h2h,spreads');
            // Don't filter by bookmakers - get all books
            console.log(`[${sportKey}] fetching all books...`);
            setDebugInfo(`fetching ${sportKey}...`);
            let data = await fetchPage(url.toString());
            
            if (!data || !data.events) {
              throw new Error(`${sportKey}: no events in response`);
            }
            if (!Array.isArray(data.events)) throw new Error(`${sportKey}: events not an array`);
            
            // Log what books are actually in the response
            const booksInResponse = Array.from(new Set(data.events.flatMap(e => e.bookmakers?.map(b => b.key) || [])));
            console.log(`[${sportKey}] got ${data.events.length} events from ${booksInResponse.length} books: ${booksInResponse.join(',')}`);
            return data.events;
          };

          let allEvents = [];
          const tennisSportKeys = ['tennis_atp', 'tennis_wta', 'tennis_atp_challenger', 'tennis_itf'];
          
          try {
            console.log('[tennis] fetching with rollup keys (EU region for Pinnacle)...');
            setDebugInfo('Fetching tennis odds with rollup keys...');
            
            // Query each tennis rollup key
            for (const sportKey of tennisSportKeys) {
              try {
                const oddUrl = new URL(`https://parlay-api.com/v1/sports/${sportKey}/odds`);
                oddUrl.searchParams.set('regions', 'eu,us');  // EU for Pinnacle, US for FanDuel, novig
                oddUrl.searchParams.set('markets', 'h2h');  // Only moneyline
                oddUrl.searchParams.set('bookmakers', BOOKMAKERS.join(','));  // Request specific books
                oddUrl.searchParams.set('apiKey', trimmedKey);
                console.log(`[${sportKey}] fetching odds...`);
                const data = await fetchPage(oddUrl.toString());
                console.log(`[${sportKey}] raw response:`, data);
                // ParalayAPI returns events array directly, not wrapped in .events
                if (Array.isArray(data) && data.length > 0) {
                  console.log(`[${sportKey}] got ${data.length} events`);
                  console.log(`[${sportKey}] books in response:`, Array.from(new Set(data.flatMap(e => e.bookmakers?.map(b => b.key) || []))).join(','));
                  allEvents = allEvents.concat(data);
                } else {
                  console.log(`[${sportKey}] no events found`);
                }
              } catch (err) {
                console.log(`[${sportKey}] failed: ${err.message}`);
              }
            }
          } catch (err) {
            console.log('[tennis] failed:', err.message);
          }
          
          if (!allEvents.length) throw new Error('No tennis odds found');

          // Flatten ParalayAPI response → odds-like shape for processing
          let allOdds = [];
          
          // Convert decimal odds to American
          const decimalToAmerican = (decimal) => {
            if (!decimal || decimal <= 1) return 0;
            if (decimal >= 2) {
              return Math.round((decimal - 1) * 100);
            } else {
              return Math.round(-100 / (decimal - 1));
            }
          };
          
          allEvents.forEach(event => {
            if (event.bookmakers && Array.isArray(event.bookmakers)) {
              event.bookmakers.forEach(book => {
                if (book.markets && Array.isArray(book.markets)) {
                  book.markets.forEach(market => {
                    if (market.outcomes && Array.isArray(market.outcomes)) {
                      market.outcomes.forEach(outcome => {
                        allOdds.push({
                          event_id: event.id || event.canonical_event_id || 'unknown',
                          event_start_time: event.commence_time,
                          league: event.sport_title || 'TENNIS',
                          sportsbook: book.key,
                          market_type: market.key === 'h2h' ? 'moneyline' : market.key === 'spreads' ? 'spread' : market.key,
                          selection: outcome.name,
                          odds_american: decimalToAmerican(outcome.price),
                          line: outcome.point || null,
                          is_main_line: true,
                          home_team: event.home_team,
                          away_team: event.away_team
                        });
                      });
                    }
                  });
                }
              });
            }
          });

          const normName = (name) => {
            const n = (name || '').trim();
            if (n.includes(',')) {
              const [last, first] = n.split(',').map(s => s.trim());
              return `${first} ${last}`.trim();
            }
            return n;
          };
          const surKey = (name) => {
            const parts = normName(name).toLowerCase().split(/\s+/);
            return parts[parts.length - 1] || '';
          };

          // Group by event
          const byEvent = {};
          allOdds.forEach(line => {
            if (!byEvent[line.event_id]) byEvent[line.event_id] = [];
            byEvent[line.event_id].push(line);
          });

          // Infer home/away from market outcomes
          Object.values(byEvent).forEach(rows => {
            const commence = rows[0].event_start_time || new Date().toISOString();
            const league = rows[0].league || 'TENNIS';
            
            // For h2h markets, try to extract player names
            const h2hRows = rows.filter(r => r.market_type === 'moneyline');
            const names = Array.from(new Set(h2hRows.map(r => r.selection))).sort();
            
            if (names.length >= 2) {
              const sur1 = surKey(names[0]);
              const sur2 = surKey(names[1]);
              const mKey = `${league}|${commence.slice(0, 10)}|${sur1}|${sur2}`;
              if (!byEvent[mKey]) {
                byEvent[mKey] = {
                  league,
                  commence,
                  key: mKey,
                  names: { [sur1]: names[0], [sur2]: names[1] },
                  odds: {},
                  isLive: false
                };
              }
            }
          });

          // Reorg into match format
          const matchArray = [];
          Object.values(byEvent).forEach(group => {
            if (!Array.isArray(group)) return; // Skip non-arrays (the match objects we created)
            
            // This is a raw odds array - extract event info
            const eventId = group[0].event_id;
            const commence = group[0].event_start_time || new Date().toISOString();
            const league = group[0].league || 'TENNIS';
            
            // Get player names from h2h outcomes
            const h2hLines = group.filter(r => r.market_type === 'moneyline');
            const players = Array.from(new Set(h2hLines.map(r => r.selection))).sort();
            if (players.length < 2) return;
            
            const sur1 = surKey(players[0]);
            const sur2 = surKey(players[1]);
            const home = players[0];
            const away = players[1];
            
            // Map odds by (book, market, sur)
            const odds = {};
            group.forEach(line => {
              if (!line.sportsbook || !line.market_type) return;
              const book = canonicalBook(line.sportsbook);
              const mkt = bucketMarket(line.market_type);
              const sur = surKey(line.selection);
              const key = `${book}_${mkt}_${sur}`;
              if (!odds[key]) odds[key] = line;
            });
            
            matchArray.push({
              league,
              commence,
              eventId,
              home,
              away,
              homeSur: sur1,
              awaySur: sur2,
              odds,
              isLive: false
            });
          });

          matchArray.sort((a, b) => new Date(a.commence) - new Date(b.commence));
          setError('');
          const dataStr = JSON.stringify(matchArray);

          const mlCount = allOdds.filter(l => l.market_type === 'moneyline').length;
          setDebugInfo(`${allEvents.length} events, ${mlCount} moneyline rows`);
          setLastUpdate(new Date().toLocaleTimeString());
          setPrices(allOdds);
        } catch (err) {
          if (!silent) setError(err.message || 'Error fetching odds');
          if (matches.length === 0 && bootRetryRef.current < 4) {
            bootRetryRef.current += 1;
            setTimeout(() => fetchOddsRef.current(true), 2500);
          }
        } finally {
          fetchingRef.current = false;
          setLoading(false);

      };

      const fetchOddsRef = useRef();
      fetchOddsRef.current = fetchOdds;

      const didAutoFetch = useRef(false);
      // Disabled auto-fetch to prevent credit waste with invalid keys
      // useEffect(() => {
      //   if (apiKey.trim() && !didAutoFetch.current) { didAutoFetch.current = true; fetchOdds(); }
      // }, [apiKey]);

      useEffect(() => {
        // Auto-refresh and boot-retry disabled to prevent silent credit burns
        // const id = setInterval(() => fetchOddsRef.current(true), 30000);
        // const onVis = () => { if (!document.hidden) fetchOddsRef.current(true); };
        // document.addEventListener('visibilitychange', onVis);
        // return () => { clearInterval(id); document.removeEventListener('visibilitychange', onVis); };
      }, []);

      const logBet = (e) => {
        e.preventDefault();
        if (!betForm.player || !betForm.odds || !betForm.amount) { setError('Fill in player, odds, and amount'); return; }
        const newBet = { id: Date.now(), player: betForm.player, odds: parseFloat(betForm.odds), amount: parseFloat(betForm.amount), book: betForm.book, result: betForm.result, eventId: betForm.eventId, sur: betForm.sur, timestamp: new Date().toISOString() };
        setBets([...bets, newBet]);
        setBetForm({ player: '', odds: '', amount: '', book: 'pinnacle', result: 'pending', eventId: '', sur: '' });
        setModalOpen(false);
      };

      const profitFor = (odds, risked) => odds > 0 ? risked * odds / 100 : risked * 100 / Math.abs(odds);

      const calculateStats = () => {
        let wins = 0, losses = 0, pushes = 0, pending = 0, totalUnits = 0, totalReturned = 0;
        bets.forEach(bet => {
          if (bet.result === 'pending') { pending++; return; }
          const risked = bet.amount;
          let returned = 0;
          if (bet.result === 'win') { wins++; returned = risked + profitFor(bet.odds, risked); }
          else if (bet.result === 'loss') { losses++; returned = 0; }
          else { pushes++; returned = risked; }
          totalUnits += risked;
          totalReturned += returned;
        });
        const settled = wins + losses + pushes;
        const roi = totalUnits > 0 ? ((totalReturned - totalUnits) / totalUnits * 100).toFixed(1) : 0;
        const hitRate = settled > 0 ? ((wins / settled) * 100).toFixed(1) : 0;
        return { wins, losses, pushes, pending, total: bets.length, unitsPL: (totalReturned - totalUnits).toFixed(2), roi, hitRate };
      };

      const formatTime = (isoString) => {
        try {
          const d = new Date(isoString);
          const time = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
          const now = new Date();
          const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
          const gameDay = new Date(d.getFullYear(), d.getMonth(), d.getDate());
          const diffDays = Math.round((gameDay - today) / 86400000);
          if (diffDays === 0) return `Today ${time}`;
          if (diffDays === 1) return `Tmrw ${time}`;
          const day = d.toLocaleDateString('en-US', { weekday: 'short', month: 'numeric', day: 'numeric' });
          return `${day} ${time}`;
        } catch { return isoString; }
      };

      const startsIn = (isoString) => {
        try {
          const diff = new Date(isoString) - new Date();
          if (diff <= 0) return 'Started';
          const mins = Math.floor(diff / 60000);
          if (mins < 60) return `in ${mins}m`;
          const hrs = Math.floor(mins / 60);
          if (hrs < 24) return `in ${hrs}h ${mins % 60}m`;
          const days = Math.floor(hrs / 24);
          return `in ${days}d ${hrs % 24}h`;
        } catch { return ''; }
      };

      const filteredMatches = matches.filter(m => {
        if (new Date(m.commence) <= new Date()) return false;
        const s = searchName.toLowerCase();
        return m.home.toLowerCase().includes(s) || m.away.toLowerCase().includes(s);
      });

      const getOddsForPlayer = (match, playerSur, market = 'moneyline') => {
        const odds = {};
        BOOKMAKERS.forEach(book => {
          const key = `${book}_${market}_${playerSur}`;
          const line = match.odds[key];
          if (line) odds[book] = line;
        });
        return odds;
      };

      const getBooksWithOdds = (match) => {
        const books = new Set();
        BOOKMAKERS.forEach(book => {
          if (Object.keys(match.odds).some(key => key.startsWith(book + '_'))) books.add(book);
        });
        return Array.from(books);
      };

      return (
        <div>
          <div className="header" ref={headerRef}>
            {showApiInput && (
              <div className="input-group" style={{marginBottom: '8px'}}>
                <input type="password" placeholder="ParalayAPI Key" value={apiKey} onChange={(e) => setApiKey(e.target.value)} />
              </div>
            )}
            {!showApiInput && apiKey && (
              <button onClick={() => setShowApiInput(true)} style={{background: 'rgba(39, 192, 113, 0.2)', border: '1px solid rgba(39, 192, 113, 0.3)', color: '#27c071', padding: '6px 10px', borderRadius: '6px', fontSize: '11px', fontWeight: 600, marginBottom: '8px', cursor: 'pointer', textTransform: 'uppercase', letterSpacing: '0.3px'}}>
                ✓ KEY SET
              </button>
            )}
            {!showApiInput && !apiKey && (
              <button onClick={() => setShowApiInput(true)} style={{background: 'rgba(255, 255, 255, 0.08)', border: '1px solid rgba(255, 255, 255, 0.15)', color: '#ccc', padding: '6px 10px', borderRadius: '6px', fontSize: '11px', fontWeight: 600, marginBottom: '8px', cursor: 'pointer', textTransform: 'uppercase', letterSpacing: '0.3px'}}>
                + ADD KEY
              </button>
            )}
            <div className="input-group" style={{position: 'relative', marginBottom: '10px', marginTop: '4px', padding: '0'}}>
              <input ref={searchInputRef} type="text" style={{paddingLeft: '12px', paddingTop: '14px', paddingBottom: '14px', fontSize: '16px', fontWeight: 600, letterSpacing: '-0.3px'}} placeholder="Search player name..." value={searchName} onChange={(e) => handleSearchChange(e.target.value)} spellCheck="false" autoCorrect="off" autoCapitalize="off" autoComplete="off" />
              <button className={`clear-btn ${searchName ? 'show' : ''}`} onClick={clearSearch}>✕</button>
              {suggestions.length > 0 && <div className="autocomplete-list show">
                {suggestions.map((suggestion, idx) => (
                  <div key={idx} className="autocomplete-item" onClick={() => handleSuggestionClick(suggestion)} style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center'}}>{suggestion.name || suggestion} <span style={{fontSize: '12px', color: '#27c071', fontWeight: 700}}>{suggestion.bestOdds ? (suggestion.bestOdds > 0 ? '+' : '') + suggestion.bestOdds : '—'} ({suggestion.bookCount})</span></div>
                ))}
              </div>}
            </div>
            <div style={{display: 'flex', gap: '6px', marginTop: '8px'}}>
              <button className="load-btn" style={{flex: 1}} onClick={(e) => { e.preventDefault(); fetchOdds(); }}>
                {loading ? 'Loading...' : 'Load Odds'}
              </button>
              <button className="load-btn" style={{background: 'linear-gradient(135deg, #3b9eff 0%, #1fa8d0 100%)', flex: 0.15, padding: '0'}} onClick={(e) => { e.preventDefault(); fetchOdds(); }} title="Refresh">
                ↻
              </button>
            </div>
            <div className="tab-bar">
              <button className={`tab-btn ${tab === 'odds' ? 'active' : ''}`} onClick={() => setTab('odds')}>Odds</button>
            </div>

            {matches.length > 0 && <div className="stats">{lastUpdate && <span>{lastUpdate}</span>}<span style={{color: '#666'}}>parlay</span></div>}
            {booksFound.length > 0 && <div className="stats" style={{fontSize: '10px', color: '#888'}}><span>API books: {booksFound.join(', ')}</span></div>}
            {debugInfo && <div className="stats" style={{fontSize: '10px', color: '#888'}}><span>{debugInfo}</span></div>}
          </div>

          {error && <div className="error">⚠️ {error}</div>}


          {tab === 'odds' && loading && <div className="loading">Fetching tennis odds...</div>}
          {tab === 'odds' && filteredMatches.length === 0 && !loading && <div className="empty">{matches.length === 0 ? 'Enter API key and click Load' : 'No matches found'}</div>}

          {tab === 'odds' && filteredMatches.length > 0 && (

          {tab === 'odds' && <div className="matches-container">
            {filteredMatches.map((match, idx) => {
              const M = { ml: 'moneyline' };
              const oddsFor = (sur, mkt) => getOddsForPlayer(match, sur, mkt);
              const bestOf = (odds) => {
                let best = null, bestBook = null;
                BOOKMAKERS.forEach(b => { if (odds[b] && (!best || odds[b].odds_american > best.odds_american)) { best = odds[b]; bestBook = b; } });
                return best ? { odd: best, book: bestBook } : null;
              };
              const homeML = oddsFor(match.homeSur, M.ml), awayML = oddsFor(match.awaySur, M.ml);
              if (Object.keys(homeML).length + Object.keys(awayML).length === 0) return null;
              const nBooks = BOOKMAKERS.filter(b => homeML[b] || awayML[b]).length;
              const isOpen = !!expanded[match.eventId];
              return (
                <div key={match.eventId} className="match-card" onClick={() => setExpanded(prev => ({ ...prev, [match.eventId]: !prev[match.eventId] }))}>
                  <div className="mh-line"><span>{formatTime(match.commence)} • {match.league}<span className="starts-in">{startsIn(match.commence)}</span></span>{nBooks > 1 && <span className="book-count">{nBooks} books</span>}</div>
                  <div className="name-band" style={{display: 'flex', justifyContent: 'center', alignItems: 'center', gap: '4px'}}>
                    <span>{match.home}</span>
                    <button onClick={(e) => { e.stopPropagation(); navigator.clipboard.writeText(match.home); setCopiedName(match.home); setTimeout(() => setCopiedName(null), 1500); }} style={{background: 'none', border: 'none', color: copiedName === match.home ? '#27c071' : '#8b95a5', fontSize: '12px', cursor: 'pointer', padding: '0 2px', display: 'flex', alignItems: 'center', opacity: copiedName === match.home ? 1 : 0.6, transition: 'all 0.2s'}} title="Copy name">
                      {copiedName === match.home ? '✓' : '🔗'}
                    </button>
                  </div>
                  <div style={{display: 'flex', justifyContent: 'center', padding: '12px 4px', borderBottom: '1px solid rgba(255,255,255,0.05)'}}>
                    <BestCell pick={bestOf(homeML)} player={match.home} sur={match.homeSur} fillBetForm={fillBetForm} />
                  </div>
                  <div className="name-band" style={{display: 'flex', justifyContent: 'center', alignItems: 'center', gap: '4px'}}>
                    <span>{match.away}</span>
                    <button onClick={(e) => { e.stopPropagation(); navigator.clipboard.writeText(match.away); setCopiedName(match.away); setTimeout(() => setCopiedName(null), 1500); }} style={{background: 'none', border: 'none', color: copiedName === match.away ? '#27c071' : '#8b95a5', fontSize: '12px', cursor: 'pointer', padding: '0 2px', display: 'flex', alignItems: 'center', opacity: copiedName === match.away ? 1 : 0.6, transition: 'all 0.2s'}} title="Copy name">
                      {copiedName === match.away ? '✓' : '🔗'}
                    </button>
                  </div>
                  <div style={{display: 'flex', justifyContent: 'center', padding: '12px 4px'}}>
                    <BestCell pick={bestOf(awayML)} player={match.away} sur={match.awaySur} fillBetForm={fillBetForm} />
                  </div>
                  {isOpen && (
                    <div className="expand-wrap">
                      <XpSection label="Moneyline" lo={homeML} ro={awayML} lName={match.home} rName={match.away} lSur={match.homeSur} rSur={match.awaySur} fillBetForm={fillBetForm} />
                    </div>
                  )}
                </div>
              );
            })}
          </div>}

          {/* BET MODAL */}
          <div className={`modal-overlay ${modalOpen ? 'open' : ''}`} onClick={() => setModalOpen(false)}>
            <div className="modal-content" onClick={(e) => e.stopPropagation()}>
              <div className="modal-header">
                <div className="modal-title">Log Bet</div>
                <button className="modal-close" onClick={() => setModalOpen(false)}>✕</button>
              </div>
              <form className="modal-form" onSubmit={logBet}>
                <div className="form-group">
                  <label className="form-label">Player</label>
                  <input type="text" className="form-input" value={betForm.player} onChange={(e) => setBetForm({ ...betForm, player: e.target.value })} />
                </div>
                <div className="form-row">
                  <div className="form-group">
                    <label className="form-label">Odds</label>
                    <input type="number" className="form-input" value={betForm.odds} onChange={(e) => setBetForm({ ...betForm, odds: e.target.value })} />
                  </div>
                  <div className="form-group">
                    <label className="form-label">Amount</label>
                    <input type="number" className="form-input" placeholder="$" value={betForm.amount} onChange={(e) => setBetForm({ ...betForm, amount: e.target.value })} />
                  </div>
                </div>
                <div className="form-row">
                  <div className="form-group">
                    <label className="form-label">Book</label>
                    <select className="form-select" value={betForm.book} onChange={(e) => setBetForm({ ...betForm, book: e.target.value })}>
                      {BOOKMAKERS.map(b => <option key={b} value={b}>{BOOK_NAMES[b]}</option>)}
                    </select>
                  </div>
                  <div className="form-group">
                    <label className="form-label">Result</label>
                    <select className="form-select" value={betForm.result} onChange={(e) => setBetForm({ ...betForm, result: e.target.value })}>
                      <option value="pending">Pending</option>
                      <option value="win">Win</option>
                      <option value="loss">Loss</option>
                      <option value="push">Push</option>
                    </select>
                  </div>
                </div>
                <button type="submit" className="submit-btn">Log Bet</button>
              </form>
            </div>
          </div>
        </div>
      );
    };

    ReactDOM.render(<TennisSportsbookScreen />, document.getElementById('root'));
  </script>
</body>
</html>
