<!DOCTYPE html>
<html lang="en">
<head>

  <title>Tennis Sportsbook</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { background: linear-gradient(135deg, #0a0e27 0%, #1a2545 50%, #15192f 100%) fixed; min-height: 100vh; }
    body { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; background: transparent; color: #fff; }
    #root { min-height: 100vh; padding-bottom: 40px; }
    .header { padding: 16px; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(255, 255, 255, 0.05); background: linear-gradient(135deg, #0a0e27 0%, #15192f 100%); }
    .input-group { display: flex; gap: 8px; margin-bottom: 12px; position: relative; }
    .input-group input { flex: 1; padding: 12px 36px 12px 12px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 6px; color: #fff; font-size: 14px; font-family: inherit; }
    .input-group input::placeholder { color: #aaa; }
    .clear-btn { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #aaa; cursor: pointer; font-size: 18px; line-height: 1; display: none; -webkit-tap-highlight-color: transparent; }
    .clear-btn.show { display: block; }
    .clear-btn:active { color: #fff; }
    .load-btn { padding: 12px 16px; background: linear-gradient(135deg, #27c071 0%, #1fa85c 100%); border: none; border-radius: 6px; color: #000; font-weight: 700; font-size: 14px; cursor: pointer; font-family: inherit; box-shadow: 0 4px 12px rgba(39, 192, 113, 0.3); -webkit-tap-highlight-color: transparent; }
    .load-btn:active { opacity: 0.9; }
    .load-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .autocomplete-list { position: absolute; top: 100%; left: 0; right: 36px; background: rgba(20, 25, 45, 0.95); border: 1px solid rgba(255, 255, 255, 0.1); border-top: none; border-radius: 0 0 6px 6px; max-height: 200px; overflow-y: auto; z-index: 99; display: none; }
    .autocomplete-list.show { display: block; }
    .autocomplete-item { padding: 10px 12px; cursor: pointer; font-size: 13px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); transition: background 0.15s; -webkit-tap-highlight-color: transparent; }
    .autocomplete-item:active { background: rgba(39, 192, 113, 0.1); }
    .autocomplete-item:last-child { border-bottom: none; }
    .stats { display: flex; gap: 16px; font-size: 13px; color: #aaa; margin-top: 10px; }
    .stats-row { display: flex; gap: 20px; padding: 16px 12px; background: linear-gradient(135deg, rgba(39, 192, 113, 0.1) 0%, transparent 100%); border-bottom: 1px solid rgba(255, 255, 255, 0.05); border-radius: 6px; margin: 0 12px; font-size: 13px; }
    .stat-item { display: flex; flex-direction: column; gap: 4px; }
    .stat-label { color: #aaa; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; }
    .stat-value { color: #27c071; font-size: 18px; font-weight: 800; }
    .stat-value.negative { color: #ff6b6b; }
    .bet-history { padding: 12px; margin: 0 12px 12px; display: flex; flex-direction: column; gap: 6px; }
    .bet-item { padding: 12px; background: rgba(255, 255, 255, 0.02); border-left: 3px solid #27c071; border-radius: 4px; font-size: 12px; }
    .bet-item.loss { border-left-color: #ff6b6b; }
    .bet-item.push { border-left-color: #aaa; }
    .bet-item-header { display: flex; justify-content: space-between; margin-bottom: 6px; color: #fff; font-weight: 600; }
    .bet-item-detail { color: #aaa; font-size: 11px; line-height: 1.4; }
    .matches-container { padding: 12px; display: flex; flex-direction: column; gap: 12px; }
    .match-card { background: linear-gradient(135deg, rgba(39, 192, 113, 0.08) 0%, rgba(20, 25, 45, 0.8) 100%); border: 1px solid rgba(39, 192, 113, 0.15); border-radius: 8px; padding: 16px; }
    .match-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); padding-bottom: 12px; }
    .match-info { flex: 1; }
    .match-time { font-size: 12px; color: #aaa; font-weight: 600; margin-bottom: 4px; }
    .match-league { font-size: 13px; color: #fff; font-weight: 800; letter-spacing: -0.3px; }
    .player-section { margin-bottom: 16px; }
    .player-section:last-child { margin-bottom: 0; }
    .player-name { font-size: 16px; font-weight: 800; margin-bottom: 10px; color: #fff; letter-spacing: -0.3px; }
    .odds-list { display: flex; flex-direction: column; gap: 8px; }
    .odds-row { display: flex; align-items: center; justify-content: space-between; padding: 10px; background: rgba(255, 255, 255, 0.02); border-radius: 4px; border: 1px solid rgba(255, 255, 255, 0.05); cursor: pointer; transition: all 0.15s; -webkit-tap-highlight-color: transparent; }
    .odds-row:active { background: rgba(39, 192, 113, 0.1); border-color: rgba(39, 192, 113, 0.3); }
    .odds-left { display: flex; align-items: center; gap: 12px; flex: 1; }
    .book-name { font-size: 12px; color: #bbb; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; min-width: 45px; }
    .book-logo { width: 36px; height: 36px; object-fit: contain; }
    .book-fallback { font-size: 10px; color: #bbb; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    .odds-center { flex: 1; display: flex; justify-content: center; align-items: center; gap: 6px; }
    .odds-value { font-size: 18px; font-weight: 900; color: #27c071; font-family: 'SF Mono', 'Monaco', monospace; letter-spacing: -0.5px; }
    .odds-limit { font-size: 10px; color: #777; font-weight: 600; }
    .error { background: rgba(220, 38, 38, 0.15); color: #ff9999; padding: 12px 16px; margin: 12px; border-radius: 6px; font-size: 13px; }
    .loading { text-align: center; color: #aaa; padding: 40px 20px; font-size: 14px; }
    .empty { text-align: center; color: #aaa; padding: 40px 20px; font-size: 14px; }
    
    /* MODAL */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7); z-index: 200; display: none; }
    .modal-overlay.open { display: flex; align-items: flex-end; }
    .modal-content { background: linear-gradient(135deg, #0a0e27 0%, #15192f 100%); width: 100%; border-radius: 16px 16px 0 0; padding: 20px; animation: slideUp 0.3s ease; max-height: 90vh; overflow-y: auto; }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); padding-bottom: 12px; }
    .modal-title { font-size: 16px; font-weight: 800; color: #fff; }
    .modal-close { background: none; border: none; color: #aaa; font-size: 24px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .modal-close:active { color: #fff; }
    .modal-form { display: flex; flex-direction: column; gap: 12px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-label { font-size: 12px; color: #aaa; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    .form-input { padding: 12px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 6px; color: #fff; font-size: 14px; font-family: inherit; }
    .form-input::placeholder { color: #aaa; }
    .form-select { padding: 12px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 6px; color: #fff; font-size: 14px; font-family: inherit; }
    .form-row { display: flex; gap: 8px; }
    .form-row .form-group { flex: 1; }
    .submit-btn { padding: 12px 16px; background: linear-gradient(135deg, #27c071 0%, #1fa85c 100%); border: none; border-radius: 6px; color: #000; font-weight: 700; font-size: 14px; cursor: pointer; font-family: inherit; margin-top: 8px; -webkit-tap-highlight-color: transparent; }
    .submit-btn:active { opacity: 0.9; }

    const { useState, useEffect, useRef } = React;

    const TennisSportsbookScreen = () => {
      const [apiKey, setApiKey] = useState(() => {
        try { return localStorage.getItem('sharpapi_key') || ''; } catch { return ''; }

      const [error, setError] = useState('');
      const [lastUpdate, setLastUpdate] = useState('');
      const [bets, setBets] = useState(() => {
        try { return JSON.parse(localStorage.getItem('tennis_bets')) || []; } catch { return []; }
      });
      const [betForm, setBetForm] = useState({ player: '', odds: '', amount: '', book: 'pinnacle', result: 'win' });

      const searchInputRef = useRef(null);

      const BOOKMAKERS = ['betonline', 'prophetx', 'novig', 'fanduel', 'pinnacle'];

        pinnacle: 'data:image/webp;base64,UklGRuoCAABXRUJQVlA4IN4CAABQEACdASpAAEAAPo06mUelIyKhLhSdUKARiWoAzUXu4vAmtgz1AfjPek+YD9lN7A6iXeVJbvkD79Mp24f/QOIzSQTQfJAAEf0MYmv5FQi/aC4YZfTwcUOkp9nl+i7xjjN+9jP3BsBS0dFTRXlO4Tao7x4ua6HlEP6lp7fk+KcyUzFPyqx71h31Z/QAAP7+BtfwSCyuIU82mMH4j59QP41RQH+tGCHn1SHrgPi3/VAz9b76KXN2r3cQLF9jGO4898o9uAZDjxl5R5uD4cD4+vdivx/7f8x5o+eyfQwzWIAi/4QvemQ5F4AAo19tJx2uCYcGbu8BrbU/H7ouVnzmAm6OtiBszZd+vLIR9dxwHO8eVwIY8GVuT0jKT4jJdrYXOiwBixVq9J6NJ5wNT/CyEYsQnZDdvmOJD8aUHaGUUQ6nseAJHUN+L/IfuHGtsfQsQzZU4w3T7xdtRH9AuPW/5uAc4HZOVAeai5yWoe6RXvlb8TBUrj1oYqpJ9sW+EiYLX2aiUqC8fxiEwpu85mlXZeOqgPuLffc7sb8gQHOpHYFFCuiydlW/Jfss5Kc4vMDyh64hLg9o+c0SadOLJec0dapF4oWuWnqR3qO4WpTuMT7l9KZEl9d5jT9DfCeCbuMKw5qIuwf+rDZ7R3Ur6mlwkA/+p+sjtZDR/hSPQniFguN6cvtGXVnOXQalwckhBP7/0fNujW6f3MLfMquf/69Fd89341Z0TurykupKaAzn9AZMOLTDjeGC41r476wiv9aSUrtX9jt/Q8bfoDU7YK+p31WlyvEEEtG0iLddfKc9AYsr5+x58wbOHBEfMoa5Qv+TKzQGl3kheBLEzn7Yb+HI0EqBaiuUmy6qd9eK6W149UsCX0R5H0sv2YyfMv38RHb4PjjsLsd6K+e+x8WNxFJxWaVT//9GLU8R/+vxy18lCvd91DUy254plI9AUUMI/qv/Z3XfILeb0sLmOfbAdGYAAA=='
      };

      useEffect(() => {
        try { if (apiKey) localStorage.setItem('sharpapi_key', apiKey); } catch (e) {}
      }, [apiKey]);

      useEffect(() => {
        try { localStorage.setItem('tennis_bets', JSON.stringify(bets)); } catch (e) {}
      }, [bets]);

      const handleSearchChange = (val) => {
        setSearchName(val);
        if (val.trim().length > 0) {
          const playerNames = new Set();
          matches.forEach(m => {
            playerNames.add(m.home);
            playerNames.add(m.away);
          });
          const filtered = Array.from(playerNames)
            .filter(name => name.toLowerCase().includes(val.toLowerCase()))
            .sort();
          setSuggestions(filtered);
        } else {
          setSuggestions([]);
        }
      };

      const handleSuggestionClick = (name) => {
        setSearchName(name);
        setSuggestions([]);
      };

      const clearSearch = (e) => {
        e.preventDefault();
        setSearchName('');
        setSuggestions([]);
        if (searchInputRef.current) searchInputRef.current.focus();
      };

      const fillBetForm = (player, oddValue, book) => {
        setBetForm({ player, odds: oddValue || '', amount: '', book, result: 'win' });
        setModalOpen(true);
      };

      const fetchOdds = async () => {
        if (!apiKey.trim()) { setError('Enter your SharpAPI key first'); return; }
        setLoading(true);
        setError('');
        try {
          let allOdds = [], cursor = null;
          while (true) {
            const url = new URL('https://api.sharpapi.io/api/v1/odds');
            url.searchParams.set('sport', 'tennis');
            url.searchParams.set('sportsbook', BOOKMAKERS.join(','));
            url.searchParams.set('market', 'moneyline');
            url.searchParams.set('limit', '200');
            if (cursor) url.searchParams.set('cursor', cursor);
            const response = await fetch(url.toString(), { headers: { 'X-API-Key': apiKey } });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();
            if (!data.data || !Array.isArray(data.data)) throw new Error('Invalid response');
            allOdds = allOdds.concat(data.data);
            if (!data.pagination?.has_more) break;
            cursor = data.pagination.next_cursor;
          }
          const grouped = {};
          allOdds.forEach(line => {
            if (!grouped[line.event_id]) grouped[line.event_id] = { league: line.league?.toUpperCase() || 'TENNIS', commence: line.event_start_time || new Date().toISOString(), oddRows: [] };
            grouped[line.event_id].oddRows.push(line);
          });
          const matchArray = Object.values(grouped).map(event => {
            const players = new Set();
            event.oddRows.forEach(row => { if (row.selection_type === 'home' || row.selection_type === 'away') players.add(row.selection); });
            const playerList = Array.from(players);
            return { league: event.league, commence: event.commence, eventId: event.oddRows[0].event_id, home: playerList[0] || 'TBD', away: playerList[1] || 'TBD', odds: {} };
          }).map(match => {
            allOdds.forEach(line => {
              if (line.event_id === match.eventId) {
                const key = `${line.sportsbook}_${line.market_type}_${line.selection}`;
                match.odds[key] = line;
              }
            });
            return match;
          }).filter(m => m.home && m.away && m.home !== 'TBD').sort((a, b) => new Date(a.commence) - new Date(b.commence));
          setMatches(matchArray);
          setLastUpdate(new Date().toLocaleTimeString());
        } catch (err) {
          setError(err.message || 'Error fetching odds');
        } finally {
          setLoading(false);
        }
      };

      const logBet = (e) => {
        e.preventDefault();
        if (!betForm.player || !betForm.odds || !betForm.amount) { setError('Fill in player, odds, and amount'); return; }
        const newBet = { id: Date.now(), player: betForm.player, odds: parseFloat(betForm.odds), amount: parseFloat(betForm.amount), book: betForm.book, result: betForm.result, timestamp: new Date().toISOString() };
        setBets([...bets, newBet]);
        setBetForm({ player: '', odds: '', amount: '', book: 'pinnacle', result: 'win' });
        setModalOpen(false);
      };

      const calculateStats = () => {
        let wins = 0, losses = 0, pushes = 0, totalUnits = 0, totalReturned = 0;
        bets.forEach(bet => {
          const risked = bet.amount;
          let returned = 0;
          if (bet.result === 'win') { wins++; returned = risked + (risked * (Math.abs(bet.odds) - 100) / 100); }
          else if (bet.result === 'loss') { losses++; returned = 0; }
          else { pushes++; returned = risked; }
          totalUnits += risked;
          totalReturned += returned;
        });
        const roi = totalUnits > 0 ? ((totalReturned - totalUnits) / totalUnits * 100).toFixed(1) : 0;
        const hitRate = bets.length > 0 ? ((wins / bets.length) * 100).toFixed(1) : 0;
        return { wins, losses, pushes, total: bets.length, unitsPL: (totalReturned - totalUnits).toFixed(2), roi, hitRate };
      };

      const formatTime = (isoString) => {
        try { const d = new Date(isoString); return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true }); } catch { return isoString; }
      };

      const filteredMatches = matches.filter(m => {
        const s = searchName.toLowerCase();
        return m.home.toLowerCase().includes(s) || m.away.toLowerCase().includes(s);
      });

      const getOddsForPlayer = (match, player, market = 'moneyline') => {
        const odds = {};
        BOOKMAKERS.forEach(book => {
          const key = `${book}_${market}_${player}`;
          const line = match.odds[key];
          if (line) odds[book] = line;
        });
        return odds;
      };

      const getBooksWithOdds = (match) => {
        const books = new Set();
        BOOKMAKERS.forEach(book => {
          if (Object.keys(match.odds).some(key => key.startsWith(book + '_'))) books.add(book);
        });
        return Array.from(books);
      };

      return (
        <div>
          <div className="header">
            <div className="input-group">
              <input type="password" placeholder="SharpAPI Key" value={apiKey} onChange={(e) => setApiKey(e.target.value)} />
              <button className="load-btn" onClick={(e) => { e.preventDefault(); fetchOdds(); }}>
                {loading ? 'Loading...' : 'Load'}
              </button>
            </div>
            <div className="input-group" style={{position: 'relative'}}>
              <input ref={searchInputRef} type="text" placeholder="Search player name..." value={searchName} onChange={(e) => handleSearchChange(e.target.value)} />
              <button className={`clear-btn ${searchName ? 'show' : ''}`} onClick={clearSearch}>✕</button>
              {suggestions.length > 0 && <div className="autocomplete-list show">
                {suggestions.map((name, idx) => (
                  <div key={idx} className="autocomplete-item" onClick={() => handleSuggestionClick(name)}>{name}</div>
                ))}
              </div>}
            </div>
            {matches.length > 0 && <div className="stats"><span>{filteredMatches.length}/{matches.length} matches</span>{lastUpdate && <span>{lastUpdate}</span>}</div>}
          </div>

          {error && <div className="error">⚠️ {error}</div>}

          {bets.length > 0 && (() => { const stats = calculateStats(); return (
            <div className="stats-row">
              <div className="stat-item"><div className="stat-label">Record</div><div className="stat-value">{stats.wins}-{stats.losses}</div></div>
              <div className="stat-item"><div className="stat-label">Hit Rate</div><div className="stat-value">{stats.hitRate}%</div></div>
              <div className="stat-item"><div className="stat-label">Units</div><div className={`stat-value ${stats.unitsPL < 0 ? 'negative' : ''}`}>{stats.unitsPL > 0 ? '+' : ''}{stats.unitsPL}</div></div>
              <div className="stat-item"><div className="stat-label">ROI</div><div className={`stat-value ${stats.roi < 0 ? 'negative' : ''}`}>{stats.roi > 0 ? '+' : ''}{stats.roi}%</div></div>
            </div>
          ); })()}

          {bets.length > 0 && (
            <div className="bet-history">
              {[...bets].reverse().map(bet => (
                <div key={bet.id} className={`bet-item ${bet.result}`}>
                  <div className="bet-item-header"><span>{bet.player}</span><span>{bet.result === 'win' ? '+' : bet.result === 'loss' ? '-' : ''}{bet.amount}</span></div>
                  <div className="bet-item-detail">{bet.odds > 0 ? '+' : ''}{bet.odds} @ {bet.book} • {new Date(bet.timestamp).toLocaleDateString()}</div>
                </div>
              ))}
            </div>
          )}

          {loading && <div className="loading">Fetching tennis odds...</div>}
          {filteredMatches.length === 0 && !loading && <div className="empty">{matches.length === 0 ? 'Enter API key and click Load' : 'No matches found'}</div>}

          <div className="matches-container">
            {filteredMatches.map((match, idx) => {
              const homeOdds = getOddsForPlayer(match, match.home);
              const awayOdds = getOddsForPlayer(match, match.away);
              return (
                <div key={idx} className="match-card">
                  <div className="match-header">
                    <div className="match-info">
                      <div className="match-time">{formatTime(match.commence)}</div>
                      <div className="match-league">{match.league}</div>
                    </div>
                  </div>

                  <div className="player-section">
                    <div className="player-name">{match.home}</div>
                    <div className="odds-list">
                      {BOOKMAKERS.map(book => {
                        const odd = homeOdds[book];
                        return (
                          <div key={book} className="odds-row" onClick={() => fillBetForm(match.home, odd?.odds_american, book)}>
                            <div className="odds-left">
                              {BOOK_LOGOS[book] ? <img src={BOOK_LOGOS[book]} alt={BOOK_NAMES[book]} className="book-logo" />: <div className="book-fallback">{BOOK_NAMES[book]}</div>}
                            </div>
                            <div className="odds-center">
                              <div className="odds-value">{odd ? (odd.odds_american > 0 ? `+${odd.odds_american}` : odd.odds_american) : '—'}</div>
                              <div className="odds-limit">{odd?.max_bet ? `$${(odd.max_bet / 1000).toFixed(0)}k` : ''}</div>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>

                  <div className="player-section">
                    <div className="player-name">{match.away}</div>
                    <div className="odds-list">
                      {BOOKMAKERS.map(book => {
                        const odd = awayOdds[book];
                        return (
                          <div key={book} className="odds-row" onClick={() => fillBetForm(match.away, odd?.odds_american, book)}>
                            <div className="odds-left">
                              {BOOK_LOGOS[book] ? <img src={BOOK_LOGOS[book]} alt={BOOK_NAMES[book]} className="book-logo" />: <div className="book-fallback">{BOOK_NAMES[book]}</div>}
                            </div>
                            <div className="odds-center">
                              <div className="odds-value">{odd ? (odd.odds_american > 0 ? `+${odd.odds_american}` : odd.odds_american) : '—'}</div>
                              <div className="odds-limit">{odd?.max_bet ? `$${(odd.max_bet / 1000).toFixed(0)}k` : ''}</div>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </div>
              );
            })}
          </div>

          {/* BET MODAL */}
          <div className={`modal-overlay ${modalOpen ? 'open' : ''}`} onClick={() => setModalOpen(false)}>
            <div className="modal-content" onClick={(e) => e.stopPropagation()}>
              <div className="modal-header">
                <div className="modal-title">Log Bet</div>
                <button className="modal-close" onClick={() => setModalOpen(false)}>✕</button>
              </div>
              <form className="modal-form" onSubmit={logBet}>
                <div className="form-group">
                  <label className="form-label">Player</label>
                  <input type="text" className="form-input" value={betForm.player} onChange={(e) => setBetForm({ ...betForm, player: e.target.value })} />
                </div>
                <div className="form-row">
                  <div className="form-group">
                    <label className="form-label">Odds</label>
                    <input type="number" className="form-input" value={betForm.odds} onChange={(e) => setBetForm({ ...betForm, odds: e.target.value })} />
                  </div>
                  <div className="form-group">
                    <label className="form-label">Amount</label>
                    <input type="number" className="form-input" placeholder="$" value={betForm.amount} onChange={(e) => setBetForm({ ...betForm, amount: e.target.value })} />
                  </div>
                </div>
                <div className="form-row">
                  <div className="form-group">
                    <label className="form-label">Book</label>
                    <select className="form-select" value={betForm.book} onChange={(e) => setBetForm({ ...betForm, book: e.target.value })}>
                      {BOOKMAKERS.map(b => <option key={b} value={b}>{BOOK_NAMES[b]}</option>)}
                    </select>
                  </div>
                  <div className="form-group">
                    <label className="form-label">Result</label>
                    <select className="form-select" value={betForm.result} onChange={(e) => setBetForm({ ...betForm, result: e.target.value })}>
                      <option value="win">Win</option>
                      <option value="loss">Loss</option>
                      <option value="push">Push</option>
                    </select>
                  </div>
                </div>
                <button type="submit" className="submit-btn">Log Bet</button>
              </form>
            </div>
          </div>
        </div>
      );
    };

    ReactDOM.render(<TennisSportsbookScreen />, document.getElementById('root'));
  </script>
</body>
</html>
