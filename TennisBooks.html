  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --page-bg: #05070b;
      --text-primary: #fff;
      --text-dim: #8b95a5;
      --glass-rgb: 255, 255, 255;
      --body-text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8), -1px -1px 0 rgba(0, 0, 0, 0.3), 1px -1px 0 rgba(0, 0, 0, 0.3), -1px 1px 0 rgba(0, 0, 0, 0.3), 1px 1px 0 rgba(0, 0, 0, 0.3);
    }
    @media (prefers-color-scheme: light) {
      :root {
        --page-bg: #f6f5fb;
        --text-primary: #191825;
        --text-dim: #5b6472;
        --glass-rgb: 20, 15, 35;
        --body-text-shadow: none;
      }
    }
    html, body { height: 100%; }
    html { background: var(--page-bg); }
    #root { height: 100dvh; overflow: hidden; }
    body { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; background: transparent; color: var(--text-primary); text-shadow: var(--body-text-shadow); }
    .app-shell { height: 100dvh; display: flex; flex-direction: column; }
    .app-scroll { flex: 1 1 auto; overflow-y: auto; overscroll-behavior-y: contain; -webkit-overflow-scrolling: touch; }
    .tab-bar { display: flex; gap: 6px; margin-top: 8px; margin-bottom: 8px; }
    .search-sticky { position: sticky; top: 0; z-index: 100; background: linear-gradient(180deg, rgba(5, 7, 11, 0.95) 0%, rgba(10, 14, 21, 0.85) 100%); backdrop-filter: blur(12px); padding: 12px 12px 8px; border-bottom: 2px solid rgba(var(--glass-rgb), 0.1); }

    .search-bottom { flex: 0 0 auto; position: relative; z-index: 100; background: rgba(5, 7, 11, 0.9); backdrop-filter: blur(16px); padding: 8px 12px calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid rgba(168, 85, 247, 0.15); }
    .search-bottom .input-group { max-width: 460px; margin: 0 auto; }
    .search-bottom-inner { max-width: 460px; margin: 0 auto; }
    .search-count { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: 11px; font-weight: 700; color: var(--text-dim); pointer-events: none; white-space: nowrap; }
    .mkt-bar { display: flex; gap: 8px; margin: 10px auto 0; max-width: 460px; padding: 0 10px; }
    .mkt-btn { flex: 1; padding: 8px; background: transparent; border: 1px solid rgba(var(--glass-rgb), 0.22); border-radius: 20px; color: var(--text-dim); font-family: inherit; font-size: 13px; font-weight: 600; -webkit-tap-highlight-color: transparent; }
    .mkt-btn.active { background: #2c3a4f; border-color: transparent; color: var(--text-primary); }

    .cols3-head { display: grid; grid-template-columns: 1fr 1fr; background: #0a0e14; border-top: 1px solid rgba(var(--glass-rgb),0.06); border-bottom: 1px solid rgba(var(--glass-rgb),0.06); }
    .cols3-head span { font-size: 10px; font-weight: 800; letter-spacing: 1px; color: var(--text-dim); text-align: center; padding: 6px 0; text-transform: uppercase; }
    .name-band { background: rgba(var(--glass-rgb), 0.08); color: var(--text-primary); font-size: 14px; font-weight: 900; text-align: center; padding: 8px 16px; letter-spacing: 0px; text-transform: uppercase; backdrop-filter: blur(20px); border: 1px solid rgba(var(--glass-rgb), 0.15); border-radius: 20px; box-shadow: inset 0 1px 2px rgba(var(--glass-rgb), 0.2), 0 8px 32px rgba(0, 0, 0, 0.2); }
    .best-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 0 8px 6px; }

    .best-cell .book-logo { width: 26px; height: 26px; border-radius: 6px; flex-shrink: 0; }
    .bc-num { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.15; font-size: 13px; }

    .mh-time { color: #22c55e; }

    .out-of-range { color: #ff3b3b; font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.3px; margin-left: 6px; font-family: 'JetBrains Mono', monospace; text-shadow: 0 0 10px rgba(255, 59, 59, 0.5); }
    @keyframes copyPop { 0% { opacity: 0; transform: translateY(6px) scale(0.96); } 15% { opacity: 1; transform: translateY(0) scale(1); } 82% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-4px) scale(0.98); } }
    .paste-copied-toast { position: absolute; left: 12px; right: 12px; bottom: 100%; margin-bottom: 8px; animation: copyPop 1.6s ease forwards; background: rgba(20, 25, 45, 0.98); border: 1px solid rgba(34, 197, 94, 0.4); color: #22c55e; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 800; padding: 10px 12px; border-radius: 10px; text-align: center; letter-spacing: 0.3px; z-index: 101; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4); backdrop-filter: blur(16px); pointer-events: none;}
    .live-dot { width: 6px; height: 6px; border-radius: 50%; background: #ff3b3b; animation: livePulse 1.2s ease-in-out infinite; }
    @keyframes livePulse { 0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(255, 59, 59, 0.6); } 50% { opacity: 0.4; box-shadow: 0 0 0 4px rgba(255, 59, 59, 0); } }
    .col-heads { display: grid; grid-template-columns: 1fr 44px 1fr; gap: 8px; margin-bottom: 8px; }
    .col-heads span { font-size: 15px; font-weight: 700; color: var(--text-primary); text-align: center; letter-spacing: -0.2px; }
    .book-row { display: grid; grid-template-columns: 1fr 44px 1fr; gap: 8px; align-items: center; margin-bottom: 6px; }
    .book-mid { display: flex; align-items: center; justify-content: center; }
    .odds-cell { border: 2px solid rgba(var(--glass-rgb), 0.2); border-radius: 10px; padding: 6px 4px; text-align: center; cursor: pointer; min-height: 40px; display: flex; flex-direction: column; justify-content: center; -webkit-tap-highlight-color: transparent; background: linear-gradient(135deg, rgba(34, 197, 94, 0.15) 0%, rgba(27, 36, 51, 0.7) 100%); backdrop-filter: blur(16px); box-shadow: 0 8px 32px rgba(34, 197, 94, 0.2), inset 0 2px 4px rgba(var(--glass-rgb), 0.2), inset 0 -1px 2px rgba(0, 0, 0, 0.2); font-size: 14px; font-weight: 700; }
    .odds-cell.best { background: linear-gradient(145deg, rgba(34, 197, 94, 0.3) 0%, rgba(34, 197, 94, 0.1) 100%); border-color: rgba(34, 197, 94, 0.6); }
    .cell-odds { font-size: 17px; font-weight: 700; color: var(--text-primary); font-variant-numeric: tabular-nums; letter-spacing: -0.2px; font-family: 'JetBrains Mono', monospace; }
    .cell-limit { font-size: 11px; color: var(--text-dim); font-weight: 500; min-height: 13px; font-family: 'JetBrains Mono', monospace; }
    .tab-btn { flex: 1; padding: 10px; background: rgba(var(--glass-rgb), 0.08); border: 2px solid rgba(var(--glass-rgb), 0.15); border-radius: 22px; color: var(--text-dim); font-family: inherit; font-size: 14px; font-weight: 600; -webkit-tap-highlight-color: transparent; backdrop-filter: blur(12px); box-shadow: inset 0 2px 4px rgba(var(--glass-rgb), 0.1), 0 4px 12px rgba(0, 0, 0, 0.15); text-transform: uppercase; letter-spacing: 0.5px; }

    .header { padding: 28px 18px 8px; background: linear-gradient(180deg, rgba(5, 7, 11, 0.95) 0%, rgba(10, 14, 21, 0.85) 100%); backdrop-filter: blur(12px); border-bottom: 2px solid rgba(var(--glass-rgb), 0.1); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(var(--glass-rgb), 0.08); }
    .header-collapsed { display: flex; align-items: center; gap: 10px; padding: 6px 4px 10px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .header-collapsed-info { flex: 1; font-size: 11px; font-weight: 700; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; text-transform: uppercase; letter-spacing: 0.3px; }
    .header-collapsed-refresh { background: rgba(168, 85, 247, 0.15); border: 1px solid rgba(168, 85, 247, 0.3); color: #a855f7; width: 26px; height: 26px; border-radius: 50%; font-size: 13px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .header-collapsed-chevron { color: var(--text-dim); font-size: 14px; }
    .input-group { display: flex; gap: 6px; margin-bottom: 10px; position: relative; }
    .input-group input { flex: 1; padding: 12px 12px 12px 44px; background: transparent; border: 2px solid rgba(168, 85, 247, 0.3); border-radius: 10px; color: var(--text-primary); font-size: 14px; font-family: inherit; box-shadow: none; }
    .input-group input:focus { outline: none; border-color: rgba(168, 85, 247, 0.6); }
    .input-group input::placeholder { color: var(--text-dim); font-weight: 500; text-transform: uppercase; }
    .clear-btn { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); background: rgba(var(--glass-rgb), 0.15); border: none; color: var(--text-primary); cursor: pointer; font-size: 18px; font-weight: 800; line-height: 1; display: none; width: 34px; height: 34px; border-radius: 50%; align-items: center; justify-content: center; -webkit-tap-highlight-color: transparent; }
    .clear-btn.show { display: flex; }
    .clear-btn:active { color: var(--text-primary); }
    .load-btn { padding: 10px 14px; background: linear-gradient(135deg, rgba(34, 197, 94, 0.95) 0%, rgba(31, 168, 92, 0.90) 100%); border: 2px solid rgba(var(--glass-rgb), 0.3); border-radius: 10px; color: #000; font-weight: 700; font-size: 12px; cursor: pointer; font-family: inherit; box-shadow: 0 12px 40px rgba(34, 197, 94, 0.35), inset 0 2px 4px rgba(var(--glass-rgb), 0.4), inset 0 -2px 4px rgba(0, 0, 0, 0.2); backdrop-filter: blur(12px); -webkit-tap-highlight-color: transparent; text-transform: uppercase; letter-spacing: 0.3px; }
    .load-btn:active { opacity: 0.9; }
    .load-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .autocomplete-list { position: absolute; top: 100%; left: 0; right: 36px; background: rgba(20, 25, 45, 0.98); border: 2px solid rgba(var(--glass-rgb), 0.2); border-top: none; border-radius: 0 0 12px 12px; max-height: 200px; overflow-y: auto; overscroll-behavior: contain; z-index: 99; display: none; backdrop-filter: blur(16px); box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4), inset 0 1px 2px rgba(var(--glass-rgb), 0.1); }
    .autocomplete-list.show { display: block; }
    .autocomplete-item { padding: 10px 12px; cursor: pointer; font-size: 13px; border-bottom: 1px solid rgba(var(--glass-rgb), 0.05); transition: background 0.15s; -webkit-tap-highlight-color: transparent; }
    .autocomplete-item:active { background: rgba(34, 197, 94, 0.1); }
    .autocomplete-item:last-child { border-bottom: none; }
    .stats { display: flex; gap: 16px; font-size: 13px; color: var(--text-dim); margin-top: 10px; font-family: 'JetBrains Mono', monospace; }
    .stats-row { display: flex; gap: 20px; padding: 16px 12px; background: linear-gradient(135deg, rgba(34, 197, 94, 0.2) 0%, rgba(34, 197, 94, 0.08) 100%); border-bottom: 2px solid rgba(var(--glass-rgb), 0.1); border-radius: 10px; margin: 0 12px; font-size: 13px; backdrop-filter: blur(16px); box-shadow: 0 4px 16px rgba(34, 197, 94, 0.15), inset 0 2px 4px rgba(var(--glass-rgb), 0.12); }
    .stat-item { display: flex; flex-direction: column; gap: 4px; }
    .stat-label { color: var(--text-dim); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; }
    .stat-value { color: #22c55e; font-size: 18px; font-weight: 800; }
    .stat-value.negative { color: #ff6b6b; }
    .bet-history { padding: 12px; margin: 0 12px 12px; display: flex; flex-direction: column; gap: 6px; }
    .bet-item { padding: 14px; background: linear-gradient(135deg, rgba(var(--glass-rgb), 0.12) 0%, rgba(var(--glass-rgb), 0.06) 100%); border-left: 4px solid #22c55e; border-radius: 10px; font-size: 12px; backdrop-filter: blur(12px); box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3), inset 0 2px 4px rgba(var(--glass-rgb), 0.1); }
    .bet-item.loss { border-left-color: #ff6b6b; }
    .bet-item.push { border-left-color: var(--text-dim); }
    .bet-item.pending { border-left-color: #f0c040; }
    .bet-item-header { display: flex; justify-content: space-between; margin-bottom: 6px; color: var(--text-primary); font-weight: 600; }
    .bet-item-detail { color: var(--text-dim); font-size: 11px; line-height: 1.4; }
    .matches-container { padding: 8px; display: flex; flex-direction: column; gap: 8px; max-width: 460px; margin: 0 auto; width: 100%; }
    .match-card { background: linear-gradient(150deg, rgba(30, 20, 45, 0.8) 0%, rgba(15, 13, 23, 0.7) 55%, rgba(10, 14, 21, 0.6) 100%); border: 2px solid rgba(168, 85, 247, 0.35); border-radius: 14px; padding: 0 0 4px; overflow: hidden; backdrop-filter: blur(20px); box-shadow: 0 12px 48px rgba(0, 0, 0, 0.5), 0 0 24px rgba(168, 85, 247, 0.12), inset 0 2px 4px rgba(var(--glass-rgb), 0.15), inset 0 -2px 4px rgba(0, 0, 0, 0.3); margin-bottom: 10px; }
    .player-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0; padding: 8px 0; }
    .card-col { background: transparent; border: none; border-radius: 0; padding: 8px 10px; display: flex; flex-direction: column; align-items: center; }
    .card-col:first-child { border-right: 1px solid rgba(var(--glass-rgb), 0.08); }
    .primary-pick { padding: 12px 10px; display: flex; flex-direction: column; align-items: center; }
    .vs-line { padding: 10px 10px 14px; text-align: center; font-size: 15px; font-weight: 800; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; font-family: 'JetBrains Mono', monospace; }
    .vs-line .vs-word { color: #a855f7; margin-right: 6px; }
    .match-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; border-bottom: 1px solid rgba(var(--glass-rgb), 0.05); padding-bottom: 8px; }
    .match-info { flex: 1; }
    .match-time { font-size: 12px; color: var(--text-dim); font-weight: 600; margin-bottom: 4px; }
    .starts-in { color: #22c55e; font-weight: 700; margin-left: 6px; }
    .match-league { font-size: 13px; color: var(--text-primary); font-weight: 800; letter-spacing: -0.3px; }
    .player-section { margin-bottom: 10px; }
    .player-section:last-child { margin-bottom: 0; }
    .player-name { font-size: 15px; font-weight: 800; margin-bottom: 6px; color: var(--text-primary); letter-spacing: -0.3px; }

    .odds-row:active { background: rgba(34, 197, 94, 0.1); border-color: rgba(34, 197, 94, 0.3); }
    .odds-left { display: flex; align-items: center; gap: 12px; flex: 1; }

    .book-logo { width: 28px; height: 28px; object-fit: contain; border-radius: 5px; }
    .book-fallback { font-size: 10px; color: var(--text-dim); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }

    .odds-value { font-size: 18px; font-weight: 900; color: var(--text-primary); font-family: 'SF Mono', 'Monaco', monospace; letter-spacing: -0.5px; }
    .odds-limit { font-size: 11px; color: var(--text-primary); font-weight: 800; }
    .deep-link { color: #22c55e; font-size: 15px; font-weight: 800; text-decoration: none; padding: 4px 2px 4px 10px; -webkit-tap-highlight-color: transparent; }

    .empty { text-align: center; color: var(--text-dim); padding: 40px 20px; font-size: 14px; }
    
    /* MODAL */

<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const BOOKMAKERS = ['fanduel', 'pinnacle', 'novig'];
    const bucketMarket = (mt) => {
      const m = (mt || '').toLowerCase();
      if (m.includes('spread') || m.includes('handicap')) return 'sets';
      if (m.includes('h2h')) return 'moneyline';
      return m;
    };
    const canonicalBook = (name) => {
      const n = (name || '').toLowerCase().replace(/[^a-z]/g, '');
      const aliases = {
        'fanduel': 'fanduel', 'fd': 'fanduel',
        'pinnacle': 'pinnacle', 'pinny': 'pinnacle',
        'novig': 'novig', 'novigexchange': 'novig'
      };
      return aliases[n] || n;
    };
    const BOOK_NAMES = { fanduel: 'FD', pinnacle: 'PIN', novig: 'NOVIG' };
    const BOOK_FULL_NAMES = { fanduel: 'FanDuel', pinnacle: 'Pinnacle', novig: 'Novig' };
    const BOOK_LOGOS = { 
      fanduel: 'data:image/webp;base64,UklGRgQDAABXRUJQVlA4IPgCAACwEQCdASpAAEAAPo06mUelIyKhO/gIAJAPiWwAqo9Qw3encbFsZ4c4K2iPPG5F52PmAfpn0j/MB+x3rIehX/AeoB/VeoI3lf/JsEFanLd0kDR6AR9D7fOD1QvBCrYsPkvft5hKxQvPxb4fC53q2Y6hH5WsvYLPCdD5roBqpOwBv2LejuowY7c27yB57YdUrX7N7Q1vzAAA/vxEPXBEsbuyVpnd+AC6BGNXF3PJZEPoNsbaxvQiC/U8y/nuS7O79Y1Ya/D0kt5j8+2wkjxI55MYEhTE/r666roKzuAZUJ3GQl+nMU7D3LkcjrCPrmN5Xt0E4SgK4x/FZpJplxs9DCyuNVKP5mix/TxlrQ5vtBQShoJvkq7GYeuk98YEjlqGqCEjovbhTAw7oTni6G/v0RdpV+G8VwVEaGcE8wKEOeltU9H0gm9caXwTOzoEOyVdjXxU6yB29I+vn9ps1JvNthEqs0o6+4a7Dlo1RCrthmsGV1LHLyu17D5OxKyqCW3zusR3nlfLOaqprPXxb0x2LcUciTRXwWQFSazQexm1TLXmnlci4FSxEewz0IwcXIiHlbXUqnzxrTUMM/mbYQBDabhC0qFpp/w0WxyEJI1qCUDkRX0HBRHFM5qLM4pbjxE08SF5NM9DFOkYxcQxwEXPMTub13rjzM0auKNoU+xYykImm9kVzqu/uV4KjBh48npzBkJ+sbYrxI0xnlGKS9R6FFhsuQQDC8n/ErK7BxyJ2P1y6aNI22ows1PdWA5q5Xfs7HP4ktCr2uX+OvZLH50onBua5wF6uxrkBNg/v42jmXQ7ahIVkjmtkIHWC087urn2CEVHMVtqWk9GzWcjV1Y7R52mN1oleMuEsAXElih2tjgu6vxkgBd6aAEau/MiPWHCEijVL23DMIqyj5qrSoB5Bpd4iVVcsIunSkkvnxG4AZwLwoGVyrUyBRgAFQEK3qbipAFUXFK8cWYk+JhR19UUQQSoIq0JTHqz/2P2t5s2uwleSmI5bM6AAAAA',
      pinnacle: 'data:image/webp;base64,UklGRhYBAABXRUJQVlA4IAoBAAAwBwCdASpAAEAAPpFCnkklpCMhLBgI0LASCWMAxh7gMEA/QAV/hh3oEJphR6xQ60w0eLM6oqNiigGJM4DCkHGCS/AA/vk5hzh5HYQtG16TiCj/nRbo3CyroQJ+6RGbbYnnu/ZRRmra9/5yr8f8Tmr1CXU2mf80eRuLHRROOSP2+Nh+qdKgZ2Tf3WyTQIjP2U7kQWlyBvPRO+B5HiHEZNGPlspwJVeHi27qa/TL+RePSsCgUNr/ws6PY1V9uc/B3XlzWZz5TLM80/7t9IAH+WC68zz/9uZH768BoOvPe/AsA7iOPD95+oLX/pKWdFtcZb7234q5kKPPk+PN6UR9GCQ/5wc+qACZIqYAAA=='
    };

    const formatMoney = (v) => {
      if (!v || v <= 0) return '';
      if (v >= 1000) return `$${(v / 1000).toFixed(1).replace(/\.0$/, '')}k`;
      return `$${Math.round(v)}`;
    };

    const getLimit = (odd) => {
      // ParalayAPI doesn't return explicit limits, so we skip for now
      return '';
    };

    const fmtOddsG = (v) => v > 0 ? `+${v}` : `${v}`;
    const nameMatches = (name, query) => {
      if (!query) return false;
      const q = query.trim().toLowerCase();
      if (!q) return false;
      const nameWords = name.toLowerCase().split(/\s+/);
      const queryWords = q.split(/\s+/);
      return queryWords.every(qw => nameWords.some(nw => nw.startsWith(qw)));
    };
    const parsePastedPick = (text) => {
      const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
      let player = null, worstPrice = null;
      for (const line of lines) {
        if (!player && line.includes('>')) {
          const left = line.split('>')[0].replace(/\*/g, '').trim();
          if (left) player = left;
        }
        const wpMatch = line.match(/worst\s*price\s*([+-]?\d+)/i);
        if (wpMatch) worstPrice = parseInt(wpMatch[1], 10);
      }
      return player ? { player, worstPrice } : null;
    };
    const startsInCopy = (isoString) => {
      try {
        const diff = new Date(isoString) - new Date();
        if (diff <= 0) return 'started';
        const mins = Math.floor(diff / 60000);
        if (mins < 60) return `${mins}m`;
        const hrs = Math.floor(mins / 60);
        if (hrs < 24) return `${hrs}hr ${mins % 60}m`;
        const days = Math.floor(hrs / 24);
        return `${days}d ${hrs % 24}hr`;
      } catch { return ''; }
    };

    const BestCell = ({ pick, lineFmt, player, sur, fillBetForm, searchName, copiedName, setCopiedName, commence, worstPrice }) => {
      if (!pick) return <div className="best-cell"><span className="bc-line">—</span></div>;
      const { odd, book } = pick;
      const isSearchMatch = nameMatches(player, searchName);
      const oddsStr = odd.odds_american > 0 ? `+${odd.odds_american}` : `${odd.odds_american}`;
      const countdown = commence ? startsInCopy(commence) : '';
      const copyText = countdown ? `${BOOK_FULL_NAMES[book]} ${oddsStr} starts ${countdown}` : `${BOOK_FULL_NAMES[book]} ${oddsStr}`;
      const isCopied = copiedName === copyText;
      const isOutOfRange = isSearchMatch && worstPrice != null && odd.odds_american < worstPrice;
      return (
        <div className="best-cell" onClick={(e) => { e.stopPropagation(); if (isSearchMatch) { navigator.clipboard.writeText(copyText); setCopiedName(copyText); setTimeout(() => setCopiedName(null), 1500); } }} style={{background: isCopied ? 'rgba(34, 197, 94, 0.25)' : '', cursor: isSearchMatch ? 'pointer' : 'default'}}>
          <div className="bc-num">
            {lineFmt && odd.line != null && <span className="bc-line">{lineFmt(odd.line)}</span>}
            <span className="bc-odds green" style={{opacity: isSearchMatch ? 1 : 0.5, color: isCopied ? '#22c55e' : 'var(--text-primary)'}}>{isCopied ? '✓' : fmtOddsG(odd.odds_american)}</span>
            <span className="bc-limit">{getLimit(odd)}</span>
          </div>
          {BOOK_LOGOS[book] ? <img src={BOOK_LOGOS[book]} alt={BOOK_NAMES[book]} className="book-logo" /> : <div className="book-fallback">{BOOK_NAMES[book]}</div>}
          {isOutOfRange && <span className="out-of-range">OUT OF RANGE</span>}
        </div>
      );
    };

    const XpSection = ({ label, lo, ro, lName, rName, lSur, rSur, lineFmt, searchName, copiedName, setCopiedName, commence }) => {
      const books = BOOKMAKERS.filter(b => lo[b] || ro[b]);
      if (!books.length) return null;
      const bl = Math.max(...books.map(b => lo[b] ? lo[b].odds_american : -Infinity));
      const br = Math.max(...books.map(b => ro[b] ? ro[b].odds_american : -Infinity));
      const cellText = (odd) => {
        if (!odd) return '—';
        const o = fmtOddsG(odd.odds_american);
        return lineFmt && odd.line != null ? `${lineFmt(odd.line)} ${o}` : o;
      };
      const lIsSearchMatch = nameMatches(lName, searchName);
      const rIsSearchMatch = nameMatches(rName, searchName);
      const countdown = commence ? startsInCopy(commence) : '';
      const buildCopyText = (odd, book) => {
        const oddsStr = odd.odds_american > 0 ? `+${odd.odds_american}` : `${odd.odds_american}`;
        return countdown ? `${BOOK_FULL_NAMES[book]} ${oddsStr} starts ${countdown}` : `${BOOK_FULL_NAMES[book]} ${oddsStr}`;
      };
      const copyOdds = (odd, book) => {
        const text = buildCopyText(odd, book);
        navigator.clipboard.writeText(text);
        setCopiedName(text);
        setTimeout(() => setCopiedName(null), 1500);
        return text;
      };
      return (
        <div>
          <div className="xp-label">{label}</div>
          {books.map(book => {
            const h = lo[book], a = ro[book];
            const hCopyText = h ? buildCopyText(h, book) : null;
            const aCopyText = a ? buildCopyText(a, book) : null;
            const hIsCopied = copiedName && hCopyText === copiedName;
            const aIsCopied = copiedName && aCopyText === copiedName;
            return (
              <div key={book} className="book-row">
                <div className={`odds-cell${h && h.odds_american === bl ? ' best' : ''}`} onClick={(e) => { e.stopPropagation(); if (lIsSearchMatch && h) copyOdds(h, book); }} style={{cursor: lIsSearchMatch && h ? 'pointer' : 'default', opacity: lIsSearchMatch ? 1 : 0.5, background: hIsCopied ? 'rgba(34, 197, 94, 0.25)' : ''}}>
                  <div className="cell-odds" style={{color: hIsCopied ? '#22c55e' : ''}}>{hIsCopied ? '✓' : cellText(h)}</div>
                  <div className="cell-limit">{getLimit(h)}</div>
                </div>
                <div className="book-mid">
                  {BOOK_LOGOS[book] ? <img src={BOOK_LOGOS[book]} alt={BOOK_NAMES[book]} className="book-logo" /> : <div className="book-fallback">{BOOK_NAMES[book]}</div>}
                </div>
                <div className={`odds-cell${a && a.odds_american === br ? ' best' : ''}`} onClick={(e) => { e.stopPropagation(); if (rIsSearchMatch && a) copyOdds(a, book); }} style={{cursor: rIsSearchMatch && a ? 'pointer' : 'default', opacity: rIsSearchMatch ? 1 : 0.5, background: aIsCopied ? 'rgba(34, 197, 94, 0.25)' : ''}}>
                  <div className="cell-odds" style={{color: aIsCopied ? '#22c55e' : ''}}>{aIsCopied ? '✓' : cellText(a)}</div>
                  <div className="cell-limit">{getLimit(a)}</div>
                </div>
              </div>
            );
          })}
        </div>
      );
    };

    const TennisSportsbookScreen = () => {
      const [apiKey, setApiKey] = useState(() => {
        try { return localStorage.getItem('parlay_api_key') || ''; } catch { return ''; }
      });
      const [matches, setMatches] = useState([]);
      const [loading, setLoading] = useState(false);
      const [searchName, setSearchName] = useState('');
      const [error, setError] = useState('');
      const [lastUpdate, setLastUpdate] = useState('');
      const [booksFound, setBooksFound] = useState([]);
      const [debugInfo, setDebugInfo] = useState('');
      const [tab, setTab] = useState('odds');
      const [copiedName, setCopiedName] = useState(null);
      const [showApiInput, setShowApiInput] = useState(false);
      const [headerExpanded, setHeaderExpanded] = useState(true);
      const autoCollapsedRef = useRef(false);
      const [expanded, setExpanded] = useState({});
      const [bets, setBets] = useState(() => {
        try { return JSON.parse(localStorage.getItem('tennis_bets')) || []; } catch { return []; }
      });
      const [betForm, setBetForm] = useState({ player: '', odds: '', amount: '', book: 'pinnacle', result: 'win' });
      const [suggestions, setSuggestions] = useState([]);
      const [worstPrice, setWorstPrice] = useState(null);
      const [pasteCopied, setPasteCopied] = useState(null);
      const [prices, setPrices] = useState([]);
      const [modalOpen, setModalOpen] = useState(false);
      const searchInputRef = useRef(null);
      const focusedCardRef = useRef(null);
      const headerRef = useRef(null);
      const [headerH, setHeaderH] = useState(150);
      useEffect(() => {
        const upd = () => { if (headerRef.current) setHeaderH(headerRef.current.offsetHeight); };
        upd();
        window.addEventListener('resize', upd);
        return () => window.removeEventListener('resize', upd);
      });

      useEffect(() => {
        if (matches.length > 0 && !autoCollapsedRef.current) {
          autoCollapsedRef.current = true;
          setHeaderExpanded(false);
        }
      }, [matches.length]);

      useEffect(() => {
        if (searchName.trim() && focusedCardRef.current) {
          const doScroll = () => {
            if (focusedCardRef.current && typeof focusedCardRef.current.scrollIntoView === 'function') {
              focusedCardRef.current.scrollIntoView({ behavior: 'smooth', block: 'end' });
            }
          };
          if (typeof requestAnimationFrame === 'function') {
            requestAnimationFrame(doScroll);
          } else {
            setTimeout(doScroll, 0);
          }
        }
      }, [searchName, matches.length]);

      const idbOpen = () => new Promise((res, rej) => {
        const r = indexedDB.open('tennisapp', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      });
      const idbGet = async (k) => { try { const db = await idbOpen(); return await new Promise(res => { const t = db.transaction('kv').objectStore('kv').get(k); t.onsuccess = () => res(t.result); t.onerror = () => res(null); }); } catch { return null; } };
      const idbSet = async (k, v) => { try { const db = await idbOpen(); await new Promise(res => { const t = db.transaction('kv', 'readwrite').objectStore('kv').put(v, k); t.onsuccess = res; t.onerror = res; }); } catch {} };

      useEffect(() => {
        if (!apiKey) idbGet('parlay_api_key').then(v => { if (v) setApiKey(v); });
        if (!bets.length) idbGet('tennis_bets').then(v => { if (v && v.length) setBets(v); });
      }, []);

      useEffect(() => {
        if (!apiKey) return;
        try { localStorage.setItem('parlay_api_key', apiKey); } catch (e) {}
        idbSet('parlay_api_key', apiKey);
      }, [apiKey]);

      useEffect(() => {
        try { localStorage.setItem('tennis_bets', JSON.stringify(bets)); } catch (e) {}
        idbSet('tennis_bets', bets);
      }, [bets]);

      const handleSearchChange = (val) => {
        setSearchName(val);
        if (val.trim().length > 0) {
          const playerNames = new Set();
          matches.forEach(m => {
            playerNames.add(m.home);
            playerNames.add(m.away);
          });
          const filtered = Array.from(playerNames)
            .filter(name => nameMatches(name, val))
            .sort();
          
          const suggestionsWithOdds = filtered.map(name => {
            const playerOdds = prices.filter(p => p.selection === name && p.market_type === 'moneyline');
            const bestOdds = playerOdds.length > 0 ? Math.max(...playerOdds.map(o => o.odds_american)) : null;
            const bookCount = new Set(playerOdds.map(o => o.sportsbook)).size;
            return { name, bestOdds, bookCount };
          });
          
          setSuggestions(suggestionsWithOdds);
        } else {
          setSuggestions([]);
        }
      };

      const handleSuggestionClick = (suggestion) => {
        const playerName = typeof suggestion === 'string' ? suggestion : suggestion.name;
        setSearchName(playerName);
        setSuggestions([]);
        fetchOdds(true);
      };

      const clearSearch = (e) => {
        e.preventDefault();
        setSearchName('');
        setSuggestions([]);
        setWorstPrice(null);
        if (searchInputRef.current) searchInputRef.current.focus();
      };

      const handleSearchPaste = (e) => {
        const text = e.clipboardData.getData('text');
        if (!text || (!text.includes('\n') && !/worst\s*price/i.test(text))) return;
        const parsed = parsePastedPick(text);
        if (parsed) {
          e.preventDefault();
          setSearchName(parsed.player);
          setWorstPrice(parsed.worstPrice);

          const playerNames = new Set();
          matches.forEach(m => {
            playerNames.add(m.home);
            playerNames.add(m.away);
          });
          const filtered = Array.from(playerNames)
            .filter(name => nameMatches(name, parsed.player))
            .sort();
          const suggestionsWithOdds = filtered.map(name => {
            const playerOdds = prices.filter(p => p.selection === name && p.market_type === 'moneyline');
            const bestOdds = playerOdds.length > 0 ? Math.max(...playerOdds.map(o => o.odds_american)) : null;
            const bookCount = new Set(playerOdds.map(o => o.sportsbook)).size;
            return { name, bestOdds, bookCount };
          });
          setSuggestions(suggestionsWithOdds);

          // Auto-copy Pinnacle's price (never a different book, even if another book is better) when in range
          if (parsed.worstPrice != null) {
            const exactName = filtered.find(name => name.toLowerCase() === parsed.player.toLowerCase()) || filtered[0];
            const pinnacleOdds = prices.find(p => p.selection === exactName && p.market_type === 'moneyline' && p.sportsbook === 'pinnacle');
            if (pinnacleOdds && pinnacleOdds.odds_american >= parsed.worstPrice) {
              const oddsStr = pinnacleOdds.odds_american > 0 ? `+${pinnacleOdds.odds_american}` : `${pinnacleOdds.odds_american}`;
              const match = matches.find(m => m.home === exactName || m.away === exactName);
              const countdown = match ? startsInCopy(match.commence) : '';
              const copyText = countdown ? `Pinnacle ${oddsStr} starts ${countdown}` : `Pinnacle ${oddsStr}`;
              navigator.clipboard.writeText(copyText);
              setPasteCopied(copyText);
              setTimeout(() => setPasteCopied(null), 1600);
            }
          }

          fetchOdds(true);
        }
      };

      const fetchingRef = useRef(false);
      const lastDataRef = useRef('');
      const bootRetryRef = useRef(0);
      
      const fetchOdds = async (silent = false) => {
        const trimmedKey = apiKey.trim();
        if (!trimmedKey) { if (!silent) setError('Enter your ParalayAPI key first'); return; }
        if (fetchingRef.current) return;
        if (silent && modalOpen) return;
        fetchingRef.current = true;
        if (!silent) setLoading(true);
        setError('');
        try {
          const sleep = (ms) => new Promise(r => setTimeout(r, ms));
          const fetchPage = async (url) => {
            let lastErr;
            for (let attempt = 0; attempt < 3; attempt++) {
              try {
                // URL already has apiKey from caller, don't re-add it
                console.log(`[fetch] attempt ${attempt + 1}: ${url.slice(0, 80)}...`);
                const response = await fetch(url);
                console.log(`[fetch] status ${response.status}`);
                if (response.status === 429) { await sleep(1200); lastErr = new Error('Rate limited'); continue; }
                if (!response.ok && response.status >= 500) { await sleep(500 * (attempt + 1)); lastErr = new Error(`HTTP ${response.status}`); continue; }
                if (!response.ok) {
                  const text = await response.text().catch(() => '(no body)');
                  throw new Error(`HTTP ${response.status}: ${text.slice(0, 100)}`);
                }
                const data = await response.json();
                console.log(`[fetch] success, got response`);
                return data;
              } catch (err) {
                console.log(`[fetch] error:`, err.message);
                lastErr = err;
                await sleep(500 * (attempt + 1));
              }
            }
            throw lastErr;
          };

          const fetchTennisSport = async (sportKey) => {
            const url = new URL(`https://parlay-api.com/v1/sports/${sportKey}/odds`);
            url.searchParams.set('regions', 'us');
            url.searchParams.set('markets', 'h2h,spreads');
            // Don't filter by bookmakers - get all books
            console.log(`[${sportKey}] fetching all books...`);
            setDebugInfo(`fetching ${sportKey}...`);
            let data = await fetchPage(url.toString());
            
            if (!data || !data.events) {
              throw new Error(`${sportKey}: no events in response`);
            }
            if (!Array.isArray(data.events)) throw new Error(`${sportKey}: events not an array`);
            
            // Log what books are actually in the response
            const booksInResponse = Array.from(new Set(data.events.flatMap(e => e.bookmakers?.map(b => b.key) || [])));
            console.log(`[${sportKey}] got ${data.events.length} events from ${booksInResponse.length} books: ${booksInResponse.join(',')}`);
            return data.events;
          };

          let allEvents = [];
          const tennisSportKeys = ['tennis_atp', 'tennis_wta', 'tennis_atp_challenger', 'tennis_itf'];
          
          try {
            console.log('[tennis] fetching with rollup keys (EU region for Pinnacle)...');
            setDebugInfo('Fetching tennis odds with rollup keys...');
            
            // Query each tennis rollup key
            for (const sportKey of tennisSportKeys) {
              try {
                const oddUrl = new URL(`https://parlay-api.com/v1/sports/${sportKey}/odds`);
                oddUrl.searchParams.set('regions', 'eu,us');  // EU for Pinnacle, US for FanDuel, novig
                oddUrl.searchParams.set('markets', 'h2h');  // Only moneyline
                oddUrl.searchParams.set('bookmakers', BOOKMAKERS.join(','));  // Request specific books
                oddUrl.searchParams.set('apiKey', trimmedKey);
                console.log(`[${sportKey}] fetching odds...`);
                const data = await fetchPage(oddUrl.toString());
                console.log(`[${sportKey}] raw response:`, data);
                // ParalayAPI returns events array directly, not wrapped in .events
                if (Array.isArray(data) && data.length > 0) {
                  console.log(`[${sportKey}] got ${data.length} events`);
                  console.log(`[${sportKey}] books in response:`, Array.from(new Set(data.flatMap(e => e.bookmakers?.map(b => b.key) || []))).join(','));
                  allEvents = allEvents.concat(data);
                } else {
                  console.log(`[${sportKey}] no events found`);
                }
              } catch (err) {
                console.log(`[${sportKey}] failed: ${err.message}`);
              }
            }
          } catch (err) {
            console.log('[tennis] failed:', err.message);
          }
          
          if (!allEvents.length) throw new Error('No tennis odds found');

          // Flatten ParalayAPI response → odds-like shape for processing
          let allOdds = [];
          
          // Convert decimal odds to American
          const decimalToAmerican = (decimal) => {
            if (!decimal || decimal <= 1) return 0;
            if (decimal >= 2) {
              return Math.round((decimal - 1) * 100);
            } else {
              return Math.round(-100 / (decimal - 1));
            }
          };
          
          allEvents.forEach(event => {
            if (event.bookmakers && Array.isArray(event.bookmakers)) {
              event.bookmakers.forEach(book => {
                if (book.markets && Array.isArray(book.markets)) {
                  book.markets.forEach(market => {
                    if (market.outcomes && Array.isArray(market.outcomes)) {
                      market.outcomes.forEach(outcome => {
                        allOdds.push({
                          event_id: event.id || event.canonical_event_id || 'unknown',
                          event_start_time: event.commence_time,
                          league: event.sport_title || 'TENNIS',
                          sportsbook: book.key,
                          market_type: market.key === 'h2h' ? 'moneyline' : market.key === 'spreads' ? 'spread' : market.key,
                          selection: outcome.name,
                          odds_american: decimalToAmerican(outcome.price),
                          line: outcome.point || null,
                          is_main_line: true,
                          home_team: event.home_team,
                          away_team: event.away_team
                        });
                      });
                    }
                  });
                }
              });
            }
          });

          const normName = (name) => {
            const n = (name || '').trim();
            if (n.includes(',')) {
              const [last, first] = n.split(',').map(s => s.trim());
              return `${first} ${last}`.trim();
            }
            return n;
          };
          const surKey = (name) => {
            const parts = normName(name).toLowerCase().split(/\s+/);
            return parts[parts.length - 1] || '';
          };

          // Group by event
          const byEvent = {};
          allOdds.forEach(line => {
            if (!byEvent[line.event_id]) byEvent[line.event_id] = [];
            byEvent[line.event_id].push(line);
          });

          // Infer home/away from market outcomes
          Object.values(byEvent).forEach(rows => {
            const commence = rows[0].event_start_time || new Date().toISOString();
            const league = rows[0].league || 'TENNIS';
            
            // For h2h markets, try to extract player names
            const h2hRows = rows.filter(r => r.market_type === 'moneyline');
            const names = Array.from(new Set(h2hRows.map(r => r.selection))).sort();
            
            if (names.length >= 2) {
              const sur1 = surKey(names[0]);
              const sur2 = surKey(names[1]);
              const mKey = `${league}|${commence.slice(0, 10)}|${sur1}|${sur2}`;
              if (!byEvent[mKey]) {
                byEvent[mKey] = {
                  league,
                  commence,
                  key: mKey,
                  names: { [sur1]: names[0], [sur2]: names[1] },
                  odds: {},
                  isLive: false
                };
              }
            }
          });

          // Reorg into match format
          const matchArray = [];
          Object.values(byEvent).forEach(group => {
            if (!Array.isArray(group)) return; // Skip non-arrays (the match objects we created)
            
            // This is a raw odds array - extract event info
            const eventId = group[0].event_id;
            const commence = group[0].event_start_time || new Date().toISOString();
            const league = group[0].league || 'TENNIS';
            
            // Get player names from h2h outcomes
            const h2hLines = group.filter(r => r.market_type === 'moneyline');
            const players = Array.from(new Set(h2hLines.map(r => r.selection))).sort();
            if (players.length < 2) return;
            
            const sur1 = surKey(players[0]);
            const sur2 = surKey(players[1]);
            const home = players[0];
            const away = players[1];

            // Skip doubles matches (player names like "Player A / Player B")
            if (home.includes('/') || away.includes('/')) return;

            // Skip matches that have already started (no live matches shown)
            if (new Date(commence) <= new Date()) return;
            
            // Map odds by (book, market, sur)
            const odds = {};
            group.forEach(line => {
              if (!line.sportsbook || !line.market_type) return;
              const book = canonicalBook(line.sportsbook);
              const mkt = bucketMarket(line.market_type);
              const sur = surKey(line.selection);
              const key = `${book}_${mkt}_${sur}`;
              if (!odds[key]) odds[key] = line;
            });
            
            matchArray.push({
              league,
              commence,
              eventId,
              home,
              away,
              homeSur: sur1,
              awaySur: sur2,
              odds,
              isLive: false
            });
          });

          matchArray.sort((a, b) => new Date(a.commence) - new Date(b.commence));
          setError('');
          const dataStr = JSON.stringify(matchArray);
          if (dataStr !== lastDataRef.current) {
            lastDataRef.current = dataStr;
            setMatches(matchArray);
          }
          setBooksFound(Array.from(new Set(allOdds.map(l => l.sportsbook))).sort());
          const mlCount = allOdds.filter(l => l.market_type === 'moneyline').length;
          setDebugInfo(`${matchArray.length} matches shown (${allEvents.length} events fetched, ${mlCount} moneyline rows)`);
          setLastUpdate(new Date().toLocaleTimeString());
          setPrices(allOdds);
        } catch (err) {
          if (!silent) setError(err.message || 'Error fetching odds');
          if (matches.length === 0 && bootRetryRef.current < 4) {
            bootRetryRef.current += 1;
            setTimeout(() => fetchOddsRef.current(true), 2500);
          }
        } finally {
          fetchingRef.current = false;
          setLoading(false);
        }
      };

      const fetchOddsRef = useRef();
      fetchOddsRef.current = fetchOdds;

      const didAutoFetch = useRef(false);
      useEffect(() => {
        if (apiKey.trim() && !didAutoFetch.current) { didAutoFetch.current = true; fetchOdds(); }
      }, [apiKey]);

      useEffect(() => {
        // Auto-refresh and boot-retry disabled to prevent silent credit burns
        // const id = setInterval(() => fetchOddsRef.current(true), 30000);
        // const onVis = () => { if (!document.hidden) fetchOddsRef.current(true); };
        // document.addEventListener('visibilitychange', onVis);
        // return () => { clearInterval(id); document.removeEventListener('visibilitychange', onVis); };
      }, []);

      const logBet = (e) => {
        e.preventDefault();
        if (!betForm.player || !betForm.odds || !betForm.amount) { setError('Fill in player, odds, and amount'); return; }
        const newBet = { id: Date.now(), player: betForm.player, odds: parseFloat(betForm.odds), amount: parseFloat(betForm.amount), book: betForm.book, result: betForm.result, eventId: betForm.eventId, sur: betForm.sur, timestamp: new Date().toISOString() };
        setBets([...bets, newBet]);
        setBetForm({ player: '', odds: '', amount: '', book: 'pinnacle', result: 'pending', eventId: '', sur: '' });
        setModalOpen(false);
      };

      const profitFor = (odds, risked) => odds > 0 ? risked * odds / 100 : risked * 100 / Math.abs(odds);

      const calculateStats = () => {
        let wins = 0, losses = 0, pushes = 0, pending = 0, totalUnits = 0, totalReturned = 0;
        bets.forEach(bet => {
          if (bet.result === 'pending') { pending++; return; }
          const risked = bet.amount;
          let returned = 0;
          if (bet.result === 'win') { wins++; returned = risked + profitFor(bet.odds, risked); }
          else if (bet.result === 'loss') { losses++; returned = 0; }
          else { pushes++; returned = risked; }
          totalUnits += risked;
          totalReturned += returned;
        });
        const settled = wins + losses + pushes;
        const roi = totalUnits > 0 ? ((totalReturned - totalUnits) / totalUnits * 100).toFixed(1) : 0;
        const hitRate = settled > 0 ? ((wins / settled) * 100).toFixed(1) : 0;
        return { wins, losses, pushes, pending, total: bets.length, unitsPL: (totalReturned - totalUnits).toFixed(2), roi, hitRate };
      };

      const formatTime = (isoString) => {
        try {
          const d = new Date(isoString);
          const time = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
          const now = new Date();
          const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
          const gameDay = new Date(d.getFullYear(), d.getMonth(), d.getDate());
          const diffDays = Math.round((gameDay - today) / 86400000);
          if (diffDays === 0) return `Today ${time}`;
          if (diffDays === 1) return `Tmrw ${time}`;
          const day = d.toLocaleDateString('en-US', { weekday: 'short', month: 'numeric', day: 'numeric' });
          return `${day} ${time}`;
        } catch { return isoString; }
      };

      const startsIn = (isoString) => {
        try {
          const diff = new Date(isoString) - new Date();
          if (diff <= 0) return 'Started';
          const mins = Math.floor(diff / 60000);
          if (mins < 60) return `in ${mins}m`;
          const hrs = Math.floor(mins / 60);
          if (hrs < 24) return `in ${hrs}h ${mins % 60}m`;
          const days = Math.floor(hrs / 24);
          return `in ${days}d ${hrs % 24}h`;
        } catch { return ''; }
      };

      const filteredMatches = matches.filter(m => {
        if (!searchName.trim()) return true;
        return nameMatches(m.home, searchName) || nameMatches(m.away, searchName);
      });

      const getOddsForPlayer = (match, playerSur, market = 'moneyline') => {
        const odds = {};
        BOOKMAKERS.forEach(book => {
          const key = `${book}_${market}_${playerSur}`;
          const line = match.odds[key];
          if (line) odds[book] = line;
        });
        return odds;
      };

      const getBooksWithOdds = (match) => {
        const books = new Set();
        BOOKMAKERS.forEach(book => {
          if (Object.keys(match.odds).some(key => key.startsWith(book + '_'))) books.add(book);
        });
        return Array.from(books);
      };

      return (
        <div className="app-shell">
          <div className="app-scroll">
          <div className="header" ref={headerRef}>
            {headerExpanded ? (
              <>
                {showApiInput && (
                  <div className="input-group" style={{marginBottom: '8px'}}>
                    <input type="password" placeholder="ParalayAPI Key" value={apiKey} onChange={(e) => setApiKey(e.target.value)} />
                  </div>
                )}
                {!showApiInput && apiKey && (
                  <button onClick={() => setShowApiInput(true)} style={{background: 'rgba(34, 197, 94, 0.2)', border: '1px solid rgba(34, 197, 94, 0.3)', color: '#22c55e', padding: '6px 10px', borderRadius: '6px', fontSize: '11px', fontWeight: 600, marginBottom: '8px', cursor: 'pointer', textTransform: 'uppercase', letterSpacing: '0.3px'}}>
                    ✓ KEY SET
                  </button>
                )}
                {!showApiInput && !apiKey && (
                  <button onClick={() => setShowApiInput(true)} style={{background: 'rgba(var(--glass-rgb), 0.08)', border: '1px solid rgba(var(--glass-rgb), 0.15)', color: 'var(--text-dim)', padding: '6px 10px', borderRadius: '6px', fontSize: '11px', fontWeight: 600, marginBottom: '8px', cursor: 'pointer', textTransform: 'uppercase', letterSpacing: '0.3px'}}>
                    + ADD KEY
                  </button>
                )}
                <div style={{display: 'flex', gap: '6px', marginTop: '8px'}}>
                  <button className="load-btn" style={{flex: 1}} onClick={(e) => { e.preventDefault(); fetchOdds(); }}>
                    {loading ? 'Loading...' : 'Load Odds'}
                  </button>
                  <button className="load-btn" style={{background: 'linear-gradient(135deg, #a855f7 0%, #7c3aed 100%)', flex: 0.15, padding: '0'}} onClick={(e) => { e.preventDefault(); fetchOdds(); }} title="Refresh">
                    ↻
                  </button>
                </div>
                <div className="tab-bar">
                  <button className={`tab-btn ${tab === 'odds' ? 'active' : ''}`} onClick={() => setTab('odds')}>Odds</button>
                  {matches.length > 0 && <button onClick={() => setHeaderExpanded(false)} title="Collapse" style={{background: 'rgba(var(--glass-rgb), 0.08)', border: '1px solid rgba(var(--glass-rgb), 0.15)', color: 'var(--text-dim)', borderRadius: '20px', padding: '0 14px', fontSize: '14px', cursor: 'pointer'}}>
                    ⌃
                  </button>}
                </div>

                {matches.length > 0 && <div className="stats">{lastUpdate && <span>{lastUpdate}</span>}<span style={{color: 'var(--text-dim)'}}>parlay</span></div>}
                {booksFound.length > 0 && <div className="stats" style={{fontSize: '10px', color: 'var(--text-dim)'}}><span>API books: {booksFound.join(', ')}</span></div>}
                {debugInfo && <div className="stats" style={{fontSize: '10px', color: 'var(--text-dim)'}}><span>{debugInfo}</span></div>}
              </>
            ) : (
              <div className="header-collapsed" onClick={() => setHeaderExpanded(true)}>
                <span className="header-collapsed-info">{lastUpdate ? `Updated ${lastUpdate}` : 'Odds'}{matches.length > 0 ? ` • ${matches.length} matches` : ''}</span>
                <button onClick={(e) => { e.stopPropagation(); fetchOdds(); }} title="Refresh" className="header-collapsed-refresh">↻</button>
                <span className="header-collapsed-chevron">⌄</span>
              </div>
            )}
          </div>

          {error && <div className="error">⚠️ {error}</div>}


          {tab === 'odds' && loading && <div className="loading">Fetching tennis odds...</div>}

          {tab === 'odds' && filteredMatches.length === 0 && !loading && matches.length > 0 && <div className="empty">No matches found</div>}
          {tab === 'odds' && matches.length === 0 && !loading && <div className="empty">Enter API key and click Load</div>}

          {tab === 'odds' && <div className="matches-container">
            {filteredMatches.map((match, idx) => {
              const M = { ml: 'moneyline' };
              const oddsFor = (sur, mkt) => getOddsForPlayer(match, sur, mkt);
              const bestOf = (odds) => {
                let best = null, bestBook = null;
                BOOKMAKERS.forEach(b => { if (odds[b] && (!best || odds[b].odds_american > best.odds_american)) { best = odds[b]; bestBook = b; } });
                return best ? { odd: best, book: bestBook } : null;
              };
              const homeML = oddsFor(match.homeSur, M.ml), awayML = oddsFor(match.awaySur, M.ml);
              if (Object.keys(homeML).length + Object.keys(awayML).length === 0) return null;
              const nBooks = BOOKMAKERS.filter(b => homeML[b] || awayML[b]).length;
              const isOpen = !!expanded[match.eventId];
              const homeIsMatch = nameMatches(match.home, searchName);
              const awayIsMatch = nameMatches(match.away, searchName);
              const hasFocus = homeIsMatch || awayIsMatch;
              const primaryIsHome = homeIsMatch;
              const primaryName = primaryIsHome ? match.home : match.away;
              const primarySur = primaryIsHome ? match.homeSur : match.awaySur;
              const primaryML = primaryIsHome ? homeML : awayML;
              const opponentName = primaryIsHome ? match.away : match.home;
              return (
                <div key={match.eventId} className="match-card" ref={hasFocus ? focusedCardRef : null} onClick={() => setExpanded(prev => ({ ...prev, [match.eventId]: !prev[match.eventId] }))}>
                  <div className="mh-line"><span><span className="mh-time">{formatTime(match.commence)}</span> • {match.league}{new Date(match.commence) <= new Date() ? <span className="live-badge"><span className="live-dot"></span>LIVE</span> : <span className="starts-in">{startsIn(match.commence)}</span>}</span>{nBooks > 1 && <span className="book-count">{nBooks} books</span>}</div>
                  {hasFocus ? (
                    <div className="primary-pick">
                      <div className="name-band" style={{display: 'flex', justifyContent: 'center', alignItems: 'center', gap: '4px', marginBottom: '8px'}}>
                        <span>{primaryName}</span>
                        <button onClick={(e) => { e.stopPropagation(); navigator.clipboard.writeText(primaryName); setCopiedName(primaryName); setTimeout(() => setCopiedName(null), 1500); }} style={{background: 'none', border: 'none', color: copiedName === primaryName ? '#22c55e' : 'var(--text-dim)', fontSize: '12px', cursor: 'pointer', padding: '0 2px', display: 'flex', alignItems: 'center', opacity: copiedName === primaryName ? 1 : 0.6, transition: 'all 0.2s'}} title="Copy name">
                          {copiedName === primaryName ? '✓' : '🔗'}
                        </button>
                      </div>
                      <BestCell pick={bestOf(primaryML)} player={primaryName} sur={primarySur} searchName={searchName} copiedName={copiedName} setCopiedName={setCopiedName} commence={match.commence} worstPrice={worstPrice} />
                      <div className="vs-line"><span className="vs-word">vs.</span>{opponentName}</div>
                    </div>
                  ) : (
                  <div className="player-grid">
                    <div className="card-col">
                      <div className="name-band" style={{display: 'flex', justifyContent: 'center', alignItems: 'center', gap: '4px', marginBottom: '8px'}}>
                        <span>{match.home}</span>
                      </div>
                      <BestCell pick={bestOf(homeML)} player={match.home} sur={match.homeSur} searchName={searchName} copiedName={copiedName} setCopiedName={setCopiedName} commence={match.commence} worstPrice={worstPrice} />
                    </div>
                    <div className="card-col">
                      <div className="name-band" style={{display: 'flex', justifyContent: 'center', alignItems: 'center', gap: '4px', marginBottom: '8px'}}>
                        <span>{match.away}</span>
                      </div>
                      <BestCell pick={bestOf(awayML)} player={match.away} sur={match.awaySur} searchName={searchName} copiedName={copiedName} setCopiedName={setCopiedName} commence={match.commence} worstPrice={worstPrice} />
                    </div>
                  </div>
                  )}
                  {isOpen && (
                    <div className="expand-wrap">
                      <XpSection label="Moneyline" lo={homeML} ro={awayML} lName={match.home} rName={match.away} lSur={match.homeSur} rSur={match.awaySur} searchName={searchName} copiedName={copiedName} setCopiedName={setCopiedName} commence={match.commence} />
                    </div>
                  )}
                </div>
              );
            })}
          </div>}
          </div>

          {tab === 'odds' && matches.length > 0 && (
            <div className="search-bottom">
              {pasteCopied && <div className="paste-copied-toast">✓ Copied: {pasteCopied}</div>}
              <div className="input-group" style={{position: 'relative', marginBottom: '0', padding: '0'}}>
                <input ref={searchInputRef} type="text" style={{paddingLeft: '44px', paddingTop: '10px', paddingBottom: '10px', fontSize: '14px', fontWeight: 600}} placeholder="Search player..." value={searchName} onChange={(e) => handleSearchChange(e.target.value)} onPaste={handleSearchPaste} spellCheck="false" autoCorrect="off" autoCapitalize="off" autoComplete="off" />
                <button className={`clear-btn ${searchName ? 'show' : ''}`} onClick={clearSearch}>✕</button>
                {suggestions.length > 0 && <div className="autocomplete-list show" style={{bottom: '100%', top: 'auto', borderTop: '2px solid rgba(var(--glass-rgb), 0.2)', borderBottom: 'none', borderRadius: '12px 12px 0 0'}}>
                  {suggestions.map((suggestion, idx) => (
                    <div key={idx} className="autocomplete-item" onClick={() => handleSuggestionClick(suggestion)} style={{display: 'flex', alignItems: 'center', gap: '8px'}}><span>{suggestion.name || suggestion}</span><span style={{fontSize: '12px', color: '#22c55e', fontWeight: 700, fontFamily: "'JetBrains Mono', monospace"}}>{suggestion.bestOdds ? (suggestion.bestOdds > 0 ? '+' : '') + suggestion.bestOdds : '—'}{suggestion.bookCount ? ` (${suggestion.bookCount})` : ''}</span>{worstPrice != null && suggestion.bestOdds != null && suggestion.bestOdds < worstPrice && <span className="out-of-range" style={{marginLeft: '0', fontSize: '9px'}}>OUT OF RANGE</span>}</div>
                  ))}
                </div>}
              </div>
              <button className="load-btn" style={{background: 'linear-gradient(135deg, #a855f7 0%, #7c3aed 100%)', padding: '8px 12px', fontSize: '11px', width: '100%', marginTop: '6px'}} onClick={(e) => { e.preventDefault(); fetchOdds(); }} title="Refresh">
                ↻ REFRESH
              </button>
            </div>
          )}
        </div>
      );
    };

    ReactDOM.render(<TennisSportsbookScreen />, document.getElementById('root'));
  </script>
</body>
</html>
