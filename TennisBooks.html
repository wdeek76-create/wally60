<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tennis Sportsbook Screen</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      background-color: #0a0e27;
      color: #fff;
    }
    #root {
      min-height: 100vh;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const TennisSportsbookScreen = () => {
      const [apiKey, setApiKey] = useState(() => {
        // Load from localStorage on init
        try {
          return localStorage.getItem('sharpapi_key') || '';
        } catch {
          return '';
        }
      });
      const [matches, setMatches] = useState([]);
      const [loading, setLoading] = useState(false);
      const [searchName, setSearchName] = useState('');
      const [error, setError] = useState('');
      const [lastUpdate, setLastUpdate] = useState('');
      const [debugInfo, setDebugInfo] = useState('');

      const BOOKMAKERS = ['pinnacle', 'draftkings', 'fanduel', 'betmgm', 'novig', 'prophetx'];
      const BOOK_COLORS = {
        pinnacle: '#00a6d6',
        fanduel: '#a020f0',
        betonline: '#ff6b35',
        novig: '#ff1744',
        prophetx: '#00bfa5'
      };

      const BOOK_NAMES = {
        pinnacle: 'PIN',
        fanduel: 'FD',
        betonline: 'BEO',
        novig: 'NVG',
        prophetx: 'PHX'
      };

      const fetchOdds = async () => {
        if (!apiKey.trim()) {
          setError('Enter your SharpAPI key first');
          return;
        }

        setLoading(true);
        setError('');

        try {
          let allOdds = [];
          let cursor = null;
          let pageCount = 0;
          const maxPages = 5; // Get up to 5 pages (1000 results)

          // Paginate through results
          while (pageCount < maxPages) {
            const url = new URL('https://api.sharpapi.io/api/v1/odds');
            url.searchParams.set('sport', 'tennis');
            url.searchParams.set('sportsbook', BOOKMAKERS.join(','));
            url.searchParams.set('limit', '200');
            if (cursor) url.searchParams.set('cursor', cursor);

            console.log(`Fetching page ${pageCount + 1}...`);
            
            const response = await fetch(url.toString(), {
              headers: { 'X-API-Key': apiKey }
            });

            if (!response.ok) {
              let errText = '';
              try {
                errText = await response.text();
              } catch (e) {}
              if (response.status === 401) throw new Error('401: Invalid API key');
              if (response.status === 403) throw new Error('403: Subscription tier too low - need Sharp tier for Pinnacle');
              throw new Error(`HTTP ${response.status}: ${errText.substring(0, 150)}`);
            }

            const data = await response.json();
            
            if (!data.data || !Array.isArray(data.data)) {
              throw new Error('Invalid response format');
            }

            allOdds = allOdds.concat(data.data);
            console.log(`Page ${pageCount + 1}: got ${data.data.length} rows, total now: ${allOdds.length}`);

            // Check if there are more pages
            if (!data.pagination?.has_more) {
              break;
            }
            cursor = data.pagination.next_cursor;
            pageCount++;
          }

          console.log(`Total odds rows fetched: ${allOdds.length}`);
          
          // Parse SharpAPI response - group by event
          const grouped = {};
          
          allOdds.forEach(line => {
            const matchKey = `${line.home_team}_${line.away_team}_${line.event_id}`;
            if (!grouped[matchKey]) {
              grouped[matchKey] = {
                home: line.home_team,
                away: line.away_team,
                league: line.league ? line.league.toUpperCase() : 'TENNIS',
                commence: line.event_start_time || new Date().toISOString(),
                odds: {}
              };
            }
            const key = `${line.sportsbook}_${line.market_type}`;
            grouped[matchKey].odds[key] = line;
          });

          const matchArray = Object.values(grouped)
            .filter(m => m.home && m.away)
            .sort((a, b) => new Date(a.commence) - new Date(b.commence));

          setMatches(matchArray);
          setLastUpdate(new Date().toLocaleTimeString());
        } catch (err) {
          console.error('Error:', err);
          setError(err.message || 'Unknown error');
        } finally {
          setLoading(false);
        }
      };

      // Auto-refresh every 30 seconds
      useEffect(() => {
        if (apiKey && matches.length > 0) {
          const interval = setInterval(fetchOdds, 30000);
          return () => clearInterval(interval);
        }
      }, [apiKey]);

      // Save API key to localStorage whenever it changes
      useEffect(() => {
        try {
          if (apiKey) {
            localStorage.setItem('sharpapi_key', apiKey);
          }
        } catch (e) {
          console.error('Failed to save API key:', e);
        }
      }, [apiKey]);

      // Filter matches by search
      const filteredMatches = matches.filter(m => {
        const searchLower = searchName.toLowerCase();
        return m.home.toLowerCase().includes(searchLower) || m.away.toLowerCase().includes(searchLower);
      });

      const getOddsForPlayer = (match, player, market = 'moneyline') => {
        const odds = {};
        BOOKMAKERS.forEach(book => {
          const key = `${book}_${market}`;
          const line = match.odds[key];
          if (line) {
            // Check if this line is for the correct player
            if (line.selection === player || line.home_team === player || line.away_team === player) {
              odds[book] = line;
            }
          }
        });
        return odds;
      };

      const formatTime = (isoString) => {
        const date = new Date(isoString);
        return date.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
      };

      return (
        <div style={{ minHeight: '100vh', backgroundColor: '#0a0e27', color: '#fff' }}>
          {/* Header */}
          <div style={{ padding: '16px', borderBottom: '1px solid #1a2038', backgroundColor: '#0f1229', position: 'sticky', top: 0, zIndex: 10 }}>
            <div style={{ display: 'flex', gap: '12px', marginBottom: '12px' }}>
              <input
                type="password"
                placeholder="SharpAPI Key"
                value={apiKey}
                onChange={(e) => setApiKey(e.target.value)}
                style={{
                  flex: 1,
                  padding: '10px 12px',
                  backgroundColor: '#1a2038',
                  border: '1px solid #2a3a5a',
                  borderRadius: '6px',
                  color: '#fff',
                  fontSize: '14px'
                }}
              />
              <button
                onClick={fetchOdds}
                disabled={loading}
                style={{
                  padding: '10px 16px',
                  backgroundColor: '#27c071',
                  border: 'none',
                  borderRadius: '6px',
                  color: '#000',
                  fontWeight: '600',
                  fontSize: '14px',
                  cursor: loading ? 'not-allowed' : 'pointer',
                  opacity: loading ? 0.6 : 1
                }}
              >
                {loading ? 'Loading...' : 'Load'}
              </button>
            </div>

            <div style={{ display: 'flex', gap: '8px', alignItems: 'center' }}>
              <input
                type="text"
                placeholder="Search player name..."
                value={searchName}
                onChange={(e) => setSearchName(e.target.value)}
                style={{
                  flex: 1,
                  padding: '8px 12px',
                  backgroundColor: '#1a2038',
                  border: '1px solid #2a3a5a',
                  borderRadius: '6px',
                  color: '#fff',
                  fontSize: '14px'
                }}
              />

              {matches.length > 0 && (
                <span style={{ fontSize: '12px', color: '#7a8aa8', whiteSpace: 'nowrap' }}>
                  {filteredMatches.length}/{matches.length} players
                </span>
              )}

              {lastUpdate && (
                <span style={{ fontSize: '11px', color: '#7a8aa8' }}>
                  {lastUpdate}
                </span>
              )}
            </div>
          </div>


          {error && (
            <div style={{ padding: '16px', backgroundColor: '#6b2c2c', color: '#ffcccc', fontSize: '16px', lineHeight: '1.5', whiteSpace: 'pre-wrap', wordBreak: 'break-word', minHeight: '60px', display: 'flex', alignItems: 'center' }}>
              ⚠️ {error}
            </div>
          )}

          {/* Matches */}
          <div style={{ padding: '8px 0' }}>
            {filteredMatches.length === 0 && !loading && (
              <div style={{ padding: '32px 16px', textAlign: 'center', color: '#7a8aa8' }}>
                {matches.length === 0 ? 'Load matches first' : 'No matches found'}
              </div>
            )}

            {filteredMatches.map((match, idx) => {
              const homeOdds = getOddsForPlayer(match, match.home);
              const awayOdds = getOddsForPlayer(match, match.away);
              const homeSpreads = getOddsForPlayer(match, match.home, 'spreads');
              const awaySpreads = getOddsForPlayer(match, match.away, 'spreads');

              return (
                <div key={idx} style={{ borderBottom: '1px solid #1a2038', padding: '12px 16px' }}>
                  {/* Match Header */}
                  <div style={{ marginBottom: '12px', fontSize: '13px', color: '#7a8aa8' }}>
                    {formatTime(match.commence)} · {match.league || 'TENNIS'}
                  </div>

                  {/* Home Player */}
                  <div style={{ marginBottom: '12px' }}>
                    <div style={{ fontWeight: '600', marginBottom: '8px', fontSize: '15px' }}>
                      {match.home}
                    </div>
                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(5, 1fr)', gap: '6px', marginBottom: '4px' }}>
                      {BOOKMAKERS.map(book => {
                        const odd = homeOdds[book];
                        return (
                          <div
                            key={book}
                            style={{
                              padding: '8px 6px',
                              backgroundColor: '#1a2038',
                              border: `1px solid ${BOOK_COLORS[book]}33`,
                              borderRadius: '4px',
                              textAlign: 'center',
                              fontSize: '12px',
                              fontWeight: '600',
                              color: odd ? '#fff' : '#4a5a7a'
                            }}
                          >
                            <div style={{ fontSize: '10px', color: '#7a8aa8', marginBottom: '2px' }}>
                              {BOOK_NAMES[book]}
                            </div>
                            {odd ? odd.odds_american : '—'}
                          </div>
                        );
                      })}
                    </div>
                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(5, 1fr)', gap: '6px' }}>
                      {BOOKMAKERS.map(book => {
                        const spread = homeSpreads[book];
                        return (
                          <div
                            key={`${book}_spread`}
                            style={{
                              padding: '6px 4px',
                              backgroundColor: '#1a2038',
                              border: `1px solid ${BOOK_COLORS[book]}22`,
                              borderRadius: '4px',
                              textAlign: 'center',
                              fontSize: '11px',
                              color: spread ? '#aaa' : '#4a5a7a'
                            }}
                          >
                            {spread ? (spread.line > 0 ? '+' : '') + spread.line : '—'}
                          </div>
                        );
                      })}
                    </div>
                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(5, 1fr)', gap: '6px', marginTop: '4px' }}>
                      {BOOKMAKERS.map(book => {
                        const odd = homeOdds[book];
                        let limit = '';
                        if (book === 'pinnacle' && odd?.max_bet) {
                          limit = `$${(odd.max_bet / 1000).toFixed(0)}k`;
                        } else if ((book === 'novig' || book === 'prophetx') && odd?.volume_24h) {
                          limit = `${(odd.volume_24h / 1000).toFixed(0)}k`;
                        }
                        return (
                          <div
                            key={`${book}_limit`}
                            style={{
                              padding: '4px 4px',
                              backgroundColor: '#1a2038',
                              border: `1px solid ${BOOK_COLORS[book]}15`,
                              borderRadius: '4px',
                              textAlign: 'center',
                              fontSize: '9px',
                              color: limit ? '#888' : 'transparent'
                            }}
                          >
                            {limit || '—'}
                          </div>
                        );
                      })}
                    </div>
                  </div>

                  {/* Away Player */}
                  <div>
                    <div style={{ fontWeight: '600', marginBottom: '8px', fontSize: '15px' }}>
                      {match.away}
                    </div>
                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(5, 1fr)', gap: '6px', marginBottom: '4px' }}>
                      {BOOKMAKERS.map(book => {
                        const odd = awayOdds[book];
                        return (
                          <div
                            key={book}
                            style={{
                              padding: '8px 6px',
                              backgroundColor: '#1a2038',
                              border: `1px solid ${BOOK_COLORS[book]}33`,
                              borderRadius: '4px',
                              textAlign: 'center',
                              fontSize: '12px',
                              fontWeight: '600',
                              color: odd ? '#fff' : '#4a5a7a'
                            }}
                          >
                            <div style={{ fontSize: '10px', color: '#7a8aa8', marginBottom: '2px' }}>
                              {BOOK_NAMES[book]}
                            </div>
                            {odd ? odd.odds_american : '—'}
                          </div>
                        );
                      })}
                    </div>
                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(5, 1fr)', gap: '6px' }}>
                      {BOOKMAKERS.map(book => {
                        const spread = awaySpreads[book];
                        return (
                          <div
                            key={`${book}_spread`}
                            style={{
                              padding: '6px 4px',
                              backgroundColor: '#1a2038',
                              border: `1px solid ${BOOK_COLORS[book]}22`,
                              borderRadius: '4px',
                              textAlign: 'center',
                              fontSize: '11px',
                              color: spread ? '#aaa' : '#4a5a7a'
                            }}
                          >
                            {spread ? (spread.line > 0 ? '+' : '') + spread.line : '—'}
                          </div>
                        );
                      })}
                    </div>
                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(5, 1fr)', gap: '6px', marginTop: '4px' }}>
                      {BOOKMAKERS.map(book => {
                        const odd = awayOdds[book];
                        let limit = '';
                        if (book === 'pinnacle' && odd?.max_bet) {
                          limit = `$${(odd.max_bet / 1000).toFixed(0)}k`;
                        } else if ((book === 'novig' || book === 'prophetx') && odd?.volume_24h) {
                          limit = `${(odd.volume_24h / 1000).toFixed(0)}k`;
                        }
                        return (
                          <div
                            key={`${book}_limit`}
                            style={{
                              padding: '4px 4px',
                              backgroundColor: '#1a2038',
                              border: `1px solid ${BOOK_COLORS[book]}15`,
                              borderRadius: '4px',
                              textAlign: 'center',
                              fontSize: '9px',
                              color: limit ? '#888' : 'transparent'
                            }}
                          >
                            {limit || '—'}
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    };

    ReactDOM.render(<TennisSportsbookScreen />, document.getElementById('root'));
  </script>
</body>
</html>
