<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Prop Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #05070b; color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; line-height: 1.4; }
    html, body, #root { height: 100%; }

    .container { max-width: 460px; margin: 0 auto; background: #05070b; min-height: 100vh; }
    
    .header { background: linear-gradient(135deg, rgba(10, 14, 21, 0.9) 0%, rgba(15, 20, 30, 0.85) 100%); backdrop-filter: blur(20px); border-bottom: 2px solid rgba(255, 255, 255, 0.1); padding: 12px; position: sticky; top: 0; z-index: 100; }
    .api-toggle { display: flex; gap: 6px; margin-bottom: 8px; }
    .api-btn { padding: 6px 10px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: #ccc; border-radius: 6px; font-size: 11px; fontWeight: 600; cursor: pointer; textTransform: uppercase; transition: all 0.2s; }
    .api-btn.set { background: rgba(39, 192, 113, 0.2); border-color: rgba(39, 192, 113, 0.4); color: #27c071; }
    .api-btn:hover { background: rgba(255,255,255,0.12); }

    .sport-tabs { display: flex; gap: 6px; }
    .sport-tab { flex: 1; padding: 10px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; text-transform: uppercase; color: #888; transition: all 0.2s; }
    .sport-tab.active { background: linear-gradient(135deg, rgba(39, 192, 113, 0.4) 0%, rgba(31, 168, 92, 0.3) 100%); border-color: rgba(39, 192, 113, 0.5); color: #27c071; }

    .sticky-search { position: sticky; top: 54px; z-index: 99; background: linear-gradient(180deg, rgba(5, 7, 11, 0.95) 0%, rgba(10, 14, 21, 0.85) 100%); backdrop-filter: blur(12px); padding: 10px 10px 8px; border-bottom: 2px solid rgba(255, 255, 255, 0.1); }
    .input-group { position: relative; margin-bottom: 0; }
    .input-group input { width: 100%; padding: 10px 32px 10px 12px; background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.15); border-radius: 10px; color: #fff; font-size: 14px; font-weight: 600; font-family: inherit; outline: none; }
    .input-group input::placeholder { color: #666; }
    .clear-btn { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #8b95a5; cursor: pointer; font-size: 16px; opacity: 0; transition: all 0.2s; }
    .clear-btn.show { opacity: 0.6; }
    .autocomplete-list { position: absolute; top: 100%; left: 0; right: 0; background: rgba(10, 14, 21, 0.95); border: 1px solid rgba(255,255,255,0.15); border-top: none; border-radius: 0 0 10px 10px; max-height: 200px; overflow-y: auto; display: none; z-index: 101; }
    .autocomplete-list.show { display: block; }
    .autocomplete-item { padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer; font-size: 13px; display: flex; justify-content: space-between; align-items: center; transition: background 0.15s; }
    .autocomplete-item:hover { background: rgba(39, 192, 113, 0.1); }
    .autocomplete-item span:last-child { font-size: 12px; color: #27c071; font-weight: 700; }

    .refresh-btn { width: 100%; padding: 8px 12px; background: linear-gradient(135deg, #3b9eff 0%, #1fa8d0 100%); border: 2px solid rgba(255, 255, 255, 0.2); border-radius: 8px; color: #000; font-weight: 700; font-size: 11px; cursor: pointer; font-family: inherit; text-transform: uppercase; margin-top: 6px; }

    .content { padding: 8px; display: flex; flex-direction: column; gap: 8px; }

    .prop-type-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; }
    .prop-tab { padding: 8px 12px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; white-space: nowrap; text-transform: uppercase; color: #888; transition: all 0.2s; }
    .prop-tab.active { background: linear-gradient(135deg, rgba(39, 192, 113, 0.4) 0%, rgba(31, 168, 92, 0.3) 100%); border-color: rgba(39, 192, 113, 0.5); color: #27c071; }

    .player-card { background: linear-gradient(135deg, rgba(15, 20, 35, 0.8) 0%, rgba(10, 14, 25, 0.7) 100%); border: 2px solid rgba(255, 255, 255, 0.1); border-radius: 12px; overflow: hidden; }
    .player-header { background: linear-gradient(90deg, rgba(5, 7, 11, 0.8) 0%, rgba(10, 14, 21, 0.7) 50%, rgba(5, 7, 11, 0.8) 100%); padding: 10px 12px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); font-size: 13px; font-weight: 900; text-transform: uppercase; display: flex; justify-content: space-between; align-items: center; }
    .player-name { flex: 1; }
    .player-copy { background: none; border: none; color: #8b95a5; font-size: 12px; cursor: pointer; margin-left: 6px; opacity: 0.6; transition: all 0.2s; }

    .books-container { padding: 0 8px 8px; }
    .book-row { display: grid; grid-template-columns: 1fr 100px 1fr; gap: 6px; margin-bottom: 6px; align-items: center; }
    .book-name { font-size: 10px; text-transform: uppercase; color: #888; font-weight: 700; text-align: center; }
    .odds-box { background: linear-gradient(135deg, rgba(39, 192, 113, 0.15) 0%, rgba(27, 36, 51, 0.7) 100%); border: 2px solid rgba(255, 255, 255, 0.2); border-radius: 8px; padding: 8px 6px; text-align: center; cursor: pointer; transition: all 0.2s; }
    .odds-box:hover { background: linear-gradient(135deg, rgba(39, 192, 113, 0.25) 0%, rgba(27, 36, 51, 0.8) 100%); border-color: rgba(39, 192, 113, 0.6); }
    .odds-value { font-size: 14px; font-weight: 800; color: #fff; font-variant-numeric: tabular-nums; }
    .odds-line { font-size: 10px; color: #aaa; font-weight: 600; }

    .history-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: flex-end; z-index: 200; }
    .history-modal.open { display: flex; }
    .history-content { background: linear-gradient(135deg, rgba(10, 14, 39, 0.95) 0%, rgba(15, 25, 50, 0.9) 100%); width: 100%; border-radius: 20px 20px 0 0; padding: 24px; max-height: 80vh; overflow-y: auto; backdrop-filter: blur(20px); border-top: 2px solid rgba(255,255,255,0.2); }
    .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .history-title { font-size: 16px; font-weight: 900; text-transform: uppercase; }
    .history-close { background: none; border: none; color: #ccc; font-size: 24px; cursor: pointer; }
    .history-entry { padding: 12px; background: rgba(255,255,255,0.05); border-left: 3px solid rgba(39,192,113,0.4); margin-bottom: 8px; border-radius: 6px; }
    .history-entry-header { display: flex; justify-content: space-between; font-weight: 700; font-size: 12px; margin-bottom: 4px; }
    .history-entry-time { font-size: 11px; color: #888; }

    .bet-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: flex-end; z-index: 200; }
    .bet-modal.open { display: flex; }
    .bet-content { background: linear-gradient(135deg, rgba(10, 14, 39, 0.95) 0%, rgba(15, 25, 50, 0.9) 100%); width: 100%; border-radius: 20px 20px 0 0; padding: 24px; max-height: 80vh; overflow-y: auto; backdrop-filter: blur(20px); border-top: 2px solid rgba(255,255,255,0.2); }
    .bet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .bet-title { font-size: 16px; font-weight: 900; text-transform: uppercase; }
    .bet-close { background: none; border: none; color: #ccc; font-size: 24px; cursor: pointer; }
    .bet-form { display: flex; flex-direction: column; gap: 12px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-label { font-size: 11px; font-weight: 700; text-transform: uppercase; color: #aaa; }
    .form-input { padding: 10px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; color: #fff; font-family: inherit; font-size: 14px; }
    .form-input:focus { outline: none; background: rgba(255,255,255,0.12); border-color: rgba(39,192,113,0.5); }
    .movement-indicator { padding: 12px; border-radius: 8px; font-weight: 700; font-size: 12px; margin-top: 12px; text-align: center; text-transform: uppercase; }
    .movement-favorable { background: rgba(39, 192, 113, 0.2); color: #27c071; border: 2px solid rgba(39, 192, 113, 0.5); }
    .movement-against { background: rgba(214, 69, 69, 0.2); color: #d64545; border: 2px solid rgba(214, 69, 69, 0.5); }
    .movement-neutral { background: rgba(255,255,255,0.08); color: #aaa; border: 2px solid rgba(255,255,255,0.15); }

    .consensus-box { background: rgba(59, 158, 255, 0.1); border: 2px solid rgba(59, 158, 255, 0.3); padding: 12px; border-radius: 8px; margin-top: 12px; }
    .consensus-title { font-size: 10px; font-weight: 700; text-transform: uppercase; color: #3b9eff; margin-bottom: 8px; }
    .consensus-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid rgba(59, 158, 255, 0.2); font-size: 12px; }
    .consensus-row:last-child { border-bottom: none; }
    .consensus-label { color: #aaa; }
    .consensus-value { font-weight: 700; color: #3b9eff; }

    .loading { text-align: center; padding: 20px; color: #888; font-size: 13px; }
    .empty { text-align: center; padding: 20px; color: #666; font-size: 12px; }
    .error { background: rgba(214, 69, 69, 0.1); border: 2px solid rgba(214, 69, 69, 0.3); color: #ff6b6b; padding: 12px; border-radius: 8px; font-size: 12px; margin: 8px; }

    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .history-modal.open .history-content { animation: slideUp 0.3s ease; }
    .bet-modal.open .bet-content { animation: slideUp 0.3s ease; }

    @media (max-width: 480px) {
      .header { padding: 10px; }
      .sport-tab { font-size: 11px; padding: 8px; }
      .sticky-search { padding: 8px; top: 50px; }
      .odds-value { font-size: 13px; }
      .player-header { font-size: 12px; padding: 8px 10px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    const BOOKMAKERS = ['fanduel', 'draftkings', 'caesars', 'fliff', 'novig', 'kalshi', 'pinnacle'];
    const BOOK_NAMES = {
      fanduel: 'FD',
      draftkings: 'DK',
      caesars: 'CZR',
      fliff: 'FLIFF',
      novig: 'NOVIG',
      kalshi: 'KALSHI',
      pinnacle: 'PIN'
    };

    const getTennisBookmakers = () => ['fanduel', 'novig', 'pinnacle'];
    const getPropsBookmakers = () => BOOKMAKERS;

    const PropTracker = () => {
      const [apiKey, setApiKey] = useState(() => {
        try { return localStorage.getItem('parlay_api_key') || ''; } catch { return ''; }
      });
      const [sport, setSport] = useState('tennis');
      const [searchName, setSearchName] = useState('');
      const [suggestions, setSuggestions] = useState([]);
      const [players, setPlayers] = useState([]);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');
      const [selectedProp, setSelectedProp] = useState('pts');
      const [lineHistory, setLineHistory] = useState({});
      const [historyOpen, setHistoryOpen] = useState(false);
      const [historyKey, setHistoryKey] = useState('');
      const [betModalOpen, setBetModalOpen] = useState(false);
      const [selectedOdds, setSelectedOdds] = useState(null);
      const [betPrice, setBetPrice] = useState('');
      const [consensus, setConsensus] = useState({});
      const [showApiInput, setShowApiInput] = useState(false);
      const searchInputRef = useRef(null);

      const PROP_KEYS = {
        pts: 'player_points',
        reb: 'player_rebounds',
        ast: 'player_assists',
        '3p': 'player_threes',
        pra: 'player_pra'
      };

      const PROP_LABELS = { pts: 'Pts', reb: 'Reb', ast: 'Ast', '3p': '3P', pra: 'PRA' };

      useEffect(() => {
        try { localStorage.setItem('parlay_api_key', apiKey); } catch (e) {}
      }, [apiKey]);

      const fetchProps = async () => {
        const currentSport = sport; // Capture sport at time of fetch
        console.log('fetchProps called, sport:', currentSport, 'apiKey:', !!apiKey);
        if (!apiKey) { setError('Enter API key'); console.log('No API key'); return; }
        setLoading(true);
        setError('');
        setPlayers([]);
        setSuggestions([]);
        setSearchName('');
        setConsensus({});

        try {
          let allOdds = [];

          if (currentSport === 'tennis') {
            console.log('Fetching TENNIS odds...');
            // Tennis: use /odds with moneyline only, regions=eu,us for Pinnacle
            const keys = ['tennis_atp', 'tennis_wta', 'tennis_atp_challenger', 'tennis_itf'];
            const tennisBooksmakers = ['fanduel', 'novig', 'pinnacle'];
            
            for (const key of keys) {
              try {
                const url = `https://parlay-api.com/v1/sports/${key}/odds?regions=eu,us&markets=h2h&bookmakers=${tennisBooksmakers.join(',')}&apiKey=${apiKey}`;
                console.log(`Fetching ${key}...`);
                const res = await fetch(url);
                if (!res.ok) { console.log(`${key} returned ${res.status}`); continue; }
                const data = await res.json();
                if (Array.isArray(data)) { 
                  console.log(`${key} got ${data.length} events`);
                  allOdds = allOdds.concat(data); 
                }
              } catch (e) { console.log(`${key} error:`, e.message); }
            }
          } else if (currentSport === 'nba' || currentSport === 'wnba' || currentSport === 'ufc') {
            console.log(`Fetching ${currentSport.toUpperCase()} props...`);
            // Props: use /props endpoint (3 credits, all books + markets)
            const sportKey = currentSport === 'ufc' ? 'mma' : currentSport;
            try {
              const url = `https://parlay-api.com/v1/sports/${sportKey}/props?apiKey=${apiKey}`;
              console.log(`Props URL: ${url.substring(0, 60)}...`);
              const res = await fetch(url);
              if (!res.ok) throw new Error(`${sportKey} props failed: ${res.status}`);
              const data = await res.json();
              if (Array.isArray(data)) { 
                console.log(`${sportKey} props got ${data.length} events`);
                allOdds = data; 
              }
            } catch (e) {
              console.log(`Props fetch error:`, e.message);
              setError('Props fetch error: ' + e.message);
              setLoading(false);
              return;
            }
          }

          if (!allOdds.length) { 
            console.log('No data found for sport:', currentSport);
            setError('No data found'); 
            setLoading(false); 
            return; 
          }

          console.log('Processing', allOdds.length, 'events for', currentSport);
          const playerMap = {};
          allOdds.forEach(event => {
            if (event.bookmakers && Array.isArray(event.bookmakers)) {
              event.bookmakers.forEach(book => {
                if (book.markets && Array.isArray(book.markets)) {
                  book.markets.forEach(mkt => {
                    // For props, filter to selected prop only
                    if (currentSport !== 'tennis' && mkt.key !== PROP_KEYS[selectedProp]) return;
                    if (mkt.outcomes && Array.isArray(mkt.outcomes)) {
                      mkt.outcomes.forEach(outcome => {
                        const playerName = outcome.description || outcome.player_name || outcome.name || '';
                        if (!playerName) return;
                        if (!playerMap[playerName]) {
                          playerMap[playerName] = { name: playerName, books: {} };
                        }
                        if (!playerMap[playerName].books[book.key]) {
                          playerMap[playerName].books[book.key] = [];
                        }
                        playerMap[playerName].books[book.key].push({
                          line: outcome.point,
                          odds_american: Math.round((outcome.price - 1) * 100) || null,
                          odds_decimal: outcome.price,
                          event_id: event.id,
                          timestamp: new Date().toISOString()
                        });
                      });
                    }
                  });
                }
              });
            }
          });

          const playerList = Object.values(playerMap).sort((a, b) => a.name.localeCompare(b.name));
          console.log('Processed', playerList.length, 'players for', currentSport);
          setPlayers(playerList);

          // Fetch consensus data for props only
          if (currentSport !== 'tennis') {
            try {
              const consensusKey = currentSport === 'nba' ? 'nba' : currentSport === 'wnba' ? 'wnba' : 'mma';
              const consensusUrl = `https://parlay-api.com/v1/sports/${consensusKey}/consensus?apiKey=${apiKey}`;
              console.log('Fetching consensus for', consensusKey);
              const consensusRes = await fetch(consensusUrl);
              if (consensusRes.ok) {
                const consensusData = await consensusRes.json();
                if (Array.isArray(consensusData)) {
                  const consensusMap = {};
                  consensusData.forEach(row => {
                    const key = `${row.player || ''}-${row.market_key || ''}-${row.line || 0}`;
                    consensusMap[key] = row;
                  });
                  setConsensus(consensusMap);
                  console.log('Consensus entries:', Object.keys(consensusMap).length);
                }
              }
            } catch (e) {
              console.log('Consensus fetch error:', e);
            }
          }
        } catch (e) {
          console.log('Error:', e.message);
          setError('Error: ' + e.message);
        }
        setLoading(false);
      };

      const handleSearchChange = (val) => {
        setSearchName(val);
        if (val.trim().length > 1) {
          const filtered = players
            .filter(p => p.name.toUpperCase().includes(val.toUpperCase()))
            .slice(0, 5);
          setSuggestions(filtered.map(p => p.name));
        } else {
          setSuggestions([]);
        }
      };

      const handleSuggestionClick = (name) => {
        setSearchName(name);
        setSuggestions([]);
        if (searchInputRef.current) searchInputRef.current.blur();
      };

      const clearSearch = () => {
        setSearchName('');
        setSuggestions([]);
        if (searchInputRef.current) searchInputRef.current.focus();
      };

      const filteredPlayers = searchName.trim()
        ? players.filter(p => p.name.toUpperCase().includes(searchName.toUpperCase()))
        : players;

      const bestOdds = (bookOdds) => {
        if (!bookOdds || bookOdds.length === 0) return null;
        return bookOdds.reduce((best, curr) => {
          if (curr.odds_american === null) return best;
          if (best.odds_american === null) return curr;
          return curr.odds_american > best.odds_american ? curr : best;
        }, bookOdds[0]);
      };

      const recordHistory = (key, odds) => {
        setLineHistory(prev => ({
          ...prev,
          [key]: [...(prev[key] || []), odds]
        }));
      };

      const showHistory = (key) => {
        setHistoryKey(key);
        setHistoryOpen(true);
      };

      const showBetModal = (odds) => {
        setSelectedOdds(odds);
        setBetPrice('');
        setBetModalOpen(true);
      };

      const getMovement = () => {
        if (!selectedOdds || !betPrice) return null;
        const currentOdds = parseFloat(selectedOdds.odds_american);
        const yourOdds = parseFloat(betPrice);
        const diff = currentOdds - yourOdds;

        if (selectedOdds.odds_american > 0) {
          // Over odds: higher is better for you
          return diff > 0 ? 'favorable' : diff < 0 ? 'against' : 'neutral';
        } else {
          // Under odds: lower (more negative) is better for you
          return diff < 0 ? 'favorable' : diff > 0 ? 'against' : 'neutral';
        }
      };

      const getConsensusForOdds = (odds) => {
        if (!odds) return null;
        // Try to find consensus data matching this odds entry
        const propKey = PROP_KEYS[selectedProp];
        Object.entries(consensus).forEach(([key, data]) => {
          if (data.line === odds.line && data.market_key === propKey) {
            return data;
          }
        });
        return null;
      };

      return (
        <div className="container">
          <div className="header">
            <div className="api-toggle">
              {!apiKey || showApiInput ? (
                <input type="password" placeholder="ParalayAPI Key" value={apiKey} onChange={(e) => setApiKey(e.target.value)} style={{padding: '6px 10px', fontSize: '12px', borderRadius: '6px', border: '1px solid rgba(255,255,255,0.15)', background: 'rgba(255,255,255,0.08)', color: '#fff', fontFamily: 'inherit', flex: 1}} />
              ) : (
                <button className="api-btn set" onClick={() => setShowApiInput(true)}>✓ KEY SET</button>
              )}
            </div>
            <div className="sport-tabs">
              {['tennis', 'nba', 'wnba', 'ufc'].map(s => (
                <button key={s} className={`sport-tab ${sport === s ? 'active' : ''}`} onClick={() => { setSport(s); setPlayers([]); setSearchName(''); setSuggestions([]); setConsensus({}); if (s === 'tennis') setSelectedProp('tennis'); else setSelectedProp('pts'); }}>
                  {s.toUpperCase()}
                </button>
              ))}
            </div>
          </div>

          {(sport === 'nba' || sport === 'wnba') && (
            <div style={{padding: '8px', display: 'flex', gap: '6px', overflowX: 'auto', borderBottom: '1px solid rgba(255,255,255,0.1)'}}>
              {Object.entries(PROP_LABELS).map(([key, label]) => (
                <button key={key} className={`prop-tab ${selectedProp === key ? 'active' : ''}`} onClick={() => { setSelectedProp(key); setPlayers([]); setSearchName(''); setSuggestions([]); }}>
                  {label}
                </button>
              ))}
            </div>
          )}

          {filteredPlayers.length > 0 && (
            <div className="sticky-search">
              <div className="input-group">
                <input ref={searchInputRef} type="text" placeholder="Search player..." value={searchName} onChange={(e) => handleSearchChange(e.target.value)} />
                <button className={`clear-btn ${searchName ? 'show' : ''}`} onClick={clearSearch}>✕</button>
                {suggestions.length > 0 && (
                  <div className="autocomplete-list show">
                    {suggestions.map((name, idx) => (
                      <div key={idx} className="autocomplete-item" onClick={() => handleSuggestionClick(name)}>
                        <span>{name}</span>
                      </div>
                    ))}
                  </div>
                )}
              </div>
              <button className="refresh-btn" onClick={fetchProps}>↻ Refresh</button>
            </div>
          )}

          <div className="content">
            {error && <div className="error">⚠️ {error}</div>}
            {!loading && players.length === 0 && (
              <div style={{padding: '20px', textAlign: 'center'}}>
                <button className="refresh-btn" onClick={fetchProps} style={{marginTop: '0'}}>
                  LOAD ODDS
                </button>
                <div className="empty" style={{marginTop: '12px'}}>Enter API key above and click Load Odds</div>
              </div>
            )}
            {loading && <div className="loading">Fetching {sport.toUpperCase()}...</div>}

            {filteredPlayers.map(player => (
              <div key={player.name} className="player-card">
                <div className="player-header">
                  <span className="player-name">{player.name}</span>
                  <button className="player-copy" onClick={() => { navigator.clipboard.writeText(player.name); }}>🔗</button>
                </div>
                <div className="books-container">
                  {(sport === 'tennis' ? getTennisBookmakers() : getPropsBookmakers()).map(book => {
                    const bookOdds = player.books[book];
                    if (!bookOdds || bookOdds.length === 0) return null;
                    
                    // Sort by line for better display
                    const sorted = [...bookOdds].sort((a, b) => (a.line || 0) - (b.line || 0));
                    const mainline = sorted[0];
                    const altLines = sorted.slice(1);
                    
                    const key = `${player.name}-${book}-${selectedProp}`;
                    
                    return (
                      <div key={book}>
                        <div className="book-row">
                          <div className="odds-box" onClick={() => showBetModal(mainline)}>
                            <div className="odds-value">{mainline.odds_american > 0 ? '+' : ''}{mainline.odds_american}</div>
                            {mainline.line != null && <div className="odds-line">{mainline.line > 0 ? '+' : ''}{mainline.line}</div>}
                          </div>
                          <div className="book-name">{BOOK_NAMES[book]}</div>
                          <div style={{textAlign: 'center'}}>
                            <button style={{background: 'rgba(255,255,255,0.08)', border: '1px solid rgba(255,255,255,0.15)', color: '#aaa', padding: '6px 10px', borderRadius: '6px', fontSize: '11px', cursor: 'pointer', fontWeight: 700, textTransform: 'uppercase'}} onClick={() => showHistory(key)}>
                              📊
                            </button>
                          </div>
                        </div>
                        {sport !== 'tennis' && altLines.length > 0 && (
                          <div style={{paddingLeft: '8px', paddingRight: '8px', paddingBottom: '6px', display: 'flex', flexDirection: 'column', gap: '4px'}}>
                            {altLines.map((alt, idx) => (
                              <div key={idx} className="book-row" style={{marginBottom: '0'}}>
                                <div className="odds-box" onClick={() => showBetModal(alt)} style={{opacity: 0.7}}>
                                  <div className="odds-value" style={{fontSize: '12px'}}>{alt.odds_american > 0 ? '+' : ''}{alt.odds_american}</div>
                                  {alt.line != null && <div className="odds-line">{alt.line > 0 ? '+' : ''}{alt.line}</div>}
                                </div>
                                <div className="book-name" style={{fontSize: '9px', color: '#666'}}>ALT</div>
                                <div></div>
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            ))}
          </div>

          {/* HISTORY MODAL */}
          <div className={`history-modal ${historyOpen ? 'open' : ''}`} onClick={() => setHistoryOpen(false)}>
            <div className="history-content" onClick={(e) => e.stopPropagation()}>
              <div className="history-header">
                <div className="history-title">Line History</div>
                <button className="history-close" onClick={() => setHistoryOpen(false)}>✕</button>
              </div>
              {lineHistory[historyKey] ? (
                lineHistory[historyKey].map((entry, idx) => (
                  <div key={idx} className="history-entry">
                    <div className="history-entry-header">
                      <span>{entry.odds_american > 0 ? '+' : ''}{entry.odds_american}</span>
                      <span>{entry.line != null ? `O/U ${entry.line > 0 ? '+' : ''}${entry.line}` : ''}</span>
                    </div>
                    <div className="history-entry-time">{new Date(entry.timestamp).toLocaleTimeString()}</div>
                  </div>
                ))
              ) : (
                <div className="empty">No history yet</div>
              )}
            </div>
          </div>

          {/* BET MODAL */}
          <div className={`bet-modal ${betModalOpen ? 'open' : ''}`} onClick={() => setBetModalOpen(false)}>
            <div className="bet-content" onClick={(e) => e.stopPropagation()}>
              <div className="bet-header">
                <div className="bet-title">Check Line Movement</div>
                <button className="bet-close" onClick={() => setBetModalOpen(false)}>✕</button>
              </div>
              {selectedOdds && (
                <div className="bet-form">
                  <div className="form-group">
                    <div className="form-label">Current Line</div>
                    <div style={{padding: '10px', background: 'rgba(255,255,255,0.08)', borderRadius: '8px', fontWeight: 700}}>{selectedOdds.odds_american > 0 ? '+' : ''}{selectedOdds.odds_american}</div>
                  </div>
                  <div className="form-group">
                    <div className="form-label">Your Bet Price</div>
                    <input type="number" className="form-input" placeholder="e.g., -110" value={betPrice} onChange={(e) => setBetPrice(e.target.value)} />
                  </div>
                  {betPrice && (() => {
                    const movement = getMovement();
                    const messages = {
                      favorable: '✓ Line moved in your favor',
                      against: '✗ Line moved against you',
                      neutral: '= No movement'
                    };
                    return (
                      <div className={`movement-indicator movement-${movement}`}>
                        {messages[movement]}
                      </div>
                    );
                  })()}

                  {selectedOdds && (() => {
                    const propKey = PROP_KEYS[selectedProp];
                    const matchingConsensus = Object.values(consensus).find(
                      c => c.line === selectedOdds.line && c.market_key === propKey
                    );
                    if (!matchingConsensus) return null;
                    return (
                      <div className="consensus-box">
                        <div className="consensus-title">Market Consensus</div>
                        <div className="consensus-row">
                          <span className="consensus-label">Consensus</span>
                          <span className="consensus-value">{matchingConsensus.consensus_odds > 0 ? '+' : ''}{matchingConsensus.consensus_odds}</span>
                        </div>
                        <div className="consensus-row">
                          <span className="consensus-label">Best</span>
                          <span className="consensus-value">{matchingConsensus.best_odds?.price > 0 ? '+' : ''}{matchingConsensus.best_odds?.price} ({matchingConsensus.best_odds?.bookmaker})</span>
                        </div>
                        <div className="consensus-row">
                          <span className="consensus-label">Worst</span>
                          <span className="consensus-value">{matchingConsensus.worst_odds?.price > 0 ? '+' : ''}{matchingConsensus.worst_odds?.price} ({matchingConsensus.worst_odds?.bookmaker})</span>
                        </div>
                        <div className="consensus-row">
                          <span className="consensus-label">Spread</span>
                          <span className="consensus-value">{matchingConsensus.spread}</span>
                        </div>
                        <div className="consensus-row" style={{marginTop: '8px', paddingTop: '8px', borderTop: '1px solid rgba(59,158,255,0.2)'}}>
                          <span className="consensus-label">Books ({matchingConsensus.num_books}/{matchingConsensus.total_books})</span>
                          <span className="consensus-value">{Math.round(matchingConsensus.consensus_prob || 0)}%</span>
                        </div>
                      </div>
                    );
                  })()}
                </div>
              )}
            </div>
          </div>
        </div>
      );
    };

    ReactDOM.render(<PropTracker />, document.getElementById('root'));
  </script>
</body>
</html>
