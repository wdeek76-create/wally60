<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { background: linear-gradient(135deg, #0a0e27 0%, #1a2545 50%, #15192f 100%) fixed; min-height: 100vh; }
    body { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; background: transparent; color: #fff; }
    #root { min-height: 100vh; padding-bottom: 40px; overflow-y: auto; }
    .header { padding: 16px; position: fixed; top: 0; left: 0; right: 0; z-index: 100; border-bottom: 1px solid rgba(255, 255, 255, 0.05); background: linear-gradient(135deg, #0a0e27 0%, #15192f 100%); }
    .input-group { display: flex; gap: 8px; margin-bottom: 12px; position: relative; }
    .input-group input { flex: 1; padding: 12px 36px 12px 12px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 6px; color: #fff; font-size: 14px; font-family: inherit; }
    .input-group input::placeholder { color: #aaa; }
    .clear-btn { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); background: rgba(255, 255, 255, 0.12); border: none; color: #fff; cursor: pointer; font-size: 15px; font-weight: 700; line-height: 1; display: none; width: 26px; height: 26px; border-radius: 50%; align-items: center; justify-content: center; -webkit-tap-highlight-color: transparent; }
    .clear-btn.show { display: flex; }
    .clear-btn:active { color: #fff; }
    .load-btn { padding: 12px 16px; background: linear-gradient(135deg, #27c071 0%, #1fa85c 100%); border: none; border-radius: 6px; color: #000; font-weight: 700; font-size: 14px; cursor: pointer; font-family: inherit; box-shadow: 0 4px 12px rgba(39, 192, 113, 0.3); -webkit-tap-highlight-color: transparent; }
    .load-btn:active { opacity: 0.9; }
    .load-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .autocomplete-list { position: absolute; top: 100%; left: 0; right: 36px; background: rgba(20, 25, 45, 0.95); border: 1px solid rgba(255, 255, 255, 0.1); border-top: none; border-radius: 0 0 6px 6px; max-height: 200px; overflow-y: auto; z-index: 99; display: none; }
    .autocomplete-list.show { display: block; }
    .autocomplete-item { padding: 10px 12px; cursor: pointer; font-size: 13px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); transition: background 0.15s; -webkit-tap-highlight-color: transparent; }
    .autocomplete-item:active { background: rgba(39, 192, 113, 0.1); }
    .autocomplete-item:last-child { border-bottom: none; }
    .stats { display: flex; gap: 16px; font-size: 13px; color: #aaa; margin-top: 10px; }
    .stats-row { display: flex; gap: 20px; padding: 16px 12px; background: linear-gradient(135deg, rgba(39, 192, 113, 0.1) 0%, transparent 100%); border-bottom: 1px solid rgba(255, 255, 255, 0.05); border-radius: 6px; margin: 0 12px; font-size: 13px; }
    .stat-item { display: flex; flex-direction: column; gap: 4px; }
    .stat-label { color: #aaa; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; }
    .stat-value { color: #27c071; font-size: 18px; font-weight: 800; }
    .stat-value.negative { color: #ff6b6b; }
    .bet-history { padding: 12px; margin: 0 12px 12px; display: flex; flex-direction: column; gap: 6px; }
    .bet-item { padding: 12px; background: rgba(255, 255, 255, 0.02); border-left: 3px solid #27c071; border-radius: 4px; font-size: 12px; }
    .bet-item.loss { border-left-color: #ff6b6b; }
    .bet-item.push { border-left-color: #aaa; }
    .bet-item.pending { border-left-color: #f0c040; }
    .bet-item-header { display: flex; justify-content: space-between; margin-bottom: 6px; color: #fff; font-weight: 600; }
    .bet-item-detail { color: #aaa; font-size: 11px; line-height: 1.4; }
    .matches-container { padding: 10px; display: flex; flex-direction: column; gap: 10px; max-width: 460px; margin: 0 auto; width: 100%; }
    .match-card { background: linear-gradient(135deg, rgba(39, 192, 113, 0.08) 0%, rgba(20, 25, 45, 0.8) 100%); border: 1px solid rgba(39, 192, 113, 0.15); border-radius: 8px; padding: 12px; }
    .match-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); padding-bottom: 8px; }
    .match-info { flex: 1; }
    .match-time { font-size: 12px; color: #aaa; font-weight: 600; margin-bottom: 4px; }
    .match-league { font-size: 13px; color: #fff; font-weight: 800; letter-spacing: -0.3px; }
    .player-section { margin-bottom: 10px; }
    .player-section:last-child { margin-bottom: 0; }
    .player-name { font-size: 15px; font-weight: 800; margin-bottom: 6px; color: #fff; letter-spacing: -0.3px; }
    .odds-list { display: flex; flex-direction: column; gap: 5px; }
    .odds-row { display: flex; align-items: center; justify-content: space-between; padding: 6px 10px; background: rgba(255, 255, 255, 0.02); border-radius: 4px; border: 1px solid rgba(255, 255, 255, 0.05); cursor: pointer; transition: all 0.15s; -webkit-tap-highlight-color: transparent; }
    .odds-row:active { background: rgba(39, 192, 113, 0.1); border-color: rgba(39, 192, 113, 0.3); }
    .odds-left { display: flex; align-items: center; gap: 12px; flex: 1; }
    .book-name { font-size: 12px; color: #bbb; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; min-width: 45px; }
    .book-logo { width: 28px; height: 28px; object-fit: contain; border-radius: 5px; }
    .book-fallback { font-size: 10px; color: #bbb; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    .odds-center { flex: 1; display: flex; justify-content: center; align-items: center; gap: 6px; }
    .odds-value { font-size: 18px; font-weight: 900; color: #fff; font-family: 'SF Mono', 'Monaco', monospace; letter-spacing: -0.5px; }
    .odds-limit { font-size: 11px; color: #fff; font-weight: 800; }
    .odds-row.best { background: linear-gradient(90deg, rgba(39, 192, 113, 0.28) 0%, rgba(39, 192, 113, 0.06) 60%, transparent 100%); border-color: rgba(39, 192, 113, 0.5); }
    .error { background: rgba(220, 38, 38, 0.15); color: #ff9999; padding: 12px 16px; margin: 12px; border-radius: 6px; font-size: 13px; }
    .loading { text-align: center; color: #aaa; padding: 40px 20px; font-size: 14px; }
    .empty { text-align: center; color: #aaa; padding: 40px 20px; font-size: 14px; }
    
    /* MODAL */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7); z-index: 200; display: none; }
    .modal-overlay.open { display: flex; align-items: flex-end; }
    .modal-content { background: linear-gradient(135deg, #0a0e27 0%, #15192f 100%); width: 100%; border-radius: 16px 16px 0 0; padding: 20px; animation: slideUp 0.3s ease; max-height: 90vh; overflow-y: auto; }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); padding-bottom: 12px; }
    .modal-title { font-size: 16px; font-weight: 800; color: #fff; }
    .modal-close { background: none; border: none; color: #aaa; font-size: 24px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .modal-close:active { color: #fff; }
    .modal-form { display: flex; flex-direction: column; gap: 12px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-label { font-size: 12px; color: #aaa; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    .form-input { padding: 12px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 6px; color: #fff; font-size: 14px; font-family: inherit; }
    .form-input::placeholder { color: #aaa; }
    .form-select { padding: 12px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 6px; color: #fff; font-size: 14px; font-family: inherit; }
    .form-row { display: flex; gap: 8px; }
    .form-row .form-group { flex: 1; }
    .submit-btn { padding: 12px 16px; background: linear-gradient(135deg, #27c071 0%, #1fa85c 100%); border: none; border-radius: 6px; color: #000; font-weight: 700; font-size: 14px; cursor: pointer; font-family: inherit; margin-top: 8px; -webkit-tap-highlight-color: transparent; }
    .submit-btn:active { opacity: 0.9; }

    const { useState, useEffect, useRef } = React;

    const TennisSportsbookScreen = () => {
      const [apiKey, setApiKey] = useState(() => {
        try { return localStorage.getItem('sharpapi_key') || ''; } catch { return ''; }
      });
      const [matches, setMatches] = useState([]);
      const [loading, setLoading] = useState(false);
      const [searchName, setSearchName] = useState('');
      const [error, setError] = useState('');
      const [lastUpdate, setLastUpdate] = useState('');
      const [booksFound, setBooksFound] = useState([]);
      const [debugInfo, setDebugInfo] = useState('');
      const [bets, setBets] = useState(() => {
        try { return JSON.parse(localStorage.getItem('tennis_bets')) || []; } catch { return []; }
      });
      const [betForm, setBetForm] = useState({ player: '', odds: '', amount: '', book: 'pinnacle', result: 'win' });
      const [suggestions, setSuggestions] = useState([]);
      const [modalOpen, setModalOpen] = useState(false);
      const searchInputRef = useRef(null);
      const headerRef = useRef(null);
      const [headerH, setHeaderH] = useState(150);
      useEffect(() => {
        const upd = () => { if (headerRef.current) setHeaderH(headerRef.current.offsetHeight); };
        upd();
        window.addEventListener('resize', upd);
        return () => window.removeEventListener('resize', upd);
      });

      const BOOKMAKERS = ['betonline', 'prophetx', 'novig', 'fanduel', 'pinnacle'];
      const canonicalBook = (name) => {
        const n = (name || '').toLowerCase().replace(/[^a-z]/g, '');
        if (n.startsWith('betonline')) return 'betonline';
        if (n.startsWith('prophet')) return 'prophetx';
        if (n.startsWith('novig')) return 'novig';
        if (n.startsWith('fanduel')) return 'fanduel';
        if (n.startsWith('pinnacle') || n === 'pinny') return 'pinnacle';
        return n;

      };

      const handleSearchChange = (val) => {
        setSearchName(val);
        if (val.trim().length > 0) {
          const playerNames = new Set();
          matches.forEach(m => {
            playerNames.add(m.home);
            playerNames.add(m.away);
          });
          const filtered = Array.from(playerNames)
            .filter(name => name.toLowerCase().includes(val.toLowerCase()))
            .sort();
          setSuggestions(filtered);
        } else {
          setSuggestions([]);
        }
      };

      const handleSuggestionClick = (name) => {
        setSearchName(name);
        setSuggestions([]);
      };

      const clearSearch = (e) => {
        e.preventDefault();
        setSearchName('');
        setSuggestions([]);
        if (searchInputRef.current) searchInputRef.current.focus();
      };

      const fillBetForm = (player, oddValue, book, eventId, sur) => {
        setBetForm({ player, odds: oddValue || '', amount: '', book, result: 'pending', eventId: eventId || '', sur: sur || '' });
        setModalOpen(true);
      };

      const fetchingRef = useRef(false);
      const lastDataRef = useRef('');
      const fetchOdds = async (silent = false) => {
        if (!apiKey.trim()) { if (!silent) setError('Enter your SharpAPI key first'); return; }
        if (fetchingRef.current) return;
        if (silent && modalOpen) return;
        fetchingRef.current = true;
        if (!silent) setLoading(true);
        setError('');
        try {
          let allOdds = [], cursor = null;
          while (true) {
            const url = new URL('https://api.sharpapi.io/api/v1/odds');
            url.searchParams.set('sport', 'tennis');
            url.searchParams.set('sportsbook', BOOKMAKERS.join(','));
            url.searchParams.set('market', 'moneyline');
            url.searchParams.set('limit', '200');
            if (cursor) url.searchParams.set('cursor', cursor);
            const response = await fetch(url.toString(), { headers: { 'X-API-Key': apiKey } });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();
            if (!data.data || !Array.isArray(data.data)) throw new Error('Invalid response');
            allOdds = allOdds.concat(data.data);
            if (!data.pagination?.has_more) break;
            cursor = data.pagination.next_cursor;
          }
          const normName = (name) => {
            const n = (name || '').trim();
            if (n.includes(',')) {
              const [last, first] = n.split(',').map(s => s.trim());
              return `${first} ${last}`.trim();
            }
            return n;
          };
          const surKey = (name) => {
            const parts = normName(name).toLowerCase().split(/\s+/);
            return parts[parts.length - 1] || '';
          };
          // Group rows by real-world match: league + day + surname pair
          const grouped = {};
          allOdds.forEach(line => {
            if (line.selection_type !== 'home' && line.selection_type !== 'away') return;
            // Collect per event first to find the surname pair
            line._sur = surKey(line.selection);
          });
          const byEvent = {};
          allOdds.forEach(line => {
            if (!byEvent[line.event_id]) byEvent[line.event_id] = [];
            byEvent[line.event_id].push(line);
          });
          Object.values(byEvent).forEach(rows => {
            const surs = Array.from(new Set(rows.filter(r => r._sur).map(r => r._sur))).sort();
            const commence = rows[0].event_start_time || new Date().toISOString();
            const day = commence.slice(0, 10);
            const league = rows[0].league?.toUpperCase() || 'TENNIS';
            const mKey = `${league}|${day}|${surs.join('|')}`;
            if (!grouped[mKey]) grouped[mKey] = { league, commence, key: mKey, names: {}, odds: {} };
            const g = grouped[mKey];
            if (new Date(commence) < new Date(g.commence)) g.commence = commence;
            rows.forEach(line => {
              if (!line._sur) return;
              const disp = normName(line.selection);
              // Prefer longest non-comma display name per surname
              if (!g.names[line._sur] || disp.length > g.names[line._sur].length) g.names[line._sur] = disp;
              const key = `${canonicalBook(line.sportsbook)}_${line.market_type}_${line._sur}`;
              g.odds[key] = line;
            });
          });
          const preMerge = Object.values(grouped).map(g => {
            const surs = Object.keys(g.names).sort();
            return { league: g.league, commence: g.commence, eventId: g.key, home: g.names[surs[0]] || 'TBD', away: g.names[surs[1]] || 'TBD', homeSur: surs[0], awaySur: surs[1], odds: g.odds };
          }).filter(m => m.home !== 'TBD' && m.away && m.away !== 'TBD').sort((a, b) => new Date(a.commence) - new Date(b.commence));

          // Second pass: merge cards where player names contain each other (e.g. "Luis Carlos Alvarez" vs "Luis Carlos Alvarez Valdes")
          const tokenSet = n => new Set(normName(n).toLowerCase().split(/\s+/).filter(Boolean));
          const samePlayer = (a, b) => {
            if (!a || !b) return false;
            if (surKey(a) === surKey(b)) return true;
            const ta = tokenSet(a), tb = tokenSet(b);
            const [small, big] = ta.size <= tb.size ? [ta, tb] : [tb, ta];
            if (small.size < 2) return false;
            for (const t of small) { if (!big.has(t)) return false; }
            return true;
          };
          const matchArray = [];
          preMerge.forEach(m => {
            const target = matchArray.find(x => x.league === m.league && x.commence.slice(0, 10) === m.commence.slice(0, 10) && (
              (samePlayer(x.home, m.home) && samePlayer(x.away, m.away)) ||
              (samePlayer(x.home, m.away) && samePlayer(x.away, m.home))
            ));
            if (!target) { matchArray.push(m); return; }
            const crossed = !samePlayer(target.home, m.home);
            const surMap = crossed
              ? { [m.homeSur]: target.awaySur, [m.awaySur]: target.homeSur }
              : { [m.homeSur]: target.homeSur, [m.awaySur]: target.awaySur };
            Object.entries(m.odds).forEach(([k, v]) => {
              const parts = k.split('_');
              const sur = parts[parts.length - 1];
              parts[parts.length - 1] = surMap[sur] || sur;
              const nk = parts.join('_');
              if (!target.odds[nk]) target.odds[nk] = v;
            });
            const mHomeTarget = crossed ? 'away' : 'home';
            const mAwayTarget = crossed ? 'home' : 'away';
            if (m.home.length > target[mHomeTarget].length) target[mHomeTarget] = m.home;
            if (m.away.length > target[mAwayTarget].length) target[mAwayTarget] = m.away;
            if (new Date(m.commence) < new Date(target.commence)) target.commence = m.commence;
          });
          const dataStr = JSON.stringify(matchArray);
          if (dataStr !== lastDataRef.current) {
            lastDataRef.current = dataStr;
            setMatches(matchArray);
          }
          setBooksFound(Array.from(new Set(allOdds.map(l => l.sportsbook))).sort());
          const pinRows = allOdds.filter(l => canonicalBook(l.sportsbook) === 'pinnacle');
          const pinWithMax = pinRows.filter(l => l.max_bet != null);
          const sample = pinWithMax[0];
          setDebugInfo(`PIN rows: ${pinRows.length}, with max_bet: ${pinWithMax.length}${sample ? ` (e.g. ${sample.selection}: $${sample.max_bet})` : ''}`);
          setLastUpdate(new Date().toLocaleTimeString());
        } catch (err) {
          if (!silent) setError(err.message || 'Error fetching odds');
        } finally {
          fetchingRef.current = false;
          setLoading(false);
        }
      };

      const fetchOddsRef = useRef();
      fetchOddsRef.current = fetchOdds;

      useEffect(() => {
        if (apiKey.trim()) fetchOdds();
        const id = setInterval(() => fetchOddsRef.current(true), 30000);
        return () => clearInterval(id);
      }, []);

      const logBet = (e) => {
        e.preventDefault();
        if (!betForm.player || !betForm.odds || !betForm.amount) { setError('Fill in player, odds, and amount'); return; }
        const newBet = { id: Date.now(), player: betForm.player, odds: parseFloat(betForm.odds), amount: parseFloat(betForm.amount), book: betForm.book, result: betForm.result, eventId: betForm.eventId, sur: betForm.sur, timestamp: new Date().toISOString() };
        setBets([...bets, newBet]);
        setBetForm({ player: '', odds: '', amount: '', book: 'pinnacle', result: 'pending', eventId: '', sur: '' });
        setModalOpen(false);
      };

      const profitFor = (odds, risked) => odds > 0 ? risked * odds / 100 : risked * 100 / Math.abs(odds);

      const gradeBets = async () => {
        const pending = bets.filter(b => b.result === 'pending' && b.eventId);
        if (!pending.length) return;
        setDebugInfo('Grading...');
        const updated = [...bets];
        let graded = 0, msg = '';
        for (const bet of pending) {
          try {
            const resp = await fetch(`https://api.sharpapi.io/api/v1/events/${encodeURIComponent(bet.eventId)}`, { headers: { 'X-API-Key': apiKey.trim() } });
            if (!resp.ok) { msg = `event ${bet.eventId}: HTTP ${resp.status}`; continue; }
            const ev = (await resp.json()).data || {};
            const status = String(ev.status || ev.event_status || '').toLowerCase();
            if (!/final|complete|closed|finish|ended|settl/.test(status)) { msg = msg || `event status: ${status || 'unknown'}`; continue; }
            let winnerName = ev.winner || ev.winner_name || '';
            if (!winnerName && ev.home_score != null && ev.away_score != null) {
              winnerName = Number(ev.home_score) > Number(ev.away_score) ? (ev.home_team || '') : (ev.away_team || '');
            }
            if (!winnerName) { msg = msg || 'no winner field on event'; continue; }
            const won = winnerName.toLowerCase().includes(bet.sur) || bet.player.toLowerCase().includes(winnerName.toLowerCase());
            const idx = updated.findIndex(b => b.id === bet.id);
            if (idx >= 0) { updated[idx] = { ...updated[idx], result: won ? 'win' : 'loss' }; graded++; }
          } catch (err) { msg = err.message; }
        }
        setBets(updated);
        setDebugInfo(`Graded ${graded}/${pending.length}${msg ? ` — ${msg}` : ''}`);
      };

      const calculateStats = () => {
        let wins = 0, losses = 0, pushes = 0, pending = 0, totalUnits = 0, totalReturned = 0;
        bets.forEach(bet => {
          if (bet.result === 'pending') { pending++; return; }
          const risked = bet.amount;
          let returned = 0;
          if (bet.result === 'win') { wins++; returned = risked + profitFor(bet.odds, risked); }
          else if (bet.result === 'loss') { losses++; returned = 0; }
          else { pushes++; returned = risked; }
          totalUnits += risked;
          totalReturned += returned;
        });
        const settled = wins + losses + pushes;
        const roi = totalUnits > 0 ? ((totalReturned - totalUnits) / totalUnits * 100).toFixed(1) : 0;
        const hitRate = settled > 0 ? ((wins / settled) * 100).toFixed(1) : 0;
        return { wins, losses, pushes, pending, total: bets.length, unitsPL: (totalReturned - totalUnits).toFixed(2), roi, hitRate };
      };

      const formatMoney = (v) => {
        if (!v || v <= 0) return '';
        if (v >= 1000) return `$${(v / 1000).toFixed(1).replace(/\.0$/, '')}k`;
        return `$${Math.round(v)}`;
      };

      const getLimit = (odd) => {
        if (!odd) return '';
        if (odd.max_bet) return `Lim ${formatMoney(odd.max_bet)}`;
        if (odd.volume_24h) return `Liq ${formatMoney(odd.volume_24h)}`;
        if (odd.open_interest) return `Liq ${formatMoney(odd.open_interest)}`;
        if (odd.volume) return `Liq ${formatMoney(odd.volume)}`;
        return '';
      };

      const formatTime = (isoString) => {
        try {
          const d = new Date(isoString);
          const time = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
          const now = new Date();
          const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
          const gameDay = new Date(d.getFullYear(), d.getMonth(), d.getDate());
          const diffDays = Math.round((gameDay - today) / 86400000);
          if (diffDays === 0) return time;
          if (diffDays === 1) return `Tmrw ${time}`;
          const day = d.toLocaleDateString('en-US', { weekday: 'short', month: 'numeric', day: 'numeric' });
          return `${day} ${time}`;
        } catch { return isoString; }
      };

      const filteredMatches = matches.filter(m => {
        const s = searchName.toLowerCase();
        return m.home.toLowerCase().includes(s) || m.away.toLowerCase().includes(s);
      });

      const getOddsForPlayer = (match, playerSur, market = 'moneyline') => {
        const odds = {};
        BOOKMAKERS.forEach(book => {
          const key = `${book}_${market}_${playerSur}`;
          const line = match.odds[key];
          if (line) odds[book] = line;
        });
        return odds;
      };

      const orderedBooks = (match, odds) => {
        return getBooksWithOdds(match).sort((a, b) => {
          const oa = odds[a] ? odds[a].odds_american : -Infinity;
          const ob = odds[b] ? odds[b].odds_american : -Infinity;
          return ob - oa;
        });
      };

      const getBooksWithOdds = (match) => {
        const books = new Set();
        BOOKMAKERS.forEach(book => {
          if (Object.keys(match.odds).some(key => key.startsWith(book + '_'))) books.add(book);
        });
        return Array.from(books);
      };

      return (
        <div>
          <div className="header" ref={headerRef}>
            <div className="input-group">
              <input type="password" placeholder="SharpAPI Key" value={apiKey} onChange={(e) => setApiKey(e.target.value)} />
              <button className="load-btn" onClick={(e) => { e.preventDefault(); fetchOdds(); }}>
                {loading ? 'Loading...' : 'Load'}
              </button>
            </div>
            <div className="input-group" style={{position: 'relative'}}>
              <input ref={searchInputRef} type="text" style={{paddingLeft: '36px'}} placeholder="Search player name..." value={searchName} onChange={(e) => handleSearchChange(e.target.value)} spellCheck="false" autoCorrect="off" autoCapitalize="off" autoComplete="off" />
              <button className={`clear-btn ${searchName ? 'show' : ''}`} onClick={clearSearch}>✕</button>
              {suggestions.length > 0 && <div className="autocomplete-list show">
                {suggestions.map((name, idx) => (
                  <div key={idx} className="autocomplete-item" onClick={() => handleSuggestionClick(name)}>{name}</div>
                ))}
              </div>}
            </div>
            {matches.length > 0 && <div className="stats"><span>{filteredMatches.length}/{matches.length} matches</span>{lastUpdate && <span>{lastUpdate}</span>}</div>}
            {booksFound.length > 0 && <div className="stats" style={{fontSize: '10px', color: '#888'}}><span>API books: {booksFound.join(', ')}</span></div>}
            {debugInfo && <div className="stats" style={{fontSize: '10px', color: '#888'}}><span>{debugInfo}</span></div>}
          </div>
          <div style={{height: headerH}} />

          {error && <div className="error">⚠️ {error}</div>}

          {bets.length > 0 && (() => { const stats = calculateStats(); return (
            <div className="stats-row">
              <div className="stat-item"><div className="stat-label">Record</div><div className="stat-value">{stats.wins}-{stats.losses}</div></div>
              <div className="stat-item"><div className="stat-label">Hit Rate</div><div className="stat-value">{stats.hitRate}%</div></div>
              <div className="stat-item"><div className="stat-label">Units</div><div className={`stat-value ${stats.unitsPL < 0 ? 'negative' : ''}`}>{stats.unitsPL > 0 ? '+' : ''}{stats.unitsPL}</div></div>
              <div className="stat-item"><div className="stat-label">ROI</div><div className={`stat-value ${stats.roi < 0 ? 'negative' : ''}`}>{stats.roi > 0 ? '+' : ''}{stats.roi}%</div></div>
              {stats.pending > 0 && <div className="stat-item"><div className="stat-label">Pending</div><div className="stat-value"><button onClick={gradeBets} style={{background: 'none', border: '1px solid #27c071', color: '#27c071', borderRadius: '4px', padding: '2px 8px', fontSize: '12px', fontFamily: 'inherit'}}>Grade {stats.pending}</button></div></div>}
            </div>
          ); })()}

          {bets.length > 0 && (
            <div className="bet-history">
              {[...bets].reverse().map(bet => (
                <div key={bet.id} className={`bet-item ${bet.result}`}>
                  <div className="bet-item-header"><span>{bet.player}</span><span>{bet.result === 'win' ? '+' : bet.result === 'loss' ? '-' : ''}{bet.amount}</span></div>
                  <div className="bet-item-detail">{bet.odds > 0 ? '+' : ''}{bet.odds} @ {bet.book} • {new Date(bet.timestamp).toLocaleDateString()}</div>
                </div>
              ))}
            </div>
          )}

          {loading && <div className="loading">Fetching tennis odds...</div>}
          {filteredMatches.length === 0 && !loading && <div className="empty">{matches.length === 0 ? 'Enter API key and click Load' : 'No matches found'}</div>}

          <div className="matches-container">
            {filteredMatches.map((match, idx) => {
              const homeOdds = getOddsForPlayer(match, match.homeSur);
              const awayOdds = getOddsForPlayer(match, match.awaySur);
              return (
                <div key={match.eventId} className="match-card">
                  <div className="match-header">
                    <div className="match-info">
                      <div className="match-time">{formatTime(match.commence)}</div>
                      <div className="match-league">{match.league}</div>
                    </div>
                  </div>

                  <div className="player-section">
                    <div className="player-name">{match.home}</div>
                    <div className="odds-list">
                      {orderedBooks(match, homeOdds).map((book, bi) => {
                        const odd = homeOdds[book];
                        return (
                          <div key={book} className={`odds-row${bi === 0 && odd ? ' best' : ''}`} onClick={() => fillBetForm(match.home, odd?.odds_american, book, odd?.event_id, match.homeSur)}>
                            <div className="odds-left">
                              {BOOK_LOGOS[book] ? <img src={BOOK_LOGOS[book]} alt={BOOK_NAMES[book]} className="book-logo" />: <div className="book-fallback">{BOOK_NAMES[book]}</div>}
                            </div>
                            <div className="odds-center">
                              <div className="odds-value">{odd ? (odd.odds_american > 0 ? `+${odd.odds_american}` : odd.odds_american) : '—'}</div>
                              <div className="odds-limit">{getLimit(odd)}</div>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>

                  <div className="player-section">
                    <div className="player-name">{match.away}</div>
                    <div className="odds-list">
                      {orderedBooks(match, awayOdds).map((book, bi) => {
                        const odd = awayOdds[book];
                        return (
                          <div key={book} className={`odds-row${bi === 0 && odd ? ' best' : ''}`} onClick={() => fillBetForm(match.away, odd?.odds_american, book, odd?.event_id, match.awaySur)}>
                            <div className="odds-left">
                              {BOOK_LOGOS[book] ? <img src={BOOK_LOGOS[book]} alt={BOOK_NAMES[book]} className="book-logo" />: <div className="book-fallback">{BOOK_NAMES[book]}</div>}
                            </div>
                            <div className="odds-center">
                              <div className="odds-value">{odd ? (odd.odds_american > 0 ? `+${odd.odds_american}` : odd.odds_american) : '—'}</div>
                              <div className="odds-limit">{getLimit(odd)}</div>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </div>
              );
            })}
          </div>

          {/* BET MODAL */}
          <div className={`modal-overlay ${modalOpen ? 'open' : ''}`} onClick={() => setModalOpen(false)}>
            <div className="modal-content" onClick={(e) => e.stopPropagation()}>
              <div className="modal-header">
                <div className="modal-title">Log Bet</div>
                <button className="modal-close" onClick={() => setModalOpen(false)}>✕</button>
              </div>
              <form className="modal-form" onSubmit={logBet}>
                <div className="form-group">
                  <label className="form-label">Player</label>
                  <input type="text" className="form-input" value={betForm.player} onChange={(e) => setBetForm({ ...betForm, player: e.target.value })} />
                </div>
                <div className="form-row">
                  <div className="form-group">
                    <label className="form-label">Odds</label>
                    <input type="number" className="form-input" value={betForm.odds} onChange={(e) => setBetForm({ ...betForm, odds: e.target.value })} />
                  </div>
                  <div className="form-group">
                    <label className="form-label">Amount</label>
                    <input type="number" className="form-input" placeholder="$" value={betForm.amount} onChange={(e) => setBetForm({ ...betForm, amount: e.target.value })} />
                  </div>
                </div>
                <div className="form-row">
                  <div className="form-group">
                    <label className="form-label">Book</label>
                    <select className="form-select" value={betForm.book} onChange={(e) => setBetForm({ ...betForm, book: e.target.value })}>
                      {BOOKMAKERS.map(b => <option key={b} value={b}>{BOOK_NAMES[b]}</option>)}
                    </select>
                  </div>
                  <div className="form-group">
                    <label className="form-label">Result</label>
                    <select className="form-select" value={betForm.result} onChange={(e) => setBetForm({ ...betForm, result: e.target.value })}>
                      <option value="pending">Pending (auto-grade)</option>
                      <option value="win">Win</option>
                      <option value="loss">Loss</option>
                      <option value="push">Push</option>
                    </select>
                  </div>
                </div>
                <button type="submit" className="submit-btn">Log Bet</button>
              </form>
            </div>
          </div>
        </div>
      );
    };

    ReactDOM.render(<TennisSportsbookScreen />, document.getElementById('root'));
  </script>
</body>
</html>
