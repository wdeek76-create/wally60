    #root { min-height: 100vh; padding-bottom: 40px; overflow-y: auto; }
    .tab-bar { display: flex; gap: 8px; margin-top: 12px; }
    .search-sticky { position: sticky; top: 0; z-index: 90; background: #05070b; padding: 8px 10px; border-bottom: 1px solid rgba(255, 255, 255, 0.06); }
    .search-sticky .input-group { max-width: 460px; margin: 0 auto; }
    .search-count { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: 11px; font-weight: 700; color: #8b95a5; pointer-events: none; white-space: nowrap; }
    .mkt-bar { display: flex; gap: 8px; margin: 10px auto 0; max-width: 460px; padding: 0 10px; }
    .mkt-btn { flex: 1; padding: 8px; background: transparent; border: 1px solid rgba(255, 255, 255, 0.22); border-radius: 20px; color: #ddd; font-family: inherit; font-size: 13px; font-weight: 600; -webkit-tap-highlight-color: transparent; }
    .mkt-btn.active { background: #2c3a4f; border-color: transparent; color: #fff; }
    .mh-line { font-size: 13px; color: #3b9eff; font-weight: 600; padding: 10px 12px 8px; display: flex; justify-content: space-between; align-items: center; }
    .book-count { font-size: 11px; color: #8b95a5; font-weight: 700; background: rgba(255, 255, 255, 0.08); padding: 2px 9px; border-radius: 10px; }
    .cols3-head { display: grid; grid-template-columns: 1fr 1fr; background: #0a0e14; border-top: 1px solid rgba(255,255,255,0.06); border-bottom: 1px solid rgba(255,255,255,0.06); }
    .cols3-head span { font-size: 10px; font-weight: 800; letter-spacing: 1px; color: #8b95a5; text-align: center; padding: 6px 0; text-transform: uppercase; }
    .name-band { background: linear-gradient(90deg, rgba(5,7,11,0.6) 0%, #05070b 50%, rgba(5,7,11,0.6) 100%); color: #fff; font-size: 15px; font-weight: 800; text-align: center; padding: 8px 6px; letter-spacing: -0.2px; }
    .best-row { display: grid; grid-template-columns: 1fr 1fr; }
    .best-cell { display: flex; align-items: center; justify-content: center; gap: 7px; padding: 12px 4px; border-right: 1px solid rgba(255,255,255,0.05); min-height: 58px; }
    .best-cell:last-child { border-right: none; }
    .best-cell .book-logo { width: 26px; height: 26px; border-radius: 6px; flex-shrink: 0; }
    .bc-num { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.15; }
    .bc-line { font-size: 14px; font-weight: 600; color: #cfd6e0; font-variant-numeric: tabular-nums; }

    .bc-limit { font-size: 10px; color: #8b95a5; font-weight: 600; }

    .cell-arrow { position: absolute; top: 3px; right: 6px; font-size: 12px; color: #8b95a5; text-decoration: none; padding: 2px; }

    .input-group { display: flex; gap: 8px; margin-bottom: 12px; position: relative; }
    .input-group input { flex: 1; padding: 12px 36px 12px 12px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 6px; color: #fff; font-size: 14px; font-family: inherit; }

    .loading { text-align: center; color: #aaa; padding: 40px 20px; font-size: 14px; }
    .empty { text-align: center; color: #aaa; padding: 40px 20px; font-size: 14px; }
    
    /* MODAL */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7); z-index: 200; display: none; }
    .modal-overlay.open { display: flex; align-items: flex-end; }
    .modal-content { background: linear-gradient(135deg, #0a0e27 0%, #15192f 100%); width: 100%; border-radius: 16px 16px 0 0; padding: 20px; animation: slideUp 0.3s ease; max-height: 90vh; overflow-y: auto; }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); padding-bottom: 12px; }
    .modal-title { font-size: 16px; font-weight: 800; color: #fff; }
    .modal-close { background: none; border: none; color: #aaa; font-size: 24px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .modal-close:active { color: #fff; }
    .modal-form { display: flex; flex-direction: column; gap: 12px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-label { font-size: 12px; color: #aaa; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    .form-input { padding: 12px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 6px; color: #fff; font-size: 14px; font-family: inherit; }
    .form-input::placeholder { color: #aaa; }
    .form-select { padding: 12px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 6px; color: #fff; font-size: 14px; font-family: inherit; }
    .form-row { display: flex; gap: 8px; }
    .form-row .form-group { flex: 1; }
    .submit-btn { padding: 12px 16px; background: linear-gradient(135deg, #27c071 0%, #1fa85c 100%); border: none; border-radius: 6px; color: #000; font-weight: 700; font-size: 14px; cursor: pointer; font-family: inherit; margin-top: 8px; -webkit-tap-highlight-color: transparent; }
    .submit-btn:active { opacity: 0.9; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const BOOKMAKERS = ['fanduel', 'pinnacle'];
    const bucketMarket = (mt) => {
      const m = (mt || '').toLowerCase();
      if (m.includes('spread') || m.includes('handicap')) return 'sets';
      if (m.includes('h2h')) return 'moneyline';
      return m;
    };
    const canonicalBook = (name) => {
      const n = (name || '').toLowerCase().replace(/[^a-z]/g, '');
      const aliases = {
        'fanduel': 'fanduel', 'fd': 'fanduel',
        'pinnacle': 'pinnacle', 'pinny': 'pinnacle'
      };
      return aliases[n] || n;
    };
    const BOOK_NAMES = { fanduel: 'FD', pinnacle: 'PIN' };
    const BOOK_LOGOS = {

      pinnacle: 'data:image/webp;base64,UklGRhYBAABXRUJQVlA4IAoBAAAwBwCdASpAAEAAPpFCnkklpCMhLBgI0LASCWMAxh7gMEA/QAV/hh3oEJphR6xQ60w0eLM6oqNiigGJM4DCkHGCS/AA/vk5hzh5HYQtG16TiCj/nRbo3CyroQJ+6RGbbYnnu/ZRRmra9/5yr8f8Tmr1CXU2mf80eRuLHRROOSP2+Nh+qdKgZ2Tf3WyTQIjP2U7kQWlyBvPRO+B5HiHEZNGPlspwJVeHi27qa/TL+RePSsCgUNr/ws6PY1V9uc/B3XlzWZz5TLM80/7t9IAH+WC68zz/9uZH768BoOvPe/AsA7iOPD95+oLX/pKWdFtcZb7234q5kKPPk+PN6UR9GCQ/5wc+qACZIqYAAA=='
    };

    const formatMoney = (v) => {
      if (!v || v <= 0) return '';
      if (v >= 1000) return `$${(v / 1000).toFixed(1).replace(/\.0$/, '')}k`;
      return `$${Math.round(v)}`;
    };

    const getLimit = (odd) => {
      // ParalayAPI doesn't return explicit limits, so we skip for now
      return '';
    };

    const fmtOddsG = (v) => v > 0 ? `+${v}` : `${v}`;

    const BestCell = ({ pick, lineFmt, player, sur, fillBetForm }) => {
      if (!pick) return <div className="best-cell"><span className="bc-line">—</span></div>;
      const { odd, book } = pick;
      return (
        <div className="best-cell" onClick={(e) => { e.stopPropagation(); fillBetForm(player, odd.odds_american, book, odd.event_id, sur); }}>
          {BOOK_LOGOS[book] ? <img src={BOOK_LOGOS[book]} alt={BOOK_NAMES[book]} className="book-logo" /> : <div className="book-fallback">{BOOK_NAMES[book]}</div>}
          <div className="bc-num">
            {lineFmt && odd.line != null && <span className="bc-line">{lineFmt(odd.line)}</span>}
            <span className="bc-odds green">{fmtOddsG(odd.odds_american)}</span>
            <span className="bc-limit">{getLimit(odd)}</span>
          </div>
        </div>
      );
    };

    const XpSection = ({ label, lo, ro, lName, rName, lSur, rSur, lineFmt, fillBetForm }) => {
      const books = BOOKMAKERS.filter(b => lo[b] || ro[b]);
      if (!books.length) return null;
      const bl = Math.max(...books.map(b => lo[b] ? lo[b].odds_american : -Infinity));
      const br = Math.max(...books.map(b => ro[b] ? ro[b].odds_american : -Infinity));
      const cellText = (odd) => {
        if (!odd) return '—';
        const o = fmtOddsG(odd.odds_american);
        return lineFmt && odd.line != null ? `${lineFmt(odd.line)} ${o}` : o;
      };
      return (
        <div>
          <div className="xp-label">{label}</div>
          {books.map(book => {
            const h = lo[book], a = ro[book];
            return (
              <div key={book} className="book-row">
                <div className={`odds-cell${h && h.odds_american === bl ? ' best' : ''}`} onClick={(e) => { e.stopPropagation(); h && fillBetForm(lName, h.odds_american, book, h.event_id, lSur); }}>
                  <div className="cell-odds">{cellText(h)}</div>
                  <div className="cell-limit">{getLimit(h)}</div>
                </div>
                <div className="book-mid">
                  {BOOK_LOGOS[book] ? <img src={BOOK_LOGOS[book]} alt={BOOK_NAMES[book]} className="book-logo" /> : <div className="book-fallback">{BOOK_NAMES[book]}</div>}
                </div>
                <div className={`odds-cell${a && a.odds_american === br ? ' best' : ''}`} onClick={(e) => { e.stopPropagation(); a && fillBetForm(rName, a.odds_american, book, a.event_id, rSur); }}>
                  <div className="cell-odds">{cellText(a)}</div>
                  <div className="cell-limit">{getLimit(a)}</div>
                </div>
              </div>
            );
          })}
        </div>
      );
    };

    const TennisSportsbookScreen = () => {
      const [apiKey, setApiKey] = useState(() => {
        try { return localStorage.getItem('parlay_api_key') || ''; } catch { return ''; }
      });
      const [matches, setMatches] = useState([]);
      const [loading, setLoading] = useState(false);
      const [searchName, setSearchName] = useState('');
      const [error, setError] = useState('');
      const [lastUpdate, setLastUpdate] = useState('');
      const [booksFound, setBooksFound] = useState([]);
      const [debugInfo, setDebugInfo] = useState('');
      const [tab, setTab] = useState('odds');
      const [expanded, setExpanded] = useState({});
      const [bets, setBets] = useState(() => {
        try { return JSON.parse(localStorage.getItem('tennis_bets')) || []; } catch { return []; }
      });
      const [betForm, setBetForm] = useState({ player: '', odds: '', amount: '', book: 'pinnacle', result: 'win' });
      const [suggestions, setSuggestions] = useState([]);
      const [modalOpen, setModalOpen] = useState(false);
      const searchInputRef = useRef(null);
      const headerRef = useRef(null);
      const [headerH, setHeaderH] = useState(150);
      useEffect(() => {
        const upd = () => { if (headerRef.current) setHeaderH(headerRef.current.offsetHeight); };
        upd();
        window.addEventListener('resize', upd);
        return () => window.removeEventListener('resize', upd);
      });

      const idbOpen = () => new Promise((res, rej) => {
        const r = indexedDB.open('tennisapp', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      });
      const idbGet = async (k) => { try { const db = await idbOpen(); return await new Promise(res => { const t = db.transaction('kv').objectStore('kv').get(k); t.onsuccess = () => res(t.result); t.onerror = () => res(null); }); } catch { return null; } };
      const idbSet = async (k, v) => { try { const db = await idbOpen(); await new Promise(res => { const t = db.transaction('kv', 'readwrite').objectStore('kv').put(v, k); t.onsuccess = res; t.onerror = res; }); } catch {} };

      useEffect(() => {
        if (!apiKey) idbGet('parlay_api_key').then(v => { if (v) setApiKey(v); });
        if (!bets.length) idbGet('tennis_bets').then(v => { if (v && v.length) setBets(v); });
      }, []);

      useEffect(() => {
        if (!apiKey) return;
        try { localStorage.setItem('parlay_api_key', apiKey); } catch (e) {}
        idbSet('parlay_api_key', apiKey);
      }, [apiKey]);

      useEffect(() => {
        try { localStorage.setItem('tennis_bets', JSON.stringify(bets)); } catch (e) {}
        idbSet('tennis_bets', bets);
      }, [bets]);

      const handleSearchChange = (val) => {
        setSearchName(val);
        if (val.trim().length > 0) {
          const playerNames = new Set();
          matches.forEach(m => {
            playerNames.add(m.home);
            playerNames.add(m.away);
          });
          const filtered = Array.from(playerNames)
            .filter(name => name.toLowerCase().includes(val.toLowerCase()))
            .sort();
          setSuggestions(filtered);
        } else {
          setSuggestions([]);
        }
      };

      const handleSuggestionClick = (name) => {
        setSearchName(name);
        setSuggestions([]);
      };

      const clearSearch = (e) => {
        e.preventDefault();
        setSearchName('');
        setSuggestions([]);
        if (searchInputRef.current) searchInputRef.current.focus();
      };

      const fillBetForm = (player, oddValue, book, eventId, sur) => {
        setBetForm({ player, odds: oddValue || '', amount: '', book, result: 'pending', eventId: eventId || '', sur: sur || '' });
        setModalOpen(true);
      };

      const fetchingRef = useRef(false);
      const lastDataRef = useRef('');
      const bootRetryRef = useRef(0);
      
      const fetchOdds = async (silent = false) => {
        const trimmedKey = apiKey.trim();
        if (!trimmedKey) { if (!silent) setError('Enter your ParalayAPI key first'); return; }
        if (fetchingRef.current) return;
        if (silent && modalOpen) return;
        fetchingRef.current = true;
        if (!silent) setLoading(true);
        setError('');
        try {
          const sleep = (ms) => new Promise(r => setTimeout(r, ms));
          const fetchPage = async (url) => {
            let lastErr;
            for (let attempt = 0; attempt < 3; attempt++) {
              try {
                // Use query param instead of header for auth
                const urlObj = new URL(url);
                urlObj.searchParams.set('apiKey', trimmedKey);
                console.log(`[fetch] attempt ${attempt + 1}: ${urlObj.toString().slice(0, 80)}...`);
                const response = await fetch(urlObj.toString());
                console.log(`[fetch] status ${response.status}`);
                if (response.status === 429) { await sleep(1200); lastErr = new Error('Rate limited'); continue; }
                if (!response.ok && response.status >= 500) { await sleep(500 * (attempt + 1)); lastErr = new Error(`HTTP ${response.status}`); continue; }
                if (!response.ok) {
                  const text = await response.text().catch(() => '(no body)');
                  throw new Error(`HTTP ${response.status}: ${text.slice(0, 100)}`);
                }
                const data = await response.json();
                console.log(`[fetch] success, got response`);
                return data;
              } catch (err) {
                console.log(`[fetch] error:`, err.message);
                lastErr = err;
                await sleep(500 * (attempt + 1));
              }
            }
            throw lastErr;
          };

          const fetchTennisSport = async (sportKey) => {
            const url = new URL(`https://parlay-api.com/v1/sports/${sportKey}/odds`);
            url.searchParams.set('regions', 'us');
            url.searchParams.set('markets', 'h2h,spreads');
            url.searchParams.set('bookmakers', BOOKMAKERS.join(','));
            console.log(`[${sportKey}] fetching with book filter...`);
            setDebugInfo(`fetching ${sportKey} with book filter...`);
            let data = await fetchPage(url.toString());
            
            // If no events with filter, try without bookmakers filter to see what's available
            if (!data.events || !data.events.length) {
              console.log(`[${sportKey}] no events with filter, retrying without bookmakers`);
              setDebugInfo(`${sportKey}: no events, retrying without book filter...`);
              const url2 = new URL(`https://parlay-api.com/v1/sports/${sportKey}/odds`);
              url2.searchParams.set('regions', 'us');
              url2.searchParams.set('markets', 'h2h,spreads');
              data = await fetchPage(url2.toString());
              if (data.events && data.events.length) {
                const books = Array.from(new Set(data.events.flatMap(e => e.bookmakers?.map(b => b.key) || [])));
                console.log(`[${sportKey}] got ${data.events.length} events: ${books.join(',')}`);
                setDebugInfo(`${sportKey}: ${data.events.length} events (${books.join(',')})`);
              }
            } else {
              console.log(`[${sportKey}] got ${data.events.length} events with filter`);
            }
            
            if (!data || !data.events) {
              throw new Error(`${sportKey}: no events in response`);
            }
            if (!Array.isArray(data.events)) throw new Error(`${sportKey}: events not an array`);
            return data.events;
          };

          let allEvents = [];
          try {
            // Fetch available sports to find all tennis_* keys
            console.log('[sports] fetching sport list...');
            const sportsResp = await fetchPage('https://parlay-api.com/v1/sports');
            if (!sportsResp || !Array.isArray(sportsResp)) throw new Error('Invalid sports response');
            
            const tennisSports = sportsResp.filter(s => s.key && s.key.startsWith('tennis_'));
            console.log(`[sports] found ${tennisSports.length} tennis sports:`, tennisSports.map(s => s.key).join(', '));
            setDebugInfo(`Found ${tennisSports.length} tennis sports, fetching odds...`);
            
            // Query each tennis sport
            for (const sport of tennisSports) {
              try {
                const events = await fetchTennisSport(sport.key);
                if (events && events.length) {
                  console.log(`[${sport.key}] got ${events.length} events`);
                  allEvents = allEvents.concat(events);
                }
              } catch (err) {
                console.log(`[${sport.key}] failed: ${err.message}`);
              }
            }
          } catch (err) {
            console.log('[sports] failed to fetch sport list:', err.message);
            // Fallback to just ATP/WTA if sports list fails
            try { 
              const atp = await fetchTennisSport('tennis_atp');
              if (atp && atp.length) allEvents = allEvents.concat(atp);
            } catch (e) { console.log('ATP fallback failed:', e.message); }
            try { 
              const wta = await fetchTennisSport('tennis_wta');
              if (wta && wta.length) allEvents = allEvents.concat(wta);
            } catch (e) { console.log('WTA fallback failed:', e.message); }
          }
          
          if (!allEvents.length) throw new Error('No tennis odds from any sport key');

          // Flatten ParalayAPI response → odds-like shape for processing
          let allOdds = [];
          allEvents.forEach(event => {
            if (event.bookmakers && Array.isArray(event.bookmakers)) {
              event.bookmakers.forEach(book => {
                if (book.markets && Array.isArray(book.markets)) {
                  book.markets.forEach(market => {
                    if (market.outcomes && Array.isArray(market.outcomes)) {
                      market.outcomes.forEach(outcome => {
                        allOdds.push({
                          event_id: event.id || event.canonical_event_id || 'unknown',
                          event_start_time: event.commence_time,
                          league: event.sport_title || 'TENNIS',
                          sportsbook: book.key,
                          market_type: market.key === 'h2h' ? 'moneyline' : market.key === 'spreads' ? 'spread' : market.key,
                          selection: outcome.name,
                          odds_american: outcome.price,
                          line: outcome.point || null,
                          is_main_line: true,
                          home_team: event.home_team,
                          away_team: event.away_team
                        });
                      });
                    }
                  });
                }
              });
            }
          });

          const normName = (name) => {
            const n = (name || '').trim();
            if (n.includes(',')) {
              const [last, first] = n.split(',').map(s => s.trim());
              return `${first} ${last}`.trim();
            }
            return n;
          };
          const surKey = (name) => {
            const parts = normName(name).toLowerCase().split(/\s+/);
            return parts[parts.length - 1] || '';
          };

          // Group by event
          const byEvent = {};
          allOdds.forEach(line => {
            if (!byEvent[line.event_id]) byEvent[line.event_id] = [];
            byEvent[line.event_id].push(line);
          });

          // Infer home/away from market outcomes
          Object.values(byEvent).forEach(rows => {
            const commence = rows[0].event_start_time || new Date().toISOString();
            const league = rows[0].league || 'TENNIS';
            
            // For h2h markets, try to extract player names
            const h2hRows = rows.filter(r => r.market_type === 'moneyline');
            const names = Array.from(new Set(h2hRows.map(r => r.selection))).sort();
            
            if (names.length >= 2) {
              const sur1 = surKey(names[0]);
              const sur2 = surKey(names[1]);
              const mKey = `${league}|${commence.slice(0, 10)}|${sur1}|${sur2}`;
              if (!byEvent[mKey]) {
                byEvent[mKey] = {
                  league,
                  commence,
                  key: mKey,
                  names: { [sur1]: names[0], [sur2]: names[1] },
                  odds: {},
                  isLive: false
                };
              }
            }
          });

          // Reorg into match format
          const matchArray = [];
          Object.values(byEvent).forEach(group => {
            if (typeof group.odds === 'undefined') return; // Skip raw arrays
            const eventId = group.key;
            const surs = Object.keys(group.names).sort();
            if (surs.length < 2) return;
            
            const home = group.names[surs[0]], away = group.names[surs[1]];
            const odds = {};
            
            // Map odds into (book, market, sur) key format
            (group.odds || []).forEach(line => {
              if (!line.sportsbook || !line.market_type) return;
              const book = canonicalBook(line.sportsbook);
              const mkt = bucketMarket(line.market_type);
              const sur = surKey(line.selection);
              const key = `${book}_${mkt}_${sur}`;
              if (!odds[key]) odds[key] = line;
            });
            
            matchArray.push({
              league: group.league,
              commence: group.commence,
              eventId,
              home,
              away,
              homeSur: surs[0],
              awaySur: surs[1],
              odds,
              isLive: false
            });
          });

          matchArray.sort((a, b) => new Date(a.commence) - new Date(b.commence));
          setError('');
          const dataStr = JSON.stringify(matchArray);
          if (dataStr !== lastDataRef.current) {
            lastDataRef.current = dataStr;
            setMatches(matchArray);
          }
          setBooksFound(Array.from(new Set(allOdds.map(l => l.sportsbook))).sort());
          const cnt = { moneyline: 0, spread: 0 };
          allOdds.forEach(l => { const b = bucketMarket(l.market_type); if (cnt[b] != null) cnt[b]++; });
          setDebugInfo(`rows — ML: ${cnt.moneyline}, Sets: ${cnt.spread}`);
          setLastUpdate(new Date().toLocaleTimeString());
        } catch (err) {
          if (!silent) setError(err.message || 'Error fetching odds');
          if (matches.length === 0 && bootRetryRef.current < 4) {
            bootRetryRef.current += 1;
            setTimeout(() => fetchOddsRef.current(true), 2500);
          }
        } finally {
          fetchingRef.current = false;
          setLoading(false);
        }
      };

      const fetchOddsRef = useRef();
      fetchOddsRef.current = fetchOdds;

      const didAutoFetch = useRef(false);
      // Disabled auto-fetch to prevent credit waste with invalid keys
      // useEffect(() => {
      //   if (apiKey.trim() && !didAutoFetch.current) { didAutoFetch.current = true; fetchOdds(); }
      // }, [apiKey]);

      useEffect(() => {
        // Auto-refresh and boot-retry disabled to prevent silent credit burns
        // const id = setInterval(() => fetchOddsRef.current(true), 30000);
        // const onVis = () => { if (!document.hidden) fetchOddsRef.current(true); };
        // document.addEventListener('visibilitychange', onVis);
        // return () => { clearInterval(id); document.removeEventListener('visibilitychange', onVis); };
      }, []);

      const logBet = (e) => {
        e.preventDefault();
        if (!betForm.player || !betForm.odds || !betForm.amount) { setError('Fill in player, odds, and amount'); return; }
        const newBet = { id: Date.now(), player: betForm.player, odds: parseFloat(betForm.odds), amount: parseFloat(betForm.amount), book: betForm.book, result: betForm.result, eventId: betForm.eventId, sur: betForm.sur, timestamp: new Date().toISOString() };
        setBets([...bets, newBet]);
        setBetForm({ player: '', odds: '', amount: '', book: 'pinnacle', result: 'pending', eventId: '', sur: '' });
        setModalOpen(false);
      };

      const profitFor = (odds, risked) => odds > 0 ? risked * odds / 100 : risked * 100 / Math.abs(odds);

      const calculateStats = () => {
        let wins = 0, losses = 0, pushes = 0, pending = 0, totalUnits = 0, totalReturned = 0;
        bets.forEach(bet => {
          if (bet.result === 'pending') { pending++; return; }
          const risked = bet.amount;
          let returned = 0;
          if (bet.result === 'win') { wins++; returned = risked + profitFor(bet.odds, risked); }
          else if (bet.result === 'loss') { losses++; returned = 0; }
          else { pushes++; returned = risked; }
          totalUnits += risked;
          totalReturned += returned;
        });
        const settled = wins + losses + pushes;
        const roi = totalUnits > 0 ? ((totalReturned - totalUnits) / totalUnits * 100).toFixed(1) : 0;
        const hitRate = settled > 0 ? ((wins / settled) * 100).toFixed(1) : 0;
        return { wins, losses, pushes, pending, total: bets.length, unitsPL: (totalReturned - totalUnits).toFixed(2), roi, hitRate };
      };

      const formatTime = (isoString) => {
        try {
          const d = new Date(isoString);
          const time = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
          const now = new Date();
          const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
          const gameDay = new Date(d.getFullYear(), d.getMonth(), d.getDate());
          const diffDays = Math.round((gameDay - today) / 86400000);
          if (diffDays === 0) return `Today ${time}`;
          if (diffDays === 1) return `Tmrw ${time}`;
          const day = d.toLocaleDateString('en-US', { weekday: 'short', month: 'numeric', day: 'numeric' });
          return `${day} ${time}`;
        } catch { return isoString; }
      };

      const startsIn = (isoString) => {
        try {
          const diff = new Date(isoString) - new Date();
          if (diff <= 0) return 'Started';
          const mins = Math.floor(diff / 60000);
          if (mins < 60) return `in ${mins}m`;
          const hrs = Math.floor(mins / 60);
          if (hrs < 24) return `in ${hrs}h ${mins % 60}m`;
          const days = Math.floor(hrs / 24);
          return `in ${days}d ${hrs % 24}h`;
        } catch { return ''; }
      };

      const filteredMatches = matches.filter(m => {
        if (new Date(m.commence) <= new Date()) return false;
        const s = searchName.toLowerCase();
        return m.home.toLowerCase().includes(s) || m.away.toLowerCase().includes(s);
      });

      const getOddsForPlayer = (match, playerSur, market = 'moneyline') => {
        const odds = {};
        BOOKMAKERS.forEach(book => {
          const key = `${book}_${market}_${playerSur}`;
          const line = match.odds[key];
          if (line) odds[book] = line;
        });
        return odds;
      };

      const getBooksWithOdds = (match) => {
        const books = new Set();
        BOOKMAKERS.forEach(book => {
          if (Object.keys(match.odds).some(key => key.startsWith(book + '_'))) books.add(book);
        });
        return Array.from(books);
      };

      return (
        <div>
          <div className="header" ref={headerRef}>
            <div className="input-group">
              <input type="password" placeholder="ParalayAPI Key" value={apiKey} onChange={(e) => setApiKey(e.target.value)} />
              <button className="load-btn" onClick={(e) => { e.preventDefault(); fetchOdds(); }}>
                {loading ? 'Loading...' : 'Load'}
              </button>
            </div>
            <div className="tab-bar">
              <button className={`tab-btn ${tab === 'odds' ? 'active' : ''}`} onClick={() => setTab('odds')}>Odds</button>
              <button className={`tab-btn ${tab === 'bets' ? 'active' : ''}`} onClick={() => setTab('bets')}>Bets{bets.filter(b => b.result === 'pending').length > 0 ? ` (${bets.filter(b => b.result === 'pending').length})` : ''}</button>
            </div>

            {matches.length > 0 && <div className="stats">{lastUpdate && <span>{lastUpdate}</span>}<span style={{color: '#666'}}>parlay</span></div>}
            {booksFound.length > 0 && <div className="stats" style={{fontSize: '10px', color: '#888'}}><span>API books: {booksFound.join(', ')}</span></div>}
            {debugInfo && <div className="stats" style={{fontSize: '10px', color: '#888'}}><span>{debugInfo}</span></div>}
          </div>

          {error && <div className="error">⚠️ {error}</div>}

          {tab === 'bets' && (() => { const stats = calculateStats();
            const pendingBets = [...bets].reverse().filter(b => b.result === 'pending');
            const settledBets = [...bets].reverse().filter(b => b.result !== 'pending');
            return (
            <div>
              <div className="stats-row">
                <div className="stat-item"><div className="stat-label">Record</div><div className="stat-value">{stats.wins}-{stats.losses}</div></div>
                <div className="stat-item"><div className="stat-label">Hit Rate</div><div className="stat-value">{stats.hitRate}%</div></div>
                <div className="stat-item"><div className="stat-label">Units</div><div className={`stat-value ${stats.unitsPL < 0 ? 'negative' : ''}`}>{stats.unitsPL > 0 ? '+' : ''}{stats.unitsPL}</div></div>
                <div className="stat-item"><div className="stat-label">ROI</div><div className={`stat-value ${stats.roi < 0 ? 'negative' : ''}`}>{stats.roi > 0 ? '+' : ''}{stats.roi}%</div></div>
              </div>
              {pendingBets.length > 0 && <div className="section-label">Pending ({pendingBets.length})</div>}
              {pendingBets.length > 0 && <div className="bet-history">
                {pendingBets.map(bet => (
                  <div key={bet.id} className={`bet-item ${bet.result}`}>
                    <div className="bet-item-header"><span>{bet.player}</span><span>{bet.amount}</span></div>
                    <div className="bet-item-detail">{bet.odds > 0 ? '+' : ''}{bet.odds} @ {BOOK_NAMES[bet.book] || bet.book} • {new Date(bet.timestamp).toLocaleDateString()}</div>
                  </div>
                ))}
              </div>}
              {settledBets.length > 0 && <div className="section-label">Settled ({settledBets.length})</div>}
              {settledBets.length > 0 && <div className="bet-history">
                {settledBets.map(bet => (
                  <div key={bet.id} className={`bet-item ${bet.result}`}>
                    <div className="bet-item-header"><span>{bet.player}</span><span>{bet.result === 'win' ? `+${profitFor(bet.odds, bet.amount).toFixed(2)}` : bet.result === 'loss' ? `-${bet.amount}` : '0'}</span></div>
                    <div className="bet-item-detail">{bet.odds > 0 ? '+' : ''}{bet.odds} @ {BOOK_NAMES[bet.book] || bet.book} • {bet.result.toUpperCase()} • {new Date(bet.timestamp).toLocaleDateString()}</div>
                  </div>
                ))}
              </div>}
              {bets.length === 0 && <div className="empty">No bets logged yet</div>}
            </div>
          ); })()}

          {tab === 'odds' && <div className="search-sticky">
            <div className="input-group" style={{position: 'relative', marginBottom: 0}}>
              <input ref={searchInputRef} type="text" style={{paddingLeft: '36px'}} placeholder="Search player name..." value={searchName} onChange={(e) => handleSearchChange(e.target.value)} spellCheck="false" autoCorrect="off" autoCapitalize="off" autoComplete="off" />
              <button className={`clear-btn ${searchName ? 'show' : ''}`} onClick={clearSearch}>✕</button>
              {!searchName && matches.length > 0 && <span className="search-count">{filteredMatches.length} matches</span>}
              {suggestions.length > 0 && <div className="autocomplete-list show">
                {suggestions.map((name, idx) => (
                  <div key={idx} className="autocomplete-item" onClick={() => handleSuggestionClick(name)}>{name}</div>
                ))}
              </div>}
            </div>
          </div>}

          {tab === 'odds' && loading && <div className="loading">Fetching tennis odds...</div>}
          {tab === 'odds' && filteredMatches.length === 0 && !loading && <div className="empty">{matches.length === 0 ? 'Enter API key and click Load' : 'No matches found'}</div>}

          {tab === 'odds' && <div className="matches-container">
            {filteredMatches.map((match, idx) => {
              const M = { ml: 'moneyline', sets: 'sets' };
              const oddsFor = (sur, mkt) => getOddsForPlayer(match, sur, mkt);
              const bestOf = (odds) => {
                let best = null, bestBook = null;
                BOOKMAKERS.forEach(b => { if (odds[b] && (!best || odds[b].odds_american > best.odds_american)) { best = odds[b]; bestBook = b; } });
                return best ? { odd: best, book: bestBook } : null;
              };
              const homeML = oddsFor(match.homeSur, M.ml), awayML = oddsFor(match.awaySur, M.ml);
              const homeSets = oddsFor(match.homeSur, M.sets), awaySets = oddsFor(match.awaySur, M.sets);
              if (Object.keys(homeML).length + Object.keys(awayML).length === 0) return null;
              const setLine = (l) => `${l > 0 ? '+' : ''}${l}`;
              const nBooks = BOOKMAKERS.filter(b => homeML[b] || awayML[b]).length;
              const isOpen = !!expanded[match.eventId];
              return (
                <div key={match.eventId} className="match-card" onClick={() => setExpanded(prev => ({ ...prev, [match.eventId]: !prev[match.eventId] }))}>
                  <div className="mh-line"><span>{formatTime(match.commence)} • {match.league}<span className="starts-in">{startsIn(match.commence)}</span></span>{nBooks > 1 && <span className="book-count">{nBooks} books</span>}</div>
                  <div className="cols3-head"><span>Moneyline</span><span>Spread</span></div>
                  <div className="name-band">{match.home}</div>
                  <div className="best-row">
                    <BestCell pick={bestOf(homeML)} player={match.home} sur={match.homeSur} fillBetForm={fillBetForm} />
                    <BestCell pick={bestOf(homeSets)} lineFmt={setLine} player={match.home} sur={match.homeSur} fillBetForm={fillBetForm} />
                  </div>
                  <div className="name-band">{match.away}</div>
                  <div className="best-row">
                    <BestCell pick={bestOf(awayML)} player={match.away} sur={match.awaySur} fillBetForm={fillBetForm} />
                    <BestCell pick={bestOf(awaySets)} lineFmt={setLine} player={match.away} sur={match.awaySur} fillBetForm={fillBetForm} />
                  </div>
                  {isOpen && (
                    <div className="expand-wrap">
                      <XpSection label="Moneyline" lo={homeML} ro={awayML} lName={match.home} rName={match.away} lSur={match.homeSur} rSur={match.awaySur} fillBetForm={fillBetForm} />
                      <XpSection label="Sets" lo={homeSets} ro={awaySets} lName={match.home} rName={match.away} lSur={match.homeSur} rSur={match.awaySur} lineFmt={setLine} fillBetForm={fillBetForm} />
                    </div>
                  )}
                </div>
              );
            })}
          </div>}

          {/* BET MODAL */}
          <div className={`modal-overlay ${modalOpen ? 'open' : ''}`} onClick={() => setModalOpen(false)}>
            <div className="modal-content" onClick={(e) => e.stopPropagation()}>
              <div className="modal-header">
                <div className="modal-title">Log Bet</div>
                <button className="modal-close" onClick={() => setModalOpen(false)}>✕</button>
              </div>
              <form className="modal-form" onSubmit={logBet}>
                <div className="form-group">
                  <label className="form-label">Player</label>
                  <input type="text" className="form-input" value={betForm.player} onChange={(e) => setBetForm({ ...betForm, player: e.target.value })} />
                </div>
                <div className="form-row">
                  <div className="form-group">
                    <label className="form-label">Odds</label>
                    <input type="number" className="form-input" value={betForm.odds} onChange={(e) => setBetForm({ ...betForm, odds: e.target.value })} />
                  </div>
                  <div className="form-group">
                    <label className="form-label">Amount</label>
                    <input type="number" className="form-input" placeholder="$" value={betForm.amount} onChange={(e) => setBetForm({ ...betForm, amount: e.target.value })} />
                  </div>
                </div>
                <div className="form-row">
                  <div className="form-group">
                    <label className="form-label">Book</label>
                    <select className="form-select" value={betForm.book} onChange={(e) => setBetForm({ ...betForm, book: e.target.value })}>
                      {BOOKMAKERS.map(b => <option key={b} value={b}>{BOOK_NAMES[b]}</option>)}
                    </select>
                  </div>
                  <div className="form-group">
                    <label className="form-label">Result</label>
                    <select className="form-select" value={betForm.result} onChange={(e) => setBetForm({ ...betForm, result: e.target.value })}>
                      <option value="pending">Pending</option>
                      <option value="win">Win</option>
                      <option value="loss">Loss</option>
                      <option value="push">Push</option>
                    </select>
                  </div>
                </div>
                <button type="submit" className="submit-btn">Log Bet</button>
              </form>
            </div>
          </div>
        </div>
      );
    };

    ReactDOM.render(<TennisSportsbookScreen />, document.getElementById('root'));
  </script>
</body>
</html>
