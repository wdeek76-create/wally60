<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tennis Sportsbook</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      background: linear-gradient(135deg, #0a0e27 0%, #0f1535 100%);
      color: #fff;
    }
    #root {
      min-height: 100vh;
      padding-bottom: 20px;
    }
    .header {
      background: linear-gradient(135deg, #1a2545 0%, #0f1535 100%);
      padding: 16px;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid rgba(39, 192, 113, 0.1);
    }
    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .input-group input {
      flex: 1;
      padding: 12px;
      background: rgba(26, 32, 56, 0.8);
      border: 1px solid rgba(39, 192, 113, 0.2);
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
    }
    .input-group input::placeholder {
      color: #7a8aa8;
    }
    .load-btn {
      padding: 12px 16px;
      background: linear-gradient(135deg, #27c071 0%, #1fa85c 100%);
      border: none;
      border-radius: 8px;
      color: #000;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .load-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(39, 192, 113, 0.3);
    }
    .load-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .stats {
      display: flex;
      gap: 12px;
      font-size: 12px;
      color: #7a8aa8;
      margin-top: 8px;
    }
    .match-card {
      background: linear-gradient(135deg, rgba(26, 32, 56, 0.9) 0%, rgba(15, 21, 53, 0.9) 100%);
      border: 1px solid rgba(39, 192, 113, 0.1);
      border-radius: 12px;
      margin: 8px 12px;
      overflow: hidden;
      transition: all 0.2s;
    }
    .match-card:active {
      transform: scale(0.98);
      border-color: rgba(39, 192, 113, 0.3);
    }
    .match-header {
      padding: 10px 12px;
      background: linear-gradient(90deg, rgba(39, 192, 113, 0.05) 0%, transparent 100%);
      font-size: 11px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid rgba(39, 192, 113, 0.05);
    }
    .match-body {
      padding: 12px;
    }
    .player-row {
      margin-bottom: 16px;
    }
    .player-name {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #fff;
    }
    .odds-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(70px, 1fr));
      gap: 6px;
    }
    .odds-card {
      background: linear-gradient(135deg, rgba(26, 32, 56, 0.8) 0%, rgba(10, 14, 39, 0.8) 100%);
      border: 1px solid rgba(39, 192, 113, 0.15);
      border-radius: 8px;
      padding: 8px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .odds-card:active {
      background: linear-gradient(135deg, rgba(39, 192, 113, 0.2) 0%, rgba(31, 168, 92, 0.1) 100%);
      border-color: rgba(39, 192, 113, 0.4);
    }
    .book-label {
      font-size: 9px;
      color: #7a8aa8;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .book-odds {
      font-size: 14px;
      font-weight: 700;
      color: #27c071;
      font-family: 'Monaco', 'Courier', monospace;
    }
    .book-limit {
      font-size: 8px;
      color: #666;
      margin-top: 2px;
    }
    .error {
      background: rgba(220, 38, 38, 0.2);
      border: 1px solid rgba(220, 38, 38, 0.5);
      color: #ff9999;
      padding: 12px 16px;
      border-radius: 8px;
      margin: 8px 12px;
      font-size: 14px;
    }
    .loading {
      text-align: center;
      color: #7a8aa8;
      padding: 20px;
    }
    .empty {
      text-align: center;
      color: #7a8aa8;
      padding: 32px 16px;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const TennisSportsbookScreen = () => {
      const [apiKey, setApiKey] = useState(() => {
        if (typeof window !== 'undefined') {
          try {
            return localStorage.getItem('sharpapi_key') || '';
          } catch (e) {
            return '';
          }
        }
        return '';
      });
      const [matches, setMatches] = useState([]);
      const [loading, setLoading] = useState(false);
      const [searchName, setSearchName] = useState('');
      const [error, setError] = useState('');
      const [lastUpdate, setLastUpdate] = useState('');

      const BOOKMAKERS = ['pinnacle', 'fanduel', 'draftkings', 'betmgm', 'betonline'];
      const BOOK_NAMES = {
        pinnacle: 'PIN',
        fanduel: 'FD',
        draftkings: 'DK',
        betmgm: 'MGM',
        betonline: 'BEO',
        novig: 'NVG',
        prophetx: 'PHX'
      };

      const fetchOdds = async () => {
        if (!apiKey.trim()) {
          setError('Enter your SharpAPI key first');
          return;
        }

        setLoading(true);
        setError('');

        try {
          let allOdds = [];
          let cursor = null;

          while (true) {
            const url = new URL('https://api.sharpapi.io/api/v1/odds');
            url.searchParams.set('sport', 'tennis');
            url.searchParams.set('sportsbook', BOOKMAKERS.join(','));
            url.searchParams.set('market', 'moneyline');
            url.searchParams.set('limit', '200');
            if (cursor) url.searchParams.set('cursor', cursor);

            const response = await fetch(url.toString(), {
              headers: { 'X-API-Key': apiKey }
            });

            if (!response.ok) {
              let errText = '';
              try {
                errText = await response.text();
              } catch (e) {}
              if (response.status === 401) throw new Error('401: Invalid API key');
              if (response.status === 403) throw new Error('403: Need Sharp tier for Pinnacle');
              throw new Error(`HTTP ${response.status}`);
            }

            const data = await response.json();
            if (!data.data || !Array.isArray(data.data)) throw new Error('Invalid response format');

            allOdds = allOdds.concat(data.data);

            if (!data.pagination?.has_more) break;
            cursor = data.pagination.next_cursor;
          }

          // Group by event_id
          const grouped = {};
          allOdds.forEach(line => {
            const eventId = line.event_id;
            if (!grouped[eventId]) {
              grouped[eventId] = {
                league: line.league?.toUpperCase() || 'TENNIS',
                commence: line.event_start_time || new Date().toISOString(),
                oddRows: []
              };
            }
            grouped[eventId].oddRows.push(line);
          });

          // Convert to matches
          const matchArray = Object.values(grouped).map(event => {
            const players = new Set();
            event.oddRows.forEach(row => {
              if (row.selection_type === 'home' || row.selection_type === 'away') {
                players.add(row.selection);
              }
            });
            
            const playerList = Array.from(players);
            return {
              league: event.league,
              commence: event.commence,
              eventId: event.oddRows[0].event_id,
              home: playerList[0] || 'TBD',
              away: playerList[1] || 'TBD',
              odds: {}
            };
          }).map(match => {
            allOdds.forEach(line => {
              if (line.event_id === match.eventId) {
                const key = `${line.sportsbook}_${line.market_type}_${line.selection}`;
                match.odds[key] = line;
              }
            });
            return match;
          }).filter(m => m.home && m.away && m.home !== 'TBD')
            .sort((a, b) => new Date(a.commence) - new Date(b.commence));

          setMatches(matchArray);
          setLastUpdate(new Date().toLocaleTimeString());
        } catch (err) {
          setError(err.message || 'Error fetching odds');
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        try {
          if (apiKey) {
            localStorage.setItem('sharpapi_key', apiKey);
          }
        } catch (e) {}
      }, [apiKey]);

      const filteredMatches = matches.filter(m => {
        const s = searchName.toLowerCase();
        return m.home.toLowerCase().includes(s) || m.away.toLowerCase().includes(s);
      });

      const getOddsForPlayer = (match, player, market = 'moneyline') => {
        const odds = {};
        BOOKMAKERS.forEach(book => {
          const key = `${book}_${market}_${player}`;
          const line = match.odds[key];
          if (line) {
            odds[book] = line;
          }
        });
        return odds;
      };

      const getBooksWithOdds = (match) => {
        const books = new Set();
        BOOKMAKERS.forEach(book => {
          const hasOdds = Object.keys(match.odds).some(key => key.startsWith(book + '_'));
          if (hasOdds) {
            books.add(book);
          }
        });
        return Array.from(books);
      };

      const formatTime = (isoString) => {
        try {
          const d = new Date(isoString);
          return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
        } catch {
          return isoString;
        }
      };

      return (
        <div>
          <div className="header">
            <div className="input-group">
              <input
                type="password"
                placeholder="SharpAPI Key"
                value={apiKey}
                onChange={(e) => setApiKey(e.target.value)}
              />
              <button className="load-btn" onClick={fetchOdds} disabled={loading}>
                {loading ? 'Loading...' : 'Load'}
              </button>
            </div>
            <div className="input-group">
              <input
                type="text"
                placeholder="Search player name..."
                value={searchName}
                onChange={(e) => setSearchName(e.target.value)}
              />
            </div>
            <div className="stats">
              {matches.length > 0 && <span>{filteredMatches.length}/{matches.length} matches</span>}
              {lastUpdate && <span>{lastUpdate}</span>}
            </div>
          </div>

          {error && <div className="error">⚠️ {error}</div>}

          <div>
            {loading && <div className="loading">Fetching tennis odds...</div>}
            
            {filteredMatches.length === 0 && !loading && (
              <div className="empty">
                {matches.length === 0 ? 'Enter API key and click Load' : 'No matches found'}
              </div>
            )}

            {filteredMatches.map((match, idx) => {
              const homeOdds = getOddsForPlayer(match, match.home);
              const awayOdds = getOddsForPlayer(match, match.away);
              const booksAvail = getBooksWithOdds(match);

              return (
                <div key={idx} className="match-card">
                  <div className="match-header">
                    {formatTime(match.commence)} • {match.league}
                  </div>
                  
                  <div className="match-body">
                    <div className="player-row">
                      <div className="player-name">{match.home}</div>
                      <div className="odds-grid">
                        {booksAvail.map(book => {
                          const odd = homeOdds[book];
                          return (
                            <div key={book} className="odds-card">
                              <div className="book-label">{BOOK_NAMES[book]}</div>
                              <div className="book-odds">{odd ? odd.odds_american : '—'}</div>
                              {odd?.max_bet && (
                                <div className="book-limit">${(odd.max_bet / 1000).toFixed(0)}k</div>
                              )}
                            </div>
                          );
                        })}
                      </div>
                    </div>

                    <div className="player-row">
                      <div className="player-name">{match.away}</div>
                      <div className="odds-grid">
                        {booksAvail.map(book => {
                          const odd = awayOdds[book];
                          return (
                            <div key={book} className="odds-card">
                              <div className="book-label">{BOOK_NAMES[book]}</div>
                              <div className="book-odds">{odd ? odd.odds_american : '—'}</div>
                              {odd?.max_bet && (
                                <div className="book-limit">${(odd.max_bet / 1000).toFixed(0)}k</div>
                              )}
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    };

    ReactDOM.render(<TennisSportsbookScreen />, document.getElementById('root'));
  </script>
</body>
</html>
