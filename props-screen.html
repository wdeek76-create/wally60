  </div>`;
  const tabs=`<div class="gdtabsrow"><div class="gdtabs">${mkDefs.map(m=>`<button class="gdtab${m[0]===gridMarket?' on':''}" data-mk="${m[0]}">${esc(m[1])}</button>`).join('')}</div><button class="gdset" id="gdset" title="Customize markets &amp; books">⚙</button></div>`;
  const sideToggle = S.ml ? '' : `<div class="sidetog"><button class="stbtn${gridSide==='over'?' on':''}" data-side="over">O</button><button class="stbtn${gridSide==='under'?' on':''}" data-side="under">U</button></div>`;
  // Exchange-only controls: weighted price (avg across nearby levels instead of raw top quote),
  // win-prob label as ¢ or %, and a minimum size an exchange needs at its price to even be
  // eligible for the Best Odds pick.
  const exRow = `<div class="gdexrow">
    <button class="gdexbtn${exWeighted?' on':''}" id="gdweighted" title="Weighted odds: size-weighted average across nearby exchange levels">Weighted</button>
    <button class="gdexbtn" id="gdpctmode" title="Toggle exchange win-prob between cents and percent">${exPctMode==='cents'?'¢':'%'}</button>
    <label class="gdliqlabel">Min liq<input type="text" id="gdminliq" inputmode="numeric" placeholder="any" value="${gridMinLiq||''}"></label>
  </div>`;
  let rows=players.filter(p=>p.marketKeys.has(gridMarket) && !fixtures.find(f=>f.id===p.fixtureId)?.live);
  if(gridSearch.trim()) rows=rows.filter(p=>normName(p.name).includes(normName(gridSearch)));
  rows=rows.sort((a,b)=>{
    const fa=fixtures.find(x=>x.id===a.fixtureId), fb=fixtures.find(x=>x.id===b.fixtureId);
    const ta=fa?new Date(fa.start).getTime():0, tb=fb?new Date(fb.start).getTime():0;
    return ta-tb || a.name.localeCompare(b.name);
  });
  const books=orderedBooks();
  const header=`<div class="gdrow gdhead"><div class="gdcell gdplayer">PLAYER</div><div class="gdcell gdbest">BEST ODDS</div>${books.map(nm=>{
    const lg=bookLogo(nm.toLowerCase());
    return `<div class="gdc gdhc">${lg?`<img src="${esc(lg)}" alt="">`:`<span class="rlogotxt">${esc(bookShort(nm.toLowerCase()))}</span>`}</div>`;
  }).join('')}</div>`;
  const body=rows.map(p=>gridRowHtml(p,gridMarket,gridSide)).join('') || `<div class="empty">No ${esc(marketLabel(sportKey,gridMarket))} props posted yet.</div>`;
  view.innerHTML=`${topbar}${tabs}${sideToggle}${exRow}<div class="gdwrap mk" data-ctx="grid"><div class="gdtable">${header}${body}</div></div>`;
  view.querySelectorAll('.gdtab[data-mk]').forEach(el=>el.addEventListener('click',()=>{ gridMarket=el.dataset.mk; renderGrid(); }));
  view.querySelectorAll('.sidetog .stbtn[data-side]').forEach(el=>el.addEventListener('click',()=>{ gridSide=el.dataset.side; renderGrid(); }));
  view.querySelectorAll('.gdrow[data-k]').forEach(el=>el.addEventListener('click',ev=>{
    if(ev.target.closest('[data-pill],[data-betlink],[data-betchoice],.liqbtn,[data-injkey]')) return;
    const p=players.find(x=>x.key===el.dataset.k); if(!p) return;
    const pmkeys=mkDefs.map(m=>m[0]).filter(k=>p.marketKeys.has(k));
    openPlayer(p, Math.max(0,pmkeys.indexOf(gridMarket)));
  }));
  view.querySelectorAll('.inj[data-injkey]').forEach(el=>el.addEventListener('click',ev=>{
    ev.stopPropagation();
    const p=players.find(x=>x.key===el.dataset.injkey); const inj=p&&injuryFor(p);
    if(inj) showInjuryPop(el, inj, p.name);
  }));
  $('#gdset')?.addEventListener('click', openGridSettings);
  $('#gdweighted')?.addEventListener('click',()=>{ exWeighted=!exWeighted; LS.set('props_exweighted', exWeighted?'1':''); renderGrid(); });
  $('#gdpctmode')?.addEventListener('click',()=>{ exPctMode=exPctMode==='cents'?'pct':'cents'; LS.set('props_exmode', exPctMode); renderGrid(); });
  const liqInput=$('#gdminliq');
  liqInput?.addEventListener('input', e=>{
    gridMinLiq=Number(e.target.value)||0; LS.set('props_minliq', String(gridMinLiq));
    const pos=e.target.selectionStart;
    renderGrid();
    const i=$('#gdminliq'); if(i){ i.focus(); i.setSelectionRange(pos,pos); }
  });
  const gq=$('#gdq');
  gq?.addEventListener('input', e=>{
    gridSearch=e.target.value; const pos=e.target.selectionStart;
    renderGrid();
    const i=$('#gdq'); if(i){ i.focus(); i.setSelectionRange(pos,pos); }
  });
  bindView(current); // the shared pill/bet delegated listener -- harmless if already bound
  warmGridTeams(view);
  window.scrollTo({top:0});
}
function toggleGridMode(){
  gridMode=!gridMode; LS.set('props_grid', gridMode?'1':'');
  $('#gridToggle')?.classList.toggle('on',gridMode);
  if(!current && viewMode==='sport') renderSlate();
}
// Full team rosters, cached per team id -- players is only ever built from ODDS rows, so a
// player nobody's posted a line on yet never makes it in there at all, not just hidden behind a
// toggle. This is the separate roster fetch needed to know they exist in the first place.
const rosterCache = {};
async function ensureRoster(teamId){
  if(!teamId || rosterCache[teamId]) return rosterCache[teamId]||[];
  try{ const r=await oo('/players',{team_id:[teamId]}); rosterCache[teamId]=(r?.data||[]).filter(d=>d?.name); }
  catch(e){ console.warn('[props] roster fetch failed',e.message); rosterCache[teamId]=[]; }
  return rosterCache[teamId];
}
// One player's price tile in a game's expanded grid: headshot, team + market tag, line, colored
// O/U. Same primary-market pick gameStripHtml uses (first market this player posts).
function playerPriceCardHtml(p){
  const mkey=[...p.marketKeys][0];
  const line = mkey ? lineForMarket(p,mkey) : null;
  let overTxt='', underTxt='', overCls='', underCls='', bookKey='';
  if(mkey){
    const rows=rowsFor(p,mkey,mainRows).filter(o=>line==null||o.points==null||Number(o.points)===Number(line));
    const over=bestFirst(rows.filter(o=>sideOf(o)==='over'))[0];
    const under=bestFirst(rows.filter(o=>sideOf(o)==='under'))[0];
    if(over){ overTxt=fmtAm(over.price); overCls=Number(over.price)>0?'pos':'neg'; bookKey=canonBook(over.sportsbook); }
    if(under){ underTxt=fmtAm(under.price); underCls=Number(under.price)>0?'pos':'neg'; if(!bookKey) bookKey=canonBook(under.sportsbook); }
  }
  const info=p.pid?playerInfo[p.pid]:null;
  const hs=info?.headshot || (p.isTeam?teamLogoFor(p):'');
  const initials=p.name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
  const f=fixtures.find(x=>x.id===p.fixtureId);
  const teamAb = info?.teamId ? (f?.home.id===info.teamId?f.home.ab:f?.away.id===info.teamId?f.away.ab:'') : '';
  const bookLg=bookKey?bookLogo(bookKey):'';
  // Compact single-line header (name, team, market tag) + a second line (book + line + O/U) --
  // the market tag is a small muted chip, not its own stacked row, to match a real sportsbook's
  // density instead of eating three lines per player.
  return `<div class="pgc" data-k="${esc(p.key)}">
    <div class="pgph" data-pid="${esc(p.pid||'')}">${hs?`<img src="${esc(hs)}" alt="">`:`<span>${initials}</span>`}</div>
    <div class="pgi">
      <div class="pgtop"><span class="pgnm">${esc(titleCase(p.name))}</span>${injPill(p)}${teamAb?`<span class="pgtm">${esc(teamAb)}</span>`:''}${mkey?`<span class="pgmk">${esc(marketLabel(sportKey,mkey))}</span>`:''}</div>
      <div class="pgbot">${bookLg?`<img class="pgbk" src="${esc(bookLg)}" alt="">`:''}<span class="pgln">${line!=null?line:'—'}</span><span class="pgpr">${overTxt?`<b class="${overCls}">O ${overTxt}</b>`:''}${underTxt?`<b class="${underCls}">U ${underTxt}</b>`:''}</span></div>
    </div>
  </div>`;
}
const gameBodyShown = {}; // fid -> "players without lines" expanded?
// Loads (first time) and renders a game's player grid straight into its own accordion body --
// no separate page/back button, the row just expands in place in the slate list.
async function loadGameBody(fid){
  const f=fixtures.find(x=>x.id===fid); const body=$(`#gmbody-${fid}`); if(!f||!body) return;
  if(f.live){ body.innerHTML=`<div class="empty">This game is live — its props are no longer shown here. Anything you already tracked keeps updating in the Tracker tab.</div>`; return; }
  const withLines=players.filter(p=>p.fixtureId===fid).sort((a,b)=>a.name.localeCompare(b.name));
  const withKeys=new Set(withLines.map(p=>p.key));
  const draw=(withoutLines)=>{
    const h=withLines.map(playerPriceCardHtml).join('');
    const shown=!!gameBodyShown[fid];
    const noLinesHtml = withoutLines.length
      ? `<div class="nolines"><button class="nlToggle" data-fid="${esc(fid)}">${withoutLines.length} player${withoutLines.length===1?'':'s'} without lines ${shown?'▴ hide':'▾ show'}</button>${shown?withoutLines.map(n=>`<div class="pl off"><span>${esc(titleCase(n))}</span></div>`).join(''):''}</div>` : '';
    body.innerHTML=`<div class="pgrid">${h}</div>${withLines.length?'':'<div class="empty">No props posted yet.</div>'}${noLinesHtml}`;
    body.querySelectorAll('.pgc[data-k]').forEach(el=>el.addEventListener('click',()=>{ const p=players.find(x=>x.key===el.dataset.k); if(p) openPlayer(p); }));
    body.querySelector('.nlToggle')?.addEventListener('click',()=>{ gameBodyShown[fid]=!gameBodyShown[fid]; draw(withoutLines); });
    warmHeadshots(body,'.pgph[data-pid]');
  };
  draw([]);
  // Roster fetch resolves after the lines-only grid is already up, then redraws once with
  // whichever names from the full roster never got a line at all -- never blocks the first paint.
  const [awayRoster, homeRoster] = await Promise.all([ensureRoster(f.away.id), ensureRoster(f.home.id)]);
  if(!$(`#gmbody-${fid}`)?.closest('.gmwrap.open')) return; // collapsed again while the fetch was in flight
  const withoutLines=[...awayRoster,...homeRoster].map(d=>d.name).filter(n=>n && !withKeys.has(normName(cleanSel(n)))).filter((n,i,a)=>a.findIndex(x=>normName(x)===normName(n))===i).sort((a,b)=>a.localeCompare(b));
  draw(withoutLines);
}
function toggleGame(fid){
  const wrap=document.querySelector(`.gmwrap[data-fid="${fid}"]`); if(!wrap) return;
  const opening=!wrap.classList.contains('open');
  wrap.classList.toggle('open',opening);
  if(opening && !wrap.dataset.loaded){ wrap.dataset.loaded='1'; loadGameBody(fid); }
}
// ───────────────────────── wiring ─────────────────────────
let sportGameCounts = {};      // extended window (S.days ahead) -- still what's actually fetched/browsed
let sportGameCountsToday = {}; // just today (ET calendar day) -- what the pill displays and sorts by
async function loadSportGameCounts(){
  const now=Date.now();
  const todayKey=etDateKey(new Date());
  await Promise.all(Object.entries(SPORTS).map(async ([k,S])=>{
    try{
      const raw=[]; let page=1;
      for(let i=0;i<30;i++){ const r=await oo('/fixtures',{sport:S.sport,league:S.league,page}); (r?.data||[]).forEach(f=>raw.push(f)); if(!r?.has_more) break; page++; }
      const upper = S.ml ? Infinity : now+(S.days||1)*24*3600e3;
      let fx = raw.filter(f=>{ const t=new Date(f.start_date).getTime(); return t>=now-4*3600e3 && t<=upper && f.status!=='completed' && f.status!=='cancelled'; });
      if(S.ml){
        const cardOf=f=>(f.tournament?.name)||etDateKey(f.start_date);
        const order=[]; fx.forEach(f=>{ const c=cardOf(f); if(!order.includes(c)) order.push(c); });
        const keep=new Set(order.slice(0,2));
        fx=fx.filter(f=>keep.has(cardOf(f)));
      }
      sportGameCounts[k]=fx.length;
      sportGameCountsToday[k]=fx.filter(f=>etDateKey(f.start_date)===todayKey).length;
    }catch(e){ console.warn('[props] game count failed for',k,e.message); }
  }));
  renderTabs();
}
function renderTabs(){
  // Most games TODAY first -- the extended multi-day count only breaks ties among leagues with
  // nothing on today's slate, so it's never the primary sort.
  const order=Object.entries(SPORTS).sort((a,b)=>(sportGameCountsToday[b[0]]??-1)-(sportGameCountsToday[a[0]]??-1) || (sportGameCounts[b[0]]??-1)-(sportGameCounts[a[0]]??-1));
  $('#tabs').innerHTML=order.map(([k,s])=>{
    const c=sportGameCountsToday[k];
    return `<button class="tab${viewMode==='sport'&&k===sportKey?' on':''}" data-k="${k}">${s.label}${c!=null?`<span class="tcount">${c}</span>`:''}</button>`;
  }).join('')+`<button class="tab${viewMode==='injuries'?' on':''}" data-k="__injuries" style="margin-left:auto;border-color:rgba(251,191,36,.45);${viewMode==='injuries'?'background:rgba(251,191,36,.16);':''}">Injuries</button>`
    +`<button class="tab${viewMode==='tracker'?' on':''}" data-k="__tracker" style="border-color:rgba(34,197,94,.45);${viewMode==='tracker'?'background:rgba(34,197,94,.16);':''}">Tracker${tracked.length?' · '+tracked.filter(t=>!t.final).length:''}</button>`;
  $('#tabs').querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{
    if(b.dataset.k==='__tracker'){ openTracker(); return; }
    if(b.dataset.k==='__injuries'){ openInjuries(); return; }
    clearInterval(trackerTimer); viewMode='sport'; $('.sw').style.display='';
    const same=b.dataset.k===sportKey && mainRows.length;
    sportKey=b.dataset.k; LS.set('props_sport',sportKey); current=null; renderTabs();
    if(same){ renderSlate(); return; }
    mainRows=[]; players=[]; loadedAt=0; $('#view').innerHTML=loadingHtml(SPORTS[sportKey].label); $('#q').value=''; suggest('');
    loadSport(true).then(()=>{ if(!current) renderSlate(); }); })); }
$('#q').addEventListener('input',e=>suggest(e.target.value));
$('#q').addEventListener('focus',e=>suggest(e.target.value));
document.addEventListener('click',e=>{ if(!e.target.closest('.sw')) $('#sug').classList.remove('show'); });
// Search collapses to a plain round button by default -- tapping it opens the input, picking a
// result or clearing/tapping away closes it back down.
function expandSearch(){ $('.sw')?.classList.add('open'); $('#q')?.focus(); }
function collapseSearch(){ $('.sw')?.classList.remove('open'); $('#sug')?.classList.remove('show'); }
$('#sbtn')?.addEventListener('click',expandSearch);
document.addEventListener('click',e=>{ if(!e.target.closest('.sw') && $('#q')?.value==='') collapseSearch(); });
$('#clr').addEventListener('click',()=>{ $('#q').value=''; suggest(''); renderSlate(); collapseSearch(); });
$('#q').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); const {name,mkey}=parseSearchQuery($('#q').value); const hit=players.filter(p=>nameMatches(p.name,name||$('#q').value) && !fixtureIsLive(p.fixtureId))[0]; if(hit){ openPlayer(hit, startIdxFor(hit,mkey)); $('#sug').classList.remove('show'); $('#q').blur(); $('#q').value=''; collapseSearch(); } } });
$('#reload').addEventListener('click',()=>loadSport(true));
$('#gridToggle').classList.toggle('on',gridMode);
$('#gridToggle').addEventListener('click',toggleGridMode);
$('#cfg').addEventListener('click',()=>{ const u=prompt('OpticOdds backend URL (your Vercel /api/odds):',getBackend()); if(u!=null){ LS.set('oo_backend_url',u.trim()||BACKEND_DEFAULT); toast('Backend saved'); } });
renderTabs();
loadBookLogos();
purgeStaleSportCaches();
loadSportGameCounts();
loadSport(false).then(()=>{ if(!current) renderSlate(); if(!sawDeepLinks) console.log('[props] no deep_link fields returned — key may not have deep-link permission'); });
// Splash plays the same short beat every time the app opens, independent of how long the real
// data takes to load — it's a brand moment, not a data-loading spinner (same convention as the
// other tools in this set).
setTimeout(()=>{ const s=document.getElementById('splash'); if(!s) return; s.classList.add('hide'); setTimeout(()=>s.remove(),500); }, 1200);
// iOS-style edge-swipe-back: only arms when the touch actually STARTS within a thin strip at the
// very left edge (like the real iOS gesture) and only fires on a mostly-horizontal drag — a swipe
// starting anywhere else on the page (scrolling a list, swiping a card) never triggers it, so
// there's no toggle needed to keep it from getting in the way.
(function(){
  const EDGE=24, MIN_DX=70, MAX_DY=50;
  let startX=null, startY=null, armed=false;
  document.addEventListener('touchstart', e=>{
    const t=e.touches[0]; armed = t.clientX<=EDGE; startX=t.clientX; startY=t.clientY;
  }, {passive:true});
  document.addEventListener('touchend', e=>{
    if(!armed || startX==null) return; armed=false;
    const t=e.changedTouches[0]; const dx=t.clientX-startX, dy=Math.abs(t.clientY-startY);
    if(dx<MIN_DX || dy>MAX_DY) return;
    const backBtn=document.getElementById('back');
    if(backBtn){ backBtn.click(); return; }
    // No in-page back button here (Tracker/Injuries) -- swipe back to whichever sport tab is active.
    if(viewMode==='tracker'||viewMode==='injuries'){ document.querySelector(`#tabs .tab[data-k="${sportKey}"]`)?.click(); }
  }, {passive:true});
})();
</script>
