:root{
  --bg:#171b24;--bg2:#1e2430;--bg3:#242b3c;--line:#1a1d22;--line2:#262a33;
  --text:#fff;--dim:#fff;--dim2:#fff;
  --purple:#a855f7;--green:#22c55e;--red:#ff5c5c;--cyan:#7dd3fc;--amber:#fbbf24;
  --ov:#4ade80;--un:#fb7185;
  --mono:'JetBrains Mono','Menlo',monospace;--sans:'Plus Jakarta Sans','Helvetica Neue',sans-serif;--oddsfont:'Sharpin','JetBrains Mono','Menlo',monospace;--pricefont:'F1Secuencia','JetBrains Mono','Menlo',monospace;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;-webkit-text-size-adjust:100%;touch-action:manipulation;overscroll-behavior:none;color-scheme:dark;transition:background-color .3s ease}
body{display:flex;flex-direction:column;min-height:100dvh}
input,button,select{font-family:inherit;font-size:16px}
button{cursor:pointer;border:none;background:none;color:inherit}
.mono{font-family:var(--mono)}
.dim{color:#fff}.pos{color:var(--green)}.neg{color:var(--red)}

/* header */
.hdr{position:sticky;top:0;z-index:20;background:rgba(23,27,36,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:calc(var(--sat) + 8px) calc(var(--sar) + 12px) 8px calc(var(--sal) + 12px)}
.tabs{display:flex;align-items:center;gap:6px;padding:3px 2px;margin:-3px -2px 10px -2px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scroll-padding-left:2px}.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:999px;border:1px solid var(--line2);background:var(--bg2);color:#fff;font-weight:700;font-size:12px;letter-spacing:.3px;scroll-snap-align:start}
.tab.on{border-color:var(--purple);color:#fff;background:rgba(168,85,247,.16)}
.tab .tcount{font-family:var(--mono);font-size:10px;font-weight:800;background:rgba(255,255,255,.14);padding:1px 6px;border-radius:999px;color:#fff}
.tab.on .tcount{background:rgba(168,85,247,.35)}
.status{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;font-family:var(--mono);font-size:10px;color:#fff;letter-spacing:.4px;text-transform:uppercase}
.status .r{display:flex;gap:6px;align-items:center}
.ib{width:30px;height:30px;border-radius:50%;border:1px solid var(--line2);background:var(--bg2);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px}
.ib.p{border-color:rgba(168,85,247,.5);color:var(--purple);background:rgba(168,85,247,.12)}

/* main */
main{flex:1;padding:12px calc(var(--sar) + 12px) 160px calc(var(--sal) + 12px)}
.empty{padding:48px 16px;text-align:center;color:var(--dim);font-size:13px;line-height:1.6}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:80px 20px}
.loading .spin{width:36px;height:36px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:var(--purple);animation:ldspin .8s linear infinite}
.loading .lbl{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:#fff}
@keyframes ldspin{to{transform:rotate(360deg)}}
.err{margin:8px 0;padding:10px 12px;border-radius:10px;background:rgba(255,92,92,.1);border:1px solid rgba(255,92,92,.3);color:var(--red);font-size:12px}

/* player card */
.pcard{border:1px solid var(--line2);border-radius:16px;background:linear-gradient(135deg,var(--bg2) 0%,var(--bg) 50%,var(--bg2) 100%);padding:14px;margin-bottom:12px;position:relative;overflow:hidden}
.pcard::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 75% 60% at 15% 0%,rgba(168,85,247,.16) 0%,rgba(168,85,247,.05) 45%,transparent 75%);pointer-events:none}
.pcard>*{position:relative}
.ptop{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.hs{width:64px;height:64px;border-radius:50%;background:var(--bg3);border:2px solid var(--line2);object-fit:cover;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--dim);font-size:16px;overflow:hidden}
.hs img{width:100%;height:100%;object-fit:cover}
.pname{font-family:var(--oddsfont);font-size:18px;font-weight:800;letter-spacing:-.2px;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.tl{width:18px;height:18px;object-fit:contain;vertical-align:middle}
.pname .tl{width:32px;height:32px}
.psub{font-size:11px;color:#fff;margin-top:3px;font-family:var(--mono);display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}
.psub b{color:var(--cyan);font-weight:700}
.psub .mtl{width:16px;height:16px;object-fit:contain;vertical-align:middle}
.psub .mupill{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:999px;border:1px solid var(--line2);background:var(--bg2);color:#fff;font-weight:700}
.psub .mupill .at{opacity:.55;font-weight:400}
.psub .starts{color:var(--cyan)}
.gmt .starts,.sh .starts{color:var(--cyan);opacity:.85}
.pto{display:flex;align-items:center;gap:8px;margin-top:10px}
.pto label{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.4px;font-weight:700}
.pto input{width:92px;padding:6px 10px;background:var(--bg);border:1px solid var(--line2);border-radius:8px;color:#fff;font-family:var(--mono);font-size:16px}
.pto .hint{font-size:10px;color:var(--dim2)}

/* market card */
.mk{border:1px solid var(--line);border-radius:12px;background:rgba(23,27,36,.35);margin-bottom:8px;overflow:hidden}
.mkh{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line);text-align:center}
.lnrow{display:flex;align-items:center;justify-content:center;gap:12px}
.stp{width:30px;height:30px;border-radius:50%;border:1px solid var(--line2);background:var(--bg2);color:#fff;font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.stp:disabled{opacity:1}
.lntag{font-family:var(--mono);font-size:9px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:#fff;display:flex;align-items:center;gap:6px}
.lntag .dot{width:5px;height:5px;border-radius:50%;background:var(--cyan)}
.lntag.alt .dot{background:var(--purple)}
.lntag .lnct{font-weight:800;background:rgba(255,255,255,.12);padding:1px 7px;border-radius:999px;color:#fff}
.lntag.alt .lnct{background:rgba(168,85,247,.28)}
.lntag button{font-size:9px;font-weight:800;letter-spacing:.5px;color:#fff;border:1px solid rgba(168,85,247,.5);border-radius:6px;padding:2px 7px;background:rgba(168,85,247,.14)}
.mkh .t{font-weight:800;font-size:14px;letter-spacing:.2px;color:#fff}
.mkh .ln{font-family:var(--mono);font-weight:700;color:var(--cyan);margin-left:8px}
.sb{padding:5px 10px;border-radius:7px;border:1px solid var(--line2);background:var(--bg2);color:#fff;font-size:11px;font-weight:700}
.sb.on{border-color:var(--purple);color:#fff}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.seg button{padding:5px 12px;font-size:11px;font-weight:800;color:#fff;opacity:1;background:var(--bg2)}
.seg button.on{opacity:1;background:rgba(168,85,247,.22)}
.seg button+button{border-left:1px solid var(--line2)}
.mkh .was{font-family:var(--mono);font-size:10px;font-weight:700;color:#fff;opacity:1;margin-left:6px}
/* Row-per-book board: one row per book, both sides side by side with the book's own logo in
   the middle — tighter and cleaner than two independently-stacked columns of per-side pills. */
.bboard{padding:4px 10px 2px;border-left:1px solid var(--line2);border-right:1px solid var(--line2)}
.seg.srt{display:flex;width:100%;margin-bottom:8px}
.seg.srt button{flex:1;padding:5px 4px;font-size:9.5px}
.bhead{display:grid;grid-template-columns:1fr 24px 1fr;align-items:center;gap:6px;padding:0 2px 5px;font-size:10px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:#fff}
.bhead .bhstat{text-align:center;color:var(--cyan);font-family:var(--mono)}
.bhead span:last-child{text-align:right}
.bhead.single{display:flex;justify-content:center}
.mlcompare{display:flex;align-items:center;justify-content:center;gap:10px;margin:2px 2px 8px;padding:10px 8px;border-radius:12px;background:rgba(168,85,247,.08);border:1px solid rgba(168,85,247,.25)}
.mlside{flex:1;text-align:center;min-width:0;border-radius:9px;padding:5px 4px;transition:background .15s}
.mlside.lead{background:rgba(168,85,247,.18);box-shadow:0 0 0 1px rgba(168,85,247,.5) inset}
.mlnm{font-size:11px;font-weight:800;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mlsz{font-family:var(--oddsfont);font-size:19px;font-weight:800;color:#fff;line-height:1.2;margin-top:2px}
.mlside.lead .mlsz{color:var(--purple)}
.mlodds{font-family:var(--mono);font-size:9.5px;color:#fff;opacity:.6;margin-top:1px}
.mlcompare .mlvs{font-size:9px;font-weight:800;color:#fff;opacity:.4;text-transform:uppercase;flex:0 0 auto}
.mlwho{text-align:center;font-size:10.5px;font-weight:800;color:var(--purple);padding:0 2px 6px;text-transform:uppercase;letter-spacing:.3px}
.brow{display:grid;grid-template-columns:1fr 24px 1fr;align-items:center;gap:6px;padding:3px 2px;border-bottom:1px solid rgba(255,255,255,.06)}
.brow.single{grid-template-columns:24px 1fr}
.brow:last-child{border-bottom:none}
.brow.alt{background:rgba(255,255,255,.025)}
.rlogo{width:24px;height:24px;border-radius:7px;flex:0 0 auto;overflow:hidden;position:relative;box-shadow:inset 0 1px 1px rgba(255,255,255,.5),inset 0 -1px 2px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;background:rgba(23,27,36,.6)}
.rlogo img{display:block;width:100%;height:100%;object-fit:cover}
.rlogo::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.65) 0%,rgba(255,255,255,.28) 32%,rgba(255,255,255,0) 58%);pointer-events:none}
.rlogo .rlogotxt{font-size:7px;font-weight:800;color:#fff;letter-spacing:-.3px}
.rcell{display:flex;flex-direction:column;align-items:center;text-align:center;gap:1px;cursor:default;border-radius:10px;padding:2px;position:relative}
.rcell[role="button"]{cursor:pointer}
.rcell.active{box-shadow:0 0 0 2px var(--purple) inset}
.liqbtn{position:absolute;top:50%;transform:translateY(-50%);cursor:pointer;line-height:1;font-family:var(--mono);font-size:7px;font-weight:800;letter-spacing:.4px;color:var(--purple);padding:3px 5px;border-radius:6px;background:rgba(168,85,247,.12);border:1px solid rgba(168,85,247,.4)}
.liqbtn.edge-l{left:-4px}
.liqbtn.edge-r{right:-4px}
.liqbtn.active{background:rgba(168,85,247,.35);color:#fff;box-shadow:0 0 0 2px var(--purple)}
.rcell.bad{opacity:1}
.rcell.empty{color:#fff;font-size:15px;font-weight:700;cursor:default}
.rcell .rv{font-family:var(--pricefont);color:#fff;font-weight:700;font-size:18px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.2px}
.rcell .rbl{display:block;font-size:8.5px;font-weight:800;padding:2px 6px;margin-top:3px;border-radius:999px;border:1px solid rgba(168,85,247,.55);background:rgba(168,85,247,.16);color:#fff;text-decoration:none;letter-spacing:.2px}
.betpop{position:fixed;z-index:80;display:flex;flex-direction:column;gap:2px;background:var(--bg3);border:1px solid var(--line2);border-radius:10px;padding:5px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.betpop a{padding:6px 14px;border-radius:7px;font-size:12px;font-weight:800;color:#fff;text-decoration:none;white-space:nowrap}
.betpop a:active{background:rgba(255,255,255,.1)}
.rcell .rmeta{display:flex;gap:6px;font-size:9.5px;font-weight:700;color:#fff;margin-top:2px}
.rcell .rmeta .pctv{color:#fff}
.rcell .rliqsum{display:inline-block;font-family:var(--mono);font-size:9px;font-weight:700;color:#fff;margin-top:2px;padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12)}
@keyframes flashUp{0%{background:rgba(74,222,128,.3);color:#4ade80;border-radius:6px}100%{background:transparent;color:inherit}}
@keyframes flashDown{0%{background:rgba(248,113,113,.3);color:#f87171;border-radius:6px}100%{background:transparent;color:inherit}}
.flash-up{animation:flashUp 1.1s ease-out}
.flash-down{animation:flashDown 1.1s ease-out}
@keyframes flashUpRv{0%{background:rgba(74,222,128,.35);color:#4ade80;transform:scale(1.16);border-radius:6px}55%{transform:scale(1.02)}100%{background:transparent;color:#fff;transform:scale(1)}}
@keyframes flashDownRv{0%{background:rgba(248,113,113,.35);color:#f87171;transform:scale(1.16);border-radius:6px}55%{transform:scale(1.02)}100%{background:transparent;color:#fff;transform:scale(1)}}
.rcell .rv.flash-up{animation:flashUpRv 1s ease-out;display:inline-block}
.rcell .rv.flash-down{animation:flashDownRv 1s ease-out;display:inline-block}
@keyframes flashUpPill{0%{background:rgba(74,222,128,.45);color:#4ade80}100%{background:rgba(255,255,255,.08);color:#fff}}
@keyframes flashDownPill{0%{background:rgba(248,113,113,.45);color:#f87171}100%{background:rgba(255,255,255,.08);color:#fff}}
.rcell .rliqsum.flash-up{animation:flashUpPill 1.1s ease-out}
.rcell .rliqsum.flash-down{animation:flashDownPill 1.1s ease-out}
.pdetail{margin:2px 10px 10px;padding:9px 10px;border-radius:10px;background:rgba(23,27,36,.4);border:1px solid var(--purple);font-family:var(--mono);font-size:11px;animation:pdetailGlow 2.2s ease-in-out infinite}
@keyframes pdetailGlow{0%,100%{border-color:var(--purple);box-shadow:0 0 0 0 rgba(168,85,247,.9),0 0 22px 2px rgba(168,85,247,.45)}15%{border-color:var(--purple);box-shadow:0 0 0 3px rgba(168,85,247,.25),0 0 22px 2px rgba(168,85,247,.25)}50%{border-color:rgba(168,85,247,.55);box-shadow:0 0 0 1px rgba(168,85,247,.15),0 0 10px 1px rgba(168,85,247,.12)}85%{border-color:var(--purple);box-shadow:0 0 0 3px rgba(168,85,247,.25),0 0 22px 2px rgba(168,85,247,.25)}}
.bdl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:#fff}
.bdl .s{font-weight:800}.bdl .s.o{color:#fff}.bdl .s.u{color:#fff}
.bdl .liq{color:var(--green);font-weight:800;font-family:var(--sans)}
.bdl .pct{opacity:1;color:#fff}
.bdl .op{color:#fff}
.bdl .clv{font-weight:800;color:#fff}
.bdl .trk{margin-left:4px}
.blad{font-size:10px;color:#fff;padding:5px 0 0 2px;font-family:var(--sans)}
.blad .bladsum{font-weight:800;margin-bottom:4px}
.blad .bladrows{display:flex;flex-wrap:wrap;align-items:center}
.blad .bladrows .wp{color:#fff;opacity:.75}
.blad .bladsep{margin:0 8px;color:#fff}
.bempty{padding:14px 10px;text-align:center;font-size:12px;color:#fff;opacity:1}

/* market carousel */
.mnav{position:sticky;top:var(--hdrh,64px);z-index:15;display:flex;justify-content:safe center;gap:6px;overflow-x:auto;scrollbar-width:none;padding:8px 0 9px;margin:-8px 0 0;background:linear-gradient(180deg,var(--bg) 70%,rgba(23,27,36,0));-webkit-overflow-scrolling:touch}
.mnav::-webkit-scrollbar{display:none}
.mchip{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;border:1px solid var(--line2);background:var(--bg2);color:#fff;font-weight:800;font-size:11.5px;letter-spacing:.3px;white-space:nowrap}
.mchip.on{border-color:var(--purple);background:rgba(168,85,247,.18)}
.mchip .cl{font-family:var(--mono);font-weight:700;font-size:10px;color:var(--cyan)}
.mwrap{position:relative}
.mscroll{display:flex;align-items:flex-start;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior-x:contain;transition:height .18s ease;touch-action:pan-y}
.mscroll::-webkit-scrollbar{display:none}
.mslide{flex:0 0 100%;width:100%;min-width:100%;scroll-snap-align:center;scroll-snap-stop:always}
.mslide .mk{margin-bottom:0}
.marr{position:absolute;top:9px;width:28px;height:28px;border-radius:50%;border:1px solid var(--line2);background:rgba(12,13,16,.92);color:#fff;font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;z-index:6}
.marr.l{left:4px}.marr.r{right:4px}
.marr[disabled]{opacity:1}
.mdots{display:flex;justify-content:center;align-items:center;gap:5px;margin:9px 0 2px}
.mdot{width:6px;height:6px;border-radius:999px;background:rgba(255,255,255,.22);transition:width .18s,background .18s}
.mdot.on{background:var(--purple);width:18px}
.mswipe{text-align:center;font-family:var(--mono);font-size:9.5px;letter-spacing:.5px;text-transform:uppercase;color:#fff;opacity:1;margin-top:4px}

/* slate */
.slate{display:flex;flex-direction:column;gap:8px}
.gm{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;border:1px solid var(--line2);border-radius:14px;background:var(--bg2)}
.gm .tmwrap{min-width:0}
.gm .tm{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;min-width:0}
.gm .tm img{width:22px;height:22px;object-fit:contain}
.gm .at{color:var(--dim2);font-size:11px;font-weight:700;margin:0 2px}
.gm .gmt{font-family:var(--mono);font-size:10px;color:#fff;margin-top:2px}
.gm .gmt .live{color:var(--red);font-weight:800}
.gm .tt{color:#fff;white-space:nowrap;text-align:right;font-weight:800;font-size:14px}
.sh{display:flex;align-items:center;justify-content:space-between;margin:2px 0 8px}
.sh .t{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:#fff}
.sh.shback{position:sticky;top:var(--hdrh,64px);z-index:14;background:var(--bg);padding:8px 0;margin:0 0 8px}
.back{padding:6px 10px;border-radius:8px;border:1px solid var(--line2);background:var(--bg2);color:#fff;font-size:12px;font-weight:700}
.pl{display:flex;align-items:center;justify-content:space-between;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg2);margin-bottom:6px;font-weight:700}
.pl .m{font-family:var(--mono);font-size:10px;color:#fff;font-weight:500}
.flc{display:flex;flex-direction:column;gap:8px;padding:10px;border:1px solid var(--line2);border-radius:16px;background:var(--bg2);cursor:pointer}
.flph{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--bg3);display:flex;align-items:center;justify-content:center}
.flph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.flph .ph{font-size:32px;font-weight:800;color:#fff}
.flnm{font-weight:800;font-size:14px;text-align:center}
.flm{font-family:var(--mono);font-size:10px;color:#fff;text-align:center;white-space:normal}
.fight{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.fight .vs{font-size:10px;color:var(--dim2);font-weight:800}
.bl{width:16px;height:16px;border-radius:4px;object-fit:cover;flex:0 0 auto;margin-right:6px;vertical-align:middle}
.bk .n{display:flex;align-items:center}
a.p{color:#fff;text-decoration:none;border-color:rgba(168,85,247,.55)!important}
/* tracker */
.tk{border:1px solid var(--line2);border-radius:16px;background:linear-gradient(135deg,var(--bg2) 0%,var(--bg) 50%,var(--bg2) 100%);padding:12px;margin-bottom:10px;position:relative;overflow:hidden}
.tk.win{border-color:rgba(34,197,94,.5)}.tk.loss{border-color:rgba(255,92,92,.5)}.tk.push{border-color:rgba(251,191,36,.5)}
.tkh{display:flex;align-items:center;gap:10px}
.tkh .hs{width:40px;height:40px;font-size:12px}
.tkh .who{flex:1;min-width:0}
.tkh .nm{font-weight:800;font-size:14px;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tkh .bet{font-family:var(--mono);font-size:12px;color:#fff;margin-top:2px}
.tkh .bet span{color:#fff;opacity:1}
.tkh .st{font-family:var(--mono);font-size:10px;color:var(--dim);text-align:right;white-space:nowrap}
.tkh .st .live{color:var(--red);font-weight:800}
.res{font-size:10px;font-weight:800;padding:3px 8px;border-radius:6px;letter-spacing:.4px}
.res.win{background:rgba(34,197,94,.16);color:var(--green)}.res.loss{background:rgba(255,92,92,.16);color:var(--red)}.res.push{background:rgba(251,191,36,.16);color:var(--amber)}
.prog{margin-top:10px}
.prog .nums{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;margin-bottom:4px}
.prog .nums b{font-size:16px;color:#fff}
.bar{height:8px;border-radius:999px;background:rgba(255,255,255,.07);overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--purple),var(--cyan));border-radius:999px;transition:width .3s}
.bar i.g{background:var(--green)}.bar i.r{background:var(--red)}
.bar em{position:absolute;top:-3px;bottom:-3px;width:2px;background:#fff;opacity:.7}
.mv{margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mvc{background:rgba(23,27,36,.35);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.mvc .l{font-size:9px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:#fff;opacity:1}
.mvc .v{font-family:var(--mono);font-size:13px;font-weight:800;color:#fff;margin-top:2px}
.mvc .v small{font-size:10px;font-weight:700;margin-left:4px}
.tkbooks{margin-top:8px;display:flex;flex-wrap:wrap;gap:5px}
.tb{font-family:var(--mono);font-size:10px;padding:3px 7px;border-radius:7px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#fff;display:flex;align-items:center;gap:4px}
.tb.pin{background:rgba(168,85,247,.18);border-color:rgba(168,85,247,.5);font-weight:800}
.tb .logow{width:12px;height:12px}
.logow{position:relative;display:inline-block;overflow:hidden;border-radius:4px;flex:0 0 auto;box-shadow:inset 0 1px 1px rgba(255,255,255,.5),inset 0 -1px 2px rgba(0,0,0,.35)}
.logow img{display:block;width:100%;height:100%;object-fit:cover}
.logow::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.65) 0%,rgba(255,255,255,.28) 32%,rgba(255,255,255,0) 58%);pointer-events:none}
.tb .d{color:var(--green)}.tb .g{color:var(--green)}.tb .r{color:var(--red)}
/* buttons: glass/glare sheen (not on price pills — flat background there) */
.tab,.back,.stp,.mchip,.sgb,.trk,.ed,.rm,.big,.pbl{position:relative;overflow:hidden}
.marr{overflow:hidden}
.tab::after,.back::after,.stp::after,.mchip::after,.sgb::after,.trk::after,.ed::after,.rm::after,.big::after,.pbl::after,.marr::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.28) 0%,rgba(255,255,255,.08) 35%,rgba(255,255,255,0) 60%);pointer-events:none}
.snaps{margin-top:10px}
.snaps .hd{font-size:9px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:#fff;opacity:1;margin-bottom:6px}
.snrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed rgba(255,255,255,.07)}
.snrow:last-child{border-bottom:none}
.snrow .t{font-family:var(--mono);font-size:10px;color:#fff;opacity:1;width:56px;flex:0 0 auto}
.snrow .now{color:var(--cyan);opacity:1;font-weight:700}
.snpill{font-family:var(--mono);font-size:11px;font-weight:800;padding:3px 8px;border-radius:7px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:#fff;display:inline-flex;align-items:center;gap:3px}
.snpill.ln{background:rgba(125,211,252,.1);border-color:rgba(125,211,252,.3);color:var(--cyan)}
.snmv{font-size:11px;font-weight:800;width:14px;text-align:center;flex:0 0 auto}
.snmv.up{color:var(--green)}.snmv.dn{color:var(--red)}.snmv.fl{color:#fff;opacity:1}

<body>

<div class="hdr">
  <div class="status"><span id="stat">Pick a sport</span><span class="r"><button class="ib p" id="reload" title="Reload">⟳</button><button class="ib" id="cfg" title="Settings">⚙</button></span></div>
</div>

<main id="view"><div class="loading"><div class="spin"></div><div class="lbl">Loading player props…</div></div></main>

<div class="ftr">
  <div class="tabs" id="tabs"></div>
  <div class="sw">
    <div class="sug" id="sug"></div>
    <div class="sbox">
      <button class="cl" id="clr">✕</button>
      <input id="q" placeholder="Search player…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="go">
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ───────────────────────── config ─────────────────────────
const LS = { get:(k,d)=>{ try{ const v=localStorage.getItem(k); return v==null?d:v; }catch(e){ return d; } }, set:(k,v)=>{ try{ localStorage.setItem(k,v); }catch(e){} } };
const BACKEND_DEFAULT = 'https://nfl-props-tracker-1.vercel.app/api/odds';
const getBackend = () => LS.get('oo_backend_url', BACKEND_DEFAULT);

// Your books, in display order. Courtside / Onyx fold into DraftKings. Kalshi is an exchange.
const BOOKS = ['Props Builder','FanDuel','Novig','Prophet X','Kalshi','Pinnacle','bet105','DraftKings','Fliff','BetOnline'];
const BOOK_REQ = [...BOOKS,'Courtside','Onyx Odds'];
const EXCH = new Set(['novig','prophet x','kalshi']);
const SHOW_MAX = new Set(['pinnacle','bet105']); // flat-limit books whose max we show under the odds too
const SHORT = { 'props builder':'PB','fanduel':'FD','novig':'Novig','prophet x':'PX','kalshi':'Kalshi','pinnacle':'Pin','bet105':'b105','draftkings':'DK','fliff':'Fliff','betonline':'BOL' };
const canonBook = n => { const k=String(n||'').toLowerCase(); if(k==='courtside'||k==='onyx odds') return 'draftkings'; return k; };
const bookLabel = n => { const k=canonBook(n); return BOOKS.find(b=>b.toLowerCase()===k) || n; };
const bookShort = n => SHORT[canonBook(n)] || n;

// Market definitions per sport: key, label, keyword test on the OpticOdds market name (lowercased)
const PERIOD = /quarter|half|1st|2nd|3rd|4th|first|last|overtime|period|double|triple|basket|alternate|odd|even|milestone|race|to score|to record|to get|band|exact|margin|method|combo/;
const has = (m, ...w) => w.every(x=>m.includes(x));
// Order here is the order you swipe through them on a player: Points → Assists → Rebounds → PRA → 3PM.
const THREE = /three|3-point|3 point|3pt|3pm/;
const NBA_MKTS = [
  ['pts','Points',   m=>has(m,'point')&&!THREE.test(m)&&!has(m,'rebound')&&!has(m,'assist')&&!m.includes('+')],
  ['ast','Assists',  m=>has(m,'assist')&&!has(m,'point')&&!has(m,'rebound')],
  ['reb','Rebounds', m=>has(m,'rebound')&&!has(m,'point')&&!has(m,'assist')],
  ['pra','PRA',      m=>has(m,'point','rebound','assist')],
  ['3pm','3PM',      m=>THREE.test(m)],
  ['pr','P+R',       m=>has(m,'point','rebound')&&!has(m,'assist')],
  ['pa','P+A',       m=>has(m,'point','assist')&&!has(m,'rebound')],
  ['ra','R+A',       m=>has(m,'rebound','assist')&&!has(m,'point')],
];
// Straight fight winner, matched by exact name only: anything with a suffix
// (3-way, a round, a method, a distance) is a different bet.
const MMA_ML = new Set(['moneyline','fight winner','to win fight','winner']);
const MLB_MKTS = [
  ['hits','Hits',         m=>has(m,'hit')&&!has(m,'allow')&&!has(m,'total base')&&!has(m,'extra base')&&!has(m,'run')&&!has(m,'rbi')],
  ['xbh','Extra Base Hits', m=>has(m,'extra base')],
  ['tb','Total Bases',    m=>has(m,'total base')],
  ['hr','Home Runs',      m=>has(m,'home run')],
  ['rbi','RBIs',          m=>has(m,'rbi')],
  ['runs','Runs Scored',  m=>has(m,'run')&&!has(m,'home run')&&!has(m,'earned')&&!has(m,'rbi')],
  ['bb','Walks',          m=>has(m,'walk')&&!has(m,'allow')],
  ['sb','Stolen Bases',   m=>has(m,'stolen base')],
  ['k','Strikeouts',      m=>has(m,'strikeout')&&!has(m,'allow')&&!has(m,'pitcher')],
  ['pk','Pitcher Ks',     m=>has(m,'strikeout')&&(has(m,'pitcher')||has(m,'allow'))],
  ['ha','Hits Allowed',   m=>has(m,'hit')&&has(m,'allow')&&!has(m,'extra base')],
  ['er','Earned Runs',    m=>has(m,'earned run')],
  ['wa','Walks Allowed',  m=>has(m,'walk')&&has(m,'allow')],
  ['out','Pitching Outs', m=>has(m,'out')],
];
const SPORTS = {
  nfl:  { label:'NFL',  sport:'football',   league:'nfl',  days:7, markets:[
          ['pass_yds','Pass Yds', m=>has(m,'passing yards')&&!m.includes('+')],
          ['pass_td','Pass TD',   m=>has(m,'passing touchdown')&&!m.includes('+')],
          ['pass_att','Pass Att', m=>has(m,'passing attempt')&&!m.includes('+')],
          ['pass_cmp','Comp',     m=>has(m,'completion')&&!m.includes('+')],
          ['rush_yds','Rush Yds', m=>has(m,'rushing yards')&&!m.includes('+')],
          ['rush_att','Rush Att', m=>has(m,'rushing attempt')&&!m.includes('+')],
          ['rec_yds','Rec Yds',   m=>has(m,'receiving yards')&&!m.includes('+')],
          ['rec','Receptions',    m=>has(m,'reception')&&!has(m,'longest')&&!m.includes('+')],
          ['atd','Anytime TD',    m=>has(m,'anytime')&&has(m,'touchdown')],
        ]},
  nba:  { label:'NBA',  sport:'basketball', league:'nba',  days:2, markets:NBA_MKTS },
  wnba: { label:'WNBA', sport:'basketball', league:'wnba', days:2, markets:NBA_MKTS },
  nhl:  { label:'NHL',  sport:'hockey',     league:'nhl',  days:2, markets:[
          ['sog','Shots',   m=>!m.includes('+')&&(has(m,'shots on goal')||has(m,'shots'))],
          ['pts','Points',  m=>!m.includes('+')&&has(m,'point')&&!has(m,'power')],
          ['g','Goals',     m=>!m.includes('+')&&has(m,'goal')&&!has(m,'shots')&&!has(m,'total goals')&&!has(m,'power')],
          ['a','Assists',   m=>!m.includes('+')&&has(m,'assist')],
          ['sv','Saves',    m=>!m.includes('+')&&has(m,'save')],
        ]},
  mlb:  { label:'MLB',  sport:'baseball',   league:'mlb',  days:1, markets:MLB_MKTS },
  ufc:  { label:'UFC',  sport:'mma',        league:'ufc',  ml:true, markets:[['ml','Moneyline', m=>MMA_ML.has(m)]] },
};
const marketKeyFor = (sportKey, name) => {
  const m = String(name||'').toLowerCase();
  if (!SPORTS[sportKey].ml && PERIOD.test(m)) return null;
  const hit = SPORTS[sportKey].markets.find(([,,t]) => t(m));
  return hit ? hit[0] : null;
};
const marketLabel = (sportKey, key) => (SPORTS[sportKey].markets.find(m=>m[0]===key)||[])[1] || key;

// ───────────────────────── helpers ─────────────────────────
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const loadingHtml = label => `<div class="loading"><div class="spin"></div>${label?`<div class="lbl">${esc(label)}</div>`:''}</div>`;
const fmtAm = v => { const n=Number(v); return isNaN(n)?String(v):(n>0?'+'+n:String(n)); };
const toDec = a => { a=Number(a); return a>0?1+a/100:1+100/Math.abs(a); };
const toAm = d => (d-1)>=1 ? Math.round((d-1)*100) : -Math.round(100/(d-1));
const winPct = a => { a=Number(a); const p=a>0?100/(a+100):Math.abs(a)/(Math.abs(a)+100); return (p*100).toFixed(1); };
const usd = n => n>=1000 ? '$'+(n/1000).toFixed(1).replace(/\.0$/,'')+'k' : '$'+Math.round(n);
// Proper Title Case regardless of source casing, preserving short all-caps words already in the
// source (initials like "T.J.", suffixes like "II"/"III"/"JR") instead of mangling them.
const titleCase = s => String(s||'').split(/\s+/).map(w => w && w.length<=4 && w===w.toUpperCase() && /[A-Z]/.test(w) ? w : (w.charAt(0).toUpperCase()+w.slice(1).toLowerCase())).join(' ');
const playable = (price, playTo) => playTo==null || parseInt(price) >= parseInt(playTo);
const cleanSel = n => String(n||'').replace(/\s*\([^)]*\)\s*$/,'').trim();
const isCombo = n => /\s[+&\/]\s|\s\+|&/.test(String(n||''));
const normName = n => String(n||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/['’.`]/g,'').replace(/[^a-z ]/g,' ').replace(/\s+/g,' ').trim();
const compact = n => normName(n).replace(/ /g,'');
const nameMatches = (name, q) => { const qn=normName(q); if(!qn) return false; const nw=normName(name).split(' '); if(qn.split(' ').every(qw=>nw.some(w=>w.startsWith(qw)))) return true; return compact(name).includes(compact(q)); };
const chunk = (a,n) => { const o=[]; for(let i=0;i<a.length;i+=n) o.push(a.slice(i,i+n)); return o; };
const etTime = iso => { try{ return new Date(iso).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:'America/New_York'}); }catch(e){ return ''; } };
const etDateKey = iso => { try{ return new Date(iso).toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'America/New_York'}); }catch(e){ return ''; } };
const etDay = iso => { try{ return new Date(iso).toLocaleDateString('en-US',{weekday:'short',timeZone:'America/New_York'}); }catch(e){ return ''; } };
// "starts in" countdown text next to a game's post time, shown wherever a prop's game time is
// shown (player header, slate rows, game header) — blank once the game has actually started.
function startsInTxt(iso){
  if(!iso) return '';
  const ms = new Date(iso).getTime() - Date.now();
  if(!isFinite(ms) || ms<=0) return '';
  const mins = Math.round(ms/60000);
  if(mins<60) return `starts in ${mins}m`;
  const h = Math.floor(mins/60), m = mins%60;
  if(h<24) return `starts in ${h}h ${m}m`;
  const d = Math.floor(h/24), hh = h%24;
  return `starts in ${d}d ${hh}h`;
}
let toastT; const toast = m => { const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),1800); };

async function oo(endpoint, params){
  const r = await fetch(getBackend(), { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ endpoint, params:params||{} }) });
  const text = await r.text();
  if(!r.ok){ let m=text; try{ const j=JSON.parse(text); m=j.error+(j.body?' — '+j.body:''); }catch(e){} throw new Error(`backend ${r.status}: ${m}`); }
  return JSON.parse(text);
}

// order-book depth behind the top level, down to play-to
function levelsOf(o){
  const top=Number(o.price);
  const ob=(Array.isArray(o.order_book)?o.order_book:[]).filter(l=>Array.isArray(l)&&l.length>=2);
  const normP=v=>{ v=Number(v); if(isNaN(v)) return NaN; return (v>1&&v<50)?toAm(v):v; };
  const out=[];
  if(ob.length){
    const a0=normP(ob[0][0]), b0=normP(ob[0][1]); const pf=Math.abs(a0-top)<=Math.abs(b0-top);
    if(!window._obLogged){ window._obLogged=true; console.log('[OpticOdds] order_book sample', o.sportsbook, top, JSON.stringify(o.order_book).slice(0,240), '→ priceFirst', pf); }
    ob.forEach(l=>{ const price=pf?normP(l[0]):normP(l[1]); const size=pf?Number(l[1]):Number(l[0]); if(!isNaN(price)&&!isNaN(size)&&size>0) out.push({price,size}); });
  } else if(o.limits?.max) out.push({price:top,size:Number(o.limits.max)});
  return out.sort((a,b)=>b.price-a.price);
}

// ───────────────────────── state ─────────────────────────
let sportKey = LS.get('props_sport','nba');
let viewMode = 'sport';
let injuriesFilter = 'all';
let fixtures = [];          // normalized fixtures for the sport
let mainRows = [];          // main-line odds rows (all fixtures)
let players = [];           // index: {key, name, pid, fixtureId, marketKeys:Set}
let loadedAt = 0;
let current = null;         // selected player index entry
const altCache = {};        // fixtureId|marketName -> rows (every line, not just main)
const altPending = {};
const playerInfo = {};      // pid -> {team, teamId, pos, headshot}
let injuries = { byPid:{}, byName:{}, at:0 };   // from /injuries
const injuriesBySport = {};                      // sportKey -> {list, at}
async function fetchInjuriesList(S){
  const raw=[]; let ip=1;
  for(let i=0;i<10;i++){ const r=await oo('/injuries',{sport:S.sport,league:S.league,page:ip}); const arr=Array.isArray(r?.data)?r.data:[]; arr.forEach(x=>raw.push(x)); if(!r?.has_more) break; ip++; }
  if(raw.length && !window._injLogged){ window._injLogged=true; console.log('[props] injuries sample:', JSON.stringify(raw[0]).slice(0,400)); }
  if(!window._injPredLogged){ window._injPredLogged=true; oo('/injuries/predictions',{league:S.league}).then(r=>console.log('[props] injuries/predictions raw:', JSON.stringify(r).slice(0,800))).catch(e=>console.log('[props] injuries/predictions failed:', e.message)); }
  // rows may be per-team ({team, injuries:[...]}) or flat per-player
  const flat=[]; raw.forEach(x=>{ if(Array.isArray(x.injuries)) x.injuries.forEach(i=>flat.push({...i, _team:x.team||i.team})); else if(Array.isArray(x.players)) x.players.forEach(i=>flat.push({...i,_team:x.team})); else flat.push(x); });
  return flat.map(i=>{
    const pl=i.player||i; const pid=pl.id||i.player_id||null; const nm=pl.name||i.player_name||i.name||'';
    const status=i.status||i.injury_status||i.designation||''; const type=i.type||i.injury_type||'';
    const note=i.description||i.injury||i.comment||i.note||i.details||(type!==status?type:'');
    return { pid, name:String(nm), status:String(status), note:String(note), team:i._team?.name||i.team?.name||'', pos:pl.position||'', updated:i.updated_at||i.updated||i.date||null };
  }).filter(r=>r.name);
}
async function ensureInjuriesFor(sk){
  if(injuriesBySport[sk]) return injuriesBySport[sk].list;
  const S=SPORTS[sk]; if(S.ml) return [];
  try{ const list=await fetchInjuriesList(S); injuriesBySport[sk]={list, at:Date.now()}; return list; }
  catch(e){ console.warn('[props] injuries failed for',sk,e.message); return []; }
}
let bookLogos = {};                             // lowercase book name -> logo url (from /sportsbooks)
let sawDeepLinks = false;
const betChoices = {};                          // "ctx|side|bookKey" -> [{name, dl}] when a Bet button covers >1 app (DK/Courtside/Onyx)
const IS_IOS = /iPhone|iPad|iPod/.test(navigator.userAgent), IS_ANDROID = /Android/.test(navigator.userAgent);
async function loadBookLogos(){
  try{ const c=JSON.parse(LS.get('oo_book_logos','null')); if(c && Date.now()-c.at<86400e3){ bookLogos=c.map; return; } }catch(e){}
  try{ const r=await oo('/sportsbooks',{}); const map={}; (r?.data||[]).forEach(b=>{ if(b?.name&&b?.logo) map[String(b.name).toLowerCase()]=b.logo; }); bookLogos=map; LS.set('oo_book_logos',JSON.stringify({at:Date.now(),map})); }

// ───────────────────────── load ─────────────────────────
async function loadSport(force){
  const S=SPORTS[sportKey]; const stat=$('#stat');
  if(!force && loadedAt && Date.now()-loadedAt<180000 && mainRows.length){ stat.textContent=`${S.label} · ${players.length} players · cached`; return; }
  stat.textContent=`${S.label} · loading fixtures…`;
  try{
    const raw=[]; let page=1;
    for(let i=0;i<30;i++){ const r=await oo('/fixtures',{sport:S.sport,league:S.league,page}); (r?.data||[]).forEach(f=>raw.push(f)); if(!r?.has_more) break; page++; }
    const now=Date.now();
    // Team sports: next `days` days (NFL = the whole week). UFC: every upcoming fight, then the next 2 cards.
    const upper = S.ml ? Infinity : now+(S.days||1)*24*3600e3;
    fixtures = raw.filter(f=>{ const t=new Date(f.start_date).getTime(); return t>=now-4*3600e3 && t<=upper && f.status!=='completed' && f.status!=='cancelled'; })
      .map(f=>({ id:f.id, start:f.start_date, status:f.status, live:!!f.is_live, card:(f.tournament?.name)||etDateKey(f.start_date),
        home:{id:f.home_competitors?.[0]?.id, name:f.home_competitors?.[0]?.name||f.home_team_display||'', ab:f.home_competitors?.[0]?.abbreviation||'', logo:f.home_competitors?.[0]?.logo||''},
        away:{id:f.away_competitors?.[0]?.id, name:f.away_competitors?.[0]?.name||f.away_team_display||'', ab:f.away_competitors?.[0]?.abbreviation||'', logo:f.away_competitors?.[0]?.logo||''} }))
      .sort((a,b)=>new Date(a.start)-new Date(b.start));
    if(S.ml){
      const order=[]; fixtures.forEach(f=>{ if(!order.includes(f.card)) order.push(f.card); });
      const keep=new Set(order.slice(0,2));
      fixtures=fixtures.filter(f=>keep.has(f.card));
      console.log('[props] UFC cards kept:', [...keep]);
    }
    console.log(`[props] ${S.label} fixtures: ${raw.length} fetched, ${fixtures.length} in window`, fixtures.map(f=>`${f.away.ab||f.away.name}@${f.home.ab||f.home.name} ${f.status}`));
    if(!fixtures.length){ stat.textContent=`${S.label} · no games in the next 30h`; mainRows=[]; players=[]; loadedAt=Date.now(); return; }
    // injuries (best-effort; schema read defensively)
    stat.textContent=`${S.label} · loading injuries…`;
    injuries={ byPid:{}, byName:{}, at:Date.now() };
    if(!S.ml){ try{
      const list=await fetchInjuriesList(S);
      list.forEach(rec=>{ if(rec.pid) injuries.byPid[rec.pid]=rec; if(rec.name) injuries.byName[normName(rec.name)]=rec; });
      injuriesBySport[sportKey]={ list, at:Date.now() };
      console.log(`[props] injuries: ${list.length} entries`);
    }catch(e){ console.warn('[props] injuries failed',e.message); } }
    // main lines, 5 fixtures × 5 books per call
    mainRows=[]; let done=0; const fxChunks=chunk(fixtures,5), bkChunks=chunk(BOOK_REQ,5); const total=fxChunks.length*bkChunks.length;
    for(const fx of fxChunks) for(const bk of bkChunks){
      stat.textContent=`${S.label} · loading lines ${++done}/${total}…`;
      try{ const r=await oo('/fixtures/odds',{fixture_id:fx.map(f=>f.id),sportsbook:bk,is_main:true}); (r?.data||[]).forEach(d=>(d.odds||[]).forEach(o=>{ o._fx=d.id; mainRows.push(o); })); }
      catch(e){ console.warn('[props] chunk failed',e.message); }
    }
    // index players from prop rows (player_id set) or fighters from moneyline selections (UFC)
    const idx={}; const multiPid={};
    mainRows.forEach(o=>{
      const mk=marketKeyFor(sportKey,o.market); if(!mk) return;
      const sel=cleanSel(o.selection||o.name); if(!sel) return;
      if(!S.ml && !o.player_id) return;
      if(isCombo(sel)) return;                       // two-player combos are not players
      if(S.ml && /^(draw|tie|no contest|neither|either)\b/.test(normName(sel))) return;
      const key=normName(sel); if(!key) return;
      if(!idx[key]) idx[key]={ key, name:sel, pid:o.player_id||null, pids:new Set(), fixtureId:o._fx, marketKeys:new Set() };
      if(o.player_id){ idx[key].pids.add(o.player_id); if(!idx[key].pid) idx[key].pid=o.player_id; }
      idx[key].marketKeys.add(mk);
    });
    players=Object.values(idx).sort((a,b)=>a.name.localeCompare(b.name));
    players.filter(p=>p.pids.size>1).slice(0,3).forEach(p=>console.log('[props] same name, multiple player_ids:', p.name, [...p.pids]));
    loadedAt=Date.now();
    console.log('[props] deep links present:', mainRows.some(o=>o.deep_link && (o.deep_link.ios||o.deep_link.desktop)));
    const seenMk=[...new Set(mainRows.map(o=>o.market))]; console.log('[props] markets seen:',seenMk);
    if(S.ml) console.log('[props] moneyline-ish markets seen:', seenMk.filter(m=>/moneyline|winner|win /i.test(m)), '| kept:', seenMk.filter(m=>MMA_ML.has(String(m).toLowerCase()))); console.log('[props] books seen:',[...new Set(mainRows.map(o=>o.sportsbook))]);
    stat.textContent= S.ml ? `UFC · ${[...new Set(fixtures.map(f=>f.card))].join(' + ')} · ${players.length} fighters`
                           : `${S.label} · ${fixtures.length} games · ${[...new Set(fixtures.map(f=>etDateKey(f.start)))].length}d · ${players.length} players`;
    if(current){ const again=players.find(p=>p.key===current.key); if(again) openPlayer(again, curMktIdx); }
  }catch(e){
    console.error(e); stat.textContent=`${S.label} · load failed`;
    $('#view').innerHTML=`<div class="err">${esc(e.message)}<br><span class="dim">Check the backend URL via ⚙.</span></div>`;
  }
}

// ───────────────────────── search ─────────────────────────
// "lebron james assists" -> {name:"lebron james", mkey:"ast"}; trailing text matching a
// market label (this sport's, longest label first, on a word boundary) is split off.
function parseSearchQuery(q){
  q=String(q||'').trim(); if(!q) return {name:'', mkey:null};
  const ql=q.toLowerCase();
  const cands=SPORTS[sportKey].markets.map(([k,label])=>({k,label:label.toLowerCase()})).sort((a,b)=>b.label.length-a.label.length);
  for(const {k,label} of cands){
    const idx=ql.length-label.length;
    if(idx<=0) continue;
    if(ql.slice(idx)===label && /\s/.test(ql[idx-1])) return {name:q.slice(0,idx).trim(), mkey:k};
  }
  return {name:q, mkey:null};
}
const startIdxFor = (p, mkey) => { if(!mkey) return 0; const mkeys=SPORTS[sportKey].markets.map(m=>m[0]).filter(k=>p.marketKeys.has(k)); const i=mkeys.indexOf(mkey); return i<0?0:i; };
const teamLogoFor = p => { const info=p.pid?playerInfo[p.pid]:null; const f=fixtures.find(x=>x.id===p.fixtureId); if(!info?.teamId||!f) return ''; return f.home.id===info.teamId?f.home.logo:(f.away.id===info.teamId?f.away.logo:''); };
function suggest(q){
  const box=$('#sug'); q=String(q||'').trim();
  if(!q||!players.length){ box.classList.remove('show'); box.innerHTML=''; return; }
  const {name,mkey}=parseSearchQuery(q);
  const hits=players.filter(p=>nameMatches(p.name,name||q)).slice(0,12);
  if(!hits.length){ box.innerHTML=`<div class="si"><span class="nm dim">No ${SPORTS[sportKey].ml?'fighter':'player'} matches "${esc(q)}"</span></div>`; box.classList.add('show'); return; }
  const mhit = mkey ? `<span class="mhit">→ ${esc(marketLabel(sportKey,mkey))}</span> ` : '';
  box.innerHTML=hits.map((p,i)=>{ const f=fixtures.find(x=>x.id===p.fixtureId); const lg=teamLogoFor(p); return `<div class="si" data-i="${i}"><span class="nm">${lg?`<img class="stl" src="${esc(lg)}" alt="">`:''}${esc(titleCase(p.name))} ${injPill(p)}</span><span class="g">${mhit}${f?(SPORTS[sportKey].ml?`${esc(f.card)} · ${etDay(f.start)}`:`${esc(f.away.ab)}@${esc(f.home.ab)} ${etDay(f.start)} ${etTime(f.start)}`):''}</span></div>`; }).join('');
  box.querySelectorAll('.si[data-i]').forEach(el=>el.addEventListener('click',()=>{ const p=hits[+el.dataset.i]; openPlayer(p, startIdxFor(p,mkey)); box.classList.remove('show'); $('#q').blur(); }));
  box.classList.add('show');
  hits.forEach((p,i)=>{
    if(!p.pid || playerInfo[p.pid]) return;
    fetchPlayerInfo(p).then(()=>{
      if(!box.classList.contains('show')) return;
      const nm=box.querySelector(`.si[data-i="${i}"] .nm`); if(!nm || nm.querySelector('.stl')) return;
      const lg=teamLogoFor(p); if(!lg) return;
      nm.insertAdjacentHTML('afterbegin', `<img class="stl" src="${esc(lg)}" alt="">`);
    });
  });
}

function injuryFor(p){ return (p.pid && injuries.byPid[p.pid]) || injuries.byName[normName(p.name)] || null; }
function injClass(st){ const s=String(st||'').toLowerCase(); if(/out|ir|suspend|inactive/.test(s)) return 'out'; if(/quest|doubt|gtd|game.?time|day.?to.?day|dtd/.test(s)) return 'q'; return 'p'; }
function injShort(st){ const s=String(st||'').toLowerCase(); if(/^out\b|out\b/.test(s)) return 'OUT'; if(/injured reserve|\bir\b/.test(s)) return 'IR'; if(/doubt/.test(s)) return 'D'; if(/quest/.test(s)) return 'Q'; if(/game.?time|gtd/.test(s)) return 'GTD'; if(/day.?to.?day|dtd/.test(s)) return 'DTD'; if(/prob/.test(s)) return 'P'; if(/suspend/.test(s)) return 'SUSP'; return String(st||'').slice(0,6).toUpperCase()||'INJ'; }
function injPill(p){ const i=injuryFor(p); return i?`<span class="inj ${injClass(i.status)}" title="${esc(i.note||'')}">${esc(injShort(i.status))}</span>`:''; }
// ───────────────────────── player view ─────────────────────────
async function fetchPlayerInfo(p){
  if(!p.pid) return null;
  if(playerInfo[p.pid]) return playerInfo[p.pid];
  try{ const r=await oo('/players',{id:[p.pid]}); const d=r?.data?.[0]; if(d){ playerInfo[p.pid]={ teamId:d.team?.id, team:d.team?.name||'', pos:d.position||'', headshot:d.logo||'' }; } }
  catch(e){ console.warn('[props] player info failed',e.message); }
  return playerInfo[p.pid]||null;
}
function rowsFor(p, mkey, rows){

let curMktIdx = 0;

function initMarketScroll(mkeys, startIdx){
  syncHdrH();

  window.gotoMarket=go;
  let st;

function lineForMarket(p, mkey, rows){

  const cnt={}; rows.forEach(o=>{ if(o.points!=null) cnt[o.points]=(cnt[o.points]||0)+1; });
  const ks=Object.keys(cnt);
  return ks.length ? Number(ks.sort((a,b)=>cnt[b]-cnt[a])[0]) : null;
}
function marketCardHtml(p, mkey){
  const ctx=`${p.key}|${mkey}`; const pt=ptFor(p,mkey);
  const mainLine=lineForMarket(p,mkey);
  const sel=selLine[ctx];
  const nowRows=cardRows(p,mkey,ctx);
  const nowLine=sel!=null?Number(sel):mainLine;
  const opRows=sel==null?openRowsFor(p,mkey):[];
  const opLine=opRows.length?lineForMarket(p,mkey,opRows):null;
  const isSingle = !nowRows.some(o=>sideOf(o)!=='single');
  const line = nowLine;
  const ls=altLines[ctx]; const at=ls?ls.indexOf(Number(nowLine)):-1;
  const stp = isSingle ? '' : `<button class="stp" data-step="-1" data-ctx="${ctx}"${ls&&at===0?' disabled':''}>‹</button>`;
  const stpR = isSingle ? '' : `<button class="stp" data-step="1" data-ctx="${ctx}"${ls&&at===ls.length-1?' disabled':''}>›</button>`;
  const bookCount = new Set(nowRows.map(o=>canonBook(o.sportsbook))).size;
  const tag = (isSingle || sel==null) ? '' : `<div class="lntag alt"><span class="dot"></span>Alt line${mainLine!=null?` · consensus ${mainLine}`:''}<span class="lnct">${bookCount}</span><button data-reset="${ctx}">Back</button></div>`;
  const was = opLine!=null && nowLine!=null && opLine!==nowLine ? `<span class="was">from ${opLine}</span>` : '';
  const body = nowRows.length ? boardHtml(nowRows,p,mkey,ctx,nowLine,pt,false) : `<div class="bempty">No book is posting ${nowLine}.</div>`;
  return `<div class="mk${isSingle?' single':''}" data-ctx="${ctx}" data-line="${nowLine??''}">
    <div class="mkh">
      <div class="lnrow">${stp}<span><span class="t">${esc(marketLabel(sportKey,mkey))}</span>${line!=null?`<span class="ln">${line}</span>`:''}${was}</span>${stpR}</div>
      ${tag}
    </div>
    ${body}
  </div>`;
}
function bindView(p){

  document.querySelectorAll('.mk [data-betchoice]').forEach(btn=>btn.addEventListener('click',ev=>{

    showBetChoice(btn, betChoices[btn.dataset.betchoice]||[]);
  }));
  document.querySelectorAll('.mk [data-pill]').forEach(btn=>btn.addEventListener('click',()=>{
    const parts=btn.dataset.pill.split('|'); const bk=parts.pop(), sd=parts.pop(); const ctx=parts.join('|'); const key=sd+'|'+bk;
    const turningOn = activePill[ctx]!==key;
    activePill[ctx] = turningOn ? key : null;
    rerenderCard(p,ctx);
    // Exchange pills reveal the order-book depth breakdown below the board — bring it into
    // view. .pdetail itself glows continuously the whole time it's shown (see pdetailGlow),
    // so there's nothing to add/remove here once it's scrolled to.
    if(turningOn && EXCH.has(bk)){
      const det=document.querySelector(`.mk[data-ctx="${CSS.escape(ctx)}"] .pdetail`);
      if(det) det.scrollIntoView({behavior:'smooth', block:'center'});
    }
  }));
  document.querySelectorAll('.stp').forEach(b=>b.addEventListener('click',()=>stepLine(p,b.dataset.ctx,Number(b.dataset.step))));
  document.querySelectorAll('[data-reset]').forEach(b=>b.addEventListener('click',()=>{ selLine[b.dataset.reset]=null; rerenderCard(p,b.dataset.reset); }));
  document.querySelectorAll('.mk:not(.single)').forEach(mk=>{
    const ctx=mk.dataset.ctx; let sx=0, sy=0, t0=0, tracking=false, locked=false;
    mk.addEventListener('touchstart',ev=>{ if(ev.touches.length!==1) return; const t=ev.touches[0]; sx=t.clientX; sy=t.clientY; t0=Date.now(); tracking=true; locked=false; },{passive:true});
    // touch-action:pan-y on .mscroll is meant to stop the market carousel from stealing a
    // horizontal drag meant for alt-line stepping, but some browsers still let the native
    // scroll engage anyway — so once a drag reads as clearly horizontal, preventDefault it
    // here too, killing the carousel scroll outright rather than trusting CSS alone.
    mk.addEventListener('touchmove',ev=>{
      if(!tracking || ev.touches.length!==1) return;
      const t=ev.touches[0]; const dx=t.clientX-sx, dy=t.clientY-sy;
      if(!locked && Math.abs(dx)>10 && Math.abs(dx)>Math.abs(dy)*1.5) locked=true;
      if(locked) ev.preventDefault();
    },{passive:false});
    mk.addEventListener('touchend',ev=>{
      if(!tracking) return; tracking=false;
      const t=ev.changedTouches[0]; const dx=t.clientX-sx, dy=t.clientY-sy, dt=Date.now()-t0;
      if(dt<600 && Math.abs(dx)>40 && Math.abs(dx)>Math.abs(dy)*1.5) stepLine(p, ctx, dx<0?1:-1);
    },{passive:true});
  });

  document.querySelectorAll('.sgb[data-srt]').forEach(b=>b.addEventListener('click',()=>setBoardSort(p,b.dataset.ctx,b.dataset.srt)));
  document.querySelectorAll('[data-trackbk]').forEach(b=>b.addEventListener('click',ev=>{
    ev.stopPropagation(); const [key,mk2,side,ln,bk]=b.dataset.trackbk.split('|');
    trackProp(p,mk2,side,ln===''?null:Number(ln),cardSrc(p,mk2,`${p.key}|${mk2}`),bk); b.textContent='Tracked'; b.classList.add('on');
  }));
}

const histCache = {};   // fixtureId|markets -> rows (olv/clv per book, main lines)
const histPending = {};
const boardSort = {};   // card ctx -> 'best' | 'worst' | 'liq' (default 'best')
const activePill = {};  // card ctx -> "side|bookKey" whose detail is expanded
const selLine = {};     // card ctx -> the line you stepped to (null = the board's own lines)
const altLines = {};    // card ctx -> every line the books post, low to high
const altKey = (p,mkey) => `${p.fixtureId}|${marketNamesFor(p,mkey).join(',')}`;
async function ensureAlts(p, mkey){
  const marketNames=marketNamesFor(p,mkey); if(!marketNames.length) return [];
  const ck=`${p.fixtureId}|${marketNames.join(',')}`;
  if(altCache[ck]) return altCache[ck];
  if(altPending[ck]) return altPending[ck];
  altPending[ck]=(async()=>{
    const rows=[];
    for(const bk of chunk(BOOK_REQ,5)){ try{ const r=await oo('/fixtures/odds',{fixture_id:[p.fixtureId],sportsbook:bk,market:marketNames}); (r?.data?.[0]?.odds||[]).forEach(o=>{ o._fx=p.fixtureId; rows.push(o); }); }catch(e){ console.warn('[props] alts chunk failed',e.message); } }
    altCache[ck]=rows; delete altPending[ck]; return rows;
  })();
  return altPending[ck];
}
// rows the card is showing: the board's own main lines, or everyone at one stepped line
const cardSrc = (p,mkey,ctx) => selLine[ctx]==null ? mainRows : (altCache[altKey(p,mkey)]||mainRows);
function cardRows(p, mkey, ctx){
  const sel=selLine[ctx];
  const rows=rowsFor(p,mkey,cardSrc(p,mkey,ctx));
  if(sel!=null) return rows.filter(o=>Number(o.points)===Number(sel));
  // consensus board: only books tied exactly to the consensus line. Anything even
  // slightly off (25.5 vs a 24.5 consensus) goes to its own alt line instead of
  // getting mixed into the consensus board.
  const main=lineForMarket(p,mkey);
  if(main==null) return rows;
  return rows.filter(o=>{ if(o.points==null) return true; return Number(o.points)===Number(main); });
}
async function stepLine(p, ctx, dir){
  const [,mkey]=ctx.split('|'); const main=lineForMarket(p,mkey);
  if(!altLines[ctx]){
    const btns=document.querySelectorAll(`.stp[data-ctx="${ctx}"]`); btns.forEach(b=>b.disabled=true);
    const rows=await ensureAlts(p,mkey);
    const ls=[...new Set(rowsFor(p,mkey,rows).map(o=>o.points).filter(v=>v!=null).map(Number))].sort((a,b)=>a-b);
    altLines[ctx]=ls.length?ls:(main!=null?[main]:[]);
    btns.forEach(b=>b.disabled=false);
  }
  const lines=altLines[ctx];
  if(lines.length<2){ toast('No alt lines posted'); return; }
  const cur=selLine[ctx]??main;
  let i=lines.indexOf(Number(cur));
  if(i<0){ i=lines.findIndex(l=>l>Number(cur)); if(i<0) i=lines.length-1; if(dir<0&&i>0) i--; }
  else i=Math.max(0,Math.min(lines.length-1,i+dir));
  selLine[ctx] = (main!=null && lines[i]===main) ? null : lines[i];
  rerenderCard(p,ctx);
}
const marketNamesFor = (p,mkey) => [...new Set(rowsFor(p,mkey,mainRows).map(o=>o.market))];
const histKey = (p,mkey) => `${p.fixtureId}|${marketNamesFor(p,mkey).join(',')}`;
async function ensureHist(p, mkey){
  const marketNames=marketNamesFor(p,mkey); if(!marketNames.length) return [];
  const ck=`${p.fixtureId}|${marketNames.join(',')}`;
  if(histCache[ck]) return histCache[ck];
  if(histPending[ck]) return histPending[ck];
  histPending[ck]=(async()=>{
    const rows=[];
    for(const bk of chunk(BOOK_REQ,5)){ try{ const r=await oo('/fixtures/odds/historical',{fixture_id:p.fixtureId,sportsbook:bk,market:marketNames,is_main:true}); (r?.data?.[0]?.odds||[]).forEach(o=>{ o._fx=p.fixtureId; rows.push(o); }); }catch(e){ console.warn('[props] history chunk failed',e.message); } }
    if(rows.length && !window._histLogged){ window._histLogged=true; console.log('[props] historical sample:', JSON.stringify(rows[0]).slice(0,400)); }
    histCache[ck]=rows; delete histPending[ck]; return rows;

// opening prices as ordinary odds rows, so the same board can render them
function openRowsFor(p, mkey){
  const src=histCache[histKey(p,mkey)]; if(!src) return [];
  return src.filter(o=>marketKeyFor(sportKey,o.market)===mkey && normName(cleanSel(o.selection||o.name))===p.key && o.olv && o.olv.price!=null)
            .map(o=>({...o, price:o.olv.price, points:o.olv.points??o.points??null, limits:null, order_book:null, deep_link:null}));
}
// book|side -> what that book opened at, for the inline open/CLV note on a row
function openMap(p, mkey){
  const src=histCache[histKey(p,mkey)]; if(!src) return null;
  const m={};
  src.filter(o=>marketKeyFor(sportKey,o.market)===mkey && normName(cleanSel(o.selection||o.name))===p.key && o.olv && o.olv.price!=null)
     .forEach(o=>{ m[canonBook(o.sportsbook)+'|'+sideOf(o)]={price:Number(o.olv.price), points:o.olv.points??null}; });

let tracked = (()=>{ try{ return JSON.parse(LS.get('props_tracked','[]'))||[]; }catch(e){ return []; } })();
const saveTracked = () => LS.set('props_tracked', JSON.stringify(tracked));
const sideKey = lbl => String(lbl).toLowerCase()==='over'?'over':String(lbl).toLowerCase()==='under'?'under':(String(lbl)==='ML'?'ML':'Yes');
function isTracked(p,mkey,label,line,bookKey){ const sk=sideKey(label); return tracked.some(t=>t.playerKey===p.key&&t.fixtureId===p.fixtureId&&t.mkey===mkey&&t.side===sk&&Number(t.line??-1)===Number(line??-1)&&(bookKey==null||t.bookKey===bookKey)); }
function snapshotFrom(rows, side, line){
  const at=Date.now(); const byBook={};
  rows.forEach(o=>{ if(side==='over'||side==='under'){ if(sideOf(o)!==side) return; if(line!=null && Number(o.points)!==Number(line)) return; } const k=canonBook(o.sportsbook); if(!byBook[k]||Number(o.price)>Number(byBook[k].price)) byBook[k]={price:Number(o.price),points:o.points??null,liq:o.limits?.max??null}; });

function mainLineOf(rows, side){ const c={}; rows.forEach(o=>{ if(o.points==null) return; if((side==='over'||side==='under') && sideOf(o)!==side) return; c[o.points]=(c[o.points]||0)+1; }); const k=Object.keys(c).sort((a,b)=>c[b]-c[a])[0]; return k==null?null:Number(k); }

    playerKey:p.key, playerName:p.name, pid:p.pid||null, headshot:info?.headshot||'', teamAb, teamLogo: info?.teamId ? (f?.home.id===info.teamId?f.home.logo:f?.away.logo) : '',
    mkey, marketLabel:marketLabel(sportKey,mkey), marketNames:[...new Set(rowsAll.map(o=>o.market))], side, line:line??null,
    price:bestBook?bestBook[1].price:snap.best, book:bestBook?bookLabel(bestBook[0]):null, bookKey:bestBook?bestBook[0]:null, pinned:!!bookKey, trackedAt:Date.now(),

// stat resolution from /fixtures/player-results
const STAT_CANDS = {
  pts:['points','pts'], reb:['rebounds','total_rebounds','reb'], ast:['assists','ast'], '3pm':['three_point_field_goals_made','three_pointers_made','three_points_made','threes_made','3pm','three_pointers'],
  pass_yds:['passing_yards'], pass_td:['passing_touchdowns'], pass_att:['passing_attempts'], pass_cmp:['passing_completions','completions'], rush_yds:['rushing_yards'], rush_att:['rushing_attempts'], rec_yds:['receiving_yards'], rec:['receptions'],
  sog:['shots_on_goal','shots'], g:['goals'], a:['assists'], sv:['saves'],
};
function statFor(r, mkey, sportKey, marketNames){
  const periods=Array.isArray(r.stats)?r.stats:[]; const all=(periods.find(x=>x.period==='all')||periods[0]||{}).stats||{};
  const ms=r.market_stats||{};
  if(!window._prLogged && Object.keys(all).length){ window._prLogged=true; console.log('[props] player-results stat keys ('+(r.player?.name||'')+'):',Object.keys(all),'| market_stats:',Object.keys(ms)); }
  // 1) market_stats keyed by the market name
  for(const mn of (marketNames||[])){ if(ms[mn]!=null) return Number(ms[mn]); const k=Object.keys(ms).find(x=>x.toLowerCase()===String(mn).toLowerCase()); if(k) return Number(ms[k]); }
  const get=k=>{ for(const c of (STAT_CANDS[k]||[])) if(all[c]!=null) return Number(all[c]); const flat=k.replace(/_/g,''); const kk=Object.keys(all).find(x=>x.toLowerCase().replace(/_/g,'')===flat); return kk?Number(all[kk]):null; };
  const sum=(...ks)=>{ const v=ks.map(get); return v.some(x=>x==null)?null:v.reduce((a,b)=>a+b,0); };
  if(sportKey==='nfl'){ if(mkey==='atd'){ const t=sum('rushing_touchdowns','receiving_touchdowns'); return t; } return get(mkey); }
  if(sportKey==='nhl'){ if(mkey==='pts') return get('points'); return get(mkey); }
  if(mkey==='pra') return sum('pts','reb','ast'); if(mkey==='pr') return sum('pts','reb'); if(mkey==='pa') return sum('pts','ast'); if(mkey==='ra') return sum('reb','ast');
  return get(mkey);
}
function gradeTracked(t){
  if(t.actual==null || !t.final) return null;
  if(t.side==='over') return t.actual>t.line?'win':t.actual===t.line?'push':'loss';
  if(t.side==='under') return t.actual<t.line?'win':t.actual===t.line?'push':'loss';
  return t.result||null;
}
let trackerBusy=false;
async function refreshTracker(){
  if(trackerBusy||!tracked.length) return; trackerBusy=true;
  const stat=$('#stat'); stat.textContent='Tracker · refreshing…';
  try{
    const open=tracked.filter(t=>!t.final);
    const fids=[...new Set(open.map(t=>t.fixtureId))];
    // 1) fixture results (status, clock, scores)
    const res={};
    for(const ids of chunk(fids,5)){ try{ const r=await oo('/fixtures/results',{fixture_id:ids}); (r?.data||[]).forEach(x=>{ if(x?.fixture?.id) res[x.fixture.id]=x; }); }catch(e){ console.warn('[tracker] results',e.message); } }
    // 2) player results for live/completed
    const liveOrDone=fids.filter(id=>{ const st=res[id]?.fixture?.status; return st&&st!=='unplayed'; });
    const pr={};
    for(const ids of chunk(liveOrDone,5)){ try{ const r=await oo('/fixtures/player-results',{fixture_id:ids}); (r?.data||[]).forEach(x=>{ if(x?.fixture?.id) pr[x.fixture.id]=x; }); }catch(e){ console.warn('[tracker] player-results',e.message); } }
    // 3) current odds per fixture+market (all lines) for movement + per-book board
    const groups={}; open.forEach(t=>{ const k=t.fixtureId+'|'+t.marketNames.join(','); (groups[k]=groups[k]||{fixtureId:t.fixtureId,marketNames:t.marketNames,items:[]}).items.push(t); });
    for(const g of Object.values(groups)){
      const st=res[g.fixtureId]?.fixture?.status;
      if(st&&st!=='unplayed') continue; // odds are gone once it starts
      const rows=[];
      for(const bk of chunk(BOOK_REQ,5)){ try{ const r=await oo('/fixtures/odds',{fixture_id:[g.fixtureId],sportsbook:bk,market:g.marketNames}); (r?.data?.[0]?.odds||[]).forEach(o=>rows.push(o)); }catch(e){} }
      g.items.forEach(t=>{ const mine=rows.filter(o=>normName(cleanSel(o.selection||o.name))===t.playerKey); const snap=snapshotFrom(mine,t.side,t.line); snap.mainLine=mainLineOf(mine,t.side);
        const last=t.snapshots[t.snapshots.length-1];
        // only add a new row when the value actually moved — a re-check that finds no
        // change just refreshes the "now" timestamp on the last row instead of duplicating it
        const changed = t.pinned && t.bookKey
          ? (!last || (last.byBook?.[t.bookKey]?.price??null)!==(snap.byBook[t.bookKey]?.price??null) || (last.byBook?.[t.bookKey]?.points??null)!==(snap.byBook[t.bookKey]?.points??null))
          : (!last || last.best!==snap.best || last.mainLine!==snap.mainLine);
        if(changed){ t.snapshots.push(snap); if(t.snapshots.length>60) t.snapshots.splice(1,t.snapshots.length-60); } else { last.byBook=snap.byBook; last.at=snap.at; }
        t.mainLineNow=snap.mainLine; });
    }
    // 4) open/close for each (pre-game: olv; started: clv)
    for(const g of Object.values(groups)){
      const rows=[];
      for(const bk of chunk(BOOK_REQ,5)){ try{ const r=await oo('/fixtures/odds/historical',{fixture_id:g.fixtureId,sportsbook:bk,market:g.marketNames}); (r?.data?.[0]?.odds||[]).forEach(o=>rows.push(o)); }catch(e){} }
      g.items.forEach(t=>{ let mine=rows.filter(o=>normName(cleanSel(o.selection||o.name))===t.playerKey && (t.side==='ML'||t.side==='Yes'||sideOf(o)===t.side) && (t.line==null||Number(o.clv?.points??o.olv?.points??o.points)===Number(t.line)));
        if(t.pinned && t.bookKey){ const pinnedRows=mine.filter(o=>canonBook(o.sportsbook)===t.bookKey); if(pinnedRows.length) mine=pinnedRows; }
        const pick=o=>{ const a=mine.filter(x=>x[o]&&x[o].price!=null).map(x=>Number(x[o].price)); return a.length?Math.max(...a):null; };
        t.open=pick('olv'); const st=res[t.fixtureId]?.fixture?.status; if(st&&st!=='unplayed') t.close=pick('clv'); });
    }
    // 5) live stats + grade
    open.forEach(t=>{
      const R=res[t.fixtureId]; if(!R) return;
      const st=R.fixture?.status; t.status=st; t.live=(st==='live'||st==='half');
      t.clock = st==='half' ? 'Half' : (R.in_play ? ((R.in_play.period?('Q'+R.in_play.period):'')+' '+(R.in_play.clock||'')).trim() : '');
      t.score = R.scores ? `${R.scores.away?.total??''}-${R.scores.home?.total??''}` : '';

let sportGameCounts = {};
async function loadSportGameCounts(){
  const now=Date.now();
  await Promise.all(Object.entries(SPORTS).map(async ([k,S])=>{
    try{
      const raw=[]; let page=1;
      for(let i=0;i<30;i++){ const r=await oo('/fixtures',{sport:S.sport,league:S.league,page}); (r?.data||[]).forEach(f=>raw.push(f)); if(!r?.has_more) break; page++; }
      const upper = S.ml ? Infinity : now+(S.days||1)*24*3600e3;
      let fx = raw.filter(f=>{ const t=new Date(f.start_date).getTime(); return t>=now-4*3600e3 && t<=upper && f.status!=='completed' && f.status!=='cancelled'; });
      if(S.ml){
        const cardOf=f=>(f.tournament?.name)||etDateKey(f.start_date);
        const order=[]; fx.forEach(f=>{ const c=cardOf(f); if(!order.includes(c)) order.push(c); });
        const keep=new Set(order.slice(0,2));
        fx=fx.filter(f=>keep.has(cardOf(f)));

  }));

    sportKey=b.dataset.k; LS.set('props_sport',sportKey); current=null; renderTabs();
    if(same){ renderSlate(); return; }
    mainRows=[]; players=[]; loadedAt=0; $('#view').innerHTML=loadingHtml(SPORTS[sportKey].label); $('#q').value=''; suggest('');
    loadSport(true).then(()=>{ if(!current) renderSlate(); }); })); }
$('#q').addEventListener('input',e=>suggest(e.target.value));
$('#q').addEventListener('focus',e=>suggest(e.target.value));
document.addEventListener('click',e=>{ if(!e.target.closest('.sw')) $('#sug').classList.remove('show'); });
$('#clr').addEventListener('click',()=>{ $('#q').value=''; suggest(''); renderSlate(); });
$('#q').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); const {name,mkey}=parseSearchQuery($('#q').value); const hit=players.filter(p=>nameMatches(p.name,name||$('#q').value))[0]; if(hit){ openPlayer(hit, startIdxFor(hit,mkey)); $('#sug').classList.remove('show'); $('#q').blur(); } } });
$('#reload').addEventListener('click',()=>loadSport(true));
$('#cfg').addEventListener('click',()=>{ const u=prompt('OpticOdds backend URL (your Vercel /api/odds):',getBackend()); if(u!=null){ LS.set('oo_backend_url',u.trim()||BACKEND_DEFAULT); toast('Backend saved'); } });
renderTabs();
loadBookLogos();
loadSportGameCounts();
loadSport(false).then(()=>{ if(!current) renderSlate(); if(!sawDeepLinks) console.log('[props] no deep_link fields returned — key may not have deep-link permission'); });
</script>
</body>
