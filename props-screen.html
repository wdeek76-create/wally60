<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Props">
<meta name="theme-color" content="#050507">
<title>Props — OpticOdds</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050507;--bg2:#0c0d10;--bg3:#12141a;--line:#1a1d22;--line2:#262a33;
  --text:#fff;--dim:#fff;--dim2:#fff;
  --purple:#a855f7;--green:#22c55e;--red:#ff5c5c;--cyan:#7dd3fc;--amber:#fbbf24;
  --ov:#4ade80;--un:#fb7185;
  --mono:'JetBrains Mono','Menlo',monospace;--sans:'Plus Jakarta Sans','Helvetica Neue',sans-serif;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;-webkit-text-size-adjust:100%;touch-action:manipulation;overscroll-behavior:none}
body{display:flex;flex-direction:column;min-height:100dvh}
input,button,select{font-family:inherit;font-size:16px}
button{cursor:pointer;border:none;background:none;color:inherit}
.mono{font-family:var(--mono)}
.dim{color:#fff}.pos{color:var(--green)}.neg{color:var(--red)}

/* header */
.hdr{position:sticky;top:0;z-index:20;background:rgba(5,5,7,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:calc(var(--sat) + 8px) 12px 8px}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:7px 13px;border-radius:999px;border:1px solid var(--line2);background:var(--bg2);color:#fff;font-weight:700;font-size:12px;letter-spacing:.3px}
.tab.on{border-color:var(--purple);color:#fff;background:rgba(168,85,247,.16)}
.status{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;font-family:var(--mono);font-size:10px;color:#fff;letter-spacing:.4px;text-transform:uppercase}
.status .r{display:flex;gap:6px;align-items:center}
.ib{width:30px;height:30px;border-radius:50%;border:1px solid var(--line2);background:var(--bg2);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px}
.ib.p{border-color:rgba(168,85,247,.5);color:var(--purple);background:rgba(168,85,247,.12)}

/* main */
main{flex:1;padding:12px 12px 110px}
.empty{padding:48px 16px;text-align:center;color:var(--dim);font-size:13px;line-height:1.6}
.err{margin:8px 0;padding:10px 12px;border-radius:10px;background:rgba(255,92,92,.1);border:1px solid rgba(255,92,92,.3);color:var(--red);font-size:12px}

/* player card */
.pcard{border:1px solid var(--line2);border-radius:16px;background:linear-gradient(135deg,#0c0d10 0%,#0a0d12 50%,#0c0d10 100%);padding:14px;margin-bottom:12px;position:relative;overflow:hidden}
.pcard::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 75% 60% at 15% 0%,rgba(168,85,247,.16) 0%,rgba(168,85,247,.05) 45%,transparent 75%);pointer-events:none}
.pcard>*{position:relative}
.ptop{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.hs{width:64px;height:64px;border-radius:50%;background:var(--bg3);border:2px solid var(--line2);object-fit:cover;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--dim);font-size:16px;overflow:hidden}
.hs img{width:100%;height:100%;object-fit:cover}
.pname{font-size:18px;font-weight:800;letter-spacing:-.2px;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.tl{width:18px;height:18px;object-fit:contain;vertical-align:middle}
.psub{font-size:11px;color:#fff;margin-top:3px;font-family:var(--mono)}
.psub b{color:var(--cyan);font-weight:700}
.pto{display:flex;align-items:center;gap:8px;margin-top:10px}
.pto label{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.4px;font-weight:700}
.pto input{width:92px;padding:6px 10px;background:var(--bg);border:1px solid var(--line2);border-radius:8px;color:#fff;font-family:var(--mono);font-size:16px}
.pto .hint{font-size:10px;color:var(--dim2)}

/* market card */
.mk{border:1px solid var(--line);border-radius:12px;background:rgba(0,0,0,.35);margin-bottom:8px;overflow:hidden}
.mkh{display:flex;flex-direction:column;align-items:center;gap:7px;padding:10px 12px;border-bottom:1px solid var(--line);text-align:center}
.mkh .t{font-weight:800;font-size:14px;letter-spacing:.2px;color:#fff}
.mkh .ln{font-family:var(--mono);font-weight:700;color:var(--cyan);margin-left:8px}
.mkh .acts{display:flex;gap:6px}
.sb{padding:5px 10px;border-radius:7px;border:1px solid var(--line2);background:var(--bg2);color:#fff;font-size:11px;font-weight:700}
.sb.on{border-color:var(--purple);color:#fff}
/* book board: a row per book — its own line, both sides, tap to open */
.bgrid{--bcols:minmax(0,1.1fr) 32px minmax(58px,.85fr) minmax(58px,.85fr) 13px}
.mk.single .bgrid{--bcols:minmax(0,1.3fr) 32px minmax(74px,1fr) 13px}
.bhead,.brow{display:grid;grid-template-columns:var(--bcols);gap:5px;align-items:center;padding:0 10px}
.bhead{padding-top:7px;padding-bottom:6px;font-size:8.5px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:#fff;opacity:.42;border-bottom:1px solid var(--line)}
.bhead .c{text-align:center}
.brow{padding-top:8px;padding-bottom:8px;border-bottom:1px solid var(--line);font-size:13px}
.brow:last-child{border-bottom:none}
.brow.open{background:rgba(168,85,247,.08)}
.bnm{display:flex;align-items:center;gap:7px;font-weight:700;min-width:0}
.bnm b{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bnm img{width:19px;height:19px;border-radius:5px;object-fit:cover;flex:0 0 auto}
.bnm .ex{font-size:8px;font-weight:800;letter-spacing:.4px;color:var(--cyan);opacity:.75;flex:0 0 auto}
.bln{font-family:var(--mono);font-weight:800;text-align:center;color:#fff;font-size:13px}
.bpr{font-family:var(--mono);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;gap:4px;padding:5px 3px;border-radius:8px;border:1px solid transparent;white-space:nowrap}
.bpr i{font-style:normal;font-size:9px;font-weight:800;opacity:.4;letter-spacing:.5px}
.bpr.o{color:var(--ov)}.bpr.u{color:var(--un)}
.bpr.na{color:#fff;opacity:.28}
.bpr.bad{opacity:.45;text-decoration:line-through}
.bpr.top{border-color:currentColor;background:rgba(255,255,255,.05)}
.bchev{color:#fff;opacity:.3;font-size:13px;text-align:center;transition:transform .15s}
.brow.open .bchev{transform:rotate(90deg);opacity:.75}
.bdet{padding:0 10px 9px;background:rgba(0,0,0,.4);border-bottom:1px solid var(--line);font-family:var(--mono);font-size:11px}
.bdl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 0 2px;color:#fff}
.bdl .s{font-weight:800}.bdl .s.o{color:var(--ov)}.bdl .s.u{color:var(--un)}
.bdl .liq{color:var(--green);font-weight:800}
.bdl .pct{opacity:.65}
.blad{display:flex;gap:10px;flex-wrap:wrap;font-size:10px;opacity:.72;padding:1px 0 2px 2px}
.bgo{margin-left:auto;padding:4px 10px;border-radius:7px;border:1px solid rgba(168,85,247,.55);background:rgba(168,85,247,.16);color:#fff;font-weight:800;font-size:10px;text-decoration:none;letter-spacing:.3px}
.bempty{padding:14px 10px;text-align:center;font-size:12px;color:#fff;opacity:.55}
.mkf{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;padding:9px 10px;border-top:1px solid var(--line);background:rgba(255,255,255,.02)}
.mkf .grp{display:flex;align-items:center;gap:5px}
.mkf .tag{font-family:var(--mono);font-size:10px;font-weight:800;letter-spacing:.3px}
.mkf .cp{font-size:10px;font-weight:800;padding:4px 9px;border-radius:7px;border:1px solid rgba(34,197,94,.35);background:rgba(34,197,94,.08);color:var(--green)}
.mkf .tag.o{color:var(--ov)}.mkf .tag.u{color:var(--un)}

/* market carousel */
.mnav{position:sticky;top:var(--hdrh,64px);z-index:15;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:8px 0 9px;margin:-8px 0 0;background:linear-gradient(180deg,var(--bg) 70%,rgba(5,5,7,0));-webkit-overflow-scrolling:touch}
.mnav::-webkit-scrollbar{display:none}
.mchip{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;border:1px solid var(--line2);background:var(--bg2);color:#fff;font-weight:800;font-size:11.5px;letter-spacing:.3px;white-space:nowrap}
.mchip.on{border-color:var(--purple);background:rgba(168,85,247,.18)}
.mchip .cl{font-family:var(--mono);font-weight:700;font-size:10px;color:var(--cyan)}
.mwrap{position:relative}
.mscroll{display:flex;align-items:flex-start;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior-x:contain;transition:height .18s ease}
.mscroll::-webkit-scrollbar{display:none}
.mslide{flex:0 0 100%;width:100%;min-width:100%;scroll-snap-align:center;scroll-snap-stop:always}
.mslide .mk{margin-bottom:0}
.marr{position:absolute;top:9px;width:28px;height:28px;border-radius:50%;border:1px solid var(--line2);background:rgba(12,13,16,.92);color:#fff;font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;z-index:6}
.marr.l{left:4px}.marr.r{right:4px}
.marr[disabled]{opacity:.22}
.mdots{display:flex;justify-content:center;align-items:center;gap:5px;margin:9px 0 2px}
.mdot{width:6px;height:6px;border-radius:999px;background:rgba(255,255,255,.22);transition:width .18s,background .18s}
.mdot.on{background:var(--purple);width:18px}
.mswipe{text-align:center;font-family:var(--mono);font-size:9.5px;letter-spacing:.5px;text-transform:uppercase;color:#fff;opacity:.45;margin-top:4px}

/* history */
.hist{border-top:1px solid var(--line);background:rgba(125,211,252,.04);padding:8px 12px}
.hist .lm{font-family:var(--mono);font-size:11px;color:#fff;font-weight:700;margin-bottom:6px}
.hist .lm span{color:#fff;font-weight:500;opacity:.8}
.hist .lm{text-align:center}
.hrow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:4px 0;border-bottom:1px dashed rgba(255,255,255,.05);font-size:11px}
.hrow:last-child{border-bottom:none}
.hrow .hb{color:#fff;font-weight:700;display:flex;align-items:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow .hv{font-family:var(--mono);color:#fff;white-space:nowrap}
.hrow .hv small{color:#fff;opacity:.75;font-size:9px}
.up{color:var(--green)}.dn{color:var(--red)}.fl{color:var(--dim2)}
.hcols{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.hcols .lbl{font-size:9px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:#fff;margin:4px 0 2px;text-align:center}
/* alt ladder */
.alts{border-top:1px solid var(--line);background:rgba(168,85,247,.04)}
.alt{display:flex;align-items:center;justify-content:space-between;padding:7px 12px;border-bottom:1px solid var(--line);font-size:12px}
.alt .l{font-family:var(--mono);font-weight:800;color:#fff;width:52px}
.alt .o,.alt .u{flex:1;font-family:var(--mono);font-size:11px}
.alt .o span,.alt .u span{color:#fff;font-size:10px;opacity:.85}
.alt .o,.alt .u{text-align:center}
.alt.main{background:rgba(125,211,252,.06)}
.alt.open{background:rgba(168,85,247,.10)}
.altbooks{padding:6px 12px 8px;border-bottom:1px solid var(--line)}

/* slate */
.slate{display:flex;flex-direction:column;gap:8px}
.gm{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;border:1px solid var(--line2);border-radius:14px;background:var(--bg2)}
.gm .tm{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;min-width:0}
.gm .tm img{width:22px;height:22px;object-fit:contain}
.gm .at{color:var(--dim2);font-size:11px;font-weight:700;margin:0 2px}
.gm .tt{font-family:var(--mono);font-size:10px;color:#fff;white-space:nowrap;text-align:right}
.gm .tt .live{color:var(--red);font-weight:800}
.gm .tt .n{display:block;color:#fff;opacity:.8}
.sh{display:flex;align-items:center;justify-content:space-between;margin:2px 0 8px}
.sh .t{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:#fff}
.back{padding:6px 10px;border-radius:8px;border:1px solid var(--line2);background:var(--bg2);color:#fff;font-size:12px;font-weight:700}
.pl{display:flex;align-items:center;justify-content:space-between;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg2);margin-bottom:6px;font-weight:700}
.pl .m{font-family:var(--mono);font-size:10px;color:#fff;font-weight:500}
.fight{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:12px;border:1px solid var(--line2);border-radius:14px;background:var(--bg2)}
.fight .f{font-weight:800;font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fight .f.r{text-align:right}
.fight .f small{display:block;font-family:var(--mono);font-size:11px;color:#fff;font-weight:700}
.fight .vs{font-size:10px;color:var(--dim2);font-weight:800}
.bl{width:16px;height:16px;border-radius:4px;object-fit:cover;flex:0 0 auto;margin-right:6px;vertical-align:middle}
.bk .n{display:flex;align-items:center}
a.p{color:#fff;text-decoration:none;border-color:rgba(168,85,247,.55)!important}
/* tracker */
.tk{border:1px solid var(--line2);border-radius:16px;background:linear-gradient(135deg,#0c0d10 0%,#0a0d12 50%,#0c0d10 100%);padding:12px;margin-bottom:10px;position:relative;overflow:hidden}
.tk.win{border-color:rgba(34,197,94,.5)}.tk.loss{border-color:rgba(255,92,92,.5)}.tk.push{border-color:rgba(251,191,36,.5)}
.tkh{display:flex;align-items:center;gap:10px}
.tkh .hs{width:40px;height:40px;font-size:12px}
.tkh .who{flex:1;min-width:0}
.tkh .nm{font-weight:800;font-size:14px;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tkh .bet{font-family:var(--mono);font-size:12px;color:#fff;margin-top:2px}
.tkh .bet span{color:#fff;opacity:.85}
.tkh .st{font-family:var(--mono);font-size:10px;color:var(--dim);text-align:right;white-space:nowrap}
.tkh .st .live{color:var(--red);font-weight:800}
.res{font-size:10px;font-weight:800;padding:3px 8px;border-radius:6px;letter-spacing:.4px}
.res.win{background:rgba(34,197,94,.16);color:var(--green)}.res.loss{background:rgba(255,92,92,.16);color:var(--red)}.res.push{background:rgba(251,191,36,.16);color:var(--amber)}
.prog{margin-top:10px}
.prog .nums{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;margin-bottom:4px}
.prog .nums b{font-size:16px;color:#fff}
.bar{height:8px;border-radius:999px;background:rgba(255,255,255,.07);overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--purple),var(--cyan));border-radius:999px;transition:width .3s}
.bar i.g{background:var(--green)}.bar i.r{background:var(--red)}
.bar em{position:absolute;top:-3px;bottom:-3px;width:2px;background:#fff;opacity:.7}
.mv{margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mvc{background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.mvc .l{font-size:9px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:#fff;opacity:.8}
.mvc .v{font-family:var(--mono);font-size:13px;font-weight:800;color:#fff;margin-top:2px}
.mvc .v small{font-size:10px;font-weight:700;margin-left:4px}
.tkbooks{margin-top:8px;display:flex;flex-wrap:wrap;gap:5px}
.tb{font-family:var(--mono);font-size:10px;padding:3px 7px;border-radius:7px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#fff;display:flex;align-items:center;gap:4px}
.tb img{width:12px;height:12px;border-radius:3px}
.tb .d{color:var(--green)}.tb .g{color:var(--green)}.tb .r{color:var(--red)}
.snaps{margin-top:8px;font-family:var(--mono);font-size:9.5px;color:var(--dim);line-height:1.6;word-break:break-word}
.snaps b{color:#fff;font-weight:700}
.tkf{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.rm{font-size:11px;color:var(--dim);padding:6px 10px;border:1px solid var(--line2);border-radius:8px}
.trk{font-size:10px;padding:3px 8px;border-radius:6px;border:1px solid rgba(168,85,247,.45);color:#fff;font-weight:700;margin-left:6px}
.trk.on{background:rgba(168,85,247,.25)}
/* footer search */
.ftr{position:fixed;left:0;right:0;bottom:0;z-index:30;background:linear-gradient(180deg,rgba(5,5,7,0) 0%,rgba(5,5,7,.96) 22%,#050507 100%);padding:16px 12px calc(var(--sab) + 12px)}
.sw{position:relative}
.sbox{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid rgba(168,85,247,.55);border-radius:16px;padding:6px 12px 6px 6px}
.sbox input{flex:1;background:transparent;border:none;outline:none;color:#fff;font-size:18px;min-width:0;height:44px}
.sbox .cl{width:44px;height:44px;border-radius:12px;background:var(--bg3);border:1px solid var(--line2);color:var(--dim);font-size:20px;flex:0 0 auto}
.sug{position:absolute;left:0;right:0;bottom:calc(100% + 8px);max-height:52vh;overflow-y:auto;background:var(--bg2);border:1px solid var(--line2);border-radius:14px;box-shadow:0 -8px 32px rgba(0,0,0,.6);display:none}
.sug.show{display:block}
.si{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.si:last-child{border-bottom:none}
.si .nm{font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.si .g{font-family:var(--mono);font-size:10px;color:#fff;white-space:nowrap}
.si .lg{font-size:9px;font-weight:800;padding:2px 6px;border-radius:5px;background:rgba(168,85,247,.16);color:var(--purple)}
.inj{display:inline-flex;align-items:center;gap:5px;padding:2px 7px;border-radius:6px;font-size:9px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;vertical-align:middle}
.inj.out{background:rgba(255,92,92,.16);color:var(--red);border:1px solid rgba(255,92,92,.4)}
.inj.q{background:rgba(251,191,36,.14);color:var(--amber);border:1px solid rgba(251,191,36,.4)}
.inj.p{background:rgba(125,211,252,.12);color:var(--cyan);border:1px solid rgba(125,211,252,.35)}
.injnote{margin-top:8px;padding:8px 10px;border-radius:9px;background:rgba(255,92,92,.06);border:1px solid rgba(255,92,92,.2);font-size:11px;color:#d4dae3;line-height:1.45}
.injnote b{font-weight:800}
.row2{display:flex;gap:6px;margin-top:8px}
.big{flex:1;padding:11px 12px;border-radius:12px;font-weight:800;font-size:12px;letter-spacing:.3px;border:1px solid var(--line2);background:var(--bg2);color:var(--text)}
.big.g{background:rgba(34,197,94,.14);border-color:rgba(34,197,94,.35);color:var(--green)}
.big.p{background:rgba(168,85,247,.16);border-color:rgba(168,85,247,.45);color:#fff}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sab) + 90px);background:#111;border:1px solid var(--line2);color:#fff;padding:9px 14px;border-radius:10px;font-size:12px;z-index:50;opacity:0;transition:opacity .15s;pointer-events:none;max-width:88vw;text-align:center}
.toast.on{opacity:1}
</style>
</head>
<body>

<div class="hdr">
  <div class="tabs" id="tabs"></div>
  <div class="status"><span id="stat">Pick a sport</span><span class="r"><button class="ib p" id="reload" title="Reload">⟳</button><button class="ib" id="cfg" title="Settings">⚙</button></span></div>
</div>

<main id="view"><div class="empty">Pick a sport above, then search a player.</div></main>

  <div class="sw">

    <div class="sbox">
      <button class="cl" id="clr">✕</button>

    </div>

</div>
<div class="toast" id="toast"></div>

<script>
// ───────────────────────── config ─────────────────────────
const LS = { get:(k,d)=>{ try{ const v=localStorage.getItem(k); return v==null?d:v; }catch(e){ return d; } }, set:(k,v)=>{ try{ localStorage.setItem(k,v); }catch(e){} } };
const BACKEND_DEFAULT = 'https://nfl-props-tracker-1.vercel.app/api/odds';
const getBackend = () => LS.get('oo_backend_url', BACKEND_DEFAULT);

// Your books, in display order. Courtside / Onyx fold into DraftKings. Kalshi is an exchange.
const BOOKS = ['Prop Builder','FanDuel','Novig','Prophet X','Kalshi','Pinnacle','bet105','DraftKings','Fliff'];
const BOOK_REQ = [...BOOKS,'Courtside','Onyx Odds'];
const EXCH = new Set(['novig','prophet x','kalshi']);
const SHORT = { 'prop builder':'PB','fanduel':'FD','novig':'Novig','prophet x':'PX','kalshi':'Kalshi','pinnacle':'Pin','bet105':'b105','draftkings':'DK','fliff':'Fliff' };
const canonBook = n => { const k=String(n||'').toLowerCase(); if(k==='courtside'||k==='onyx odds') return 'draftkings'; return k; };
const bookLabel = n => { const k=canonBook(n); return BOOKS.find(b=>b.toLowerCase()===k) || n; };
const bookShort = n => SHORT[canonBook(n)] || n;

// Market definitions per sport: key, label, keyword test on the OpticOdds market name (lowercased)
const PERIOD = /quarter|half|1st|2nd|3rd|4th|first|last|overtime|period|double|triple|basket|alternate|odd|even|milestone|race|to score|to record|to get|band|exact|margin|method|combo/;
const has = (m, ...w) => w.every(x=>m.includes(x));
// Order here is the order you swipe through them on a player: Points → Assists → Rebounds → PRA → 3PM.
const THREE = /three|3-point|3 point|3pt|3pm/;
const NBA_MKTS = [
  ['pts','Points',   m=>has(m,'point')&&!THREE.test(m)&&!has(m,'rebound')&&!has(m,'assist')&&!m.includes('+')],
  ['ast','Assists',  m=>has(m,'assist')&&!has(m,'point')&&!has(m,'rebound')],
  ['reb','Rebounds', m=>has(m,'rebound')&&!has(m,'point')&&!has(m,'assist')],
  ['pra','PRA',      m=>has(m,'point','rebound','assist')],
  ['3pm','3PM',      m=>THREE.test(m)],
  ['pr','P+R',       m=>has(m,'point','rebound')&&!has(m,'assist')],
  ['pa','P+A',       m=>has(m,'point','assist')&&!has(m,'rebound')],
  ['ra','R+A',       m=>has(m,'rebound','assist')&&!has(m,'point')],
];
const SPORTS = {
  nfl:  { label:'NFL',  sport:'football',   league:'nfl',  days:7, markets:[
          ['pass_yds','Pass Yds', m=>has(m,'passing yards')&&!m.includes('+')],
          ['pass_td','Pass TD',   m=>has(m,'passing touchdown')&&!m.includes('+')],
          ['pass_att','Pass Att', m=>has(m,'passing attempt')&&!m.includes('+')],
          ['pass_cmp','Comp',     m=>has(m,'completion')&&!m.includes('+')],
          ['rush_yds','Rush Yds', m=>has(m,'rushing yards')&&!m.includes('+')],
          ['rush_att','Rush Att', m=>has(m,'rushing attempt')&&!m.includes('+')],
          ['rec_yds','Rec Yds',   m=>has(m,'receiving yards')&&!m.includes('+')],
          ['rec','Receptions',    m=>has(m,'reception')&&!has(m,'longest')&&!m.includes('+')],
          ['atd','Anytime TD',    m=>has(m,'anytime')&&has(m,'touchdown')],
        ]},
  nba:  { label:'NBA',  sport:'basketball', league:'nba',  days:2, markets:NBA_MKTS },
  wnba: { label:'WNBA', sport:'basketball', league:'wnba', days:2, markets:NBA_MKTS },
  nhl:  { label:'NHL',  sport:'hockey',     league:'nhl',  days:2, markets:[
          ['sog','Shots',   m=>!m.includes('+')&&(has(m,'shots on goal')||has(m,'shots'))],
          ['pts','Points',  m=>!m.includes('+')&&has(m,'point')&&!has(m,'power')],
          ['g','Goals',     m=>!m.includes('+')&&has(m,'goal')&&!has(m,'shots')&&!has(m,'total goals')&&!has(m,'power')],
          ['a','Assists',   m=>!m.includes('+')&&has(m,'assist')],
          ['sv','Saves',    m=>!m.includes('+')&&has(m,'save')],
        ]},
  ufc:  { label:'UFC',  sport:'mma',        league:'ufc',  ml:true, markets:[['ml','Moneyline', m=>m==='moneyline'||m.startsWith('moneyline')]] },
};
const marketKeyFor = (sportKey, name) => {
  const m = String(name||'').toLowerCase();
  if (!SPORTS[sportKey].ml && PERIOD.test(m)) return null;
  const hit = SPORTS[sportKey].markets.find(([,,t]) => t(m));
  return hit ? hit[0] : null;
};
const marketLabel = (sportKey, key) => (SPORTS[sportKey].markets.find(m=>m[0]===key)||[])[1] || key;

// ───────────────────────── helpers ─────────────────────────
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtAm = v => { const n=Number(v); return isNaN(n)?String(v):(n>0?'+'+n:String(n)); };
const toDec = a => { a=Number(a); return a>0?1+a/100:1+100/Math.abs(a); };
const toAm = d => (d-1)>=1 ? Math.round((d-1)*100) : -Math.round(100/(d-1));
const winPct = a => { a=Number(a); const p=a>0?100/(a+100):Math.abs(a)/(Math.abs(a)+100); return (p*100).toFixed(1); };
const usd = n => n>=1000 ? '$'+(n/1000).toFixed(1).replace(/\.0$/,'')+'k' : '$'+Math.round(n);
const playable = (price, playTo) => playTo==null || parseInt(price) >= parseInt(playTo);
const cleanSel = n => String(n||'').replace(/\s*\([^)]*\)\s*$/,'').trim();
const isCombo = n => /\s[+&\/]\s|\s\+|&/.test(String(n||''));
const normName = n => String(n||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/['’.`]/g,'').replace(/[^a-z ]/g,' ').replace(/\s+/g,' ').trim();
const compact = n => normName(n).replace(/ /g,'');
const nameMatches = (name, q) => { const qn=normName(q); if(!qn) return false; const nw=normName(name).split(' '); if(qn.split(' ').every(qw=>nw.some(w=>w.startsWith(qw)))) return true; return compact(name).includes(compact(q)); };
const chunk = (a,n) => { const o=[]; for(let i=0;i<a.length;i+=n) o.push(a.slice(i,i+n)); return o; };
const etTime = iso => { try{ return new Date(iso).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:'America/New_York'}); }catch(e){ return ''; } };
const etDateKey = iso => { try{ return new Date(iso).toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'America/New_York'}); }catch(e){ return ''; } };
const etDay = iso => { try{ return new Date(iso).toLocaleDateString('en-US',{weekday:'short',timeZone:'America/New_York'}); }catch(e){ return ''; } };
let toastT; const toast = m => { const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),1800); };

async function oo(endpoint, params){
  const r = await fetch(getBackend(), { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ endpoint, params:params||{} }) });
  const text = await r.text();
  if(!r.ok){ let m=text; try{ const j=JSON.parse(text); m=j.error+(j.body?' — '+j.body:''); }catch(e){} throw new Error(`backend ${r.status}: ${m}`); }
  return JSON.parse(text);
}

// order-book depth behind the top level, down to play-to
function levelsOf(o){
  const top=Number(o.price);
  const ob=(Array.isArray(o.order_book)?o.order_book:[]).filter(l=>Array.isArray(l)&&l.length>=2);
  const normP=v=>{ v=Number(v); if(isNaN(v)) return NaN; return (v>1&&v<50)?toAm(v):v; };
  const out=[];
  if(ob.length){
    const a0=normP(ob[0][0]), b0=normP(ob[0][1]); const pf=Math.abs(a0-top)<=Math.abs(b0-top);
    if(!window._obLogged){ window._obLogged=true; console.log('[OpticOdds] order_book sample', o.sportsbook, top, JSON.stringify(o.order_book).slice(0,240), '→ priceFirst', pf); }
    ob.forEach(l=>{ const price=pf?normP(l[0]):normP(l[1]); const size=pf?Number(l[1]):Number(l[0]); if(!isNaN(price)&&!isNaN(size)&&size>0) out.push({price,size}); });
  } else if(o.limits?.max) out.push({price:top,size:Number(o.limits.max)});
  return out.sort((a,b)=>b.price-a.price);
}
// Actual exchange depth: every level, best first. Only books with more than the top level (a real ladder).
function depthLevels(rows){
  const out=[];
  rows.filter(o=>EXCH.has(canonBook(o.sportsbook))).forEach(o=>{
    const lv=levelsOf(o); if(lv.length<2) return;
    out.push({ book:bookLabel(o.sportsbook), levels:lv, total:lv.reduce((a,l)=>a+l.size,0) });
  });
  // size-weighted average price across the whole book
  out.forEach(b=>{ const wdec=b.levels.reduce((a,l)=>a+toDec(l.price)*l.size,0)/b.total; b.avg=toAm(wdec); b.best=b.levels[0].price; b.worst=b.levels[b.levels.length-1].price; });
  return out.length?out:null;
}
const depthText = d => d.map(b=>`${b.book} ${usd(b.total)} avg ${fmtAm(b.avg)} (${fmtAm(b.best)}→${fmtAm(b.worst)})`).join('\n');

// ───────────────────────── state ─────────────────────────
let sportKey = LS.get('props_sport','nba');
let viewMode = 'sport';
let fixtures = [];          // normalized fixtures for the sport
let mainRows = [];          // main-line odds rows (all fixtures)
let players = [];           // index: {key, name, pid, fixtureId, marketKeys:Set}
let loadedAt = 0;
let current = null;         // selected player index entry
const altCache = {};        // fixtureId|marketName -> rows
const playerInfo = {};      // pid -> {team, teamId, pos, headshot}
let injuries = { byPid:{}, byName:{}, at:0 };   // from /injuries
let bookLogos = {};                             // lowercase book name -> logo url (from /sportsbooks)
let sawDeepLinks = false;
const IS_IOS = /iPhone|iPad|iPod/.test(navigator.userAgent), IS_ANDROID = /Android/.test(navigator.userAgent);
async function loadBookLogos(){
  try{ const c=JSON.parse(LS.get('oo_book_logos','null')); if(c && Date.now()-c.at<86400e3){ bookLogos=c.map; return; } }catch(e){}
  try{ const r=await oo('/sportsbooks',{}); const map={}; (r?.data||[]).forEach(b=>{ if(b?.name&&b?.logo) map[String(b.name).toLowerCase()]=b.logo; }); bookLogos=map; LS.set('oo_book_logos',JSON.stringify({at:Date.now(),map})); }
  catch(e){ console.warn('[props] sportsbook logos failed',e.message); }
}
const bookLogo = n => bookLogos[String(n||'').toLowerCase()] || bookLogos[canonBook(n)] || '';
const deepLinkFor = o => { const d=o?.deep_link; if(!d||typeof d!=='object') return null; return (IS_IOS&&d.ios)||(IS_ANDROID&&d.android)||d.desktop||d.ios||d.android||null; };

// ───────────────────────── load ─────────────────────────
async function loadSport(force){
  const S=SPORTS[sportKey]; const stat=$('#stat');
  if(!force && loadedAt && Date.now()-loadedAt<180000 && mainRows.length){ stat.textContent=`${S.label} · ${players.length} players · cached`; return; }
  stat.textContent=`${S.label} · loading fixtures…`;
  try{
    const raw=[]; let page=1;
    for(let i=0;i<30;i++){ const r=await oo('/fixtures',{sport:S.sport,league:S.league,page}); (r?.data||[]).forEach(f=>raw.push(f)); if(!r?.has_more) break; page++; }
    const now=Date.now();
    // Team sports: next `days` days (NFL = the whole week). UFC: every upcoming fight, then the next 2 cards.
    const upper = S.ml ? Infinity : now+(S.days||1)*24*3600e3;
    fixtures = raw.filter(f=>{ const t=new Date(f.start_date).getTime(); return t>=now-4*3600e3 && t<=upper && f.status!=='completed' && f.status!=='cancelled'; })
      .map(f=>({ id:f.id, start:f.start_date, status:f.status, live:!!f.is_live, card:(f.tournament?.name)||etDateKey(f.start_date),
        home:{id:f.home_competitors?.[0]?.id, name:f.home_competitors?.[0]?.name||f.home_team_display||'', ab:f.home_competitors?.[0]?.abbreviation||'', logo:f.home_competitors?.[0]?.logo||''},
        away:{id:f.away_competitors?.[0]?.id, name:f.away_competitors?.[0]?.name||f.away_team_display||'', ab:f.away_competitors?.[0]?.abbreviation||'', logo:f.away_competitors?.[0]?.logo||''} }))
      .sort((a,b)=>new Date(a.start)-new Date(b.start));
    if(S.ml){
      const order=[]; fixtures.forEach(f=>{ if(!order.includes(f.card)) order.push(f.card); });
      const keep=new Set(order.slice(0,2));
      fixtures=fixtures.filter(f=>keep.has(f.card));
      console.log('[props] UFC cards kept:', [...keep]);
    }
    console.log(`[props] ${S.label} fixtures: ${raw.length} fetched, ${fixtures.length} in window`, fixtures.map(f=>`${f.away.ab||f.away.name}@${f.home.ab||f.home.name} ${f.status}`));
    if(!fixtures.length){ stat.textContent=`${S.label} · no games in the next 30h`; mainRows=[]; players=[]; loadedAt=Date.now(); return; }
    // injuries (best-effort; schema read defensively)
    stat.textContent=`${S.label} · loading injuries…`;
    injuries={ byPid:{}, byName:{}, at:Date.now() };
    if(!S.ml){ try{
      const raw=[]; let ip=1;
      for(let i=0;i<10;i++){ const r=await oo('/injuries',{sport:S.sport,league:S.league,page:ip}); const arr=Array.isArray(r?.data)?r.data:[]; arr.forEach(x=>raw.push(x)); if(!r?.has_more) break; ip++; }
      if(raw.length && !window._injLogged){ window._injLogged=true; console.log('[props] injuries sample:', JSON.stringify(raw[0]).slice(0,400)); }
      // rows may be per-team ({team, injuries:[...]}) or flat per-player
      const flat=[]; raw.forEach(x=>{ if(Array.isArray(x.injuries)) x.injuries.forEach(i=>flat.push({...i, _team:x.team||i.team})); else if(Array.isArray(x.players)) x.players.forEach(i=>flat.push({...i,_team:x.team})); else flat.push(x); });
      flat.forEach(i=>{
        const pl=i.player||i; const pid=pl.id||i.player_id||null; const nm=pl.name||i.player_name||i.name||'';
        const status=i.status||i.injury_status||i.designation||''; const note=i.description||i.injury||i.comment||i.note||i.details||'';
        const rec={ status:String(status), note:String(note), team:i._team?.name||i.team?.name||'', updated:i.updated_at||i.updated||i.date||null };
        if(pid) injuries.byPid[pid]=rec; if(nm) injuries.byName[normName(nm)]=rec;
      });
      console.log(`[props] injuries: ${flat.length} entries`);
    }catch(e){ console.warn('[props] injuries failed',e.message); } }
    // main lines, 5 fixtures × 5 books per call
    mainRows=[]; let done=0; const fxChunks=chunk(fixtures,5), bkChunks=chunk(BOOK_REQ,5); const total=fxChunks.length*bkChunks.length;
    for(const fx of fxChunks) for(const bk of bkChunks){
      stat.textContent=`${S.label} · loading lines ${++done}/${total}…`;
      try{ const r=await oo('/fixtures/odds',{fixture_id:fx.map(f=>f.id),sportsbook:bk,is_main:true}); (r?.data||[]).forEach(d=>(d.odds||[]).forEach(o=>{ o._fx=d.id; mainRows.push(o); })); }
      catch(e){ console.warn('[props] chunk failed',e.message); }
    }
    // index players from prop rows (player_id set) or fighters from moneyline selections (UFC)
    const idx={}; const multiPid={};
    mainRows.forEach(o=>{
      const mk=marketKeyFor(sportKey,o.market); if(!mk) return;
      const sel=cleanSel(o.selection||o.name); if(!sel) return;
      if(!S.ml && !o.player_id) return;
      if(isCombo(sel)) return;                       // two-player combos are not players
      const key=normName(sel); if(!key) return;
      if(!idx[key]) idx[key]={ key, name:sel, pid:o.player_id||null, pids:new Set(), fixtureId:o._fx, marketKeys:new Set() };
      if(o.player_id){ idx[key].pids.add(o.player_id); if(!idx[key].pid) idx[key].pid=o.player_id; }
      idx[key].marketKeys.add(mk);
    });
    players=Object.values(idx).sort((a,b)=>a.name.localeCompare(b.name));
    players.filter(p=>p.pids.size>1).slice(0,3).forEach(p=>console.log('[props] same name, multiple player_ids:', p.name, [...p.pids]));
    loadedAt=Date.now();
    console.log('[props] deep links present:', mainRows.some(o=>o.deep_link && (o.deep_link.ios||o.deep_link.desktop)));
    const seenMk=[...new Set(mainRows.map(o=>o.market))]; console.log('[props] markets seen:',seenMk); console.log('[props] books seen:',[...new Set(mainRows.map(o=>o.sportsbook))]);
    stat.textContent= S.ml ? `UFC · ${[...new Set(fixtures.map(f=>f.card))].join(' + ')} · ${players.length} fighters`
                           : `${S.label} · ${fixtures.length} games · ${[...new Set(fixtures.map(f=>etDateKey(f.start)))].length}d · ${players.length} players`;
    if(current){ const again=players.find(p=>p.key===current.key); if(again) openPlayer(again, curMktIdx); }
  }catch(e){
    console.error(e); stat.textContent=`${S.label} · load failed`;
    $('#view').innerHTML=`<div class="err">${esc(e.message)}<br><span class="dim">Check the backend URL via ⚙.</span></div>`;
  }
}

// ───────────────────────── search ─────────────────────────
function suggest(q){
  const box=$('#sug'); q=String(q||'').trim();
  if(!q||!players.length){ box.classList.remove('show'); box.innerHTML=''; return; }
  const hits=players.filter(p=>nameMatches(p.name,q)).slice(0,12);
  if(!hits.length){ box.innerHTML=`<div class="si"><span class="nm dim">No ${SPORTS[sportKey].ml?'fighter':'player'} matches "${esc(q)}"</span></div>`; box.classList.add('show'); return; }
  box.innerHTML=hits.map((p,i)=>{ const f=fixtures.find(x=>x.id===p.fixtureId); return `<div class="si" data-i="${i}"><span class="nm">${esc(p.name)} ${injPill(p)}</span><span class="g">${f?(SPORTS[sportKey].ml?`${esc(f.card)} · ${etDay(f.start)}`:`${esc(f.away.ab)}@${esc(f.home.ab)} ${etDay(f.start)} ${etTime(f.start)}`):''}</span></div>`; }).join('');
  box.querySelectorAll('.si[data-i]').forEach(el=>el.addEventListener('click',()=>{ openPlayer(hits[+el.dataset.i]); box.classList.remove('show'); $('#q').blur(); }));
  box.classList.add('show');
}

function injuryFor(p){ return (p.pid && injuries.byPid[p.pid]) || injuries.byName[normName(p.name)] || null; }
function injClass(st){ const s=String(st||'').toLowerCase(); if(/out|ir|suspend|inactive/.test(s)) return 'out'; if(/quest|doubt|gtd|game.?time|day.?to.?day|dtd/.test(s)) return 'q'; return 'p'; }
function injShort(st){ const s=String(st||'').toLowerCase(); if(/^out\b|out\b/.test(s)) return 'OUT'; if(/injured reserve|\bir\b/.test(s)) return 'IR'; if(/doubt/.test(s)) return 'D'; if(/quest/.test(s)) return 'Q'; if(/game.?time|gtd/.test(s)) return 'GTD'; if(/day.?to.?day|dtd/.test(s)) return 'DTD'; if(/prob/.test(s)) return 'P'; if(/suspend/.test(s)) return 'SUSP'; return String(st||'').slice(0,6).toUpperCase()||'INJ'; }
function injPill(p){ const i=injuryFor(p); return i?`<span class="inj ${injClass(i.status)}" title="${esc(i.note||'')}">${esc(injShort(i.status))}</span>`:''; }
// ───────────────────────── player view ─────────────────────────
async function fetchPlayerInfo(p){
  if(!p.pid) return null;
  if(playerInfo[p.pid]) return playerInfo[p.pid];
  try{ const r=await oo('/players',{id:[p.pid]}); const d=r?.data?.[0]; if(d){ playerInfo[p.pid]={ teamId:d.team?.id, team:d.team?.name||'', pos:d.position||'', headshot:d.logo||'' }; } }
  catch(e){ console.warn('[props] player info failed',e.message); }
  return playerInfo[p.pid]||null;
}
function rowsFor(p, mkey, rows){
  return rows.filter(o=>o._fx===p.fixtureId && marketKeyFor(sportKey,o.market)===mkey && normName(cleanSel(o.selection||o.name))===p.key);
}
function sideOf(o){ const s=String(o.selection_line||'').toLowerCase(); return s==='over'||s==='under' ? s : 'single'; }
function bestFirst(rows){
  // dedupe by canon book (DK clones), keep best price per book
  const by={}; rows.forEach(o=>{ const k=canonBook(o.sportsbook); if(!by[k]||Number(o.price)>Number(by[k].price)) by[k]=o; });
  return Object.values(by).sort((a,b)=>Number(b.price)-Number(a.price));
}
// One row per book: the line THAT book is posting, plus its best price a side.
function bookBoard(rows){
  const by={};
  rows.forEach(o=>{ const k=canonBook(o.sportsbook); const b=by[k]||(by[k]={key:k,name:bookLabel(o.sportsbook),ex:EXCH.has(k),cnt:{},all:[]}); b.cnt[o.points??'']=(b.cnt[o.points??'']||0)+1; b.all.push(o); });
  return Object.values(by).map(b=>{
    const lk=Object.keys(b.cnt).sort((x,y)=>b.cnt[y]-b.cnt[x])[0];
    b.line = (lk===''||lk==null) ? null : Number(lk);
    const at=b.all.filter(o=>String(o.points??'')===String(lk));
    ['over','under','single'].forEach(sd=>{ b[sd]=at.filter(o=>sideOf(o)===sd).sort((x,y)=>Number(y.price)-Number(x.price))[0]||null; });
    return b;
  }).sort((a,b)=>(a.line??0)-(b.line??0) || Number(b.over?.price??b.single?.price??-9999)-Number(a.over?.price??a.single?.price??-9999));
}
const topPrice = (list, sd, line) => { const v=list.filter(b=>line==null||b.line===line).map(b=>b[sd]?Number(b[sd].price):null).filter(x=>x!=null); return new Set(v).size>1?Math.max(...v):null; };
function priceCell(o, cls, letter, isTop, pt){
  if(!o) return `<span class="bpr na">—</span>`;
  return `<span class="bpr ${cls}${isTop?' top':''}${playable(o.price,pt)?'':' bad'}"><i>${letter}</i>${fmtAm(o.price)}</span>`;
}

let curMktIdx = 0;
let mktRO = null, mktRAF = 0;
function syncHdrH(){ const hd=document.querySelector('.hdr'); if(hd) document.documentElement.style.setProperty('--hdrh', hd.offsetHeight+'px'); }
window.addEventListener('resize',syncHdrH,{passive:true});
function initMarketScroll(mkeys, startIdx){
  syncHdrH();
  if(mktRO){ mktRO.disconnect(); mktRO=null; }
  curMktIdx = startIdx||0;
  const sc=$('#mscroll'); if(!sc) return;
  const nav=$('#mnav');
  const slides=[...sc.querySelectorAll('.mslide')];
  const chips=nav?[...nav.querySelectorAll('.mchip')]:[];
  const dots=[...document.querySelectorAll('.mdot')];
  const prev=$('#mprev'), next=$('#mnext');
  if(!slides.length) return;
  const clamp=i=>Math.max(0,Math.min(slides.length-1,i));
  const syncH=()=>{ const s=slides[curMktIdx]; if(!s) return; if(typeof ResizeObserver==='undefined'){ sc.style.height='auto'; return; } const hgt=s.offsetHeight; if(hgt) sc.style.height=hgt+'px'; };
  const paint=()=>{
    chips.forEach((c,j)=>c.classList.toggle('on',j===curMktIdx));
    dots.forEach((d,j)=>d.classList.toggle('on',j===curMktIdx));
    if(prev) prev.disabled=curMktIdx===0;
    if(next) next.disabled=curMktIdx===slides.length-1;
    const chip=chips[curMktIdx];
    if(chip&&nav) nav.scrollTo({left:Math.max(0,chip.offsetLeft-(nav.clientWidth-chip.offsetWidth)/2),behavior:'smooth'});
    syncH();
  };
  const go=(i,smooth)=>{ curMktIdx=clamp(i); sc.scrollTo({left:curMktIdx*sc.clientWidth,behavior:smooth?'smooth':'auto'}); paint(); };
  window.gotoMarket=go;
  let st;
  sc.addEventListener('scroll',()=>{ clearTimeout(st); st=setTimeout(()=>{ const i=clamp(Math.round(sc.scrollLeft/(sc.clientWidth||1))); if(i!==curMktIdx){ curMktIdx=i; paint(); } else syncH(); },90); },{passive:true});
  chips.forEach((c,i)=>c.addEventListener('click',()=>go(i,true)));
  dots.forEach((d,i)=>d.addEventListener('click',()=>go(i,true)));
  prev?.addEventListener('click',()=>go(curMktIdx-1,true));
  next?.addEventListener('click',()=>go(curMktIdx+1,true));
  if(typeof ResizeObserver!=='undefined'){
    mktRO=new ResizeObserver(()=>{ cancelAnimationFrame(mktRAF); mktRAF=requestAnimationFrame(syncH); });
    slides.forEach(s=>mktRO.observe(s));
  }
  window.addEventListener('resize',()=>go(curMktIdx,false),{passive:true});
  go(curMktIdx,false);
  requestAnimationFrame(syncH);
}

function snapshotFrom(rows, side, line){
  const at=Date.now(); const byBook={};
  rows.forEach(o=>{ if(side==='over'||side==='under'){ if(sideOf(o)!==side) return; if(line!=null && Number(o.points)!==Number(line)) return; } const k=canonBook(o.sportsbook); if(!byBook[k]||Number(o.price)>Number(byBook[k].price)) byBook[k]={price:Number(o.price),points:o.points??null,liq:o.limits?.max??null}; });
  const prices=Object.values(byBook).map(b=>b.price); const best=prices.length?Math.max(...prices):null;
  return { at, byBook, best };
}
function mainLineOf(rows, side){ const c={}; rows.forEach(o=>{ if(o.points==null) return; if((side==='over'||side==='under') && sideOf(o)!==side) return; c[o.points]=(c[o.points]||0)+1; }); const k=Object.keys(c).sort((a,b)=>c[b]-c[a])[0]; return k==null?null:Number(k); }
function trackProp(p, mkey, label, line, srcRows){
  const S=SPORTS[sportKey]; const side=sideKey(label); if(isTracked(p,mkey,label,line)){ toast('Already tracked'); return; }
  const f=fixtures.find(x=>x.id===p.fixtureId); const info=p.pid?playerInfo[p.pid]:null;
  const rowsAll=rowsFor(p,mkey,srcRows||mainRows);
  const snap=snapshotFrom(rowsAll, side, line);
  const bestBook=Object.entries(snap.byBook).sort((a,b)=>b[1].price-a[1].price)[0];
  const teamAb = info?.teamId ? (f?.home.id===info.teamId?f.home.ab:f?.away.id===info.teamId?f.away.ab:'') : '';
  tracked.unshift({ id:Date.now()+Math.random().toString(36).slice(2,6), sportKey, fixtureId:p.fixtureId, start:f?.start||null, away:f?.away.ab||f?.away.name||'', home:f?.home.ab||f?.home.name||'', card:f?.card||null,
    playerKey:p.key, playerName:p.name, pid:p.pid||null, headshot:info?.headshot||'', teamAb, teamLogo: info?.teamId ? (f?.home.id===info.teamId?f.home.logo:f?.away.logo) : '',
    mkey, marketLabel:marketLabel(sportKey,mkey), marketNames:[...new Set(rowsAll.map(o=>o.market))], side, line:line??null,
    price:bestBook?bestBook[1].price:snap.best, book:bestBook?bookLabel(bestBook[0]):null, trackedAt:Date.now(),
    mainLineAtTrack: mainLineOf(rowsFor(p,mkey,mainRows), side),
    snapshots:[snap], live:null, actual:null, result:null, open:null, close:null });
  saveTracked(); toast(`Tracking ${p.name} ${side==='over'?'o':side==='under'?'u':''}${line??''} ${marketLabel(sportKey,mkey)}`);
}
// stat resolution from /fixtures/player-results
const STAT_CANDS = {
  pts:['points','pts'], reb:['rebounds','total_rebounds','reb'], ast:['assists','ast'], '3pm':['three_point_field_goals_made','three_pointers_made','three_points_made','threes_made','3pm','three_pointers'],
  pass_yds:['passing_yards'], pass_td:['passing_touchdowns'], pass_att:['passing_attempts'], pass_cmp:['passing_completions','completions'], rush_yds:['rushing_yards'], rush_att:['rushing_attempts'], rec_yds:['receiving_yards'], rec:['receptions'],
  sog:['shots_on_goal','shots'], g:['goals'], a:['assists'], sv:['saves'],
};
function statFor(r, mkey, sportKey, marketNames){
  const periods=Array.isArray(r.stats)?r.stats:[]; const all=(periods.find(x=>x.period==='all')||periods[0]||{}).stats||{};
  const ms=r.market_stats||{};
  if(!window._prLogged && Object.keys(all).length){ window._prLogged=true; console.log('[props] player-results stat keys ('+(r.player?.name||'')+'):',Object.keys(all),'| market_stats:',Object.keys(ms)); }
  // 1) market_stats keyed by the market name
  for(const mn of (marketNames||[])){ if(ms[mn]!=null) return Number(ms[mn]); const k=Object.keys(ms).find(x=>x.toLowerCase()===String(mn).toLowerCase()); if(k) return Number(ms[k]); }
  const get=k=>{ for(const c of (STAT_CANDS[k]||[])) if(all[c]!=null) return Number(all[c]); const flat=k.replace(/_/g,''); const kk=Object.keys(all).find(x=>x.toLowerCase().replace(/_/g,'')===flat); return kk?Number(all[kk]):null; };
  const sum=(...ks)=>{ const v=ks.map(get); return v.some(x=>x==null)?null:v.reduce((a,b)=>a+b,0); };
  if(sportKey==='nfl'){ if(mkey==='atd'){ const t=sum('rushing_touchdowns','receiving_touchdowns'); return t; } return get(mkey); }
  if(sportKey==='nhl'){ if(mkey==='pts') return get('points'); return get(mkey); }
  if(mkey==='pra') return sum('pts','reb','ast'); if(mkey==='pr') return sum('pts','reb'); if(mkey==='pa') return sum('pts','ast'); if(mkey==='ra') return sum('reb','ast');
  return get(mkey);
}
function gradeTracked(t){
  if(t.actual==null || !t.final) return null;
  if(t.side==='over') return t.actual>t.line?'win':t.actual===t.line?'push':'loss';
  if(t.side==='under') return t.actual<t.line?'win':t.actual===t.line?'push':'loss';
  return t.result||null;
}
let trackerBusy=false;
async function refreshTracker(){
  if(trackerBusy||!tracked.length) return; trackerBusy=true;
  const stat=$('#stat'); stat.textContent='Tracker · refreshing…';
  try{
    const open=tracked.filter(t=>!t.final);
    const fids=[...new Set(open.map(t=>t.fixtureId))];
    // 1) fixture results (status, clock, scores)
    const res={};
    for(const ids of chunk(fids,5)){ try{ const r=await oo('/fixtures/results',{fixture_id:ids}); (r?.data||[]).forEach(x=>{ if(x?.fixture?.id) res[x.fixture.id]=x; }); }catch(e){ console.warn('[tracker] results',e.message); } }
    // 2) player results for live/completed
    const liveOrDone=fids.filter(id=>{ const st=res[id]?.fixture?.status; return st&&st!=='unplayed'; });
    const pr={};
    for(const ids of chunk(liveOrDone,5)){ try{ const r=await oo('/fixtures/player-results',{fixture_id:ids}); (r?.data||[]).forEach(x=>{ if(x?.fixture?.id) pr[x.fixture.id]=x; }); }catch(e){ console.warn('[tracker] player-results',e.message); } }
    // 3) current odds per fixture+market (all lines) for movement + per-book board
    const groups={}; open.forEach(t=>{ const k=t.fixtureId+'|'+t.marketNames.join(','); (groups[k]=groups[k]||{fixtureId:t.fixtureId,marketNames:t.marketNames,items:[]}).items.push(t); });
    for(const g of Object.values(groups)){
      const st=res[g.fixtureId]?.fixture?.status;
      if(st&&st!=='unplayed') continue; // odds are gone once it starts
      const rows=[];
      for(const bk of chunk(BOOK_REQ,5)){ try{ const r=await oo('/fixtures/odds',{fixture_id:[g.fixtureId],sportsbook:bk,market:g.marketNames}); (r?.data?.[0]?.odds||[]).forEach(o=>rows.push(o)); }catch(e){} }
      g.items.forEach(t=>{ const mine=rows.filter(o=>normName(cleanSel(o.selection||o.name))===t.playerKey); const snap=snapshotFrom(mine,t.side,t.line); snap.mainLine=mainLineOf(mine,t.side);
        const last=t.snapshots[t.snapshots.length-1]; if(!last||last.best!==snap.best||last.mainLine!==snap.mainLine||Date.now()-last.at>15*60e3){ t.snapshots.push(snap); if(t.snapshots.length>60) t.snapshots.splice(1,t.snapshots.length-60); } else { last.byBook=snap.byBook; last.at=snap.at; }
        t.mainLineNow=snap.mainLine; });
    }
    // 4) open/close for each (pre-game: olv; started: clv)
    for(const g of Object.values(groups)){
      const rows=[];
      for(const bk of chunk(BOOK_REQ,5)){ try{ const r=await oo('/fixtures/odds/historical',{fixture_id:g.fixtureId,sportsbook:bk,market:g.marketNames}); (r?.data?.[0]?.odds||[]).forEach(o=>rows.push(o)); }catch(e){} }
      g.items.forEach(t=>{ const mine=rows.filter(o=>normName(cleanSel(o.selection||o.name))===t.playerKey && (t.side==='ML'||t.side==='Yes'||sideOf(o)===t.side) && (t.line==null||Number(o.clv?.points??o.olv?.points??o.points)===Number(t.line)));
        const pick=o=>{ const a=mine.filter(x=>x[o]&&x[o].price!=null).map(x=>Number(x[o].price)); return a.length?Math.max(...a):null; };
        t.open=pick('olv'); const st=res[t.fixtureId]?.fixture?.status; if(st&&st!=='unplayed') t.close=pick('clv'); });
    }
    // 5) live stats + grade
    open.forEach(t=>{
      const R=res[t.fixtureId]; if(!R) return;
      const st=R.fixture?.status; t.status=st; t.live=(st==='live'||st==='half');
      t.clock = st==='half' ? 'Half' : (R.in_play ? ((R.in_play.period?('Q'+R.in_play.period):'')+' '+(R.in_play.clock||'')).trim() : '');
      t.score = R.scores ? `${R.scores.away?.total??''}-${R.scores.home?.total??''}` : '';
      const P=pr[t.fixtureId]; if(P){ const r=(P.results||[]).find(x=>normName(cleanSel(x.player?.name))===t.playerKey); if(r){ const v=statFor(r,t.mkey,t.sportKey,t.marketNames); if(v!=null&&!isNaN(v)) t.actual=v; } }
      if(st==='completed'){ t.final=true; if(t.side==='ML'&&R.scores){ const aw=Number(R.scores.away?.total), hm=Number(R.scores.home?.total); const iAmHome=normName(R.fixture?.home_competitors?.[0]?.name||'')===t.playerKey; if(!isNaN(aw)&&!isNaN(hm)) t.result=(iAmHome?hm>aw:aw>hm)?'win':(aw===hm?'push':'loss'); } }
      t.result = t.side==='ML' ? t.result : gradeTracked(t);
    });
    saveTracked();
  }catch(e){ console.error(e); }
  trackerBusy=false; renderTracker(); 
}
const cents = v => { v=Number(v); return isNaN(v)?null:(v>0?v-100:v+100); };
function withYou(t, kind, from, to){
  if(from==null||to==null||Number(from)===Number(to)) return {cls:'fl',txt:'flat'};
  if(kind==='line'){ const up=Number(to)>Number(from); const w = t.side==='over'?up:!up; return {cls:w?'up':'dn', txt:w?'with you':'against you'}; }
  // price at your line: shorter now (lower American) = market moved to your side
  const w=Number(to)<Number(from); return {cls:w?'up':'dn', txt:w?'with you':'against you'};
}
function renderTracker(){
  const view=$('#view'); $('.ftr').style.display='none';
  if(!tracked.length){ view.innerHTML='<div class="empty">Nothing tracked yet.<br>Open a player and tap <b>Track</b> on a side.</div>'; $('#stat').textContent='Tracker · empty'; return; }
  const sorted=[...tracked].sort((a,b)=>(a.final?1:0)-(b.final?1:0) || new Date(a.start||0)-new Date(b.start||0));
  view.innerHTML=sorted.map(t=>{
    const S=SPORTS[t.sportKey]||{label:t.sportKey}; const first=t.snapshots[0], last=t.snapshots[t.snapshots.length-1];
    const res=t.result?`<span class="res ${t.result}">${t.result.toUpperCase()}</span>`:'';
    const st = t.final ? 'FINAL' : t.live ? `<span class="live">LIVE</span> ${esc(t.clock||'')}` : (t.start?`${etDay(t.start)} ${etTime(t.start)}`:'');
    const initials=t.playerName.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
    const hs=t.headshot?`<div class="hs"><img src="${esc(t.headshot)}" alt="" onerror="this.parentNode.textContent='${initials}'"></div>`:`<div class="hs">${initials}</div>`;
    const betStr = t.side==='ML' ? `ML ${fmtAm(t.price)}` : `${t.side==='over'?'o':t.side==='under'?'u':''}${t.line??''} ${esc(t.marketLabel)} <span>${fmtAm(t.price)} ${esc(t.book||'')}</span>`;
    // progress
    let prog='';
    if(t.side==='over'||t.side==='under'){
      const a=t.actual, L=Number(t.line); const pct=a==null?0:Math.min(100,Math.round(a/(L*1.25)*100)); const mark=Math.round(100/1.25);
      const cls = t.final ? (t.result==='win'?'g':t.result==='loss'?'r':'') : (a!=null && ((t.side==='over'&&a>L)||(t.side==='under'&&a>L)) ? (t.side==='over'?'g':'r') : '');
      prog=`<div class="prog"><div class="nums"><span><b>${a==null?'—':a}</b> <span class="dim">/ ${L} ${esc(t.marketLabel)}</span></span><span class="dim">${t.score?esc(t.score):''}</span></div><div class="bar"><i class="${cls}" style="width:${pct}%"></i><em style="left:${mark}%"></em></div></div>`;
    }
    // movement
    const lm=withYou(t,'line',t.mainLineAtTrack,t.mainLineNow??t.mainLineAtTrack);
    const pm=withYou(t,'price',t.price,last?.best);
    const mv = t.side==='ML' ? `<div class="mv"><div class="mvc"><div class="l">Price</div><div class="v">${fmtAm(t.price)} → ${last?.best!=null?fmtAm(last.best):'—'}<small class="${pm.cls}">${pm.txt}</small></div></div><div class="mvc"><div class="l">Open / ${t.close!=null?'Close':'Now'}</div><div class="v">${t.open!=null?fmtAm(t.open):'—'} / ${t.close!=null?fmtAm(t.close):(last?.best!=null?fmtAm(last.best):'—')}</div></div></div>`
      : `<div class="mv"><div class="mvc"><div class="l">Line</div><div class="v">${t.mainLineAtTrack??'—'} → ${t.mainLineNow??t.mainLineAtTrack??'—'}<small class="${lm.cls}">${lm.txt}</small></div></div><div class="mvc"><div class="l">Best @ ${t.line}</div><div class="v">${fmtAm(t.price)} → ${last?.best!=null?fmtAm(last.best):'—'}<small class="${pm.cls}">${pm.txt}</small></div></div>${t.open!=null||t.close!=null?`<div class="mvc"><div class="l">Open</div><div class="v">${t.open!=null?fmtAm(t.open):'—'}</div></div><div class="mvc"><div class="l">${t.close!=null?'Close':'Now vs open'}</div><div class="v">${t.close!=null?fmtAm(t.close):(last?.best!=null?fmtAm(last.best):'—')}${t.close!=null&&cents(t.price)!=null&&cents(t.close)!=null?`<small class="${cents(t.price)-cents(t.close)>0?'up':cents(t.price)-cents(t.close)<0?'dn':'fl'}">${(cents(t.price)-cents(t.close)>0?'+':'')+(cents(t.price)-cents(t.close))}¢ CLV</small>`:''}</div></div>`:''}</div>`;
    // books now at your line
    const books = last ? Object.entries(last.byBook).sort((a,b)=>b[1].price-a[1].price).map(([k,b])=>{ const was=first?.byBook?.[k]?.price; const d=was!=null?Number(b.price)-Number(was):0; const lg=bookLogo(k); return `<span class="tb">${lg?`<img src="${esc(lg)}" alt="">`:''}${esc(bookShort(k))} ${fmtAm(b.price)}${EXCH.has(k)?`<span class="d">(${winPct(b.price)}%)</span>`:''}${d?`<span class="${d<0?'g':'r'}">${d<0?'▼':'▲'}</span>`:''}</span>`; }).join('') : '';
    const snaps = t.snapshots.length>1 ? `<div class="snaps"><b>Board:</b> ${t.snapshots.slice(-8).map(sn=>`${new Date(sn.at).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})} ${sn.best!=null?fmtAm(sn.best):'—'}${sn.mainLine!=null&&sn.mainLine!==t.line?' @'+sn.mainLine:''}`).join(' · ')}</div>` : '';
    return `<div class="tk ${t.result||''}">
      <div class="tkh">${hs}<div class="who"><div class="nm">${t.teamLogo?`<img class="tl" src="${esc(t.teamLogo)}" alt="">`:''}${esc(t.playerName)} ${res}</div><div class="bet">${betStr}</div></div><div class="st">${st}<br><span class="dim">${esc(S.label)} · ${esc(t.away)}@${esc(t.home)}</span></div></div>
      ${prog}${mv}<div class="tkbooks">${books}</div>${snaps}
      <div class="tkf"><span class="dim" style="font-size:10px;font-family:var(--mono)">tracked ${new Date(t.trackedAt).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}</span><button class="rm" data-rm="${t.id}">Remove</button></div>
    </div>`;
  }).join('');
  view.querySelectorAll('[data-rm]').forEach(b=>b.addEventListener('click',()=>{ tracked=tracked.filter(t=>t.id!==b.dataset.rm); saveTracked(); renderTracker(); }));
  const live=tracked.filter(t=>t.live).length, open=tracked.filter(t=>!t.final).length;

}
let trackerTimer=null;
function openTracker(){ viewMode='tracker'; renderTabs(); renderTracker(); refreshTracker(); clearInterval(trackerTimer); trackerTimer=setInterval(()=>{ if(viewMode==='tracker' && tracked.some(t=>!t.final)) refreshTracker(); },60000); }
// ───────────────────────── slate ─────────────────────────
function bestML(rows){ const b=bestFirst(rows)[0]; return b?fmtAm(b.price):'—'; }
function renderSlate(){
  current=null; const S=SPORTS[sportKey]; const view=$('#view');
  if(!fixtures.length){ view.innerHTML=`<div class="empty">No ${S.label} games in the window.</div>`; return; }
  if(S.ml){
    let h=''; let lastCard=null;
    fixtures.forEach(f=>{
      if(f.card!==lastCard){ lastCard=f.card; h+=`<div class="sh"><span class="t">${esc(f.card)} · ${etDay(f.start)}</span></div>`; }
      const a=players.find(p=>p.key===normName(f.away.name)), b=players.find(p=>p.key===normName(f.home.name));
      const mlA=a?bestML(rowsFor(a,'ml',mainRows)):'—', mlB=b?bestML(rowsFor(b,'ml',mainRows)):'—';
      h+=`<div class="fight"><div class="f" data-fk="${a?esc(a.key):''}">${esc(f.away.name)}<small>${mlA}</small></div><span class="vs">VS</span><div class="f r" data-fk="${b?esc(b.key):''}">${esc(f.home.name)}<small>${mlB}</small></div></div>`;
    });
    view.innerHTML=`<div class="slate">${h}</div>`;
    view.querySelectorAll('.f[data-fk]').forEach(el=>el.addEventListener('click',()=>{ const p=players.find(x=>x.key===el.dataset.fk); if(p) openPlayer(p); }));
    return;
  }
  let lastDay=null;
  const h=fixtures.map(f=>{
    const dk=etDateKey(f.start); let hd='';
    if(dk!==lastDay){ lastDay=dk; hd=`<div class="sh" style="margin-top:6px"><span class="t">${etDay(f.start)} · ${esc(dk)}</span></div>`; }
    const n=players.filter(p=>p.fixtureId===f.id).length;
    const st = f.live ? `<span class="live">LIVE</span>` : f.status==='completed' ? 'FINAL' : `${etDay(f.start)} ${etTime(f.start)}`;
    return hd+`<div class="gm" data-fid="${esc(f.id)}"><div class="tm">${f.away.logo?`<img src="${esc(f.away.logo)}" alt="">`:''}${esc(f.away.ab||f.away.name)}<span class="at">@</span>${f.home.logo?`<img src="${esc(f.home.logo)}" alt="">`:''}${esc(f.home.ab||f.home.name)}</div><div class="tt">${st}<span class="n">${n} players</span></div></div>`;
  }).join('');
  view.innerHTML=`<div class="slate">${h}</div>`;
  view.querySelectorAll('.gm').forEach(el=>el.addEventListener('click',()=>renderGame(el.dataset.fid)));
}
function renderGame(fid){
  const f=fixtures.find(x=>x.id===fid); if(!f) return renderSlate();
  const list=players.filter(p=>p.fixtureId===fid).sort((a,b)=>a.name.localeCompare(b.name));
  const S=SPORTS[sportKey];
  const h=list.map(p=>`<div class="pl" data-k="${esc(p.key)}"><span>${esc(p.name)} ${injPill(p)}</span><span class="m">${[...p.marketKeys].map(k=>marketLabel(sportKey,k)).slice(0,4).join(' · ')}${p.marketKeys.size>4?' +'+(p.marketKeys.size-4):''}</span></div>`).join('');
  $('#view').innerHTML=`<div class="sh"><span class="t">${f.away.logo?`<img class="tl" src="${esc(f.away.logo)}" alt=""> `:''}${esc(f.away.ab)} @ ${f.home.logo?`<img class="tl" src="${esc(f.home.logo)}" alt=""> `:''}${esc(f.home.ab)} · ${f.live?'<span class="neg">LIVE</span>':etTime(f.start)}</span><button class="back" id="back">‹ Slate</button></div>${h||'<div class="empty">No props posted yet.</div>'}`;
  $('#back').addEventListener('click',renderSlate); window.scrollTo({top:0});
  $('#view').querySelectorAll('.pl').forEach(el=>el.addEventListener('click',()=>{ const p=players.find(x=>x.key===el.dataset.k); if(p) openPlayer(p); }));
}
// ───────────────────────── wiring ─────────────────────────
function renderTabs(){ $('#tabs').innerHTML=Object.entries(SPORTS).map(([k,s])=>`<button class="tab${viewMode==='sport'&&k===sportKey?' on':''}" data-k="${k}">${s.label}</button>`).join('')+`<button class="tab${viewMode==='tracker'?' on':''}" data-k="__tracker" style="margin-left:auto;border-color:rgba(34,197,94,.45);${viewMode==='tracker'?'background:rgba(34,197,94,.16);':''}">Tracker${tracked.length?' · '+tracked.filter(t=>!t.final).length:''}</button>`;
  $('#tabs').querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{
    if(b.dataset.k==='__tracker'){ openTracker(); return; }
    clearInterval(trackerTimer); viewMode='sport'; $('.ftr').style.display='';
    const same=b.dataset.k===sportKey && mainRows.length;
    sportKey=b.dataset.k; LS.set('props_sport',sportKey); current=null; renderTabs();
    if(same){ renderSlate(); return; }
    mainRows=[]; players=[]; loadedAt=0; $('#view').innerHTML='<div class="empty">Loading…</div>'; $('#q').value=''; suggest('');
    loadSport(true).then(()=>{ if(!current) renderSlate(); }); })); }
$('#q').addEventListener('input',e=>suggest(e.target.value));
$('#q').addEventListener('focus',e=>suggest(e.target.value));
document.addEventListener('click',e=>{ if(!e.target.closest('.sw')) $('#sug').classList.remove('show'); });

$('#reload').addEventListener('click',()=>loadSport(true));
$('#cfg').addEventListener('click',()=>{ const u=prompt('OpticOdds backend URL (your Vercel /api/odds):',getBackend()); if(u!=null){ LS.set('oo_backend_url',u.trim()||BACKEND_DEFAULT); toast('Backend saved'); } });
