    const lists=await Promise.all(teamSports.map(([k])=>ensureInjuriesFor(k).then(list=>list.map(r=>({...r, sport:k})))));
    rows=lists.flat();
  } else {
    rows=(await ensureInjuriesFor(filter)).map(r=>({...r, sport:filter}));
  }
  if(viewMode!=='injuries' || injuriesFilter!==filter) return; // navigated/re-filtered while loading
  // game-time-decision statuses (still uncertain, worth watching) first, then everything
  // else; within each group, most recent first where a league reports a timestamp,
  // otherwise alphabetical instead of bunching at a fake "epoch" sort
  const INJ_PRI = {GTD:0, Q:1, P:2};
  rows.sort((a,b)=>{
    const ap=INJ_PRI[injShort(a.status)]??3, bp=INJ_PRI[injShort(b.status)]??3;
    if(ap!==bp) return ap-bp;
    const au=a.updated?new Date(a.updated).getTime():null, bu=b.updated?new Date(b.updated).getTime():null;
    if(au!=null&&bu!=null) return bu-au;
    if(au!=null) return -1;
    if(bu!=null) return 1;
    return a.name.localeCompare(b.name);
  });
  const listEl=$('#ilist'); if(!listEl) return;
  if(!rows.length){ listEl.innerHTML=`<div class="empty">No injury reports${filter==='all'?'':' for '+esc(SPORTS[filter].label)}.</div>`; return; }
  listEl.innerHTML=rows.slice(0,150).map(r=>`<div class="inrow"><div class="inhd"><span class="inj ${injClass(r.status)}">${esc(injShort(r.status))}</span><span class="innm">${esc(r.name)}${r.pos?` <span class="dim">${esc(r.pos)}</span>`:''}</span>${filter==='all'?`<span class="inlg">${esc(SPORTS[r.sport].label)}</span>`:''}</div><div class="inmeta">${r.team?esc(r.team)+' · ':''}${esc(r.status||'')}${r.note?' — '+esc(r.note):''}</div>${r.updated?`<div class="indt">${esc(fmtInjDate(r.updated))}</div>`:''}</div>`).join('');
}
// ───────────────────────── slate ─────────────────────────
function bestML(rows){ const b=bestFirst(rows)[0]; return b?fmtAm(b.price):'—'; }
function renderSlate(){
  current=null; const S=SPORTS[sportKey]; const view=$('#view');
  if(!fixtures.length){ view.innerHTML=`<div class="empty">No ${S.label} games in the window.</div>`; return; }
  if(S.ml){
    let h=''; let lastCard=null;
    fixtures.filter(f=>!f.live).forEach(f=>{
      if(f.card!==lastCard){ lastCard=f.card; h+=`<div class="sh"><span class="t">${esc(f.card)} · ${etDay(f.start)}</span></div>`; }
      const a=players.find(p=>p.key===normName(f.away.name)), b=players.find(p=>p.key===normName(f.home.name));
      const mlA=a?bestML(rowsFor(a,'ml',mainRows)):'—', mlB=b?bestML(rowsFor(b,'ml',mainRows)):'—';
      const initA=f.away.name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
      const initB=f.home.name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
      h+=`<div class="fight">
        <div class="flc" data-fk="${a?esc(a.key):''}"><div class="flph"><span class="ph">${initA}</span>${f.away.logo?`<img src="${esc(f.away.logo)}" alt="" onerror="this.style.display='none'">`:''}</div><div class="flnm">${esc(f.away.name)}</div><div class="flm">${mlA}</div></div>
        <span class="vs">VS</span>
        <div class="flc" data-fk="${b?esc(b.key):''}"><div class="flph"><span class="ph">${initB}</span>${f.home.logo?`<img src="${esc(f.home.logo)}" alt="" onerror="this.style.display='none'">`:''}</div><div class="flnm">${esc(f.home.name)}</div><div class="flm">${mlB}</div></div>
      </div>`;
    });
    view.innerHTML=`<div class="slate">${h}</div>`;
    view.querySelectorAll('.flc[data-fk]').forEach(el=>el.addEventListener('click',()=>{ const p=players.find(x=>x.key===el.dataset.fk); if(p) openPlayer(p); }));
    return;
  }
  let lastDay=null;
  // Once a game goes live, it drops off this pregame board entirely — betting live is a
  // different thing, and any prop you already tracked keeps updating fine in the Tracker tab
  // without needing to still be browsable here.
  const upcoming=fixtures.filter(f=>!f.live);
  if(!upcoming.length){ view.innerHTML=`<div class="empty">No upcoming ${S.label} games right now — anything live has dropped off this board.</div>`; return; }
  const h=upcoming.map(f=>{
    const dk=etDateKey(f.start); let hd='';
    if(dk!==lastDay){ lastDay=dk; hd=`<div class="sh" style="margin-top:6px"><span class="t">${etDay(f.start)} · ${esc(dk)}</span></div>`; }
    const n=players.filter(p=>p.fixtureId===f.id).length;
    const st = f.status==='completed' ? 'FINAL' : `${etDay(f.start)} ${etTime(f.start)}${startsInTxt(f.start)?` <span class="starts">${startsInTxt(f.start)}</span>`:''}`;
    return hd+`<div class="gm" data-fid="${esc(f.id)}"><div class="tmwrap"><div class="tm">${f.away.logo?`<img src="${esc(f.away.logo)}" alt="">`:''}${esc(f.away.ab||f.away.name)}<span class="at">@</span>${f.home.logo?`<img src="${esc(f.home.logo)}" alt="">`:''}${esc(f.home.ab||f.home.name)}</div><div class="gmt">${st}</div></div><div class="tt">${n} players</div></div>`;
  }).join('');
  view.innerHTML=`<div class="slate">${h}</div>`;
  view.querySelectorAll('.gm').forEach(el=>el.addEventListener('click',()=>renderGame(el.dataset.fid)));
}
function renderGame(fid){
  const f=fixtures.find(x=>x.id===fid); if(!f) return renderSlate();
  if(f.live){ $('#view').innerHTML=`<div class="sh shback"><span class="t">${esc(f.away.ab)} @ ${esc(f.home.ab)} · <span class="neg">LIVE</span></span><button class="back" id="back">‹ Slate</button></div><div class="empty">This game is live — its props are no longer shown here. Anything you already tracked keeps updating in the Tracker tab.</div>`; $('#back').addEventListener('click',renderSlate); return; }
  const list=players.filter(p=>p.fixtureId===fid).sort((a,b)=>a.name.localeCompare(b.name));
  const mkTxt = p => `${[...p.marketKeys].map(k=>marketLabel(sportKey,k)).slice(0,4).join(' · ')}${p.marketKeys.size>4?' +'+(p.marketKeys.size-4):''}`;
  const h=list.map(p=>`<div class="pl" data-k="${esc(p.key)}"><span>${esc(titleCase(p.name))} ${injPill(p)}</span><span class="m">${mkTxt(p)}</span></div>`).join('');
  $('#view').innerHTML=`<div class="sh shback"><span class="t">${f.away.logo?`<img class="tl" src="${esc(f.away.logo)}" alt=""> `:''}${esc(f.away.ab)} @ ${f.home.logo?`<img class="tl" src="${esc(f.home.logo)}" alt=""> `:''}${esc(f.home.ab)} · ${f.live?'<span class="neg">LIVE</span>':etTime(f.start)}</span><button class="back" id="back">‹ Slate</button></div>${h||'<div class="empty">No props posted yet.</div>'}`;
  $('#back').addEventListener('click',renderSlate); window.scrollTo({top:0});
  $('#view').querySelectorAll('.pl').forEach(el=>el.addEventListener('click',()=>{ const p=players.find(x=>x.key===el.dataset.k); if(p) openPlayer(p); }));
}
// ───────────────────────── wiring ─────────────────────────
let sportGameCounts = {};
async function loadSportGameCounts(){
  const now=Date.now();
  await Promise.all(Object.entries(SPORTS).map(async ([k,S])=>{
    try{
      const raw=[]; let page=1;
      for(let i=0;i<30;i++){ const r=await oo('/fixtures',{sport:S.sport,league:S.league,page}); (r?.data||[]).forEach(f=>raw.push(f)); if(!r?.has_more) break; page++; }
      const upper = S.ml ? Infinity : now+(S.days||1)*24*3600e3;
      let fx = raw.filter(f=>{ const t=new Date(f.start_date).getTime(); return t>=now-4*3600e3 && t<=upper && f.status!=='completed' && f.status!=='cancelled'; });
      if(S.ml){
        const cardOf=f=>(f.tournament?.name)||etDateKey(f.start_date);
        const order=[]; fx.forEach(f=>{ const c=cardOf(f); if(!order.includes(c)) order.push(c); });
        const keep=new Set(order.slice(0,2));
        fx=fx.filter(f=>keep.has(cardOf(f)));
      }
      sportGameCounts[k]=fx.length;
    }catch(e){ console.warn('[props] game count failed for',k,e.message); }
  }));
  renderTabs();
}
function renderTabs(){
  const order=Object.entries(SPORTS).sort((a,b)=>(sportGameCounts[b[0]]??-1)-(sportGameCounts[a[0]]??-1));
  $('#tabs').innerHTML=order.map(([k,s])=>{
    const c=sportGameCounts[k];
    return `<button class="tab${viewMode==='sport'&&k===sportKey?' on':''}" data-k="${k}">${s.label}${c!=null?`<span class="tcount">${c}</span>`:''}</button>`;
  }).join('')+`<button class="tab${viewMode==='injuries'?' on':''}" data-k="__injuries" style="margin-left:auto;border-color:rgba(251,191,36,.45);${viewMode==='injuries'?'background:rgba(251,191,36,.16);':''}">Injuries</button>`
    +`<button class="tab${viewMode==='tracker'?' on':''}" data-k="__tracker" style="border-color:rgba(34,197,94,.45);${viewMode==='tracker'?'background:rgba(34,197,94,.16);':''}">Tracker${tracked.length?' · '+tracked.filter(t=>!t.final).length:''}</button>`;
  $('#tabs').querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{
    if(b.dataset.k==='__tracker'){ openTracker(); return; }
    if(b.dataset.k==='__injuries'){ openInjuries(); return; }
    clearInterval(trackerTimer); viewMode='sport'; $('.sw').style.display='';
    const same=b.dataset.k===sportKey && mainRows.length;
    sportKey=b.dataset.k; LS.set('props_sport',sportKey); current=null; renderTabs();
    if(same){ renderSlate(); return; }
    mainRows=[]; players=[]; loadedAt=0; $('#view').innerHTML=loadingHtml(SPORTS[sportKey].label); $('#q').value=''; suggest('');
    loadSport(true).then(()=>{ if(!current) renderSlate(); }); })); }
$('#q').addEventListener('input',e=>suggest(e.target.value));
$('#q').addEventListener('focus',e=>suggest(e.target.value));
document.addEventListener('click',e=>{ if(!e.target.closest('.sw')) $('#sug').classList.remove('show'); });
$('#clr').addEventListener('click',()=>{ $('#q').value=''; suggest(''); renderSlate(); });
$('#q').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); const {name,mkey}=parseSearchQuery($('#q').value); const hit=players.filter(p=>nameMatches(p.name,name||$('#q').value) && !fixtureIsLive(p.fixtureId))[0]; if(hit){ openPlayer(hit, startIdxFor(hit,mkey)); $('#sug').classList.remove('show'); $('#q').blur(); } } });
$('#reload').addEventListener('click',()=>loadSport(true));
$('#cfg').addEventListener('click',()=>{ const u=prompt('OpticOdds backend URL (your Vercel /api/odds):',getBackend()); if(u!=null){ LS.set('oo_backend_url',u.trim()||BACKEND_DEFAULT); toast('Backend saved'); } });
renderTabs();
loadBookLogos();
purgeStaleSportCaches();
loadSportGameCounts();
loadSport(false).then(()=>{ if(!current) renderSlate(); if(!sawDeepLinks) console.log('[props] no deep_link fields returned — key may not have deep-link permission'); });
</script>
