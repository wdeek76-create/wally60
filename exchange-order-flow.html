<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flow">
<meta name="theme-color" content="#171b24">
<title>Exchange Order Flow · Pre-Game Props</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#171b24;--bg2:#1e2430;--bg3:#242b3c;--line:#1a1d22;--line2:#262a33;
  --text:#fff;--dim:#fff;
  --purple:#a855f7;--green:#22c55e;--red:#ff5c5c;--cyan:#7dd3fc;--amber:#fbbf24;
  --mono:'JetBrains Mono','Menlo',monospace;--sans:'Plus Jakarta Sans','Helvetica Neue',sans-serif;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;-webkit-text-size-adjust:100%;touch-action:manipulation;overscroll-behavior:none}
body{display:flex;flex-direction:column;min-height:100dvh}
button{cursor:pointer;border:none;background:none;color:inherit;font-family:inherit}
.mono{font-family:var(--mono)}
.dim{color:#fff;opacity:.6}

/* header */
.hdr{position:sticky;top:0;z-index:20;background:rgba(23,27,36,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:calc(var(--sat) + 10px) calc(var(--sar) + 14px) 10px calc(var(--sal) + 14px)}
.htitle{display:flex;align-items:center;justify-content:space-between;gap:8px}
.htitle h1{font-size:15px;font-weight:800;letter-spacing:.2px}
.hsub{font-family:var(--mono);font-size:10px;color:#fff;opacity:.65;margin-top:2px;letter-spacing:.3px}
.hsub .live{color:var(--green)}
.hbtns{display:flex;gap:6px}
.ib{width:32px;height:32px;border-radius:10px;background:var(--bg2);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:14px}
.ib.spin{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:10px;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:6px 13px;border-radius:999px;border:1px solid var(--line2);background:var(--bg2);color:#fff;font-weight:700;font-size:11.5px;letter-spacing:.3px}
.chip.on{background:var(--purple);border-color:var(--purple)}
.seg{display:flex;gap:4px;margin-top:8px;background:var(--bg2);border:1px solid var(--line2);border-radius:12px;padding:3px}
.seg button{flex:1;padding:6px 4px;border-radius:9px;font-size:10.5px;font-weight:800;color:#fff;opacity:.6;letter-spacing:.2px}
.seg button.on{background:var(--purple);opacity:1}

/* summary strip */
.sumrow{display:flex;gap:8px;padding:10px 14px 0}
.sumcell{flex:1;background:var(--bg2);border:1px solid var(--line2);border-radius:12px;padding:8px 6px;text-align:center}
.sumv{font-family:var(--mono);font-size:15px;font-weight:800;color:#fff}
.bkrow{display:flex;gap:8px;padding:8px 14px 0}
.bkcell{flex:1;background:var(--bg2);border:1px solid var(--line2);border-radius:12px;padding:7px 6px;text-align:center;display:flex;align-items:center;justify-content:center;gap:6px}
.bkcell img{width:15px;height:15px;border-radius:4px;object-fit:cover;flex:0 0 auto}
.bkcell .bkv{font-family:var(--mono);font-size:13px;font-weight:800;color:var(--green)}
.bkcell .bkl{font-size:9px;font-weight:800;color:#fff;opacity:.6;letter-spacing:.2px}
.suml{font-size:8.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:#fff;opacity:.55;margin-top:2px}

main{flex:1;padding:10px calc(var(--sar) + 12px) 40px calc(var(--sal) + 12px)}
.empty,.loading{text-align:center;padding:60px 20px;color:#fff;opacity:.5;font-size:13px}
.loading .spin{width:22px;height:22px;border-radius:50%;border:2px solid var(--line2);border-top-color:var(--purple);margin:0 auto 10px;animation:spin .8s linear infinite}

/* flow card */
.card{background:var(--bg2);border:1px solid var(--line2);border-radius:14px;padding:11px 12px;margin-bottom:8px;position:relative;overflow:hidden}
@keyframes cardPop{0%{box-shadow:0 0 0 0 rgba(34,197,94,.7),0 0 20px 2px rgba(34,197,94,.4);border-color:var(--green)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0),0 0 0 0 rgba(34,197,94,0);border-color:var(--line2)}}
.card.pop{animation:cardPop 1.6s ease-out}
.crow1{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cname{font-weight:800;font-size:13.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctag{font-family:var(--mono);font-size:9px;font-weight:800;letter-spacing:.4px;padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.08);color:#fff;flex:0 0 auto;text-transform:uppercase}
.csub{font-family:var(--mono);font-size:10px;color:#fff;opacity:.6;margin-top:3px}
.cmain{display:flex;align-items:center;gap:14px;margin-top:10px}
.cflow{flex:1}
.cflowv{font-family:var(--mono);font-size:20px;font-weight:800;color:var(--green);line-height:1}
.cflowl{font-size:9px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:#fff;opacity:.55;margin-top:2px}
.cavg{text-align:right}
.cavgv{font-family:var(--mono);font-size:17px;font-weight:800;color:#fff;line-height:1}
.cavgl{font-size:9px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:#fff;opacity:.55;margin-top:2px}
.cbooks{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.cbk{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.05);border:1px solid var(--line2);border-radius:999px;padding:3px 8px 3px 4px;font-family:var(--mono);font-size:9.5px;font-weight:700;color:#fff}
.cbk img{width:13px;height:13px;border-radius:3px;object-fit:cover}
.cnear{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line2)}
.cnearl{font-size:8.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--cyan);margin-bottom:5px}
.cnearrow{display:flex;flex-wrap:wrap;gap:5px}
.cnearbk{display:flex;align-items:center;gap:4px;background:rgba(125,211,252,.1);border:1px solid rgba(125,211,252,.3);border-radius:999px;padding:3px 8px 3px 4px;font-family:var(--mono);font-size:9.5px;font-weight:700;color:var(--cyan)}
.cnearbk img{width:13px;height:13px;border-radius:3px;object-fit:cover;background:#fff}
.cnone{font-size:10px;color:#fff;opacity:.45;font-style:italic}
.crecent{margin-top:7px;font-family:var(--mono);font-size:9px;color:#fff;opacity:.4}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sab) + 16px);background:var(--bg3);border:1px solid var(--line2);color:#fff;padding:9px 14px;border-radius:10px;font-size:12px;z-index:50;opacity:0;transition:opacity .15s;pointer-events:none;max-width:88vw;text-align:center}
.toast.on{opacity:1}
</style>
</head>
<body>

<div class="hdr">
  <div class="htitle">
    <div>
      <h1>Exchange Order Flow</h1>
      <div class="hsub" id="hsub">Pre-game player props · <span class="live">●</span> starting…</div>
    </div>
    <div class="hbtns">
      <button class="ib" id="reload" title="Refresh now">⟳</button>
      <button class="ib" id="resetBtn" title="Reset tracking">↺</button>
    </div>
  </div>
  <div class="chips" id="sportChips"></div>
  <div class="seg" id="sortSeg">
    <button class="on" data-sort="flow">Most $</button>
    <button data-sort="recent">Most Recent</button>
    <button data-sort="near">Still Near Avg</button>
  </div>
</div>

<div class="sumrow">
  <div class="sumcell"><div class="sumv" id="sumTotal">$0</div><div class="suml">Total Ordered</div></div>
  <div class="sumcell"><div class="sumv" id="sumProps">0</div><div class="suml">Props w/ Flow</div></div>
  <div class="sumcell"><div class="sumv" id="sumNear">0</div><div class="suml">Still Near Avg</div></div>
</div>
<div class="bkrow" id="bkrow"></div>

<main id="view"><div class="loading"><div class="spin"></div>Loading fixtures…</div></main>
<div class="toast" id="toast"></div>

<script>
// ───────────────────────── shared helpers (same conventions as props-screen.html) ─────────────────────────
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS = { get:(k,d)=>{ try{ const v=localStorage.getItem(k); return v==null?d:v; }catch(e){ return d; } }, set:(k,v)=>{ try{ localStorage.setItem(k,v); }catch(e){} } };
const BACKEND_DEFAULT = 'https://nfl-props-tracker-1.vercel.app/api/odds';
const getBackend = () => LS.get('oo_backend_url', BACKEND_DEFAULT);
async function oo(endpoint, params){
  const r = await fetch(getBackend(), { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ endpoint, params:params||{} }) });
  const text = await r.text();
  if(!r.ok){ let m=text; try{ const j=JSON.parse(text); m=j.error+(j.body?' — '+j.body:''); }catch(e){} throw new Error(`backend ${r.status}: ${m}`); }
  return JSON.parse(text);
}
const fmtAm = v => { const n=Number(v); return isNaN(n)?String(v):(n>0?'+'+n:String(n)); };
const toDec = a => { a=Number(a); return a>0?1+a/100:1+100/Math.abs(a); };
const toAm = d => (d-1)>=1 ? Math.round((d-1)*100) : -Math.round(100/(d-1));
const usd = n => n>=1000 ? '$'+(n/1000).toFixed(1).replace(/\.0$/,'')+'k' : '$'+Math.round(n);
const cleanSel = n => String(n||'').replace(/\s*\([^)]*\)\s*$/,'').trim();
const isCombo = n => /\s[+&\/]\s|\s\+|&/.test(String(n||''));
const normName = n => String(n||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/['’.`]/g,'').replace(/[^a-z ]/g,' ').replace(/\s+/g,' ').trim();
const titleCase = s => String(s||'').split(/\s+/).map(w => w && w.length<=4 && w===w.toUpperCase() && /[A-Z]/.test(w) ? w : (w.charAt(0).toUpperCase()+w.slice(1).toLowerCase())).join(' ');
const chunk = (a,n) => { const o=[]; for(let i=0;i<a.length;i+=n) o.push(a.slice(i,i+n)); return o; };
const etTime = iso => { try{ return new Date(iso).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:'America/New_York'}); }catch(e){ return ''; } };
const sideOf = o => { const s=String(o.selection_line||'').toLowerCase(); return s==='over'||s==='under' ? s : 'single'; };
// Cents distance between two American prices, correctly bridging the +100/-100 crossover
// (e.g. -105 to +105 is 10c apart, not 210) — same metric fd-sharp-tracker uses for CLV.
const centsDiff = (a,b) => { a=Number(a); b=Number(b); if((a<0)===(b<0)) return Math.abs(a-b); return Math.abs(Math.abs(a)-100)+Math.abs(Math.abs(b)-100); };
let toastT; const toast = m => { const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),2200); };

// ───────────────────────── books ─────────────────────────
// All books we price against for the "still within 10c" check; EXCH is who we track order flow on.
const BOOKS = ['Props Builder','FanDuel','Novig','Prophet X','Kalshi','Pinnacle','bet105','DraftKings','Fliff','BetOnline'];
const BOOK_REQ = [...BOOKS,'Courtside','Onyx Odds'];
const EXCH = new Set(['novig','prophet x','kalshi']);
const SHORT = { 'props builder':'PB','fanduel':'FD','novig':'Novig','prophet x':'PX','kalshi':'Kalshi','pinnacle':'Pin','bet105':'b105','draftkings':'DK','fliff':'Fliff','betonline':'BOL' };
const canonBook = n => { const k=String(n||'').toLowerCase(); if(k==='courtside'||k==='onyx odds') return 'draftkings'; return k; };
const bookLabel = n => { const k=canonBook(n); return BOOKS.find(b=>b.toLowerCase()===k) || n; };
const bookShort = n => SHORT[canonBook(n)] || n;
let bookLogos = {};
async function loadBookLogos(){
  try{ const c=JSON.parse(LS.get('oo_book_logos','null')); if(c && Date.now()-c.at<86400e3){ bookLogos=c.map; return; } }catch(e){}
  try{ const r=await oo('/sportsbooks',{}); const map={}; (r?.data||[]).forEach(b=>{ if(b?.name&&b?.logo) map[String(b.name).toLowerCase()]=b.logo; }); bookLogos=map; LS.set('oo_book_logos',JSON.stringify({at:Date.now(),map})); }
  catch(e){ console.warn('[flow] sportsbook logos failed',e.message); }
}
const bookLogo = n => { const k=canonBook(n); return bookLogos[String(n||'').toLowerCase()] || bookLogos[k] || ''; };

// order-book depth levels behind the top price (same parsing as props-screen.html)
function levelsOf(o){
  const top=Number(o.price);
  const ob=(Array.isArray(o.order_book)?o.order_book:[]).filter(l=>Array.isArray(l)&&l.length>=2);
  const normP=v=>{ v=Number(v); if(isNaN(v)) return NaN; return (v>1&&v<50)?toAm(v):v; };
  const out=[];
  if(ob.length){
    const a0=normP(ob[0][0]), b0=normP(ob[0][1]); const pf=Math.abs(a0-top)<=Math.abs(b0-top);
    ob.forEach(l=>{ const price=pf?normP(l[0]):normP(l[1]); const size=pf?Number(l[1]):Number(l[0]); if(!isNaN(price)&&!isNaN(size)&&size>0) out.push({price,size}); });
  } else if(o.limits?.max) out.push({price:top,size:Number(o.limits.max)});
  return out;
}

// ───────────────────────── sports / markets (subset of props-screen.html, player props only) ─────────────────────────
const PERIOD = /quarter|half|1st|2nd|3rd|4th|first|last|overtime|period|double|triple|basket|alternate|odd|even|milestone|race|to score|to record|to get|band|exact|margin|method|combo/;
const has = (m, ...w) => w.every(x=>m.includes(x));
const THREE = /three|3-point|3 point|3pt|3pm/;
const NBA_MKTS = [
  ['pts','Points',   m=>has(m,'point')&&!THREE.test(m)&&!has(m,'rebound')&&!has(m,'assist')&&!m.includes('+')],
  ['ast','Assists',  m=>has(m,'assist')&&!has(m,'point')&&!has(m,'rebound')],
  ['reb','Rebounds', m=>has(m,'rebound')&&!has(m,'point')&&!has(m,'assist')],
  ['pra','PRA',      m=>has(m,'point','rebound','assist')],
  ['3pm','3PM',      m=>THREE.test(m)],
  ['pr','P+R',       m=>has(m,'point','rebound')&&!has(m,'assist')],
  ['pa','P+A',       m=>has(m,'point','assist')&&!has(m,'rebound')],
  ['ra','R+A',       m=>has(m,'rebound','assist')&&!has(m,'point')],
];
const MLB_MKTS = [
  ['hits','Hits',         m=>has(m,'hit')&&!has(m,'allow')&&!has(m,'total base')&&!has(m,'extra base')&&!has(m,'run')&&!has(m,'rbi')],
  ['xbh','Extra Base Hits', m=>has(m,'extra base')],
  ['tb','Total Bases',    m=>has(m,'total base')],
  ['hr','Home Runs',      m=>has(m,'home run')],
  ['rbi','RBIs',          m=>has(m,'rbi')],
  ['runs','Runs Scored',  m=>has(m,'run')&&!has(m,'home run')&&!has(m,'earned')&&!has(m,'rbi')],
  ['bb','Walks',          m=>has(m,'walk')&&!has(m,'allow')],
  ['sb','Stolen Bases',   m=>has(m,'stolen base')],
  ['k','Strikeouts',      m=>has(m,'strikeout')&&!has(m,'allow')&&!has(m,'pitcher')],
  ['pk','Pitcher Ks',     m=>has(m,'strikeout')&&(has(m,'pitcher')||has(m,'allow'))],
];
const SPORTS = {
  nfl: { label:'NFL', sport:'football',   league:'nfl', days:7, markets:[
        ['pass_yds','Pass Yds', m=>has(m,'passing yards')&&!m.includes('+')],
        ['pass_td','Pass TD',   m=>has(m,'passing touchdown')&&!m.includes('+')],
        ['pass_att','Pass Att', m=>has(m,'passing attempt')&&!m.includes('+')],
        ['pass_cmp','Comp',     m=>has(m,'completion')&&!m.includes('+')],
        ['rush_yds','Rush Yds', m=>has(m,'rushing yards')&&!m.includes('+')],
        ['rush_att','Rush Att', m=>has(m,'rushing attempt')&&!m.includes('+')],
        ['rec_yds','Rec Yds',   m=>has(m,'receiving yards')&&!m.includes('+')],
        ['rec','Receptions',    m=>has(m,'reception')&&!has(m,'longest')&&!m.includes('+')],
        ['atd','Anytime TD',    m=>has(m,'anytime')&&has(m,'touchdown')],
      ]},
  nba: { label:'NBA', sport:'basketball', league:'nba', days:2, markets:NBA_MKTS },
  nhl: { label:'NHL', sport:'hockey',     league:'nhl', days:2, markets:[
        ['sog','Shots',   m=>!m.includes('+')&&(has(m,'shots on goal')||has(m,'shots'))],
        ['pts','Points',  m=>!m.includes('+')&&has(m,'point')&&!has(m,'power')],
        ['g','Goals',     m=>!m.includes('+')&&has(m,'goal')&&!has(m,'shots')&&!has(m,'total goals')&&!has(m,'power')],
        ['a','Assists',   m=>!m.includes('+')&&has(m,'assist')],
        ['sv','Saves',    m=>!m.includes('+')&&has(m,'save')],
      ]},
  mlb: { label:'MLB', sport:'baseball',   league:'mlb', days:1, markets:MLB_MKTS },
  ufc: { label:'UFC', sport:'mma', league:'ufc', ml:true, days:21, markets:[['ml','Moneyline', m=>MMA_ML.has(m)]] },
};
const MMA_ML = new Set(['moneyline','fight winner','to win fight','winner']);
const SPORT_KEYS = ['nfl','nba','nhl','mlb','ufc'];
const marketKeyFor = (sk, name) => { const m=String(name||'').toLowerCase(); if(!SPORTS[sk].ml && PERIOD.test(m)) return null; const hit=SPORTS[sk].markets.find(([,,t])=>t(m)); return hit?hit[0]:null; };
const marketLabel = (sk, key) => (SPORTS[sk].markets.find(m=>m[0]===key)||[])[1] || key;

// ───────────────────────── fixtures ─────────────────────────
// Pre-game only: a fixture that has gone live is dropped from the poll list (see pollOnce), and
// this fetch itself excludes anything already live or started so a stale cache can't reintroduce it.
let fixturesBySport = {};   // sk -> [{id,start,card,home,away}]
let lastFixtureFetch = {};  // sk -> ms, so we periodically pick up newly-posted fixtures
async function loadFixtures(sk){
  const S = SPORTS[sk];
  const raw=[]; let page=1;
  for(let i=0;i<20;i++){ const r=await oo('/fixtures',{sport:S.sport,league:S.league,page}); (r?.data||[]).forEach(f=>raw.push(f)); if(!r?.has_more) break; page++; }
  const now=Date.now(); const upper=now+(S.days||1)*24*3600e3;
  fixturesBySport[sk] = raw.filter(f=>{ const t=new Date(f.start_date).getTime(); return t>now && t<=upper && !f.is_live && f.status!=='live' && f.status!=='completed' && f.status!=='cancelled'; })
    .map(f=>({ id:f.id, start:f.start_date,
      home:{name:f.home_competitors?.[0]?.name||f.home_team_display||'', ab:f.home_competitors?.[0]?.abbreviation||''},
      away:{name:f.away_competitors?.[0]?.name||f.away_team_display||'', ab:f.away_competitors?.[0]?.abbreviation||''} }));
  lastFixtureFetch[sk] = Date.now();
}

// ───────────────────────── order-flow tracking ─────────────────────────
// METHOD: OpticOdds only exposes resting order-book depth, not an executed-trade feed, so "$
// ordered" is INFERRED by polling each exchange's order book and diffing it against the previous
// poll. If a price level's size shrinks (or disappears) between polls without the book's best
// price moving very far, that missing size is counted as filled volume at that price. If the best
// price jumps by more than REPRICE_GUARD_CENTS, the whole snapshot is treated as a reprice (the
// book pulled and re-quoted) rather than a fill, and nothing is counted for that poll.
const REPRICE_GUARD_CENTS = 20;
const REFRESH_MS = 30000;

// slotKey = sk|fixtureId|mkey|playerKey|side|line   (one row in the report — flow is summed
// ACROSS the 3 exchanges for that exact prop+side+line; per-book breakdown kept alongside)
let slots = {};             // slotKey -> { meta, totalSize, totalNotionalDec, byBook:{}, recent:[], curBooks:{} }
let bookSnap = {};          // slotKey|bookKey -> last-seen order_book levels
let sessionStart = Date.now();

function loadState(){
  try{
    const raw = JSON.parse(LS.get('flow_state','null'));
    if(raw && raw.slots){ slots=raw.slots; bookSnap=raw.bookSnap||{}; sessionStart=raw.sessionStart||Date.now(); }
  }catch(e){}
}
let saveT;
function saveState(){
  clearTimeout(saveT);
  saveT=setTimeout(()=>{ try{ LS.set('flow_state', JSON.stringify({slots,bookSnap,sessionStart})); }catch(e){} }, 800);
}
function resetState(){
  slots={}; bookSnap={}; sessionStart=Date.now();
  try{ localStorage.removeItem('flow_state'); }catch(e){}
  render();
  toast('Tracking reset');
}

function slotKeyFor(sk, fx, mkey, playerKey, side, line){ return `${sk}|${fx}|${mkey}|${playerKey}|${side}|${line??''}`; }

// Diff one exchange's order book against its last snapshot for this slot; returns filled size at
// each price this poll (or [] if none / treated as a reprice).
function diffLevels(oldLevels, newLevels){
  if(!oldLevels || !oldLevels.length) return [];
  const oldTop = oldLevels[0]?.price, newTop = newLevels[0]?.price;
  if(newTop==null || oldTop==null || centsDiff(oldTop,newTop) > REPRICE_GUARD_CENTS) return [];
  const newMap = {}; newLevels.forEach(l=>{ newMap[l.price] = (newMap[l.price]||0) + l.size; });
  const fills = [];
  oldLevels.forEach(l=>{
    const nowSize = newMap[l.price] || 0;
    const filled = l.size - nowSize;
    if(filled > 0.5) fills.push({ price:l.price, size:filled });
  });
  return fills;
}

function processOddsRows(sk, rows, fixtureMap){
  rows.forEach(o=>{
    const bk = canonBook(o.sportsbook);
    const isExch = EXCH.has(bk);
    const S = SPORTS[sk];
    const mkey = marketKeyFor(sk, o.market); if(!mkey) return;
    if(!S.ml && !o.player_id) return;                  // player props only, not game lines — except UFC moneyline, which has no player_id
    const sel = cleanSel(o.selection||o.name); if(!sel || isCombo(sel)) return;
    if(S.ml && /^(draw|tie|no contest|neither|either)\b/.test(normName(sel))) return;
    const playerKey = normName(sel); if(!playerKey) return;
    const side = sideOf(o);
    const line = o.points;
    const key = slotKeyFor(sk, o._fx, mkey, playerKey, side, line);

    // Always record the current price for every book (for the "still within 10c" check),
    // whether it's an exchange or not.
    if(!slots[key]) slots[key] = { totalSize:0, totalNotionalDec:0, byBook:{}, recent:[], curBooks:{}, meta:null };
    const slot = slots[key];
    if(!slot.meta){
      const fx = fixtureMap[o._fx];
      slot.meta = { sk, fx:o._fx, mkey, playerKey, playerName:titleCase(sel), side, line,
        game: fx ? `${fx.away.ab||fx.away.name} @ ${fx.home.ab||fx.home.name}` : '', start: fx?.start||null };
    }
    slot.curBooks[bk] = { price:Number(o.price), name:bookLabel(o.sportsbook) };

    if(!isExch) return;
    const levels = levelsOf(o);
    const snapKey = key+'|'+bk;
    const fills = diffLevels(bookSnap[snapKey], levels);
    if(fills.length){
      let addedSize=0;
      fills.forEach(f=>{
        slot.totalSize += f.size;
        slot.totalNotionalDec += f.size * toDec(f.price);
        slot.byBook[bk] = (slot.byBook[bk]||0) + f.size;
        addedSize += f.size;
      });
      const avgFillDec = fills.reduce((a,f)=>a+toDec(f.price)*f.size,0) / fills.reduce((a,f)=>a+f.size,0);
      slot.recent.unshift({ at:Date.now(), bk, size:addedSize, price:toAm(avgFillDec) });
      slot.recent = slot.recent.slice(0,6);
      slot._justUpdated = true;
    }
    bookSnap[snapKey] = levels;
  });
}

function avgPriceOf(slot){ return slot.totalSize ? toAm(slot.totalNotionalDec/slot.totalSize) : null; }
function nearBooksFor(slot){
  const avg = avgPriceOf(slot); if(avg==null) return [];
  return Object.entries(slot.curBooks)
    .filter(([bk,v]) => centsDiff(v.price, avg) <= 10)
    .map(([bk,v]) => ({ bk, name:v.name, price:v.price }));
}

// ───────────────────────── polling ─────────────────────────
let activeSport = 'all';
let sortMode = 'flow';
let polling = false;
async function pollOnce(showSpin){
  if(polling) return; polling=true;
  const spinBtn=$('#reload'); if(showSpin) spinBtn.classList.add('spin');
  try{
    for(const sk of SPORT_KEYS){
      if(!fixturesBySport[sk] || !fixturesBySport[sk].length || Date.now()-(lastFixtureFetch[sk]||0)>300000) await loadFixtures(sk).catch(e=>console.warn('[flow] fixtures failed',sk,e.message));
      // Re-check start time on every poll (not just at fetch time) so a fixture that has since
      // kicked off drops out of pre-game tracking immediately instead of lingering until the next
      // 5-minute fixture refresh.
      const fx = (fixturesBySport[sk]||[]).filter(f=>new Date(f.start).getTime()>Date.now());
      if(!fx.length) continue;
      const fixtureMap = {}; fx.forEach(f=>fixtureMap[f.id]=f);
      for(const fxChunk of chunk(fx.map(f=>f.id),5)){
        for(const bkChunk of chunk(BOOK_REQ,5)){
          try{
            const r = await oo('/fixtures/odds', { fixture_id:fxChunk, sportsbook:bkChunk, is_main:true });
            const rows=[]; (r?.data||[]).forEach(d=>(d.odds||[]).forEach(o=>{ o._fx=d.id; rows.push(o); }));
            processOddsRows(sk, rows, fixtureMap);
          }catch(e){ console.warn('[flow] odds chunk failed', sk, e.message); }
        }
      }
    }
    saveState();
    render();
  } finally {
    polling=false;
    if(showSpin) spinBtn.classList.remove('spin');
    $('#hsub').innerHTML = `Pre-game player props · <span class="live">●</span> live · updated ${new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit',second:'2-digit'})}`;
  }
}

// ───────────────────────── render ─────────────────────────
function cardHtml(key, slot){
  const m = slot.meta; const avg = avgPriceOf(slot);
  const sideLabel = m.side!=='single' ? (m.side==='over'?'Over':'Under') : (SPORTS[m.sk].ml ? 'ML' : 'Yes');
  const books = Object.entries(slot.byBook).filter(([,v])=>v>1).sort((a,b)=>b[1]-a[1]);
  const near = nearBooksFor(slot);
  const bookBadges = books.map(([bk,v])=>{
    const lg=bookLogo(bk); return `<span class="cbk">${lg?`<img src="${esc(lg)}" alt="">`:''}${esc(bookShort(bk))} ${usd(v)}</span>`;
  }).join('');
  const nearHtml = near.length
    ? `<div class="cnearrow">${near.map(n=>{ const lg=bookLogo(n.bk); return `<span class="cnearbk">${lg?`<img src="${esc(lg)}" alt="">`:''}${esc(bookShort(n.bk))} ${fmtAm(n.price)}</span>`; }).join('')}</div>`
    : `<span class="cnone">No book still within 10¢</span>`;
  const recent = slot.recent[0];
  const recentHtml = recent ? `${usd(recent.size)} @ ${fmtAm(recent.price)} on ${esc(bookShort(recent.bk))} · ${Math.round((Date.now()-recent.at)/60000)}m ago` : '';
  return `<div class="card${slot._justUpdated?' pop':''}" data-key="${esc(key)}">
    <div class="crow1">
      <span class="cname">${esc(m.playerName)}</span>
      <span class="ctag">${esc(SPORTS[m.sk].label)}</span>
    </div>
    <div class="csub">${esc(marketLabel(m.sk,m.mkey))}${m.line!=null?' '+m.line:''}${SPORTS[m.sk].ml?'':' · '+esc(sideLabel)}${m.game?' · '+esc(m.game):''}${m.start?' · '+esc(etTime(m.start)):''}</div>
    <div class="cmain">
      <div class="cflow"><div class="cflowv">${usd(slot.totalSize)}</div><div class="cflowl">Ordered</div></div>
      <div class="cavg"><div class="cavgv">${avg!=null?fmtAm(avg):'—'}</div><div class="cavgl">Avg Price</div></div>
    </div>
    ${bookBadges?`<div class="cbooks">${bookBadges}</div>`:''}
    <div class="cnear"><div class="cnearl">Still within 10¢ of avg</div>${nearHtml}</div>
    ${recentHtml?`<div class="crecent">Last: ${recentHtml}</div>`:''}
  </div>`;
}

function render(){
  // Once a tracked game's start time passes, drop its cards from the report — this tool is
  // pre-game only. Totals stay in localStorage in case the start time shifts, they just stop
  // rendering and stop being polled (see pollOnce).
  const list = Object.entries(slots).filter(([,s])=>s.totalSize>0 && (activeSport==='all'||s.meta.sk===activeSport) && (!s.meta.start || new Date(s.meta.start).getTime()>Date.now()));
  $('#sumTotal').textContent = usd(list.reduce((a,[,s])=>a+s.totalSize,0));
  $('#sumProps').textContent = list.length;
  $('#sumNear').textContent = list.filter(([,s])=>nearBooksFor(s).length>0).length;

  // Per-exchange totals, summed the same way as the headline number but broken out by book —
  // same EXCH order everywhere else in the app (Novig, Prophet X, Kalshi).
  const bkTotals = {}; EXCH.forEach(bk=>bkTotals[bk]=0);
  list.forEach(([,s])=>{ Object.entries(s.byBook).forEach(([bk,v])=>{ bkTotals[bk]=(bkTotals[bk]||0)+v; }); });
  $('#bkrow').innerHTML = [...EXCH].map(bk=>{
    const lg=bookLogo(bk);
    return `<div class="bkcell">${lg?`<img src="${esc(lg)}" alt="">`:''}<span class="bkv">${usd(bkTotals[bk]||0)}</span><span class="bkl">${esc(bookShort(bk))}</span></div>`;
  }).join('');

  if(!list.length){ $('#view').innerHTML = `<div class="empty">No exchange order flow detected yet on upcoming (pre-game) player props — this builds up as Novig, Prophet X, and Kalshi order books move. Leave this open; reports appear as soon as size gets taken off a book, and a game drops off here once it goes live.</div>`; return; }

  list.sort((a,b)=>{
    if(sortMode==='recent') return (b[1].recent[0]?.at||0) - (a[1].recent[0]?.at||0);
    if(sortMode==='near') return nearBooksFor(b[1]).length - nearBooksFor(a[1]).length || b[1].totalSize-a[1].totalSize;
    return b[1].totalSize - a[1].totalSize;
  });

  $('#view').innerHTML = list.map(([k,s])=>cardHtml(k,s)).join('');
  list.forEach(([k,s])=>{ if(s._justUpdated){ s._justUpdated=false; } });
  // clear the pop class after the animation plays once, so the next real update can re-trigger it
  document.querySelectorAll('.card.pop').forEach(el=>el.addEventListener('animationend',()=>el.classList.remove('pop'),{once:true}));
}

// ───────────────────────── chips / controls ─────────────────────────
function renderChips(){
  const chips = [['all','All'], ...SPORT_KEYS.map(k=>[k,SPORTS[k].label])];
  $('#sportChips').innerHTML = chips.map(([k,l])=>`<button class="chip${activeSport===k?' on':''}" data-sport="${k}">${esc(l)}</button>`).join('');
  $('#sportChips').querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{ activeSport=b.dataset.sport; renderChips(); render(); }));
}
$('#sortSeg').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
  sortMode=b.dataset.sort; $('#sortSeg').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); render();
}));
$('#reload').addEventListener('click',()=>pollOnce(true));
$('#resetBtn').addEventListener('click',()=>{ if(confirm('Reset all tracked order flow? This clears the running totals.')) resetState(); });

// ───────────────────────── boot ─────────────────────────
(async function boot(){
  loadState();
  renderChips();
  render();
  await loadBookLogos();
  await pollOnce(true);
  setInterval(()=>{ if(document.visibilityState==='visible') pollOnce(false); }, REFRESH_MS);
})();
</script>
</body>
