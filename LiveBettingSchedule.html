<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<style>* { touch-action: manipulation; }</style>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Live.">
<meta name="theme-color" content="#0a0a0c">
<link rel="apple-touch-icon" href="live-icon.svg">
<link rel="manifest" href="manifest.json">
<title>Live Now</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0c;
    --card: #141418;
    --border: #26262e;
    --green: #27c071;
    --ufc: #4db8ff;
    --ufc-dim: rgba(77,184,255,0.12);
    --green-dim: rgba(39,192,113,0.1);
    --red: #ff3b3b;
    --amber: #f5a623;
    --text: #ffffff;
    --sub: rgba(255,255,255,0.5);
    --font: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: #000000; color: var(--text); font-family: var(--font); overscroll-behavior: none; }
  #app {
    background: var(--bg);
    min-height: 100vh;
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
    max-width: 480px;
    margin: 0 auto;
    padding-bottom: calc(32px + env(safe-area-inset-bottom));
    box-shadow: 0 0 40px rgba(0,0,0,0.4);
  }

  /* ── HEADER ── */
  header {
    padding: 14px 16px 10px;
    padding-top: calc(14px + env(safe-area-inset-top));
  }
  .header-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 6px;
  }
  .logo-name { font-size: 21px; font-weight: 900; letter-spacing: -1px; color: var(--text); line-height: 1; }
  .logo-live-dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--red); margin-left: 4px; vertical-align: middle;
    box-shadow: 0 0 6px var(--red), 0 0 12px rgba(255,59,59,0.4);
    animation: blink 1.4s ease-in-out infinite;
    position: relative; top: -2px;
  }
  .logo-tag {
    font-size: 10px; font-weight: 700; color: rgba(255,255,255,0.55);
    letter-spacing: 0.6px; text-transform: uppercase;
  }
  .logo-tag-highlight {
    color: var(--green);
    animation: greenPulse 2.5s ease-in-out infinite;
  }
  @keyframes greenPulse {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.45; }
  }
  .header-meta {
    display: flex; align-items: center; gap: 7px;
    font-size: 12px; color: var(--green); font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .tz-label {
    display: flex; align-items: center; gap: 3px;
    font-size: 9px; font-weight: 800; color: rgba(255,255,255,0.4);
    letter-spacing: 0.8px;
  }
  .sync-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--green); flex-shrink: 0;
    transition: background 0.3s;
  }
  .sync-dot.stale { background: var(--amber); animation: none; }
  .sync-dot.live  { animation: blink 1.3s infinite; }
  #refresh-btn {
    background: none; border: none; color: var(--sub);
    font-size: 18px; cursor: pointer; padding: 4px; line-height: 1;
    transition: color 0.15s;
  }
  #refresh-btn.spinning { color: var(--green); animation: spin 0.7s linear infinite; }

  .league-strip {
    display: flex; gap: 20px; padding: 8px 16px 12px;
    overflow-x: auto; scrollbar-width: none;
    border-top: 1px solid var(--border);
    margin-top: 2px;
  }
  .league-strip::-webkit-scrollbar { display: none; }

  .league-chip {
    display: inline-flex; align-items: center; gap: 5px;
    cursor: pointer; user-select: none; flex: 0 0 auto;
    padding: 0; background: none; border: none;
  }
  .league-chip.empty { opacity: 0.3; }
  .chip-name {
    font-size: 13px; font-weight: 800; letter-spacing: 0.8px;
    color: rgba(255,255,255,0.4); text-transform: uppercase;
    transition: color 0.15s;
  }
  .league-chip.active .chip-name { color: #fff; }
  .chip-count {
    font-size: 10px; font-weight: 700; color: rgba(255,255,255,0.3);
    transition: color 0.15s;
  }
  .league-chip.active .chip-count { color: rgba(255,255,255,0.6); }
  .chip-live-dot {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--red); flex-shrink: 0;
    animation: blink 1.3s infinite;
  }

  /* ── DATE TOGGLE ── */
  .date-toggle {
    display: flex; gap: 4px;
    margin: 0 16px 10px;
  }
  .date-btn {
    position: relative; overflow: hidden;
    flex: 1; padding: 8px 0; border-radius: 9px; border: 1.5px solid var(--border);
    background: transparent;
    color: rgba(255,255,255,0.4); font-family: var(--font);
    font-size: 11px; font-weight: 800; letter-spacing: 0.8px; text-transform: uppercase;
    cursor: pointer; transition: all 0.15s;
  }
  .date-btn.active {
    border-color: rgba(39,192,113,0.5); color: var(--green);
    background: rgba(39,192,113,0.12);
    box-shadow: inset 0 1px 1px rgba(255,255,255,0.18), inset 0 -1px 1px rgba(0,0,0,0.15);
  }
  .date-btn.active::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(120deg, rgba(255,255,255,0.3) 0%, rgba(255,255,255,0.06) 15%, transparent 35%);
    pointer-events: none;
  }
  .date-btn > * { position: relative; z-index: 1; }
  .status-strip {
    display: flex; align-items: center;
    margin: 0 16px 10px;
    background: transparent;
  }
  .stat-cell {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    padding: 8px 4px;
  }
  .stat-cell:last-child { border-right: none; }
  .stat-val { font-size: 22px; font-weight: 800; line-height: 1; color: var(--text); letter-spacing: -1px; }
  .stat-val.red    { color: var(--red); }
  .stat-val.amber  { color: var(--amber); }
  .stat-val.red.glowing {
    animation: redGlow 1.4s ease-in-out infinite;
  }
  @keyframes redGlow {
    0%,100% { text-shadow: 0 0 6px rgba(255,59,59,0.6), 0 0 14px rgba(255,59,59,0.3); }
    50%      { text-shadow: 0 0 2px rgba(255,59,59,0.2); }
  }
  .stat-label { font-size: 8px; font-weight: 700; color: var(--sub); text-transform: uppercase; letter-spacing: 1.5px; margin-top: 3px; }

  /* ── SECTION LABEL ── */
  .section-label {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 16px 6px;
  }
  .section-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .section-dot.live  { background: var(--red); animation: blink 1.3s infinite; box-shadow: 0 0 8px var(--red); }
  .section-dot.soon  { background: var(--amber); box-shadow: 0 0 6px var(--amber); }
  .section-dot.sched { background: rgba(255,255,255,0.3); }
  .section-dot.final { background: rgba(255,255,255,0.2); }
  .section-name { font-size: 13px; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; color: #fff; }
  .section-n {
    font-size: 12px; font-weight: 900; color: #fff;
    background: rgba(255,255,255,0.12); padding: 1px 7px; border-radius: 20px;
  }
  .section-cd {
    font-size: 13px; font-weight: 900; color: rgba(255,255,255,0.6);
    font-variant-numeric: tabular-nums;
  }

  /* ── GAME ROWS ── */
  .games-list { display: flex; flex-direction: column; }
  .game-row {
    display: flex; align-items: center;
    padding: 8px 14px 8px 18px;
    border-bottom: 1px solid var(--border);
    gap: 10px;
    animation: fadein 0.18s ease;
    position: relative;
  }
  .game-row:last-child { border-bottom: none; }
  .game-row.live-row  { background: rgba(255,59,59,0.03); }
  .game-row.soon-row  { }

  /* Rows with an at-bat strip stack vertically */
  .game-row.has-ab { flex-direction: column; align-items: stretch; gap: 0; padding-bottom: 0; }
  .game-row.has-ab .game-row-main { display: flex; align-items: center; gap: 10px; width: 100%; }
  .game-row-main { display: contents; }

  .ab-strip {
    display: flex; align-items: center; flex-wrap: wrap; gap: 8px;
    padding: 6px 0 8px 52px;
    font-size: 11px; font-weight: 600;
  }
  .ab-side { display: inline-flex; align-items: center; gap: 4px; }
  .ab-team {
    font-size: 8px; font-weight: 800; color: rgba(255,255,255,0.5);
    background: rgba(255,255,255,0.08); padding: 1px 4px; border-radius: 3px;
    letter-spacing: 0.3px;
  }
  .ab-name { color: #fff; font-weight: 800; font-size: 11px; }
  .ab-vs { color: rgba(255,255,255,0.35); font-weight: 500; font-size: 9px; }
  .ab-last {
    color: var(--green); font-weight: 700;
    background: rgba(39,192,113,0.1); border: 1px solid rgba(39,192,113,0.2);
    padding: 2px 8px; border-radius: 5px;
    animation: abpop 0.4s ease;
  }
  @keyframes abpop {
    0% { transform: scale(0.9); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  .game-row::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2.5px;
    border-radius: 0 2px 2px 0;
  }
  .live-row::before  { background: var(--red); }
  .soon-row::before  { background: var(--amber); }
  .sched-row::before { background: transparent; }
  .final-row::before { background: transparent; }

  /* HIGH VALUE moment highlight */
  /* Urgency tiers for upcoming games */
  .game-row.urgent { background: rgba(255,255,255,0.035); }
  .game-row.urgent .gs-cd { color: var(--amber); font-size: 15px; }
  .game-row.urgent::before { background: var(--amber) !important; box-shadow: 0 0 6px rgba(245,166,35,0.5); }
  .game-row.distant { opacity: 0.55; }
  .game-row.distant .team-logo { opacity: 0.7; }

  .game-row.hot-row {
    background: rgba(39,192,113,0.08) !important;
    box-shadow: inset 0 0 20px rgba(39,192,113,0.06);
  }
  .game-row.hot-row::before { background: var(--green) !important; box-shadow: 0 0 8px rgba(39,192,113,0.9), 0 0 16px rgba(39,192,113,0.4); }
  .hot-badge {
    font-size: 8px; font-weight: 800; color: var(--green);
    letter-spacing: 0.5px; text-transform: uppercase;
    white-space: nowrap; animation: greenPulse 1.8s ease-in-out infinite;
  }

  /* LOGOS */
  .logos { display: flex; flex-direction: column; gap: 7px; align-items: center; flex-shrink: 0; width: 28px; }
  .team-logo { width: 25px; height: 25px; object-fit: contain; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8)) drop-shadow(0 0 8px rgba(0,0,0,0.4)); }
  .team-logo.dim { opacity: 0.45; filter: grayscale(60%); }
  .logo-placeholder {
    width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 7px; font-weight: 900; color: rgba(255,255,255,0.85);
  }

  /* TEAMS */
  .teams { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 7px; }
  .team-line { display: flex; align-items: center; gap: 5px; }
  .t-name {
    font-size: 13.5px; font-weight: 900; color: var(--text); letter-spacing: 0.3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    text-transform: uppercase; line-height: 1;
    text-shadow: 0 1px 3px rgba(0,0,0,0.7);
  }
  .t-name.loser { color: #fff; font-weight: 900; }
  /* Record: same line as name, white, smaller */
  .t-rec { font-size: 9px; color: var(--text); font-weight: 600; flex-shrink: 0; white-space: nowrap; }

  /* SCORES */
  .scores { display: flex; flex-direction: column; gap: 7px; align-items: flex-end; flex-shrink: 0; }
  .t-score {
    font-size: 15px; font-weight: 800; color: var(--text);
    line-height: 1; min-width: 22px; text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .t-score.winner { color: #fff; }
  .t-score.loser  { color: #fff; }
  .t-score.blank  { color: rgba(255,255,255,0.3); font-size: 12px; }

  /* STATUS */
  .game-status {
    flex-shrink: 0; min-width: 54px; text-align: right;
    display: flex; flex-direction: column; align-items: flex-end; gap: 2px;
  }
  .gs-live    { font-size: 9px; font-weight: 800; color: var(--red); letter-spacing: 0.6px; }
  .gs-period  { font-size: 10px; font-weight: 700; color: var(--text); }
  .gs-clock   { font-size: 10px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  .gs-break   { font-size: 9px; font-weight: 800; color: var(--amber); line-height: 1.3; }
  .gs-cd      { font-size: 14px; font-weight: 800; color: #fff; font-variant-numeric: tabular-nums; }
  .upcoming-status {
    flex-direction: row !important;
    align-items: center !important;
    gap: 6px !important;
    min-width: auto !important;
  }
  .gs-sep { font-size: 11px; color: rgba(255,255,255,0.25); }
  .gs-time    { font-size: 10px; font-weight: 700; color: var(--text); }
  .gs-final   { font-size: 9px; font-weight: 800; color: rgba(255,255,255,0.5); letter-spacing: 0.5px; }

  /* league micro-label */
  .game-league {
    font-size: 9px; font-weight: 800; letter-spacing: 0.8px; text-transform: uppercase;
    position: absolute; bottom: 4px; right: 14px; color: rgba(255,255,255,0.75);
  }
  .live-row  .game-league { color: var(--red); }
  .soon-row  .game-league { color: rgba(255,255,255,0.75); }

  /* window highlight */
  /* win-highlight handled below with gradient */

  /* divider between teams — removed, use row gap instead */
  .teams-divider { display: none; }
  /* section separator */
  .section-sep { height: 1px; background: var(--border); margin: 10px 0 4px; }

  /* ── NEXT UP ROW ── */
  .next-up-row {
    display: flex; align-items: center; gap: 10px;
    padding: 5px 16px 5px 20px;
    background: rgba(39,192,113,0.05);
    border-bottom: 1px solid var(--border);
  }
  .next-up-label { font-size: 8px; font-weight: 800; color: var(--green); letter-spacing: 1px; text-transform: uppercase; flex-shrink: 0; }
  .next-up-teams { font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.6); flex: 1; text-transform: uppercase; letter-spacing: 0.3px; }
  .next-up-cd { font-size: 12px !important; color: var(--green) !important; }

  .mlb-sit { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
  .mlb-count { font-size: 10px; font-weight: 700; color: var(--text); letter-spacing: 0.5px; margin-top: 2px; }
  .mlb-count span { color: rgba(255,255,255,0.5); margin-left: 4px; }

  /* MLB inline between teams */
  .mlb-inline {
    display: flex; align-items: center; gap: 8px;
    padding: 3px 0;
  }
  .mlb-inline-count { font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.6); font-variant-numeric: tabular-nums; }
  .mlb-bar-outs { display: flex; gap: 4px; align-items: center; }
  .out-dot { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.25); }
  .out-dot.filled { background: var(--amber); border-color: var(--amber); }
  /* SVG diamond rendered inline — sized via width/height attrs */

  /* ── INSIGHT BAR ── */
  #insight-bar {
    position: relative;
    margin: 0 16px 14px;
    padding: 14px 16px 12px;
    border-radius: 16px;
    background:
      linear-gradient(160deg, rgba(39,192,113,0.09) 0%, rgba(39,192,113,0.02) 50%, rgba(255,255,255,0.01) 100%),
      var(--card);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.05),
      0 4px 20px rgba(0,0,0,0.25);
    overflow: hidden;
  }
  #insight-bar::before {
    content: '';
    position: absolute; inset: 0;
    border-radius: 16px; padding: 1px;
    background: linear-gradient(160deg, rgba(39,192,113,0.45) 0%, rgba(39,192,113,0.12) 45%, rgba(255,255,255,0.05) 100%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    pointer-events: none;
  }
  .tl-header {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 12px;
  }
  /* Come back header */
  .tl-cb-header {
    display: flex; align-items: flex-start; gap: 12px; margin-bottom: 16px;
  }
  .tl-chart-row {
    display: flex; align-items: stretch; gap: 8px;
  }
  .tl-chart-inner { flex: 1; min-width: 0; }
  .tl-chart-row .tl-arrow {
    align-self: center;
  }
  .tl-nav { display: flex; gap: 6px; flex-shrink: 0; }
  .tl-arrow {
    position: relative; overflow: hidden;
    width: 30px; height: 30px; border-radius: 9px;
    border: 1px solid rgba(39,192,113,0.3);
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    color: var(--green);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
    transition: transform 0.12s, filter 0.12s, background 0.12s;
    box-shadow: inset 0 1px 1px rgba(255,255,255,0.2), inset 0 -1px 1px rgba(0,0,0,0.2);
  }
  .tl-arrow::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.1) 18%, transparent 40%);
    pointer-events: none;
  }
  .tl-arrow > svg { position: relative; z-index: 1; }
  .tl-arrow:active { transform: scale(0.92); filter: brightness(1.2); }
  .tl-cb-icon {
    flex-shrink: 0; width: 42px; height: 42px; border-radius: 11px;
    background: rgba(39,192,113,0.1); border: 1px solid rgba(39,192,113,0.2);
    display: flex; align-items: center; justify-content: center;
  }
  .tl-cb-text { flex: 1; min-width: 0; }
  .tl-cb-title {
    font-size: 18px; font-weight: 800; color: #fff; line-height: 1.15;
    letter-spacing: -0.3px;
  }
  .tl-cb-sub {
    font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.85);
    margin-top: 3px; line-height: 1.35;
  }
  .tl-title {
    font-size: 10px; font-weight: 800; text-transform: uppercase;
    letter-spacing: 1.2px; color: rgba(255,255,255,0.45);
  }
  .tl-peak {
    font-size: 12px; font-weight: 800; color: #fff;
  }
  .tl-peak-time {
    color: var(--green); font-weight: 900; margin-left: 4px;
    text-shadow: 0 0 10px rgba(39,192,113,0.7);
  }
  .tl-chart {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 3px; height: 100px; padding-top: 4px;
  }
  .tl-slot {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: flex-end; height: 100%;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
    min-width: 4px;
  }
  .tl-bcount {
    font-size: 9px; font-weight: 800; color: var(--green);
    line-height: 1; margin-bottom: 6px;
    -webkit-text-stroke: 0.5px rgba(255,255,255,0.9);
    paint-order: stroke fill;
    text-shadow: 0 0 6px rgba(39,192,113,0.5);
    position: relative; z-index: 3;
  }
  .tl-bar {
    width: 100%; border-radius: 3px;
    transition: transform 0.15s, filter 0.15s;
    min-height: 8px;
    border: 1px solid rgba(0,0,0,0.5);
    box-shadow: 0 1px 2px rgba(0,0,0,0.4);
  }
  /* two-tone */
  .tl-slot.low  .tl-bar { background: rgba(39,192,113,0.22); }
  .tl-slot.mid  .tl-bar { background: rgba(39,192,113,0.45); }
  .tl-slot.bright .tl-bar {
    background: var(--green);
    box-shadow: 0 0 10px rgba(39,192,113,0.4);
  }
  .tl-slot.now .tl-bar { outline: 1.5px solid rgba(255,255,255,0.4); outline-offset: 1px; }
  .tl-slot.sel .tl-bar {
    transform: scaleY(1.05);
    filter: brightness(1.3);
    outline: 2px solid #fff;
    outline-offset: 1px;
    box-shadow: 0 0 16px rgba(39,192,113,0.9);
  }

  .tl-ticks {
    display: flex; justify-content: space-between;
    margin-top: 6px; gap: 2px;
  }
  .tl-tick {
    flex: 1; text-align: center; min-width: 0;
    font-size: 9px; font-weight: 700; color: rgba(255,255,255,0.35);
    white-space: nowrap;
  }
  .tl-labels {
    position: relative; height: 16px; margin-top: 4px;
  }
  .tl-clabel {
    position: absolute; top: 0;
    transform: translateX(-50%);
    font-size: 9px; font-weight: 800; color: var(--green);
    white-space: nowrap;
    -webkit-text-stroke: 0.5px rgba(255,255,255,0.9);
    paint-order: stroke fill;
    text-shadow: 0 0 6px rgba(39,192,113,0.4);

<body>
<div id="app">

<header>
  <div class="header-row">
    <span class="logo-name">Live<span class="logo-live-dot"></span></span>
    <div class="header-meta">
      <div class="sync-dot" id="sync-dot"></div>
      <span id="last-updated">--:--</span>
      <span class="tz-label">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
        </svg>
        ET
      </span>
      <button id="refresh-btn" onclick="fetchAll()" title="Refresh">↻</button>
    </div>
  </div>
  <div class="logo-tag">When to focus on <span class="logo-tag-highlight">live betting</span> today?</div>
</header>

<!-- LEAGUE FILTER CHIPS -->
<!-- STATUS BAR -->
<div class="date-toggle">
  <button class="date-btn active" id="btn-today" onclick="switchDate(0)">Today</button>
  <button class="date-btn" id="btn-tomorrow" onclick="switchDate(1)">Tomorrow</button>
</div>

<div id="insight-bar" style="display:none"></div>

<div class="league-strip" id="league-strip">
  <!-- built dynamically -->
</div>

<div class="status-strip">
  <div class="stat-cell">
    <span class="stat-val red" id="sum-live">—</span>
    <span class="stat-label" id="label-live">Live</span>
  </div>
  <div class="stat-cell">
    <span class="stat-val amber" id="sum-soon">—</span>
    <span class="stat-label" id="label-soon">Soon</span>
  </div>
  <div class="stat-cell">
    <span class="stat-val" id="sum-today">—</span>
    <span class="stat-label" id="label-today">Today</span>
  </div>
  <div class="stat-cell">
    <span class="stat-val" id="sum-final">—</span>
    <span class="stat-label">Final</span>
  </div>
</div>

<div id="loading"><div class="spinner"></div><p>Loading today's games…</p></div>
<div id="content" style="display:none"></div>

<script>
// ── CONFIG ───────────────────────────────────────────────────────
const LEAGUE_CFG = {
  NBA:  { url:'https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard'  },
  WNBA: { url:'https://site.api.espn.com/apis/site/v2/sports/basketball/wnba/scoreboard' },
  NFL:  { url:'https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard'    },
  MLB:  { url:'https://site.api.espn.com/apis/site/v2/sports/baseball/mlb/scoreboard'    },
  NHL:  { url:'https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/scoreboard'      },
};
const SKIP_SEASON = new Set([1, 4]);
const SOON_MIN = 90;
const BREAK_KW = ['halftime','half time','between innings','end of inning',
  'intermission','end of 1st','end of 2nd','end of 3rd','end of 4th','break'];

let allGames = [];
let activeLeagues = new Set(Object.keys(LEAGUE_CFG));
let autoTimer = null, cdTimer = null;
let viewingDate = 0; // 0 = today, 1 = tomorrow
let ufcMode = false;        // when true, main view shows the UFC card
let ufcEvents = [];         // fetched UFC events
let ufcEventIdx = 0;        // which event is being viewed
const UFC_URL = 'https://site.api.espn.com/apis/site/v2/sports/mma/ufc/scoreboard';

// ── DATE ─────────────────────────────────────────────────────────
function dateStr(offsetDays = 0) {
  const n = new Date();
  n.setDate(n.getDate() + offsetDays);
  return `${n.getFullYear()}${String(n.getMonth()+1).padStart(2,'0')}${String(n.getDate()).padStart(2,'0')}`;
}
function isViewingDay(iso) {
  const d = new Date(iso);
  const n = new Date();
  n.setDate(n.getDate() + viewingDate);
  return d.getFullYear()===n.getFullYear() && d.getMonth()===n.getMonth() && d.getDate()===n.getDate();
}

// ── FETCH ─────────────────────────────────────────────────────────
async function fetchLeague(key, cfg) {
  try {
    const r = await fetch(`${cfg.url}?dates=${dateStr(viewingDate)}`);
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    const st = d.season?.type?.id ?? d.leagues?.[0]?.season?.type?.id ?? 2;
    if (SKIP_SEASON.has(Number(st))) return [];
    return (d.events||[]).filter(ev=>isViewingDay(ev.date)).map(ev=>parseEvent(ev,key));
  } catch(e) { console.warn(key,e); return []; }
}

function parseEvent(ev, key) {
  const comp = ev.competitions?.[0]||{};
  const st   = ev.status||{};
  const stateType = st.type?.state||'pre';
  const stateDesc = st.type?.shortDetail||'';
  const clock = st.displayClock||'';
  const period = st.period||0;
  const competitors = comp.competitors||[];
  const home = competitors.find(c=>c.homeAway==='home')||competitors[0]||{};
  const away = competitors.find(c=>c.homeAway==='away')||competitors[1]||{};
  const startTime = new Date(ev.date);
  const diffMin = (startTime-Date.now())/60000;

  let bucket;
  if      (stateType==='in')              bucket='live';
  else if (stateType==='post')            bucket='final';
  else if (diffMin<=SOON_MIN&&diffMin>-5) bucket='soon';
  else                                    bucket='sched';

  const sit = comp.situation || {};

  const pt = c => {
    const t=c.team||{};
    return {
      abbr:  t.abbreviation||t.shortDisplayName||'?',
      logo:  t.logo||'',
      color: t.color?'#'+t.color:'#333',
      score: parseInt(c.score||0),
      record:c.records?.[0]?.summary||'',
    };
  };
  return {
    id:ev.id, league:key, bucket, stateType, stateDesc, clock, period, startTime, diffMin,
    home:pt(home), away:pt(away),
    sit: {
      onFirst:  sit.onFirst  || false,
      onSecond: sit.onSecond || false,
      onThird:  sit.onThird  || false,
      balls:    sit.balls    ?? null,
      strikes:  sit.strikes  ?? null,
      outs:     sit.outs     ?? null,
      batter:   sit.batter?.athlete?.shortName || sit.batter?.displayName || '',
      pitcher:  sit.pitcher?.athlete?.shortName || sit.pitcher?.displayName || '',
      lastPlay: sit.lastPlay?.text || '',
    }
  };
}

let lastFetchMs = 0;
let clockTimer = null;

function startLiveClock() {
  if (clockTimer) clearInterval(clockTimer);
  clockTimer = setInterval(tickClock, 1000);
  tickClock();
}

function tickClock() {
  document.getElementById('last-updated').textContent =
    new Date().toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});

  // Mark dot as stale if data is >90s old with live games, or >6min otherwise
  const age = Date.now() - lastFetchMs;
  const hasLive = allGames.some(g => g.bucket === 'live');
  const dot = document.getElementById('sync-dot');
  if (lastFetchMs === 0) return;
  if ((hasLive && age > 90000) || (!hasLive && age > 360000)) {
    dot.classList.add('stale');
    dot.classList.remove('live');
  } else if (hasLive) {
    dot.classList.add('live');
    dot.classList.remove('stale');
  } else {
    dot.classList.remove('live', 'stale');
  }
}

async function fetchAll() {
  const btn = document.getElementById('refresh-btn');
  btn.classList.add('spinning');
  const [results] = await Promise.all([
    Promise.all(Object.entries(LEAGUE_CFG).map(([k,c])=>fetchLeague(k,c))),
    fetchUFC(),
  ]);
  allGames = results.flat();
  lastFetchMs = Date.now();
  btn.classList.remove('spinning');

  // Reset dot to healthy
  const dot = document.getElementById('sync-dot');
  dot.classList.remove('stale');
  const hasLive = allGames.some(g => g.bucket === 'live');
  hasLive ? dot.classList.add('live') : dot.classList.remove('live');

  document.getElementById('loading').style.display='none';
  document.getElementById('content').style.display='block';
  const scrollY = window.scrollY;
  buildChips();
  if (ufcMode) renderUFC(); else render();
  // Restore scroll after the browser lays out the new content
  requestAnimationFrame(() => {
    window.scrollTo(0, scrollY);
    requestAnimationFrame(() => window.scrollTo(0, scrollY));
  });
  startCd();
  startLiveClock();

  // Only auto-refresh for today
  if (viewingDate === 0) {
    if (autoTimer) clearTimeout(autoTimer);
    const hasSoon = allGames.some(g => g.bucket === 'soon');
    const interval = hasLive ? 30000 : hasSoon ? 120000 : 300000;
    autoTimer = setTimeout(fetchAll, interval);
  }
}

// ── UFC ───────────────────────────────────────────────────────────
async function fetchUFC() {
  try {
    // Pull a window of events: past 2 weeks through next 6 weeks
    const today = new Date();
    const start = new Date(today); start.setDate(start.getDate() - 14);
    const end   = new Date(today); end.setDate(end.getDate() + 45);
    const fmt = d => `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
    const r = await fetch(`${UFC_URL}?dates=${fmt(start)}-${fmt(end)}`);
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    let events = (d.events || []).map(parseUFCEvent);
    // Fallback: if the range returned nothing, try the default scoreboard
    if (!events.length) {
      const r2 = await fetch(UFC_URL);
      const d2 = await r2.json();
      events = (d2.events || []).map(parseUFCEvent);
    }
    ufcEvents = events.sort((a,b) => a.date - b.date);
    const nowMs = Date.now();
    let idx = ufcEvents.findIndex(e => e.state === 'in');
    if (idx < 0) idx = ufcEvents.findIndex(e => e.date.getTime() > nowMs);
    if (idx < 0) idx = ufcEvents.length - 1;
    ufcEventIdx = Math.max(0, idx);
  } catch(e) { console.warn('UFC', e); ufcEvents = []; }
}

function parseUFCEvent(ev) {
  const comp = ev.competitions || [];
  const status = ev.status || comp[0]?.status || {};
  const state = status.type?.state || 'pre';
  // Each competition is a fight
  let fights = comp.map(c => {
    const cs = c.status || {};
    const competitors = c.competitors || [];
    const a = competitors[0] || {};
    const b = competitors[1] || {};
    const fName = (x) => x.athlete?.displayName || x.athlete?.shortName || '?';
    const fRec  = (x) => x.records?.[0]?.summary || '';
    const winner = competitors.find(x => x.winner);
    // ESPN sometimes tags the segment in c.type.text or c.cardSegment
    const rawSeg = (c.type?.text || c.cardSegment || c.notes?.[0]?.headline || '').toLowerCase();
    let seg = '';
    if (rawSeg.includes('early')) seg = 'Early Prelims';
    else if (rawSeg.includes('prelim')) seg = 'Prelims';
    else if (rawSeg.includes('main')) seg = 'Main Card';
    // Result method: ESPN scatters this across several fields. Check them all.
    const methodRaw =
      cs.result?.name ||
      cs.result?.displayName ||
      cs.result?.description ||
      winner?.status?.result?.displayName ||
      winner?.status?.result?.name ||
      c.notes?.find(n => /decision|submission|ko|tko|knockout/i.test(n.headline||''))?.headline ||
      cs.type?.description ||
      '';
    // Clean up common ESPN phrasings
    let method = methodRaw
      .replace(/^Final[:\s-]*/i,'')
      .replace(/via/i,'')
      .trim();
    const resultRound = cs.result?.period || winner?.status?.result?.period || cs.period || 0;
    const resultClock = cs.result?.displayClock || cs.result?.clock || winner?.status?.result?.displayClock || '';
    // A fight's state must come from ITS OWN status — don't inherit the event's
    // live state, or every fight looks live.
    const fightState = cs.type?.state || (winner ? 'post' : 'pre');
    return {
      id:     c.id || '',
      order:  c.order ?? 0,
      cardSeg: seg,
      weight: c.type?.abbreviation || c.type?.text || ev.weightClass || '',
      note:   c.note || '',
      state:  fightState,
      statusDetail: cs.type?.shortDetail || cs.type?.detail || '',
      round:  cs.period || 0,
      clock:  cs.displayClock || '',
      aId: a.athlete?.id || '', bId: b.athlete?.id || '',
      aName: fName(a), aRec: fRec(a), aWin: !!a.winner,
      bName: fName(b), bRec: fRec(b), bWin: !!b.winner,
      method, resultRound, resultClock,
      result: winner ? (method || 'Final') : '',
    };
  }).sort((x,y) => y.order - x.order); // main event (highest order) first

  // Bump records to reflect the result (ESPN records are usually pre-fight)
  const bumpRec = (rec, won) => {
    const m = /^(\d+)-(\d+)(?:-(\d+))?/.exec(rec || '');
    if (!m) return rec;
    let [_, w, l, d] = m;
    w = +w; l = +l; d = d != null ? +d : null;
    if (won) w += 1; else l += 1;
    return d != null ? `${w}-${l}-${d}` : `${w}-${l}`;
  };
  fights.forEach(f => {
    if (f.state === 'post' && (f.aWin || f.bWin)) {
      f.aRec = bumpRec(f.aRec, f.aWin);
      f.bRec = bumpRec(f.bRec, f.bWin);
    }
  });

  return {
    id: ev.id,
    name: ev.name || ev.shortName || 'UFC Event',
    shortName: ev.shortName || '',
    date: new Date(ev.date),
    state,
    statusDetail: status.type?.shortDetail || '',
    venue: comp[0]?.venue?.fullName || ev.venue?.fullName || '',
    location: [
      comp[0]?.venue?.address?.city,
      comp[0]?.venue?.address?.state,
      comp[0]?.venue?.address?.country
    ].filter(Boolean).join(', '),
    fights,
  };
}

// ── CHIPS ─────────────────────────────────────────────────────────
function buildChips() {
  const strip = document.getElementById('league-strip');
  const leagueKeys = Object.keys(LEAGUE_CFG);

  // Sort leagues: ones with games today first (by count desc), then empty ones
  const sorted = [...leagueKeys].sort((a, b) => {
    const aCount = allGames.filter(g => g.league === a).length;
    const bCount = allGames.filter(g => g.league === b).length;
    if (aCount === 0 && bCount === 0) return 0;
    if (aCount === 0) return 1;
    if (bCount === 0) return -1;
    return bCount - aCount;
  });

  const allKeys = ['ALL', ...sorted];

  const chipsHtml = allKeys.map(key => {
    const games  = key==='ALL' ? allGames : allGames.filter(g=>g.league===key);
    const liveN  = games.filter(g=>g.bucket==='live').length;
    const total  = games.length;
    const isActive = key==='ALL' ? activeLeagues.size===Object.keys(LEAGUE_CFG).length : activeLeagues.has(key);
    const isEmpty  = total === 0;

    const dot = liveN > 0 ? `<span class="chip-live-dot"></span>` : '';
    const countLabel = liveN > 0
      ? `<span class="chip-count"><span style="color:var(--red);font-weight:800">${liveN}</span><span style="color:rgba(255,255,255,0.3)">/${total}</span></span>`
      : total > 0 ? `<span class="chip-count">${total}</span>` : '';

    return `<div class="league-chip${isActive && !ufcMode?' active':''}${isEmpty?' empty':''}" data-league="${key}" onclick="toggleLeague(this)">
      ${dot}<span class="chip-name">${key}</span>${countLabel}
    </div>`;
  }).join('');

  // UFC chip at the end
  const liveEvent = ufcEvents.find(e => e.state === 'in');
  const ufcLive = !!liveEvent;
  let ufcCount = '';
  if (liveEvent) {
    const lf = liveEvent.fights.filter(f => f.state === 'in').length;
    const done = liveEvent.fights.filter(f => f.state === 'post').length;
    const tot = liveEvent.fights.length;
    const remaining = tot - done;
    ufcCount = `<span class="chip-count"><span style="color:var(--red);font-weight:800">${lf||'●'}</span><span style="color:rgba(255,255,255,0.3)">/${remaining}</span></span>`;
  } else if (ufcEvents.length) {
    ufcCount = `<span class="chip-count">${ufcEvents.length}</span>`;
  }
  const ufcDot = ufcLive ? `<span class="chip-live-dot"></span>` : '';
  const ufcChip = `<div class="league-chip${ufcMode?' active':''}${ufcEvents.length?'':' empty'}" data-league="UFC" onclick="toggleLeague(this)">
    ${ufcDot}<span class="chip-name">UFC</span>${ufcCount}
  </div>`;

  strip.innerHTML = chipsHtml + ufcChip;
}

// ── FILTER ────────────────────────────────────────────────────────
function toggleLeague(el) {
  const l = el.dataset.league;
  if (l === 'UFC') {
    ufcMode = true;
    buildChips();
    renderUFC();
    return;
  }
  // Any other chip exits UFC mode
  ufcMode = false;
  if (l==='ALL') {
    const allOn = activeLeagues.size===Object.keys(LEAGUE_CFG).length;
    allOn ? activeLeagues.clear() : Object.keys(LEAGUE_CFG).forEach(k=>activeLeagues.add(k));
  } else {
    activeLeagues.has(l) ? activeLeagues.delete(l) : activeLeagues.add(l);
  }
  buildChips();
  render();
}

// ── RENDER ────────────────────────────────────────────────────────
function render() {
  // Restore Live-mode chrome (may have been hidden by UFC mode)
  const dt = document.querySelector('.date-toggle'); if (dt) dt.style.display = '';
  const ss = document.querySelector('.status-strip'); if (ss) ss.style.display = '';

  const f = allGames.filter(g=>activeLeagues.has(g.league));
  const ord = ['NBA','WNBA','NFL','MLB','NHL'];
  const byL = (a,b)=>ord.indexOf(a.league)-ord.indexOf(b.league);

  // Live: newest start first (most time remaining)
  const live  = f.filter(g=>g.bucket==='live').sort((a,b)=>b.startTime-a.startTime);
  // Soon: soonest first
  const soon  = f.filter(g=>g.bucket==='soon').sort((a,b)=>a.diffMin-b.diffMin);
  const sched = f.filter(g=>g.bucket==='sched').sort((a,b)=>a.startTime-b.startTime);
  const final = f.filter(g=>g.bucket==='final').sort(byL);

  document.getElementById('sum-live').textContent  = live.length  || '0';
  document.getElementById('sum-soon').textContent  = soon.length  || '0';
  document.getElementById('sum-today').textContent = (live.length+soon.length+sched.length) || '0';
  document.getElementById('sum-final').textContent = final.length || '0';

  const liveEl = document.getElementById('sum-live');
  const isTmrw = viewingDate === 1;
  if (isTmrw) {
    liveEl.classList.remove('glowing');
    liveEl.style.opacity = '0.3';
  } else {
    liveEl.style.opacity = '';
    live.length > 0 ? liveEl.classList.add('glowing') : liveEl.classList.remove('glowing');
  }

  const out = document.getElementById('content');

  if (!f.length) {
    out.innerHTML = '<div class="empty">No games today for selected leagues.</div>';
    document.getElementById('insight-bar').style.display = 'none';
    return;
  }

  renderInsight(f);
  let html = '';

  // Update labels based on viewing date
  document.getElementById('label-live').textContent  = isTmrw ? 'Scheduled' : 'Live';
  document.getElementById('label-soon').textContent  = isTmrw ? 'Early'     : 'Soon';
  document.getElementById('label-today').textContent = isTmrw ? 'Tomorrow'  : 'Today';

  if (live.length)  html += section('live',  isTmrw ? 'Scheduled'      : 'Live',          live,  liveRow);
  if (soon.length)  html += section('soon',  isTmrw ? 'Early Games'    : 'Starting Soon', soon,  soonRow);
  if (sched.length) html += section('sched', isTmrw ? 'Later Tomorrow' : 'Later Today',   sched, schedRow);
  if (final.length) html += section('final', 'Final',                                     final, finalRow);
  out.innerHTML = html;
}

// ── UFC RENDER ────────────────────────────────────────────────────
function renderUFC() {
  // Hide the Live-only chrome, show the card
  document.getElementById('insight-bar').style.display = 'none';
  document.querySelector('.date-toggle').style.display = 'none';
  document.querySelector('.status-strip').style.display = 'none';

  const out = document.getElementById('content');
  out.style.display = 'block';

  if (!ufcEvents.length) {
    out.innerHTML = '<div class="empty">No UFC events found right now.</div>';
    return;
  }

  const ev = ufcEvents[ufcEventIdx];
  const nowMs = Date.now();
  const isLive = ev.state === 'in';
  const isDone = ev.state === 'post';
  const startMs = ev.date.getTime();

  // Event nav (between events)
  const canPrev = ufcEventIdx > 0;
  const canNext = ufcEventIdx < ufcEvents.length - 1;
  const nav = `
    <div class="ufc-nav">
      <button class="ufc-navbtn" ${canPrev?'':'disabled'} onclick="ufcNav(-1)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="ufc-nav-count">${ufcEventIdx+1} / ${ufcEvents.length}</div>
      <button class="ufc-navbtn" ${canNext?'':'disabled'} onclick="ufcNav(1)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>`;

  // Status / countdown line
  let statusLine;
  if (isLive) {
    statusLine = `<span class="ufc-live-badge">● LIVE NOW</span>`;
  } else if (isDone) {
    statusLine = `<span class="ufc-done-badge">FINAL</span>`;
  } else {
    statusLine = `<span class="ufc-cd" data-start="${startMs}">--:--:--</span>`;
  }

  const dateStr = ev.date.toLocaleDateString([], {weekday:'short', month:'short', day:'numeric'});
  const timeStr = ev.date.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});

  // Fight counts — remaining (live + upcoming) out of total, matching live-sports feel
  const totalFights = ev.fights.length;
  const doneFights  = ev.fights.filter(f => f.state === 'post').length;
  const liveFights  = ev.fights.filter(f => f.state === 'in').length;
  const remaining   = totalFights - doneFights;
  const countHtml = liveFights > 0
    ? `<span class="ufc-count"><span style="color:var(--red);font-weight:900">${liveFights} LIVE</span> · ${remaining} of ${totalFights} left</span>`
    : doneFights === totalFights
    ? `<span class="ufc-count">All ${totalFights} fights final</span>`
    : `<span class="ufc-count">${remaining} of ${totalFights} fights left</span>`;

  // Fights already sorted main-event-first — just list them in order
  // Live fights float to the top; the rest keep their card order
  const orderedFights = [...ev.fights].map((f, i) => ({ f, i }))
    .sort((a, b) => {
      const aLive = a.f.state === 'in' ? 0 : 1;
      const bLive = b.f.state === 'in' ? 0 : 1;
      if (aLive !== bLive) return aLive - bLive;
      return a.i - b.i;
    });
  const fightRows = orderedFights.map(({ f, i }) => ufcFightRow(f, ufcEventIdx, i)).join('');

  out.innerHTML = `
    <div class="ufc-header">
      ${nav}
      <div class="ufc-title">${ev.name}</div>
      <div class="ufc-meta">
        ${statusLine}
        <span class="ufc-when">${dateStr} · ${timeStr} ET</span>
      </div>
      ${countHtml ? `<div class="ufc-countline">${countHtml}</div>` : ''}
      ${ev.location ? `<div class="ufc-loc">${ev.venue}${ev.location?' · '+ev.location:''}</div>` : ''}
    </div>
    <div class="ufc-search-wrap">
      <svg class="ufc-search-ico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="ufc-search" class="ufc-search" type="text" placeholder="Search fighter…" oninput="filterFights(this.value)" value="${window._ufcSearch||''}">
    </div>
    <div class="ufc-fights">${fightRows}</div>`;

  startUFCCd();

  // Re-open the previously expanded fight (survives auto-refresh)
  if (window._ufcOpenFight) {
    const row = [...document.querySelectorAll('.ufc-fight.tappable')].find(r =>
      r.getAttribute('onclick')?.includes(`'${window._ufcOpenFight}'`));
    if (row) {
      const detId = row.querySelector('.ufc-fdetail')?.id;
      row.classList.add('expanded');
      const el = document.getElementById(detId);
      if (el) {
        el.classList.add('open');
        getFightStats(ev.id, window._ufcOpenFight)
          .then(s => { el.innerHTML = renderFightStats(s); })
          .catch(() => { el.innerHTML = `<div class="ufc-fd-loading">Stats not posted.</div>`; });
      }
    }
  }
  // Re-apply any active search filter
  if (window._ufcSearch) filterFights(window._ufcSearch);

  // Enrich finished fights with the real method (R1 KO etc.) from the core API
  enrichUFCMethods(ev);
}

async function enrichUFCMethods(ev) {
  const done = ev.fights.filter(f => f.state === 'post' && f.id);
  for (const f of done) {
    const badge = document.getElementById(`method-${f.id}`);
    if (!badge) continue;
    // Skip if we already have a good method (not just "Final")
    if (badge.textContent && badge.textContent !== 'Final' && /KO|TKO|Sub|Dec|DQ/i.test(badge.textContent)) continue;
    try {
      const data = await getFightStats(ev.id, f.id);
      const bits = [];
      let m = (data.method || '').replace(/^Final[:\s-]*/i,'').replace(/\bvia\b/i,'').trim();
      // Normalize ESPN's raw method strings into clean labels
      const ml = m.toLowerCase().replace(/[-_]+/g,' ').replace(/\s+/g,' ').trim();
      if (/ko\s*tko|kotko|knockout|technical knockout|tko/.test(ml)) m = 'KO/TKO';
      else if (/submission|sub\b|tapout/.test(ml)) m = 'Submission';
      else if (/decision/.test(ml)) {
        if (/unanimous/.test(ml)) m = 'Unanimous Decision';
        else if (/split/.test(ml)) m = 'Split Decision';
        else if (/majority/.test(ml)) m = 'Majority Decision';
        else m = 'Decision';
      }
      else if (/dq|disqualif/.test(ml)) m = 'DQ';
      else if (/no contest|nc\b/.test(ml)) m = 'No Contest';
      else if (/draw/.test(ml)) m = 'Draw';
      else if (m) m = m.replace(/\b\w/g, c => c.toUpperCase()); // Title Case fallback
      if (m) bits.push(m);
      if (data.mRound) bits.push(`R${data.mRound}`);
      if (data.mClock && data.mClock !== '0:00' && !/decision/i.test(m)) bits.push(data.mClock);
      if (bits.length) {
        const el = document.getElementById(`method-${f.id}`);
        if (el) el.textContent = bits.join(' · ');
      }
    } catch(_) {}
  }
}

function filterFights(q) {
  window._ufcSearch = q;
  const term = q.trim().toLowerCase();
  document.querySelectorAll('.ufc-fight').forEach(row => {
    const names = [...row.querySelectorAll('.ufc-f-name')].map(n => n.textContent.toLowerCase()).join(' ');
    row.style.display = (!term || names.includes(term)) ? '' : 'none';
  });
}

function ufcFightRow(f, evIdx, fIdx) {
  const live  = f.state === 'in';
  const done  = f.state === 'post';
  const aWin = f.aWin, bWin = f.bWin;

  let statusHtml;
  if (live) {
    // Prefer explicit round+clock; fall back to the status detail text (e.g. "Round 2")
    const rc = (f.round ? `R${f.round}` : '') + (f.clock ? ` ${f.clock}` : '');
    const liveDetail = rc.trim() || f.statusDetail || 'In progress';
    statusHtml = `<div class="ufc-fstatus"><span class="ufc-fstatus-live">● LIVE</span><span class="ufc-fstatus-detail">${liveDetail}</span></div>`;
  } else if (done) {
    // Show method + round + time if we have it (from scoreboard; enriched later from core API)
    const methodBits = [];
    if (f.method && f.method !== 'Final') methodBits.push(f.method);
    if (f.resultRound) methodBits.push(`R${f.resultRound}`);
    if (f.resultClock) methodBits.push(f.resultClock);
    const methodStr = methodBits.length ? methodBits.join(' · ') : 'Final';
    statusHtml = `<div class="ufc-fstatus"><span class="ufc-fstatus-done" id="method-${f.id}">${methodStr}</span></div>`;
  } else {
    statusHtml = '';
  }

  const canExpand = f.id && (done || live);
  const detailId = `ufcd-${evIdx}-${fIdx}`;

  return `<div class="ufc-fight${live?' live':''}${done?' done':''}${canExpand?' tappable':''}"
       ${canExpand?`onclick="toggleFightDetail('${f.id}','${detailId}',this)"`:''}>
    <div class="ufc-f-main">
      ${f.weight?`<div class="ufc-f-weight-top">${f.weight}</div>`:''}
      <div class="ufc-f-fighters">
        <div class="ufc-f-line${aWin?' win':''}${done&&!aWin?' loss':''}">
          <span class="ufc-f-name">${f.aName}</span>
          ${f.aRec?`<span class="ufc-f-rec">${f.aRec}</span>`:''}
          ${aWin?`<span class="ufc-f-w">W</span>`:''}
          ${f.aId?`<a class="ufc-f-link" href="https://www.espn.com/mma/fighter/_/id/${f.aId}" target="_blank" rel="noopener" onclick="event.stopPropagation()" aria-label="ESPN profile">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14 21 3"/></svg>
          </a>`:''}
        </div>
        <div class="ufc-f-vs">vs</div>
        <div class="ufc-f-line${bWin?' win':''}${done&&!bWin?' loss':''}">
          <span class="ufc-f-name">${f.bName}</span>
          ${f.bRec?`<span class="ufc-f-rec">${f.bRec}</span>`:''}
          ${bWin?`<span class="ufc-f-w">W</span>`:''}
          ${f.bId?`<a class="ufc-f-link" href="https://www.espn.com/mma/fighter/_/id/${f.bId}" target="_blank" rel="noopener" onclick="event.stopPropagation()" aria-label="ESPN profile">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14 21 3"/></svg>
          </a>`:''}
        </div>
      </div>
      ${(statusHtml || canExpand) ? `<div class="ufc-f-right">${statusHtml}${canExpand?`<span class="ufc-f-chev">▾</span>`:''}</div>` : ''}
    </div>
    <div class="ufc-fdetail" id="${detailId}"></div>
  </div>`;
}

// Cache event competition data
const _ufcDetailCache = {};

async function toggleFightDetail(fightId, detailId, rowEl) {
  const el = document.getElementById(detailId);
  if (!el) return;
  const isOpen = el.classList.contains('open');
  document.querySelectorAll('.ufc-fdetail.open').forEach(d => { d.classList.remove('open'); d.innerHTML=''; });
  document.querySelectorAll('.ufc-fight.expanded').forEach(r => r.classList.remove('expanded'));
  if (isOpen) { window._ufcOpenFight = null; return; }

  window._ufcOpenFight = fightId;
  rowEl.classList.add('expanded');
  el.classList.add('open');
  el.innerHTML = `<div class="ufc-fd-loading">Loading fight stats…</div>`;

  try {
    const evId = ufcEvents[ufcEventIdx]?.id;
    const stats = await getFightStats(evId, fightId);
    el.innerHTML = renderFightStats(stats);
  } catch(e) {
    el.innerHTML = `<div class="ufc-fd-loading">Stats not posted for this fight.</div>`;
  }
}

// Walk core API: event → competitions → competitors → statistics ($ref links)
async function getFightStats(eventId, fightId) {
  const cacheKey = `${eventId}:${fightId}`;
  if (_ufcDetailCache[cacheKey]) return _ufcDetailCache[cacheKey];

  const base = 'https://sports.core.api.espn.com/v2/sports/mma/leagues/ufc';
  // 1. Get the event, which lists competitions
  const evRes = await fetch(`${base}/events/${eventId}?lang=en&region=us`);
  const evData = await evRes.json();

  // competitions is either inline array or a $ref collection
  let comps = evData.competitions;
  if (comps && comps.$ref) {
    const cr = await fetch(fixUrl(comps.$ref));
    comps = (await cr.json()).items || [];
  }
  comps = comps || [];

  // 2. Find our fight (competition)
  let comp = comps.find(c => String(c.id) === String(fightId));
  if (!comp && comps[0]?.$ref) {
    // competitions came as refs — fetch each to find the id
    for (const ref of comps) {
      const cr = await fetch(fixUrl(ref.$ref));
      const cd = await cr.json();
      if (String(cd.id) === String(fightId)) { comp = cd; break; }
    }
  }
  if (!comp) throw new Error('fight not found');

  // Pull the fight result method (KO/Sub/Decision) + round + time from the status ref
  let method = '', mRound = 0, mClock = '';
  try {
    let status = comp.status;
    if (status?.$ref) status = await (await fetch(fixUrl(status.$ref))).json();
    if (status) {
      mRound = status.period || 0;
      mClock = status.displayClock || '';
      // result can be inline or a ref
      let res = status.result || comp.result;
      if (res?.$ref) res = await (await fetch(fixUrl(res.$ref))).json();
      if (res) {
        method = res.name || res.displayName || res.description
              || res.type?.displayName || res.type?.description || '';
        mRound = res.period || mRound;
        mClock = res.displayClock || res.clock || mClock;
      }
    }
  } catch(_) {}

  // 3. Competitors → statistics
  let competitors = comp.competitors || [];
  const out = [];
  for (const cptr of competitors) {
    const c = cptr.$ref ? await (await fetch(fixUrl(cptr.$ref))).json() : cptr;
    const name = c.athlete?.$ref
      ? (await (await fetch(fixUrl(c.athlete.$ref))).json()).displayName
      : (c.athlete?.displayName || 'Fighter');
    let stats = {};
    if (c.statistics?.$ref) {
      const sd = await (await fetch(fixUrl(c.statistics.$ref))).json();
      stats = flattenStats(sd);
    } else if (c.statistics) {
      stats = flattenStats(c.statistics);
    }
    out.push({ name, winner: !!c.winner, stats });
  }

  const result = { competitors: out, method, mRound, mClock };
  _ufcDetailCache[cacheKey] = result;
  return result;
}

function fixUrl(u) { return u.replace(/^http:/, 'https:'); }

// Flatten ESPN statistics splits/categories into { statName: displayValue }
function flattenStats(sd) {
  const flat = {};
  const cats = sd.splits?.categories || sd.categories || [];
  cats.forEach(cat => {
    (cat.stats || []).forEach(s => {
      if (s.name) flat[s.name] = s.displayValue ?? s.value;
    });
  });
  return flat;
}

function renderFightStats(data) {
  const c = data.competitors || [];
  if (c.length < 2) return `<div class="ufc-fd-loading">No stats posted yet.</div>`;
  const [a, b] = c;

  const statMap = [
    ['sigStrikesLanded', 'Sig. Strikes'],
    ['significantStrikesLanded', 'Sig. Strikes'],
    ['totalStrikesLanded', 'Total Strikes'],
    ['takedownsLanded', 'Takedowns'],
    ['takedowns', 'Takedowns'],
    ['submissions', 'Sub. Attempts'],
    ['submissionAttempts', 'Sub. Attempts'],
    ['knockDowns', 'Knockdowns'],
    ['knockdowns', 'Knockdowns'],
    ['timeInControl', 'Control Time'],
    ['controlTime', 'Control Time'],
    ['takedownControlTime', 'Control Time'],
    ['groundControlTime', 'Control Time'],
  ];
  const seen = new Set();
  const rows = [];
  statMap.forEach(([key,label]) => {
    if (seen.has(label)) return;
    const av = a.stats[key], bv = b.stats[key];
    if (av != null || bv != null) {
      seen.add(label);
      // Parse numeric part for comparison (handles "13", "2:34", "45%")
      const num = v => {
        if (v == null) return -1;
        const s = String(v);
        if (s.includes(':')) { const [m,sec] = s.split(':').map(Number); return m*60+(sec||0); }
        const n = parseFloat(s.replace(/[^\d.]/g,''));
        return isNaN(n) ? -1 : n;
      };
      const na = num(av), nb = num(bv);
      const aHi = na > nb, bHi = nb > na;
      rows.push(`<div class="ufc-stat-row">
        <span class="ufc-stat-a"><span class="sv${aHi?' hi':''}">${av ?? '—'}</span></span>
        <span class="ufc-stat-label">${label}</span>
        <span class="ufc-stat-b"><span class="sv${bHi?' hi':''}">${bv ?? '—'}</span></span>
      </div>`);
    }
  });

  if (!rows.length) {
    const keys = Object.keys(a.stats).slice(0,12).join(', ') || '(none)';
    return `<div class="ufc-debug"><div class="ufc-debug-t">stat keys</div><div>${keys}</div></div>`;
  }

  return `
    <div class="ufc-fd-head">
      <span class="ufc-fd-name${a.winner?' win':''}">${a.name}${a.winner?'<span class="ufc-fd-w">W</span>':''}</span>
      <span class="ufc-fd-vs">vs</span>
      <span class="ufc-fd-name${b.winner?' win':''}">${b.winner?'<span class="ufc-fd-w">W</span>':''}${b.name}</span>
    </div>
    ${rows.join('')}`;
}

// ── ACTION TIMELINE ──────────────────────────────────────────────
const HALF_OFFSET = { MLB:0.45, WNBA:0.48, NBA:0.48, NFL:0.48, NHL:0.48 };

function renderInsight(games) {
  const bar = document.getElementById('insight-bar');
  const nowMs = Date.now();

  const fmtHour = ms => {
    const h = new Date(ms).getHours();
    const ampm = h >= 12 ? 'P' : 'A';
    return `${h % 12 || 12}${ampm}`;
  };
  const fmtTime = ms => {
    const d = new Date(ms);
    const rounded = Math.round(d.getMinutes()/10)*10;
    d.setMinutes(rounded,0,0);
    const h = d.getHours(), m = String(d.getMinutes()).padStart(2,'0');
    const ampm = h>=12?'PM':'AM', h12 = h%12||12;
    return m==='00'?`${h12} ${ampm}`:`${h12}:${m} ${ampm}`;
  };

  // Compute "action moments": each game's 2nd-half time + live high-value now
  const upcoming = viewingDate === 0
    ? games.filter(g => g.bucket === 'sched' || g.bucket === 'soon')
    : games.filter(g => g.bucket !== 'final');

  const moments = []; // { ms, g }
  upcoming.forEach(g => {
    const halfMs = (HALF_OFFSET[g.league]||0.48) * (AVG_DURATION[g.league]||150) * 60000;
    const halfTime = g.startTime.getTime() + halfMs;
    if (viewingDate === 1 || halfTime > nowMs) moments.push({ ms: halfTime, g });
  });

  // Live high-value happening right now
  const liveHot = viewingDate === 0
    ? games.filter(g => g.bucket === 'live' && highValueLabel(g))
    : [];
  liveHot.forEach(g => moments.push({ ms: nowMs, g, live:true }));

  // Live games NOT yet high-value: project when they'll hit late/close window
  if (viewingDate === 0) {
    games.filter(g => g.bucket === 'live' && !highValueLabel(g)).forEach(g => {
      const dur = AVG_DURATION[g.league] || 150;
      const estStart = nowMs - Math.max(0, g.period-1) * dur/4 * 60000;
      // "crunch time" ~75% through the game
      const crunchTime = estStart + dur * 0.72 * 60000;
      if (crunchTime > nowMs) moments.push({ ms: crunchTime, g, projected:true });
    });
  }

  if (!moments.length) { bar.style.display='none'; return; }

  const momentTimes = moments.map(m => m.ms);
  const minMs = viewingDate === 0 ? Math.min(...momentTimes, nowMs) : Math.min(...momentTimes);
  const maxMs = Math.max(...momentTimes);
  const SLOT = 30 * 60000; // 30-min bins for the wave shape
  const startSlot = Math.floor(minMs / SLOT) * SLOT;
  const endSlot   = Math.ceil((maxMs + SLOT) / SLOT) * SLOT;

  // Bin into 30-min slots
  const slots = [];
  for (let t = startSlot; t < endSlot; t += SLOT) {
    const inSlot = moments.filter(m => m.ms >= t && m.ms < t + SLOT);
    slots.push({ t, count: inSlot.length, moments: inSlot });
  }

  const maxCount = Math.max(...slots.map(s => s.count), 1);
  const peakSlot = slots.reduce((a,b) => b.count > a.count ? b : a, slots[0]);

  // Identify peak clusters. Starts at a busy slot; continues only while adjacent
  // slots STAY meaningfully busy. A single quiet dip ends the cluster.
  const avg = slots.reduce((s,x)=>s+x.count,0) / slots.length;
  const startThresh = Math.max(3, avg * 1.4);
  const contThresh  = Math.max(3, startThresh * 0.6);
  const clusters = [];
  let run = null;
  slots.forEach((s,i) => {
    if (!run) {
      if (s.count >= startThresh) { run = { startI:i, endI:i, peak:s.count }; clusters.push(run); }
    } else if (s.count >= contThresh) {
      run.endI = i;
      run.peak = Math.max(run.peak, s.count);
    } else {
      run = null;
      if (s.count >= startThresh) { run = { startI:i, endI:i, peak:s.count }; clusters.push(run); }
    }
  });

  const fmtRange = (t0, t1) => {
    const r = ms => {
      const d = new Date(ms);
      const h = d.getHours(), mn = d.getMinutes();
      const ampm = h>=12?'p':'a', h12 = h%12||12;
      return mn===0 ? `${h12}${ampm}` : `${h12}:${String(mn).padStart(2,'0')}${ampm}`;
    };
    const a = r(t0), b = r(t1);
    return a === b ? a : `${a}-${b}`;
  };

  // Build bars — two-tone
  const barsHtml = slots.map((s,i) => {
    const pct = s.count / maxCount;
    const height = s.count === 0 ? 10 : 24 + pct * 76;
    const isNow = nowMs >= s.t && nowMs < s.t + SLOT;
    const inCluster = clusters.some(c => i >= c.startI && i <= c.endI);
    const cls = inCluster ? 'bright' : s.count > 0 ? 'mid' : 'low';
    // Show count only on cluster bars with 2+ games
    const countLabel = (inCluster && s.count >= 2) ? `<div class="tl-bcount">${s.count}</div>` : '';
    return `<div class="tl-slot ${cls}${isNow?' now':''}" data-slot="${i}" onclick="showSlot(${i})">
      ${countLabel}
      <div class="tl-bar" style="height:${height}px"></div>
    </div>`;
  }).join('');

  // Cluster labels — centered under each peak run
  const labelsHtml = clusters.map(c => {
    const centerPct = ((c.startI + c.endI + 1) / 2 / slots.length) * 100;
    // Compact: just the start hour of the window
    const d = new Date(slots[c.startI].t);
    const h = d.getHours(), mn = d.getMinutes();
    const ampm = h>=12?'p':'a', h12 = h%12||12;
    const label = mn===0 ? `${h12}${ampm}` : `${h12}:${String(mn).padStart(2,'0')}${ampm}`;
    return `<div class="tl-clabel" style="left:${centerPct}%">${label}</div>`;
  }).join('');

  // Hour ticks along the bottom (every 2 hours)
  const fmtTick = ms => {
    const h = new Date(ms).getHours();
    return `${h%12||12}${h>=12?'p':'a'}`;
  };
  const ticksHtml = slots.map((s,i) => {
    const d = new Date(s.t);
    const showTick = d.getMinutes() === 0 && d.getHours() % 2 === 0;
    return `<div class="tl-tick">${showTick ? fmtTick(s.t) : ''}</div>`;
  }).join('');

  // Peak callout
  const peakGames = peakSlot.count;
  const byL = {};
  peakSlot.moments.forEach(m => { (byL[m.g.league]||=[]).push(m.g); });
  const leagueParts = Object.entries(byL).map(([l,gs]) => `${gs.length} ${l}`).join(' · ');

  window._tlSlots = slots;

  const headerLabel = viewingDate === 1 ? "Tomorrow's busiest" : 'Busiest window';
  const peakTimes = peakSlot.moments.map(m => m.ms).sort((a,b)=>a-b);
  const roundLabel = (ms, withAmPm=true) => {
    const d = new Date(ms);
    d.setMinutes(Math.round(d.getMinutes()/10)*10, 0, 0);
    const h = d.getHours(), mn = String(d.getMinutes()).padStart(2,'0');
    const ampm = h>=12?'PM':'AM', h12 = h%12||12;
    const base = mn==='00' ? `${h12}` : `${h12}:${mn}`;
    return withAmPm ? `${base} ${ampm}` : base;
  };
  let peakLabel = '';
  if (peakTimes.length) {
    const first = roundLabel(peakTimes[0], false);
    const last  = roundLabel(peakTimes[peakTimes.length-1]);
    peakLabel = first === last.replace(/ [AP]M/,'') ? last : `${first}–${last}`;
  }

  bar.style.display = 'block';

  // How much action is happening RIGHT NOW?
  const liveHotCount = moments.filter(m => m.live).length;
  const nowSlotIdx = slots.findIndex(s => nowMs >= s.t && nowMs < s.t + SLOT);
  const nowSlotCount = nowSlotIdx >= 0 ? slots[nowSlotIdx].count : 0;
  const isPeakNow = viewingDate === 0 && (liveHotCount >= 2 || nowSlotCount >= maxCount * 0.8);

  const fmtSpan = ms => {
    const d = new Date(ms);
    const h = d.getHours(), mn = d.getMinutes();
    const ampm = h>=12?'PM':'AM', h12 = h%12||12;
    return mn===0 ? `${h12} ${ampm}` : `${h12}:${String(mn).padStart(2,'0')} ${ampm}`;
  };

  // Windows in chronological order for display
  const chronoWindows = clusters.map(c => {
    const t0 = slots[c.startI].t;
    const t1 = slots[c.endI].t + SLOT;
    return { t0, t1, peak: c.peak, label: `${fmtSpan(t0).replace(/ [AP]M/,'')}–${fmtSpan(t1)}` };
  });

  let cbTitle, cbSub, cbState = 'green';
  const dayWord = viewingDate === 1 ? 'tomorrow' : 'today';

  if (isPeakNow) {
    cbState = 'red';
    cbTitle = liveHotCount > 0 ? `Action is live now` : `Peak window now`;
    cbSub = liveHotCount > 0
      ? `${liveHotCount} game${liveHotCount>1?'s':''} in high-value spots right now`
      : `Multiple games in their 2nd half now`;
    const ahead = chronoWindows.filter(w => w.t0 > nowMs);
    if (ahead.length) cbSub += ` · next ${ahead[0].label}`;
  } else if (chronoWindows.length >= 1) {
    // Consolidate to one overall span: start of first window → end of last
    const spanStart = chronoWindows[0].t0;
    const spanEnd   = chronoWindows[chronoWindows.length-1].t1;
    const spanLabel = `${fmtSpan(spanStart).replace(/ [AP]M/,'')}–${fmtSpan(spanEnd)}`;
    const totalPeak = chronoWindows.reduce((n,w) => n + w.peak, 0);
    cbTitle = viewingDate === 1 ? `Action ${spanLabel}` : `Come back ${spanLabel}`;
    cbSub = chronoWindows.length > 1
      ? `${chronoWindows.length} busy windows ${dayWord} · tap a bar for games`
      : `Peak action ${dayWord} · tap a bar for games`;
  } else if (viewingDate === 0 && liveHotCount === 0 && moments.some(m => m.g.bucket==='live')) {
    cbState = 'amber';
    const liveGames = [...new Set(moments.filter(m => m.g.bucket==='live').map(m=>m.g.id))].length;
    cbTitle = `Winding down`;
    cbSub = `${liveGames} game${liveGames>1?'s':''} left ${dayWord} — light action`;
  } else {
    cbTitle = `Games spread through the ${viewingDate===1?'day tomorrow':'day'}`;
    cbSub = `No big clusters — tap a bar to see what's on`;
  }

  const stateColors = {
    red:   ['var(--red)', 'rgba(255,59,59,0.1)', 'rgba(255,59,59,0.25)'],
    amber: ['var(--amber)', 'rgba(245,166,35,0.1)', 'rgba(245,166,35,0.25)'],
    green: ['var(--green)', 'rgba(39,192,113,0.1)', 'rgba(39,192,113,0.2)'],
  };
  const [iconColor, iconBg, iconBorder] = stateColors[cbState];

  window._tlSlots = slots;
  window._tlSlotPos = -1;

  const hasNav = slots.some(s => s.count > 0);
  const leftArrow = hasNav ? `
    <button class="tl-arrow tl-arrow-l" onclick="cycleWindow(-1)" aria-label="Previous">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>` : '';
  const rightArrow = hasNav ? `
    <button class="tl-arrow tl-arrow-r" onclick="cycleWindow(1)" aria-label="Next">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>` : '';

  bar.innerHTML = `
    <div class="tl-cb-header">
      <div class="tl-cb-icon" style="background:${iconBg};border-color:${iconBorder}">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="${iconColor}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
        </svg>
      </div>
      <div class="tl-cb-text">
        <div class="tl-cb-title">${cbTitle}</div>
        <div class="tl-cb-sub">${cbSub}</div>
      </div>
    </div>
    <div class="tl-chart-row">
      ${leftArrow}
      <div class="tl-chart-inner">
        <div class="tl-chart">${barsHtml}</div>
        <div class="tl-labels">${labelsHtml}</div>
      </div>
      ${rightArrow}
    </div>
    <div id="tl-detail" class="tl-detail"></div>`;
}

function cycleWindow(dir) {
  const slots = window._tlSlots || [];
  // All slots that have games
  const gameSlots = slots.map((s,i) => ({s,i})).filter(x => x.s.count > 0);
  if (!gameSlots.length) return;
  let pos = window._tlSlotPos ?? -1;
  pos += dir;
  if (pos < 0) pos = gameSlots.length - 1;
  if (pos >= gameSlots.length) pos = 0;
  window._tlSlotPos = pos;
  showSlot(gameSlots[pos].i);
}

function showSlot(i) {
  const slots = window._tlSlots || [];
  const s = slots[i];
  const detail = document.getElementById('tl-detail');
  if (!s || !s.count) { detail.innerHTML=''; detail.classList.remove('open'); return; }

  document.querySelectorAll('.tl-slot').forEach((el,idx) => el.classList.toggle('sel', idx===i));

  const fmtTime = ms => {
    const d = new Date(ms);
    const rounded = Math.round(d.getMinutes()/10)*10;
    d.setMinutes(rounded,0,0);
    const h = d.getHours(), m = String(d.getMinutes()).padStart(2,'0');
    return `${h%12||12}:${m}`;
  };
  const rows = s.moments
    .sort((a,b) => a.ms - b.ms)
    .map(m => {
      const g = m.g;
      const tag = m.live ? highValueLabel(g) : m.projected ? 'crunch time' : '2nd half';
      return `<div class="tl-drow"><span class="tl-dleague">${g.league}</span> <span class="tl-dteam">${g.away.abbr}/${g.home.abbr}</span> <span class="tl-dtime">${tag} ~${fmtTime(m.ms)}</span></div>`;
    }).join('');
  detail.innerHTML = rows;
  detail.classList.add('open');
}

function diamondSvg(sit, size=36) {

  const off = size * 0.3;

    ${base(C,      off,      sit.onSecond)}

    ${base(off,    C,        sit.onThird)}
    ${base(C,      S-off,    false)}
  </svg>`;
}

// ── HIGH VALUE DETECTION ──────────────────────────────────────────
function highValueLabel(g) {
  if (g.stateType !== 'in') return null;
  const desc = (g.stateDesc || '').toLowerCase();
  const period = g.period || 0;
  const diff = Math.abs(g.away.score - g.home.score);
  const tied  = diff === 0;
  const close = g.league === 'MLB'  ? diff <= 1 :
                g.league === 'NHL'  ? diff <= 1 :
                g.league === 'NFL'  ? diff <= 7 :
                diff <= 5; // NBA/WNBA

  // Overtime / extra innings — must be explicit
  if (g.league === 'MLB' && period > 9) return 'Extra Innings';
  if (['NBA','WNBA'].includes(g.league) && period > 4) return 'OT';
  if (g.league === 'NHL' && period > 3) return 'OT';
  if (g.league === 'NFL' && period > 4) return 'OT';

  // MLB — 5th inning and beyond
  if (g.league === 'MLB') {
    const sit = g.sit || {};
    const runnersOn = sit.onFirst || sit.onSecond || sit.onThird;
    const scoringPos = sit.onSecond || sit.onThird;
    const outs = sit.outs ?? null;
    const highLeverage = runnersOn && (outs === 2 || scoringPos);

    if (period >= 9) return tied ? 'Tied Late' : close ? 'Close Late' : null;
    if (period >= 7) {
      if (tied && highLeverage) return 'Tied + Runners';
      if (tied) return 'Tied';
      if (close && highLeverage) return 'Close + Runners';
      if (close) return 'Close Game';
      return null;
    }
    if (period >= 5) {
      if (tied && highLeverage) return 'Tied + Runners';
      if (close && scoringPos && outs === 2) return 'Close + 2 Outs';
      return null;
    }
    return null;
  }

  if (['NBA','WNBA'].includes(g.league)) {
    if (period >= 4 && tied) return 'Tied';
    if (period >= 4 && close) return 'Close Game';
    if (period >= 3 && tied) return 'Tied';
    return null;
  }

  if (g.league === 'NFL') {
    if (period >= 4 && tied) return 'Tied';
    if (period >= 4 && close) return 'Close Game';
    if (period >= 3 && tied) return 'Tied';
    return null;
  }

  if (g.league === 'NHL') {
    if (period >= 3 && tied) return 'Tied';
    if (period >= 3 && close) return 'Close Game';
    if (period === 2 && tied) return 'Tied';
    return null;
  }

  return null;
}

function liveRow(g) {
  const {label,isBreak}=gameStatus(g);
  const sit = g.sit;
  const hasMLBSit = g.league === 'MLB' && !isBreak && sit.balls !== null;
  const hotLabel = highValueLabel(g);
  const isHot = !!hotLabel;

  let statusHtml;
  if (g.league !== 'MLB') {
    statusHtml = isBreak
      ? `<span class="gs-break">${label}</span>`
      : `<span class="gs-live">LIVE</span>
         ${label?`<span class="gs-period">${label}</span>`:''}
         ${g.clock&&!label.includes(g.clock)?`<span class="gs-clock">${g.clock}</span>`:''}`;
  } else {
    statusHtml = isBreak
      ? `<span class="gs-break">${label}</span>`
      : `<span class="gs-live">LIVE</span>${label?`<span class="gs-period">${label}</span>`:''}`;
  }

  const midRow = hasMLBSit
    ? `<div class="mlb-inline">${diamondSvg(sit,28)}<span class="mlb-inline-count">${sit.balls}-${sit.strikes}</span><div class="mlb-bar-outs">${outDots(sit.outs)}</div></div>`
    : `<div class="teams-divider"></div>`;

  // At-bat + last play strip (MLB live only)
  const showAB = hasMLBSit && (sit.batter || sit.pitcher || sit.lastPlay);
  let abStrip = '';
  if (showAB) {
    // Pitcher is on the fielding team, batter on the batting team.
    // In MLB "Top" = away bats, "Bottom" = home bats
    const desc = (g.stateDesc||'').toLowerCase();
    const awayBatting = desc.includes('top') || desc.includes('mid');
    const batterTeam  = awayBatting ? g.away.abbr : g.home.abbr;
    const pitcherTeam = awayBatting ? g.home.abbr : g.away.abbr;

    const matchup = (sit.pitcher && sit.batter)
      ? `<span class="ab-side"><span class="ab-team">${pitcherTeam}</span><span class="ab-name">${sit.pitcher}</span></span>`
        + `<span class="ab-vs">vs</span>`
        + `<span class="ab-side"><span class="ab-team">${batterTeam}</span><span class="ab-name">${sit.batter}</span></span>`
      : sit.batter ? `<span class="ab-side"><span class="ab-team">${batterTeam}</span><span class="ab-name">${sit.batter}</span></span>` : '';

    // Only show lastPlay if it's a result, not just restating the matchup
    const lp = sit.lastPlay || '';
    const isMatchupRestate = /pitches to|now batting|at bat/i.test(lp);
    const lastPlay = (lp && !isMatchupRestate) ? `<span class="ab-last">${lp}</span>` : '';
    abStrip = `<div class="ab-strip">${matchup}${lastPlay}</div>`;
  }

  return `<div class="game-row live-row${isHot?' hot-row':''}${showAB?' has-ab':''}" data-gameid="${g.id}">
    <div class="game-row-main">
      <div class="logos">${logo(g.away)}${logo(g.home)}</div>
      <div class="teams">
        <div class="team-line"><span class="t-name">${g.away.abbr}</span>${g.away.record?`<span class="t-rec">${g.away.record}</span>`:''}</div>
        ${midRow}
        <div class="team-line"><span class="t-name">${g.home.abbr}</span>${g.home.record?`<span class="t-rec">${g.home.record}</span>`:''}</div>
      </div>
      <div class="scores">
        <span class="t-score">${g.away.score}</span>
        ${hasMLBSit?`<span class="t-score" style="visibility:hidden">·</span>`:''}
        <span class="t-score">${g.home.score}</span>
      </div>
      <div class="game-status">
        ${isHot?`<span class="hot-badge">${hotLabel}</span>`:''}
        ${statusHtml}
      </div>
      <span class="game-league">${g.league}</span>
    </div>
    ${abStrip}
  </div>`;
}

function soonRow(g) {
  return `<div class="game-row soon-row" data-gameid="${g.id}">
    <div class="logos">${logo(g.away)}${logo(g.home)}</div>
    <div class="teams">
      <div class="team-line"><span class="t-name">${g.away.abbr}</span>${g.away.record?`<span class="t-rec">${g.away.record}</span>`:''}</div>
      <div class="teams-divider"></div>
      <div class="team-line"><span class="t-name">${g.home.abbr}</span>${g.home.record?`<span class="t-rec">${g.home.record}</span>`:''}</div>
    </div>
    <div class="game-status upcoming-status">
      <span class="gs-cd" data-ms="${g.startTime.getTime()}">--:--</span>
      <span class="gs-sep">·</span>
      <span class="gs-time">${g.startTime.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}</span>
    </div>
    <span class="game-league">${g.league}</span>
  </div>`;
}

function schedRow(g) {
  const mins = g.diffMin;
  const urgency = mins <= 120 ? ' urgent' : mins >= 300 ? ' distant' : '';
  return `<div class="game-row sched-row${urgency}" data-gameid="${g.id}">
    <div class="logos">${logo(g.away)}${logo(g.home)}</div>
    <div class="teams">
      <div class="team-line"><span class="t-name">${g.away.abbr}</span>${g.away.record?`<span class="t-rec">${g.away.record}</span>`:''}</div>
      <div class="teams-divider"></div>
      <div class="team-line"><span class="t-name">${g.home.abbr}</span>${g.home.record?`<span class="t-rec">${g.home.record}</span>`:''}</div>
    </div>
    <div class="game-status upcoming-status">
      <span class="gs-cd" data-ms="${g.startTime.getTime()}">--:--</span>
      <span class="gs-sep">·</span>
      <span class="gs-time">${g.startTime.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}</span>
    </div>
    <span class="game-league">${g.league}</span>
  </div>`;
}

function finalRow(g) {
  const aW=g.away.score>g.home.score, hW=g.home.score>g.away.score;
  return `<div class="game-row final-row" data-gameid="${g.id}">
    <div class="logos">${logo(g.away,!aW)}${logo(g.home,!hW)}</div>
    <div class="teams">
      <div class="team-line"><span class="t-name${aW?'':' loser'}">${g.away.abbr}</span></div>
      <div class="teams-divider"></div>
      <div class="team-line"><span class="t-name${hW?'':' loser'}">${g.home.abbr}</span></div>
    </div>
    <div class="scores">
      <span class="t-score${aW?' winner':' loser'}">${g.away.score}</span>
      <span class="t-score${hW?' winner':' loser'}">${g.home.score}</span>
    </div>
    <div class="game-status"><span class="gs-final">FINAL</span></div>
    <span class="game-league">${g.league}</span>
  </div>`;
}

function switchDate(offset) {
  if (viewingDate === offset) return;
  viewingDate = offset;
  document.getElementById('btn-today').classList.toggle('active', offset === 0);
  document.getElementById('btn-tomorrow').classList.toggle('active', offset === 1);
  document.getElementById('loading').style.display = 'flex';
  document.getElementById('content').style.display = 'none';
  document.getElementById('insight-bar').style.display = 'none';
  if (autoTimer) clearTimeout(autoTimer);
  fetchAll();
}

const AVG_DURATION = { NBA:155, WNBA:135, NFL:210, MLB:165, NHL:160 };

fetchAll();

// Prevent iOS Safari double-tap zoom (user-scalable=no is ignored on iOS)
let lastTouchEnd = 0;
document.addEventListener('touchend', function(e) {
  const now = Date.now();
  if (now - lastTouchEnd <= 300) { e.preventDefault(); }
  lastTouchEnd = now;
}, { passive: false });
// Prevent pinch/gesture zoom
document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
document.addEventListener('dblclick', function(e){ e.preventDefault(); });
</script>
