<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>* { touch-action: manipulation; }</style>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#171b24" id="themeColorMeta">
<title>FD Sharp Tracker · NFL Live Props</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#171b24;--card:#1e2430;--card2:#242b3c;--border:rgba(139,183,230,.20);
  --green:#27c071;--green-dim:rgba(39,192,113,.14);
  --red:#ff4d4d;--amber:#f5a623;
  --accent:#5ec2ff;--accent-dim:rgba(94,194,255,.16);
  --text:#fff;--sub:#fff;--glare:rgba(255,255,255,.16);
  --font:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);overscroll-behavior:none}
#app{background:var(--bg);min-height:100vh;border-left:1px solid var(--border);border-right:1px solid var(--border);max-width:960px;margin:0 auto;padding-bottom:calc(90px + env(safe-area-inset-bottom));box-shadow:0 0 40px rgba(0,0,0,.25)}
.cards-grid{display:flex;flex-direction:column}
@media (min-width:760px){
  .cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:10px;margin:0 16px 8px}
  .cards-grid .row,.cards-grid .tk{margin:0}
  .bdwrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px 12px}
}
.glass{position:relative;overflow:hidden;background:linear-gradient(150deg,var(--card2) 0%,var(--card) 65%);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--border);box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 6px 22px rgba(0,0,0,.28)}
.glass::after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 130% 65% at 0% 0%,var(--glare) 0%,rgba(255,255,255,.03) 42%,transparent 72%)}
.glass>*{position:relative}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadein{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
@keyframes splashSpin{to{transform:rotate(270deg)}}

/* ── HEADER ── */
header{padding:16px 16px 10px}
.header-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.brand{display:flex;align-items:center;gap:8px}
.brand-text{font-family:var(--font);font-weight:900;font-size:11.5px;line-height:1.08;letter-spacing:.3px;text-transform:uppercase;color:var(--text)}
.header-meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--green);font-weight:700;font-variant-numeric:tabular-nums}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0}
.sync-dot.stale{background:var(--amber)}
.sync-dot.live{animation:blink 1.3s infinite}
.refresh-btn{background:none;border:none;color:var(--sub);font-size:18px;cursor:pointer;padding:4px;line-height:1}
.refresh-btn.spinning{color:var(--green);animation:spin .7s linear infinite}
.tagline{font-size:10px;font-weight:700;color:var(--sub);letter-spacing:.6px;text-transform:uppercase}
.tagline b{color:var(--accent)}

/* ── SPLASH ── */
#splash{position:fixed;inset:0;z-index:9999;background:#171b24;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity .45s ease}
#splash.hide{opacity:0;pointer-events:none}
.splash-icon{position:relative;width:92px;height:92px;display:flex;align-items:center;justify-content:center}
.splash-icon.mini{width:52px;height:52px}
.splash-ring{position:absolute;inset:0;width:92px;height:92px;transform:rotate(-90deg);animation:splashSpin 1s linear infinite}
.splash-ring.mini{width:52px;height:52px}
.splash-ring circle{fill:none;stroke:var(--accent);stroke-width:5;stroke-linecap:round;stroke-dasharray:264;stroke-dashoffset:200}
.splash-text{color:#eef1f7;font-size:19px;font-weight:700;font-family:var(--font);letter-spacing:.2px}

/* ── DATE TOGGLE ── */
.date-toggle{display:flex;gap:4px;margin:0 16px 10px}
.date-btn{position:relative;overflow:hidden;flex:1;padding:8px 0;border-radius:14px;border:1.5px solid var(--border);background:linear-gradient(150deg,var(--card2) 0%,var(--card) 65%);color:var(--sub);font-family:var(--font);font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;cursor:pointer}
.date-btn.active{border-color:rgba(39,192,113,.5);color:var(--green);background:var(--green-dim)}
.dt-n{font-variant-numeric:tabular-nums;margin-left:3px}

/* ── SCORE TICKER ── */
.ticker-wrap{overflow:hidden;margin:0 0 10px;padding:8px 0;background:rgba(255,255,255,.03);border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.ticker-track{display:flex;width:max-content;animation:tickerScroll linear infinite}
.ticker-wrap.static .ticker-track{animation:none}
.ticker-wrap:hover .ticker-track{animation-play-state:paused}
@keyframes tickerScroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.tk-item{display:flex;align-items:center;gap:7px;flex-shrink:0;padding:0 16px;border-right:1px solid var(--border);white-space:nowrap;font-variant-numeric:tabular-nums}
.tk-item:last-child{border-right:none}
.tk-item-teams{font-size:11px;font-weight:900;letter-spacing:.3px;color:var(--text)}
.tk-item-score{font-size:13px;font-weight:900;color:var(--text)}
.tk-item-time{font-size:11px;font-weight:700;color:var(--sub)}
.tk-item-tag{font-size:9px;font-weight:800;letter-spacing:.4px;padding:1px 6px;border-radius:10px}
.tk-item-tag.live{color:var(--red);background:rgba(255,77,77,.14);animation:blink 1.6s infinite}
.tk-item-tag.final{color:var(--sub);background:rgba(255,255,255,.08)}

/* ── RECORD BAR ── */
.record-bar{display:flex;align-items:center;margin:0 16px 12px;gap:8px}
.record-cell{flex:1;display:flex;flex-direction:column;align-items:center;padding:9px 4px;border-radius:14px;background:var(--card);border:1px solid var(--border)}
.record-val{font-size:19px;font-weight:900;line-height:1;color:var(--text);font-variant-numeric:tabular-nums}
.record-val.pos{color:var(--green)}
.record-val.neg{color:var(--red)}
.record-label{font-size:8px;font-weight:800;color:var(--sub);text-transform:uppercase;letter-spacing:1.2px;margin-top:4px}

/* ── SECTION LABEL ── */
.section-label{display:flex;align-items:center;gap:8px;padding:10px 16px 6px}
.section-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.section-dot.live{background:var(--red);animation:blink 1.3s infinite;box-shadow:0 0 8px var(--red)}
.section-dot.info{background:var(--sub)}
.section-name{font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:2px;color:var(--text)}
.section-n{font-size:12px;font-weight:900;color:var(--text);background:rgba(255,255,255,.12);padding:1px 7px;border-radius:20px;font-variant-numeric:tabular-nums}

/* ── ROW CARD ── */
.row{border-radius:20px;padding:12px;margin:0 16px 8px;-webkit-user-select:none;user-select:none;animation:fadein .18s ease}
.row.strong{border-color:rgba(245,166,35,.45);box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 0 16px rgba(245,166,35,.15)}
.cardhead{margin:-12px -12px 10px -12px;padding:9px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;background:rgba(255,255,255,.05);border-bottom:1px solid var(--border)}
.cardhead .chleft{display:flex;align-items:center;gap:7px;font-weight:900;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--text)}
.cardhead .st.live{color:var(--red);font-size:10px;font-weight:800}
.cardhead .lg{font-size:9px;font-weight:800;letter-spacing:.6px;padding:2px 8px;border-radius:20px;border:1px solid var(--border);color:var(--text)}
.autobadge{font-size:9px;font-weight:900;letter-spacing:.4px;padding:2px 8px;border-radius:20px;background:rgba(94,194,255,.16);border:1px solid rgba(94,194,255,.5);color:var(--accent)}
.autobadge.strong{background:rgba(245,166,35,.18);border-color:rgba(245,166,35,.6);color:var(--amber)}
.hidebtn{background:none;border:none;color:var(--sub);font-size:13px;font-weight:900;cursor:pointer;padding:2px 4px;line-height:1}
.gm{font-weight:900;font-size:13px;text-transform:uppercase;letter-spacing:.2px;margin-bottom:8px}
.gm .qtr{font-size:10px;font-weight:800;color:var(--text);letter-spacing:.2px;text-transform:none;background:rgba(255,255,255,.08);border:1px solid var(--border);border-radius:20px;padding:2px 8px;margin-left:6px}
.pick .m{font-size:10px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--accent)}
.pick .s{font-size:16px;font-weight:900;margin-top:2px}
.booklist{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.bookrow{display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:13px;background:rgba(255,255,255,.03);border:1px solid var(--border)}
.bookrow .bkname{flex:1;min-width:0;font-size:11px;font-weight:800;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bookrow .bkprice{font-size:15px;font-weight:900;color:var(--text);font-variant-numeric:tabular-nums;flex-shrink:0}
.bookrow .bkmeta{font-size:10px;font-weight:800;color:var(--sub);margin-left:8px;flex-shrink:0;white-space:nowrap}
.bookrow.best{border-color:rgba(94,194,255,.5);box-shadow:0 0 14px rgba(94,194,255,.22)}
.bookrow.best .bkname{color:var(--text)}
.footstrip{display:flex;gap:6px;margin-top:10px}
.fs-stat{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(255,255,255,.05);border:1px solid rgba(94,194,255,.35);border-radius:13px;padding:7px 4px;font-size:13px;font-weight:900;color:var(--accent);font-variant-numeric:tabular-nums}
.fs-stat span{font-size:8px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--sub);margin-top:1px}
.sig{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;padding-top:8px;border-top:1px solid rgba(255,255,255,.06);font-size:11px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}

/* ── TRACKER ── */
.tk{border-radius:18px;padding:10px 12px;margin:0 16px 8px;font-size:12px}
.tk .h{display:flex;justify-content:space-between;gap:8px;font-weight:800}
.tk-score{margin-top:5px;font-size:13px;font-weight:900;color:var(--text);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px;flex-wrap:wrap;text-transform:uppercase;letter-spacing:.2px}
.tk .m{font-size:11px;color:var(--text);margin-top:4px;line-height:1.6;font-variant-numeric:tabular-nums}
.prog{margin-top:8px}
.prog .nums{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;margin-bottom:4px;font-variant-numeric:tabular-nums}
.prog .nums b{font-size:17px;color:var(--text)}
.prog .nums .dim{color:var(--sub);font-weight:600}
.bar{height:8px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--green));border-radius:999px}
.bar i.g{background:var(--green)}
.bar i.r{background:var(--red)}
.bar em{position:absolute;top:-3px;bottom:-3px;width:2px;background:#fff;opacity:.75}
.acts{display:flex;gap:6px}
.acts button{border:1px solid var(--border);background:rgba(255,255,255,.06);color:var(--text);border-radius:12px;padding:5px 11px;font-weight:800;font-size:11px;font-family:var(--font)}

/* ── BREAKDOWNS ── */
.bdwrap{margin:0 16px 12px;display:flex;flex-direction:column;gap:8px}
.bdgroup{border-radius:16px;padding:10px 12px;background:var(--card);border:1px solid var(--border)}
.bdtitle{font-size:9px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--sub);margin-bottom:6px}
.bdrow{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:11px;font-weight:700}
.bdrow+.bdrow{border-top:1px solid rgba(255,255,255,.06)}
.bdname{flex:1;min-width:0;font-weight:800;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bdstat{flex-shrink:0;font-variant-numeric:tabular-nums;color:var(--text)}
.bdstat .dim{color:var(--sub);font-weight:600}
.bdunits{flex-shrink:0;width:52px;text-align:right;font-variant-numeric:tabular-nums;font-weight:900;color:var(--text)}
.bdunits.pos{color:var(--green)}
.bdunits.neg{color:var(--red)}
.bdpct{flex-shrink:0;width:36px;text-align:right;font-variant-numeric:tabular-nums;color:var(--accent);font-weight:900}

.empty,.searching{text-align:center;padding:36px 20px 40px;color:var(--sub);font-size:13px;font-weight:600;line-height:1.6}
.searching .splash-icon{margin:0 auto 14px}
.searching-title{color:var(--text);font-size:15px;font-weight:800;margin-bottom:4px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1a1d22;border:1px solid var(--border);color:#fff;font-size:12px;font-weight:700;padding:10px 14px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:99}
.toast.show{opacity:1}
</style>
</head>
<body>
<div id="splash">
  <div class="splash-icon">
    <svg class="splash-ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="42"></circle></svg>
  </div>
  <div class="splash-text">FD Sharp Tracker</div>
</div>
<div id="app">

<header>
  <div class="header-row">
    <div class="brand"><div class="brand-text"><div>FD</div><div>Sharp</div><div>Track</div></div></div>
    <div class="header-meta">
      <div class="sync-dot" id="syncDot"></div>
      <span id="lastUpdated">--:--</span>
      <button id="reload" class="refresh-btn" title="Refresh">↻</button>
    </div>
  </div>
  <div class="tagline">NFL live player props · FanDuel arb vs 2+ of <b>Caesars · DK · Fliff</b></div>
</header>

<div class="ticker-wrap" id="tickerWrap" style="display:none">
  <div class="ticker-track" id="tickerTrack"></div>
</div>

<div class="date-toggle">
  <button class="date-btn active" id="vLive">Live <span class="dt-n" id="liveN"></span></button>
  <button class="date-btn" id="vTrack">Tracker <span class="dt-n" id="trackN">0</span></button>
</div>

<div class="record-bar">
  <div class="record-cell"><span class="record-val" id="sumAligned">—</span><span class="record-label">Arbs</span></div>
  <div class="record-cell"><span class="record-val" id="sumTracked">—</span><span class="record-label">Tracked</span></div>
  <div class="record-cell"><span class="record-val" id="sumRecord">—</span><span class="record-label">W-L-P</span></div>
  <div class="record-cell"><span class="record-val" id="sumUnits">—</span><span class="record-label">Units</span></div>
</div>

<div id="view"><div class="empty">Loading…</div></div>
<div class="toast" id="toast"></div>
</div>

<script>
// ───────────────────────────── helpers ─────────────────────────────
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS = { get:(k,d)=>{ try{ return localStorage.getItem(k) ?? d; }catch(e){ return d; } }, set:(k,v)=>{ try{ localStorage.setItem(k,v); }catch(e){} } };
const BACKEND = () => LS.get('oo_backend_url', 'https://nfl-props-tracker-1.vercel.app/api/odds');
const toDec = a => { a = Number(a); return a > 0 ? 1 + a/100 : 1 + 100/Math.abs(a); };
const imp = a => 1/toDec(a);
const fmtAm = a => { a = Number(a); return a > 0 ? '+' + a : String(a); };
const probToAm = p => { if (!(p > 0 && p < 1)) return 0; return p >= 0.5 ? -Math.round(100 * p / (1 - p)) : Math.round(100 * (1 - p) / p); };
const centsDiff = (a, b) => { a = Number(a); b = Number(b); if ((a < 0) === (b < 0)) return Math.abs(a - b); return Math.abs(Math.abs(a) - 100) + Math.abs(Math.abs(b) - 100); };
const chunk = (arr, n) => { const out = []; for (let i = 0; i < arr.length; i += n) out.push(arr.slice(i, i + n)); return out; };
const normName = n => String(n||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/['’.`]/g,'').replace(/[^a-z ]/g,' ').replace(/\s+/g,' ').trim();
const cleanSel = n => String(n||'').replace(/\s*\([^)]*\)\s*$/,'').trim();
const has = (m, s) => m.includes(s);
async function oo(endpoint, params) {
  const r = await fetch(BACKEND(), { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ endpoint, params }) });
  const text = await r.text();
  if (!r.ok) { let m = text; try { const j = JSON.parse(text); m = j.error + (j.body ? ' — ' + j.body : ''); } catch(e) {} throw new Error(`backend ${r.status}: ${m}`); }
  return JSON.parse(text);
}
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(window._toastTimer); window._toastTimer = setTimeout(() => t.classList.remove('show'), 2200); }

// ───────────────────────────── config ─────────────────────────────
const TARGET_BOOK = 'FanDuel';
const CONSENSUS_BOOKS = ['Caesars', 'DraftKings', 'Fliff'];
const ALL_BOOKS = [TARGET_BOOK, ...CONSENSUS_BOOKS];
// Alt lines ("5+ Receptions" etc.) are single-sided — there's no opposite side to arb against,
// and we're betting ON FD here, not hedging against another book, so FD's own price is never
// required to match consensus. This margin instead gates whether the 3 CONSENSUS books agree
// with EACH OTHER closely enough to trust as a baseline — FD is then tracked against it as-is.
const ALT_ALIGN_CENTS = 10;
// NFL player-prop markets — matched by substring against whatever /fixtures/odds returns,
// same approach as the props tracker: request is_main:true (standard lines only) and classify
// client-side rather than guessing exact API market-name strings.
// isSegment excludes 1st/2nd half and quarter-scoped markets — those lines run way lower than
// full-game and would otherwise get lumped in with the full-game main line for the same stat.
const isSegment = m => /\b(1st|first|2nd|second|3rd|third|4th|fourth)\s+(half|quarter)\b/.test(m);
const NFL_MARKETS = [
  ['pass_yds', 'Pass Yds',  m => has(m, 'passing yards') && !m.includes('+') && !isSegment(m)],
  ['pass_td',  'Pass TD',   m => has(m, 'passing touchdown') && !m.includes('+') && !isSegment(m)],
  ['pass_att', 'Pass Att',  m => has(m, 'passing attempt') && !m.includes('+') && !isSegment(m)],
  ['pass_cmp', 'Comp',      m => has(m, 'completion') && !has(m, 'longest') && !m.includes('+') && !isSegment(m)],
  ['rush_yds', 'Rush Yds',  m => has(m, 'rushing yards') && !m.includes('+') && !isSegment(m)],
  ['rush_att', 'Rush Att',  m => has(m, 'rushing attempt') && !m.includes('+') && !isSegment(m)],
  ['rec_yds',  'Rec Yds',   m => has(m, 'receiving yards') && !m.includes('+') && !isSegment(m)],
  ['rec',      'Receptions',m => has(m, 'reception') && !has(m, 'longest') && !m.includes('+') && !isSegment(m)],
  ['atd',      'Anytime TD',m => has(m, 'anytime') && has(m, 'touchdown')],
];
const marketKeyFor = name => { const m = String(name||'').toLowerCase(); const hit = NFL_MARKETS.find(([,,t]) => t(m)); return hit ? hit[0] : null; };
const marketLabel = key => (NFL_MARKETS.find(m => m[0] === key) || [])[1] || key;
const STAT_CANDS = { pass_yds:['passing_yards'], pass_td:['passing_touchdowns'], pass_att:['passing_attempts'], pass_cmp:['passing_completions','completions'], rush_yds:['rushing_yards'], rush_att:['rushing_attempts'], rec_yds:['receiving_yards'], rec:['receptions'] };
// Alt lines ("5+ Receptions", "250+ Passing Yards") — same stats as NFL_MARKETS minus Anytime TD
// (which has no numeric line to begin with), matched by REQUIRING the '+' the main matchers reject.
const ALT_MARKETS = [
  ['pass_yds', 'Pass Yds',   m => has(m, 'passing yards') && !isSegment(m)],
  ['pass_td',  'Pass TD',    m => has(m, 'passing touchdown') && !isSegment(m)],
  ['pass_att', 'Pass Att',   m => has(m, 'passing attempt') && !isSegment(m)],
  ['pass_cmp', 'Comp',       m => has(m, 'completion') && !has(m, 'longest') && !isSegment(m)],
  ['rush_yds', 'Rush Yds',   m => has(m, 'rushing yards') && !isSegment(m)],
  ['rush_att', 'Rush Att',   m => has(m, 'rushing attempt') && !isSegment(m)],
  ['rec_yds',  'Rec Yds',    m => has(m, 'receiving yards') && !isSegment(m)],
  ['rec',      'Receptions', m => has(m, 'reception') && !has(m, 'longest') && !isSegment(m)],
];
const altMarketKeyFor = name => {
  const m = String(name || '').toLowerCase();
  if (!m.includes('+')) return null;
  const hit = ALT_MARKETS.find(([,,t]) => t(m));
  return hit ? hit[0] : null;
};
// "5+ Receptions" grades the same way "Over 4.5 Receptions" does, so the stored line is X-0.5
// and everything downstream (gradeOutcome, progress bar) reuses the normal over-line math as-is.
function altThresholdLine(o) {

// ───────────────────────────── arb math ─────────────────────────────
// Build player-prop pairs per fixture: bucket by market+player+line, each bucket holding
// per-side (over/under) per-book prices. Anytime TD and other single-sided props have no
// opposite side to arb against, so they can never qualify under this rule and drop out
// naturally below.
const MIN_ARB_BOOKS = 2; // FD must form a genuine arb against at least this many of the 3
function computeRows(fxs, byFx) {
  const out = [];
  fxs.forEach(f => {
    const odds = (byFx[f.id] || []).filter(o => o.price != null);
    const pairs = {};
    odds.forEach(o => {
      const mkey = marketKeyFor(o.market || ''); if (!mkey) return;
      const player = cleanSel(o.selection || o.name || ''); if (!player) return;
      const line = o.points != null ? Number(o.points) : null;
      const side = /over|under/i.test(String(o.selection_line || '')) ? String(o.selection_line).toLowerCase() : 'yes';
      const bucketKey = `${f.id}|${mkey}|${normName(player)}|${line ?? ''}`;
      const P = (pairs[bucketKey] = pairs[bucketKey] || { mkey, player, line, marketName: o.market, sides: {} });
      const S = (P.sides[side] = P.sides[side] || {});
      const bk = String(o.sportsbook || '');
      if (!S[bk] || Number(o.price) > Number(S[bk].price)) S[bk] = o;
    });
    const SIDE_ORDER = ['over', 'under', 'yes'];
    Object.entries(pairs).forEach(([bucketKey, P]) => {
      const candidates = [];
      Object.entries(P.sides).forEach(([side, books]) => {
        const fd = books[TARGET_BOOK]; if (!fd) return;
        const oppSide = side === 'over' ? 'under' : side === 'under' ? 'over' : null;
        const oppBooks = oppSide ? (P.sides[oppSide] || {}) : null;
        if (!oppBooks) return; // no opposite side posted anywhere — can't arb a single-sided market
        // Real arb, book by book: FD's price on this side + that book's price on the OTHER side.
        // Qualifying requires at least MIN_ARB_BOOKS of the 3 to individually arb against FD —
        // not just an average/consensus alignment.
        const arbBooks = [];
        CONSENSUS_BOOKS.forEach(bk => {
          const opp = oppBooks[bk]; if (!opp) return;
          const arbPct = 1 - (imp(fd.price) + imp(opp.price));
          if (arbPct > 0) arbBooks.push({ book: bk, oppPrice: Number(opp.price), arbPct });
        });
        if (arbBooks.length < MIN_ARB_BOOKS) return;
        arbBooks.sort((a, b) => b.arbPct - a.arbPct);
        candidates.push({ side, fd, arbBooks, bestArb: arbBooks[0].arbPct });
      });
      if (!candidates.length) return;
      // Over and under can both qualify against each other — that's a counter bet, not a signal.
      // Only ever take one side of the same prop; over wins ties over under, deterministically.
      candidates.sort((a, b) => SIDE_ORDER.indexOf(a.side) - SIDE_ORDER.indexOf(b.side));
      const chosen = candidates[0];
      const key = `${bucketKey}|${chosen.side}`;
      out.push({
        key, fid: f.id, f, mkey: P.mkey, marketNames: [P.marketName], player: P.player, line: P.line, side: chosen.side,
        fdPrice: Number(chosen.fd.price), arbBooks: chosen.arbBooks, arbCount: chosen.arbBooks.length, bestArb: chosen.bestArb,
      });
    });
  });
  // 3-of-3 arbs (the strongest signal) float to the top, then by best individual arb %.
  return out.sort((a, b) => (b.arbCount - a.arbCount) || (b.bestArb - a.bestArb));
}

// we're betting ON FD (not hedging against another book), FD's own price does NOT need to be
// close to consensus; the whole point is capturing data on whether FD is generous or stingy
// relative to a trustworthy line. The only gate is that the 3 consensus books agree with EACH
// OTHER within ALT_ALIGN_CENTS — that's what makes their price a credible baseline to bet FD
// against — then FD is tracked on that threshold regardless of how far its own price sits from it.
// Tracked and graded completely separately from the arb-based main rows.
function computeAltRows(fxs, byFx) {

  fxs.forEach(f => {
    const odds = (byFx[f.id] || []).filter(o => o.price != null);
    const groups = {};
    odds.forEach(o => {
      const mkey = altMarketKeyFor(o.market || ''); if (!mkey) return;
      const player = cleanSel(o.selection || o.name || ''); if (!player) return;
      const line = altThresholdLine(o); if (line == null || isNaN(line)) return;

      const G = (groups[key] = groups[key] || { mkey, player, line, marketName: o.market, books: {} });
      const bk = String(o.sportsbook || '');
      if (!G.books[bk] || Number(o.price) > Number(G.books[bk].price)) G.books[bk] = o;
    });
    Object.entries(groups).forEach(([key, G]) => {
      const fd = G.books[TARGET_BOOK]; if (!fd) return;
      if (!CONSENSUS_BOOKS.every(bk => G.books[bk])) return; // need all 3 present to trust it as a consensus
      const consensusAgrees = CONSENSUS_BOOKS.every((bk1, i) =>
        CONSENSUS_BOOKS.slice(i + 1).every(bk2 => centsDiff(G.books[bk1].price, G.books[bk2].price) <= ALT_ALIGN_CENTS)
      );
      if (!consensusAgrees) return;
      // FD's spread from each consensus book is kept for display only — it's not a qualifying gate.
      const vsConsensus = CONSENSUS_BOOKS.map(bk => ({ book: bk, price: Number(G.books[bk].price), centsDiff: centsDiff(fd.price, G.books[bk].price) }));
      out.push({
        key: `${key}|alt`, fid: f.id, f, mkey: G.mkey, marketNames: [G.marketName], player: G.player, line: G.line,
        fdPrice: Number(fd.price), aligned: vsConsensus,

}

    const oppSideLabel = r.side === 'over' ? `Under ${r.line}` : `Over ${r.line}`;
    const strong = r.arbCount >= 3;
    const fdRow = `<div class="bookrow best"><span class="bkname">FanDuel</span><span class="bkprice">${fmtAm(r.fdPrice)}</span><span class="bkmeta">TARGET · ${esc(sideLabel)}</span></div>`;
    const arbRows = r.arbBooks.map(b => `<div class="bookrow"><span class="bkname">${esc(b.book)}</span><span class="bkprice">${fmtAm(b.oppPrice)}</span><span class="bkmeta">${esc(oppSideLabel)} · ${(b.arbPct*100).toFixed(2)}% arb</span></div>`).join('');
    return `<div class="row glass${strong ? ' strong' : ''}" data-key="${esc(r.key)}">
      <div class="cardhead">
        <div class="chleft"><span class="lg">NFL</span><span class="st live">LIVE</span></div>
        <div class="chleft"><span class="autobadge${strong ? ' strong' : ''}">${strong ? '★ 3/3 ARB' : `✓ ${r.arbCount}/3 ARB`}</span></div>
      </div>
      <div class="gm">${esc(r.f.away.ab)} <span>${isNaN(st.away)?'':st.away}</span> @ ${esc(r.f.home.ab)} <span>${isNaN(st.home)?'':st.home}</span>${st.label ? `<span class="qtr">${esc(st.label)}</span>` : ''}</div>
      <div class="pick"><div class="m">${esc(marketLabel(r.mkey))}</div><div class="s">${esc(r.player)} — ${esc(sideLabel)}</div></div>
      <div class="booklist">${fdRow}${arbRows}</div>
      <div class="sig"><span>✓ auto-tracked · best ${(r.bestArb*100).toFixed(2)}% arb</span></div>
    </div>`;
  }
  const html = sectionLabel('live', 'Arbs Now', rows.length) + '<div class="cards-grid">' + rows.map(rowCard).join('') + '</div>';
  setViewHtml(view, html);
  updateRecordBar();
}
function renderTracker() {
  const view = $('#view');
  const bets = Object.values(log).sort((a, b) => b.betAt - a.betAt);
  const t = ms => new Date(ms).toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit' });
  const card = e => {
    const settled = e.status === 'won' || e.status === 'lost' || e.status === 'push';
    const clr = e.status === 'won' ? 'var(--green)' : e.status === 'lost' ? 'var(--red)' : 'var(--text)';
    const units = e.status === 'won' ? `+${unitsFor(e.fdPrice, e.stakeUnits).toFixed(2)}u` : e.status === 'lost' ? `-${e.stakeUnits.toFixed(2)}u` : e.status === 'push' ? '0u' : '';
    const resultLine = !settled
      ? `<div class="m" style="color:var(--sub)">Pending · grades itself when the game is final</div>`
      : `<div class="m"><b style="color:${clr};font-size:12px">${e.status.toUpperCase()}</b> <b style="color:${clr}">${units}</b>${e.actual != null ? ` · actual ${e.actual}` : ''}</div>`;
    const sideLabel = e.side === 'over' ? `Over ${e.line}` : e.side === 'under' ? `Under ${e.line}` : 'Yes';
    let prog = '';
    if ((e.side === 'over' || e.side === 'under') && e.line != null) {
      const L = Number(e.line), actual = e.actual;
      const pct = actual == null ? 0 : Math.min(100, Math.round(actual / (L * 1.5) * 100));
      const mark = Math.round(100 / 1.5);
      const winningNow = actual != null && (e.side === 'over' ? actual > L : actual < L);
      const cls = settled ? (e.status === 'won' ? 'g' : e.status === 'lost' ? 'r' : '') : (actual != null ? (winningNow ? 'g' : 'r') : '');
      prog = `<div class="prog"><div class="nums"><span><b>${actual == null ? '—' : actual}</b> <span class="dim">/ ${L} ${esc(e.market)}</span></span></div><div class="bar"><i class="${cls}" style="width:${pct}%"></i><em style="left:${mark}%"></em></div></div>`;
    }
    const resultBtns = settled
      ? `<button data-res="${esc(e.key)}|pending">↺ Re-open</button>`
      : `<button data-res="${esc(e.key)}|won">WON</button><button data-res="${esc(e.key)}|lost">LOST</button><button data-res="${esc(e.key)}|push">PUSH</button>`;
    return `<div class="tk glass"><div class="h"><span>${esc(e.game)} <span style="color:var(--sub);font-size:10px">NFL</span></span><span>${t(e.betAt)}</span></div>
    <div style="font-weight:800;font-size:14px;margin-top:3px">${esc(e.market)} · ${esc(e.player)} ${esc(sideLabel)}</div>
    <div class="m">FD <b>${fmtAm(e.fdPrice)}</b> · arb vs ${e.arbCount}/3 books (best ${(e.bestArb*100).toFixed(2)}%) · ${esc(e.favDog)} · 1u</div>
    ${prog}
    ${resultLine}
    <div class="acts" style="margin-top:8px">${resultBtns}<button data-del="${esc(e.key)}">✕</button></div></div>`;
  };
  const breakdowns = bets.length ? `<div class="bdwrap">
    ${breakdownHtml('By Prop Type', groupRecords(bets, e => e.market))}
    ${breakdownHtml('Over vs Under', groupRecords(bets, sideLabelFor))}
    ${breakdownHtml('Prop Type + Side', groupRecords(bets, propSideFor))}
    ${breakdownHtml('By FD Odds', groupRecords(bets, e => oddsBucket(e.fdPrice)))}
    ${breakdownHtml('By Arb %', groupRecords(bets, e => arbBucket(e.bestArb)))}
    ${breakdownHtml('By Consensus Combo', groupRecords(bets, comboFor))}
  </div>` : '';
  const cardsHtml = bets.length ? '<div class="cards-grid">' + bets.map(card).join('') + '</div>' : '<div class="empty">Nothing tracked yet — auto-tracks the moment an FD prop aligns with consensus.</div>';

  // Alt lines ("5+ Receptions") — separate section, separate rule (price alignment, not arb).
  const altBets = Object.values(altLog).sort((a, b) => b.betAt - a.betAt);
  const altCard = e => {
    const settled = e.status === 'won' || e.status === 'lost' || e.status === 'push';
    const clr = e.status === 'won' ? 'var(--green)' : e.status === 'lost' ? 'var(--red)' : 'var(--text)';
    const units = e.status === 'won' ? `+${unitsFor(e.fdPrice, e.stakeUnits).toFixed(2)}u` : e.status === 'lost' ? `-${e.stakeUnits.toFixed(2)}u` : e.status === 'push' ? '0u' : '';
    const resultLine = !settled
      ? `<div class="m" style="color:var(--sub)">Pending · grades itself when the game is final</div>`
      : `<div class="m"><b style="color:${clr};font-size:12px">${e.status.toUpperCase()}</b> <b style="color:${clr}">${units}</b>${e.actual != null ? ` · actual ${e.actual}` : ''}</div>`;
    const thresholdLabel = `${e.line + 0.5}+ ${e.market}`;
    const maxCents = e.aligned && e.aligned.length ? Math.max(...e.aligned.map(a => a.centsDiff)) : 0;
    const resultBtns = settled
      ? `<button data-ares="${esc(e.key)}|pending">↺ Re-open</button>`
      : `<button data-ares="${esc(e.key)}|won">WON</button><button data-ares="${esc(e.key)}|lost">LOST</button><button data-ares="${esc(e.key)}|push">PUSH</button>`;
    return `<div class="tk glass"><div class="h"><span>${esc(e.game)} <span style="color:var(--sub);font-size:10px">NFL ALT</span></span><span>${t(e.betAt)}</span></div>
    <div style="font-weight:800;font-size:14px;margin-top:3px">${esc(e.player)} — ${esc(thresholdLabel)}</div>
    <div class="m">FD <b>${fmtAm(e.fdPrice)}</b> · consensus tight (3/3 agree within ${ALT_ALIGN_CENTS}c) · FD off by up to ${maxCents}c · 1u</div>
    ${resultLine}
    <div class="acts" style="margin-top:8px">${resultBtns}<button data-adel="${esc(e.key)}">✕</button></div></div>`;
  };
  const altBreakdowns = altBets.length ? `<div class="bdwrap">
    ${breakdownHtml('Alt: By Prop Type', groupRecords(altBets, e => e.market))}
    ${breakdownHtml('Alt: By FD Odds', groupRecords(altBets, e => oddsBucket(e.fdPrice)))}
  </div>` : '';
  const altCardsHtml = altBets.length ? '<div class="cards-grid">' + altBets.map(altCard).join('') + '</div>' : '<div class="empty">No alt-line picks yet — auto-tracks when FD sits within 10c of all 3 books on the same threshold.</div>';
  const altSection = sectionLabel('info', 'Alt Line Picks', altBets.length) + altBreakdowns + altCardsHtml;

  const html = sectionLabel('info', 'Tracked Picks', bets.length) + breakdowns + cardsHtml + altSection;
  if (!setViewHtml(view, html)) { updateRecordBar(); return; }
  view.querySelectorAll('[data-res]').forEach(b => b.addEventListener('click', () => {
    const [k, r] = b.dataset.res.split('|'); if (!log[k]) return;
    log[k].status = r; if (r === 'pending') { delete log[k].gradedAt; }
    saveLog(); renderTracker();
  }));
  view.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => { delete log[b.dataset.del]; saveLog(); renderTracker(); }));
  view.querySelectorAll('[data-ares]').forEach(b => b.addEventListener('click', () => {
    const [k, r] = b.dataset.ares.split('|'); if (!altLog[k]) return;
    altLog[k].status = r; if (r === 'pending') { delete altLog[k].gradedAt; }
    saveAltLog(); renderTracker();
  }));
  view.querySelectorAll('[data-adel]').forEach(b => b.addEventListener('click', () => { delete altLog[b.dataset.adel]; saveAltLog(); renderTracker(); }));
  updateRecordBar();
}
function setView(m) { viewMode = m; $('#vLive').classList.toggle('active', m === 'live'); $('#vTrack').classList.toggle('active', m === 'tracker'); render(); }

// ───────────────────────────── flow ─────────────────────────────
let busy = false, lastGradeAt = 0;
async function load(force) {
  if (busy) return; busy = true; setSync('busy'); $('#reload').classList.add('spinning');
  if (Date.now() - lastGradeAt > 30000) { lastGradeAt = Date.now(); autoGrade(); }
  try {
    fixtures = await loadFixtures();
    $('#liveN').textContent = fixtures.length ? fixtures.length : '';
    // State covers the whole slate (ticker needs scheduled/final games too), not just live props fixtures.
    const [byFx, altByFx, state] = await Promise.all([
      fixtures.length ? loadOdds(fixtures) : Promise.resolve({}),
      fixtures.length ? loadAltOdds(fixtures) : Promise.resolve({}),
      slate.length ? loadState(slate) : Promise.resolve({}),
    ]);
    gameState = state;
    renderTicker();
    if (!fixtures.length) { rows = []; altRows = []; render(); busy = false; setSync('idle'); $('#reload').classList.remove('spinning'); return; }
    rows = computeRows(fixtures, byFx);
    altRows = computeAltRows(fixtures, altByFx);
    autoTrack(rows);
    autoTrackAlt(altRows);
    setLastUpdated();
    render();
    setSync('idle');
  } catch(e) {
    console.warn('[fd-sharp] load failed', e.message);
    setSync('error');
  } finally { busy = false; $('#reload').classList.remove('spinning'); }
}
function setSync(state) { const dot = $('#syncDot'); if (!dot) return; dot.classList.remove('live','stale'); if (state === 'busy') dot.classList.add('live'); else if (state === 'error') dot.classList.add('stale'); }
function setLastUpdated() { const el = $('#lastUpdated'); if (el) el.textContent = new Date().toLocaleTimeString([], { hour:'numeric', minute:'2-digit' }); }

$('#vLive').addEventListener('click', () => setView('live'));
$('#vTrack').addEventListener('click', () => setView('tracker'));
$('#reload').addEventListener('click', () => load(true));
$('#trackN').textContent = Object.keys(log).length;
render();
load(true);
setInterval(() => { if (document.visibilityState === 'visible') load(false); }, 5000);
setTimeout(() => { const s = $('#splash'); if (!s) return; s.classList.add('hide'); setTimeout(() => s.remove(), 500); }, 1300);
</script>
