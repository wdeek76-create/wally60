<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FTN Picks">
<title>FTN Picks</title>
<style>
:root{--bg:#0a0d10;--bg2:#11161b;--bg3:#161d24;--line:#1f2933;--line2:#2a3541;--text:#e5e7eb;--dim:#8b96a3;--green:#22c55e;--red:#ff5c5c;--amber:#fbbf24;--blue:#60a5fa;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#f6f7f9;--bg2:#fff;--bg3:#f0f2f5;--line:#e3e7ec;--line2:#d5dbe2;--text:#111827;--dim:#5b6573}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;padding:max(12px,env(safe-area-inset-top)) 14px 90px}
h1{font-size:19px;margin:4px 0 2px}h1 b{color:var(--green)}
.sub{color:var(--dim);font-size:12px;margin-bottom:10px}
.tabs{display:flex;gap:6px;margin:8px 0 12px}
.tabs button,.btn,.chip{border:1px solid var(--line2);background:var(--bg2);color:var(--text);border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer}
.tabs button.on,.chip.on{border-color:var(--green);background:rgba(34,197,94,.14)}
.btn.go{border-color:var(--green);background:rgba(34,197,94,.16);color:var(--green)}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
textarea{width:100%;height:120px;border-radius:12px;border:1px solid var(--line2);background:var(--bg2);color:var(--text);padding:10px;font-size:12px}
input[type=search],input[type=number]{border:1px solid var(--line2);background:var(--bg2);color:var(--text);border-radius:10px;padding:9px 12px;font-size:14px}
input[type=search]{flex:1;min-width:160px}
input[type=number]{width:86px}
label.s{font-size:12px;color:var(--dim);display:flex;gap:6px;align-items:center}
.msg{font-size:12px;color:var(--dim);margin:6px 0}
.msg.err{color:var(--red)}
.card{border:1px solid var(--line2);background:var(--bg2);border-radius:14px;padding:11px 12px;margin:8px 0;position:relative}
.card.off{opacity:.38}
.card .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.card .gm{font-size:12px;color:var(--dim)}
.card .bet{font-size:15px;font-weight:800;margin:2px 0}
.card .ftn{font-size:11.5px;color:var(--dim)}
.card .edge{font-weight:800;color:var(--green);white-space:nowrap}
.card .x{border:1px solid var(--line2);background:transparent;color:var(--text);border-radius:8px;padding:3px 9px;font-weight:800;cursor:pointer}
.bks{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.bk{font-family:var(--mono);font-size:11.5px;border:1px solid var(--line2);background:var(--bg3);border-radius:8px;padding:3px 7px}
.bk b{font-weight:800}.bk .e{color:var(--green)}.bk .l{color:var(--dim)}
.meta{font-size:11.5px;color:var(--dim);margin-top:6px}
.meta b{color:var(--text)}
.copybar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px max(10px,env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%);display:flex;gap:8px}
.copybar .btn{flex:1;padding:12px}
.btn.copied{border-color:var(--green);color:var(--green)}
.empty{color:var(--dim);text-align:center;padding:24px 10px}
.rec{border:1px solid var(--line2);background:var(--bg2);border-radius:14px;padding:10px 12px;margin:8px 0}
.rr{display:grid;grid-template-columns:1fr auto auto auto;gap:4px 12px;font-size:13px;padding:3px 0}
.pos{color:var(--green)}.neg{color:var(--red)}
.day{display:grid;grid-template-columns:1fr auto auto auto;gap:6px 12px;width:100%;text-align:left;margin:8px 0 4px;padding:9px 12px;border-radius:10px;border:1px solid var(--line2);background:var(--bg2);color:var(--text);font-weight:700;font-size:12.5px}
.histbox{max-height:62vh;overflow-y:auto;border:1px solid var(--line2);border-radius:12px;padding:2px 8px 8px;margin-top:6px}
.res{font-weight:800;font-size:11px;border-radius:6px;padding:2px 6px}
.res.win{background:rgba(34,197,94,.16);color:var(--green)}.res.loss{background:rgba(255,92,92,.16);color:var(--red)}.res.push{background:rgba(139,150,163,.2)}
.gbtns{display:flex;gap:5px;margin-top:6px}.gbtns button{border:1px solid var(--line2);background:transparent;color:var(--text);border-radius:7px;padding:3px 9px;font-size:11.5px;font-weight:700}
</style>
</head>
<body>
<h1>FTN <b>Picks</b></h1>
<div class="sub">Paste FTN's model page, every book priced at the same line, cut what you don't want, copy.</div>
<div class="tabs"><button data-tab="picks" class="on">Picks</button><button data-tab="record">Record</button></div>

<div id="tab-picks">
  <div class="row"><button class="chip on" data-lg="ncaaf">CFB</button><button class="chip" data-lg="nfl">NFL</button>
    <label class="s">Min edge <input type="number" id="minEdge" step="0.5" value="5">%</label>
    <label class="s">Min $ <input type="number" id="minLiq" step="250" value="1000"></label></div>
  <textarea id="paste" placeholder="Select all on the FTN betting model page, copy, paste here"></textarea>
  <div class="row"><button class="btn go" id="parseBtn">Parse + price</button><button class="btn" id="reprice">Re-price</button><button class="btn" id="clearAll">Clear</button></div>
  <div class="msg" id="msg"></div>
  <div class="row"><input type="search" id="q" placeholder="Search a team…"><button class="btn" id="restore">Restore removed</button></div>
  <div id="list"></div>
</div>

<div id="tab-record" style="display:none">
  <div class="row"><button class="btn go" id="gradeBtn">Grade finished games</button></div>
  <div class="msg" id="gmsg"></div>
  <div id="record"></div>
</div>

<div class="copybar" id="copybar"><button class="btn go" id="copyBtn">Copy picks</button></div>

<script>
// ───────── basics ─────────
const LS = { get:(k,d)=>{ try{ const v=localStorage.getItem(k); return v==null?d:v; }catch(e){ return d; } }, set:(k,v)=>{ try{ localStorage.setItem(k,v); }catch(e){} } };
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const BACKEND = () => LS.get('oo_backend_url','https://nfl-props-tracker-1.vercel.app/api/odds');
async function oo(endpoint, params){
  const r=await fetch(BACKEND(),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({endpoint,params:params||{}})});
  const t=await r.text(); if(!r.ok) throw new Error('backend '+r.status); return JSON.parse(t);
}
const chunk=(a,n)=>{ const o=[]; for(let i=0;i<a.length;i+=n) o.push(a.slice(i,i+n)); return o; };
const imp = a => { a=Number(a); return a>0?100/(a+100):-a/(-a+100); };
const fmtAm = v => { const n=Math.round(Number(v)); return n>0?'+'+n:String(n); };
const usd = n => n>=1000?'$'+(n/1000).toFixed(1).replace(/\.0$/,'')+'k':'$'+Math.round(n);
// FTN's edge: model probability minus the price's implied probability (percentage points)
const edgeOf = (prob, price) => prob - imp(price)*100;
// worst price still at the min edge: implied = prob - minEdge, rounded toward the better side
function playTo(prob, minE){ const p=(prob-minE)/100; if(p<=0||p>=1) return null; return p>=0.5 ? -Math.floor(100*p/(1-p)) : Math.ceil(100*(1-p)/p); }

// ───────── books ─────────
// name = what the odds feed wants; out = how it's written in the copy; ftn = FTN's spelling (for "opened")
const BOOKS = [
  { k:'novig', name:'Novig', out:'Novig', ex:true }, { k:'polymarket', name:'Polymarket', out:'Polymarket', ex:true },
  { k:'kalshi', name:'Kalshi', out:'Kalshi', ex:true }, { k:'prophet x', name:'Prophet X', out:'ProphetX', ex:true },
  { k:'bet105', name:'bet105', out:'BET105' }, { k:'pinnacle', name:'Pinnacle', out:'Pinnacle' },
  { k:'betonline', name:'BetOnline', out:'BetOnline' }, { k:'bookmaker', name:'BookMaker', out:'Bookmaker' }, { k:'prime sports', name:'Prime Sports', out:'Bookmaker' },
  { k:'circa', name:'Circa', out:'Circa' }, { k:'fanduel', name:'FanDuel', out:'FanDuel', ftn:'Fan Duel' },
  { k:'draftkings', name:'DraftKings', out:'DraftKings', ftn:'Draft Kings' }, { k:'betmgm', name:'BetMGM', out:'BetMGM', ftn:'BetMGM' },
  { k:'caesars', name:'Caesars', out:'Caesars', ftn:'Caesars Sportbook' }, { k:'betrivers', name:'BetRivers', out:'BetRivers', ftn:'BetRivers' },
  { k:'fanatics', name:'Fanatics', out:'Fanatics', ftn:'Fanatics' } ];
const bookOf = n => BOOKS.find(b=>b.k===String(n||'').toLowerCase());
const OPEN_BOOKS = ['FanDuel','DraftKings','BetMGM','Caesars','BetRivers'];
const MARKETS = ['Moneyline','Point Spread','Total Points'];

// ───────── team names ─────────
const ALIAS = { umass:'massachusetts', uconn:'connecticut', pitt:'pittsburgh', cal:'california', uva:'virginia', usf:'south florida', fiu:'florida international', fau:'florida atlantic', wku:'western kentucky', ecu:'east carolina', odu:'old dominion', 'miami ohio':'miami oh', 'app state':'appalachian state', nmsu:'new mexico state', usm:'southern miss', ull:'louisiana', 'ul monroe':'louisiana monroe', 'louisiana-monroe':'louisiana monroe', 'miami fl':'miami', 'miami (fl)':'miami', 'miami florida':'miami', 'ole miss':'mississippi', 'nc state':'north carolina state', smu:'southern methodist', ucf:'central florida', byu:'brigham young', tcu:'texas christian', lsu:'louisiana state', unlv:'nevada las vegas', utsa:'texas san antonio', uab:'alabama birmingham' };
const norm = s => { let n=String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\(([^)]*)\)/g,' $1').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim(); return ALIAS[n]||n; };
// words that make a DIFFERENT school when added (Iowa vs Iowa State, Texas vs Texas Tech)
const SCHOOL_WORDS = new Set(['state','tech','international','southern','northern','eastern','western','central','am','a','christian','methodist','monroe','birmingham','san','antonio','las','vegas','oh','fl','st']);
function teamScore(a, b){
  a=norm(a); b=norm(b); if(!a||!b) return 0; if(a===b) return 3;
  const [s,l]=a.length<=b.length?[a,b]:[b,a]; if(!(l+' ').startsWith(s+' ')) return 0;
  const extra=l.slice(s.length).trim().split(' ');   // what the longer name adds: a mascot is fine, "State" is another school
  return extra.some(w=>SCHOOL_WORDS.has(w)) ? 0 : 2;
}

// ───────── FTN parse ─────────
function parseFTN(text){
  const lines=text.split('\n').map(l=>l.trim()).filter(Boolean);
  const dateRx=/^\d{2}\/\d{2}\s+\d{1,2}:\d{2}\s+[AP]M\s+ET$/, pctRx=/^-?\d+\.?\d*%$/, typeRx=/^(Total\s+[OU]|Spread|Moneyline|ML)$/, oddsRx=/^[+-]\d{2,5}$/, numRx=/^[+-]?\d+\.?\d*$/;
  const FTN_BOOKS=['novig','betrivers','draft kings','fan duel','betmgm','caesars sportbook','draftkings','fanduel','caesars','fanatics','bet365'];
  const out=[];
  for(let i=0;i<lines.length;i++){
    if(!dateRx.test(lines[i])) continue;
    const when=lines[i]; let team1='', bet1=false;
    for(let k=i-1;k>=Math.max(0,i-10);k--){ const c=lines[k]; if(c==='Bet'){ bet1=true; continue; }
      if(pctRx.test(c)||oddsRx.test(c)||numRx.test(c)||dateRx.test(c)||typeRx.test(c)) break; if(!team1) team1=c; }
    let team2='', bet2=false, type='', edge=null, prob=null, book='', line=null, odds=null, j=i+1;
    for(; j<lines.length && j<i+22; j++){
      const c=lines[j];
      if(c==='Bet'){ if(!type) bet2=true; continue; }
      if(typeRx.test(c) && !type){ type=c.replace(/\s+/g,' '); continue; }
      const pm=c.match(/^(-?\d+\.?\d*)%$/); if(pm){ if(edge===null) edge=+pm[1]; else if(prob===null) prob=+pm[1]; continue; }
      if(FTN_BOOKS.includes(c.toLowerCase()) && !book){ book=c; continue; }
      const ml=type==='Moneyline'||type==='ML';
      if(book && ml && oddsRx.test(c)){ odds=+c; break; }
      if(book && !ml && line===null && numRx.test(c)){ line=+c; continue; }
      if(book && line!==null && oddsRx.test(c)){ odds=+c; break; }
      if(!team2 && !type && !dateRx.test(c) && !numRx.test(c)) team2=c;
    }
    i=j;
    if(edge===null || prob===null || !type || !team1 || !team2 || odds===null) continue;
    const ml=type==='Moneyline'||type==='ML', tot=type.startsWith('Total');
    out.push({ id:`${team1}|${team2}|${type}|${bet2?team2:bet1?team1:''}`.toLowerCase(), when, team1, team2, type:tot?(type.endsWith('O')?'over':'under'):ml?'ml':'spread',
      betTeam: tot?null:(bet2?team2:bet1?team1:null), line: ml?null:line, ftnEdge:edge, prob, ftnBook:book, ftnOdds:odds });
  }
  return out;
}
// ───────── state ─────────
let league=LS.get('ftnp_league','ncaaf');
let picks=(()=>{ try{ return JSON.parse(LS.get('ftnp_picks','[]'))||[]; }catch(e){ return []; } })();
let removed=new Set((()=>{ try{ return JSON.parse(LS.get('ftnp_removed','[]'))||[]; }catch(e){ return []; } })());
let log=(()=>{ try{ return JSON.parse(LS.get('ftnp_log','[]'))||[]; }catch(e){ return []; } })();
const save=()=>{ LS.set('ftnp_picks',JSON.stringify(picks)); LS.set('ftnp_removed',JSON.stringify([...removed])); };
const saveLog=()=>LS.set('ftnp_log',JSON.stringify(log));
const minEdge=()=>Number($('#minEdge').value)||5, minLiq=()=>Number($('#minLiq').value)||0;
$('#minEdge').value=LS.get('ftnp_minedge','5'); $('#minLiq').value=LS.get('ftnp_minliq','1000');
const LG = { ncaaf:{ sport:'football', label:'CFB', espn:'football/college-football', espnQ:'&groups=80&limit=400' }, nfl:{ sport:'football', label:'NFL', espn:'football/nfl', espnQ:'' } };

// ───────── odds feed ─────────
async function fixturesFor(lg){
  const raw=[]; for(let page=1; page<=8; page++){ const r=await oo('/fixtures',{ sport:LG[lg].sport, league:lg, page }); (r?.data||[]).forEach(f=>raw.push(f)); if(!r?.has_more) break; }
  return raw.map(f=>{ const h=f.home_competitors?.[0]||{}, a=f.away_competitors?.[0]||{};
    return { id:f.id, start:f.start_date, status:f.status, home:{ id:h.id, name:h.name||f.home_team_display||'' }, away:{ id:a.id, name:a.name||f.away_team_display||'' } }; });
}
// FTN "10/31 1:00 PM ET" -> ms (this season)
function ftnTime(s){ const m=String(s||'').match(/(\d{2})\/(\d{2})\s+(\d{1,2}):(\d{2})\s+([AP])M/); if(!m) return null;
  const now=new Date(); let h=+m[3]%12+(m[5]==='P'?12:0); const d=Date.UTC(now.getFullYear(), +m[1]-1, +m[2], h+4, +m[4]);   // ET ~ UTC-4/5; close enough to pick the day
  return d-now.getTime()>200*864e5 ? d-365*864e5 : d; }
function matchFixture(p, fxs){
  let best=null, bs=0; const t=ftnTime(p.when);
  fxs.forEach(f=>{ const a=Math.min(teamScore(f.away.name,p.team1),teamScore(f.home.name,p.team2)), b=Math.min(teamScore(f.home.name,p.team1),teamScore(f.away.name,p.team2));
    let s=Math.max(a,b); if(!s) return; if(t && Math.abs(new Date(f.start).getTime()-t)>36*3600e3) return; if(s>bs){ bs=s; best=f; } });
  return best;
}
const isHome=(o,f)=>{ if(o.team_id && f.home.id) return String(o.team_id)===String(f.home.id); const sel=o.selection||''; return teamScore(sel,f.home.name)>=teamScore(sel,f.away.name); };
// exchange depth (order book) or a sportsbook's max
function liqOf(o){ if(o.limits?.max!=null) return { v:+o.limits.max, max:true };
  const ob=(Array.isArray(o.order_book)?o.order_book:[]).filter(l=>Array.isArray(l)&&l.length>=2); if(!ob.length) return null;
  const top=+o.price, pf=Math.abs(+ob[0][0]-top)<=Math.abs(+ob[0][1]-top); const tot=ob.reduce((s,l)=>s+(+(pf?l[1]:l[0])||0),0); return tot>0?{ v:tot, max:false }:null; }
// does this odds row price the pick, at the same line?
function rowFits(p, o, f){
  const m=String(o.market||'').toLowerCase();
  if(p.type==='over'||p.type==='under'){ if(!/^total points$/.test(m)) return false; const side=String(o.selection_line||o.selection||'').toLowerCase(); return side.includes(p.type) && o.points!=null && +o.points===p.line; }
  if(p.type==='spread' && !/^(point spread|spread)$/.test(m)) return false;
  if(p.type==='ml' && m!=='moneyline') return false;
  const team=isHome(o,f)?f.home.name:f.away.name; if(!p.betTeam || !teamScore(team,p.betTeam)) return false;
  return p.type==='ml' || (o.points!=null && +o.points===p.line);
}

async function price(){
  const btns=[$('#parseBtn'),$('#reprice')]; btns.forEach(b=>b.disabled=true);
  const say=(m,err)=>{ const el=$('#msg'); el.textContent=m; el.className='msg'+(err?' err':''); };
  try{
    say('Matching games…'); const fxs=await fixturesFor(league);
    picks.forEach(p=>{ const f=matchFixture(p,fxs); p.fx=f?{ id:f.id, start:f.start, home:f.home, away:f.away }:null; });
    const fxList=[...new Map(picks.filter(p=>p.fx).map(p=>[p.fx.id,p.fx])).values()];
    say(`Pricing ${fxList.length} games across ${BOOKS.length} books…`);
    const byFx={}; const jobs=[];
    chunk(fxList,5).forEach(fc=>BOOKS.forEach(b=>jobs.push(()=>oo('/fixtures/odds',{ fixture_id:fc.map(f=>f.id), sportsbook:[b.name], market:MARKETS })
      .then(r=>(r?.data||[]).forEach(d=>(d.odds||[]).forEach(o=>{ (byFx[d.id]=byFx[d.id]||[]).push(o); }))).catch(()=>{}))));
    let i=0; await Promise.all(Array.from({length:6},async()=>{ while(i<jobs.length){ const j=jobs[i++]; await j(); } }));
    picks.forEach(p=>{
      p.books=[]; if(!p.fx) return; const f=p.fx;
      (byFx[f.id]||[]).forEach(o=>{ const b=bookOf(o.sportsbook); if(!b || o.price==null || Math.abs(+o.price)>=10000 || !rowFits(p,o,f)) return;
        const e=edgeOf(p.prob,+o.price), L=liqOf(o);
        const cur=p.books.find(x=>x.out===b.out); if(cur && cur.price>=+o.price) return; if(cur) p.books.splice(p.books.indexOf(cur),1);
        p.books.push({ out:b.out, price:+o.price, edge:e, liq:L?L.v:null, max:L?L.max:false }); });
      p.books.sort((a,b)=>b.price-a.price);
    });
    // where each line opened (FanDuel first), one history pull per game with a pick
    say('Opening lines…');
    await Promise.all(fxList.map(async f=>{ let rows=[]; try{ const r=await oo('/fixtures/odds/historical',{ fixture_id:f.id, sportsbook:OPEN_BOOKS, market:MARKETS, is_main:true }); rows=r?.data?.[0]?.odds||[]; }catch(e){}
      picks.filter(p=>p.fx?.id===f.id).forEach(p=>{ p.open=null;
        for(const bn of OPEN_BOOKS){ const o=rows.find(o=>String(o.sportsbook).toLowerCase()===bn.toLowerCase() && o.olv?.price!=null && rowFits(p,{ ...o, points:o.olv.points??o.points },f)); if(o){ p.open={ price:+o.olv.price, book:bookOf(bn)?.ftn||bn }; break; } } }); }));
    save(); render();
    const nm=picks.filter(p=>!p.fx).length; say(`Priced ${picks.length-nm} picks${nm?` · ${nm} couldn't be matched to a game (FTN's price kept)`:''} · ${new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}`);
  }catch(e){ say('Pricing failed: '+e.message, true); }
  finally{ btns.forEach(b=>b.disabled=false); }
}

// ───────── list ─────────
const betTxt = p => p.type==='over'||p.type==='under' ? `${p.type} ${p.line}` : p.type==='ml' ? `${p.betTeam} ML` : `${p.betTeam} ${p.line>0?'+':''}${p.line}`;
// the books to show: at the min edge and min $ (unknown $ passes); none -> FTN's own book
function showBooks(p){
  const me=minEdge(), ml=minLiq();
  const b=(p.books||[]).filter(x=>x.edge>=me-1e-9 && (x.liq==null || x.liq>=ml || !x.liq));
  if(b.length) return b;
  return p.ftnEdge>=me ? [{ out:{'fan duel':'FanDuel','draft kings':'DraftKings','caesars sportbook':'Caesars'}[p.ftnBook.toLowerCase()]||p.ftnBook, price:p.ftnOdds, edge:edgeOf(p.prob,p.ftnOdds), liq:null, ftn:true }] : [];
}
const visible = () => picks.filter(p=>showBooks(p).length).sort((a,b)=>(ftnTime(a.when)||0)-(ftnTime(b.when)||0) || b.ftnEdge-a.ftnEdge);
function lineTxt(p, n){
  const bs=showBooks(p), pt=playTo(p.prob, minEdge());
  const bk = bs.length===1 ? `${fmtAm(bs[0].price)} ${bs[0].out}${bs[0].liq!=null?' '+usd(bs[0].liq)+(bs[0].max?' max':''):''}  edge ${bs[0].edge.toFixed(1)}%`
    : bs.map(x=>`${fmtAm(x.price)} ${x.out}${x.liq!=null?' '+usd(x.liq)+(x.max?' max':''):''} (${x.edge.toFixed(1)}%)`).join(' | ');
  return `${n}. [${p.when}]  ${p.team1} vs ${p.team2}  ${betTxt(p)}  ${bk}${p.open?`  (opened ${fmtAm(p.open.price)} ${p.open.book})`:''}${pt!=null?`  play to ${fmtAm(pt)}`:''}`;
}
function render(){
  const q=norm($('#q').value), list=visible().filter(p=>!q || norm(p.team1).includes(q) || norm(p.team2).includes(q));
  const on=list.filter(p=>!removed.has(p.id)).length;
  $('#copyBtn').textContent=`Copy ${visible().filter(p=>!removed.has(p.id)).length} picks`;
  $('#list').innerHTML = !picks.length ? '<div class="empty">Paste FTN\'s model page above and tap Parse + price.</div>'
    : !list.length ? `<div class="empty">Nothing ${q?'for that search':'at '+minEdge()+'%+'} right now.</div>`
    : list.map(p=>{ const off=removed.has(p.id), bs=showBooks(p), pt=playTo(p.prob,minEdge());
      return `<div class="card${off?' off':''}"><div class="top"><div><div class="gm">${esc(p.when)} · ${esc(p.team1)} vs ${esc(p.team2)}</div><div class="bet">${esc(betTxt(p))}</div>
        <div class="ftn">FTN ${p.prob.toFixed(1)}% · ${esc(p.ftnBook)} ${fmtAm(p.ftnOdds)} (${p.ftnEdge.toFixed(1)}%)${p.fx?'':' · not matched to a game'}</div></div>
        <div style="text-align:right"><button class="x" data-rm="${esc(p.id)}">${off?'↺':'✕'}</button></div></div>
        <div class="bks">${bs.map(x=>`<span class="bk"><b>${fmtAm(x.price)}</b> ${esc(x.out)}${x.liq!=null?` <span class="l">${usd(x.liq)}${x.max?' max':''}</span>`:''} <span class="e">${x.edge.toFixed(1)}%</span></span>`).join('')}</div>
        <div class="meta">${p.open?`opened <b>${fmtAm(p.open.price)}</b> ${esc(p.open.book)} · `:''}${pt!=null?`play to <b>${fmtAm(pt)}</b>`:''}</div></div>`; }).join('');
  document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{ const id=b.dataset.rm; removed.has(id)?removed.delete(id):removed.add(id); save(); render(); });
}
async function copyPicks(){
  const list=visible().filter(p=>!removed.has(p.id)); if(!list.length) return;
  const text=`${LG[league].label} MAINLINES\n\n`+list.map((p,i)=>lineTxt(p,i+1)).join('\n\n');
  try{ await navigator.clipboard.writeText(text); }catch(e){ const ta=document.createElement('textarea'); ta.value=text; ta.style.cssText='position:fixed;opacity:0'; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); }catch(_){} ta.remove(); }
  // log what was sent (once per pick) for grading: best listed price
  list.forEach(p=>{ if(log.some(l=>l.id===p.id && l.when===p.when)) return; const b=showBooks(p)[0];
    log.push({ id:p.id, when:p.when, league, team1:p.team1, team2:p.team2, type:p.type, betTeam:p.betTeam, line:p.line, prob:p.prob, price:b.price, book:b.out, edge:b.edge, fx:p.fx, at:Date.now(), result:null }); });
  saveLog();
  const btn=$('#copyBtn'); btn.classList.add('copied'); btn.textContent='✓ Copied'; setTimeout(()=>{ btn.classList.remove('copied'); render(); },1300);
}

// ───────── grading: OpticOdds results, ESPN when the feed has nothing ─────────
const units = (r, price) => r==='win' ? (price>0?price/100:100/-price) : r==='loss' ? -1 : 0;
function gradeOne(l, home, away){   // home/away = final scores of the matched fixture
  const t1home = l.fx ? teamScore(l.fx.home.name,l.team1)>=teamScore(l.fx.away.name,l.team1) : true;
  const tot=home+away;
  if(l.type==='over') return tot>l.line?'win':tot<l.line?'loss':'push';
  if(l.type==='under') return tot<l.line?'win':tot>l.line?'loss':'push';
  const betHome = l.fx ? teamScore(l.fx.home.name,l.betTeam)>=teamScore(l.fx.away.name,l.betTeam) : (l.betTeam===l.team1)===t1home;
  const mine=betHome?home:away, theirs=betHome?away:home;
  if(l.type==='ml') return mine>theirs?'win':mine<theirs?'loss':'push';
  const m=mine-theirs+l.line; return m>0?'win':m<0?'loss':'push';
}
async function espnFinal(l){
  const t=ftnTime(l.when); if(!t) return null; const d=new Date(t-5*3600e3), ymd=`${d.getUTCFullYear()}${String(d.getUTCMonth()+1).padStart(2,'0')}${String(d.getUTCDate()).padStart(2,'0')}`;
  const L=LG[l.league||'ncaaf']; let j; try{ j=await (await fetch(`https://site.api.espn.com/apis/site/v2/sports/${L.espn}/scoreboard?dates=${ymd}${L.espnQ}`)).json(); }catch(e){ return null; }
  for(const ev of j?.events||[]){ const c=ev.competitions?.[0]; if(!c?.status?.type?.completed) continue;
    const h=c.competitors.find(x=>x.homeAway==='home'), a=c.competitors.find(x=>x.homeAway==='away'); if(!h||!a) continue;
    const nm=x=>[x.team.location,x.team.displayName,x.team.shortDisplayName].map(v=>v||'');
    const sc=(x,t)=>Math.max(...nm(x).map(n=>teamScore(n,t)));
    const ok=(Math.min(sc(a,l.team1),sc(h,l.team2))>0) || (Math.min(sc(h,l.team1),sc(a,l.team2))>0);
    if(ok) return { home:+h.score, away:+a.score, homeName:h.team.location||h.team.displayName, awayName:a.team.location||a.team.displayName }; }
  return null;
}
async function grade(){
  const btn=$('#gradeBtn'); btn.disabled=true; const say=m=>$('#gmsg').textContent=m;
  try{
    const open=log.filter(l=>!l.result && (ftnTime(l.when)||0)<Date.now()); if(!open.length){ say('Nothing waiting to grade.'); return; }
    say(`Checking ${open.length} picks…`);
    const ids=[...new Set(open.map(l=>l.fx?.id).filter(Boolean))], res={};
    for(const c of chunk(ids,5)){ try{ const r=await oo('/fixtures/results',{ fixture_id:c }); (r?.data||[]).forEach(x=>{ if(x?.fixture?.id) res[x.fixture.id]=x; }); }catch(e){} }
    let n=0;
    for(const l of open){
      let home=null, away=null; const R=l.fx&&res[l.fx.id];
      if(R && /completed|closed|final|ended/i.test(String(R.fixture?.status||''))){ home=+R.scores?.home?.total; away=+R.scores?.away?.total; }
      if(home==null || isNaN(home) || isNaN(away)){ const e=await espnFinal(l); if(e){ if(!l.fx) l.fx={ home:{name:e.homeName}, away:{name:e.awayName} }; home=e.home; away=e.away; l.src='espn'; } }
      if(home==null || isNaN(home) || isNaN(away)) continue;
      l.score=`${l.fx?.away?.name||''} ${away} - ${l.fx?.home?.name||''} ${home}`; l.result=gradeOne(l,home,away); n++;
    }
    saveLog(); renderRecord(); say(`Graded ${n} of ${open.length}.`);
  } finally{ btn.disabled=false; }
}
const dayOpen=new Set();
function rec(list){ const g=list.filter(l=>l.result); const w=g.filter(l=>l.result==='win').length, lo=g.filter(l=>l.result==='loss').length, p=g.filter(l=>l.result==='push').length;
  const u=g.reduce((s,l)=>s+units(l.result,l.price),0), risk=g.filter(l=>l.result!=='push').length; return { w, l:lo, p, u, roi:risk?u/risk*100:null }; }
const recRow=(label,r)=>`<div class="rr"><span>${esc(label)}</span><span>${r.w}-${r.l}${r.p?'-'+r.p:''}</span><b class="${r.u>0?'pos':r.u<0?'neg':''}">${r.u>=0?'+':''}${r.u.toFixed(2)}u</b><span class="${r.roi>0?'pos':r.roi<0?'neg':''}">${r.roi!=null?(r.roi>=0?'+':'')+r.roi.toFixed(1)+'%':''}</span></div>`;
function renderRecord(){
  if(!log.length){ $('#record').innerHTML='<div class="empty">Picks you copy out get logged here and graded after the games.</div>'; return; }
  const by=k=>{ const m={}; log.forEach(l=>{ const x=k(l); (m[x]=m[x]||[]).push(l); }); return Object.entries(m).map(([k,l])=>recRow(k,rec(l))).join(''); };
  const eb=l=>{ const e=l.edge; return e>=10?'10%+ edge':e>=7.5?'7.5–10% edge':'5–7.5% edge'; };
  const day=l=>{ const t=ftnTime(l.when); return t?new Date(t-5*3600e3).toISOString().slice(0,10):'unknown'; };
  const days={}; log.forEach(l=>{ (days[day(l)]=days[day(l)]||[]).push(l); });
  const open=log.filter(l=>!l.result).length;
  $('#record').innerHTML=`<div class="rec">${recRow('All',rec(log))}${open?`<div class="msg">${open} waiting to grade</div>`:''}
    <div class="msg">By bet</div>${by(l=>l.type==='spread'?'Spread':l.type==='ml'?'Moneyline':l.type==='over'?'Over':'Under')}
    <div class="msg">By edge</div>${by(eb)}<div class="msg">By book</div>${by(l=>l.book)}<div class="msg">By league</div>${by(l=>LG[l.league||'ncaaf'].label)}</div>
    <div class="histbox">${Object.keys(days).sort().reverse().map(d=>{ const L=days[d], r=rec(L), o=dayOpen.has(d);
      return `<button class="day" data-day="${d}"><span>${o?'▾':'▸'} ${d==='unknown'?'Unknown':new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}</span><span>${r.w}-${r.l}${r.p?'-'+r.p:''}</span><b class="${r.u>0?'pos':r.u<0?'neg':''}">${r.u>=0?'+':''}${r.u.toFixed(2)}u</b><span>${L.length}</span></button>`
        +(o?L.map((l,ix)=>`<div class="card"><div class="gm">${esc(l.when)} · ${esc(l.team1)} vs ${esc(l.team2)}</div><div class="bet">${esc(betTxt(l))} <span style="font-weight:600">${fmtAm(l.price)} ${esc(l.book)}</span> ${l.result?`<span class="res ${l.result}">${l.result.toUpperCase()}</span>`:''}</div>
          <div class="meta">${l.score?esc(l.score)+(l.src==='espn'?' (ESPN)':''):'not graded yet'} · edge ${l.edge.toFixed(1)}%</div>
          <div class="gbtns"><button data-g="${log.indexOf(l)}|win">W</button><button data-g="${log.indexOf(l)}|loss">L</button><button data-g="${log.indexOf(l)}|push">P</button><button data-g="${log.indexOf(l)}|">Reopen</button><button data-g="${log.indexOf(l)}|del">Delete</button></div></div>`).join(''):''); }).join('')}</div>`;
  document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{ const d=b.dataset.day; dayOpen.has(d)?dayOpen.delete(d):dayOpen.add(d); renderRecord(); });
  document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{ const [i,r]=b.dataset.g.split('|'); const l=log[+i]; if(!l) return;
    if(r==='del'){ if(!confirm('Delete this pick from the record?')) return; log.splice(+i,1); } else { l.result=r||null; l.manual=!!r; } saveLog(); renderRecord(); });
}

// ───────── wiring ─────────
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{ document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('on',x===b));
  $('#tab-picks').style.display=b.dataset.tab==='picks'?'':'none'; $('#tab-record').style.display=b.dataset.tab==='record'?'':'none'; $('#copybar').style.display=b.dataset.tab==='picks'?'':'none'; if(b.dataset.tab==='record') renderRecord(); });
document.querySelectorAll('[data-lg]').forEach(b=>{ b.classList.toggle('on',b.dataset.lg===league); b.onclick=()=>{ league=b.dataset.lg; LS.set('ftnp_league',league); document.querySelectorAll('[data-lg]').forEach(x=>x.classList.toggle('on',x===b)); }; });
$('#parseBtn').onclick=()=>{ const t=$('#paste').value; if(!t.trim()){ $('#msg').textContent='Paste FTN first.'; return; }
  const got=parseFTN(t); if(!got.length){ $('#msg').textContent='No picks found — copy the whole model page and paste again.'; $('#msg').className='msg err'; return; }
  picks=got; removed.clear(); save(); render(); price(); };
$('#reprice').onclick=()=>{ if(picks.length) price(); };
$('#clearAll').onclick=()=>{ if(!confirm('Clear the parsed picks? (Your record stays.)')) return; picks=[]; removed.clear(); $('#paste').value=''; save(); render(); };
$('#restore').onclick=()=>{ removed.clear(); save(); render(); };
$('#q').oninput=render;
['minEdge','minLiq'].forEach(id=>$('#'+id).oninput=()=>{ LS.set(id==='minEdge'?'ftnp_minedge':'ftnp_minliq',$('#'+id).value); render(); });
$('#copyBtn').onclick=copyPicks;
$('#gradeBtn').onclick=grade;
render();
</script>
