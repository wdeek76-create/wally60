<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Steam">
<meta name="theme-color" content="#171b24">
<title>UFC Steam Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#171b24;--bg2:#1e2430;--bg3:#242b3c;--line:#1a1d22;--line2:#262a33;
  --text:#fff;--purple:#a855f7;--green:#22c55e;--red:#ff5c5c;--cyan:#7dd3fc;--amber:#fbbf24;
  --mono:'JetBrains Mono','Menlo',monospace;--sans:'Plus Jakarta Sans','Helvetica Neue',sans-serif;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;-webkit-text-size-adjust:100%;touch-action:manipulation;overscroll-behavior:none}
body{display:flex;flex-direction:column;min-height:100dvh}
button{cursor:pointer;border:none;background:none;color:inherit;font-family:inherit}

.hdr{position:sticky;top:0;z-index:20;background:rgba(23,27,36,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:calc(var(--sat) + 10px) calc(var(--sar) + 14px) 10px calc(var(--sal) + 14px)}
.htitle{display:flex;align-items:center;justify-content:space-between;gap:8px}
.htitle h1{font-size:15px;font-weight:800;letter-spacing:.2px}
.hsub{font-family:var(--mono);font-size:10px;color:#fff;opacity:.65;margin-top:2px;letter-spacing:.3px}
.hsub .live{color:var(--green)}
.hbtns{display:flex;gap:6px}
.ib{width:32px;height:32px;border-radius:10px;background:var(--bg2);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:14px}
.ib.spin{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.chips{display:flex;gap:6px;margin-top:10px}
.chip{flex:0 0 auto;padding:6px 13px;border-radius:999px;border:1px solid var(--line2);background:var(--bg2);color:#fff;font-weight:700;font-size:11.5px;letter-spacing:.3px}
.chip.on{background:var(--purple);border-color:var(--purple)}

.sumrow{display:flex;gap:8px;padding:10px 14px 0}
.sumcell{flex:1;background:var(--bg2);border:1px solid var(--line2);border-radius:12px;padding:8px 6px;text-align:center}
.sumv{font-family:var(--mono);font-size:16px;font-weight:800;color:#fff}
.suml{font-size:8.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:#fff;opacity:.55;margin-top:2px}

main{flex:1;padding:10px calc(var(--sar) + 12px) 40px calc(var(--sal) + 12px)}
.empty,.loading{text-align:center;padding:60px 20px;color:#fff;opacity:.5;font-size:13px}
.loading .spin{width:22px;height:22px;border-radius:50%;border:2px solid var(--line2);border-top-color:var(--purple);margin:0 auto 10px;animation:spin .8s linear infinite}

.card{background:var(--bg2);border:1px solid var(--line2);border-radius:14px;padding:11px 12px;margin-bottom:8px;cursor:pointer;transition:border-color .15s}
@keyframes cardPop{0%{box-shadow:0 0 0 0 rgba(251,191,36,.8),0 0 20px 2px rgba(251,191,36,.5);border-color:var(--amber)}100%{box-shadow:0 0 0 0 rgba(251,191,36,0),0 0 0 0 rgba(251,191,36,0);border-color:var(--line2)}}
.card.pop{animation:cardPop 1.8s ease-out}
.card.pinned{border-color:var(--purple);box-shadow:0 0 0 1px var(--purple)}
.crow1{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cname{font-weight:800;font-size:13.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctag{font-family:var(--mono);font-size:9px;font-weight:800;letter-spacing:.4px;padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.08);color:#fff;flex:0 0 auto;text-transform:uppercase}
.csub{font-family:var(--mono);font-size:10px;color:#fff;opacity:.6;margin-top:3px}
.steam{display:flex;align-items:center;gap:6px;margin-top:8px;padding:7px 9px;border-radius:10px;background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.3)}
.steam .sbook{font-size:9px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--amber)}
.steam .smove{font-family:var(--mono);font-size:12px;font-weight:800;color:#fff}
.steam .scents{margin-left:auto;font-family:var(--mono);font-size:10px;font-weight:800;color:var(--amber)}
.fairrow{display:flex;align-items:center;justify-content:space-between;margin-top:8px;font-family:var(--mono);font-size:10.5px;color:#fff;opacity:.7}
.fairrow b{color:var(--cyan);opacity:1}
.mybooks{display:flex;flex-direction:column;gap:5px;margin-top:8px}
.mybk{display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:9px;background:rgba(255,255,255,.03);border:1px solid var(--line2)}
.mybk img{width:15px;height:15px;border-radius:4px;object-fit:cover;flex:0 0 auto}
.mybk .bn{font-size:10.5px;font-weight:700;color:#fff;flex:1;min-width:0}
.mybk .bp{font-family:var(--mono);font-size:11px;font-weight:800;color:#fff}
.mybk .bev{font-family:var(--mono);font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:999px;min-width:52px;text-align:center}
.mybk.pos{background:rgba(34,197,94,.08);border-color:rgba(34,197,94,.35)}
.mybk.pos .bev{background:rgba(34,197,94,.18);color:var(--green)}
.mybk.neg .bev{background:rgba(255,255,255,.06);color:#fff;opacity:.55}
.mybk .blim{font-family:var(--mono);font-size:8.5px;font-weight:700;color:#fff;opacity:.5;white-space:nowrap}
.corr{margin-top:7px;padding:6px 9px;border-radius:9px;font-size:10px;font-weight:700;line-height:1.35}
.corr.yes{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);color:var(--green)}
.corr.no{background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.3);color:var(--amber)}
.crecent{margin-top:7px;font-family:var(--mono);font-size:9px;color:#fff;opacity:.5}
.ctap{margin-top:7px;font-size:8.5px;font-weight:700;color:var(--purple);opacity:.7;text-align:center}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sab) + 16px);background:var(--bg3);border:1px solid var(--line2);color:#fff;padding:9px 14px;border-radius:10px;font-size:12px;z-index:50;opacity:0;transition:opacity .15s;pointer-events:none;max-width:88vw;text-align:center}
.toast.on{opacity:1}
</style>
</head>
<body>

<div class="hdr">
  <div class="htitle">
    <div>
      <h1>UFC Steam Tracker</h1>
      <div class="hsub" id="hsub">Pinnacle/BetOnline moves · <span class="live">●</span> starting…</div>
    </div>
    <div class="hbtns">
      <button class="ib" id="reload" title="Refresh now">⟳</button>
      <button class="ib" id="resetBtn" title="Reset tracking">↺</button>
    </div>
  </div>
  <div class="chips">
    <button class="chip on" data-mkey="all">All</button>
    <button class="chip" data-mkey="ml">Moneyline</button>
    <button class="chip" data-mkey="gtd">Go the Distance</button>
    <button class="chip" data-mkey="rounds">Total Rounds</button>
  </div>
</div>

<div class="sumrow">
  <div class="sumcell"><div class="sumv" id="sumMoves">0</div><div class="suml">Steam Moves</div></div>
  <div class="sumcell"><div class="sumv" id="sumEV">0</div><div class="suml">+EV Books Found</div></div>
  <div class="sumcell"><div class="sumv" id="sumBest">—</div><div class="suml">Best EV</div></div>
</div>

<main><div id="view"><div class="loading"><div class="spin"></div>Loading UFC fixtures…</div></div></main>
<div class="toast" id="toast"></div>

<script>
// ───────────────────────── shared helpers (same conventions as the other tools) ─────────────────────────
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS = { get:(k,d)=>{ try{ const v=localStorage.getItem(k); return v==null?d:v; }catch(e){ return d; } }, set:(k,v)=>{ try{ localStorage.setItem(k,v); }catch(e){} } };
const BACKEND_DEFAULT = 'https://nfl-props-tracker-1.vercel.app/api/odds';
const getBackend = () => LS.get('oo_backend_url', BACKEND_DEFAULT);
async function oo(endpoint, params){
  const r = await fetch(getBackend(), { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ endpoint, params:params||{} }) });
  const text = await r.text();
  if(!r.ok){ let m=text; try{ const j=JSON.parse(text); m=j.error+(j.body?' — '+j.body:''); }catch(e){} throw new Error(`backend ${r.status}: ${m}`); }
  return JSON.parse(text);
}
const fmtAm = v => { const n=Number(v); return isNaN(n)?String(v):(n>0?'+'+n:String(n)); };
const toDec = a => { a=Number(a); return a>0?1+a/100:1+100/Math.abs(a); };
const impliedProb = a => 1/toDec(a);
const cleanSel = n => String(n||'').replace(/\s*\([^)]*\)\s*$/,'').trim();
const normName = n => String(n||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/['’.`]/g,'').replace(/[^a-z ]/g,' ').replace(/\s+/g,' ').trim();
const titleCase = s => String(s||'').split(/\s+/).map(w => w && w.length<=4 && w===w.toUpperCase() && /[A-Z]/.test(w) ? w : (w.charAt(0).toUpperCase()+w.slice(1).toLowerCase())).join(' ');
const chunk = (a,n) => { const o=[]; for(let i=0;i<a.length;i+=n) o.push(a.slice(i,i+n)); return o; };
const etTime = iso => { try{ return new Date(iso).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:'America/New_York'}); }catch(e){ return ''; } };
const sideOf = o => { const s=String(o.selection_line||'').toLowerCase(); return s==='over'||s==='under' ? s : 'single'; };
const centsDiff = (a,b) => { a=Number(a); b=Number(b); if((a<0)===(b<0)) return Math.abs(a-b); return Math.abs(Math.abs(a)-100)+Math.abs(Math.abs(b)-100); };
let toastT; const toast = m => { const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),2200); };

// ───────────────────────── books ─────────────────────────
// The two sharp books whose moves are the trigger. Everything else in BOOKS is "my books" — where
// we look for a price that hasn't caught up yet, i.e. the EV opportunity.
const SHARP = ['Pinnacle','BetOnline'];
const MY_BOOKS = ['Props Builder','FanDuel','Novig','Prophet X','Kalshi','bet105','DraftKings','Fliff'];
const BOOKS = [...SHARP, ...MY_BOOKS];
const BOOK_REQ = [...BOOKS,'Courtside','Onyx Odds'];
const SHORT = { 'props builder':'PB','fanduel':'FD','novig':'Novig','prophet x':'PX','kalshi':'Kalshi','pinnacle':'Pin','bet105':'b105','draftkings':'DK','fliff':'Fliff','betonline':'BOL' };
const canonBook = n => { const k=String(n||'').toLowerCase(); if(k==='courtside'||k==='onyx odds') return 'draftkings'; return k; };
const bookLabel = n => { const k=canonBook(n); return BOOKS.find(b=>b.toLowerCase()===k) || n; };
const bookShort = n => SHORT[canonBook(n)] || n;
const SHARP_KEYS = SHARP.map(b=>b.toLowerCase());
let bookLogos = {};
async function loadBookLogos(){
  try{ const c=JSON.parse(LS.get('oo_book_logos','null')); if(c && Date.now()-c.at<86400e3){ bookLogos=c.map; return; } }catch(e){}
  try{ const r=await oo('/sportsbooks',{}); const map={}; (r?.data||[]).forEach(b=>{ if(b?.name&&b?.logo) map[String(b.name).toLowerCase()]=b.logo; }); bookLogos=map; LS.set('oo_book_logos',JSON.stringify({at:Date.now(),map})); }
  catch(e){ console.warn('[steam] sportsbook logos failed',e.message); }
}
const bookLogo = n => { const k=canonBook(n); return bookLogos[String(n||'').toLowerCase()] || bookLogos[k] || ''; };

// ───────────────────────── UFC markets ─────────────────────────
// Matched by keyword against whatever /fixtures/odds actually returns, same approach as the other
// tools (request everything, classify client-side rather than guessing exact market-name strings).
const MMA_ML = new Set(['moneyline','fight winner','to win fight','winner']);
const GTD_RE = /(go the distance|goes the distance)/;
const ROUNDS_RE = /total rounds?|rounds? over.?under/;
const MKEY_LABEL = { ml:'Moneyline', gtd:'Go the Distance', rounds:'Total Rounds' };
function marketKeyFor(name){
  const m = String(name||'').toLowerCase();
  if(MMA_ML.has(m)) return 'ml';
  if(GTD_RE.test(m)) return 'gtd';
  if(ROUNDS_RE.test(m) && !/method|group/.test(m)) return 'rounds';
  return null;
}

// ───────────────────────── fixtures (pre-game only, same rule as exchange-order-flow) ─────────────────────────
let fixtures = [];
let lastFixtureFetch = 0;
async function loadFixtures(){
  const raw=[]; let page=1;
  for(let i=0;i<20;i++){ const r=await oo('/fixtures',{sport:'mma',league:'ufc',page}); (r?.data||[]).forEach(f=>raw.push(f)); if(!r?.has_more) break; page++; }
  const now=Date.now();
  fixtures = raw.filter(f=>{ const t=new Date(f.start_date).getTime(); return t>now && !f.is_live && f.status!=='live' && f.status!=='completed' && f.status!=='cancelled'; })
    .map(f=>({ id:f.id, start:f.start_date, card:f.tournament?.name||'',
      home:{name:f.home_competitors?.[0]?.name||''}, away:{name:f.away_competitors?.[0]?.name||''} }));
  lastFixtureFetch = Date.now();
}

// ───────────────────────── state ─────────────────────────
// slotKey = mkey|fixtureId|line|sideKey — one tracked side of one market. sideKey is the fighter's
// name for ml, 'yes'/'no' for gtd, 'over'/'under' for rounds.
const MOVE_THRESHOLD_CENTS = 15;
const REFRESH_MS = 30000;
let slots = {};      // slotKey -> { meta, prices:{book:{price,at}} }
let moveLog = [];    // recent steam-move events, newest first, capped
let activeMkey = 'all';
let pinned = new Set();

function loadState(){
  try{ const raw=JSON.parse(LS.get('steam_state','null')); if(raw){ slots=raw.slots||{}; moveLog=raw.moveLog||[]; } }catch(e){}
}
let saveT;
function saveState(){ clearTimeout(saveT); saveT=setTimeout(()=>{ try{ LS.set('steam_state', JSON.stringify({slots,moveLog})); }catch(e){} },800); }
function resetState(){ slots={}; moveLog=[]; try{ localStorage.removeItem('steam_state'); }catch(e){} render(); toast('Tracking reset'); }

function slotKeyFor(mkey, fx, line, sideKey){ return `${mkey}|${fx}|${line??''}|${sideKey}`; }
function oppositeSideKey(mkey, sideKey, fixtureId){
  if(mkey==='rounds') return sideKey==='over' ? 'under' : sideKey==='under' ? 'over' : null;
  if(mkey==='gtd') return sideKey==='yes' ? 'no' : sideKey==='no' ? 'yes' : null;
  if(mkey==='ml'){
    const f = fixtures.find(x=>x.id===fixtureId); if(!f) return null;
    const homeKey=normName(f.home.name), awayKey=normName(f.away.name);
    if(sideKey===homeKey) return awayKey; if(sideKey===awayKey) return homeKey;
    return null;
  }
  return null;
}

function processRow(o, fixtureMap){
  const mkey = marketKeyFor(o.market); if(!mkey) return;
  const sel = cleanSel(o.selection||o.name); if(!sel) return;
  const sn = normName(sel);
  let sideKey=null, line=null;
  if(mkey==='rounds'){ const side=sideOf(o); if(side==='single') return; sideKey=side; line=o.points; }
  else if(mkey==='gtd'){ if(sn==='yes'||sn==='no') sideKey=sn; else return; }
  else if(mkey==='ml'){ if(/^(draw|tie|no contest)\b/.test(sn)) return; sideKey=sn; }
  if(!sideKey) return;

  const key = slotKeyFor(mkey, o._fx, line, sideKey);
  const bk = canonBook(o.sportsbook);
  if(!slots[key]){
    const fx = fixtureMap[o._fx];
    const label = mkey==='ml' ? titleCase(sel) : mkey==='gtd' ? (sideKey==='yes'?'Yes':'No') : (sideKey==='over'?'Over':'Under');
    slots[key] = { meta:{ mkey, fx:o._fx, line, sideKey, label,
      game: fx ? `${fx.away.name||''} @ ${fx.home.name||''}` : '', card: fx?.card||'', start: fx?.start||null }, prices:{} };
  }
  const slot = slots[key];
  const prev = slot.prices[bk]?.price;
  const limit = o.limits?.max!=null ? Number(o.limits.max) : null;
  slot.prices[bk] = { price:Number(o.price), at:Date.now(), limit };
  if(SHARP_KEYS.includes(bk) && prev!=null){
    const cents = centsDiff(prev, o.price);
    if(cents >= MOVE_THRESHOLD_CENTS){
      slot.movedAt = Date.now(); slot.movedBook = bk; slot.moveFrom = prev; slot.moveTo = Number(o.price); slot.moveCents = Math.round(cents); slot.moveLimit = limit;
      slot._justUpdated = true;
      moveLog.unshift({ key, bk, from:prev, to:Number(o.price), cents:Math.round(cents), at:Date.now(), label:slot.meta.label, game:slot.meta.game });
      moveLog = moveLog.slice(0,60);
    }
  }
}
// Real steam pushes BOTH sides of the market — a book shortening Fighter A should be laying off
// by drifting Fighter B (or Under, or No) the other way, on the same book, around the same time.
// This looks up the opposite side's own move (if any) so the card can show that confirmation
// (or flag its absence) instead of leaving each side's move looking like an isolated event.
const CORRELATION_WINDOW_MS = 10*60000;
function oppositeMoveFor(slot){
  const oppKey = oppositeSideKey(slot.meta.mkey, slot.meta.sideKey, slot.meta.fx); if(!oppKey) return undefined;
  const oppSlot = slots[slotKeyFor(slot.meta.mkey, slot.meta.fx, slot.meta.line, oppKey)]; if(!oppSlot) return undefined;
  if(!oppSlot.movedAt || oppSlot.movedBook!==slot.movedBook) return null;
  if(Math.abs(oppSlot.movedAt-slot.movedAt) > CORRELATION_WINDOW_MS) return null;
  return { label:oppSlot.meta.label, from:oppSlot.moveFrom, to:oppSlot.moveTo, cents:oppSlot.moveCents };
}

// De-vigged fair probability for this slot's side, blended across whichever sharp book(s) are
// currently quoting BOTH this side and its opposite ("boths fair" — average Pinnacle's and
// BetOnline's own no-vig read when both are available, not just whichever one moved).
function fairProbFor(slot){
  const oppKey = oppositeSideKey(slot.meta.mkey, slot.meta.sideKey, slot.meta.fx); if(!oppKey) return null;
  const oppSlot = slots[slotKeyFor(slot.meta.mkey, slot.meta.fx, slot.meta.line, oppKey)]; if(!oppSlot) return null;
  const probs=[];
  SHARP_KEYS.forEach(bk=>{
    const myP=slot.prices[bk]?.price, oppP=oppSlot.prices[bk]?.price;
    if(myP==null||oppP==null) return;
    const iMy=impliedProb(myP), iOpp=impliedProb(oppP), total=iMy+iOpp;
    if(total>0) probs.push(iMy/total);
  });
  if(!probs.length) return null;
  return { prob: probs.reduce((a,b)=>a+b,0)/probs.length, books: probs.length };
}
function evFor(fairProb, price){ return fairProb*toDec(price)-1; }

// ───────────────────────── polling ─────────────────────────
let polling=false;
async function pollOnce(showSpin){
  if(polling) return; polling=true;
  const spinBtn=$('#reload'); if(showSpin) spinBtn.classList.add('spin');
  try{
    if(!fixtures.length || Date.now()-lastFixtureFetch>300000) await loadFixtures().catch(e=>console.warn('[steam] fixtures failed',e.message));
    const fx = fixtures.filter(f=>new Date(f.start).getTime()>Date.now());
    if(fx.length){
      const fixtureMap={}; fx.forEach(f=>fixtureMap[f.id]=f);
      for(const fxChunk of chunk(fx.map(f=>f.id),5)){
        for(const bkChunk of chunk(BOOK_REQ,5)){
          try{
            const r = await oo('/fixtures/odds', { fixture_id:fxChunk, sportsbook:bkChunk, is_main:true });
            const rows=[]; (r?.data||[]).forEach(d=>(d.odds||[]).forEach(o=>{ o._fx=d.id; rows.push(o); }));
            rows.forEach(o=>processRow(o, fixtureMap));
          }catch(e){ console.warn('[steam] odds chunk failed', e.message); }
        }
      }
    }
    saveState();
    render();
  } finally {
    polling=false;
    if(showSpin) spinBtn.classList.remove('spin');
    $('#hsub').innerHTML = `Pinnacle/BetOnline moves · <span class="live">●</span> live · updated ${new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit',second:'2-digit'})}`;
  }
}

// ───────────────────────── render ─────────────────────────
function cardHtml(key, slot){
  const isPinned = pinned.has(key);
  const fair = fairProbFor(slot);
  const myRows = MY_BOOKS.map(name=>{
    const bk=name.toLowerCase(); const p=slot.prices[bk]; if(!p) return null;
    const ev = fair ? evFor(fair.prob, p.price) : null;
    return { bk, name, price:p.price, limit:p.limit, ev };
  }).filter(Boolean).sort((a,b)=>(b.ev??-99)-(a.ev??-99));
  const bestEv = myRows.length ? myRows[0].ev : null;
  const myBooksHtml = myRows.map(r=>{
    const lg=bookLogo(r.bk);
    const posClass = r.ev!=null && r.ev>0.01 ? ' pos' : (r.ev!=null && r.ev<0 ? ' neg' : '');
    return `<div class="mybk${posClass}">${lg?`<img src="${esc(lg)}" alt="">`:''}<span class="bn">${esc(r.name)}</span><span class="bp">${fmtAm(r.price)}</span>${r.limit!=null?`<span class="blim">$${r.limit>=1000?(r.limit/1000).toFixed(1).replace(/\.0$/,'')+'k':r.limit} max</span>`:''}${r.ev!=null?`<span class="bev">${r.ev>=0?'+':''}${(r.ev*100).toFixed(1)}%</span>`:''}</div>`;
  }).join('');
  const moveAgo = slot.movedAt ? Math.round((Date.now()-slot.movedAt)/60000) : null;
  const oppMove = oppositeMoveFor(slot);
  const corrHtml = oppMove===undefined ? '' : oppMove
    ? `<div class="corr yes">✓ ${esc(bookShort(slot.movedBook))} also moved ${esc(oppMove.label)} ${fmtAm(oppMove.from)} → ${fmtAm(oppMove.to)} (${oppMove.cents}¢) — real two-sided steam</div>`
    : `<div class="corr no">⚠ ${esc(bookShort(slot.movedBook))} hasn't moved the other side yet — could be a one-off reprice, not confirmed steam</div>`;
  return `<div class="card${slot._justUpdated?' pop':''}${isPinned?' pinned':''}" data-key="${esc(key)}">
    <div class="crow1">
      <span class="cname">${isPinned?'📌 ':''}${esc(slot.meta.label)}</span>
      <span class="ctag">${esc(MKEY_LABEL[slot.meta.mkey])}${slot.meta.line!=null?' '+slot.meta.line:''}</span>
    </div>
    <div class="csub">${esc(slot.meta.game)}${slot.meta.card?' · '+esc(slot.meta.card):''}${slot.meta.start?' · '+esc(etTime(slot.meta.start)):''}</div>
    <div class="steam">
      <span class="sbook">${esc(bookShort(slot.movedBook))}</span>
      <span class="smove">${fmtAm(slot.moveFrom)} → ${fmtAm(slot.moveTo)}</span>
      <span class="scents">${slot.moveCents}¢${slot.moveLimit!=null?' · $'+(slot.moveLimit>=1000?(slot.moveLimit/1000).toFixed(1).replace(/\.0$/,'')+'k':slot.moveLimit)+' limit':''}${moveAgo!=null?' · '+moveAgo+'m ago':''}</span>
    </div>
    ${corrHtml}
    ${fair?`<div class="fairrow"><span>Fair (no-vig${fair.books>1?', both books':', '+esc(bookShort(slot.movedBook))})</span><b>${(fair.prob*100).toFixed(1)}%</b></div>`:''}
    ${myBooksHtml?`<div class="mybooks">${myBooksHtml}</div>`:''}
    ${isPinned?'<div class="ctap">Tap to unpin</div>':''}
  </div>`;
}

function render(){
  const list = Object.entries(slots).filter(([,s])=>s.movedAt && (activeMkey==='all'||s.meta.mkey===activeMkey) && (!s.meta.start || new Date(s.meta.start).getTime()>Date.now()));
  const withEv = list.map(([k,s])=>{ const fair=fairProbFor(s); const evs=MY_BOOKS.map(n=>{ const p=s.prices[n.toLowerCase()]; return p&&fair?evFor(fair.prob,p.price):null; }).filter(v=>v!=null); return { k, s, bestEv: evs.length?Math.max(...evs):null }; });

  $('#sumMoves').textContent = list.length;
  const posCount = withEv.reduce((a,x)=>a+(x.bestEv!=null&&x.bestEv>0.01?1:0),0);
  $('#sumEV').textContent = posCount;
  const bestOverall = withEv.reduce((a,x)=>x.bestEv!=null&&(a==null||x.bestEv>a)?x.bestEv:a, null);
  $('#sumBest').textContent = bestOverall!=null ? (bestOverall>=0?'+':'')+(bestOverall*100).toFixed(1)+'%' : '—';

  if(!withEv.length){ $('#view').innerHTML = `<div class="empty">No Pinnacle/BetOnline moves of ${MOVE_THRESHOLD_CENTS}¢+ detected yet on UFC Moneyline, Go the Distance, or Total Rounds. Leave this open — a card appears the moment either book moves and shows which of your books hasn't caught up.</div>`; return; }

  withEv.sort((a,b)=>{
    const pa=pinned.has(a.k), pb=pinned.has(b.k); if(pa!==pb) return pa?-1:1;
    return (b.bestEv??-99) - (a.bestEv??-99);
  });

  $('#view').innerHTML = withEv.map(x=>cardHtml(x.k,x.s)).join('');
  withEv.forEach(x=>{ x.s._justUpdated=false; });
  document.querySelectorAll('.card.pop').forEach(el=>el.addEventListener('animationend',()=>el.classList.remove('pop'),{once:true}));
}

document.addEventListener('click', ev=>{
  const el = ev.target.closest('.card[data-key]'); if(!el) return;
  const key = el.dataset.key;
  if(pinned.has(key)) pinned.delete(key); else pinned.add(key);
  render();
});
document.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{
  activeMkey=b.dataset.mkey; document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b)); render();
}));
$('#reload').addEventListener('click',()=>pollOnce(true));
$('#resetBtn').addEventListener('click',()=>{ if(confirm('Reset all tracked moves? This clears the log.')) resetState(); });

(async function boot(){
  loadState();
  render();
  await loadBookLogos();
  await pollOnce(true);
  setInterval(()=>{ if(document.visibilityState==='visible') pollOnce(false); }, REFRESH_MS);
})();
</script>
</body>
</html>
