<head>

<style>
:root{
  /* Dark palette matched to OddsJam's: #090e11 page, #0c1318 cards, #131e25 raised surfaces. */
  --bg:#090e11;--bg2:#0c1318;--bg3:#131e25;--line:#131e25;--line2:#1d2b35;
  --bgrgb:9,14,17;--bg2rgb:12,19,24;
  --text:#fff;--dim:#fff;--dim2:#fff;
  --purple:#22c55e;--green:#22c55e;--red:#ff5c5c;--cyan:#22c55e;--amber:#fbbf24;
  --ov:#4ade80;--un:#fb7185;
  --mono:'IBM Plex Mono','Menlo',monospace;--sans:'Sora','Helvetica Neue',sans-serif;--oddsfont:'Sora','Helvetica Neue',sans-serif;--pricefont:'Sora','Helvetica Neue',sans-serif;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans)}
button{font-family:inherit;cursor:pointer}
.hdr{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(var(--sat) + 10px) 14px 8px;border-bottom:1px solid var(--line2)}
.hrow{display:flex;align-items:center;gap:10px}
.logo{font-weight:800;font-size:18px;letter-spacing:-.3px} .logo span{color:var(--green)}
.htabs{display:flex;gap:6px;margin-left:auto}
.htab{padding:7px 14px;border-radius:999px;border:1px solid var(--line2);background:var(--bg2);color:var(--text);font-weight:800;font-size:12px}
.htab.on{border-color:var(--green);background:rgba(34,197,94,.18)}
.htab b{margin-left:4px;font-size:10px;color:var(--green)}
.gear{width:34px;height:34px;border-radius:50%;border:1px solid var(--line2);background:var(--bg2);color:var(--text)}
main{padding:10px 14px calc(var(--sab) + 40px);max-width:720px;margin:0 auto}
:root{--hdrh:58px}
.rlogotxt{font-size:8px;font-weight:800;color:var(--text)}
.tcount{font-size:9px;padding:0 6px;border-radius:999px;background:rgba(34,197,94,.25);margin-left:4px}
.ssfootb{display:flex;align-items:center;justify-content:center;height:42px;border-radius:12px;border:1px solid rgba(124,200,90,.6);background:rgba(124,200,90,.15);color:var(--text);font-weight:800;text-decoration:none}
.tkc{border:1px solid var(--line2);border-radius:14px;background:var(--bg2);padding:10px 12px;margin-bottom:8px}
.tkt{display:flex;justify-content:space-between;align-items:center} .tkpl{font-weight:800;font-size:15px}
.tkb{font-size:12.5px;margin-top:3px} .tkm{font-size:11px;color:var(--sub,#9aa4ad);margin-top:3px;font-family:var(--mono)}
.tka{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap} .tka button{padding:5px 10px;border-radius:8px;border:1px solid var(--line2);background:var(--bg3);color:var(--text);font-size:11px;font-weight:700}
.tkres{font-size:10px;font-weight:900;padding:2px 7px;border-radius:6px} .tkres.win{background:rgba(34,197,94,.2);color:#22c55e} .tkres.loss{background:rgba(248,113,113,.2);color:#f87171} .tkres.push{background:rgba(255,255,255,.1)} .tkres.live{background:rgba(251,191,36,.2);color:#fbbf24}
.tkhisttoggle{width:100%;text-align:left;padding:10px 12px;border-radius:12px;border:1px dashed var(--line2);background:transparent;color:var(--text);font-size:12px;font-weight:700;margin:14px 0 10px}
.tkpop{position:fixed;left:10px;right:10px;bottom:calc(var(--sab) + 16px);z-index:9500;padding:12px;border-radius:16px;background:rgba(17,24,39,.98);border:1px solid rgba(34,197,94,.55);box-shadow:0 10px 30px rgba(0,0,0,.5)}
.tkpop .tkpt{font-size:12px;margin-bottom:8px} .tkpop .tkpr{display:flex;gap:8px}
.tkpop input{flex:1;min-width:0;height:40px;border-radius:10px;border:1px solid var(--line2);background:var(--bg2);color:var(--text);font-family:var(--mono);font-size:16px;font-weight:700;padding:0 10px}
.tkpop button{height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line2);background:var(--bg2);color:var(--text);font-weight:700} .tkpop button.p{border-color:rgba(34,197,94,.6);background:rgba(34,197,94,.15)}
.tkpop .tkbar{height:3px;border-radius:2px;background:rgba(34,197,94,.6);margin-top:8px;transform-origin:left}
.splash-inner{display:flex;flex-direction:row;align-items:center;gap:12px;padding:0 20px;max-width:100%;box-sizing:border-box}
.splash-chart{width:46px;height:32px;flex:0 0 auto}
.splash-word{font-family:var(--pricefont);font-size:23px;font-weight:700;letter-spacing:-.3px;display:flex;white-space:nowrap}

.sh .daycount{margin-left:8px;font-family:var(--mono);font-size:10px;font-weight:800;padding:2px 8px;border-radius:999px;background:rgba(34,197,94,.16);color:var(--green);vertical-align:middle}
.empty{padding:48px 16px;text-align:center;color:var(--dim);font-size:13px;line-height:1.6}

.mnav::-webkit-scrollbar{display:none}
.mchip{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;border:1px solid var(--line2);background:var(--bg2);color:var(--text);font-weight:800;font-size:11.5px;letter-spacing:.3px;white-space:nowrap}
.mchip.on{border-color:var(--purple);background:rgba(34,197,94,.18)}
.mchip .cl{font-family:var(--mono);font-weight:700;font-size:10px;color:var(--cyan)}
.sh{display:flex;align-items:center;justify-content:space-between;margin:2px 0 8px}
.sh .shr{display:flex;align-items:center;gap:8px}
.sh .t{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--text)}
.sh.shback{position:sticky;top:var(--hdrh,64px);z-index:14;background:var(--bg);padding:8px 0;margin:0 0 8px}
.shlist{display:flex;flex-direction:column;gap:10px;padding:4px 0 20px}
.shcard{border:1px solid var(--line2);border-radius:14px;background:var(--bg2);padding:10px 12px;cursor:pointer}
.shhd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.shpl{font-weight:800;font-size:15px;color:var(--text)}
.shgm{font-size:10.5px;color:var(--sub);white-space:nowrap} .shgm b,.sswhen b{color:var(--text)}
.sswhen{text-align:right}
.shside{margin:4px 0 6px;font-size:12px;font-weight:700;color:var(--text)}
.shside b{color:var(--green)}
.shfair{font-family:var(--mono);font-size:10.5px;color:var(--sub);margin-left:4px}
.shsig{display:flex;align-items:center;gap:7px;padding:3px 0;font-size:11.5px}
.shbk{flex:0 0 22px;display:flex;justify-content:center;font-size:8px;font-weight:800;color:var(--text)}
.shbk img{width:18px;height:18px;border-radius:5px}
.shk{font-size:8.5px;font-weight:900;letter-spacing:.5px;padding:1px 5px;border-radius:5px;background:rgba(255,255,255,.08);color:var(--text)}
.shk.money{background:rgba(34,197,94,.18);color:#22c55e} .shk.line{background:rgba(251,191,36,.18);color:#fbbf24} .shk.move,.shk.exmove{background:rgba(96,165,250,.18);color:#93c5fd}
.shtx{font-family:var(--mono);font-weight:700;color:var(--text);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shago{font-size:10px;color:var(--sub);white-space:nowrap}
.shstale{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:7px;padding-top:7px;border-top:1px solid var(--line2);font-size:11px}
.shlbl{font-size:9.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--sub)}
.shmoney{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.shbig{font-family:var(--mono);font-size:20px;font-weight:900;color:#22c55e}
.shsub{font-size:10px;color:var(--sub);margin:3px 0 5px}
a.shst{text-decoration:none;color:var(--text)}
.rwping{border-color:rgba(147,197,253,.6)}.rwping .spsub{font-family:inherit;white-space:normal;line-height:1.35}
.rwcard{padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);margin:6px 0}
.rwcard.new{border-color:rgba(147,197,253,.55)}.rwcard.warn{border-color:rgba(251,191,36,.7)}
.rwflag{font-size:9.5px;font-weight:900;padding:2px 7px;border-radius:999px;letter-spacing:.3px}
.rwflag.ceiling{background:rgba(34,197,94,.16);color:#22c55e}.rwflag.floor{background:rgba(245,158,11,.16);color:#f59e0b}.rwflag.mention{background:rgba(148,163,184,.16);color:#94a3b8}
.dgl{font-size:12px;line-height:1.5;padding:4px 0;border-bottom:1px solid var(--line)}.dgl:last-child{border-bottom:0}.dgu{color:#22c55e;font-size:10.5px;font-weight:800}.dgd{color:#f59e0b;font-size:10.5px;font-weight:800}
.rwpre{font-family:var(--mono);font-size:11px;line-height:1.45;white-space:pre-wrap;margin:0}
.pjc{display:inline-block;margin:2px 6px 2px 0;font-size:11px}.pjc.up b{color:#22c55e}.pjc.dn b{color:#f87171}
.rwl{display:grid;gap:4px;font-size:11px;font-weight:700;margin-top:8px}.rwl input{height:36px;border-radius:9px;border:1px solid var(--line2);background:var(--bg);color:var(--text);padding:0 10px;font-size:14px}
.rwwarn{font-size:10px;font-weight:800;color:#fbbf24}
.rwst{font-size:9.5px;font-weight:900;padding:2px 7px;border-radius:999px;background:rgba(148,163,184,.16);color:#cbd5e1}
.rwst.out{background:rgba(239,68,68,.18);color:#f87171}.rwst.doubtful{background:rgba(249,115,22,.18);color:#fb923c}.rwst.gtd{background:rgba(234,179,8,.18);color:#facc15}.rwst.returning,.rwst.probable{background:rgba(34,197,94,.16);color:#22c55e}
.rwh{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px}.rwteam{font-size:10px;font-weight:800;color:#7dd3fc}
.rwon{font-size:9px;font-weight:900;padding:2px 6px;border-radius:999px;background:rgba(34,197,94,.18);color:#22c55e}
.rwat{margin-left:auto;font-size:10px;color:var(--sub)}.rwhl{font-weight:800;font-size:12px;margin-top:4px}.rwtx{font-size:11.5px;line-height:1.45;margin-top:4px}
#sharpPings{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:8px;right:8px;z-index:9999;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.sping{pointer-events:auto;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:rgba(17,24,39,.97);border:1px solid rgba(34,197,94,.6);box-shadow:0 10px 30px rgba(0,0,0,.5);color:var(--text);text-decoration:none;animation:spIn .35s cubic-bezier(.2,.9,.3,1.2)}
@keyframes spIn{from{transform:translateY(-120%);opacity:0}to{transform:none;opacity:1}}
.sping img{width:30px;height:30px;border-radius:8px;flex:0 0 auto}
.spbody{flex:1;min-width:0}
.sptop{font-size:9.5px;letter-spacing:.4px;color:#22c55e}
.spmain{font-weight:800;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spsub{font-family:var(--mono);font-size:11px;color:var(--sub)}
.spx{padding:4px 6px;color:var(--sub);font-size:13px}
.shst{display:flex;align-items:center;gap:4px;padding:2px 7px 2px 3px;border-radius:999px;border:1px solid var(--line2);font-family:var(--mono)}
.ssov{position:fixed;inset:0;z-index:9000;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;animation:ssFade .2s}
@keyframes ssFade{from{opacity:0}to{opacity:1}}
.sspanel{width:100%;max-height:92vh;overflow-y:auto;background:#0b0f14;border-radius:22px 22px 0 0;border-top:1px solid var(--line2);padding:8px 14px calc(14px + env(safe-area-inset-bottom,0px));animation:ssUp .28s cubic-bezier(.2,.9,.3,1)}
@keyframes ssUp{from{transform:translateY(40%)}to{transform:none}}
.ssgrab{width:40px;height:4px;border-radius:2px;background:rgba(255,255,255,.25);margin:0 auto 10px}
.sshead{display:flex;justify-content:space-between;align-items:flex-start}
.ssbig{font-size:34px;font-weight:800;color:#7cc85a;letter-spacing:-.5px}
.sswhen{font-size:12px;color:var(--sub);margin-top:8px}
.ssmeta{font-size:13px;color:var(--sub);line-height:1.5;margin:2px 0 10px}
.ssmeta b{color:var(--text)} .ssmk{color:#c4a5f5;font-weight:700}
.sstgt{border:1px solid var(--line2);border-radius:14px;background:rgba(255,255,255,.03);padding:10px 12px;margin-bottom:12px}
.sstgtn{font-size:15px;color:var(--sub);margin-bottom:8px} .sstgtn b{color:var(--text)}
.sstgtr{display:flex;align-items:center;gap:16px}
.sstgtlg img{width:38px;height:38px;border-radius:9px}
.sstgtv{display:flex;flex-direction:column;align-items:center;font-size:10px;color:var(--sub)} .sstgtv b{font-size:15px;color:var(--text)} .sstgtv b.pos{color:#22c55e}
.ssbet{margin-left:auto;padding:9px 16px;border-radius:10px;border:1px solid rgba(124,200,90,.6);background:rgba(124,200,90,.18);color:var(--text);font-weight:800;text-decoration:none}
.sslh{display:flex;align-items:center;gap:8px;margin:4px 0 6px}
.sslhlg{display:flex} .sslhlg img{width:20px;height:20px;border-radius:5px;margin-right:-6px;border:1px solid #0b0f14}
.sslht{flex:1;font-size:14px;color:var(--sub);margin-left:6px} .sslht b{color:var(--text)}
.sslhs{display:flex;flex-direction:column;align-items:flex-end;font-size:10px;color:var(--sub)} .sslhs b{font-size:14px;color:var(--text)}
.ssladder{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.ssl{display:flex;align-items:center;gap:8px;height:24px}

.sslbar{flex:1;height:100%;display:flex;align-items:center}
.sslbar i{display:block;height:100%;border-radius:4px;background:#1e293b} .sslbar i.on{background:linear-gradient(90deg,#3f6212,#4d7c2a)}
.ssls{flex:0 0 52px;font-family:var(--mono);font-size:12px;color:var(--text)} .ssls.off{color:var(--sub)}
.sscols{display:grid;grid-template-columns:1fr 1fr;gap:40px;font-size:12px;color:var(--sub);margin-bottom:6px;text-align:center} .sscols b{color:var(--text)}
.sstable{display:flex;flex-direction:column;gap:6px}
.ssrow{display:grid;grid-template-columns:1fr 32px 1fr;gap:6px;align-items:center}
.sslogo{display:flex;justify-content:center} .sslogo img{width:28px;height:28px;border-radius:7px}

.sscell.tgt{border-color:rgba(124,200,90,.6);background:rgba(124,200,90,.12)} .sscell.empty{border-style:solid;opacity:.4}
.ssliq{font-size:9.5px;color:var(--sub)} .ssar{font-size:11px;color:var(--sub)}
.ssllg .rlogotxt,.sslogo .rlogotxt,.sslhlg .rlogotxt,.sstgtlg .rlogotxt{font-size:9px;font-weight:800;color:var(--text)}
.ssfoot{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}

.shst.match{border-color:rgba(234,179,8,.6);background:rgba(234,179,8,.08)} .shst.match .shev{color:#eab308;font-weight:800}

const LS = { get:(k,d)=>{ try{ const v=localStorage.getItem(k); return v==null?d:v; }catch(e){ return d; } }, set:(k,v)=>{ try{ localStorage.setItem(k,v); }catch(e){} } };
const BACKEND_DEFAULT = 'https://nfl-props-tracker-1.vercel.app/api/odds';
const getBackend = () => LS.get('oo_backend_url', BACKEND_DEFAULT);
const OO_TIMEOUT_MS = 20000;
async function oo(endpoint, params, opts){
  const payload={ endpoint, params:params||{} }; if(opts?.method) payload.method=opts.method; if(opts?.body) payload.body=opts.body;
  const once = async () => {
    const ctl = new AbortController(); const t = setTimeout(()=>ctl.abort(), OO_TIMEOUT_MS);
    try{
      const r = await fetch(getBackend(), { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload), signal:ctl.signal });
      const text = await r.text();
      if(!r.ok){ let m=text; try{ const j=JSON.parse(text); m=j.error+(j.body?' — '+j.body:''); }catch(e){} const err=new Error(`backend ${r.status}: ${m}`); err.status=r.status; throw err; }
      return JSON.parse(text);
    } catch(e){ if(e.name==='AbortError') { const err=new Error(`timed out after ${OO_TIMEOUT_MS/1000}s`); err.retry=true; throw err; } if(e.status==null) e.retry=true; else if(e.status>=500||e.status===429) e.retry=true; throw e; }
    finally{ clearTimeout(t); }
  };
  try{ return await once(); }
  catch(e){ if(!e.retry) throw e; await new Promise(r=>setTimeout(r,600)); return once(); }
}

function levelsOf(o){
  const top=Number(o.price);
  const ob=(Array.isArray(o.order_book)?o.order_book:[]).filter(l=>Array.isArray(l)&&l.length>=2);
  const normP=v=>{ v=Number(v); if(isNaN(v)) return NaN; return (v>1&&v<50)?toAm(v):v; };
  const out=[];
  if(ob.length){
    // Which column is price vs size is decided from the WHOLE array's total distance from the
    // row's own quoted top price, not just level 0 — using only the first level flip-flopped
    // whenever the API didn't return that array in the same order poll to poll, swinging the
    // parsed liquidity/avg price (and firing a false flash) even though nothing real had changed.
    let distA=0, distB=0;
    ob.forEach(l=>{ const a=normP(l[0]), b=normP(l[1]); if(!isNaN(a)) distA+=Math.abs(a-top); if(!isNaN(b)) distB+=Math.abs(b-top); });
    // Strongest signal first: the column that actually contains the row's own quoted price is the
    // price column (a size column can sit numerically closer to the quote and fool the distance test).
    const hasTop = i => ob.some(l=>Math.abs(normP(l[i])-top)<=1);
    const pf = hasTop(0)!==hasTop(1) ? hasTop(0) : distA<=distB;
    if(!window._obLogged){ window._obLogged=true; console.log('[OpticOdds] order_book sample', o.sportsbook, top, JSON.stringify(o.order_book).slice(0,240), '→ priceFirst', pf); }
    // A parsed level has to actually BE a legal American odds price (magnitude >= 100) --
    // anything else (an unconverted percentage, a raw value the decimal-odds heuristic's narrow
    // 1-50 window didn't catch, whatever) is garbage, not a real price, and showing it verbatim
    // (e.g. "+83.43", which isn't a price any book could ever quote) is worse than dropping it.
    ob.forEach(l=>{ const price=pf?normP(l[0]):normP(l[1]); const size=pf?Number(l[1]):Number(l[0]); if(!isNaN(price)&&Math.abs(price)>=100&&!isNaN(size)&&size>0) out.push({price:Math.round(price),size}); });
    // A level can't beat the book's own best quote -- anything that does is a misread (columns
    // swapped, stale data), so drop it rather than call it an arb.
    if(Math.abs(top)>=100) return out.filter(l=>toDec(l.price)<=toDec(top)*1.02+0.01).sort((a,b)=>b.price-a.price);
  } else if(o.limits?.max) out.push({price:top,size:Number(o.limits.max)});
  return out.sort((a,b)=>b.price-a.price);
}

}

function rwDigest(){

    const k=normName(b.causedBy); const st=rwInj.get(k)?.status || b.causedStatus || '';

      <label class="rwl">Helper URL — your blender's address + /api/rotowire<input id="rwUrl" type="url" autocomplete="off" value="${esc(LS.get('sm_rw_url',''))}" placeholder="${esc(RW_URL())}"></label>
      <label class="rwl">RotoWire key or link (optional, saved only on this device)<input id="rwLink" type="text" autocomplete="off" value="${esc(LS.get('sm_rw_link',''))}" placeholder="the key/link you pasted into the blender's ⚙"></label>
      <button class="mchip" id="rwConnTest">Test RotoWire</button><span class="dim" id="rwConnRes" style="font-size:11px;margin-left:6px"></span>
      <div class="rwhl" style="margin-top:12px">RotoWire updates → Discord</div>
      <label class="rwl">Webhook URL (saves as you type)<input id="rwHook" type="url" autocomplete="off" value="${esc(projHook)}" placeholder="https://discord.com/api/webhooks/…"></label>
      <label class="rwl">Role ID to tag (blank = none)<input id="rwRole" type="text" inputmode="numeric" autocomplete="off" value="${esc(projRole)}"></label>
      <button class="mchip" id="rwDcTest">Send test</button><span class="dim" id="rwDcRes" style="font-size:11px;margin-left:6px"></span>
      <div class="rwhl" style="margin-top:12px">Injury status changes → Discord <span class="dim">(its own channel)</span></div>
      <label class="rwl">Webhook URL<input id="stHook" type="url" autocomplete="off" value="${esc(statusHook)}" placeholder="https://discord.com/api/webhooks/…"></label>
      <label class="rwl">Role ID to tag (blank = none)<input id="stRole" type="text" inputmode="numeric" autocomplete="off" value="${esc(statusRole)}"></label>
      <button class="mchip" id="stDcTest">Send test</button><button class="mchip" id="stBoard">Post injury board now</button><span class="dim" id="stRes" style="font-size:11px;margin-left:6px"></span></div>
    ${(()=>{ const t=ms=>ms?new Date(ms).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}):'—';
      const f=k=>{ const x=rwFeedStat[k]; return !x?`<span class="dim">${k.replace('NBA','')} …</span>`:x.ok?`<span style="color:#22c55e">${k.replace('NBA','')} ✓ ${x.n}</span>`:`<span style="color:#f87171">${k.replace('NBA','')} ✗ ${esc(x.err)}</span>`; };
      const pj=rwProj&&rwProj.day===etToday() ? `baseline ${t(rwProj.at && rwProj.base ? rwProj.baseAt||rwProj.at : 0)} · last check ${t(rwProj.lastCheck)} · last RW move ${rwProj.lastMove?t(rwProj.lastMove):'none yet today'}` : 'no projections for today yet';
      const ps=x=>!x?'nothing posted yet':x.ok?`last post ${t(x.at)} ✓`:`last post failed: ${esc(x.err)}`;
      return `<div class="rwcard" style="font-size:10.5px;line-height:1.6">${f('NBANews')} · ${f('NBAInjuries')} · ${f('NBADailyProj')}<br>Projections: ${pj}<br>Proj channel: ${projHook?ps(rwPostStat.proj):'<span style="color:#fbbf24">no webhook</span>'} · Status channel: ${statusHook?ps(rwPostStat.status):'<span style="color:#fbbf24">no webhook</span>'}</div>`; })()}
    ${rwErr?`<div class="empty" style="color:#fca5a5">Couldn't load RotoWire news: ${esc(rwErr)}<br><span class="dim">Tap ⚙ Settings → put in your blender's address + /api/rotowire (and your RotoWire key if the blender uses one), then Test RotoWire.</span></div>`:''}
    ${rwGames.length&&rwInj.size?sec('Injury board · today', rwGames.length, `<div class="rwcard"><button class="mchip" id="stBoard2" style="float:right">Post to Discord</button><pre class="rwpre">${esc(rwBoardLines().join('\n'))}</pre></div>`):''}
    ${(()=>{ const D=rwDigest(); return sec('Upside / floor risk (RotoWire blurbs)', D.length, `<div class="rwcard">${D.map(g=>`<div class="dgl"><b class="rwteam">${esc(g.team)}</b> ${esc(g.name)}${g.status?` <span class="rwst ${g.status.toLowerCase()}">${esc(g.status)}</span>`:''}${g.up.length?` → <span class="dgu">more mins:</span> ${g.up.map(n=>`<b>${esc(n)}</b>`).join(', ')}`:''}${g.down.length?` <span class="dgd">fewer mins:</span> ${g.down.map(n=>`<b>${esc(n)}</b>`).join(', ')}`:''}</div>`).join('')}</div>`); })()}
    ${sec('RotoWire projection changes today', projMovers.length, projMovers.map(m=>`<div class="rwcard"><div class="rwh"><b>${esc(m.r.name)}</b>${m.r.team?`<span class="rwteam">${esc(rwTeamKey(m.r.team))}</span>`:''}</div><div class="rwtx">${PROJ_STATS.filter(([k])=>m.d[k]!=null).map(([k,l])=>`<span class="pjc ${m.d[k]>0?'up':'dn'}">${l} ${m.base[k]}→${m.r[k]} <b>${m.d[k]>0?'+':''}${m.d[k]}</b></span>`).join(' ')}</div></div>`).join(''))}
    ${sec('Ceiling ↑ today', up.length, up.map(flagRow).join(''))}
    ${sec('Floor risk today', down.length, down.map(flagRow).join(''))}
    ${sec('Injury report changes today', changes.length, changes.map(chRow).join(''))}
    ${sec('Status news today', newsSt.length, newsSt.map(nsRow).join(''))}
    ${items.length?sec("Today's RotoWire blurbs", items.length, items.map(card).join('')):(!rwErr?`<div class="empty">${rwNews.at?`No blurbs today for players in today's RotoWire projections.<br><span class="dim">${rwNews.items.length} blurbs loaded · ${rwNews.items.filter(rwIsToday).length} from today · projections: ${rwProj&&rwProj.day===etToday()?Object.keys(rwProj.last||{}).length+' players':'not loaded yet'} · today's teams: ${rwSlate?rwSlate.size:'?'}</span>`:'Loading RotoWire news…'}</div>`:'')}`;
  $('#rwNow')?.addEventListener('click',()=>{ toast('Checking RotoWire…'); rwNewsLoad(); });
  $('#rwDc')?.addEventListener('click',()=>{ const b=$('#rwDcBox'); b.style.display=b.style.display==='none'?'block':'none'; });
  const saveDc=()=>{ projHook=$('#rwHook').value.trim(); LS.set('sm_proj_hook',projHook); projRole=($('#rwRole').value.match(/\d{15,}/)||[''])[0]; LS.set('sm_proj_role',projRole); const b=$('#rwDc'); b.classList.toggle('on',!!(projHook||statusHook)); b.textContent='⚙ Settings'+(projHook||statusHook?' · Discord ✓':''); };
  $('#rwHook')?.addEventListener('input',saveDc); $('#rwRole')?.addEventListener('input',saveDc);
  $('#rwUrl')?.addEventListener('input',()=>LS.set('sm_rw_url',$('#rwUrl').value.trim()));
  $('#rwLink')?.addEventListener('input',()=>LS.set('sm_rw_link',$('#rwLink').value.trim()));
  $('#rwConnTest')?.addEventListener('click',async()=>{ const out=$('#rwConnRes'); out.textContent='checking…';
    const res=[]; for(const f of ['NBANews','NBAInjuries','NBADailyProj']){ try{ const n=(await rwFetchFeed(f, f==='NBADailyProj')).length; res.push(`${f.replace('NBA','')} ✓ ${n}`); }catch(e){ res.push(`${f.replace('NBA','')} ✗ ${e.message.slice(0,60)}`); } }
    out.textContent=res.join(' · '); });
  const saveSt=()=>{ statusHook=$('#stHook').value.trim(); LS.set('sm_status_hook',statusHook); statusRole=($('#stRole').value.match(/\d{15,}/)||[''])[0]; LS.set('sm_status_role',statusRole); };
  $('#stHook')?.addEventListener('input',saveSt); $('#stRole')?.addEventListener('input',saveSt);
  $('#stBoard2')?.addEventListener('click',async()=>{ const ok=await postBoard(true); toast(ok?'Injury board posted':'Not posted — '+(!statusHook?'add the status webhook in ⚙ Settings':(rwPostStat.status?.err||'check the webhook'))); });
  $('#stBoard')?.addEventListener('click',async()=>{ saveSt(); const ok=await postBoard(true); $('#stRes').textContent = ok ? '✓ board posted' : !statusHook ? '✗ no status webhook' : !rwGames.length ? '✗ no games today loaded yet' : '✗ '+(rwPostStat.status?.err||'not sent'); });
  $('#stDcTest')?.addEventListener('click',async()=>{ saveSt(); const ok=await statusDiscord(['✅ Connected — RotoWire injury status changes will post here.']); toast(ok?'Sent':'Not sent — check the webhook'); });
  $('#rwDcTest')?.addEventListener('click',async()=>{ saveDc(); const ok=await projDiscord({ at:Date.now(), lines:['✅ Connected — RotoWire projection changes will post here.'] }); toast(ok?'Sent':'Not sent — check the webhook'); $('#rwDcRes').textContent = ok ? '✓ sent' : '✗ '+projErr; });
  items.forEach(x=>rwSeen.add(x.id)); LS.set('sm_rw_seen', JSON.stringify([...rwSeen].slice(-500))); rwBadge();
}
// ───────────────────────── page ─────────────────────────
function setView(v){
  viewMode=v; $('#vFeed').classList.toggle('on', v==='sharp'); $('#vTrack').classList.toggle('on', v==='tracker'); $('#vNews').classList.toggle('on', v==='news');
  if(v==='sharp') renderSharp(); else if(v==='news') renderNews(); else { renderTracker(); refreshTracked(); }
}
$('#vFeed').addEventListener('click',()=>setView('sharp'));
$('#vTrack').addEventListener('click',()=>setView('tracker'));
$('#vNews').addEventListener('click',()=>setView('news'));
$('#gear').addEventListener('click',()=>{ const v=prompt('Backend URL (same one PocketMarket uses)', getBackend()); if(v){ LS.set('oo_backend_url', v.trim()); toast('Saved — reloading'); setTimeout(()=>location.reload(),600); } });
saveTracked();
loadBookLogos().then(()=>{ if(viewMode==='sharp') renderSharp(); });
setView('sharp');
sharpTick(); sharpSchedule();
setInterval(()=>{ if(tracked.some(t=>!t.final)) refreshTracked(); }, 120000);
refreshTracked();
rwBadge(); setTimeout(rwNewsLoad, 1500); setInterval(()=>{ if(!document.hidden) rwNewsLoad(); }, RW_NEWS_MS);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && Date.now()-rwNews.at>RW_NEWS_MS) rwNewsLoad(); });

</script>
</body>
</html>
