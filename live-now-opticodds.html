<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Live Now · +EV vs Pinnacle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0c;--card:#141418;--border:#26262e;--text:#fff;--green:#27c071;--green-dim:rgba(39,192,113,.12);--red:#ff3b3b;--amber:#f5a623;--blue:#4db8ff;--purple:#a855f7;--font:'Plus Jakarta Sans',system-ui,sans-serif;--mono:'JetBrains Mono',Menlo,monospace}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh}
body{padding:calc(env(safe-area-inset-top) + 12px) 12px 90px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.brand{font-weight:800;font-size:18px;letter-spacing:.3px}
.brand span{color:var(--green)}
.stat{font-family:var(--mono);font-size:10px;letter-spacing:.4px;text-transform:uppercase;color:#fff;text-align:right}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 12px;border-radius:999px;border:1px solid var(--border);background:var(--card);color:#fff;font-weight:700;font-size:12px}
.chip.on{background:var(--green-dim);border-color:var(--green);color:var(--green)}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 12px;font-size:12px;font-weight:700}
.ctrl label{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:6px 9px}
.ctrl input[type=number]{width:60px;background:#000;border:1px solid var(--border);color:#fff;border-radius:6px;padding:4px 6px;font-family:var(--mono);font-size:12px;text-align:center}
.ctrl input[type=checkbox]{accent-color:var(--green)}
.ctrl .ib{margin-left:auto;width:34px;height:34px;border-radius:50%;border:1px solid var(--border);background:var(--card);color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center}
.row{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px;margin-bottom:8px}
.row.live{border-color:rgba(255,59,59,.45)}
.gm{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.gm .t{display:flex;align-items:center;gap:6px;font-weight:800;font-size:13px}
.gm .t img{width:20px;height:20px;object-fit:contain}
.gm .st{font-family:var(--mono);font-size:10px;font-weight:700;color:#fff;white-space:nowrap}
.gm .st.live{color:var(--red)}
.gm .lg{font-size:10px;font-weight:800;letter-spacing:.6px;padding:2px 7px;border-radius:6px;border:1px solid var(--border);color:#fff}
.pick{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pick .side{min-width:0}
.pick .side .m{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--blue)}
.pick .side .s{font-size:16px;font-weight:800;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick .side .pin{font-family:var(--mono);font-size:11px;color:#fff;margin-top:4px}
.pick .side .pin b{color:#fff}
.price{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.price img{width:22px;height:22px;border-radius:6px;object-fit:cover}
.p{color:#fff;text-decoration:none;font-weight:800}
.curtot{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--text2,#9a9aa2);margin-top:3px}
.curtot b{color:#fff}
.row.isarb{border-color:#fff}
.hedge{margin-top:8px;font-family:var(--mono);font-size:12px;font-weight:800;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:5px 9px;display:inline-block}
.hedge b{color:var(--amber)}.hedge span{font-weight:700;opacity:.85}
.cmp{display:flex;align-items:center;flex-wrap:wrap;gap:5px;margin-top:9px;font-family:var(--mono);font-size:13px;font-weight:800;color:#fff}
.cmp img{width:15px;height:15px;border-radius:4px;object-fit:cover;vertical-align:middle}
.cmp .bk{font-size:9px;font-weight:800;letter-spacing:.3px;color:#fff;opacity:.7}
.cmp .vs{font-size:10px;font-weight:700;color:#fff;opacity:.4;margin:0 1px}
.cmp .fairlbl{font-size:9px;font-weight:800;letter-spacing:.3px;color:#fff;opacity:.55;margin-left:1px}
.cmp .pct{font-size:11px;font-weight:800;color:var(--green);margin-left:3px}
.cmp .pct.arb{color:#fff}
.cmp .lim{font-size:10px;font-weight:700;color:var(--amber);margin-left:auto}
.agree{display:inline-flex;align-items:center;gap:6px;background:rgba(39,192,113,.16);border:1px solid var(--green);color:#fff;border-radius:8px;padding:4px 9px;font-family:var(--mono);font-size:12px;font-weight:800}
.agree b{color:var(--green)}
.row.aligned{border-color:rgba(39,192,113,.55)}
.more{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.more .b{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11px;font-weight:700;padding:3px 7px;border-radius:7px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#fff}
.more .b img{width:14px;height:14px;border-radius:3px}
.empty{padding:36px 12px;text-align:center;color:#fff;font-size:13px;line-height:1.6}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1a1d22;border:1px solid var(--border);color:#fff;font-size:12px;font-weight:700;padding:10px 14px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:99}
.toast.show{opacity:1}
@media(min-width:900px){body{max-width:1100px;margin:0 auto}}
.tl{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:9px 12px;margin-bottom:10px}
.tl.closed #tlBody{display:none}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:9px;overflow:hidden}
.seg button{background:var(--card);color:#fff;border:none;padding:6px 10px;font-weight:800;font-size:11px;letter-spacing:.4px}
.seg button.on{background:var(--green);color:#000}
.seg #trackN{font-family:var(--mono)}
.fair{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.fair span{font-family:var(--mono);font-size:12px;font-weight:800;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:5px 9px;line-height:1}
.fair span b{color:var(--green)}
.fair span.lim b{color:var(--amber)}
.acts{display:flex;gap:6px}
.acts button{border:1px solid var(--border);background:rgba(255,255,255,.06);color:#fff;border-radius:8px;padding:5px 10px;font-weight:800;font-size:11px}
.acts button.bet{border-color:var(--green);color:var(--green)}
.acts button.bet.on{background:var(--green);color:#000}
.tk{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:12px}
.tk .h{display:flex;justify-content:space-between;gap:8px;font-weight:800}
.tk .m{font-family:var(--mono);font-size:11px;color:#fff;margin-top:4px;line-height:1.6}
.tk .m b{color:var(--green)}
.sech{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:800;letter-spacing:.6px;color:#fff;margin:14px 0 8px}
.sech button{border:1px solid var(--border);background:transparent;color:#fff;border-radius:7px;padding:4px 8px;font-size:10px;font-weight:700}
.tlh{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.6px;color:#fff;margin-bottom:8px;flex-wrap:wrap}
.tlh #tlBest{font-family:var(--mono);font-weight:700;letter-spacing:0;text-transform:none;color:var(--green);text-align:right}
.tlbars{display:flex;align-items:flex-end;gap:3px;height:44px}
.tlslot{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative;cursor:pointer}
.tlslot .bar{width:100%;border-radius:3px 3px 2px 2px;background:rgba(255,255,255,.14)}
.tlslot.mid .bar{background:rgba(77,184,255,.55)}
.tlslot.peak .bar{background:var(--green)}
.tlslot.now .bar{outline:2px solid #fff;outline-offset:-2px}
.tlslot .brk{position:absolute;top:0;font-size:9px;font-weight:800;color:var(--amber)}
.tlslot .n{font-family:var(--mono);font-size:9px;font-weight:800;color:#fff;margin-bottom:2px}
.tllabels{display:flex;gap:3px;margin-top:4px}
.tllabels span{flex:1;text-align:center;font-family:var(--mono);font-size:9px;color:#fff;white-space:nowrap;overflow:hidden}
.tlsel{margin-top:8px;font-size:12px;line-height:1.6;color:#fff}
.tlsel b{color:var(--green)}
.ugscroll{overflow-x:auto;scrollbar-width:none;margin:0 -4px}
.ugscroll::-webkit-scrollbar{display:none}
.ugdays{display:flex;min-width:max-content;padding:0 4px;width:100%}
.ugday{display:flex;flex-direction:column;flex:1 0 0}
.ugdaylabel{font-family:var(--mono);font-size:10px;font-weight:800;letter-spacing:.5px;color:#fff;text-transform:uppercase;text-align:center;padding-bottom:6px;opacity:.6}
.ugday.today .ugdaylabel{color:var(--green);opacity:1}
.ugbars{display:flex;align-items:flex-end;gap:3px;height:56px}
.ugslot{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;cursor:pointer;position:relative}
.ugslot .bar{width:100%;border-radius:2px 2px 1px 1px;background:rgba(255,255,255,.10);min-height:3px}
.ugslot.has .bar{background:rgba(77,184,255,.55)}
.ugslot.peak .bar{background:var(--green)}
.ugslot.now .bar{outline:1px solid #fff;outline-offset:-1px}
.uglabels{display:flex;gap:3px;margin-top:4px}
.uglabel{flex:1;text-align:center;font-family:var(--mono);font-size:9px;color:#fff;opacity:.5;white-space:nowrap}
.ugsel{margin-top:8px;font-size:12px;line-height:1.6;color:#fff}
.ugsel b{color:var(--green)}
.ugsel .ugsport{margin-bottom:4px}
.ugsel .ugsport .slist{opacity:.75;font-size:11px}
.ugnav{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:6px}
.ugnav button{border:1px solid var(--border);background:rgba(255,255,255,.06);color:#fff;border-radius:7px;padding:3px 10px;font-weight:800;font-size:12px;cursor:pointer}
.ugnav button:disabled{opacity:.3;cursor:default}
.ugnav .ugdaylabel-main{font-family:var(--mono);font-size:11px;font-weight:800;letter-spacing:.5px;color:var(--green);min-width:64px;text-align:center}
.score{font-family:var(--mono);font-size:12px;font-weight:800;color:#fff}
.brk{font-size:10px;font-weight:800;letter-spacing:.5px;padding:2px 7px;border-radius:6px;background:rgba(255,59,59,.15);border:1px solid rgba(255,59,59,.5);color:#fff}
.hot{font-size:10px;font-weight:800;letter-spacing:.5px;padding:2px 7px;border-radius:6px;background:rgba(245,166,35,.15);border:1px solid rgba(245,166,35,.55);color:#fff}
.sig{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;padding-top:8px;border-top:1px solid var(--border);font-family:var(--mono);font-size:11px;font-weight:700;color:#fff}
.sig .bet{background:var(--green);color:#000;padding:3px 9px;border-radius:7px;letter-spacing:.6px}
.sig .watch{background:rgba(255,255,255,.08);border:1px solid var(--border);padding:3px 9px;border-radius:7px}
.row.new{animation:pop .6s ease-out}
.row{-webkit-user-select:none;user-select:none}
.row.pinned{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber) inset}
.pinbadge{font-size:10px;font-weight:800;letter-spacing:.5px;padding:2px 7px;border-radius:6px;background:rgba(245,166,35,.16);border:1px solid rgba(245,166,35,.55);color:var(--amber)}
@keyframes pop{from{box-shadow:0 0 0 2px var(--green)}to{box-shadow:0 0 0 0 transparent}}
.trend.up{color:var(--green)}.trend.dn{color:var(--red)}
</style>
</head>
<body>
<div class="top">
  <div class="brand">LIVE <span>+EV</span> <span style="color:#fff;font-size:11px;font-weight:700;letter-spacing:.5px">FD · DK vs PIN</span></div>
  <div style="display:flex;align-items:center;gap:8px">
    <div class="seg"><button class="on" id="vLive">LIVE</button><button id="vTrack">TRACKER <span id="trackN">0</span></button></div>
    <div class="stat" id="stat">loading…</div>
  </div>
</div>
<div class="chips" id="chips"></div>
<div class="ctrl">
  <label>Min EV <input type="number" id="minEv" value="1" step="0.5" min="0">%</label>
  <label>Pin limit ≥ $<input type="number" id="minLim" value="1000" step="100" min="0"></label>
  <label>Price <input type="number" id="pMin" value="-400" step="5"> to <input type="number" id="pMax" value="250" step="5"></label>
  <input type="checkbox" id="liveOnly" checked style="display:none">
  <button class="ib" id="cfg" title="Backend URL">⚙</button>
  <button class="ib" id="reload" title="Refresh">⟳</button>
</div>
<div id="tl" class="tl ug" style="display:none">
  <div class="tlh" id="tlToggle" style="cursor:pointer"><span>WHEN TO COME ON <span id="tlChev">▾</span></span><span id="tlBest"></span></div>
  <div id="tlBody">
  <div class="ugnav"><button id="ugPrev">◀</button><span class="ugdaylabel-main" id="ugDayLabel">TODAY</span><button id="ugNext">▶</button></div>
  <div class="ugscroll"><div class="ugdays" id="ugDays"></div></div>
  <div class="ugsel" id="tlSel"></div>
  </div>
</div>
<div id="view"><div class="empty">Loading…</div></div>
<div id="tracker" style="display:none"></div>
<div class="toast" id="toast"></div>

<script>
// ───────────────────────────── config ─────────────────────────────
const LS = { get:(k,d)=>{ try{ return localStorage.getItem(k) ?? d; }catch(e){ return d; } }, set:(k,v)=>{ try{ localStorage.setItem(k,v); }catch(e){} } };
const BACKEND = () => LS.get('oo_backend_url', 'https://nfl-props-tracker-1.vercel.app/api/odds');
const LEAGUES = {
  nfl:  { label:'NFL',  sport:'football',   league:'nfl' },
  cfb:  { label:'CFB',  sport:'football',   league:'ncaaf' },
  nba:  { label:'NBA',  sport:'basketball', league:'nba' },
  wnba: { label:'WNBA', sport:'basketball', league:'wnba' },
  cbb:  { label:'CBB',  sport:'basketball', league:'ncaab' },
  nhl:  { label:'NHL',  sport:'hockey',     league:'nhl' },
  mlb:  { label:'MLB',  sport:'baseball',   league:'mlb' },
  ufc:  { label:'UFC',  sport:'mma',        league:'ufc', mlOnly:true },
};
const REF_BOOK = 'Pinnacle';
const BOOKS = ['Pinnacle','FanDuel','DraftKings'];   // Pinnacle = reference; FD + DK are the only bettable books shown
const EXCH = new Set();
const IS_IOS = /iPhone|iPad|iPod/.test(navigator.userAgent), IS_ANDROID = /Android/.test(navigator.userAgent);
const MARKET = [
  { key:'ml',     label:'Moneyline', test: m => /^moneyline$/i.test(m) },
  { key:'spread', label:'Spread',    test: m => /^(point spread|run line|puck line|spread)$/i.test(m) },
  { key:'total',  label:'Total',     test: m => /^total (points|goals|runs)$/i.test(m) },
  { key:'tt',     label:'Team Total', test: m => /^team total$/i.test(m) },
];
const PERIODIC = /1st|2nd|3rd|4th|first|second|half|quarter|period|inning|overtime|alternate/i;

// ───────────────────────────── helpers ─────────────────────────────
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toDec = a => { a = Number(a); return a > 0 ? 1 + a/100 : 1 + 100/Math.abs(a); };
const imp = a => 1/toDec(a);
const fmtAm = a => { a = Number(a); return a > 0 ? '+' + a : String(a); };
const probToAm = p => { if (!(p > 0 && p < 1)) return 0; return p >= 0.5 ? -Math.round(100 * p / (1 - p)) : Math.round(100 * (1 - p) / p); };
const usd = n => n >= 1000 ? '$' + (n/1000).toFixed(1).replace(/\.0$/,'') + 'k' : '$' + Math.round(n);
// Tracker staking convention, display-only: risk 1u on underdogs (win more than 1u),
// win exactly 1u on favorites (risk more than 1u to get there).
const actualStake = amer => amer >= 0 ? 1 : Math.abs(amer) / 100;
const amerPayout = amer => amer >= 0 ? amer / 100 : 1;
function unitsResultFor(e) {
  if (e.status === 'won') return `+${amerPayout(e.betPrice).toFixed(2)}u`;
  if (e.status === 'lost') return `-${actualStake(e.betPrice).toFixed(2)}u`;
  return null;
}
// Team selections come back from the API as the full name ("Indiana Fever"); on the
// card that overflows and gets ellipsis-clipped, so trim to just the mascot/nickname.
// UFC (and anything else mlOnly, i.e. fighter names not team names) is left alone.
const shortTeamName = (name, league) => {
  const s = String(name || '').trim();
  if (!s || (league && league.mlOnly)) return s;
  const words = s.split(/\s+/);
  return words.length > 1 ? words[words.length - 1] : s;
};
const etTime = iso => { try { return new Date(iso).toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit', timeZone:'America/New_York' }); } catch(e) { return ''; } };
const etDay = iso => { try { return new Date(iso).toLocaleDateString('en-US', { weekday:'short', timeZone:'America/New_York' }); } catch(e) { return ''; } };
const chunk = (a, n) => { const o = []; for (let i = 0; i < a.length; i += n) o.push(a.slice(i, i+n)); return o; };
const deepLink = o => { const d = o?.deep_link; if (!d || typeof d !== 'object') return null; return (IS_ANDROID && d.android) || d.ios || d.desktop || d.android || null; };
let toastT; const toast = m => { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200); };

async function oo(endpoint, params) {
  const r = await fetch(BACKEND(), { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ endpoint, params: params || {} }) });
  const t = await r.text();
  if (!r.ok) { let m = t; try { const j = JSON.parse(t); m = j.error + (j.body ? ' — ' + j.body : ''); } catch(e) {} throw new Error(`backend ${r.status}: ${m}`); }
  return JSON.parse(t);
}

// ───────────────────────────── book logos ─────────────────────────────
let bookLogos = {};
async function loadBookLogos() {
  try { const c = JSON.parse(LS.get('oo_book_logos', 'null')); if (c && Date.now() - c.at < 86400e3) { bookLogos = c.map; return; } } catch(e) {}
  try { const r = await oo('/sportsbooks', {}); const map = {}; (r?.data || []).forEach(b => { if (b?.name && b?.logo) map[String(b.name).toLowerCase()] = b.logo; }); bookLogos = map; LS.set('oo_book_logos', JSON.stringify({ at: Date.now(), map })); } catch(e) {}
}
const logoOf = n => bookLogos[String(n || '').toLowerCase()] || '';

// ───────────────────────────── state ─────────────────────────────
let active = new Set(JSON.parse(LS.get('live_leagues', '["nfl","nba","nhl","mlb","ufc"]')));
let fixtures = [];   // normalized
let rows = [];       // computed +EV rows
let lastAt = 0;

function renderChips() {
  $('#chips').innerHTML = Object.entries(LEAGUES).map(([k, l]) => `<button class="chip${active.has(k) ? ' on' : ''}" data-k="${k}">${l.label}</button>`).join('');
  $('#chips').querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => { const k = b.dataset.k; if (active.has(k)) active.delete(k); else active.add(k); LS.set('live_leagues', JSON.stringify([...active])); renderChips(); load(true); }));
}

// ───────────────────────────── fetch ─────────────────────────────
const isLiveStatus = st => /live|progress|half|in_play|playing|ongoing/i.test(String(st || ''));
let diag = {};
let upcomingAll = []; // every non-live future fixture, no time cap — feeds the timeline chart
async function loadFixtures() {
  const now = Date.now(); const out = []; diag = {}; const upcomingNext = [];
  for (const k of active) {
    const L = LEAGUES[k];
    try {
      const raw = []; let page = 1;
      for (let i = 0; i < 6; i++) { const r = await oo('/fixtures', { sport:L.sport, league:L.league, page }); (r?.data || []).forEach(f => raw.push(f)); if (!r?.has_more) break; page++; }
      const st = {}; raw.forEach(f => { const key = (f.is_live ? 'is_live' : String(f.status || '?')); st[key] = (st[key] || 0) + 1; });
      diag[L.label] = { n: raw.length, st, next: raw.filter(f => new Date(f.start_date).getTime() > now).sort((a, b) => new Date(a.start_date) - new Date(b.start_date))[0]?.start_date || null };
      raw.forEach(f => {
        const t = new Date(f.start_date).getTime();
        const live = !!f.is_live || isLiveStatus(f.status) || (t <= now && t > now - 4*3600e3 && !/completed|cancelled|unplayed|scheduled/i.test(String(f.status||'')));
        if (/completed|cancelled/i.test(String(f.status || ''))) return;
        // timeline chart: every future, non-live fixture — no window cap
        // (renderTimeline itself caps how many hours forward it displays).

  function rowCard(r) {
    const f = r.f; const dl = deepLink(r.best.o);
    const price = dl ? `<a class="p" href="${esc(dl)}" target="_blank" rel="noopener">${fmtAm(r.best.price)}</a>` : `<span class="p">${fmtAm(r.best.price)}</span>`;
    const lg = logoOf(r.best.book);
    const pinLg = logoOf(REF_BOOK);
    const evPct = (r.best.ev * 100); const arbPct = (r.best.arb * 100); const isArb = arbPct > 0;
    const more = r.books.slice(1, 6).map(b => `<span class="b">${logoOf(b.book) ? `<img src="${esc(logoOf(b.book))}" alt="">` : esc(b.book.slice(0,3))} ${fmtAm(b.price)}${b.exch ? `(${Math.round(imp(b.price)*100)}%)${b.liq ? ' $' + Math.round(b.liq) : ''}` : ''} · +${(b.ev*100).toFixed(1)}%</span>`).join('');
    const st = stateOf(f);
    const age = Math.max(0, Math.round((Date.now() - r.since) / 1000)); const ageTxt = age < 60 ? `${age}s` : `${Math.floor(age/60)}m${age%60 ? (age%60)+'s' : ''}`;
    const why = isArb ? `locked ${arbPct.toFixed(2)}% arb vs Pinnacle` : st.brk ? `${st.brk} · books slow to move` : evPct >= 3 ? 'edge ≥ 3%' : r.trend > 0 ? 'edge climbing' : r.trend < 0 ? 'edge fading' : 'holding';
    // Live score context for total / team-total bets, so you can see where the number stands.
    const curTotal = (!isNaN(st.home) && !isNaN(st.away)) ? (Number(st.home) + Number(st.away)) : null;
    const totalNote = r.mk.key === 'total' && curTotal != null ? `<div class="curtot">Live total <b>${curTotal}</b></div>`
                     : r.mk.key === 'tt' && curTotal != null ? (() => { const own = r.ttSide === 'home' ? st.home : st.away; return isNaN(own) ? '' : `<div class="curtot">Live score <b>${own}</b></div>`; })()
                     : '';
    const isPinned = pinned.has(r.key);
    return `<div class="row live${r.isNew ? ' new' : ''}${r.aligned ? ' aligned' : ''}${isArb ? ' isarb' : ''}${isPinned ? ' pinned' : ''}" data-key="${esc(r.key)}">
      <div class="gm"><div class="t">${f.away.logo ? `<img src="${esc(f.away.logo)}" alt="">` : ''}${esc(f.away.ab)} <span class="score">${isNaN(st.away) ? '' : st.away}</span> <span style="opacity:.7">@</span> ${f.home.logo ? `<img src="${esc(f.home.logo)}" alt="">` : ''}${esc(f.home.ab)} <span class="score">${isNaN(st.home) ? '' : st.home}</span></div>
        <div style="display:flex;align-items:center;gap:6px">${isPinned ? '<span class="pinbadge">📌 PIN</span>' : ''}<span class="lg">${esc(f.league.label)}</span>${st.brk ? `<span class="brk">${esc(st.brk)}</span>` : ''}${st.hot ? `<span class="hot">${esc(st.hot)}</span>` : ''}<span class="st live">${esc(st.label || 'LIVE')}</span></div></div>
      <div class="pick">
        <div class="side"><div class="m">${esc(r.mk.label)}</div><div class="s">${esc(r.sideLabel)}</div>${totalNote}</div>
      </div>
      ${isArb ? `<div class="hedge">HEDGE · Pin <b>${fmtAm(r.pin.other)}</b> other side</div>` : ''}
      <div class="cmp">
        ${lg ? `<img src="${esc(lg)}" alt="${esc(r.best.book)}" title="${esc(r.best.book)}">` : `<span class="bk">${esc(r.best.book)}</span>`}
        ${price}
        <span class="vs">vs.</span>
        ${pinLg ? `<img src="${esc(pinLg)}" alt="Pinnacle" title="Pinnacle">` : `<span class="bk">PIN</span>`}
        ${fmtAm(probToAm(r.fair))}<span class="fairlbl">Fair</span>
        <span class="pct${isArb ? ' arb' : ''}">(${isArb ? `${arbPct.toFixed(2)}% Arb / ` : ''}${evPct.toFixed(1)}% EV)</span>
        <span class="lim">${usd(r.pin.lim)} lim</span>
      </div>
      ${r.aligned ? `<div style="margin-top:8px"><span class="agree">✓ FD &amp; PIN AGREE <b>FD ${fmtAm(r.fdPrice)}</b> · <b>PIN ${fmtAm(r.pin.mine)}</b> → fading ${esc(r.best.book === 'DraftKings' ? 'DK' : r.best.book)}</span></div>` : ''}
      ${more ? `<div class="more">${more}</div>` : ''}
      <div class="sig"><span>${esc(why)}</span><span>on board ${ageTxt} <span class="trend ${r.trend > 0 ? 'up' : r.trend < 0 ? 'dn' : ''}">${r.trend > 0 ? '▲' : r.trend < 0 ? '▼' : '—'}</span></span></div>
      <div class="acts" style="margin-top:8px"><button class="bet${log[r.key]?.bet ? ' on' : ''}" data-bet="${esc(r.key)}">${log[r.key]?.bet ? '✓ BET' : 'I BET THIS'}</button><button data-hide="${esc(r.key)}">✕ HIDE</button></div>
    </div>`;
  }
  // pinned rows (double-click/double-tap a row to pin) float above the ranked list, in their own
  // section, so a fast-moving board doesn't bury what you're watching. A pin only holds while the
  // row still qualifies as +EV — once it drops off the board there is nothing left to keep pinned.
  const liveKeys = new Set(rowsV.map(r => r.key));
  let pinsChanged = false; [...pinned].forEach(k => { if (!liveKeys.has(k)) { pinned.delete(k); pinsChanged = true; } });
  if (pinsChanged) savePinned();
  const pinnedRows = rowsV.filter(r => pinned.has(r.key));
  const restRows = rowsV.filter(r => !pinned.has(r.key));
  view.innerHTML = (pinnedRows.length ? `<div class="sech"><span>📌 PINNED · ${pinnedRows.length}</span></div>${pinnedRows.map(rowCard).join('')}` : '')
    + restRows.map(rowCard).join('');
  view.querySelectorAll('[data-bet]').forEach(b => b.addEventListener('click', () => markBet(b.dataset.bet)));
  view.querySelectorAll('[data-hide]').forEach(b => b.addEventListener('click', () => hideKey(b.dataset.hide)));
  view.querySelectorAll('.row[data-key]').forEach(el => el.addEventListener('dblclick', ev => {
    if (ev.target.closest('button,a')) return;
    window.getSelection()?.removeAllRanges();
    togglePin(el.dataset.key);
  }));
}
// ───────────────────────────── tracker view ─────────────────────────────
let viewMode = 'live';
function renderTracker() {
  const view = $('#view');
  const bets = Object.values(log).sort((a, b) => b.betAt - a.betAt);
  const t = ms => new Date(ms).toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit' });
  const card = e => {
    const settled = e.status === 'won' || e.status === 'lost' || e.status === 'push';
    const clr = e.status === 'won' ? 'var(--green)' : e.status === 'lost' ? 'var(--red)' : '#fff';
    const units = unitsResultFor(e);
    const resultLine = !settled
      ? `<div class="m" style="opacity:.65">${e.fid ? 'Pending · grades itself when the game is final' : 'Pending · logged before auto-grade — settle by hand'}</div>`
      : `<div class="m"><b style="color:${clr};font-size:12px">${e.status.toUpperCase()}</b>${units ? ` <b style="color:${clr}">${units}</b>` : ''}${e.finalScore ? ` · final ${esc(e.finalScore)}` : ''}</div>`;
    const resultBtns = settled
      ? `<button data-res="${esc(e.key)}|pending">↺ Re-open</button>`
      : `<button data-res="${esc(e.key)}|won">WON</button><button data-res="${esc(e.key)}|lost">LOST</button><button data-res="${esc(e.key)}|push">PUSH</button>`;
    return `<div class="tk"><div class="h"><span>${esc(e.game)} <span style="opacity:.7;font-size:10px">${esc(e.league)}</span></span><span>${t(e.betAt)}</span></div>
    <div style="font-weight:800;font-size:14px;margin-top:3px">${esc(e.market)} · ${esc(e.side)}</div>
    <div class="m">bet <b>${fmtAm(e.betPrice)}</b> ${esc(e.betBook)} · EV <b>+${(e.betEv||0).toFixed(1)}%</b> · fair ${fmtAm(probToAm(e.fair))} · lim ${usd(e.pinLim)}</div>
    ${resultLine}
    <div class="acts" style="margin-top:8px">${resultBtns}<button data-del="${esc(e.key)}">✕</button></div></div>`;
  };
  view.innerHTML = `<div class="sech"><span>MY BETS · ${bets.length}</span></div>${bets.map(card).join('') || '<div class="empty" style="padding:14px">Nothing marked yet — tap "I BET THIS" on a live row.</div>'}`;
  view.querySelectorAll('[data-res]').forEach(b => b.addEventListener('click', () => {
    const [k, r] = b.dataset.res.split('|'); if (!log[k]) return;
    log[k].status = r;
    if (r === 'pending') { delete log[k].gradedAt; delete log[k].finalScore; }
    saveLog(); renderTracker();
  }));
  view.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => { delete log[b.dataset.del]; saveLog(); renderTracker(); }));
}
function setView(m) { viewMode = m; $('#vLive').classList.toggle('on', m === 'live'); $('#vTrack').classList.toggle('on', m === 'tracker'); $('#tl').style.display = (m === 'live' && upcomingAll.length) ? '' : 'none'; render(); }

// ───────────────────────────── flow ─────────────────────────────
let busy = false, lastFixAt = 0, lastGradeAt = 0;
async function load(force) {
  if (busy) return; busy = true;
  // Fire-and-forget, throttled — doesn't block the odds refresh above.
  if (Date.now() - lastGradeAt > 30000) { lastGradeAt = Date.now(); autoGradeTracked(); }
  try {
    if (force || !fixtures.length || Date.now() - lastFixAt > 60e3) { fixtures = await loadFixtures(); lastFixAt = Date.now(); }
    if (!fixtures.length) {
      rows = []; if (viewMode === 'tracker') { renderTracker(); busy = false; return; } $('#stat').textContent = `0 live games · ${new Date().toLocaleTimeString([], { hour:'numeric', minute:'2-digit' })}`;
      const lines = Object.entries(diag).map(([lg, d]) => d.error ? `${lg}: error — ${esc(d.error)}` : `${lg}: ${d.n} fixtures (${Object.entries(d.st).map(([k, v]) => k + ' ' + v).join(', ') || 'none'})${d.next ? ' · next ' + etDay(d.next) + ' ' + etTime(d.next) : ''}`);
      $('#view').innerHTML = `<div class="empty">No live games right now.<br><br><div style="font-family:var(--mono);font-size:11px;text-align:left;display:inline-block;line-height:1.8">${lines.join('<br>')}</div><br><br>Re-checking every 5s.</div>`;
      busy = false; return;
    }
    const [byFx, st] = await Promise.all([loadOdds(fixtures), loadState(fixtures)]);
    gameState = st;
    if (!window._lg) { window._lg = true; const all = Object.values(byFx).flat(); console.log('[live] markets seen:', [...new Set(all.map(o => o.market))]); console.log('[live] books seen:', [...new Set(all.map(o => o.sportsbook))]); console.log('[live] sample row:', JSON.stringify(all[0] || {}).slice(0, 400)); }
    window._byFx = byFx;
    rows = computeRows(fixtures, byFx);
    lastAt = Date.now();
    const live = fixtures.filter(f => f.live).length;
    $('#stat').textContent = `${rows.length} +EV · ${fixtures.length} live · ${new Date().toLocaleTimeString([], { hour:'numeric', minute:'2-digit', second:'2-digit' })}`;
    render();
  } catch(e) { console.error(e); $('#stat').textContent = 'error'; toast(e.message); }
  busy = false;
}
function recompute() { if (window._byFx) { rows = computeRows(fixtures, window._byFx); $('#stat').textContent = `${rows.length} +EV · ${fixtures.length} games`; render(); } }
['minEv','minLim','pMin','pMax','liveOnly'].forEach(id => $('#' + id).addEventListener('change', recompute));
$('#reload').addEventListener('click', () => load(true));
$('#cfg').addEventListener('click', () => { const v = prompt('Backend URL (your /api/odds):', BACKEND()); if (v != null && v.trim()) { LS.set('oo_backend_url', v.trim()); toast('Saved'); load(true); } });

renderChips();
$('#vLive').addEventListener('click', () => setView('live'));
$('#vTrack').addEventListener('click', () => setView('tracker'));
$('#tlToggle').addEventListener('click', () => { const c = $('#tl').classList.toggle('closed'); LS.set('live_tl_closed', c ? '1' : '0'); $('#tlChev').textContent = c ? '▸' : '▾'; });
if (LS.get('live_tl_closed', '0') === '1') { $('#tl').classList.add('closed'); $('#tlChev').textContent = '▸'; }
$('#ugPrev').addEventListener('click', () => { ugDayOffset--; renderUgDay(); });
$('#ugNext').addEventListener('click', () => { ugDayOffset++; renderUgDay(); });
saveLog();
loadBookLogos().then(() => load(true));
setInterval(() => { if (document.visibilityState === 'visible') load(false); }, 5000);
</script>
