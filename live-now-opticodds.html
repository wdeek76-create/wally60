<title>Direct Arbs · +EV vs Pinnacle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  /* one identity in both modes: the same deep navy-blue as the splash/reference, not a
     separate pale "light" palette — light mode is just a slightly lifted version of this. */
  --bg:#171b24;--card:#1e2430;--card2:#242b3c;--border:rgba(139,183,230,.20);
  --green:#27c071;--green-dim:rgba(39,192,113,.14);
  --red:#ff4d4d;--amber:#f5a623;
  --accent:#5ec2ff;--accent-dim:rgba(94,194,255,.16);
  --text:#fff;--sub:#fff;--glare:rgba(255,255,255,.16);--stroke:rgba(0,0,0,.6);
  --font:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
}
:root[data-theme="light"]{
  --bg:#1c212c;--card:#242b3a;--card2:#2b3345;--border:rgba(139,183,230,.24);
  --green:#2ecb7c;--green-dim:rgba(39,192,113,.16);
  --red:#ff5c5c;--amber:#f5a623;
  --accent:#6ec6ff;--accent-dim:rgba(94,194,255,.18);
  --text:#fff;--sub:#fff;--glare:rgba(255,255,255,.18);--stroke:rgba(0,0,0,.6);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#1c212c;--card:#242b3a;--card2:#2b3345;--border:rgba(139,183,230,.24);
    --green:#2ecb7c;--green-dim:rgba(39,192,113,.16);
    --red:#ff5c5c;--amber:#f5a623;
    --accent:#6ec6ff;--accent-dim:rgba(94,194,255,.18);
    --text:#fff;--sub:#fff;--glare:rgba(255,255,255,.18);--stroke:rgba(0,0,0,.6);
  }
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);overscroll-behavior:none;transition:background .2s,color .2s}
#app{background:var(--bg);min-height:100vh;border-left:1px solid var(--border);border-right:1px solid var(--border);max-width:480px;margin:0 auto;padding-bottom:calc(90px + env(safe-area-inset-bottom));box-shadow:0 0 40px rgba(0,0,0,.25)}
/* glass card: a frosted panel with a soft diagonal glare — the app's one card language */
.glass{position:relative;overflow:hidden;background:linear-gradient(150deg,var(--card2) 0%,var(--card) 65%);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--border);box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 6px 22px rgba(0,0,0,.28)}
.glass::after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 130% 65% at 0% 0%,var(--glare) 0%,rgba(255,255,255,.03) 42%,transparent 72%)}
.glass>*{position:relative}

@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadein{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
@keyframes pop{from{box-shadow:0 0 0 2px var(--green)}to{box-shadow:0 0 0 0 transparent}}
@keyframes greenPulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes goldFrame{0%,100%{box-shadow:inset 0 0 0 1px rgba(77,184,255,.45),inset 0 0 20px rgba(77,184,255,.12)}50%{box-shadow:inset 0 0 0 1px rgba(77,184,255,.75),inset 0 0 28px rgba(77,184,255,.22)}}

/* ── HEADER ── */
header{padding:14px 16px 10px;padding-top:calc(14px + env(safe-area-inset-top))}
.header-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.logo-name{font-size:21px;font-weight:900;letter-spacing:-1px;color:var(--text);line-height:1}
.brand{display:flex;align-items:center;gap:8px}
.brand-text{font-family:var(--font);font-weight:900;font-size:11.5px;line-height:1.08;letter-spacing:.3px;text-transform:uppercase;color:var(--text)}
.brand-text .accent{color:var(--accent);text-shadow:0 0 8px rgba(94,194,255,.55)}
.logo-live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-left:4px;vertical-align:middle;box-shadow:0 0 6px var(--red),0 0 12px rgba(255,59,59,.4);animation:blink 1.4s ease-in-out infinite;position:relative;top:-2px}
.logo-evtag{color:var(--green);font-size:12px;font-weight:900;margin-left:3px}
.logo-tag{font-size:10px;font-weight:700;color:var(--sub);letter-spacing:.6px;text-transform:uppercase}
.logo-tag-highlight{color:var(--green);animation:greenPulse 2.5s ease-in-out infinite}
.header-meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--green);font-weight:700;font-variant-numeric:tabular-nums}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0;transition:background .3s}
.sync-dot.stale{background:var(--amber);animation:none}
.sync-dot.live{animation:blink 1.3s infinite}
.refresh-btn{background:none;border:none;color:var(--sub);font-size:18px;cursor:pointer;padding:4px;line-height:1;transition:color .15s}
.refresh-btn.spinning{color:var(--green);animation:spin .7s linear infinite}

/* ── DATE/VIEW TOGGLE ── */
.date-toggle{display:flex;gap:4px;margin:0 16px 10px}
.date-btn{position:relative;overflow:hidden;flex:1;padding:8px 0;border-radius:9px;border:1.5px solid var(--border);background:transparent;color:var(--sub);font-family:var(--font);font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;cursor:pointer;transition:all .15s}
.date-btn.active{border-color:rgba(39,192,113,.5);color:var(--green);background:var(--green-dim);box-shadow:inset 0 1px 1px rgba(255,255,255,.18),inset 0 -1px 1px rgba(0,0,0,.15)}
.date-btn.active::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(120deg,rgba(255,255,255,.3) 0%,rgba(255,255,255,.06) 15%,transparent 35%);pointer-events:none}
.date-btn>*{position:relative;z-index:1}
.dt-n{font-variant-numeric:tabular-nums;margin-left:3px}

/* ── LEAGUE CHIPS ── */
.league-strip{display:flex;gap:18px;padding:6px 16px 12px;overflow-x:auto;scrollbar-width:none;border-top:1px solid var(--border);margin-top:2px}
.gsbar{margin:0 16px 10px;font-size:11px;font-weight:700;color:var(--sub);letter-spacing:.1px}
.gsbar b{color:var(--text);font-weight:800}
.league-strip::-webkit-scrollbar{display:none}
.league-chip{display:inline-flex;align-items:center;gap:5px;cursor:pointer;user-select:none;flex:0 0 auto;padding:0;background:none;border:none;-webkit-tap-highlight-color:transparent}
.chip-name{font-size:13px;font-weight:800;letter-spacing:.8px;color:var(--sub);text-transform:uppercase;transition:color .15s}
.league-chip.active .chip-name{color:var(--text)}
.chip-count{font-size:10px;font-weight:700;color:var(--sub);transition:color .15s;font-variant-numeric:tabular-nums}
.league-chip.active .chip-count{color:var(--text)}
.chip-live-dot{width:5px;height:5px;border-radius:50%;background:var(--red);flex-shrink:0;animation:blink 1.3s infinite}
.league-chip.solo{background:linear-gradient(160deg,rgba(77,184,255,.18) 0%,rgba(77,184,255,.05) 100%);border:1px solid rgba(77,184,255,.5);border-radius:8px;padding:3px 10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 0 12px rgba(77,184,255,.2)}
.league-chip.solo .chip-name{color:var(--accent)}
.league-chip.all{font-size:11px;font-weight:900;letter-spacing:.6px;color:var(--sub);border:1.5px solid var(--border);border-radius:8px;padding:4px 9px}
.league-chip.all.active{color:var(--green);border-color:rgba(39,192,113,.5);background:var(--green-dim)}

/* ── STATUS STRIP ── */
.status-strip{display:flex;align-items:center;margin:0 16px 10px}
.stat-cell{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 4px}
.stat-val{font-size:22px;font-weight:800;line-height:1;color:var(--text);letter-spacing:-1px;font-variant-numeric:tabular-nums}
.stat-val.red{color:var(--red)}
.stat-val.amber{color:var(--amber)}
.stat-val.green{color:var(--green)}
.stat-val.glowing{animation:redGlow 1.4s ease-in-out infinite}
@keyframes redGlow{0%,100%{text-shadow:0 0 6px rgba(255,59,59,.6),0 0 14px rgba(255,59,59,.3)}50%{text-shadow:0 0 2px rgba(255,59,59,.2)}}
.stat-label{font-size:8px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:1.5px;margin-top:3px}

/* ── CONTROLS ── */
.filters-toggle{display:flex;align-items:center;gap:8px;margin:0 16px 10px;padding:9px 13px;border:1px solid var(--border);border-radius:15px;background:rgba(255,255,255,.02);cursor:pointer;-webkit-tap-highlight-color:transparent}
.filters-toggle .fname{font-size:11px;font-weight:800;color:var(--text);text-transform:uppercase;letter-spacing:.5px;flex-shrink:0}
.filters-summary{flex:1;min-width:0;font-size:11px;font-weight:700;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.filters-chev{color:var(--sub);transition:transform .2s;flex-shrink:0;font-size:11px}
.filters-toggle.open .filters-chev{transform:rotate(180deg)}
.filters-panel{max-height:0;overflow:hidden;transition:max-height .3s ease}
.filters-panel.open{max-height:760px}
.ctrl-sub{margin:0 16px 10px}
.ctrl-sub-label{font-size:9px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--sub);margin-bottom:6px}
.book-toggles{display:flex;flex-wrap:wrap;gap:6px}
.book-chk{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:6px 10px;min-width:38px;height:32px;border-radius:14px;border:1.5px solid var(--border);background:var(--card);font-size:10px;font-weight:800;color:var(--sub);cursor:pointer;-webkit-tap-highlight-color:transparent}
.book-chk img{width:20px;height:20px;border-radius:5px;object-fit:cover;display:block}
.book-chk.on{border-color:rgba(39,192,113,.5);color:var(--green);background:var(--green-dim)}
.book-chk input{display:none}
.chk-row{display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:8px 11px;font-size:11px;font-weight:800;color:rgba(255,255,255,.75);text-transform:uppercase;letter-spacing:.3px}
.chk-row input{accent-color:var(--accent);width:15px;height:15px}
.chk-row .note{text-transform:none;font-weight:600;color:var(--sub);letter-spacing:0}
.chk-row img{width:16px;height:16px;border-radius:4px;object-fit:cover;vertical-align:middle}
.preset-row{display:flex;gap:6px;align-items:center;margin-top:8px}
.preset-add-btn{flex:1;background:var(--card);border:1.5px dashed var(--border);color:var(--accent);border-radius:14px;padding:8px;font-family:var(--font);font-size:11px;font-weight:800;cursor:pointer}
.preset-chip{display:inline-flex;align-items:center;gap:6px}
.preset-chip .x{font-size:11px;font-weight:900;color:var(--sub);padding:0 2px}
.preset-chip .x:hover{opacity:1}
.clear-books-btn{background:none;border:none;color:var(--accent);font-size:9px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;padding:2px}
.pb-search{width:100%;background:#000;border:1.5px solid var(--border);color:#fff;border-radius:12px;padding:9px 12px;font-family:var(--font);font-size:13px;font-weight:600}
.pb-suggest{margin-top:6px;max-height:200px;overflow-y:auto;background:var(--card);border:1.5px solid var(--border);border-radius:12px}
.pb-suggest .pb-opt{display:flex;justify-content:space-between;gap:8px;padding:9px 12px;font-size:12px;font-weight:700;border-bottom:1px solid var(--border);cursor:pointer}
.pb-suggest .pb-opt:last-child{border-bottom:none}
.pb-suggest .pb-opt .g{color:var(--sub);font-weight:600;font-size:10px}
.pb-suggest .pb-empty{padding:9px 12px;font-size:11px;color:var(--sub)}
.pb-picked{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pb-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:14px;border:1.5px solid rgba(39,192,113,.5);background:var(--green-dim);color:var(--text);font-size:11px;font-weight:800}
.pb-chip .x{color:var(--sub);font-weight:900;cursor:pointer;padding:0 2px}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 16px 12px;font-size:11px;font-weight:800}
.ctrl label{display:flex;align-items:center;gap:6px;background:var(--card);border:1.5px solid var(--border);border-radius:13px;padding:6px 10px;letter-spacing:.3px;text-transform:uppercase;color:var(--sub)}
.ctrl input[type=number]{width:58px;background:#000;border:1px solid var(--border);color:#fff;border-radius:6px;padding:4px 6px;font-family:var(--font);font-variant-numeric:tabular-nums;font-size:12px;font-weight:700;text-align:center}
.ctrl input[type=checkbox]{accent-color:var(--green)}
.ctrl .ib{margin-left:auto;width:32px;height:32px;border-radius:50%;border:1.5px solid var(--border);background:var(--card);color:var(--text);font-size:14px;display:flex;align-items:center;justify-content:center;cursor:pointer}

/* ── SECTION LABEL ── */
.section-label{display:flex;align-items:center;gap:8px;padding:10px 16px 6px}
.section-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.section-dot.live{background:var(--red);animation:blink 1.3s infinite;box-shadow:0 0 8px var(--red)}
.section-dot.pin{background:var(--amber);box-shadow:0 0 6px var(--amber)}
.section-dot.info{background:var(--sub)}
.section-name{font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:2px;color:var(--text)}
.section-n{font-size:12px;font-weight:900;color:var(--text);background:rgba(255,255,255,.12);padding:1px 7px;border-radius:20px;font-variant-numeric:tabular-nums}

/* ── ROW CARD ── */
.row{border-radius:20px;padding:12px 12px 12px 16px;margin:0 16px 8px;-webkit-user-select:none;user-select:none;animation:fadein .18s ease}
.row::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2.5px;border-radius:0 2px 2px 0;background:transparent}
.row.live::before{background:var(--red)}
.row.isarb{box-shadow:inset 0 1px 0 rgba(255,255,255,.10)}
/* No green wash on the card itself — just a glossy highlight streak (same neutral glass sheen
   as everything else) and the thin left-edge accent stripe to mark it as an arb row. */
.row.isarb::after{background:linear-gradient(120deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,.03) 10%,transparent 22%)}
.row.isarb::before{background:var(--green)!important;box-shadow:0 0 8px rgba(39,192,113,.9),0 0 16px rgba(39,192,113,.4)}
.row.brk{box-shadow:inset 0 1px 0 rgba(255,255,255,.10),inset 0 0 0 1px rgba(77,184,255,.5),inset 0 0 26px rgba(77,184,255,.16);animation:goldFrame 2s ease-in-out infinite}
.row.brk::after{background:radial-gradient(ellipse 130% 65% at 0% 0%,var(--glare) 0%,rgba(77,184,255,.14) 42%,transparent 72%)}
.row.brk::before{background:var(--accent)!important;box-shadow:0 0 8px rgba(77,184,255,.9),0 0 16px rgba(77,184,255,.5)}
.row.pinned::before{background:var(--amber)!important;box-shadow:0 0 8px rgba(245,166,35,.9)}
.row.aligned{border-color:rgba(39,192,113,.4)}
.gm{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.gm .t{display:flex;align-items:center;gap:6px;font-weight:900;font-size:13px;text-transform:uppercase;letter-spacing:.2px}
.gm .t img{width:18px;height:18px;object-fit:contain}
.gm .qtr{font-size:10px;font-weight:800;color:var(--text);letter-spacing:.2px;white-space:nowrap;font-variant-numeric:tabular-nums;text-transform:none;background:rgba(255,255,255,.08);border:1px solid var(--border);border-radius:20px;padding:2px 8px}
.gm .st,.cardhead .st{font-size:10px;font-weight:800;color:var(--text);white-space:nowrap;font-variant-numeric:tabular-nums}
.gm .st.live,.cardhead .st.live{color:var(--red)}
.gm .lg,.cardhead .lg{font-size:9px;font-weight:800;letter-spacing:.6px;padding:2px 8px;border-radius:20px;border:1px solid var(--border);color:var(--text)}
.pinbadge{font-size:9px;font-weight:800;letter-spacing:.5px;padding:2px 8px;border-radius:20px;background:rgba(245,166,35,.16);border:1px solid rgba(245,166,35,.55);color:var(--amber)}
/* ── CARD HEADER STRIP — edge-to-edge bar (bleeds past .row's own padding), league on the
   left, live/status badges + a tiny hide icon on the right. Modeled after a sportsbook-style
   arb card's header treatment, everything below it keeps this app's existing layout. */
.cardhead{margin:-12px -12px 10px -16px;padding:9px 14px 9px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;background:rgba(255,255,255,.05);border-bottom:1px solid var(--border)}
.cardhead .chleft{display:flex;align-items:center;gap:7px;font-weight:900;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--text)}
.cardhead .chright{display:flex;align-items:center;gap:6px}
.hidebtn{background:none;border:none;color:var(--sub);font-size:13px;font-weight:900;cursor:pointer;padding:2px 4px;line-height:1;-webkit-tap-highlight-color:transparent}
/* ── BOOK ROWS — one full-width row per book instead of a compact pill, closer to a
   sportsbook arb card: logo, name, price, and a right-aligned metric. */
.booklist{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.bookrow{display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:13px;background:rgba(255,255,255,.03);border:1px solid var(--border)}
.bookrow img{width:20px;height:20px;border-radius:6px;object-fit:cover;flex-shrink:0}
.bookrow .bk{width:20px;flex-shrink:0;font-size:8.5px;font-weight:800;letter-spacing:.2px;color:var(--sub);text-align:center}
.bookrow .bkname{flex:1;min-width:0;font-size:11px;font-weight:800;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bookrow .bkprice{font-size:15px;font-weight:900;color:var(--text);font-variant-numeric:tabular-nums;flex-shrink:0}
.bookrow .bkmeta{font-size:10px;font-weight:800;color:var(--sub);margin-left:8px;flex-shrink:0;font-variant-numeric:tabular-nums;white-space:nowrap}
.bookrow.best{background:rgba(255,255,255,.05);border-color:rgba(39,192,113,.5);box-shadow:0 0 14px rgba(39,192,113,.28),inset 0 1px 0 rgba(255,255,255,.1)}
.bookrow.best .bkname{color:var(--text)}
.bookrow.best .bkmeta{color:var(--green)}
.bookrow.ref .bkname{color:var(--sub)}
.bkprice.pricegood{animation:priceFlashGood 1.8s ease-out}
.bkprice.pricebad{animation:priceFlashBad 1.8s ease-out}
.consensus{font-size:10.5px;font-weight:700;color:var(--sub);opacity:.75;padding:0 11px;letter-spacing:.1px}
/* ── FOOTER STRIP — highlighted stat chips + the bet action, one row, matching a sportsbook
   arb card's bottom "$ / % / action" bar instead of plain text buttons. */
.footstrip{display:flex;gap:6px;margin-top:10px}
.footstrip .fs-stat{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(255,255,255,.05);border:1px solid rgba(39,192,113,.35);border-radius:13px;padding:7px 4px;font-size:13px;font-weight:900;color:var(--green);font-variant-numeric:tabular-nums}
.footstrip .fs-stat span{font-size:8px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--sub);margin-top:1px}
.footstrip .fs-bet{flex:1.6;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg, rgba(210,245,255,.32) 0%, rgba(94,194,255,.22) 55%, rgba(39,192,113,.22) 100%);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(210,245,255,.6);color:#eafcff;border-radius:13px;font-weight:900;font-size:12px;letter-spacing:.2px;font-family:var(--font);cursor:pointer;text-decoration:none;text-align:center;
  text-shadow:0 0 8px rgba(255,255,255,.55);
  box-shadow:0 0 18px rgba(120,220,255,.4),inset 0 1px 0 rgba(255,255,255,.45),inset 0 -6px 12px rgba(94,194,255,.12)}
.footstrip .fs-bet.fs-bet-off{background:rgba(255,255,255,.06);backdrop-filter:none;-webkit-backdrop-filter:none;border-color:var(--border);color:var(--sub);text-shadow:none;box-shadow:none;cursor:default}
.trackrow{display:flex;justify-content:center;margin-top:8px}
.track-btn{background:none;border:1.5px solid rgba(39,192,113,.5);color:var(--green);border-radius:20px;padding:6px 16px;font-weight:800;font-size:11px;letter-spacing:.2px;font-family:var(--font);cursor:pointer;-webkit-tap-highlight-color:transparent}
.track-btn.on{background:var(--green-dim);border-color:var(--green)}
.pick{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pick .side{min-width:0}
.pick .side .m{font-size:10px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--accent)}
.pick .side .s{font-size:16px;font-weight:900;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.2px}
.p{color:var(--text);text-decoration:none;font-weight:900;font-variant-numeric:tabular-nums}
.p.pricegood{animation:priceFlashGood 1.8s ease-out}
.p.pricebad{animation:priceFlashBad 1.8s ease-out}
@keyframes priceFlashGood{0%{color:var(--green);text-shadow:0 0 12px rgba(39,192,113,.9)}70%{color:var(--green);text-shadow:0 0 12px rgba(39,192,113,.9)}100%{color:var(--text);text-shadow:none}}
@keyframes priceFlashBad{0%{color:var(--red);text-shadow:0 0 12px rgba(255,59,59,.9)}70%{color:var(--red);text-shadow:0 0 12px rgba(255,59,59,.9)}100%{color:var(--text);text-shadow:none}}
.pwrap{position:relative;display:inline-flex}
/* A tiny "still good vs Pinnacle" dot — sits at the corner, never over the digits, and just
   fades away on its own. No "bad" variant: if it's not good anymore, nothing shows at all
   (the row itself drops off once the arb closes; the red number-flash covers "got worse"). */
.pricepop{position:absolute;top:-6px;right:-6px;width:14px;height:14px;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:900;border-radius:50%;pointer-events:none;z-index:5;animation:popFade 1.8s ease-out forwards}
.pricepop.good{background:var(--green);color:#04140b;box-shadow:0 0 6px rgba(39,192,113,.7)}
@keyframes popFade{
  0%{transform:scale(.4);opacity:0}
  20%{transform:scale(1.1);opacity:1}
  30%{transform:scale(1);opacity:1}
  75%{opacity:1}
  100%{transform:scale(.8);opacity:0}
}
.curtot{font-size:11px;font-weight:700;color:var(--sub);margin-top:3px;font-variant-numeric:tabular-nums}
.curtot b{color:var(--text)}
.situ-note{font-size:10px;font-weight:600;font-style:italic;color:var(--sub);margin-top:3px;line-height:1.3}
.situ-note.warn{color:var(--amber);font-style:normal}
.pillrow{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.conf-pill{font-size:9px;font-weight:800;letter-spacing:.2px;color:var(--green);background:var(--green-dim);border:1px solid rgba(39,192,113,.4);border-radius:999px;padding:2px 7px;font-variant-numeric:tabular-nums}
.cmp{display:flex;align-items:center;flex-wrap:wrap;gap:5px;margin-top:9px;font-size:13px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums}
.cmp img{width:15px;height:15px;border-radius:4px;object-fit:cover;vertical-align:middle}
.cmp .bestpick{display:inline-flex;align-items:center;gap:6px;background:rgba(39,192,113,.12);border:1.5px solid rgba(39,192,113,.5);border-radius:14px;padding:5px 11px;box-shadow:0 0 14px rgba(39,192,113,.32),inset 0 1px 0 rgba(255,255,255,.12)}
.cmp .bk{font-size:9px;font-weight:800;letter-spacing:.3px;color:var(--sub)}
.cmp .vs{font-size:10px;font-weight:700;color:var(--sub);margin:0 1px}
.cmp .fairlbl{font-size:9px;font-weight:800;letter-spacing:.3px;color:var(--sub);margin-left:1px}
.cmp .pct{font-size:11px;font-weight:800;color:var(--green);margin-left:3px}
.cmp .pct.arb{color:var(--text)}
.cmp .lim{font-size:10px;font-weight:700;color:var(--amber);margin-left:auto}
.agree{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.05);border:1px solid var(--green);color:var(--text);border-radius:12px;padding:4px 10px;font-size:12px;font-weight:800;font-variant-numeric:tabular-nums}
.agree b{color:var(--green)}
.more{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.more .b{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;padding:4px 10px;border-radius:12px;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.16);color:var(--text);font-variant-numeric:tabular-nums}
.more .b img{width:14px;height:14px;border-radius:3px}
.brk-badge{font-size:9px;font-weight:800;letter-spacing:.5px;padding:2px 8px;border-radius:20px;background:rgba(77,184,255,.15);border:1px solid rgba(77,184,255,.5);color:var(--text)}
.stoppage-badge{font-size:9px;font-weight:900;letter-spacing:.6px;padding:2px 8px;border-radius:20px;background:var(--accent);border:1px solid var(--accent);color:#04121c;animation:greenPulse 1.8s ease-in-out infinite}
.hot-badge{font-size:9px;font-weight:800;letter-spacing:.5px;padding:2px 8px;border-radius:20px;background:rgba(245,166,35,.15);border:1px solid rgba(245,166,35,.55);color:var(--text)}
.sig{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.06);font-size:11px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
.trend.up{color:var(--green)}.trend.dn{color:var(--red)}
.acts{display:flex;gap:6px}
.acts button{border:1px solid var(--border);background:rgba(255,255,255,.06);color:var(--text);border-radius:12px;padding:5px 11px;font-weight:800;font-size:11px;font-family:var(--font)}
.acts button.bet{border-color:var(--green);color:var(--green)}
.acts button.bet.on{background:var(--green);color:#000}

/* ── TRACKER CARD ── */
.tk{border-radius:18px;padding:10px 12px;margin:0 16px 8px;font-size:12px}
.tk .h{display:flex;justify-content:space-between;gap:8px;font-weight:800}
.tk-tl{width:16px;height:16px;border-radius:4px;object-fit:cover;vertical-align:-3px;margin:0 3px}
.tk .m{font-size:11px;color:var(--text);margin-top:4px;line-height:1.6;font-variant-numeric:tabular-nums}
.tk-score{margin-top:5px;font-size:13px;font-weight:900;color:var(--text);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px;flex-wrap:wrap;text-transform:uppercase;letter-spacing:.2px}
.mv{margin-top:8px;padding:9px 11px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--border)}
.mvrow{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;padding:2px 0;font-variant-numeric:tabular-nums}
.mvrow+.mvrow{border-top:1px solid rgba(255,255,255,.06);margin-top:3px;padding-top:5px}
.mvl{color:var(--sub);font-weight:800;letter-spacing:.3px;text-transform:uppercase;font-size:9px;flex-shrink:0;width:56px}
.mvv{color:var(--text);flex:1}
.mvup{color:var(--green);font-weight:800;white-space:nowrap}
.mvdn{color:var(--red);font-weight:800;white-space:nowrap}
.mvflat{color:var(--sub);font-weight:700;white-space:nowrap}
.prog{margin-top:8px}
.prog .nums{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;margin-bottom:4px;font-variant-numeric:tabular-nums}
.prog .nums b{font-size:17px;color:var(--text)}
.prog .nums .dim{color:var(--sub);font-weight:600}
.bar{height:8px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--green));border-radius:999px;transition:width .4s}
.bar i.g{background:var(--green)}
.bar i.r{background:var(--red)}
.bar em{position:absolute;top:-3px;bottom:-3px;width:2px;background:#fff;opacity:.75}
.tk .m b{color:var(--green)}

/* ── INSIGHT BAR: "when to bet" ── */
#insight-bar{margin:0 16px 14px;padding:14px 16px 12px;border-radius:20px}
#insight-bar::before{content:'';position:absolute;inset:0;border-radius:20px;padding:1px;background:linear-gradient(160deg,rgba(77,184,255,.45) 0%,rgba(77,184,255,.12) 45%,rgba(255,255,255,.05) 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.tl-cb-header{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tl-collapse-btn{flex-shrink:0;width:24px;height:24px;border:none;background:none;color:var(--sub);font-size:13px;display:flex;align-items:center;justify-content:center;transition:transform .2s}
.tl-body{overflow:hidden;max-height:400px;transition:max-height .25s ease,opacity .2s ease;opacity:1}
.tl-body.collapsed{max-height:0;opacity:0}
.tl-cb-icon{flex-shrink:0;width:42px;height:42px;border-radius:11px;background:rgba(77,184,255,.12);border:1px solid rgba(77,184,255,.25);display:flex;align-items:center;justify-content:center}
.tl-cb-text{flex:1;min-width:0}
.tl-cb-title{font-size:18px;font-weight:800;color:var(--text);line-height:1.15;letter-spacing:-.3px}
.tl-cb-sub{font-size:12px;font-weight:600;color:var(--text);margin-top:3px;line-height:1.35}
.tl-daynav{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:10px}
.tl-daylabel{font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--text);min-width:70px;text-align:center;font-variant-numeric:tabular-nums}
.tl-arrow{position:relative;overflow:hidden;width:28px;height:28px;border-radius:9px;border:1px solid rgba(77,184,255,.35);background:rgba(255,255,255,.06);color:var(--accent);display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .12s,filter .12s;box-shadow:inset 0 1px 1px rgba(255,255,255,.2),inset 0 -1px 1px rgba(0,0,0,.2);flex-shrink:0}
.tl-arrow:active{transform:scale(.92);filter:brightness(1.2)}
.tl-arrow:disabled{opacity:.25;cursor:default;pointer-events:none}
.tl-chart{display:flex;align-items:flex-end;justify-content:space-between;gap:5px;height:90px;padding-top:4px}
.tl-slot{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;cursor:pointer;-webkit-tap-highlight-color:transparent;min-width:6px}
.tl-bcount{font-size:9px;font-weight:800;color:var(--text);line-height:1;margin-bottom:5px;-webkit-text-stroke:.5px var(--stroke);paint-order:stroke fill;text-shadow:0 0 6px rgba(77,184,255,.5);position:relative;z-index:3}
.tl-bar{width:100%;border-radius:4px;transition:transform .15s,filter .15s;min-height:6px;border:1px solid rgba(0,0,0,.5);box-shadow:0 1px 2px rgba(0,0,0,.4)}
.tl-slot.low .tl-bar{background:rgba(77,184,255,.22)}
.tl-slot.mid .tl-bar{background:rgba(77,184,255,.45)}
.tl-slot.bright .tl-bar{background:var(--accent);box-shadow:0 0 10px rgba(77,184,255,.4)}
.tl-slot.now .tl-bar{outline:1.5px solid rgba(255,255,255,.4);outline-offset:1px}
.tl-slot.sel .tl-bar{transform:scaleY(1.05);filter:brightness(1.3);outline:2px solid #fff;outline-offset:1px;box-shadow:0 0 16px rgba(77,184,255,.9)}
.tl-labels{position:relative;height:16px;margin-top:4px}
.tl-clabel{position:absolute;top:0;transform:translateX(-50%);font-size:8px;font-weight:700;color:var(--sub);white-space:nowrap}
.tl-clabel.peak{font-size:9px;font-weight:800;color:var(--accent);-webkit-text-stroke:.5px var(--stroke);paint-order:stroke fill;text-shadow:0 0 6px rgba(77,184,255,.4)}
.tl-detail{max-height:0;overflow:hidden;transition:max-height .25s ease}
.tl-detail.open{max-height:300px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.tl-drow{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;padding:3px 0}
.tl-dleague{font-size:9px;font-weight:800;color:var(--green);background:rgba(39,192,113,.12);padding:2px 6px;border-radius:4px;min-width:34px;text-align:center}
.tl-dteam{color:var(--text)}
.tl-dtime{color:var(--text);font-size:11px;font-weight:700;margin-left:auto;font-variant-numeric:tabular-nums}

.empty{text-align:center;padding:40px 20px;color:var(--sub);font-size:13px;font-weight:600;line-height:1.6}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1a1d22;border:1px solid var(--border);color:#fff;font-size:12px;font-weight:700;padding:10px 14px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:99}
.toast.show{opacity:1}
.cfg-tiny{position:fixed;left:0;bottom:0;width:22px;height:22px;background:none;border:none;color:transparent;z-index:40;padding:0}

/* ── BUTTON GLASS/GLARE — same frosted-card language as .glass, sized for filled buttons.
   Only touches buttons that already carry a solid fill/border (tabs, save, bet/hide/result,
   day-pager arrows, info, book toggles) — icon-only/text-only controls stay flat on purpose. */
.date-btn,.preset-add-btn,.acts button,.tl-arrow,.ctrl .ib,.book-chk{position:relative;overflow:hidden;background:linear-gradient(150deg,var(--card2) 0%,var(--card) 65%);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.date-btn::after,.preset-add-btn::after,.acts button::after,.tl-arrow::after,.ctrl .ib::after,.book-chk::after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 130% 65% at 0% 0%,var(--glare) 0%,rgba(255,255,255,.03) 42%,transparent 72%)}
.date-btn>*,.preset-add-btn>*,.acts button>*,.tl-arrow>*,.ctrl .ib>*,.book-chk>*{position:relative;z-index:1}

/* ── SPLASH — shows on every open, same beat every time: spin, then fade into the app. */
#splash{position:fixed;inset:0;z-index:9999;background:#171b24;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity .45s ease}
#splash.hide{opacity:0;pointer-events:none}
.splash-icon{position:relative;width:92px;height:92px;display:flex;align-items:center;justify-content:center}
.splash-ring{position:absolute;inset:0;width:92px;height:92px;transform:rotate(-90deg);animation:splashSpin 1s linear infinite}
.splash-ring circle{fill:none;stroke:var(--accent);stroke-width:5;stroke-linecap:round;stroke-dasharray:264;stroke-dashoffset:200}
/* smaller reuse of the splash mark for the "still searching" empty state */
.splash-icon.mini,.splash-ring.mini{width:52px;height:52px}
.searching{text-align:center;padding:36px 20px 40px;color:var(--sub);font-size:13px;font-weight:600;line-height:1.6}
.searching .splash-icon{margin:0 auto 14px}
.searching .searching-title{color:var(--text);font-size:15px;font-weight:800;margin-bottom:4px}
.splash-text{color:#eef1f7;font-size:19px;font-weight:700;font-family:var(--font);letter-spacing:.2px}
@keyframes splashSpin{to{transform:rotate(270deg)}}
</style>
</head>
<body>
<div id="splash">
  <div class="splash-icon">
    <svg class="splash-ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="42"></circle></svg>
  </div>
  <div class="splash-text">Direct Arbs</div>
</div>
<div id="app">

<header>
  <div class="header-row">
    <div class="brand"><div class="brand-text"><div>Direct</div><div class="accent">Arbs</div></div></div>
    <div class="header-meta">
      <div class="sync-dot" id="syncDot"></div>
      <span id="lastUpdated">--:--</span>
      <button id="reload" class="refresh-btn" title="Refresh">↻</button>
    </div>
  </div>
</header>

<div class="date-toggle">
  <button class="date-btn active" id="vLive">Live <span class="dt-n" id="liveN"></span></button>
  <button class="date-btn" id="vTrack">Tracker <span class="dt-n" id="trackN">0</span></button>
</div>

<div class="league-strip" id="chips"><!-- built dynamically --></div>

<div id="gameStateBar" class="gsbar"></div>

<div id="insight-bar" class="glass" style="display:none"></div>


<div class="filters-toggle" id="filtersToggle">
  <span class="fname">⚙ Filters</span>
  <span class="filters-summary" id="filtersSummary"></span>
  <span class="filters-chev" id="filtersChev">▾</span>
</div>
<div class="filters-panel" id="filtersPanel">
  <div class="ctrl">
    <label>Min Arb <input type="number" id="minArb" value="0" step="0.1" min="0">%</label>
    <label>Pin limit ≥ $<input type="number" id="minLim" value="1000" step="100" min="0"></label>
    <label>Price <input type="number" id="pMin" value="-400" step="5"> to <input type="number" id="pMax" value="250" step="5"></label>
  </div>
  <div class="ctrl-sub">
    <div class="ctrl-sub-label" style="display:flex;justify-content:space-between;align-items:center">Also scan vs Pinnacle <button class="clear-books-btn" id="clearBooks">Clear all</button></div>
    <div class="book-toggles" id="bookToggles"></div>
  </div>
  <div class="ctrl-sub" id="pbWrap" style="display:none">
    <div class="ctrl-sub-label">Props Builder — pick who to scan <span class="sub-note">only players from live games with props posted show up</span></div>
    <input type="text" id="pbSearch" class="pb-search" placeholder="Search a live player…" autocomplete="off">
    <div class="pb-suggest" id="pbSuggest" style="display:none"></div>
    <div class="pb-picked" id="pbPicked"></div>
  </div>
  <input type="checkbox" id="liveOnly" checked style="display:none">
  <div class="ctrl-sub">
    <label class="chk-row"><input type="checkbox" id="timeoutsOnly">Stoppage only <span class="note">off shows everything live · on narrows to halftime / timeout / between innings</span></label>
    <label class="chk-row"><input type="checkbox" id="sharpUfcOnly">SHARP UFC <img id="sharpUfcLogo" alt="Kalshi" style="display:none"> <span class="note">narrows to live SHARP UFC moneylines vs Kalshi</span></label>
  </div>
  <div class="ctrl-sub">
    <div class="ctrl-sub-label">Presets <span class="sub-note">— books + filters together, tap to stack more than one</span></div>
    <div class="book-toggles" id="presetChips"></div>
    <div class="preset-row">
      <button class="preset-add-btn" id="presetSave">＋ Save current books + filters as a preset</button>
    </div>
  </div>
</div>

<div id="view"><div class="empty">Loading…</div></div>
<div id="tracker" style="display:none"></div>
<div class="toast" id="toast"></div>
<button id="cfg" title="⋯" class="cfg-tiny"></button>

</div>
<script>
// ───────────────────────────── config ─────────────────────────────
const LS = { get:(k,d)=>{ try{ return localStorage.getItem(k) ?? d; }catch(e){ return d; } }, set:(k,v)=>{ try{ localStorage.setItem(k,v); }catch(e){} } };
const BACKEND = () => LS.get('oo_backend_url', 'https://nfl-props-tracker-1.vercel.app/api/odds');
const LEAGUES = {
  mlb:  { label:'MLB',  sport:'baseball',   league:'mlb' },
  nba:  { label:'NBA',  sport:'basketball', league:'nba' },
  wnba: { label:'WNBA', sport:'basketball', league:'wnba' },
  nfl:  { label:'NFL',  sport:'football',   league:'nfl' },
  cfb:  { label:'CFB',  sport:'football',   league:'ncaaf' },
  cbb:  { label:'CBB',  sport:'basketball', league:'ncaab' },
  nhl:  { label:'NHL',  sport:'hockey',     league:'nhl' },
  ufc:  { label:'UFC',  sport:'mma',        league:'ufc', mlOnly:true },
};
const REF_BOOK = 'Pinnacle';
// Every book scanned vs Pinnacle is now an individual toggle — FD and DK included, checked by
// default so behavior is unchanged out of the box, but removable ("just in case") like any other.
const EXTRA_BOOKS = [
  { key:'fanduel',   name:'FanDuel' },
  { key:'draftkings',name:'DraftKings' },
  { key:'mgm',       name:'BetMGM' },
  { key:'fanatics',  name:'Fanatics' },
  { key:'caesars',   name:'Caesars' },
  { key:'rebet',     name:'ReBet' },
  { key:'betonline', name:'BetOnline' },
  { key:'fliff',     name:'Fliff' },
  { key:'circa',     name:'Circa' },
  { key:'novig',     name:'Novig',     exch:true },
  { key:'kalshi',    name:'Kalshi',    exch:true },
  { key:'prophetx',  name:'Prophet X', exch:true },
  // Player-prop-only book: unlike every other entry here, its odds never come back from the
  // regular game-market fetch in loadOdds() (moneyline/spread/total/team-total), so toggling it
  // on drives a separate loadPlayerProps() fetch (see below) instead of just widening bookList.
  { key:'propbuilder', name:'Props Builder', props:true },
];
const EXCH = new Set(EXTRA_BOOKS.filter(b => b.exch).map(b => b.name.toLowerCase()));
// "Sharp" for the consensus line isn't just the no-vig exchanges — a regular book like Circa,
// FanDuel, or BetOnline posting the other side is just as real a signal that the market disagrees
// with this pick.
const SHARP_BOOKS = new Set([...EXCH, 'circa', 'fanduel', 'betonline']);
const DEFAULT_BOOKS = ['fanduel','draftkings'];
let extraBooks = (() => { try { const v = LS.get('live_extra_books', null); return new Set(v == null ? DEFAULT_BOOKS : JSON.parse(v)); } catch(e) { return new Set(DEFAULT_BOOKS); } })();
const saveExtraBooks = () => LS.set('live_extra_books', JSON.stringify([...extraBooks]));
const BOOK_SHORT = { 'pinnacle':'PIN', 'fanduel':'FD', 'draftkings':'DK', 'kalshi':'Kalshi' };
const IS_IOS = /iPhone|iPad|iPod/.test(navigator.userAgent), IS_ANDROID = /Android/.test(navigator.userAgent);
const MARKET = [
  { key:'ml',     label:'Moneyline', test: m => /^moneyline$/i.test(m) },
  { key:'spread', label:'Spread',    test: m => /^(point spread|run line|puck line|spread)$/i.test(m) },
  { key:'total',  label:'Total',     test: m => /^total (points|goals|runs)$/i.test(m) },
  { key:'tt',     label:'Team Total', test: m => /^team total$/i.test(m) },
];
const PERIODIC = /1st|2nd|3rd|4th|first|second|half|quarter|period|inning|overtime|alternate/i;

// ───────────────────────────── helpers ─────────────────────────────
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toDec = a => { a = Number(a); return a > 0 ? 1 + a/100 : 1 + 100/Math.abs(a); };
const imp = a => 1/toDec(a);
const fmtAm = a => { a = Number(a); return a > 0 ? '+' + a : String(a); };
const toAm = dec => dec >= 2 ? Math.round((dec - 1) * 100) : Math.round(-100 / (dec - 1));
const probToAm = p => { if (!(p > 0 && p < 1)) return 0; return p >= 0.5 ? -Math.round(100 * p / (1 - p)) : Math.round(100 * (1 - p) / p); };
const usd = n => n >= 1000 ? '$' + (n/1000).toFixed(1).replace(/\.0$/,'') + 'k' : '$' + Math.round(n);
// Tracker staking convention, display-only: risk 1u on underdogs (win more than 1u),
// win exactly 1u on favorites (risk more than 1u to get there).
const actualStake = amer => amer >= 0 ? 1 : Math.abs(amer) / 100;
const amerPayout = amer => amer >= 0 ? amer / 100 : 1;
function unitsResultFor(e) {
  if (e.status === 'won') return `+${amerPayout(e.betPrice).toFixed(2)}u`;
  if (e.status === 'lost') return `-${actualStake(e.betPrice).toFixed(2)}u`;
  return null;
}
// Team selections come back from the API as the full name ("Indiana Fever"); on the
// card that overflows and gets ellipsis-clipped, so trim to just the mascot/nickname.
// UFC (and anything else mlOnly, i.e. fighter names not team names) is left alone.
const shortTeamName = (name, league) => {
  const s = String(name || '').trim();
  if (!s || (league && league.mlOnly)) return s;
  const words = s.split(/\s+/);
  return words.length > 1 ? words[words.length - 1] : s;
};
const etTime = iso => { try { return new Date(iso).toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit', timeZone:'America/New_York' }); } catch(e) { return ''; } };
const etDay = iso => { try { return new Date(iso).toLocaleDateString('en-US', { weekday:'short', timeZone:'America/New_York' }); } catch(e) { return ''; } };
const chunk = (a, n) => { const o = []; for (let i = 0; i < a.length; i += n) o.push(a.slice(i, i+n)); return o; };
const deepLink = o => { const d = o?.deep_link; if (!d || typeof d !== 'object') return null; return (IS_ANDROID && d.android) || d.ios || d.desktop || d.android || null; };
let toastT; const toast = m => { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200); };

async function oo(endpoint, params) {
  const r = await fetch(BACKEND(), { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ endpoint, params: params || {} }) });
  const t = await r.text();
  if (!r.ok) { let m = t; try { const j = JSON.parse(t); m = j.error + (j.body ? ' — ' + j.body : ''); } catch(e) {} throw new Error(`backend ${r.status}: ${m}`); }
  return JSON.parse(t);
}

  const allChip = `<button class="league-chip all${allOn ? ' active' : ''}" data-k="ALL">ALL</button>`;
  const leagueChips = allKeys.map(k => {
    const l = LEAGUES[k];
    const n = fixtures.filter(f => f.lk === k).length;
    return `<button class="league-chip${active.has(k) ? ' active' : ''}${solo && active.has(k) ? ' solo' : ''}" data-k="${k}">${n ? '<span class="chip-live-dot"></span>' : ''}<span class="chip-name">${l.label}</span><span class="chip-count">${n || ''}</span></button>`;
  }).join('');
  $('#chips').innerHTML = allChip + leagueChips;
  const toggleLeague = k => { if (active.has(k)) active.delete(k); else active.add(k); LS.set('live_leagues', JSON.stringify([...active])); renderChips(); load(true); };
  const soloLeague = k => { active.clear(); active.add(k); LS.set('live_leagues', JSON.stringify([...active])); renderChips(); load(true); };
  // ALL chip: one tap flips between "everything on" and "everything off".
  $('#chips').querySelector('[data-k="ALL"]').addEventListener('click', () => {
    if (allKeys.every(k => active.has(k))) active.clear(); else allKeys.forEach(k => active.add(k));
    LS.set('live_leagues', JSON.stringify([...active])); renderChips(); load(true);
  });
  let clickTimer = null;
  // Single click toggles a league on/off. Double-click "solos" it — clears every other
  // league and shows just this one, so you don't have to hunt down stray toggles scrolled
  // out of view in the strip.
  $('#chips').querySelectorAll('.league-chip:not(.all)').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.k;
    if (clickTimer) { clearTimeout(clickTimer); clickTimer = null; soloLeague(k); }
    else { clickTimer = setTimeout(() => { clickTimer = null; toggleLeague(k); }, 240); }
  }));
}

// ───────────────────────────── fetch ─────────────────────────────
const isLiveStatus = st => /live|progress|half|in_play|playing|ongoing/i.test(String(st || ''));
let diag = {};
let upcomingAll = []; // every non-live future fixture, no time cap — feeds the "when to bet" insight bar
async function loadFixtures() {
  const now = Date.now(); const out = []; diag = {}; const upcomingNext = [];
  for (const k of active) {
    const L = LEAGUES[k];
    try {
      const raw = []; let page = 1;
      for (let i = 0; i < 6; i++) { const r = await oo('/fixtures', { sport:L.sport, league:L.league, page }); (r?.data || []).forEach(f => raw.push(f)); if (!r?.has_more) break; page++; }
      const st = {}; raw.forEach(f => { const key = (f.is_live ? 'is_live' : String(f.status || '?')); st[key] = (st[key] || 0) + 1; });
      diag[L.label] = { n: raw.length, st, next: raw.filter(f => new Date(f.start_date).getTime() > now).sort((a, b) => new Date(a.start_date) - new Date(b.start_date))[0]?.start_date || null };
      raw.forEach(f => {
        const t = new Date(f.start_date).getTime();
        const live = !!f.is_live || isLiveStatus(f.status) || (t <= now && t > now - 4*3600e3 && !/completed|cancelled|unplayed|scheduled/i.test(String(f.status||'')));
        if (/completed|cancelled/i.test(String(f.status || ''))) return;
        // insight bar: every future, non-live fixture — no window cap here (renderInsight bounds the window it displays)
        if (!live && t > now) {
          const hc0 = f.home_competitors?.[0] || {}, ac0 = f.away_competitors?.[0] || {};
          // Team abbreviations read fine in the action window ("NYY @ BOS"), but a 3-letter
          // truncation of a fighter's name doesn't — show UFC fighters by their full name instead.
          const home = k === 'ufc' ? (hc0.name || 'TBD') : (hc0.abbreviation || (hc0.name||'').slice(0,3).toUpperCase());
          const away = k === 'ufc' ? (ac0.name || 'TBD') : (ac0.abbreviation || (ac0.name||'').slice(0,3).toUpperCase());
          upcomingNext.push({ id:f.id, lk:k, label:L.label, start:t, home, away });
        }
        if (!live) return;                                                   // LIVE ONLY
        const hc = f.home_competitors?.[0] || {}, ac = f.away_competitors?.[0] || {};
        out.push({ id:f.id, lk:k, league:L, start:f.start_date, live, status:f.status,
          home:{ id:hc.id, name:hc.name || f.home_team_display || '', ab:hc.abbreviation || (hc.name||'').slice(0,3).toUpperCase(), logo:hc.logo || '' },
          away:{ id:ac.id, name:ac.name || f.away_team_display || '', ab:ac.abbreviation || (ac.name||'').slice(0,3).toUpperCase(), logo:ac.logo || '' } });
      });
    } catch(e) { console.warn('[live] fixtures', k, e.message); diag[L.label] = { error: e.message }; }
  }
  console.log('[live] fixtures diag:', JSON.stringify(diag));
  upcomingAll = upcomingNext.sort((a, b) => a.start - b.start);
  renderInsight(out, upcomingAll);
  return out.sort((a, b) => (b.live - a.live) || new Date(a.start) - new Date(b.start));
}

async function loadOdds(fxs) {
  const byFx = {};
  const groups = {}; fxs.forEach(f => (groups[f.lk] = groups[f.lk] || []).push(f));
  let done = 0; const total = fxs.length;
  for (const [lk, list] of Object.entries(groups)) {
    const L = LEAGUES[lk];
    const marketNames = L.mlOnly ? ['moneyline'] : ['moneyline','point spread','total points','run line','puck line','total goals','total runs','team total'];
    const extra = [...extraBooks].map(k => EXTRA_BOOKS.find(b => b.key === k && !b.props)?.name).filter(Boolean);
    if (lk === 'ufc' && !extra.includes('Kalshi')) extra.push('Kalshi'); // UFC's Kalshi-as-reference needs it regardless of the checklist
    const bookList = [...new Set([REF_BOOK, ...extra])];
    for (const batch of chunk(list, 5)) {
      const calls = chunk(bookList, 5).map(bk => oo('/fixtures/odds', { fixture_id: batch.map(f => f.id), sportsbook: bk, market: marketNames }).catch(e => { console.warn('[live] odds', e.message); return null; }));
      const results = await Promise.all(calls);
      results.forEach(r => (r?.data || []).forEach(d => { (byFx[d.id] = byFx[d.id] || []).push(...(d.odds || [])); }));
      done += batch.length;
    }
  }
  return byFx;
}

// ───────────────────────────── Props Builder (player props, pick-your-own) ─────────────────────────────
// Every other book here trades game markets (moneyline/spread/total), fetched with an explicit
// market-name filter in loadOdds(). Props Builder only carries player props, which aren't in that
// list at all, so it gets its own fetch — scoped to whichever players you've actually picked
// (arbing every player on every live roster against Pinnacle would be a huge, mostly-useless
// payload), pulled fresh each cycle only while the Props Builder toggle is on. is_main:true keeps
// it to main/standard player markets only (same technique the NFL sharp-props tracker uses), and
// FanDuel comes along for the same "FD·Pin aligned" fair-price averaging the game markets get.
let pbCandidates = {};                 // "<player>|<fixtureId>" -> { player, f, rows:[raw odds] }
let pbPicked = (() => { try { return new Set(JSON.parse(LS.get('live_pb_picked', '[]'))); } catch(e) { return new Set(); } })();
const savePbPicked = () => LS.set('live_pb_picked', JSON.stringify([...pbPicked]));
function isGameMarket(name) { return MARKET.some(m => m.test(name)) || PERIODIC.test(name); }
async function loadPlayerProps() {
  if (!extraBooks.has('propbuilder') || !fixtures.length) { pbCandidates = {}; return; }
  const out = {};
  for (const batch of chunk(fixtures, 5)) {
    try {
      // is_main:true — standard lines only, same technique the NFL sharp-props tracker uses to
      // keep this to the main/popular player markets instead of every alternate line variant.
      const r = await oo('/fixtures/odds', { fixture_id: batch.map(f => f.id), sportsbook: ['Pinnacle', 'Props Builder', 'FanDuel'], is_main: true });
      (r?.data || []).forEach(d => {
        const f = fixtures.find(x => x.id === d.id); if (!f) return;
        (d.odds || []).forEach(o => {
          if (o.price == null || !o.selection || isGameMarket(String(o.market || ''))) return;
          const player = String(o.selection).trim();
          const key = player + '|' + f.id;
          (out[key] = out[key] || { player, f, rows: [] }).rows.push(o);
        });
      });
    } catch(e) { console.warn('[live] player props fetch failed', e.message); }
  }
  pbCandidates = out;
  // Drop picks whose game ended / stopped posting entirely, same spirit as the pinned-row cleanup.
  [...pbPicked].forEach(k => { if (!out[k]) pbPicked.delete(k); });
  renderPbPicker();
}
// Same devig-and-compare math as computeRows, just keyed by market+line instead of team side,
// and against whichever picks you've made instead of every row the odds feed returns.
function pbRows() {
  const rows = [];
  pbPicked.forEach(key => {
    const c = pbCandidates[key]; if (!c) return;
    const groups = {};
    c.rows.forEach(o => {
      const side = String(o.selection_line || '').toLowerCase(); if (side !== 'over' && side !== 'under') return;
      const pts = o.points == null ? null : Number(o.points);
      const gk = o.market + '|' + pts;
      const g = (groups[gk] = groups[gk] || { market: o.market, points: pts, pin: {}, pb: {}, fd: {} });
      const bk = String(o.sportsbook || '').toLowerCase();
      if (bk === 'pinnacle') { if (!g.pin[side] || Number(o.price) > Number(g.pin[side].price)) g.pin[side] = o; }
      else if (bk === 'props builder') { if (!g.pb[side] || Number(o.price) > Number(g.pb[side].price)) g.pb[side] = o; }
      else if (bk === 'fanduel') { if (!g.fd[side] || Number(o.price) > Number(g.fd[side].price)) g.fd[side] = o; }
    });
    Object.values(groups).forEach(g => {
      if (!g.pin.over || !g.pin.under) return; // need both Pinnacle sides to devig a fair price
      const hold = imp(g.pin.over.price) + imp(g.pin.under.price);
      if (hold < 0.97 || hold > 1.15) return;
      const devig = (a, b) => { const x = imp(a), y = imp(b); return { over: x/(x+y), under: y/(x+y) }; };
      let fair = devig(g.pin.over.price, g.pin.under.price);
      // Same "FD·Pin aligned" refinement the game markets get: when FanDuel's own devigged fair
      // agrees with Pinnacle's (within ALIGN_CENTS on both sides), average the two instead of
      // trusting Pinnacle alone.
      const aligned = !!(g.fd.over && g.fd.under && centsDiff(g.fd.over.price, g.pin.over.price) <= ALIGN_CENTS && centsDiff(g.fd.under.price, g.pin.under.price) <= ALIGN_CENTS);
      if (aligned) { const ff = devig(g.fd.over.price, g.fd.under.price); fair = { over:(fair.over+ff.over)/2, under:(fair.under+ff.under)/2 }; }
      ['over','under'].forEach(side => {
        const pb = g.pb[side]; if (!pb) return;
        const oppSide = side === 'over' ? 'under' : 'over';
        const fp = fair[side];
        const ev = fp * toDec(pb.price) - 1;
        const arb = 1 - (imp(pb.price) + imp(g.pin[oppSide].price));
        if (arb <= 0) return; // this app is locked-arb-only everywhere else too
        const pr = Number(pb.price); if (pr < Number($('#pMin').value) || pr > Number($('#pMax').value)) return;
        const agreeNote = aligned ? `✓ FD &amp; PIN AGREE <b>FD ${fmtAm(g.fd[side].price)}</b> · <b>PIN ${fmtAm(g.pin[side].price)}</b> → fading Props Builder` : '';
        rows.push({
          key: `pb|${key}|${g.market}|${g.points}|${side}`, f: c.f,
          mk: { key:'prop', label: g.market },
          sideLabel: `${c.player} ${side === 'over' ? 'Over' : 'Under'} ${g.points}`,
          ttSide:null, pickSide:null, pickPoints:g.points, overUnder:side,
          fair:fp, aligned, agreeNote, refLabel: aligned?'FD·Pin':'PIN', refBook:'Pinnacle', refBookShort:'PIN', fdPrice: aligned ? g.fd[side].price : null,
          pin:{ mine:g.pin[side].price, other:g.pin[oppSide].price, lim:liqOf(g.pin[side]), depth:null },
          books:[{ book:'Props Builder', price:pr, ev, arb, exch:false, liq:liqOf(pb), depth:null, o:pb }],
          best:null, sharpFor:0, sharpAgainst:0,
        });
        rows[rows.length - 1].best = rows[rows.length - 1].books[0];
      });
    });
  });
  applyTrend(rows);
  return rows;
}

// ───────────────────────────── Kalshi football props (automatic, no picking) ─────────────────────────────
// Backtested signal: Kalshi's own liquidity on a football player prop is a real confidence read —
// rushing/receiving yards hold up at $2.5k+ resting size, passing yards needs $5k+, anytime-TD
// needs $10k+ before it's worth anything (thin Kalshi liquidity, like the $14 / $847 rows circled
// in the reference screenshot, isn't the same signal as the $50k row next to it). Unlike Props
// Builder this runs automatically for every live NFL/CFB game — no picking a player, no toggle to
// flip — and arbs Kalshi's devigged fair against whichever regular books are already toggled on,
// same as Pinnacle does for game markets. Pinnacle comes along too, purely to flag when Kalshi's
// own number also agrees with Pinnacle's (a second, independent sharp source lining up).
const KALSHI_PROP_MARKETS = [
  { key:'rush_yds', label:'Rushing Yards',   test:m => /rushing yards/i.test(m)   && !/\+/.test(m), minLiq:2500 },
  { key:'pass_yds', label:'Passing Yards',   test:m => /passing yards/i.test(m)   && !/\+/.test(m), minLiq:5000 },
  { key:'rec_yds',  label:'Receiving Yards', test:m => /receiving yards/i.test(m) && !/\+/.test(m), minLiq:2500 },
  { key:'td',       label:'Anytime TD',      test:m => /anytime/i.test(m) && /touchdown/i.test(m),  minLiq:10000 },
];
let kalshiCandidates = {}; // "<player>|<fixtureId>" -> { player, f, rows:[raw odds] }
async function loadKalshiProps() {
  const fbFx = fixtures.filter(f => f.lk === 'nfl' || f.lk === 'cfb');
  if (!fbFx.length) { kalshiCandidates = {}; return; }
  const extra = [...extraBooks].map(k => EXTRA_BOOKS.find(b => b.key === k && !b.props)?.name).filter(Boolean);
  const bookList = [...new Set(['Kalshi', REF_BOOK, ...extra])];
  const out = {};
  for (const fxBatch of chunk(fbFx, 5)) {
    for (const bkBatch of chunk(bookList, 5)) {
      try {
        const r = await oo('/fixtures/odds', { fixture_id: fxBatch.map(f => f.id), sportsbook: bkBatch, is_main: true });
        (r?.data || []).forEach(d => {
          const f = fbFx.find(x => x.id === d.id); if (!f) return;
          (d.odds || []).forEach(o => {
            if (o.price == null || !o.selection) return;
            const mkt = String(o.market || '');
            if (!KALSHI_PROP_MARKETS.some(m => m.test(mkt))) return;
            const player = String(o.selection).trim();
            const key = player + '|' + f.id;
            (out[key] = out[key] || { player, f, rows: [] }).rows.push(o);
          });
        });
      } catch(e) { console.warn('[live] kalshi props fetch failed', e.message); }
    }
  }
  kalshiCandidates = out;
}
function kalshiRows() {
  const out = [];
  Object.values(kalshiCandidates).forEach(c => {
    const groups = {};
    c.rows.forEach(o => {
      const side = String(o.selection_line || '').toLowerCase(); if (side !== 'over' && side !== 'under') return;
      const M = KALSHI_PROP_MARKETS.find(m => m.test(o.market)); if (!M) return;
      const pts = o.points == null ? null : Number(o.points);
      const gk = M.key + '|' + pts;
      const g = (groups[gk] = groups[gk] || { M, points:pts, kalshi:{}, pin:{}, books:{} });
      const bk = String(o.sportsbook || '').toLowerCase();
      if (bk === 'kalshi') { if (!g.kalshi[side] || Number(o.price) > Number(g.kalshi[side].price)) g.kalshi[side] = o; }
      else if (bk === 'pinnacle') { if (!g.pin[side] || Number(o.price) > Number(g.pin[side].price)) g.pin[side] = o; }
      else { const bs = (g.books[bk] = g.books[bk] || {}); if (!bs[side] || Number(o.price) > Number(bs[side].price)) bs[side] = o; }
    });
    Object.values(groups).forEach(g => {
      if (!g.kalshi.over || !g.kalshi.under) return; // need both Kalshi sides to devig a fair price
      const depthOver = liqDepth(g.kalshi.over), depthUnder = liqDepth(g.kalshi.under);
      const liqOver = depthOver ? depthOver.total : liqOf(g.kalshi.over);
      const liqUnder = depthUnder ? depthUnder.total : liqOf(g.kalshi.under);
      const devig = (a, b) => { const x = imp(a), y = imp(b); return { over: x/(x+y), under: y/(x+y) }; };
      const fair = devig(g.kalshi.over.price, g.kalshi.under.price);
      ['over','under'].forEach(side => {
        const liq = side === 'over' ? liqOver : liqUnder; if (liq == null || liq < g.M.minLiq) return;
        const oppSide = side === 'over' ? 'under' : 'over';
        const fp = fair[side];
        const pinSide = g.pin[side];
        const kalshiBacksPin = !!(pinSide && centsDiff(g.kalshi[side].price, pinSide.price) <= ALIGN_CENTS && liq >= 10000);
        Object.entries(g.books).forEach(([bookName, sides]) => {
          const bo = sides[side]; if (!bo) return;
          const pr = Number(bo.price); if (pr < Number($('#pMin').value) || pr > Number($('#pMax').value)) return;
          const ev = fp * toDec(pr) - 1;
          const arb = 1 - (imp(pr) + imp(g.kalshi[oppSide].price));
          if (arb <= 0) return; // locked-arb-only, same as everywhere else in this app
          const properName = EXTRA_BOOKS.find(b => b.name.toLowerCase() === bookName)?.name || bo.sportsbook;
          const agreeNote = kalshiBacksPin ? `✓ KALSHI &amp; PIN AGREE <b>Kalshi ${fmtAm(g.kalshi[side].price)}</b> · <b>PIN ${fmtAm(pinSide.price)}</b> · ${usd(liq)} Kalshi liquidity` : '';
          out.push({
            key: `kx|${c.player}|${c.f.id}|${g.M.key}|${g.points}|${side}`, f: c.f,
            mk: { key:'prop', label: g.M.label },
            sideLabel: `${c.player} ${side === 'over' ? 'Over' : 'Under'} ${g.points}`,
            ttSide:null, pickSide:null, pickPoints:g.points, overUnder:side,
            fair:fp, aligned:kalshiBacksPin, agreeNote, refLabel:'Kalshi', refBook:'Kalshi', refBookShort:'Kalshi', fdPrice: kalshiBacksPin ? pinSide.price : null,
            pin:{ mine:g.kalshi[side].price, other:g.kalshi[oppSide].price, lim:null, depth:{ total:liq, avg:g.kalshi[side].price } },
            books:[{ book:properName, price:pr, ev, arb, exch:false, liq:null, depth:null, o:bo }],
            best:null, sharpFor:0, sharpAgainst:0,
          });
          out[out.length - 1].best = out[out.length - 1].books[0];
        });
      });
    });
  });
  applyTrend(out);
  return out;
}

// ───────────────────────────── insight bar: "when to bet" ─────────────────────────────
// Same shape as a busy scoreboard's "when to tune in" widget: bin every tune-in moment
// (a game start, or "right now" for whatever's already live) into 30-min slots, find the
// slots that cluster meaningfully above the average, and call that out — colored red when
// the action IS the cluster (live right now), blue for "come back at X", amber when it's
// live but thin. Bounded to the next 48h so a long schedule doesn't flatten the chart.
// Bins every tune-in moment (a game start, or "right now" for whatever's live) into hourly
// buckets, groups them into calendar days, and shows ONE day at a time — arrows page to
// tomorrow, the day after, etc. — so bars stay wide and readable instead of a 48h strip
// squeezed into one card. The day you navigate to stays put across the 5s refresh; only a
// forced fixture reload (a league toggle) resets the view back to today.
const UG_HOURS_FORWARD = 96; // 4 days of hourly buckets kept, paged a day at a time
const nyDateStr = ms => new Date(ms).toLocaleDateString('en-US', { timeZone: 'America/New_York' });
const nyWeekdayShort = ms => new Date(ms).toLocaleDateString('en-US', { weekday:'short', timeZone: 'America/New_York' });
const nyHourLabel = ms => { const h = Number(new Date(ms).toLocaleTimeString('en-US', { hour:'numeric', hour12:false, timeZone:'America/New_York' })) % 24; const hh = h % 12 || 12, ap = h >= 12 ? 'p' : 'a'; return `${hh}${ap}`; };
let insightDayOffset = 0;
let insightCollapsed = LS.get('live_insight_collapsed', '0') === '1';
let insightSelectedSlot = null; // survives the poll's re-render so an open slot detail doesn't keep snapping shut
function renderInsight(liveFixtures, upcoming) {
  const bar = $('#insight-bar'); if (!bar) return;
  const now = Date.now();
  const startHour = Math.floor(now / 3600e3) * 3600e3;
  const buckets = [];
  for (let i = 0; i < UG_HOURS_FORWARD; i++) buckets.push({ t: startHour + i * 3600e3, moments: [] });
  upcoming.forEach(g => { const idx = Math.floor((g.start - startHour) / 3600e3); if (idx >= 0 && idx < buckets.length) buckets[idx].moments.push({ ms: g.start, g: { label: g.label, away: g.away, home: g.home } }); });
  liveFixtures.forEach(f => buckets[0].moments.push({ ms: now, g: { label: f.league.label, away: f.away.ab, home: f.home.ab }, live: true }));

  if (!buckets.some(b => b.moments.length)) { bar.style.display = 'none'; return; }
  const todayStr = nyDateStr(now);
  const days = [];
  buckets.forEach((b, i) => {
    const ds = nyDateStr(b.t);
    let day = days[days.length - 1];
    if (!day || day.key !== ds) { day = { key: ds, isToday: ds === todayStr, start: i, end: i }; days.push(day); }
    day.end = i;
  });

// Swap in new HTML without the page jumping: skip entirely if nothing actually changed (the
// odds refresh runs every 2s, but most cycles produce byte-identical output), and otherwise
// preserve scroll position across the swap — a full innerHTML replacement resets it by default,
// which is what made every refresh feel like a "bump" while you were mid-read on a card.
function setViewHtml(view, html) {
  if (view.dataset.lastHtml === html) return false;
  view.dataset.lastHtml = html;
  const y = window.scrollY;
  view.innerHTML = html;
  window.scrollTo(0, y);
  requestAnimationFrame(() => window.scrollTo(0, y));
  return true;
}
// Once you've bet a side, the directly-opposing side of that SAME market/line is a correlated,
// not-a-new-opportunity row (you already have skin in this exact game): FanDuel ML you took means
// the Celtics ML on the other side isn't a fresh idea, it's just the bet you already made mirrored
// back at you. A different market on the same teams (the spread, the total, a player prop) is a
// genuinely different bet and stays — this only ever hides the exact mirror of an exact market.
function isCorrelatedOpposite(r) {
  return Object.values(log).some(e => {
    if (e.fid !== r.f.id || e.mkKey !== r.mk.key) return false;
    if (r.mk.key === 'ml') return !!(e.pickSide && r.pickSide && e.pickSide !== r.pickSide);
    if (r.mk.key === 'total') return e.pickPoints === r.pickPoints && !!(e.overUnder && r.overUnder && e.overUnder !== r.overUnder);
    if (r.mk.key === 'tt') return e.pickSide === r.pickSide && e.pickPoints === r.pickPoints && e.overUnder !== r.overUnder;
    if (r.mk.key === 'spread') return e.pickSide !== r.pickSide && Number(e.pickPoints) === -Number(r.pickPoints);
    return false; // player props: no game-market correlation to check against
  });
}

  if (busy) return; busy = true; setSync('busy'); $('#reload').classList.add('spinning');
  // Fire-and-forget, throttled — doesn't block the odds refresh above.
  if (Date.now() - lastGradeAt > 30000) { lastGradeAt = Date.now(); autoGradeTracked(); refreshTrackedProgress(); }
  try {
    if (force || !fixtures.length || Date.now() - lastFixAt > 60e3) { fixtures = await loadFixtures(); lastFixAt = Date.now(); }
    renderChips();
    if (!fixtures.length) {
      rows = []; if (viewMode === 'tracker') { renderTracker(); busy = false; setSync('idle'); $('#reload').classList.remove('spinning'); return; }
      setLastUpdated(new Date().toLocaleTimeString([], { hour:'numeric', minute:'2-digit' }));
      const searchHtml = `<div class="searching">
        <div class="splash-icon mini"><svg class="splash-ring mini" viewBox="0 0 100 100"><circle cx="50" cy="50" r="42"></circle></svg></div>
        <div class="searching-title">No live games right now</div>
      </div>`;
      setViewHtml($('#view'), searchHtml);
      updateStatusStrip();
      busy = false; setSync('idle'); $('#reload').classList.remove('spinning'); return;
    }
    const [byFx, st] = await Promise.all([loadOdds(fixtures), loadState(fixtures), loadPlayerProps(), loadKalshiProps()]);
    gameState = st;
    if (!window._lg) { window._lg = true; const all = Object.values(byFx).flat(); console.log('[live] markets seen:', [...new Set(all.map(o => o.market))]); console.log('[live] books seen:', [...new Set(all.map(o => o.sportsbook))]); console.log('[live] sample row:', JSON.stringify(all[0] || {}).slice(0, 400)); }
    window._byFx = byFx;
    rows = computeRows(fixtures, byFx).concat(pbRows()).concat(kalshiRows());
    pruneSeen(new Set(rows.map(r => r.key)));
    lastAt = Date.now();
    setLastUpdated(new Date().toLocaleTimeString([], { hour:'numeric', minute:'2-digit', second:'2-digit' }));
    render();
  } catch(e) { console.error(e); setLastUpdated('error'); setSync('error'); toast(e.message); }
  busy = false; if ($('#syncDot').classList.contains('live')) setSync('idle'); $('#reload').classList.remove('spinning');
}
function recompute() { updateFiltersSummary(); if (window._byFx) { rows = computeRows(fixtures, window._byFx).concat(pbRows()).concat(kalshiRows()); pruneSeen(new Set(rows.map(r => r.key))); render(); } }
['minArb','minLim','pMin','pMax','liveOnly','timeoutsOnly','sharpUfcOnly'].forEach(id => $('#' + id).addEventListener('change', () => { saveLastFilters(); recompute(); }));
$('#presetSave').addEventListener('click', () => {
  const name = prompt('Name this preset (e.g. "Sharp UFC", "Loose EV"):'); if (!name || !name.trim()) return;
  presets[name.trim()] = { books: [...extraBooks], ...getFilterState() };
  activePresets.add(name.trim());
  savePresets(); saveActivePresets(); renderPresetChips();
  toast(`Saved "${name.trim()}" — books + filters`);
});
$('#clearBooks').addEventListener('click', clearAllBooks);
$('#reload').addEventListener('click', () => load(true));
$('#cfg').addEventListener('click', () => { const v = prompt('Backend URL (your /api/odds):', BACKEND()); if (v != null && v.trim()) { LS.set('oo_backend_url', v.trim()); toast('Saved'); load(true); } });

function setFiltersOpen(open) {
  $('#filtersToggle').classList.toggle('open', open);
  $('#filtersPanel').classList.toggle('open', open);
  $('#filtersChev').textContent = open ? '▴' : '▾';
  LS.set('live_filters_open', open ? '1' : '0');
}
$('#filtersToggle').addEventListener('click', () => setFiltersOpen(!$('#filtersPanel').classList.contains('open')));
loadLastFilters();
setFiltersOpen(LS.get('live_filters_open', '0') === '1');
renderBookToggles();
renderPresetChips();
updateFiltersSummary();
renderPbPicker();
$('#pbSearch')?.addEventListener('input', e => renderPbSuggest(e.target.value));

renderChips();
$('#vLive').addEventListener('click', () => setView('live'));
$('#vTrack').addEventListener('click', () => setView('tracker'));
saveLog();
// keep the iOS status bar / task-switcher chrome matching whichever theme is actually showing
(() => {
  const mq = window.matchMedia('(prefers-color-scheme: light)');
  const sync = () => { const meta = $('#themeColorMeta'); if (meta) meta.setAttribute('content', mq.matches ? '#1c212c' : '#171b24'); };
  mq.addEventListener ? mq.addEventListener('change', sync) : mq.addListener(sync);
  sync();
})();
loadBookLogos().then(() => { renderBookToggles(); load(true); });
setInterval(() => { if (document.visibilityState === 'visible') load(false); }, 2000);
// Splash plays the same short beat every time the app opens, independent of how long real
// data takes to load — it's a brand moment, not a data-loading spinner.
setTimeout(() => { const s = $('#splash'); if (!s) return; s.classList.add('hide'); setTimeout(() => s.remove(), 500); }, 1300);
</script>
