<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WNBA Headshot Lookup</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #0c0d10;
    color: #fff;
    padding: 24px;
  }
  .container {
    max-width: 800px;
    margin: 0 auto;
  }
  h1 {
    font-size: 24px;
    font-weight: 800;
    margin-bottom: 8px;
    color: #7dd3fc;
  }
  .subtitle {
    font-size: 12px;
    color: #888;
    margin-bottom: 20px;
  }
  .input-group {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  input {
    flex: 1;
    padding: 10px 14px;
    background: #1a1d22;
    border: 1px solid #2d3850;
    border-radius: 6px;
    color: #fff;
    font-size: 14px;
  }
  input:focus {
    outline: none;
    border-color: #7dd3fc;
    box-shadow: 0 0 0 2px rgba(125, 211, 252, 0.1);
  }
  button {
    padding: 10px 16px;
    background: #7dd3fc;
    color: #050507;
    border: none;
    border-radius: 6px;
    font-weight: 700;
    cursor: pointer;
    font-size: 13px;
  }
  button:hover {
    background: #5dc5ff;
  }
  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .status {
    font-size: 12px;
    color: #888;
    margin-bottom: 16px;
    min-height: 18px;
  }
  .status.loading {
    color: #7dd3fc;
  }
  .status.error {
    color: #ff6b6b;
  }
  .status.success {
    color: #51cf66;
  }
  .results {
    display: grid;
    gap: 16px;
  }
  .result-card {
    background: #1a1d22;
    border: 1px solid #2d3850;
    border-radius: 12px;
    padding: 16px;
  }
  .result-header {
    font-weight: 700;
    margin-bottom: 12px;
    font-size: 14px;
  }
  .player-row {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    margin-bottom: 12px;
    padding-bottom: 12px;
    border-bottom: 1px solid #2d3850;
  }
  .player-row:last-child {
    margin-bottom: 0;
    padding-bottom: 0;
    border-bottom: none;
  }
  .headshot {
    width: 60px;
    height: 60px;
    border-radius: 6px;
    object-fit: cover;
    object-position: center top;
    flex-shrink: 0;
    background: #0a0b0d;
  }
  .player-info {
    flex: 1;
    min-width: 0;
  }
  .player-name {
    font-weight: 700;
    font-size: 13px;
    margin-bottom: 4px;
  }
  .player-details {
    font-size: 11px;
    color: #888;
    margin-bottom: 6px;
  }
  .url-box {
    background: #0a0b0d;
    border: 1px solid #2d3850;
    border-radius: 4px;
    padding: 8px;
    font-size: 10px;
    font-family: 'JetBrains Mono', monospace;
    word-break: break-all;
    color: #7dd3fc;
    cursor: pointer;
    transition: all 0.2s;
  }
  .url-box:hover {
    background: #1a1d22;
  }
  .copy-btn {
    font-size: 11px;
    padding: 4px 8px;
    margin-top: 6px;
  }
  .roster-stats {
    background: #050507;
    border: 1px solid #2d3850;
    border-radius: 8px;
    padding: 12px;
    margin-top: 16px;
    font-size: 12px;
  }
  .roster-stats div {
    margin: 4px 0;
  }
  .load-roster-btn {
    margin-top: 16px;
    width: 100%;
    padding: 12px;
  }
</style>
</head>
<body>
<div class="container">
  <h1>WNBA Headshot Lookup</h1>
  <div class="subtitle">Find ESPN player IDs & headshot URLs by name</div>

  <button class="load-roster-btn" id="loadRosterBtn" onclick="loadRoster()">Load WNBA Roster</button>
  <div class="status" id="rosterStatus"></div>

  <div class="input-group">
    <input type="text" id="playerName" placeholder="Enter player name (e.g., A'ja Wilson)" />
    <button onclick="searchPlayer()">Search</button>
  </div>
  <div class="status" id="status"></div>

  <div class="results" id="results"></div>
  <div class="roster-stats" id="rosterStats" style="display:none;"></div>
</div>

<script>
let rosterCache = null;

async function loadRoster() {
  const btn = document.getElementById('loadRosterBtn');
  const status = document.getElementById('rosterStatus');
  
  btn.disabled = true;
  status.textContent = 'Loading roster…';
  status.className = 'status loading';
  
  try {
    const resp = await fetch('https://site.api.espn.com/apis/site/v2/sports/basketball/wnba/teams');
    const data = await resp.json();
    
    rosterCache = [];
    for (const team of (data.teams || [])) {
      const squad = team.squad || [];
      for (const athlete of squad) {
        const pid = athlete.id || athlete.athlete?.id;
        const displayName = athlete.displayName || athlete.athlete?.displayName;
        const teamName = team.name || team.displayName;
        
        if (pid && displayName) {
          rosterCache.push({
            id: pid,
            name: displayName,
            team: teamName,
            headshotUrl: `https://a.espncdn.com/i/headshots/wnba/players/full/${pid}.png`
          });
        }
      }
    }
    
    status.textContent = `✓ Loaded ${rosterCache.length} players`;
    status.className = 'status success';
    btn.disabled = false;
    
    const statsEl = document.getElementById('rosterStats');
    statsEl.innerHTML = `<div><strong>Roster loaded:</strong> ${rosterCache.length} players</div>`;
    statsEl.style.display = 'block';
    
  } catch (err) {
    console.error(err);
    status.textContent = `Error: ${err.message}`;
    status.className = 'status error';
    btn.disabled = false;
  }
}

function searchPlayer() {
  const query = document.getElementById('playerName').value.trim().toLowerCase();
  const status = document.getElementById('status');
  const results = document.getElementById('results');
  
  if (!query) {
    status.textContent = 'Enter a player name';
    status.className = 'status error';
    return;
  }
  
  if (!rosterCache) {
    status.textContent = 'Load roster first';
    status.className = 'status error';
    return;
  }
  
  const matches = rosterCache.filter(p => 
    p.name.toLowerCase().includes(query)
  );
  
  if (!matches.length) {
    status.textContent = `No matches for "${query}"`;
    status.className = 'status error';
    results.innerHTML = '';
    return;
  }
  
  status.textContent = `Found ${matches.length} match${matches.length > 1 ? 'es' : ''}`;
  status.className = 'status success';
  
  results.innerHTML = matches.map((p, i) => `
    <div class="result-card">
      <div class="result-header">${p.team}</div>
      <div class="player-row">
        <img src="${p.headshotUrl}" alt="${p.name}" class="headshot" onerror="this.style.opacity=0.3">
        <div class="player-info">
          <div class="player-name">${p.name}</div>
          <div class="player-details">ID: <code>${p.id}</code></div>
          <div class="url-box" onclick="copyToClipboard('${p.headshotUrl}')">${p.headshotUrl}</div>
          <button class="copy-btn" onclick="copyToClipboard('${p.headshotUrl}')">Copy URL</button>
          <br>
          <button class="copy-btn" onclick="copyToClipboard('${p.id}')" style="margin-top:4px;">Copy ID</button>
        </div>
      </div>
    </div>
  `).join('');
}

function copyToClipboard(text) {
  navigator.clipboard.writeText(text).then(() => {
    alert('Copied!');
  }).catch(err => {
    console.error(err);
  });
}

document.getElementById('playerName').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') searchPlayer();
});
</script>
</body>
</html>
