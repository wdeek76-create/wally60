<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DIMERS SOLO</title>
<style>
:root{--bg:#07080b;--card:#0e1014;--line:#1c2027;--tx:#e8edf3;--mut:#a8b0bb;--ac:#eab308;--g:#4ade80;--r:#f87171;--o:#fb923c;--u:#38bdf8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 -apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:14px 16px 60px}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}

label.filebtn{background:var(--ac);color:#111;border:1px solid var(--ac);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:700;cursor:pointer;display:inline-block}
button.pri{background:var(--ac);color:#111;border-color:var(--ac)}button.del{color:var(--r);border-color:#f8717155;background:transparent}
button.chip{padding:5px 11px;font-size:12px}button.chip.on{background:#2a2410;border-color:var(--ac);color:var(--ac)}
.info{font-size:12px;color:var(--mut);margin-top:8px;min-height:16px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.tile span{font-size:18px;font-weight:800}.tile i{display:block;font-style:normal;font-size:12px;margin-top:2px}
table{border-collapse:collapse;width:100%;font-size:13px}th{font-size:10px;letter-spacing:.6px;text-transform:uppercase;color:var(--mut);padding:6px 6px;text-align:center}
td{padding:7px 6px;border-top:1px solid var(--line);text-align:center;white-space:nowrap}td:first-child,th:first-child{text-align:left;font-weight:800}
.g{color:var(--g)}.r{color:var(--r)}.o{color:var(--o)}.u{color:var(--u)}.m{color:var(--mut)}
h2{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--mut);margin:0 0 8px}

</style></head><body>
<div class="wrap">
<h1>DIMERS SOLO</h1>
<div class="sub">Export the Dimers projections to PropShop, paste the board here. Every line at the edge you pick is logged 1u flat, graded later, and split over vs under.</div>
<div class="card">
  <h2>1 · Dimers CSV → PropShop file</h2>
  <div class="row" style="margin-top:0"><label class="filebtn"><input type="file" id="csvfile" accept=".csv,text/csv" onchange="importCsv(this)" hidden>IMPORT DIMERS CSV</label><span class="m" style="font-size:12px">Saves a PropShop-ready CSV to upload there.</span></div>
</div>
<div class="card">
  <h2>2 · Paste the PropShop board</h2>
  <textarea id="paste" placeholder="Paste the PropShop board (one market per paste)"></textarea>
  <div class="row">
    <select id="stat"><option value="AUTO">Auto-detect market</option><option>PTS</option><option>REB</option><option>AST</option><option>3PM</option><option>PRA</option></select>
    <select id="minev"><option value="0">Edge 0%+</option><option value="1" selected>Edge 1%+</option><option value="3">Edge 3%+</option><option value="5">Edge 5%+</option></select>
    <button class="pri" onclick="importBoard()">IMPORT</button>
    <button onclick="gradeAll()" id="gbtn">GRADE PENDING</button>
  </div>
  <div class="row"><button onclick="copyOpen()">COPY OPEN BETS</button><button onclick="copyReport()">COPY REPORT</button><button onclick="exportCsv()">EXPORT CSV</button><button class="del" onclick="clearAll()">CLEAR ALL</button></div>
  <div class="info" id="info"></div>
</div>
<div id="out"></div>
</div>
<div id="copy-toast"></div>
<script>
const SOURCES = [];
let slots = SOURCES.map(() => null);
let merged = null;
function localYMD(d) {
  const x = (d instanceof Date) ? d : new Date(d);
  if (isNaN(x.getTime())) return "";
  return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, "0")}-${String(x.getDate()).padStart(2, "0")}`;
}
// A bet's day as local YYYY-MM-DD. Returns "" when the bet carries no usable
// date — those are treated as stale and excluded from live displays.
function norm(s) {
  if (!s) return "";
  return s.toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/\b(jr|sr|ii|iii|iv)\b/g,"")
    .replace(/[^a-z]/g,"");
}

// looseName: lighter touch than norm() — used for SEARCH-AS-YOU-TYPE filtering only.
// Lowercases, strips diacritics, and drops punctuation that users typically skip
// (apostrophes, hyphens, periods, accents), but KEEPS spaces so substring matching
// stays meaningful — typing "br syk" still works, but "flaujae" matches "Flau'jae"
// and "salaun" matches "Salaün". Not used for cross-source name resolution; that's
// what norm() + the alias map handle.
function looseName(s) {
  if (!s) return "";
  return s.toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/['’`\-\.]/g,"")
    .replace(/\s+/g," ")
    .trim();
}

// Maps each variant's normalized form (lowercase, alphanumeric only, no suffixes/accents)
// to the canonical form used by RG/RW. Add new aliases as you discover mismatches.
// Lefthand side = what the source calls them; righthand side = canonical (RG/RW) name.
const NAME_ALIASES = {
  // Nickname vs. legal first name — RG/RW use the name the player goes by
  "carltoncarrington":   "bubcarrington",      // Carlton Carrington -> Bub Carrington
  "nahshonhyland":       "boneshyland",        // Nah'Shon Hyland -> Bones Hyland
  "herbertjones":        "herbjones",          // Herbert Jones -> Herb Jones
  "nicolasclaxton":      "nicclaxton",         // Nicolas Claxton -> Nic Claxton
  "moritzwagner":        "moewagner",          // Moritz Wagner -> Moe Wagner
  "kenyonmartin":        "kjmartin",           // Kenyon Martin Jr. -> KJ Martin
  "gregoryjackson":      "ggjackson",          // Gregory Jackson II -> GG Jackson
  "cameronthomas":       "camthomas",          // Cameron Thomas -> Cam Thomas
  "ronaldholland":       "ronholland",         // Ronald Holland II -> Ron Holland
  "sviatoslavmykhailiuk":"svimykhailiuk",      // Sviatoslav Mykhailiuk -> Svi Mykhailiuk
  // Spelling variants across feeds
  "dennisschroeder":     "dennisschroder",     // Schröder / Schroeder -> Schroder
  "alexandresarr":       "alexsarr",           // Alexandre Sarr -> Alex Sarr
  "ludort":              "luguentzdort",       // Lu Dort (RG / RW) -> Luguentz Dort (Unabated, Tabs)
  "hansenyang":          "yanghansen",         // Hansen Yang (RG) -> Yang Hansen (Unabated)
};

function resolveNorm(n) {
  const normalized = norm(n);
  return NAME_ALIASES[normalized] || normalized;
}

// Preferred display name, keyed by the merged (canonical) key. The merge key
// stays whatever the majority of sources use; this only changes what's shown.
function showToast(msg) {
  const t = document.getElementById("copy-toast");
  t.textContent = msg;
  t.style.opacity = 1;
  setTimeout(() => { t.style.opacity = 0; }, 1400);
}

// ── TRACKER ────────────────────────────────────────────────────────────────

function oddsToDecimal(odds) {
  if (!odds || isNaN(odds)) return null;
  odds = Number(odds);
  return odds < 0 ? 1+(100/Math.abs(odds)) : 1+(odds/100);
}

const STARTER_LOG_KEY = "nba_starter_log_v1";
function getStarterLog() {
  try { return JSON.parse(localStorage.getItem(STARTER_LOG_KEY) || "{}"); } catch (e) { return {}; }
}
function _saveStarterLog(log) {
  try { localStorage.setItem(STARTER_LOG_KEY, JSON.stringify(log)); } catch (e) {}
}
// Record one date's rows. Keyed by player then date, so re-grading a day
// overwrites rather than double-counting.
function recordStarterRows(isoDate, rows) {
  if (!isoDate || !Array.isArray(rows) || !rows.length) return;
  const log = getStarterLog();
  rows.forEach(r => {
    if (!r || !r.playerNorm || r.dnp) return;      // DNPs aren't a bench decision
    if (!log[r.playerNorm]) log[r.playerNorm] = { name: r.displayName, games: {} };
    log[r.playerNorm].name = r.displayName || log[r.playerNorm].name;
    log[r.playerNorm].games[isoDate] = r.starter === true ? 1 : 0;
  });
  _saveStarterLog(log);
}
// { starts, games, pct, recent } or null when we've never logged this player.
const _espnCache = {}; // key: ISO date, value: array of {playerNorm, displayName, completed, stats}
const _espnGameCountCache = {}; // key: ISO date, value: {total, completed, statuses, games}

async function fetchESPNStatsForDate(isoDate) {
  if (_espnCache[isoDate]) return { rows: _espnCache[isoDate], meta: _espnGameCountCache[isoDate] };
  const yyyymmdd = isoDate.replace(/-/g, "");
  const sbUrl = `https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard?dates=${yyyymmdd}`;
  let scoreboard;
  try {
    const res = await fetch(sbUrl);
    if (!res.ok) throw new Error(`ESPN scoreboard ${res.status}`);
    scoreboard = await res.json();
  } catch (e) { throw new Error("ESPN scoreboard error: " + e.message); }

  const events = scoreboard.events || [];
  const meta = { total: events.length, completed: 0, statuses: [], games: [] };
  const allRows = [];
  for (const ev of events) {
    const completed = ev.status?.type?.completed === true;
    const statusName = ev.status?.type?.shortDetail || ev.status?.type?.name || "Unknown";
    meta.statuses.push(statusName);
    // Capture team abbrs and final scores for game-level grading (totals/spreads/ML)
    const comp = ev.competitions?.[0];
    const home = comp?.competitors?.find(c => c.homeAway === "home");
    const away = comp?.competitors?.find(c => c.homeAway === "away");
    meta.games.push({
      eventId: ev.id,
      completed,
      status: statusName,
      awayAbbr: normTeamAbbr(away?.team?.abbreviation),
      homeAbbr: normTeamAbbr(home?.team?.abbreviation),
      awayScore: parseInt(away?.score) || null,
      homeScore: parseInt(home?.score) || null,
    });
    if (!completed) continue;
    meta.completed++;
    let summary;
    try {
      const r = await fetch(`https://site.api.espn.com/apis/site/v2/sports/basketball/nba/summary?event=${ev.id}`);
      if (!r.ok) continue;
      summary = await r.json();
    } catch { continue; }

    const teamPlayerGroups = summary.boxscore?.players || [];
    for (const teamGroup of teamPlayerGroups) {
      const stats = teamGroup.statistics || [];
      for (const statGroup of stats) {
        const labels = (statGroup.labels || statGroup.keys || []).map(s => s.toString().toLowerCase());
        const idx = {
          min: labels.findIndex(l => l === "min"),
          pts: labels.findIndex(l => l === "pts"),
          reb: labels.findIndex(l => l === "reb"),
          ast: labels.findIndex(l => l === "ast"),
          tpt: labels.findIndex(l => l === "3pt" || l === "fg3" || l === "3p"),
          fg: labels.findIndex(l => l === "fg"),
          ft: labels.findIndex(l => l === "ft")
        };
        const athletes = statGroup.athletes || [];
        for (const a of athletes) {
          const player = a.athlete || {};
          const fullName = player.displayName || `${player.firstName||""} ${player.lastName||""}`.trim();
          if (!fullName) continue;
          const stRow = a.stats || [];
          const parseInt0 = (s) => { const n = parseInt(s); return isNaN(n) ? 0 : n; };

          // DNP — ONLY trust ESPN's explicit didNotPlay flag. We deliberately ignore
          // a.active (which can be false for benign reasons) and any heuristic based on
          // parsed minutes (label-format variance reads played players as 0 min).
          // If didNotPlay isn't set, treat the player as played and grade the real stat.
          const dnp = a.didNotPlay === true;

          // Parse minutes if the column was found. Handle "MM:SS" format ("12:34" → 12).
          let minVal = 0;
          if (idx.min >= 0) {
            const raw = String(stRow[idx.min] ?? "").trim();
            if (raw && raw !== "-" && raw !== "--" && raw !== "DNP") {
              const colon = raw.split(":");
              minVal = parseInt(colon[0]) || 0;
            }
          }

          // ESPN gives FG and 3PT as "made-attempted", e.g. "3-7".
          const _split = (raw) => {
            const mm = String(raw || "").match(/^(\d+)\s*-\s*(\d+)$/);
            return mm ? { m: parseInt(mm[1]), a: parseInt(mm[2]) } : null;
          };
          let fg3m = 0, fg3a = null, fgm = null, fga = null;
          if (idx.tpt >= 0 && stRow[idx.tpt]) {
            const s3 = _split(stRow[idx.tpt]);
            if (s3) { fg3m = s3.m; fg3a = s3.a; }
            else { const m = String(stRow[idx.tpt]).match(/^(\d+)/); if (m) fg3m = parseInt(m[1]); }
          }
          if (idx.fg >= 0 && stRow[idx.fg]) {
            const sf = _split(stRow[idx.fg]);
            if (sf) { fgm = sf.m; fga = sf.a; }
          }
          let ftm = null, fta = null;
          if (idx.ft >= 0 && stRow[idx.ft]) {
            const sft = _split(stRow[idx.ft]);
            if (sft) { ftm = sft.m; fta = sft.a; }
          }
          allRows.push({
            playerNorm: norm(fullName),
            displayName: fullName,
            dnp,
            starter: a.starter === true,
            stats: {
              min: dnp ? 0 : minVal,
              pts: idx.pts >= 0 ? parseInt0(stRow[idx.pts]) : 0,
              reb: idx.reb >= 0 ? parseInt0(stRow[idx.reb]) : 0,
              ast: idx.ast >= 0 ? parseInt0(stRow[idx.ast]) : 0,
              fg3m: fg3m,
              fg3a: fg3a,
              fgm: fgm,
              fga: fga,
              ftm: ftm,
              fta: fta,
            }
          });
        }
      }
    }
  }
  _espnCache[isoDate] = allRows;
  // Build the starter history as box scores come in — no extra fetch needed.
  try { recordStarterRows(isoDate, allRows); } catch (e) {}
  _espnGameCountCache[isoDate] = meta;
  return { rows: allRows, meta };
}

function getStatValueForESPN(row, statKey) {
  const s = row.stats || {};
  const pts = s.pts || 0, reb = s.reb || 0, ast = s.ast || 0, fg3m = s.fg3m || 0;
  switch ((statKey||"").toUpperCase()) {
    case "PTS": return pts;
    case "REB": return reb;
    case "AST": return ast;
    case "3PM": return fg3m;
    case "PRA": return pts + reb + ast;
    case "PR":  return pts + reb;
    case "PA":  return pts + ast;
    case "RA":  return reb + ast;
    case "MIN": return s.min || 0;
    default: return null;
  }
}

function getBetISODate(b) {
  if (b.gameDate) return b.gameDate;
  if (!b.date) return null;
  const parts = b.date.split("/");
  if (parts.length !== 3) return null;
  const [m, d, y] = parts.map(x => parseInt(x));
  if (!m || !d || !y) return null;
  return `${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
}

// ── SEASON LOG FETCHER (SLICE 1) ───────────────────────────────────────────
// Pulls historical NBA box scores from ESPN for the current season and stores
// them locally. The existing fetchESPNStatsForDate strips team context (it
// only needs player+stat for grading), so this is a parallel fetcher that
// keeps team/opponent/home info per row. That unlocks: custom-line trend
// queries, opponent splits, home/away splits, rest-day analysis, and ground
// truth backtests of trend-disagreement strategies.

async function gradeBet(b) {
  const iso = getBetISODate(b);
  if (!iso) return { ok: false, reason: "No date on bet" };
  let rows, meta;
  try {
    const result = await fetchESPNStatsForDate(iso);
    rows = result.rows;
    meta = result.meta;
  } catch (e) { return { ok: false, reason: "ESPN error: " + e.message }; }

  // GAME TOTAL grading branch — uses team scores, not player stats
  if ((b.stat||"").toUpperCase() === "GAME_TOTAL") {
    if (!meta || !meta.games || !meta.games.length) {
      return { ok: false, reason: `No NBA games scheduled on ${iso}` };
    }
    // b.player is "AWAY @ HOME" label; b.team should be "AWAY/HOME"
    let awayAbbr = null, homeAbbr = null;
    if (b.team && b.team.includes("/")) {
      [awayAbbr, homeAbbr] = b.team.split("/").map(s => normTeamAbbr(s.trim()));
    } else if (b.player && b.player.includes("@")) {
      const parts = b.player.split("@").map(s => s.trim());
      awayAbbr = normTeamAbbr(parts[0]);
      homeAbbr = normTeamAbbr(parts[1]);
    }
    if (!awayAbbr || !homeAbbr) return { ok: false, reason: "Could not parse matchup from bet" };
    const game = meta.games.find(g => normTeamAbbr(g.awayAbbr) === awayAbbr && normTeamAbbr(g.homeAbbr) === homeAbbr);
    if (!game) return { ok: false, reason: `${awayAbbr} @ ${homeAbbr} not in ESPN games for ${iso}` };
    if (!game.completed) return { ok: false, reason: `${awayAbbr} @ ${homeAbbr} not final yet (${game.status})` };
    if (game.awayScore == null || game.homeScore == null) return { ok: false, reason: "ESPN final scores not available yet" };
    const total = game.awayScore + game.homeScore;
    const line = b.line, ou = b.ou;
    let result;
    if (Math.abs(total - line) < 0.001) result = "void";
    else if (ou === "over") result = total > line ? "hit" : "miss";
    else result = total < line ? "hit" : "miss";
    return { ok: true, result, total };
  }

  // GAME SPREAD grading branch
  if ((b.stat||"").toUpperCase() === "GAME_SPREAD") {
    if (!meta || !meta.games || !meta.games.length) {
      return { ok: false, reason: `No NBA games scheduled on ${iso}` };
    }
    let awayAbbr = null, homeAbbr = null;
    if (b.team && b.team.includes("/")) {
      [awayAbbr, homeAbbr] = b.team.split("/").map(s => normTeamAbbr(s.trim()));
    } else if (b.player && b.player.includes("@")) {
      const parts = b.player.split("@").map(s => s.trim());
      awayAbbr = normTeamAbbr(parts[0]);
      homeAbbr = normTeamAbbr(parts[1]);
    }
    if (!awayAbbr || !homeAbbr) return { ok: false, reason: "Could not parse matchup from spread bet" };
    const game = meta.games.find(g => normTeamAbbr(g.awayAbbr) === awayAbbr && normTeamAbbr(g.homeAbbr) === homeAbbr);
    if (!game) return { ok: false, reason: `${awayAbbr} @ ${homeAbbr} not in ESPN games for ${iso}` };
    if (!game.completed) return { ok: false, reason: `${awayAbbr} @ ${homeAbbr} not final yet (${game.status})` };
    if (game.awayScore == null || game.homeScore == null) return { ok: false, reason: "ESPN final scores not available yet" };
    // Determine pick team's margin
    const pickNorm = normTeamAbbr(b.pickTeam || "");
    const isAway = pickNorm === normTeamAbbr(awayAbbr);
    const pickScore = isAway ? game.awayScore : game.homeScore;
    const oppScore  = isAway ? game.homeScore : game.awayScore;
    const margin = pickScore - oppScore; // positive = pick team won outright
    const line = parseFloat(b.line);
    const covered = margin + line; // e.g. pick +5.5 wins if margin > -5.5
    let result;
    if (Math.abs(covered) < 0.001) result = "void";
    else result = covered > 0 ? "hit" : "miss";
    return { ok: true, result, total: margin, awayScore: game.awayScore, homeScore: game.homeScore, awayAbbr, homeAbbr, coverMargin: covered };
  }
  if (!rows || !rows.length) {
    if (!meta || meta.total === 0) {
      return { ok: false, reason: `No NBA games scheduled on ${iso}` };
    }
    if (meta.completed === 0) {
      return { ok: false, reason: `Games not final yet (${meta.statuses.join(", ")})` };
    }
    return { ok: false, reason: `${meta.completed} game(s) final but ESPN box score not loaded yet` };
  }

  const playerNorm = norm(b.player);
  const matches = rows.filter(r => r.playerNorm === playerNorm);

  if (!matches.length) {
    // Player name didn't match any row in the box score. Could be:
    //   (a) actual DNP / inactive (player not dressed),
    //   (b) diacritic / abbreviation mismatch (e.g. "C. Leite" vs "Carla Leite"),
    //   (c) ESPN feed glitch.
    // We DO NOT silently void here — that was over-aggressive and grading played
    // players as void. Always surface as an error so the user can verify and
    // manually mark HIT/MISS/VOID. The grader will not change the bet's state.
    if (meta && meta.completed > 0 && meta.completed === meta.total) {
      return { ok: false, reason: `${b.player} not found in box score (verify DNP — manual grade required)` };
    }
    if (meta && meta.completed > 0) {
      return { ok: false, reason: `${b.player}: game may not be final yet` };
    }
    return { ok: false, reason: `${b.player} not in ESPN box scores for ${iso} (verify DNP — manual grade required)` };
  }

  // DNP guard: only trust ESPN's explicit didNotPlay flag. Parsed minutes can be 0
  // for benign reasons (label format variance) so we don't void off that signal alone.
  // If every matching row is explicitly flagged DNP, the player didn't play → VOID.
  const allDnp = matches.every(m => m.dnp);
  if (allDnp) {
    return { ok: true, result: "void", total: 0, dnp: true };
  }

  // Sum across all matches that actually played (rare: multi-game days)
  let total = 0;
  matches.filter(m => !m.dnp).forEach(m => { total += getStatValueForESPN(m, b.stat); });
  // Actual minutes played — used to grade which SOURCE's pre-game minutes
  // projection was closest (see Source Analytics minutes-accuracy block).
  let actualMin = null;
  const playedMatches = matches.filter(m => !m.dnp);
  if (playedMatches.length) {
    actualMin = playedMatches.reduce((sum, m) => sum + (m.stats?.min || 0), 0);
  }

  const line = b.line, ou = b.ou;
  let result;
  if (Math.abs(total - line) < 0.001) result = "void";
  else if (ou === "over") result = total > line ? "hit" : "miss";
  else result = total < line ? "hit" : "miss";
  // Compact supporting stat line for the recap ("3/7 FG", "12p 6r 5a").
  let statLine = null;
  if (playedMatches.length) {
    const sum = (f) => playedMatches.reduce((s, m) => s + (Number(m.stats?.[f]) || 0), 0);
    const has = (f) => playedMatches.some(m => m.stats?.[f] != null);
    statLine = {
      pts: sum("pts"), reb: sum("reb"), ast: sum("ast"), min: sum("min"),
      fg3m: sum("fg3m"),
      fg3a: has("fg3a") ? sum("fg3a") : null,
      fgm: has("fgm") ? sum("fgm") : null,
      fga: has("fga") ? sum("fga") : null,

  const tile = (lab, v, cls) => { const n = v.w + v.l; return `<div class="tile"><b>${lab}</b><span class="${cls || ""}">${v.w}-${v.l}</span><i class="${v.pl >= 0 ? "g" : "r"}">${n ? (v.w / n * 100).toFixed(0) + "% · " + fmtU(v.pl) : "—"}</i></div>`; };
  const chips = ["ALL"].concat(STATS).map(s => `<button class="chip ${fStat === s ? "on" : ""}" onclick="setStat('${s}')">${s}</button>`).join(" ");
  const days = [...new Set(set.map(x => x.gameDate))].sort().reverse();
  const recent = set.slice().sort((a, b) => (b.gameDate + b.player).localeCompare(a.gameDate + a.player)).slice(0, 60);
  const resCls = r => r === "hit" ? "g" : r === "miss" ? "r" : "m";
  document.getElementById("out").innerHTML = `
  <div class="card"><div class="row" style="margin:0 0 10px">${chips}</div>
    <div class="tiles">${tile("All", t.a)}${tile("Over", t.o, "o")}${tile("Under", t.u, "u")}</div>
    <div class="info">${set.length} lines · ${open} open</div></div>
  <div class="card"><h2>By market</h2>${tbl("Market", STATS.map(s => ({ label: s, set: set.filter(x => x.stat === s) })).filter(l => l.set.length).concat([{ label: "All", set, total: true }]))}</div>
  <div class="card"><h2>By edge</h2>${tbl("Edge", BUCKETS.map(([label, lo, hi]) => ({ label, set: set.filter(x => x.ev >= lo && x.ev < hi) })).concat([{ label: "All", set, total: true }]))}</div>
  <div class="card"><h2>By day</h2>${days.length ? tbl("Day", days.map(d => ({ label: d.slice(5), set: set.filter(x => x.gameDate === d) }))) : '<div class="m">Nothing yet.</div>'}</div>
  <div class="card"><h2>Lines (latest ${recent.length})</h2><div class="scroll"><table><thead><tr>${th("Player")}${th("Pick")}${th("Odds")}${th("Edge")}${th("Result")}${th("")}</tr></thead><tbody>${recent.map(x => `<tr><td>${x.player}<br><span class="m" style="font-weight:400;font-size:11px">${x.stat} · ${x.gameDate.slice(5)}</span></td><td class="${x.ou === "over" ? "o" : "u"}">${x.ou === "over" ? "O" : "U"} ${x.line}</td><td>${x.odds > 0 ? "+" : ""}${x.odds}</td><td>${x.ev.toFixed(1)}%</td><td class="${resCls(x.result)}">${x.result === "pending" ? "—" : x.result.toUpperCase() + (x.actual != null ? ` (${x.actual})` : "")}</td><td><button class="chip del" onclick="del('${x.key.replace(/'/g, "\\'")}')">×</button></td></tr>`).join("")}</tbody></table></div></div>`;
}
function reportText() {
  const set = view(), t = tally(set), L = [];
  const f = (lab, v) => { const n = v.w + v.l; return `${lab} ${v.w}-${v.l}${n ? ` ${(v.w / n * 100).toFixed(0)}% ${fmtU(v.pl)}` : ""}`; };
  L.push(`DIMERS SOLO${fStat === "ALL" ? "" : " · " + fStat}`, f("All  ", t.a), f("Over ", t.o), f("Under", t.u), "");
  STATS.forEach(s => { const x = tally(set.filter(r => r.stat === s)); if (x.a.w + x.a.l) L.push(`${s}: ${f("", x.a)}`, `  O ${x.o.w}-${x.o.l} ${fmtU(x.o.pl)} · U ${x.u.w}-${x.u.l} ${fmtU(x.u.pl)}`); });
  L.push(""); BUCKETS.forEach(([lab, lo, hi]) => { const x = tally(set.filter(r => r.ev >= lo && r.ev < hi)); if (x.a.w + x.a.l) L.push(`${lab}: ${f("", x.a)}`, `  O ${x.o.w}-${x.o.l} ${fmtU(x.o.pl)} · U ${x.u.w}-${x.u.l} ${fmtU(x.u.pl)}`); });
  return L.join("\n");
}
function openText() {
  const open = view().filter(x => x.result === "pending"); if (!open.length) return "";
  const L = [`DIMERS OPEN · ${open.length}`]; const nm = n => n;
  [...new Set(open.map(x => x.gameDate))].sort().forEach(d => {
    L.push("", d.slice(5));
    STATS.forEach(s => { const set = open.filter(x => x.gameDate === d && x.stat === s).sort((a, b) => b.ev - a.ev); if (!set.length) return; L.push(s); set.forEach(x => L.push(`${nm(x.player)} ${x.ou === "over" ? "O" : "U"} ${x.line} ${x.odds > 0 ? "+" : ""}${x.odds} ${x.ev.toFixed(1)}%`)); });
  });
  return L.join("\n");
}
function copyOpen() { const t = openText(); if (!t) { toast("No open bets"); return; } (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast(`Copied ${t.split("\n").filter(l => / [OU] /.test(l)).length} open bets`), () => { prompt("Copy:", t); }); }
function copyReport() { const t = reportText(); (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast("Report copied"), () => { prompt("Copy:", t); }); }
function exportCsv() {
  const cols = ["gameDate", "player", "stat", "ou", "line", "odds", "book", "ev", "proj", "result", "actual"];
  const csv = [cols.join(",")].concat(rows.map(r => cols.map(c => JSON.stringify(r[c] == null ? "" : r[c])).join(","))).join("\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" })); a.download = "dimers-solo.csv"; document.body.appendChild(a); a.click(); a.remove();
}
function clearAll() { if (!confirm(`Delete all ${rows.length} lines?`)) return; rows = []; save(); render(); }
// Dimers player_projections.csv -> the PropShop upload format (Player, Team, Minutes, Points, Rebounds, Assists, Three Pointers)
function csvRows(text) {
  const out = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true; else if (c === ",") { row.push(f); f = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(f); f = ""; if (row.some(x => x !== "")) out.push(row); row = []; }
    else f += c;
  }
  row.push(f); if (row.some(x => x !== "")) out.push(row); return out;
}
function importCsv(inp) {
  const file = inp.files && inp.files[0]; if (!file) return;
  file.text().then(text => {
    inp.value = "";
    const t = csvRows(text.replace(/^﻿/, "")), head = (t[0] || []).map(x => x.trim().toLowerCase()), ix = n => head.indexOf(n);
    const iF = ix("first name"), iL = ix("last name"), iT = ix("team"), iP = ix("pts"), iR = ix("reb"), iA = ix("ast"), i3 = ix("3pm"), iM = Math.max(ix("min"), ix("minutes"));
    if (iF < 0 || iL < 0 || iP < 0) { say("That doesn't look like the Dimers player_projections.csv."); return; }
    const esc = v => `"${String(v == null ? "" : v).replace(/"/g, '""')}"`, num = (r, i) => { const v = i >= 0 ? parseFloat(r[i]) : NaN; return !isNaN(v) && v > 0 ? v.toFixed(2) : ""; };
    const lines = ["Player,Team,Minutes,Points,Rebounds,Assists,Three Pointers"]; let n = 0;
    t.slice(1).forEach(r => { const name = ((r[iF] || "") + " " + (r[iL] || "")).trim(); if (!name || !num(r, iP)) return; lines.push([esc(name), esc(iT >= 0 ? r[iT] : ""), num(r, iM), num(r, iP), num(r, iR), num(r, iA), num(r, i3)].join(",")); n++; });
    const d = new Date(), ds = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["﻿" + lines.join("\n")], { type: "text/csv;charset=utf-8" })); a.download = `DimersPS${ds}.csv`; a.style.display = "none"; document.body.appendChild(a); a.click(); a.remove();
    window._lastPsCsv = lines.join("\n");
    say(`Saved DimersPS${ds}.csv · ${n} players (the Dimers file has no minutes). Upload it to PropShop, then paste the board below.`); toast(`PropShop file ready · ${n} players`);
  });
}
render();

</script>
