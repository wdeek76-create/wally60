<style>

</style></head><body>
<div class="wrap">
<h1>DIMERS SOLO</h1>
<div class="sub">Export the Dimers projections to PropShop, paste the board here. Every line at the edge you pick is logged 1u flat, graded later, and split over vs under.</div>
<div class="card">
  <h2>1 · Dimers CSV → PropShop file</h2>
  <div class="row" style="margin-top:0"><label class="filebtn"><input type="file" id="csvfile" accept=".csv,text/csv" onchange="importCsv(this)" hidden>IMPORT DIMERS CSV</label><span class="m" style="font-size:12px">Saves a PropShop-ready CSV to upload there.</span></div>
</div>

  <h2>2 · Paste the PropShop board</h2>

    <select id="stat"><option value="AUTO">Auto-detect market</option><option>PTS</option><option>REB</option><option>AST</option><option>3PM</option><option>PRA</option></select>
    <select id="minev"><option value="0">Edge 0%+</option><option value="1" selected>Edge 1%+</option><option value="3">Edge 3%+</option><option value="5">Edge 5%+</option></select>

    <button class="pri" onclick="importBoard()">IMPORT</button>
    <button onclick="gradeAll()" id="gbtn">GRADE PENDING</button><span class="m" style="font-size:11px">also grades itself</span>
  </div>
  <div class="row"><button onclick="copyOpen()">COPY OPEN BETS</button><button onclick="copyReport()">COPY REPORT</button><button onclick="exportCsv()">EXPORT CSV</button><button class="del" onclick="clearAll()">CLEAR ALL</button></div>
  <div class="info" id="info"></div>
</div>
<div id="out"></div>
</div>
<div id="copy-toast"></div>
<script>
const SOURCES = [];
const NBA_TEMPLATE = [];
let slots = SOURCES.map(() => null);
let merged = null;
let bets = [];
// Per-game projection source picker (blended / paceeff / both)
function localYMD(d) {
  const x = (d instanceof Date) ? d : new Date(d);
  if (isNaN(x.getTime())) return "";
  return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, "0")}-${String(x.getDate()).padStart(2, "0")}`;
}
// A bet's day as local YYYY-MM-DD. Returns "" when the bet carries no usable
// date — those are treated as stale and excluded from live displays.
function norm(s) {
  if (!s) return "";
  return s.toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/\b(jr|sr|ii|iii|iv)\b/g,"")
    .replace(/[^a-z]/g,"");
}

// looseName: lighter touch than norm() — used for SEARCH-AS-YOU-TYPE filtering only.
// Lowercases, strips diacritics, and drops punctuation that users typically skip
// (apostrophes, hyphens, periods, accents), but KEEPS spaces so substring matching
// stays meaningful — typing "br syk" still works, but "flaujae" matches "Flau'jae"
// and "salaun" matches "Salaün". Not used for cross-source name resolution; that's
// what norm() + the alias map handle.
function looseName(s) {
  if (!s) return "";
  return s.toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/['’`\-\.]/g,"")
    .replace(/\s+/g," ")
    .trim();
}

// Maps each variant's normalized form (lowercase, alphanumeric only, no suffixes/accents)
// to the canonical form used by RG/RW. Add new aliases as you discover mismatches.
// Lefthand side = what the source calls them; righthand side = canonical (RG/RW) name.
const NAME_ALIASES = {
  // Nickname vs. legal first name — RG/RW use the name the player goes by
  "carltoncarrington":   "bubcarrington",      // Carlton Carrington -> Bub Carrington
  "nahshonhyland":       "boneshyland",        // Nah'Shon Hyland -> Bones Hyland
  "herbertjones":        "herbjones",          // Herbert Jones -> Herb Jones
  "nicolasclaxton":      "nicclaxton",         // Nicolas Claxton -> Nic Claxton
  "moritzwagner":        "moewagner",          // Moritz Wagner -> Moe Wagner
  "kenyonmartin":        "kjmartin",           // Kenyon Martin Jr. -> KJ Martin
  "gregoryjackson":      "ggjackson",          // Gregory Jackson II -> GG Jackson
  "cameronthomas":       "camthomas",          // Cameron Thomas -> Cam Thomas
  "ronaldholland":       "ronholland",         // Ronald Holland II -> Ron Holland
  "sviatoslavmykhailiuk":"svimykhailiuk",      // Sviatoslav Mykhailiuk -> Svi Mykhailiuk
  // Spelling variants across feeds
  "dennisschroeder":     "dennisschroder",     // Schröder / Schroeder -> Schroder
  "alexandresarr":       "alexsarr",           // Alexandre Sarr -> Alex Sarr
  "ludort":              "luguentzdort",       // Lu Dort (RG / RW) -> Luguentz Dort (Unabated, Tabs)
  "hansenyang":          "yanghansen",         // Hansen Yang (RG) -> Yang Hansen (Unabated)
};

function resolveNorm(n) {
  const normalized = norm(n);
  return NAME_ALIASES[normalized] || normalized;
}

// Preferred display name, keyed by the merged (canonical) key. The merge key
// stays whatever the majority of sources use; this only changes what's shown.
function showToast(msg) {
  const t = document.getElementById("copy-toast");
  t.textContent = msg;
  t.style.opacity = 1;
  setTimeout(() => { t.style.opacity = 0; }, 1400);
}

// ── TRACKER ────────────────────────────────────────────────────────────────

const EVICTABLE_KEYS = [
  "nba_season_logs_v1",        // refetch from ESPN
  "nba_espn_cache",            // refetch
  "nba_headshot_cache_v1",     // refetch — base64 photos, can be huge
  "nba_trends_cache",          // recomputed from bets
  "nba_season_logs_v1_meta",
  "nba_oo_logos_v1",           // book logos, reloaded from OpticOdds
  "nba_rw_lineups_raw",        // raw lineup pastes (the parsed lineups are stored separately)
  "nba_tabs_lineups_raw",
  "nba_rw_news_feed_v1",       // RotoWire news, re-synced
];
function freeStorageSpace(neededBytes) {
  let freed = 0;
  for (const k of EVICTABLE_KEYS) {
    try {
      const v = localStorage.getItem(k);
      if (v == null) continue;
      freed += v.length;
      localStorage.removeItem(k);
      console.warn(`[storage] evicted ${k} (${Math.round(v.length / 1024)}kb) to make room for bets`);
      if (freed >= (neededBytes || 0)) break;
    } catch (e) {}
  }
  return freed;
}
// Warn before it becomes a problem, not after.
const _BULKY_KEYS = new Set(["liq", "liqLevels", "liqBooks", "ooBooks", "keyOff"]);
function _slimGraded(k, v) { return (_BULKY_KEYS.has(k) && this && this.result && this.result !== "pending") ? undefined : v; }
function saveBets() {
  const json = JSON.stringify(bets, _slimGraded);
  try {
    localStorage.setItem("nba_blender_bets", json);
    return true;
  } catch (e) {
    // Out of room. Bets outrank every cache here, so evict the refetchable
    // ones and try again rather than losing the bet.
    console.warn("[storage] bet save failed, evicting caches and retrying");
    freeStorageSpace(json.length * 2);
    try {
      localStorage.setItem("nba_blender_bets", json);
      try {
        if (typeof showToast === "function") showToast("Storage was full \u2014 cleared splits cache to save your bets");
      } catch (e3) {}
      return true;
    } catch (e2) {
      // Still failing after eviction — this is genuinely bad, make it loud.
      console.error("SAVE FAILED after eviction — bets are in memory only:", e2);
      try {
        if (typeof showToast === "function") {
          showToast("\u26a0 SAVE FAILED \u2014 EXPORT YOUR BETS NOW");
        }
        if (typeof alert === "function") {
          alert("Storage is full and your bets could NOT be saved.\n\nThey are still in memory. Export them now, before reloading the page.");
        }
      } catch (e3) {}
      return false;
    }
  }
}

function oddsToImplied(odds) {
  if (!odds || isNaN(odds)) return null;
  odds = Number(odds);
  return odds < 0 ? Math.abs(odds)/(Math.abs(odds)+100) : 100/(odds+100);
}

function oddsToDecimal(odds) {
  if (!odds || isNaN(odds)) return null;
  odds = Number(odds);
  return odds < 0 ? 1+(100/Math.abs(odds)) : 1+(odds/100);
}

function calcEdge(bookOdds, fairOdds) {
  // Morning bets store fair as a win probability in percent (0-100); American odds are never inside (-100,100)
  const f = Number(fairOdds);
  const fp = (f > 0 && f < 100) ? f / 100 : oddsToImplied(fairOdds), bd = oddsToDecimal(bookOdds);
  if (fp == null || bd == null) return null;
  return ((fp * bd) - 1) * 100;
}

function probToAmerican(p) {
  if (p == null || p <= 0 || p >= 1) return null;
  if (p >= 0.5) return Math.round(-100 * p / (1 - p));
  return Math.round(100 * (1 - p) / p);
}

const ALT_BOOKS_ORDER = ["FanDuel","Prop Builder","Novig","ProphetX","Kalshi","Fliff","DraftKings","Bookmaker","Pinnacle","Bet105","Kambi","Caesars","Hard Rock","theScore","BetMGM","bet365","Fanatics"];

// Per-book visibility — toggle via Settings (⚙) panel. Persisted to localStorage.
const PARLAY_MARKET_BY_STAT = {
  PTS: "player_points", REB: "player_rebounds", AST: "player_assists",
  "3PM": "player_threes", PRA: "player_pra", PR: "player_pts_rebs",
  PA: "player_pts_asts", RA: "player_rebs_asts",
  STL: "player_steals", BLK: "player_blocks", TOV: "player_turnovers"
};
// legacy bookmaker key -> book label (fallback for label resolution)
const BOOK_INFER_ORDER = ["Pinnacle", "Prop Builder", "FanDuel"];
const _isBlankBook = b => !b || /^[\s\-\u2013\u2014]*$/.test(String(b));
function inferBookFromAlts(odds, line, alts) {
  const same = (Array.isArray(alts) ? alts : []).filter(a => a && a.book && a.odds != null && Number(a.odds) === Number(odds) && (a.line == null || Number(a.line) === Number(line)));
  if (!same.length) return null;
  for (const b of BOOK_INFER_ORDER) { if (same.some(a => a.book === b)) return b; }
  const order = (typeof ALT_BOOKS_ORDER !== "undefined") ? ALT_BOOKS_ORDER : [];
  same.sort((a, b) => order.indexOf(a.book) - order.indexOf(b.book));
  return same[0].book;
}
// True if a and b differ by at most one single-character edit (insert, delete
// or substitute). Catches spelling variants across sources \u2014 "Sheppard" vs
// "Shepard", "Kuier" vs "Kuier" with a transposed/dropped letter \u2014 without
// being loose enough to merge two genuinely different surnames.
function _oneEditApart(a, b) {
  if (a === b) return true;
  const la = a.length, lb = b.length;
  if (Math.abs(la - lb) > 1 || la < 3 || lb < 3) return false;
  let i = 0, j = 0, edits = 0;
  while (i < la && j < lb) {
    if (a[i] === b[j]) { i++; j++; continue; }
    edits++;
    if (edits > 1) return false;
    if (la === lb) { i++; j++; }   // substitution
    else if (la > lb) { i++; }     // a has an extra char
    else { j++; }                  // b has an extra char
  }
  edits += (la - i) + (lb - j);
  return edits <= 1;
}
// Loose name match for feed rows: exact normalized first, then ONLY the first and last tokens are
// compared \u2014 any middle name/initial is dropped from the comparison entirely rather than needing
// to line up, since sources routinely include/omit it ("Awak Kuier" ~ "Awak Deng Kuier", "Jessica
// Sheppard" ~ "Jessica Lynn Shepard"). Both the surviving first and last tokens also tolerate a
// one-letter spelling variant ("Sheppard" ~ "Shepard"), but never both fuzzy at once.
function ooNameMatch(a, b) {
  // exact via the alias-aware normaliser first
  const x = resolveNorm(a || ""), y = resolveNorm(b || "");
  if (x && y && x === y) return true;
  // then word-level: strip accents/punctuation, handle "Last, First", compare tokens
  const toks = n => { let t = String(n || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase(); if (t.includes(",")) { const [l, f] = t.split(",").map(v => v.trim()); t = f + " " + l; } return t.replace(/[^a-z\s]/g, " ").split(/\s+/).filter(w => w && !/^(jr|sr|ii|iii|iv)$/.test(w)); };
  const xw = toks(a), yw = toks(b);
  if (xw.length < 2 || yw.length < 2) return false;
  const f1 = xw[0], f2 = yw[0], l1 = xw[xw.length - 1], l2 = yw[yw.length - 1];
  const firstOk = f1 === f2
    || (f1.length === 1 || f2.length === 1 ? f1[0] === f2[0] : _oneEditApart(f1, f2)); // initial vs full, or one-letter typo
  const lastOk = l1 === l2 || _oneEditApart(l1, l2);
  if (firstOk && lastOk && (f1 === f2 || l1 === l2)) return true; // require at least one exact side
  return false;
}
const OO_BACKEND_STORAGE = "nba_opticodds_backend";
const OO_BACKEND_DEFAULT = "https://nfl-props-tracker-1.vercel.app/api/odds";
function getOOBackend() { try { return localStorage.getItem(OO_BACKEND_STORAGE) || OO_BACKEND_DEFAULT; } catch (e) { return OO_BACKEND_DEFAULT; } }
async function ooCall(endpoint, params) {
  const res = await fetch(getOOBackend(), { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ endpoint, params: params || {} }) });
  const text = await res.text();
  if (!res.ok) { let msg = text; try { const j = JSON.parse(text); msg = j.error + (j.body ? " — " + j.body : ""); } catch (e) {} throw new Error(`backend ${res.status}: ${msg}`); }
  return JSON.parse(text);
}
// Books to request (OpticOdds names) -> this tool's book label. Unlabelled ones (Kalshi) feed Liq only.
// Requesting BOTH "Prop Builder" and "Props Builder" — OpticOdds may have renamed the
// book (plural), and a wrong name here just returns silently empty rather than an error,
// so there's no harm asking for both spellings; whichever OpticOdds actually recognizes
// comes back and both map to the same "Prop Builder" display label below.
const OO_BOOKS_REQUEST = ["FanDuel","Prop Builder","Props Builder","Novig","Prophet X","Fliff","DraftKings","BookMaker","Pinnacle","bet105","BetRivers","Kalshi","Caesars","Hard Rock","theScore Bet","BetMGM","bet365","Fanatics"];
const OO_BOOK_TO_LABEL = { "fanduel":"FanDuel", "prop builder":"Prop Builder", "propbuilder":"Prop Builder", "props builder":"Prop Builder", "propsbuilder":"Prop Builder", "novig":"Novig", "prophet x":"ProphetX", "fliff":"Fliff",
  "draftkings":"DraftKings", "courtside":"DraftKings", "onyx odds":"DraftKings", "bookmaker":"Bookmaker", "pinnacle":"Pinnacle",
  "bet105":"Bet105", "betrivers":"Kambi", "kambi":"Kambi", "kalshi":"Kalshi",
  "caesars":"Caesars", "caesars sportsbook":"Caesars", "hard rock":"Hard Rock", "hard rock bet":"Hard Rock", "hardrock":"Hard Rock", "hardrockbet":"Hard Rock",
  "thescore":"theScore", "thescore bet":"theScore", "the score":"theScore", "espn bet":"theScore", "espnbet":"theScore", "betmgm":"BetMGM", "bet mgm":"BetMGM", "bet365":"bet365", "fanatics":"Fanatics" };
const OO_EXCHANGES = ["novig","prophet x","kalshi"];
const _ooIsExchW = b => OO_EXCHANGES.includes(String(b || "").toLowerCase());
const _ooChunkW = (a, n) => { const o = []; for (let i = 0; i < a.length; i += n) o.push(a.slice(i, i + n)); return o; };
function ooPlayToFromFair(fair) {
  const fp = oddsToImplied(fair); if (!fp) return null;
  const dec = 1.05 / fp; const b = dec - 1;
  return b >= 1 ? "+" + Math.round(b * 100) : String(-Math.round(100 / b));
}
// OpticOdds market name -> Parlay-style key the fill/CLV code keys on. Period/exotic markets -> null.
function ooMarketKey(name) {
  const m = String(name || "").toLowerCase();
  if (/quarter|half|1st|2nd|3rd|4th|first|last|double|triple|basket|overtime|team|alternate/.test(m)) return null;
  const has = w => m.includes(w);
  const P = has("point"), R = has("rebound"), A = has("assist");
  if (has("three") || has("3-point") || has("3 point") || has("3pt") || has("3pm") || has("3-pt")) return "player_threes";
  if (has("turnover")) return "player_turnovers";
  if (has("steal") && !has("block")) return "player_steals";
  if (has("block") && !has("steal")) return "player_blocks";
  if (P && R && A) return "player_pra";
  if (P && R) return "player_pts_rebs";
  if (P && A) return "player_pts_asts";
  if (R && A) return "player_rebs_asts";
  if (P) return "player_points";
  if (R) return "player_rebounds";
  if (A) return "player_assists";
  return null;
}
let _ooFixW = { at: 0, list: [] };
async function ooNbaFixtures(force) {
  if (!force && _ooFixW.list.length && Date.now() - _ooFixW.at < 120000) return _ooFixW.list;
  const raw = []; let page = 1;
  for (let i = 0; i < 20; i++) {
    const r = await ooCall("/fixtures", { sport: "basketball", league: "nba", page });
    (r?.data || []).forEach(f => raw.push(f));
    if (!r?.has_more) break; page++;
  }
  const t0 = Date.now() - 2 * 86400000, t1 = Date.now() + 3 * 86400000;
  const list = raw.filter(f => { const t = new Date(f.start_date).getTime(); return t >= t0 && t <= t1; }).map(f => {
    const hc = f.home_competitors?.[0], ac = f.away_competitors?.[0];
    return { id: f.id, start: f.start_date, date: localYMD(new Date(f.start_date)), status: f.status,
      home: _matchupKey(hc?.name || f.home_team_display || ""), away: _matchupKey(ac?.name || f.away_team_display || ""),
      homeName: hc?.name || f.home_team_display || "", awayName: ac?.name || f.away_team_display || "" };
  });
  console.log("[OpticOdds] NBA fixtures in window:", list.map(f => `${f.away}@${f.home} ${f.date} ${f.status}`));
  _ooFixW = { at: Date.now(), list };
  return list;
}
// Exchange commission OpticOdds does not take off: ProphetX charges 2% of winnings, so its prices (top and every order-book level) are
// shown net of that fee. American in, American out.
const OO_BOOK_FEE = { prophetx: 0.02, "prophet x": 0.02 };
function _ooFeeAdj(am, fee) { const d = oddsToDecimal(am); if (!d || !fee) return am; const net = decimalToAmerican(1 + (d - 1) * (1 - fee)); return net == null ? am : net; }
// Odds rows -> Parlay-shaped rows (one per book+line, both sides), plus liq per side.
function ooRowsFromOdds(odds, fixtureId) {
  const g = {};
  odds.forEach(o => {
    const mk = ooMarketKey(o.market); if (!mk) return;
    const side = String(o.selection_line || "").toLowerCase(); if (side !== "over" && side !== "under") return;
    const bk = String(o.sportsbook || "").toLowerCase();
    const key = [mk, resolveNorm(o.selection || o.name || ""), o.points, bk].join("|");
    if (!g[key]) g[key] = { market_key: mk, market: o.market, player: o.selection || o.name, bookmaker: o.sportsbook, label: OO_BOOK_TO_LABEL[bk] || null,
      line: o.points, over_price: null, under_price: null, over_liq: null, under_liq: null, over_book: null, under_book: null, over_link: null, under_link: null, fixture_id: fixtureId, age_seconds: o.timestamp ? Math.round(Date.now() / 1000 - o.timestamp) : null };
    const row = g[key];
    let price = Number(o.price), ob = o.order_book;
    const fee = OO_BOOK_FEE[bk];
    if (fee && !isNaN(price)) {   // net of the exchange fee, order book included
      const raw = price; price = _ooFeeAdj(raw, fee);
      if (Array.isArray(ob) && ob.length) ob = _ooLevelsFromRow(raw, ob, o.limits && o.limits.max).map(l => [_ooFeeAdj(l.price, fee), l.size]);
    }
    // Keep the raw {ios, android, desktop} shape — resolveShareLink() (below) decides at copy
    // time whether to use a link straight (it's already https, a real universal link) or route
    // it through the /api/go redirector (it's a bare app scheme like novigapp:// with no https
    // equivalent — Discord won't render a masked link for that, it shows as broken literal text).
    const dl = o.deep_link && typeof o.deep_link === "object"

// Pulls historical NBA box scores from ESPN for the current season and stores

async function gradeBet(b) {
  const iso = getBetISODate(b);

    if (!meta || !meta.games || !meta.games.length) {
      return { ok: false, reason: `No NBA games scheduled on ${iso}` };
    }
    // b.player is "AWAY @ HOME" label; b.team should be "AWAY/HOME"
    let awayAbbr = null, homeAbbr = null;
    if (b.team && b.team.includes("/")) {
      [awayAbbr, homeAbbr] = b.team.split("/").map(s => normTeamAbbr(s.trim()));
    } else if (b.player && b.player.includes("@")) {
      const parts = b.player.split("@").map(s => s.trim());
      awayAbbr = normTeamAbbr(parts[0]);
      homeAbbr = normTeamAbbr(parts[1]);
    }
    if (!awayAbbr || !homeAbbr) return { ok: false, reason: "Could not parse matchup from bet" };
    const game = meta.games.find(g => normTeamAbbr(g.awayAbbr) === awayAbbr && normTeamAbbr(g.homeAbbr) === homeAbbr);
    if (!game) return { ok: false, reason: `${awayAbbr} @ ${homeAbbr} not in ESPN games for ${iso}` };
    if (!game.completed) return { ok: false, reason: `${awayAbbr} @ ${homeAbbr} not final yet (${game.status})` };
    if (game.awayScore == null || game.homeScore == null) return { ok: false, reason: "ESPN final scores not available yet" };
    const total = game.awayScore + game.homeScore;
    const line = b.line, ou = b.ou;
    let result;
    if (Math.abs(total - line) < 0.001) result = "void";
    else if (ou === "over") result = total > line ? "hit" : "miss";
    else result = total < line ? "hit" : "miss";
    return { ok: true, result, total };
  }

  // GAME SPREAD grading branch
  if ((b.stat||"").toUpperCase() === "GAME_SPREAD") {
    if (!meta || !meta.games || !meta.games.length) {
      return { ok: false, reason: `No NBA games scheduled on ${iso}` };
    }
    let awayAbbr = null, homeAbbr = null;
    if (b.team && b.team.includes("/")) {
      [awayAbbr, homeAbbr] = b.team.split("/").map(s => normTeamAbbr(s.trim()));
    } else if (b.player && b.player.includes("@")) {
      const parts = b.player.split("@").map(s => s.trim());
      awayAbbr = normTeamAbbr(parts[0]);
      homeAbbr = normTeamAbbr(parts[1]);
    }
    if (!awayAbbr || !homeAbbr) return { ok: false, reason: "Could not parse matchup from spread bet" };
    const game = meta.games.find(g => normTeamAbbr(g.awayAbbr) === awayAbbr && normTeamAbbr(g.homeAbbr) === homeAbbr);
    if (!game) return { ok: false, reason: `${awayAbbr} @ ${homeAbbr} not in ESPN games for ${iso}` };
    if (!game.completed) return { ok: false, reason: `${awayAbbr} @ ${homeAbbr} not final yet (${game.status})` };
    if (game.awayScore == null || game.homeScore == null) return { ok: false, reason: "ESPN final scores not available yet" };

    const pickNorm = normTeamAbbr(b.pickTeam || "");
    const isAway = pickNorm === normTeamAbbr(awayAbbr);

    const oppScore  = isAway ? game.homeScore : game.awayScore;
    const margin = pickScore - oppScore; // positive = pick team won outright
    const line = parseFloat(b.line);

    if (Math.abs(covered) < 0.001) result = "void";

      return { ok: false, reason: `Games not final yet (${meta.statuses.join(", ")})` };
    }
    return { ok: false, reason: `${meta.completed} game(s) final but ESPN box score not loaded yet` };
  }

  const matches = rows.filter(r => r.playerNorm === playerNorm);

  if (!matches.length) {

    //   (a) actual DNP / inactive (player not dressed),
    //   (b) diacritic / abbreviation mismatch (e.g. "C. Leite" vs "Carla Leite"),
    //   (c) ESPN feed glitch.

    // players as void. Always surface as an error so the user can verify and
    // manually mark HIT/MISS/VOID. The grader will not change the bet's state.
    if (meta && meta.completed > 0 && meta.completed === meta.total) {

      return { ok: false, reason: `${b.player}: game may not be final yet` };

  // for benign reasons (label format variance) so we don't void off that signal alone.
  // If every matching row is explicitly flagged DNP, the player didn't play → VOID.
  const allDnp = matches.every(m => m.dnp);

  // projection was closest (see Source Analytics minutes-accuracy block).

  let result;
  if (Math.abs(total - line) < 0.001) result = "void";

      fg3m: sum("fg3m"),
      fg3a: has("fg3a") ? sum("fg3a") : null,
      fgm: has("fgm") ? sum("fgm") : null,
      fga: has("fga") ? sum("fga") : null,
      ftm: has("ftm") ? sum("ftm") : null,
      fta: has("fta") ? sum("fta") : null,
    };
  }
  return { ok: true, result, total, actualMin, statLine };
}

  });
}
